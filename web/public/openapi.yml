openapi: 3.0.3
info:
  title: polispec web
  version: 0.35.0
  description: The JSON API of polispec web, served under /api/v1 on a loopback address. Every route except POST /session needs the ps_session cookie. Every mutating route also needs the X-Polispec-CSRF header, an Origin equal to the server, and is limited to 30 a minute per session.
servers:
  - url: http://127.0.0.1:7421/api/v1
tags:
  - name: session
  - name: config
  - name: read
  - name: write
  - name: state
paths:
  /session:
    post:
      tags: [session]
      operationId: exchangeCode
      summary: Exchange the one-time link code for a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The nonce.expiry.hmac value after #k= in the link printed by polispec web.
      responses:
        "200":
          description: The session cookie is set and the CSRF token is returned.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: ps_session, HttpOnly, SameSite=Strict, Path=/.
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    get:
      tags: [session]
      operationId: getSession
      summary: Recover the CSRF token of the current session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      tags: [session]
      operationId: endSession
      summary: End the current session
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The session is ended and the cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Version, edition, theme, operator and feature flags
      responses:
        "200":
          description: The server configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  "/lint":
    post:
      tags:
      - write
      operationId: lint
      summary: Validate a rulebook or a description and return findings with positions
      parameters:
      - &1
        "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - yaml
              properties:
                kind:
                  type: string
                yaml:
                  type: string
                id:
                  type: string
      responses:
        '200':
          description: The findings.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LintResult"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
  "/plans":
    post:
      tags:
      - write
      operationId: createPlan
      summary: Create a plan for a replace, compose, reorder, regroup, move or status
        change; a move returns two plans, destination first
      parameters:
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlanRequest"
      responses:
        '200':
          description: The plan, or the two plans of a move.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/Plan"
                - "$ref": "#/components/schemas/PlanSet"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/plans/{id}":
    get:
      tags:
      - write
      operationId: getPlan
      summary: A plan created earlier by this server
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Plan"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
  "/plans/{id}/apply":
    post:
      tags:
      - write
      operationId: applyPlan
      summary: Apply a plan through the same code as polispec apply; loosening, mixed,
        global, status, move, reorder, regroup and ledger plans need confirm equal to
        the plan id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                confirm:
                  type: string
      responses:
        '200':
          description: The applied change.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApplyResult"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/explain":
    post:
      tags:
      - write
      operationId: explain
      summary: Judge a tool call per environment, or replay a recorded judgment
      parameters:
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExplainRequest"
      responses:
        '200':
          description: The verdicts.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExplainResult"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
  "/explain-text":
    post:
      tags:
      - write
      operationId: explainText
      summary: Resolve a deny message or a judgment id to its rule
      parameters:
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                text:
                  type: string
                judgment_id:
                  type: string
      responses:
        '200':
          description: The rule, or the tokens tried.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExplainText"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
  "/blast-radius":
    post:
      tags:
      - write
      operationId: blastRadius
      summary: Replay recorded judgments against a draft
      parameters:
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target
              - change
              properties:
                target:
                  type: object
                  additionalProperties: true
                change:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: The flips per project.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blast"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
  "/register":
    post:
      tags:
      - write
      operationId: register
      summary: 'Register a path, system or software entry: a dry run previews it, otherwise
        the plan is returned and applied through /plans/{id}/apply'
      parameters:
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
                kind:
                  type: string
                id:
                  type: string
                description:
                  type: string
                starter:
                  type: object
                  additionalProperties: true
                dry_run:
                  type: boolean
      responses:
        '200':
          description: The dry run preview or the plan.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/RegisterDryRun"
                - "$ref": "#/components/schemas/Plan"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/exceptions":
    get:
      tags:
      - read
      operationId: listExceptions
      summary: The exceptions in force with their use
      responses:
        '200':
          description: The exceptions.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExceptionList"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
  "/exceptions/proposals":
    get:
      tags:
      - read
      operationId: listExceptionProposals
      summary: Exceptions the guard proposed
      responses:
        '200':
          description: The proposals.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExceptionProposals"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
  "/exceptions/{verb}":
    post:
      tags:
      - write
      operationId: runExceptionVerb
      summary: Relay add, promote or remove to the delegate runner under the polispec-web
        grant
      parameters:
      - name: verb
        in: path
        required: true
        schema:
          type: string
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - args
              properties:
                args:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The run id.
          content:
            application/json:
              schema:
                type: object
                required:
                - run_id
                properties:
                  run_id:
                    type: string
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/runs/{id}":
    get:
      tags:
      - write
      operationId: getRun
      summary: Output and state of a delegate run
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Run"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
  "/runs/{id}/phrase":
    post:
      tags:
      - write
      operationId: answerRun
      summary: Offer the typed phrase to a waiting run
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Whether the phrase was offered.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhraseResult"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/runs/{id}/cancel":
    post:
      tags:
      - write
      operationId: cancelRun
      summary: Cancel a running or waiting run
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *1
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/author/sessions":
    post:
      tags:
      - write
      operationId: openAuthorSession
      summary: Open an author session for a rulebook
      parameters:
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              properties:
                kind:
                  type: string
                project:
                  type: string
                target_file:
                  type: string
                resume:
                  type: string
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthorSession"
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/author/sessions/{sid}":
    delete:
      tags:
      - write
      operationId: closeAuthorSession
      summary: Close an author session
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
      - *1
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/author/sessions/{sid}/turns":
    post:
      tags:
      - write
      operationId: authorTurn
      summary: Start a turn; events arrive on the stream
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
      - *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - intent
              properties:
                intent:
                  type: string
                context:
                  type: object
                  additionalProperties: true
      responses:
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
        '502':
          "$ref": "#/components/responses/Error"
        '503':
          "$ref": "#/components/responses/Error"
        '202':
          description: Accepted; the turn runs.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - sid
                properties:
                  ok:
                    type: boolean
                  sid:
                    type: string
  "/author/sessions/{sid}/stop":
    post:
      tags:
      - write
      operationId: stopAuthorTurn
      summary: Stop the running turn
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
      - *1
      responses:
        '200':
          description: Stopped.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
  "/author/sessions/{sid}/stream":
    get:
      tags:
      - write
      operationId: authorStream
      summary: 'Server-sent events: delta, tool, status, draft, error, done and closed'
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
  /map:
    get:
      tags: [read]
      operationId: getMap
      summary: Every ledger project and path entry with the shipped, shelf and exception layers above them
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: ["1h", "24h", "7d"]
            default: "24h"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The map. ETag is the epoch and the window.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "304":
          description: The epoch has not changed.
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /catalog:
    get:
      tags: [read]
      operationId: getCatalog
      summary: Rulebooks by kind, shelf modules, packages and examples
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "401":
          $ref: "#/components/responses/Error"
  /rulebooks/{kind}/{id}/source:
    get:
      tags: [read]
      operationId: getRulebookSource
      summary: The YAML text of one rulebook with its schema id, digest and ref
      parameters:
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The source. ETag is the digest.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookSource"
        "304":
          description: The digest has not changed.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /rulebooks/{kind}/{id}/composition:
    get:
      tags: [read]
      operationId: getRulebookComposition
      summary: The layer chain, rules, gates, freezes and, with action, the winning rule per environment
      parameters:
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Id"
        - name: action
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The composition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Composition"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /rulebooks/{kind}/{id}/history:
    get:
      tags: [read]
      operationId: getRulebookHistory
      summary: The commits touching a rulebook file, or with from and to the semantic diff between two refs
      parameters:
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Id"
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The commits, or the changes between the two refs.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/History"
                  - $ref: "#/components/schemas/HistoryDiff"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /pipeline:
    get:
      tags: [read]
      operationId: getPipeline
      summary: Refs, drift, doctor findings, freezes and the gate to test of every project
      responses:
        "200":
          description: The pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Error"
  /heatmap:
    get:
      tags: [read]
      operationId: getHeatmap
      summary: Rule hits per project and environment, NO-RULE rows and rules that never fired
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: ["7d", "14d", "30d"]
            default: "14d"
      responses:
        "200":
          description: The heatmap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heatmap"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      tags: [read]
      operationId: getSessions
      summary: Active harness sessions with their epoch and badges
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: ["1h", "6h", "24h"]
            default: "1h"
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /changes:
    get:
      tags: [read]
      operationId: getChanges
      summary: Change records with the sessions that crossed, are pending or are flagged
      parameters:
        - name: since
          in: query
          schema:
            type: string
            default: "24h"
      responses:
        "200":
          description: The changes, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changes"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /judgments:
    get:
      tags: [read]
      operationId: getJudgments
      summary: Judgment records, oldest first, for gap filling
      parameters:
        - name: since
          in: query
          schema:
            type: string
        - name: session
          in: query
          schema:
            type: string
        - name: project
          in: query
          schema:
            type: string
        - name: rule
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: The judgments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Judgments"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /judgments/stream:
    get:
      tags: [read]
      operationId: streamJudgments
      summary: Server-sent events, one judgment event per new record, a heartbeat comment every 15 seconds
      parameters:
        - name: session
          in: query
          schema:
            type: string
        - name: project
          in: query
          schema:
            type: string
        - name: rule
          in: query
          schema:
            type: string
      responses:
        "200":
          description: An event stream. Each event is named judgment and carries one polispec.judgment/v1 record without its raw field.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /manifest/index:
    get:
      tags: [read]
      operationId: getManifestIndex
      summary: The index of this host and the indexes other users published
      responses:
        "200":
          description: The index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestIndex"
        "401":
          $ref: "#/components/responses/Error"
  /manifest/{id}:
    get:
      tags: [read]
      operationId: getManifest
      summary: The generated manifest of a project or path entry and its authored app file
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestView"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /badge/{id}.svg:
    get:
      tags: [read]
      operationId: getBadge
      summary: The status badge of a project or path entry
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: An SVG badge.
          content:
            image/svg+xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /state/layout:
    get:
      tags: [state]
      operationId: getLayout
      summary: The saved card positions of the map
      responses:
        "200":
          description: The positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "401":
          $ref: "#/components/responses/Error"
    put:
      tags: [state]
      operationId: putLayout
      summary: Save the card positions of the map
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Layout"
      responses:
        "200":
          description: The positions as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: ps_session
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [project, path, global, module]
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    Csrf:
      name: X-Polispec-CSRF
      in: header
      required: true
      schema:
        type: string
  headers:
    RequestId:
      schema:
        type: string
        pattern: "^req_[0-9a-f]{12}$"
  responses:
    Error:
      description: An error. A feature turned off by a flag answers 403 with error disabled and a reason.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait, on 429.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Session:
      type: object
      required: [csrf, expires_at]
      properties:
        csrf:
          type: string
        expires_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error, message, request_id]
      properties:
        error:
          type: string
          description: bad_json, unauthorized, forbidden, not_found, method_not_allowed, read_only, too_large, rate_limited, disabled, conflict, confirm_required, invalid, or server.
        message:
          type: string
        reason:
          type: string
          description: Present when error is disabled (the flag reason) and on every 409 conflict, where it is plan_changed, already_applied, requires_destination or base_moved.
        findings:
          type: array
          items:
            type: object
        request_id:
          type: string
          pattern: "^req_[0-9a-f]{12}$"
    Flag:
      type: object
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          nullable: true
    Config:
      type: object
      required: [version, edition, epoch, theme, operator, owner, home, read_only, flags]
      properties:
        read_only:
          type: boolean
          description: True when polispec web runs with --read-only and mounts no mutating route.
        version:
          type: string
        edition:
          type: string
          enum: [standard, lock]
        epoch:
          type: string
          nullable: true
          pattern: "^ep_[0-9a-f]{16}$"
        theme:
          type: string
          enum: [system, light, dark, apple-noir, apple-austere, tronwave]
        operator:
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
        home:
          type: string
        flags:
          type: object
          required: [author, feed, description, delegate]
          properties:
            author:
              $ref: "#/components/schemas/Flag"
            feed:
              $ref: "#/components/schemas/Flag"
            description:
              type: object
              required: [allowed, reason, strict]
              properties:
                strict:
                  type: boolean
                allowed:
                  type: boolean
                reason:
                  type: string
                  nullable: true
            delegate:
              type: object
              required: [runner_up, granted_verbs]
              properties:
                runner_up:
                  type: boolean
                granted_verbs:
                  type: array
                  items:
                    type: string
    Epoch:
      type: string
      nullable: true
      pattern: "^ep_[0-9a-f]{16}$"
    Owner:
      type: object
      required: [uid, name]
      properties:
        uid:
          type: integer
          nullable: true
        name:
          type: string
    Counts:
      type: object
      required: [allow, warn, deny]
      properties:
        allow:
          type: integer
        warn:
          type: integer
        deny:
          type: integer
    MapEntry:
      type: object
      required: [id, kind, status, owner, summary, description, digest, counts, globs, error]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [project, path]
        status:
          type: string
          enum: [live, onboarding, retired]
        owner:
          $ref: "#/components/schemas/Owner"
        summary:
          type: string
        description:
          type: string
        digest:
          type: string
          nullable: true
        counts:
          $ref: "#/components/schemas/Counts"
        globs:
          type: array
          items:
            type: object
            required: [glob, matched]
            properties:
              glob:
                type: string
              matched:
                type: integer
        error:
          type: string
          nullable: true
    MapChip:
      type: object
      required: [id, name, reaches]
      properties:
        id:
          type: string
        name:
          type: string
        reaches:
          type: array
          items:
            type: string
    Map:
      type: object
      required: [epoch, window, layers, entries]
      properties:
        epoch:
          $ref: "#/components/schemas/Epoch"
        window:
          type: string
          enum: ["1h", "24h", "7d"]
        layers:
          type: object
          required: [shipped, global, exceptions]
          properties:
            shipped:
              type: array
              items:
                $ref: "#/components/schemas/MapChip"
            global:
              type: array
              items:
                $ref: "#/components/schemas/MapChip"
            exceptions:
              type: array
              items:
                $ref: "#/components/schemas/MapChip"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MapEntry"
    CatalogItem:
      type: object
      required: [name, summary, description, params, used_by, used_by_count]
      properties:
        name:
          type: string
        summary:
          type: string
        description:
          type: string
        params:
          type: object
        used_by:
          type: array
          items:
            type: string
        used_by_count:
          type: integer
    Catalog:
      type: object
      required: [rulebooks, modules, packages, examples]
      properties:
        rulebooks:
          type: array
          items:
            type: object
            required: [kind, id, scope]
            properties:
              kind:
                type: string
                enum: [project, path, global]
              id:
                type: string
              scope:
                type: string
        modules:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
        examples:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
    RulebookSource:
      type: object
      required: [yaml, schema_id, digest, ref]
      properties:
        yaml:
          type: string
        trust_ref:
          type: string
          description: Project rulebooks only. The trust ref and its commit, as ref@sha.
        ahead:
          type: integer
          description: Project rulebooks only. Commits on main, not on the trust ref, that touch the policy directory.
        ahead_files:
          type: array
          description: Project rulebooks only. Paths in the policy directory that differ between the trust ref and main.
          items:
            type: string
        note:
          type: string
          description: Present for a registered path with no policy file on the shelf yet.
        schema_id:
          type: string
          nullable: true
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        ref:
          type: string
          description: For a project, main@sha, since the editable text is main's.
    Verdict:
      type: string
      enum: [allow, warn, deny]
    Winner:
      type: object
      nullable: true
      required: [verdict, rule, layer, overrides]
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        rule:
          type: string
        layer:
          type: string
          nullable: true
        overrides:
          type: array
          items:
            type: string
    Composition:
      type: object
      required: [name, kind, status, digest, description, action_classes, own_rules, layers, rules, gates, freezes, winners]
      properties:
        name:
          type: string
        kind:
          type: string
        status:
          type: string
        digest:
          type: string
          nullable: true
        note:
          type: string
          description: Present for a registered path with no policy file on the shelf yet; the baseline applies.
        description:
          type: string
        action_classes:
          type: array
          items:
            type: string
        own_rules:
          type: integer
        layers:
          type: array
          items:
            type: object
            required: [id, name, rule_count, module_count, modules]
            properties:
              id:
                type: string
              name:
                type: string
              rule_count:
                type: integer
              module_count:
                type: integer
              modules:
                type: array
                items:
                  type: object
                  required: [name, kind, params, rules]
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                    params:
                      type: object
                    rules:
                      type: integer
        rules:
          type: array
          items:
            type: object
            required: [id, layer, module, verdicts, applies_to, overrides, overridden_by, description, source, yaml]
            properties:
              id:
                type: string
              layer:
                type: string
              module:
                type: string
                nullable: true
              verdicts:
                type: object
                required: [dev, test, prod]
                properties:
                  dev:
                    type: string
                    nullable: true
                    enum: [allow, warn, deny]
                  test:
                    type: string
                    nullable: true
                    enum: [allow, warn, deny]
                  prod:
                    type: string
                    nullable: true
                    enum: [allow, warn, deny]
              applies_to:
                type: array
                items:
                  type: string
              overrides:
                type: array
                items:
                  type: string
              overridden_by:
                type: string
                nullable: true
              description:
                type: string
              source:
                type: string
              yaml:
                type: string
        gates:
          type: array
          items:
            type: object
            required: [id, transition, requirement, status]
            properties:
              id:
                type: string
              transition:
                type: string
              requirement:
                type: string
              status:
                type: string
                enum: [passing, failing, not_evaluated]
        freezes:
          type: array
          items:
            type: object
            required: [id, env, start, end, reason, active]
            properties:
              id:
                type: string
              env:
                type: string
              start:
                type: string
                nullable: true
              end:
                type: string
                nullable: true
              reason:
                type: string
              active:
                type: boolean
        winners:
          type: object
          nullable: true
          required: [dev, test, prod]
          properties:
            dev:
              $ref: "#/components/schemas/Winner"
            test:
              $ref: "#/components/schemas/Winner"
            prod:
              $ref: "#/components/schemas/Winner"
    History:
      type: object
      required: [commits]
      properties:
        commits:
          type: array
          items:
            type: object
            required: [sha, date, author, subject, tags]
            properties:
              sha:
                type: string
              date:
                type: string
              author:
                type: string
              subject:
                type: string
              tags:
                type: array
                items:
                  type: string
    HistoryDiff:
      type: object
      required: [from, to, changes]
      properties:
        from:
          type: string
        to:
          type: string
        changes:
          type: array
          items:
            type: object
            required: [kind, change, id, classification, summary, before, after]
            properties:
              kind:
                type: string
                enum: [module, rule, gate, freeze]
              change:
                type: string
                enum: [added, removed, changed]
              id:
                type: string
              classification:
                type: string
                enum: [tightening, loosening, neutral]
              summary:
                type: string
              before:
                type: string
                nullable: true
              after:
                type: string
                nullable: true
    RefDigest:
      type: object
      nullable: true
      required: [sha, policy_digest]
      properties:
        sha:
          type: string
        policy_digest:
          type: string
          nullable: true
    Pipeline:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [id, repo, refs, drift, doctor, freezes, gate]
            properties:
              id:
                type: string
              repo:
                type: string
              refs:
                type: object
                required: [main, test, stable]
                properties:
                  main:
                    $ref: "#/components/schemas/RefDigest"
                  test:
                    $ref: "#/components/schemas/RefDigest"
                  stable:
                    $ref: "#/components/schemas/RefDigest"
              refs_error:
                type: string
              drift:
                type: object
                required: [packages]
                properties:
                  packages:
                    type: integer
              doctor:
                type: object
                required: [error, warning, info, findings]
                properties:
                  error:
                    type: integer
                  warning:
                    type: integer
                  info:
                    type: integer
                  findings:
                    type: array
                    items:
                      type: object
                      required: [severity, code, message]
                      properties:
                        severity:
                          type: string
                          enum: [error, warning, info]
                        code:
                          type: string
                        message:
                          type: string
              freezes:
                type: object
                required: [active]
                properties:
                  active:
                    type: integer
              gate:
                type: object
                required: [status, requirements]
                properties:
                  status:
                    type: string
                    enum: [passing, failing]
                  requirements:
                    type: array
                    items:
                      type: object
                      required: [id, label, met]
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        met:
                          type: boolean
    Heatmap:
      type: object
      required: [window, projects, rules, no_rule, dead]
      properties:
        window:
          type: string
          enum: ["7d", "14d", "30d"]
        projects:
          type: array
          items:
            type: object
            required: [id, envs]
            properties:
              id:
                type: string
              envs:
                type: array
                items:
                  type: string
        rules:
          type: array
          items:
            type: object
            required: [rule_id, layer, hits]
            properties:
              rule_id:
                type: string
              layer:
                type: string
              hits:
                type: object
                additionalProperties:
                  type: integer
        no_rule:
          type: object
          additionalProperties:
            type: object
            required: [count, top_action]
            properties:
              count:
                type: integer
              top_action:
                type: string
        dead:
          type: array
          items:
            type: object
            required: [rule_id, layer, projects, last_fired, added]
            properties:
              rule_id:
                type: string
              layer:
                type: string
              projects:
                type: integer
              last_fired:
                type: string
                nullable: true
              added:
                type: string
                nullable: true
    SessionRef:
      type: object
      required: [id, harness, badges]
      properties:
        id:
          type: string
        harness:
          type: string
          nullable: true
        badges:
          type: array
          items:
            type: string
            enum: [current, pending, reload_needed, stale_briefing, untrusted_hook]
    Sessions:
      type: object
      required: [epoch, window, sessions]
      properties:
        epoch:
          $ref: "#/components/schemas/Epoch"
        window:
          type: string
          enum: ["1h", "6h", "24h"]
        sessions:
          type: array
          items:
            type: object
            required: [id, harness, agent_type, started, last_call, runtime_version, epoch, badges, projects]
            properties:
              id:
                type: string
              harness:
                type: string
                nullable: true
              agent_type:
                type: string
                nullable: true
              started:
                type: string
                nullable: true
              last_call:
                type: string
                nullable: true
              runtime_version:
                type: string
                nullable: true
              epoch:
                $ref: "#/components/schemas/Epoch"
              badges:
                type: array
                items:
                  type: string
                  enum: [current, pending, reload_needed, stale_briefing, untrusted_hook]
              projects:
                type: array
                items:
                  type: object
                  required: [id, policy_digest_seen, current_digest, in_step]
                  properties:
                    id:
                      type: string
                    policy_digest_seen:
                      type: string
                      nullable: true
                    current_digest:
                      type: string
                      nullable: true
                    in_step:
                      type: boolean
    Changes:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [id, ts, kind, actor, subject, effects, epoch_before, epoch_after, crossed, pending, flagged]
            properties:
              id:
                type: string
              ts:
                type: string
              kind:
                type: string
              actor:
                type: string
              subject:
                type: object
              effects:
                type: array
                items:
                  type: object
                  required: [class, scope]
                  properties:
                    class:
                      type: string
                    scope:
                      type: string
              epoch_before:
                $ref: "#/components/schemas/Epoch"
              epoch_after:
                $ref: "#/components/schemas/Epoch"
              crossed:
                type: array
                items:
                  $ref: "#/components/schemas/SessionRef"
              pending:
                type: array
                items:
                  $ref: "#/components/schemas/SessionRef"
              flagged:
                type: array
                items:
                  $ref: "#/components/schemas/SessionRef"
    Judgment:
      type: object
      required: [schema, id, ts, action, targets, outcome]
      properties:
        schema:
          type: string
          enum: ["polispec.judgment/v1"]
        id:
          type: string
          pattern: "^jdg_[0-9a-f]{12}$"
        ts:
          type: string
        epoch:
          $ref: "#/components/schemas/Epoch"
        action:
          type: object
          required: [tool, harness, session_id]
          properties:
            tool:
              type: string
              nullable: true
            harness:
              type: string
            session_id:
              type: string
              nullable: true
        targets:
          type: array
          items:
            type: object
            required: [project, env, verdict, rule_id]
            properties:
              project:
                type: string
                nullable: true
              env:
                type: string
              verdict:
                $ref: "#/components/schemas/Verdict"
              rule_id:
                type: string
                nullable: true
        outcome:
          type: object
          required: [verdict]
          properties:
            verdict:
              $ref: "#/components/schemas/Verdict"
    Judgments:
      type: object
      required: [judgments]
      properties:
        judgments:
          type: array
          items:
            $ref: "#/components/schemas/Judgment"
    IndexEntry:
      type: object
      required: [id, kind, status, owner, policy_digest]
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
        description:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        policy_digest:
          type: string
          nullable: true
    ManifestIndex:
      type: object
      required: [user, host, generated_at, entries, published]
      properties:
        user:
          type: string
        host:
          type: string
        generated_at:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/IndexEntry"
        published:
          type: array
          items:
            type: object
            required: [user, entries]
            properties:
              user:
                type: string
              host:
                type: string
                nullable: true
              generated_at:
                type: string
                nullable: true
              entries:
                type: array
                items:
                  $ref: "#/components/schemas/IndexEntry"
              error:
                type: string
