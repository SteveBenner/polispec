$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.app/v1
title: Polispec app declaration
type: object
additionalProperties: false
required: [schema, name, description]
properties:
  schema: { const: polispec.app/v1 }
  name: { type: string, minLength: 1, maxLength: 120 }
  description: { type: string, minLength: 1, maxLength: 4000 }
  serves: { type: string, minLength: 1, maxLength: 1000 }
  owners:
    type: array
    items: { type: string, minLength: 1, maxLength: 200 }
  wants:
    type: object
    additionalProperties: false
    properties:
      packages:
        type: array
        items: { $ref: "#/$defs/want" }
      modules:
        type: array
        items: { $ref: "#/$defs/want" }
  contact: { type: string, minLength: 1, maxLength: 300 }
$defs:
  want:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { type: string, minLength: 1, maxLength: 120 }
      variant: { type: string, minLength: 1, maxLength: 60 }
      with:
        type: object
        additionalProperties:
          type: [string, number, boolean, array]
