$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.catalog/v1
title: Polispec catalog spec
description: "One shipped catalog spec: a directory under catalog/ holding this catalog.yml and one polispec.module/v1 file per subspec. No catalog spec is active until the operator activates it on a host."
type: object
additionalProperties: false
required: [schema, name, summary, subspecs]
properties:
  schema: { const: polispec.catalog/v1 }
  name: { $ref: "#/$defs/id" }
  summary: { type: string, minLength: 1 }
  subspecs:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/subspec" }
$defs:
  id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,40}$" }
  subspec:
    type: object
    additionalProperties: false
    required: [id, summary, module]
    properties:
      id: { $ref: "#/$defs/id" }
      summary: { type: string, minLength: 1 }
      module: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*\\.yml$" }
      gate: { enum: [unknown_tool, mcp_undeclared] }
      provision: { enum: [module] }
