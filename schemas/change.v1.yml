$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.change/v1
title: Polispec change record
type: object
additionalProperties: false
required: [schema, id, ts, kind, actor, subject, epoch_before, epoch_after, effects, prev, digest]
properties:
  schema: { const: polispec.change/v1 }
  id: { type: string, pattern: "^chg_[0-9a-f]{12}$" }
  ts: { type: string, minLength: 1 }
  kind:
    enum: [promote, apply, exceptions.add, exceptions.promote, exceptions.remove, settings.set, pin, install, register, manifest]
  actor: { type: string, minLength: 1 }
  subject: { type: object }
  epoch_before: { $ref: "#/$defs/epoch" }
  epoch_after: { $ref: "#/$defs/epoch" }
  effects:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [class, scope]
      properties:
        class: { enum: [next_call, new_session, reload, trust] }
        scope: { type: string, minLength: 1 }
  prev:
    anyOf:
      - { type: "null" }
      - { $ref: "#/$defs/sha256" }
  digest: { $ref: "#/$defs/sha256" }
$defs:
  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
  epoch:
    anyOf:
      - { type: "null" }
      - { type: string, pattern: "^ep_[0-9a-f]{16}$" }
