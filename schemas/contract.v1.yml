$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.contract/v1
title: Polispec behavior contract
type: object
additionalProperties: false
required: [schema, id, version, lifecycle, intent, scope, trigger, precedence, behavior, guards, probes, owner, change]
properties:
  schema: { const: polispec.contract/v1 }
  id: { type: string, pattern: "^[a-z][a-z0-9_.-]+$" }
  version: { $ref: "#/$defs/semver" }
  lifecycle: { enum: [draft, advise, enforce, retired] }
  intent: { type: string, minLength: 1, maxLength: 600 }
  scope:
    type: object
    additionalProperties: false
    required: [application]
    properties:
      application: { type: string, minLength: 1 }
      course: { type: [string, "null"] }
      assignment: { type: [string, "null"] }
      module: { type: [string, "null"] }
      step: { type: [string, "null"] }
      harnesses: { $ref: "#/$defs/strings" }
  trigger:
    type: array
    minItems: 1
    items: { type: string, minLength: 1 }
  precedence:
    type: object
    additionalProperties: false
    required: [rank]
    properties:
      rank: { type: integer, minimum: 0 }
      outranks:
        type: array
        items: { type: string, pattern: "^[a-z][a-z0-9_.-]+$" }
  behavior:
    type: object
    additionalProperties: false
    required: [path, sha256]
    properties:
      path: { type: string, minLength: 1 }
      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
  directive: { type: string, minLength: 1 }
  guards:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/guard" }
  messages:
    type: array
    items: { $ref: "#/$defs/message" }
  constraints:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [tag, text]
      properties:
        tag: { type: string, minLength: 1 }
        text: { type: string, minLength: 1 }
  annotations:
    type: object
    additionalProperties:
      anyOf:
        - { type: [string, number, boolean] }
        - { type: array, items: { type: [string, number, boolean] } }
  probes:
    type: object
    additionalProperties: false
    required: [positive, negative]
    properties:
      positive:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/probe" }
      negative:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/probe" }
  external_tests:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, ref]
      properties:
        id: { type: string, minLength: 1 }
        ref: { type: string, minLength: 1 }
  trace_refs:
    type: array
    items: { type: string, minLength: 1 }
  owner: { type: string, minLength: 1 }
  effective_at: { type: [string, "null"] }
  rollback:
    type: object
    additionalProperties: false
    properties:
      to_version: { type: [string, "null"] }
      digest: { type: [string, "null"] }
  change:
    type: object
    additionalProperties: false
    required: [reason]
    properties:
      reason: { type: string, minLength: 1 }
      supersedes: { type: [string, "null"] }
      decision_ref: { type: string, minLength: 1 }
$defs:
  semver: { type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" }
  strings:
    type: array
    items: { type: string, minLength: 1 }
  scalar: { type: [string, number, boolean] }
  guard:
    type: object
    additionalProperties: false
    required: [rule, location, decision]
    properties:
      rule: { type: string, minLength: 1 }
      location: { type: string, minLength: 1 }
      decision: { enum: [deny, block, reroute, report, instruct] }
      harnesses: { $ref: "#/$defs/strings" }
  message:
    type: object
    additionalProperties: false
    required: [message_id, clauses]
    properties:
      message_id: { type: string, minLength: 1 }
      clauses:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/clause" }
      compose: { enum: [sentence, list] }
  clause:
    type: object
    additionalProperties: false
    required: [id, text_ref]
    properties:
      id: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
      text_ref: { type: string, minLength: 1 }
      shown_when: { $ref: "#/$defs/predicate" }
  predicate:
    anyOf:
      - type: object
        additionalProperties: false
        required: [fact, equals]
        properties:
          fact: { type: string, minLength: 1 }
          equals: { type: [string, number, boolean] }
      - type: object
        additionalProperties: false
        required: [fact, in]
        properties:
          fact: { type: string, minLength: 1 }
          in:
            type: array
            minItems: 1
            items: { type: [string, number, boolean] }
      - type: object
        additionalProperties: false
        required: [fact, present]
        properties:
          fact: { type: string, minLength: 1 }
          present: { type: boolean }
      - type: object
        additionalProperties: false
        required: [all]
        properties:
          all:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/predicate" }
      - type: object
        additionalProperties: false
        required: [any]
        properties:
          any:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/predicate" }
  probe:
    type: object
    additionalProperties: false
    required: [id, event, expect]
    properties:
      id: { type: string, pattern: "^[A-Za-z0-9_.-]+$" }
      event: { type: string, minLength: 1 }
      facts: { type: object }
      expect:
        type: object
        additionalProperties: false
        required: [verdict]
        properties:
          verdict: { enum: [allow, deny, block, report, instruct, reroute] }
          message_id: { type: string, minLength: 1 }
          clauses: { $ref: "#/$defs/strings" }
          hidden: { $ref: "#/$defs/strings" }
