$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.module/v1
title: Polispec policy module
type: object
additionalProperties: false
required: [schema, name]
properties:
  schema: { const: polispec.module/v1 }
  name: { $ref: "#/$defs/module_name" }
  summary: { type: string, minLength: 1 }
  includes:
    type: array
    items: { $ref: "#/$defs/module_name" }
  rules:
    type: array
    items: { $ref: "#/$defs/rule" }
  gates:
    type: object
    additionalProperties: false
    properties:
      to_test:
        type: array
        items: { $ref: "#/$defs/gate" }
      to_stable:
        type: array
        items: { $ref: "#/$defs/gate" }
  preflight:
    type: array
    items: { $ref: "#/$defs/gate" }
  freezes:
    type: array
    items: { $ref: "#/$defs/freeze" }
  hermetic:
    type: object
    additionalProperties: false
    properties:
      dev: { $ref: "#/$defs/hermetic" }
      test: { $ref: "#/$defs/hermetic" }
      prod: { $ref: "#/$defs/hermetic" }
$defs:
  module_name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,40}$" }
  string_list:
    type: array
    items: { type: string, minLength: 1 }
  action_class:
    enum: [git.commit, git.push, git.tag, git.merge, git.rewrite, git.branch, release.publish, service.control, service.config, fs.write, fs.delete, data.write, data.copy, secrets.read, policy.edit, promote, deploy]
  match:
    type: object
    additionalProperties: false
    properties:
      env: { enum: [dev, test, prod] }
      class:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/action_class" }
      ref:
        anyOf:
          - { type: string, minLength: 1 }
          - { $ref: "#/$defs/string_list" }
      crosses: { enum: [data_classes, location] }
      destructive: { const: true }
      shape: { $ref: "#/$defs/string_list" }
      lock_held: { const: true }
      live_binary: { const: true }
      supervised: { const: true }
      pin_regress: { const: true }
      tag_claimed: { const: true }
      base_unpushed: { const: true }
  rule:
    type: object
    additionalProperties: false
    required: [id, match, verdict]
    properties:
      id: { type: string, pattern: "^[A-Z][A-Z0-9]*-[A-Z0-9-]+$" }
      match: { $ref: "#/$defs/match" }
      verdict: { enum: [allow, warn, deny] }
      reason: { type: string, minLength: 1 }
      overridable: { type: boolean }
      overrides: { type: string, pattern: "^[A-Z][A-Z0-9]*-[A-Z0-9-]+$" }
  gate:
    type: object
    required: [id]
    properties:
      id: { type: string, pattern: "^G-[A-Z0-9-]+$" }
  freeze:
    type: object
    required: [id, applies_to]
    properties:
      id: { type: string, pattern: "^F-[A-Z0-9-]+$" }
  hermetic:
    type: object
    additionalProperties: false
    properties:
      isolate: { $ref: "#/$defs/string_list" }
      protected_roots: { $ref: "#/$defs/string_list" }
