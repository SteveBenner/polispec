$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.editions/v1
title: Polispec edition registry
description: "Lists every feature whose behavior differs between the standard edition and the lock edition. Lives at specs/editions.yml."
type: object
additionalProperties: false
required: [schema, editions, values, features]
properties:
  schema: { const: polispec.editions/v1 }
  editions:
    type: object
    additionalProperties: false
    required: [standard, lock]
    properties:
      standard: { type: string, minLength: 1 }
      lock: { type: string, minLength: 1 }
  values:
    type: array
    items: { enum: [included, restricted, excluded] }
  features:
    type: array
    items: { $ref: "#/$defs/feature" }
$defs:
  feature:
    type: object
    additionalProperties: false
    required: [id, standard, lock, since, code, note]
    properties:
      id: { type: string, pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$" }
      standard: { enum: [included, restricted, excluded] }
      lock: { enum: [included, restricted, excluded] }
      since: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
      code: { type: string, minLength: 1 }
      note: { type: string, minLength: 1 }
