$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.features/v1
title: Polispec feature manifest
description: "A project's targets, features and proof exceptions. Lives at specs/features.yml in the repository root."
type: object
additionalProperties: false
required: [schema, targets, features]
properties:
  schema: { const: polispec.features/v1 }
  targets:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/target" }
  features:
    type: array
    items: { $ref: "#/$defs/feature" }
  shared: { $ref: "#/$defs/glob_list" }
  ignore: { $ref: "#/$defs/glob_list" }
  trusted_producers:
    type: array
    items: { $ref: "#/$defs/producer" }
  exceptions:
    type: array
    items: { $ref: "#/$defs/exception" }
$defs:
  id: { type: string, pattern: "^[a-z0-9][a-z0-9.-]*$" }
  date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
  glob_list:
    type: array
    items: { type: string, minLength: 1 }
  argv:
    type: array
    minItems: 1
    items: { type: string, minLength: 1 }
  rung: { type: integer, minimum: 1, maximum: 4 }
  target:
    type: object
    additionalProperties: false
    required: [id, facts]
    properties:
      id: { $ref: "#/$defs/id" }
      facts:
        type: object
        additionalProperties: { type: string, minLength: 1 }
  spec:
    type: object
    additionalProperties: false
    required: [file, at]
    properties:
      file: { type: string, minLength: 1 }
      at: { type: string }
  smoke_run:
    type: object
    additionalProperties: false
    properties:
      run: { $ref: "#/$defs/argv" }
      rung: { $ref: "#/$defs/rung" }
      timeout_s: { type: integer, minimum: 1 }
  smoke:
    type: object
    additionalProperties: false
    required: [run, rung]
    properties:
      run: { $ref: "#/$defs/argv" }
      rung: { $ref: "#/$defs/rung" }
      timeout_s: { type: integer, minimum: 1 }
      per_target:
        type: object
        additionalProperties: { $ref: "#/$defs/smoke_run" }
  feature:
    type: object
    additionalProperties: false
    required: [id, summary, paths, smoke]
    properties:
      id: { $ref: "#/$defs/id" }
      summary: { type: string, minLength: 1 }
      paths: { $ref: "#/$defs/glob_list" }
      shared: { $ref: "#/$defs/glob_list" }
      spec: { $ref: "#/$defs/spec" }
      targets:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/id" }
      min_rung: { $ref: "#/$defs/rung" }
      smoke: { $ref: "#/$defs/smoke" }
  producer:
    type: object
    additionalProperties: false
    required: [id, key, kind]
    properties:
      id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._@-]*$" }
      key: { type: string, minLength: 1 }
      kind: { enum: [host, peer, ci] }
      note: { type: string }
  exception:
    type: object
    additionalProperties: false
    required: [feature, reason, owner, added, expires]
    properties:
      feature: { $ref: "#/$defs/id" }
      targets:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/id" }
      reason: { type: string, minLength: 1 }
      owner: { type: string, minLength: 1 }
      added: { $ref: "#/$defs/date" }
      expires: { $ref: "#/$defs/date" }
