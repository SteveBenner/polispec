$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.ledger/v1
title: Polispec fleet ledger
type: object
additionalProperties: false
required: [schema, host, envs_root, defaults, projects]
properties:
  schema: { const: polispec.ledger/v1 }
  host: { type: string, minLength: 1 }
  envs_root: { type: string, minLength: 1 }
  defaults:
    type: object
    additionalProperties: false
    required: [rules]
    properties:
      rules:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/default_rule" }
  projects:
    type: array
    items: { $ref: "#/$defs/project" }
  pauses_log: { type: string, minLength: 1 }
  allow_once_log: { type: string, minLength: 1 }
$defs:
  action_class:
    enum: [git.commit, git.push, git.tag, git.merge, git.rewrite, git.branch, release.publish, service.control, service.config, fs.write, fs.delete, data.write, data.copy, secrets.read, policy.edit, promote, deploy]
  string_list:
    type: array
    items: { type: string, minLength: 1 }
  default_rule:
    type: object
    additionalProperties: false
    required: [match, verdict]
    properties:
      id: { type: string, minLength: 1 }
      match:
        type: object
        additionalProperties: false
        properties:
          env: { enum: [dev, test, prod] }
          ref:
            anyOf:
              - { type: string, minLength: 1 }
              - { $ref: "#/$defs/string_list" }
          class:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/action_class" }
      verdict: { enum: [allow, warn, deny] }
      reason: { type: string, minLength: 1 }
  project:
    type: object
    additionalProperties: false
    required: [id, status, repo, trust_ref, policy, roster]
    properties:
      id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,40}$" }
      status: { enum: [live, onboarding, retired] }
      repo: { type: string, minLength: 1 }
      remote: { type: string, minLength: 1 }
      worktree_globs: { $ref: "#/$defs/string_list" }
      trust_ref: { type: string, minLength: 1 }
      policy: { type: string, minLength: 1 }
      roster: { type: string, minLength: 1 }
      related:
        type: array
        items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,40}$" }
      onboarded: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
      profile: { enum: [personal, service, live] }
