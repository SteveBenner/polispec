$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.behavior/v2
type: object
additionalProperties: false
required: [schema, id, version, authority, scope, directives, parameters, rules]
properties:
  schema: {const: polispec.behavior/v2}
  id: {type: string, pattern: "^[a-z][a-z0-9_.-]+$"}
  version: {type: integer, minimum: 1}
  authority:
    type: object
    additionalProperties: false
    required: [id, kind, authentication]
    properties:
      id: {type: string, minLength: 1}
      kind: {enum: [application, course, control]}
      authentication: {enum: [release, signed-package, signed-control]}
  scope:
    type: object
    additionalProperties: false
    required: [application, spaces]
    properties:
      application: {type: string, minLength: 1}
      spaces: {$ref: '#/$defs/strings'}
      course: {type: [string, 'null']}
      assignment: {type: [string, 'null']}
  directives:
    type: array
    maxItems: 2048
    items: {$ref: '#/$defs/directive'}
  parameters: {type: object}
  rules:
    type: array
    maxItems: 2048
    items: {$ref: '#/$defs/rule'}
  surfaces:
    type: object
    additionalProperties: {$ref: '#/$defs/surface'}
  frames:
    type: array
    maxItems: 256
    items: {$ref: '#/$defs/frame'}
  antifeatures:
    type: array
    maxItems: 256
    items: {$ref: '#/$defs/antifeature'}
  controls:
    type: object
    additionalProperties: {$ref: '#/$defs/control'}
  messages:
    type: object
    additionalProperties: {$ref: '#/$defs/message'}
  overlays:
    type: object
    additionalProperties: false
    properties:
      cutout:
        type: object
        additionalProperties: false
        required: [field, kind]
        properties:
          field: {const: guardrails}
          kind: {const: directive_ids_or_text}
$defs:
  strings:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  id:
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9_.:-]+$"
  relpath:
    type: string
    minLength: 1
  directive:
    type: object
    additionalProperties: false
    required: [id, rule, when, enforce]
    properties:
      id: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.:-]+$"}
      opcode: {type: string, pattern: "^[A-Z][A-Z0-9]{2,9}$"}
      alias: {type: string, pattern: "^[A-Z]$"}
      tier: {enum: [public, private]}
      slice: {enum: [all, backend, panel, verification]}
      scope: {enum: [everywhere, slice, extracurricular, course_root, repo]}
      spaces: {$ref: '#/$defs/strings'}
      rule: {type: string, minLength: 1}
      when: {$ref: '#/$defs/strings'}
      enforce: {type: string, minLength: 1}
      body: {type: string, minLength: 1}
      body_ref:
        type: object
        additionalProperties: false
        required: [path, sha256]
        properties:
          path: {$ref: '#/$defs/relpath'}
          sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      duplicate_of: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.:-]+$"}
  surface:
    type: object
    additionalProperties: false
    required: [kind, target, mode]
    properties:
      kind: {enum: [rows, rules_file, stub, persona, skill, message, prose, policy_json, locale]}
      target: {$ref: '#/$defs/relpath'}
      harness:
        type: array
        items: {type: string, minLength: 1}
      template: {$ref: '#/$defs/relpath'}
      locale: {type: string, minLength: 2}
      refs:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      mode: {const: generated}
  frame:
    type: object
    additionalProperties: false
    required: [id, tier, order, channels, text_ref]
    properties:
      id: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.:-]+$"}
      tier: {type: string, minLength: 1}
      order: {type: integer, minimum: 0}
      channels:
        type: array
        items: {type: string, minLength: 1}
      text_ref: {type: string, minLength: 1}
  antifeature:
    type: object
    additionalProperties: false
    required: [id, rule, refs]
    properties:
      id: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.:-]+$"}
      rule: {type: string, minLength: 1}
      refs:
        type: array
        items: {type: string, minLength: 1}
  control:
    type: object
    additionalProperties: false
    required: [allowed_tools, text_ref]
    properties:
      allowed_tools:
        type: array
        items: {type: string, minLength: 1}
      text_ref: {type: string, minLength: 1}
  message:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: {type: string, minLength: 1}
      locale: {type: string, minLength: 2}
  rule:
    type: object
    additionalProperties: false
    required: [id, description, event, mode, binding, failure]
    properties:
      id: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.:-]+$"}
      description: {type: string, minLength: 1}
      event: {type: string, pattern: "^[a-z][a-z0-9_.-]+$"}
      mode: {enum: [native, advisory, declarative]}
      binding: {type: string, minLength: 1}
      failure: {enum: [deny, report, instruct]}
      message_id: {type: string, pattern: "^M-[A-Z0-9-]+$"}
      all:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: [string, number, boolean, 'null']}
