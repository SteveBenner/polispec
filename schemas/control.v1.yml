$schema: https://json-schema.org/draft/2020-12/schema
$id: polispec.control/v1
title: Polispec harness controls
type: object
additionalProperties: false
required: [schema, controls]
properties:
  schema: { const: polispec.control/v1 }
  controls:
    type: array
    minItems: 1
    maxItems: 256
    items: { $ref: "#/$defs/control" }
$defs:
  action:
    enum: [git.commit, git.push, git.tag, git.merge, git.rewrite, git.branch, release.publish, service.control, service.config, fs.write, fs.delete, data.write, data.copy, secrets.read, policy.edit, promote, deploy, control.edit, mcp.call, web.fetch, agent.spawn, shell.exec, fs.walk, tool.internal, tool.read]
  string_list:
    type: array
    items: { type: string, minLength: 1 }
  absolute_globs:
    type: array
    items: { type: string, minLength: 1, pattern: "^/" }
  match:
    type: object
    additionalProperties: false
    properties:
      env: { enum: [dev, test, prod] }
      class:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/action" }
      crosses: { enum: [data_classes, location] }
      destructive: { const: true }
      shape:
        type: array
        minItems: 1
        items: { enum: [bulk_stage, chained_release, latest_flip, lockfile_edit, pattern_kill, cargo_clean, worktree_force, tmux_kill, xargs_delete, bulk_write, root_walk, slow_mount_walk, opaque_shell] }
      lock_held: { type: boolean }
      live_binary: { type: boolean }
      delete_protected: { type: boolean }
      delete_protected_file: { type: boolean }
      supervised: { type: boolean }
      pin_regress: { type: boolean }
      tag_claimed: { type: boolean }
      base_unpushed: { type: boolean }
      ref: { type: string, minLength: 1 }
      path: { type: string, minLength: 1 }
      tool: { type: string, minLength: 1 }
      server: { type: string, minLength: 1 }
      operation: { type: string, minLength: 1 }
      domain: { type: string, minLength: 1 }
      role: { type: string, minLength: 1 }
  fixture:
    type: object
    additionalProperties: false
    required: [input, expected]
    properties:
      input: { type: object }
      expected: { enum: [deny, ask, restrict, inject, observe] }
  deny_control:
    type: object
    additionalProperties: false
    required: [id, trigger, action, match, effect, fixture]
    properties:
      id: { type: string, pattern: "^ctl_[A-Za-z0-9_-]+$" }
      trigger: { enum: [pre_tool, session_start, post_tool, stop] }
      action: { $ref: "#/$defs/action" }
      match: { $ref: "#/$defs/match" }
      effect: { const: deny }
      reason: { type: string, minLength: 1 }
      fixture: { $ref: "#/$defs/fixture" }
      canonical: { type: string, minLength: 1 }
      digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  ask_control:
    type: object
    additionalProperties: false
    required: [id, trigger, action, match, effect, fixture]
    properties:
      id: { type: string, pattern: "^ctl_[A-Za-z0-9_-]+$" }
      trigger: { enum: [pre_tool, session_start, post_tool, stop] }
      action: { $ref: "#/$defs/action" }
      match: { $ref: "#/$defs/match" }
      effect: { const: ask }
      reason: { type: string, minLength: 1 }
      fixture: { $ref: "#/$defs/fixture" }
      canonical: { type: string, minLength: 1 }
      digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  restrict_control:
    type: object
    additionalProperties: false
    required: [id, trigger, action, match, effect, fixture, effect_params]
    properties:
      id: { type: string, pattern: "^ctl_[A-Za-z0-9_-]+$" }
      trigger: { enum: [pre_tool, session_start, post_tool, stop] }
      action: { $ref: "#/$defs/action" }
      match: { $ref: "#/$defs/match" }
      effect: { const: restrict }
      effect_params:
        type: object
        additionalProperties: false
        anyOf:
          - { required: [paths] }
          - { required: [network] }
        properties:
          paths:
            type: object
            additionalProperties: false
            anyOf:
              - { required: [read] }
              - { required: [write] }
            properties:
              read: { $ref: "#/$defs/absolute_globs" }
              write: { $ref: "#/$defs/absolute_globs" }
          network:
            oneOf:
              - type: object
                additionalProperties: false
                required: [mode]
                properties:
                  mode: { const: open }
              - type: object
                additionalProperties: false
                required: [mode, domains]
                properties:
                  mode: { const: allowlist }
                  domains: { $ref: "#/$defs/string_list" }
      reason: { type: string, minLength: 1 }
      fixture: { $ref: "#/$defs/fixture" }
      canonical: { type: string, minLength: 1 }
      digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  inject_control:
    type: object
    additionalProperties: false
    required: [id, trigger, action, match, effect, fixture, effect_params]
    properties:
      id: { type: string, pattern: "^ctl_[A-Za-z0-9_-]+$" }
      trigger: { enum: [pre_tool, session_start, post_tool, stop] }
      action: { $ref: "#/$defs/action" }
      match: { $ref: "#/$defs/match" }
      effect: { const: inject }
      effect_params:
        type: object
        additionalProperties: false
        required: [text]
        properties:
          text: { type: string, minLength: 1, maxLength: 8192 }
      reason: { type: string, minLength: 1 }
      fixture: { $ref: "#/$defs/fixture" }
      canonical: { type: string, minLength: 1 }
      digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  observe_control:
    type: object
    additionalProperties: false
    required: [id, trigger, action, match, effect, fixture, effect_params]
    properties:
      id: { type: string, pattern: "^ctl_[A-Za-z0-9_-]+$" }
      trigger: { enum: [pre_tool, session_start, post_tool, stop] }
      action: { $ref: "#/$defs/action" }
      match: { $ref: "#/$defs/match" }
      effect: { const: observe }
      effect_params:
        type: object
        additionalProperties: false
        required: [event]
        properties:
          event: { const: control.observed }
          metadata:
            type: object
            additionalProperties: { type: [string, number, boolean, 'null'] }
      reason: { type: string, minLength: 1 }
      fixture: { $ref: "#/$defs/fixture" }
      canonical: { type: string, minLength: 1 }
      digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  scheduled_control:
    type: object
    additionalProperties: false
    required: [id, trigger, calendar, target_control_id, effect]
    properties:
      id: { type: string, pattern: "^ctl_[A-Za-z0-9_-]+$" }
      trigger: { const: schedule }
      calendar: { type: string, minLength: 1, pattern: "^.{1,256}$" }
      target_control_id: { type: string, pattern: "^ctl_[A-Za-z0-9_-]+$" }
      effect: { const: verify }
      reason: { type: string, minLength: 1 }
      canonical: { type: string, minLength: 1 }
      digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  control:
    oneOf:
      - { $ref: "#/$defs/deny_control" }
      - { $ref: "#/$defs/ask_control" }
      - { $ref: "#/$defs/restrict_control" }
      - { $ref: "#/$defs/inject_control" }
      - { $ref: "#/$defs/observe_control" }
      - { $ref: "#/$defs/scheduled_control" }
