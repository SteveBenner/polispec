schema: polispec.environments/v1
project: "{{project}}"
recorded: "{{date}}"
summary: "{{project}} environments: main is dev, test is the persistent instance, stable is production."
environments:
  dev:
    branch: main
    checkout: repo
    tier: dev
    worktrees: [".{{repo_name}}-wt/*"]
    audience: [operator]
    exposure: loopback
    data_classes: [synthetic, operational]
  test:
    branch: test
    checkout: "{{envs_root}}/{{project}}/test"
    tier: test
    audience: [operator]
    exposure: none
    data_classes: [synthetic, operational]
    operators: [agent, operator]
  prod:
    branch: stable
    checkout: "{{envs_root}}/{{project}}/stable"
    tier: prod
    runs: tag
    audience: [users]
    exposure: none
    data_classes: [operational]
    operators: [operator]
    rollback: "polispec deploy {{project}} stable --tag vPREV"
