schema: rplugin/v1
id: polispec
name: Polispec
version: 0.47.2
rplugin: ">= 1.17.0"
native: true
description: "Spec-based policy guardrails for agentic development and operations: committed environment policies and deterministic harness controls, with explicit backend capabilities and enforcement limits."
ports:
  required: [state, events]
  optional: [schedule, notify, registry, decide, author]
  declared:
    - name: author
      summary: "Drafts a polispec rulebook in a streamed conversation: open(context) returns a session, turn(session, text) streams delta events and returns the done event, close(session) ends it."
      standalone: { file: lib/polispec/author/adapters/harness_cli.rb, class: Polispec::Author::Adapters::HarnessCli }
extensions:
  enabled: [rstack, claude-code, hermes, pi, deepseek-tui, antigravity, os]
  only: [claude-code, hermes, pi, deepseek-tui, antigravity]
corpora: null
settings:
  - { key: polispec.edition, type: enum, options: [standard, lock], default: standard, scopes: [machine], description: "Requested edition; lock still requires verified native and protected prerequisites." }
  - { key: polispec.root_guard, type: bool, default: false, scopes: [machine], description: "Initial root-guard setting; protected exposure history and lock fallback may force it on." }
  - { key: polispec.enforce, type: enum, options: [advise, enforce], default: advise, scopes: [machine], harnesses: [claude-code, codex, hermes, pi, deepseek-tui, antigravity], description: "Environment policy mode: advise logs verdicts; enforce applies allow, warn, and deny. Enforce combines environment and harness-control ceilings; sealed settings force enforce mode." }
  - { key: polispec.code.enforce, type: enum, options: [advise, tiered], default: tiered, scopes: [machine], harnesses: [claude-code, codex, hermes], description: "advise logs code-spec findings and never blocks; tiered blocks MUST and MUST_NOT violations on changed lines and warns on SHOULD. polispec.enforce governs environment and enabled harness-control verdicts." }
  - { key: polispec.code.check_at, type: enum, options: [pre_write, post_write], default: pre_write, scopes: [machine], harnesses: [claude-code, codex, hermes], description: "pre_write checks the edited text and denies before anything lands; post_write lets the write land and blocks with the findings. SHOULD findings are always reported after the write." }
  - { key: polispec.code.inject, type: enum, options: [once, every_write], default: once, scopes: [machine], harnesses: [claude-code, codex, hermes], description: "once injects a language's spec chain before the first write per session and chain digest, and again after compaction; every_write injects before every write." }
  - { key: polispec.ledger, type: path, default: "~/.config/polispec/ledger.yml", scopes: [machine], description: "Path of the host's ledger of governed projects. POLISPEC_LEDGER overrides it only while unsealed." }
  - { key: polispec.smoke.path, type: string, default: "", scopes: [machine], description: "Path of the smoke ledger. POLISPEC_SMOKE overrides it. Empty means smoke.yml at the git toplevel of the working directory." }
  - { key: polispec.smoke.live, type: enum, options: ["on", "off"], default: "on", scopes: [machine], description: "Kill switch for the live smoke layer. off blocks every live step with live_disabled and launches no harness. POLISPEC_SMOKE_LIVE=off overrides it." }
  - { key: polispec.global.repo, type: string, default: "", scopes: [machine], description: "Path of the git repository that holds the global layer. Unset means no global layer. POLISPEC_GLOBAL, a plain directory, overrides it for scratch runs." }
  - { key: polispec.global.ref, type: string, default: main, scopes: [machine], description: "Ref of polispec.global.repo that the global layer is read from, never its working tree." }
  - { key: polispec.global.path, type: string, default: polispec, scopes: [machine], description: "Directory inside polispec.global.repo that holds global.yml, profiles.yml and modules/." }
  - { key: polispec.operator, type: string, default: "the operator", scopes: [machine], description: "How deny and next-step messages name the person who promotes to stable and redeems allow-once." }
  - { key: polispec.supervisor.status_command, type: string, default: "", scopes: [machine], description: "Command (argv, no shell) that prints JSON {\"units\": [...], \"pids\": [...]} for the components a supervisor runs. Rules with match.supervised read it; unset means the predicate is unavailable. RPLUGIN_POLISPEC_POLISPEC_SUPERVISOR_STATUS_COMMAND overrides it." }
  - { key: polispec.code.specs_repo, type: path, default: "~/polispec-specs", scopes: [machine], description: "Path of the repository that holds the code specs. POLISPEC_SPECS_REPO overrides it only while unsealed." }
  - { key: polispec.logs.count_command, type: string, default: "", scopes: [machine], description: "Argv template (no shell) the logs_quiet gate runs to count log lines. It takes {service}, {since} and {until} (UTC ISO 8601) and prints one integer. RPLUGIN_POLISPEC_POLISPEC_LOGS_COUNT_COMMAND overrides it. Unset fails the gate closed." }
  - { key: polispec.records.raw, type: enum, options: ["off", "on"], default: "off", scopes: [machine], description: "on adds the classifier's raw view of the judged command or target (at most 2048 bytes) to each judgment record in local state; off keeps only the call digest. Raw text never goes through the events port." }
  - { key: polispec.exceptions, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on lets the operator's recorded exceptions (exceptions.yml in the global layer) lift the asks and rule warns they name; off ignores the file and restores the unexcepted behavior. POLISPEC_EXCEPTIONS overrides it only while unsealed." }
  - { key: polispec.relax.dev, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on lets a governed eval, source or . line pass without POLISPEC-TOOL-UNKNOWN when its working directory lies only in ledger projects with status onboarding (projects in development); off restores the ask. POLISPEC_RELAX_DEV overrides it only while unsealed." }
  - { key: polispec.description.strict, type: enum, options: ["off", "on"], default: "off", scopes: [machine], description: "on or off; default off. off: a rulebook with no description, or one the linter rejects, is a description_missing or description_invalid warning from validate and doctor. on: validate fails it. The guard never judges by it." }
  - { key: polispec.lint.on_write, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on or off; default on. on: a generator that writes a rulebook, ledger, manifest, index, exceptions file, deployments manifest or delegate grants file lints its output first and refuses an error finding with lint_failed, writing nothing. off: generators write as in 0.41.1." }
  - { key: polispec.lint.doctor, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on or off; default on. on: doctor files the error, warn and info findings of the host scope of polispec lint as lint_<code> findings. off: doctor files none." }
  - { key: polispec.lint.strict, type: enum, options: ["off", "on"], default: "off", scopes: [machine], description: "on or off; default off. on: a warn finding fails polispec lint (exit 1), as --strict does for one run. Description findings keep following polispec.description.strict." }
  - { key: polispec.verbose.trace, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on or off; default on. off: a verbose run (--verbose or POLISPEC_VERBOSE) streams to stderr but writes no trace file under the state home." }
  - { key: polispec.web.bind, type: string, default: 127.0.0.1, scopes: [machine], description: "Address polispec web listens on; default 127.0.0.1. Any address that is not a loopback address is refused unless polispec web is started with --expose on a TTY after the typed phrase expose polispec web." }
  - { key: polispec.web.port, type: string, default: "7421", scopes: [machine], description: "TCP port of polispec web; default 7421; 0 picks a free port." }
  - { key: polispec.web.public_origin, type: string, default: "", scopes: [machine], description: "Optional exact HTTPS origin for an external reverse proxy. Uses this origin for links, Host and Origin checks, and Secure cookies. Does not expose the listener or configure a proxy." }
  - { key: polispec.web.theme, type: enum, options: [system, light, dark, apple-noir, apple-austere, tronwave], default: system, scopes: [machine], description: "Initial theme of polispec web: system (light or dark from the browser), light, dark, apple-noir, apple-austere or tronwave; default system. The browser's own choice overrides it per viewer." }
  - { key: polispec.author.enabled, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on or off; default on. Kill switch for the author port: off (or POLISPEC_AUTHOR=off) makes every adapter raise unavailable before any process or request starts, and closes open sessions." }
  - { key: polispec.author.adapter, type: string, default: harness-cli, scopes: [machine], description: "Adapter of the author port: harness-cli (built in, default) or the id of an adapter an rplugin extension declares under adapters: author:." }
  - { key: polispec.notice, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on or off; default on. Kill switch for the in-band epoch notice the pretool hook adds once per session per epoch." }
contents:
  skills:
    - { id: polispec, path: skills/polispec/SKILL.md }
    - { id: polispec-advise, path: skills/polispec-advise/SKILL.md }
    - { id: polispec-register, path: skills/polispec-register/SKILL.md }
    - { id: polispec-specs, path: skills/polispec-specs/SKILL.md }
    - { id: polispec-uninstall, path: skills/polispec-uninstall/SKILL.md }
  agents: []
  specs:
    - { path: specs/app.yml }
  scripts: []
  docs:
    - { path: docs/cli.md }
    - { path: docs/agent-guide.md }
    - { path: docs/schema.md }
    - { path: docs/behavior.md }
    - { path: docs/code-specs.md }
    - { path: docs/harness-controls.md }
    - { path: docs/operator.md }
  hooks: hooks/polispec.hooks.yml
  rules:
    - { id: polispec, path: rules/polispec.md }
    - { id: polispec-stewardship, path: rules/polispec-stewardship.md }
compatibility:
  ruby: ">= 2.6"
  harnesses: { claude-code: supported, codex: supported, hermes: supported, pi: skills-only, deepseek-tui: skills-only, antigravity: skills-only, cowork: unsupported }
repository:
  remote: https://github.com/SteveBenner/polispec.git
  store_path: polispec

serves: real_users
polispec:
  project: polispec
  environments: specs/polispec/environments.yml
