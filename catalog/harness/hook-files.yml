schema: polispec.module/v1
name: harness-hook-files
summary: Warns on agent writes and deletes of the files Claude Code, Codex, Hermes and Antigravity load hooks, skills and agents from; every rule is overridable.
description: "This module covers the files that decide which hooks, skills and agents a harness runs beside the guard: Claude Code settings files and its skills, agents and hooks directories, the Codex config.toml and hooks.json, the Hermes config.yaml, and the Antigravity and .agents hooks.json files. An agent write to one of them is allowed by a project's development rule and by the absence of a rule in the home directory, and Claude Code applies a settings edit through its file watcher and registers a skill's hooks when the skill is invoked, so the write takes effect in the running session. While this subspec is active, every fs.write and fs.delete that reaches one of those paths warns and asks the user to confirm it, in any environment; nothing is denied, and a shelf or project rule may override any rule here by naming it."
rules:
  - { id: G-HOOK-FILE-CLAUDE-SETTINGS, match: { class: [fs.write, fs.delete], path: "**/.claude/settings*.json" }, verdict: warn, overridable: true, reason: "this file sets the hooks and permissions Claude Code runs; confirm before changing it" }
  - { id: G-HOOK-FILE-CLAUDE-SKILLS, match: { class: [fs.write, fs.delete], path: "**/.claude/skills/**/*" }, verdict: warn, overridable: true, reason: "a skill can register hooks when it is invoked; confirm before changing one" }
  - { id: G-HOOK-FILE-CLAUDE-AGENTS, match: { class: [fs.write, fs.delete], path: "**/.claude/agents/**/*" }, verdict: warn, overridable: true, reason: "an agent definition carries its own hooks and tools; confirm before changing one" }
  - { id: G-HOOK-FILE-CLAUDE-HOOKS, match: { class: [fs.write, fs.delete], path: "**/.claude/hooks/**/*" }, verdict: warn, overridable: true, reason: "this directory holds the hook scripts Claude Code runs; confirm before changing one" }
  - { id: G-HOOK-FILE-CODEX-CONFIG, match: { class: [fs.write, fs.delete], path: "**/.codex/config.toml" }, verdict: warn, overridable: true, reason: "this file sets the hooks Codex runs and which it trusts; confirm before changing it" }
  - { id: G-HOOK-FILE-CODEX-HOOKS, match: { class: [fs.write, fs.delete], path: "**/.codex/hooks.json" }, verdict: warn, overridable: true, reason: "this file sets the hooks Codex runs; confirm before changing it" }
  - { id: G-HOOK-FILE-HERMES, match: { class: [fs.write, fs.delete], path: "**/.hermes/config.yaml" }, verdict: warn, overridable: true, reason: "this file sets the hooks Hermes runs; confirm before changing it" }
  - { id: G-HOOK-FILE-ANTIGRAVITY, match: { class: [fs.write, fs.delete], path: "**/.gemini/config/hooks.json" }, verdict: warn, overridable: true, reason: "this file sets the hooks Antigravity runs; confirm before changing it" }
  - { id: G-HOOK-FILE-AGENTS, match: { class: [fs.write, fs.delete], path: "**/.agents/hooks.json" }, verdict: warn, overridable: true, reason: "this file sets the workspace hooks Antigravity runs; confirm before changing it" }
