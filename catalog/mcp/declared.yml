schema: polispec.module/v1
name: mcp-declared
summary: The MCP operations this host declares, provisioned by the operator from a file; empty in the release.
description: "This module is where the operator declares the MCP operations of the servers on this host, so that a declared operation is allowed instead of gated by the undeclared MCP spec. The release ships it with no rules, and the operator provisions its rules from a file of their own. It must never ship with a host's own server names or operations, and a provisioned copy must never be edited by hand."
rules: []
