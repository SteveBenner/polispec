schema: polispec.module/v1
name: mcp-undeclared
summary: Gates every MCP operation that no protected control or committed policy declares; while active, the call asks under the standard edition and is denied under lock.
description: "This module marks the MCP gate: it carries no rules because the mcp_undeclared gate of the catalog supplies the verdict, which asks under the standard edition and denies under lock while the spec is active. An MCP operation that no protected control or committed policy declares must never be allowed silently, and only the operator, never an agent, decides to activate or deactivate the spec."
rules: []
