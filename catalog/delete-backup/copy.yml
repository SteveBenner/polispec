schema: polispec.module/v1
name: delete-backup-copy
summary: Warns on a recursive delete of an existing directory and on any delete of a backup directory, so each is confirmed with the user; every rule is overridable.
description: "This module is the confirm-before-delete half of the delete-backup spec. G-DELETE-UNBACKED warns when a recursive rm targets an existing real directory, unless the directory is a git-ignored build folder named in delete_backup.ignored_names; an existing copy beside it does not lift the warn, and the warn never suggests making one, because a backup belongs in a backup system and not in a .backup folder next to the original. The other three rules warn on deleting a .backup directory, its contents, or a directory named backups, because a backup is deleted only on explicit confirmation."
delete_backup:
  ignored_names: [target, node_modules, dist, .next, __pycache__, .cache, build]
rules:
  - { id: G-DELETE-UNBACKED, match: { class: [fs.delete], delete_unbacked: true }, verdict: warn, overridable: true, reason: "a recursive delete of a directory is made only after the user confirms this exact path; copy nothing into a .backup folder" }
  - { id: G-DELETE-BACKUP-DIR, match: { class: [fs.delete], path: "/**/.backup" }, verdict: warn, overridable: true, reason: "a .backup directory is deleted only on explicit confirmation; confirm this exact path first" }
  - { id: G-DELETE-BACKUP-CONTENTS, match: { class: [fs.delete], path: "/**/.backup/**/*" }, verdict: warn, overridable: true, reason: "the contents of a .backup directory are deleted only on explicit confirmation; confirm this exact path first" }
  - { id: G-DELETE-BACKUPS-NAMED, match: { class: [fs.delete], path: "/**/backups" }, verdict: warn, overridable: true, reason: "a backups directory is deleted only on explicit confirmation; confirm this exact path first" }
