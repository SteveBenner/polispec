  verdict: pass
  summary: 'controls-code-specs [code baseline]: baseline refuses a non-git directory
    and records a key for a git repo (0 files, 0 entries).'
  steps:
  - run: Write projA/lib/secrets.rb with KEY = "-----BEGIN RSA PRIVATE KEY-----" (check_at
      pre_write)
    exit:
    expect: deny code.code_meta.security.no-secret-literals
    observed: hook exit 0 with permissionDecision deny, reason names projA/lib/secrets.rb:3
      [code.code_meta.security.no-secret-literals]; file absent after the session
  - run: Write projA/lib/config.rb with KEY_FILE = ENV.fetch("SERVICE_KEY_FILE") and
      the frozen string magic comment
    exit:
    expect: allow
    observed: File created successfully; empty pre output (chain already injected);
      file on disk
  - run: Edit projA/lib/config.rb replacing KEY_FILE line with the private key literal
    exit:
    expect: deny
    observed: 'PreToolUse:Edit hook error blocked: MUST violations on changed lines;
      file unchanged'
  - run: Write projB/lib/secrets.rb with the private key literal (check_at post_write)
    exit:
    expect: lands, then PostToolUse block
    observed: landed; post hook output empty (fail open); polispec code check on the
      same file exits 1 BLOCKED
  - run: polispec code-hook post --harness claude < real PostToolUse payload, with
      debug wrapper
    exit: 0
    expect: decision block
    observed: 'TELEM hook_error ''Polispec::Error: Claude hook event must be PreToolUse'';
      no output'
  - run: polispec code-hook stop and session --harness claude < real payloads
    exit: 0
    expect: handled
    observed: same hook_error for both
  - run: polispec code check scratch/bad.rb and good.rb; code controls --policy no-secret-literals;
      code validate
    exit:
    expect: 1 / 0 / OK / ok
    observed: rc=1 BLOCKED; rc=0; OK flagged and clean; ok 261 policies
