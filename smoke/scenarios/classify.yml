schema: polispec.smoke-scenario/v1
unit: commands/classify
summary: classify turns a harness tool call into action classes with the owning project and environment
fixture:
  files:
    "agents/AGENTS.md": "# Agents\n[ENVS] read the environments first\nbody\n"
  projects:
    - id: shop
      variant: service
      status: live
steps:
  - name: git push to stable is git.push on prod
    run: ["{{polispec}}", classify, --json, --cwd, "{{project.shop}}"]
    stdin: '{"tool_name":"Bash","tool_input":{"command":"git push origin main:stable"}}'
    expect:
      exit: 0
      json:
        tool_name: Bash
        actions:
          - { class: git.push, env_hint: { remote: origin, ref: stable }, raw: "git push origin main:stable", target: { project: shop, env: prod } }
  - name: git push as text
    run: ["{{polispec}}", classify, --cwd, "{{project.shop}}"]
    stdin: '{"tool_name":"Bash","tool_input":{"command":"git push origin main:stable"}}'
    expect:
      exit: 0
      stdout_includes: ["git.push", "shop@prod", "git push origin main:stable"]
  - name: rm -rf is fs.write and fs.delete in dev
    run: ["{{polispec}}", classify, --json, --cwd, "{{project.shop}}"]
    stdin: '{"tool_name":"Bash","tool_input":{"command":"rm -rf build"}}'
    expect:
      exit: 0
      json:
        actions:
          - { class: fs.write, target: { project: shop, env: dev } }
          - { class: fs.delete, target: { project: shop, env: dev } }
  - name: write outside every project has no target
    run: ["{{polispec}}", classify, --json, "--cwd", "{{files}}"]
    stdin: '{"tool_name":"Write","tool_input":{"file_path":"/tmp/smoke-nowhere/a.rb","content":"x"}}'
    expect:
      exit: 0
      json:
        actions:
          - { class: fs.write, env_hint: { path: /tmp/smoke-nowhere/a.rb }, target: null }
  - name: write inside the project is fs.write in dev
    run: ["{{polispec}}", classify, --json, --cwd, "{{project.shop}}"]
    stdin: '{"tool_name":"Write","tool_input":{"file_path":"{{project.shop}}/lib/a.rb","content":"x"}}'
    expect:
      exit: 0
      json:
        actions:
          - { class: fs.write, target: { project: shop, env: dev } }
  - name: input that is not JSON exits 2
    run: ["{{polispec}}", classify]
    stdin: "not json"
    expect:
      exit: 2
      stderr_includes: ["invalid hook JSON"]
  - name: a whole-file AGENTS.md write that keeps the environments row is fs.write
    run: ["{{polispec}}", classify, --json, --cwd, "{{files}}/agents"]
    stdin: '{"tool_name":"Write","tool_input":{"file_path":"{{files}}/agents/AGENTS.md","content":"# Agents\n[ENVS] read the environments first\nbody\nmore\n"}}'
    expect:
      exit: 0
      json:
        actions:
          - { class: fs.write }
  - name: an AGENTS.md edit that leaves the environments row alone is fs.write
    run: ["{{polispec}}", classify, --json, --cwd, "{{files}}/agents"]
    stdin: '{"tool_name":"Edit","tool_input":{"file_path":"{{files}}/agents/AGENTS.md","old_string":"body","new_string":"body two"}}'
    expect:
      exit: 0
      json:
        actions:
          - { class: fs.write }
  - name: a whole-file AGENTS.md write that changes the environments row is policy.edit
    run: ["{{polispec}}", classify, --json, --cwd, "{{files}}/agents"]
    stdin: '{"tool_name":"Write","tool_input":{"file_path":"{{files}}/agents/AGENTS.md","content":"# Agents\n[ENVS] skip the environments\nbody\n"}}'
    expect:
      exit: 0
      json:
        actions:
          - { class: policy.edit }
  - name: an AGENTS.md edit that changes the environments row is policy.edit
    run: ["{{polispec}}", classify, --json, --cwd, "{{files}}/agents"]
    stdin: '{"tool_name":"Edit","tool_input":{"file_path":"{{files}}/agents/AGENTS.md","old_string":"[ENVS] read the environments first","new_string":"[ENVS] skip"}}'
    expect:
      exit: 0
      json:
        actions:
          - { class: policy.edit }
