schema: polispec.smoke-scenario/v1
unit: commands/behavior
summary: behavior compile emits a deterministic digest, decide denies on a matching fact set, reports missing facts, and renders empty arrays as []
fixture:
  files:
    "behavior.yml": |
      schema: polispec.behavior/v1
      id: demo.app
      version: 1
      authority: { id: demo, kind: application, authentication: release }
      scope: { application: demo, spaces: [main] }
      directives:
        - { id: D1, rule: R1, when: [always], enforce: native-gate, body: Be careful. }
      parameters: { limit: 3 }
      rules:
        - id: R1
          description: deny an active admin call
          event: tool.use
          mode: declarative
          binding: gate
          failure: deny
          message_id: M-NOADMIN
          all: { role: [admin], active: [true] }
    "facts-match.json": '{"role":"admin","active":true}'
    "facts-other.json": '{"role":"guest","active":true}'
    "facts-missing.json": '{"role":"admin"}'
steps:
  - name: the behavior file validates
    run: ["{{polispec}}", validate, behavior, "{{files}}/behavior.yml", --json]
    expect:
      exit: 0
      json: { ok: true, schema: polispec.behavior/v1 }
  - name: compile emits the compiled schema and a sha256 digest
    run: ["{{polispec}}", behavior, compile, "{{files}}/behavior.yml"]
    expect:
      exit: 0
      stdout_includes: ['"schema": "polispec.behavior.compiled/v1"', '"digest": "sha256:', '"id": "demo.app"']
  - name: compile is deterministic
    run: [sh, -c, 'a=$("$0" behavior compile "$1") && b=$("$0" behavior compile "$1") && test "$a" = "$b" && echo identical', "{{polispec}}", "{{files}}/behavior.yml"]
    expect:
      exit: 0
      stdout_includes: [identical]
  - name: decide denies when every predicate matches
    run: ["{{polispec}}", behavior, decide, "{{files}}/behavior.yml", tool.use, "{{files}}/facts-match.json"]
    expect:
      exit: 0
      stdout_includes: ['"rule": "R1"', '"verdict": "deny"', '"message_id": "M-NOADMIN"', '"missing_facts": []']
  - name: decide returns no decision when a predicate does not match
    run: ["{{polispec}}", behavior, decide, "{{files}}/behavior.yml", tool.use, "{{files}}/facts-other.json"]
    expect:
      exit: 0
      stdout_includes: ['"decisions": []']
      stdout_excludes: ['"verdict"']
  - name: decide denies and names a missing fact
    run: ["{{polispec}}", behavior, decide, "{{files}}/behavior.yml", tool.use, "{{files}}/facts-missing.json"]
    expect:
      exit: 0
      stdout_includes: ['"verdict": "deny"', '"active"']
  - name: an event no rule watches yields no decision
    run: ["{{polispec}}", behavior, decide, "{{files}}/behavior.yml", other.event, "{{files}}/facts-match.json"]
    expect:
      exit: 0
      stdout_includes: ['"decisions": []']
  - name: a missing file exits 1
    run: ["{{polispec}}", behavior, compile, "{{files}}/absent.yml"]
    expect:
      exit: 1
      stderr_includes: ["No such file"]
  - name: no arguments is a usage error
    run: ["{{polispec}}", behavior]
    expect:
      exit: 2
      stderr_includes: ["usage: polispec behavior"]
