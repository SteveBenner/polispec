      stdout_includes: ["workers: 2", "listening: yes"]
  - name: stop retires the master and every worker and removes judge.json
    run: [bash, -c, '"$1" judge stop; i=0; while [ "$i" -lt 100 ]; do if [ ! -e "$2/state/judge.json" ] && [ -z "$(pgrep -f "[j]udge serve")" ]; then echo "all gone"; exit 0; fi; i=$((i+1)); sleep 0.1; done; exit 1', bash, "{{polispec}}", "{{scratch}}"]
    timeout: 40
    expect:
      exit: 0
      stdout_includes: ["all gone"]
  - name: a judge with a short idle limit exits by itself when no request arrives
    run: [bash, -c, 'st="$1/state"; rm -f "$st/judge.json" "$st/judge.spawn" "$st/judge.supervised"; printf "%s" "$3" | "$2" pretool --harness claude; i=0; while [ "$i" -lt 100 ] && [ ! -e "$st/judge.json" ]; do i=$((i+1)); sleep 0.1; done; [ -e "$st/judge.json" ] || { echo "judge did not start"; exit 1; }; i=0; while [ "$i" -lt 200 ]; do if [ ! -e "$st/judge.json" ] && [ -z "$(pgrep -f "[j]udge serve")" ]; then echo "idle exit after about $((i / 10)) s"; exit 0; fi; i=$((i+1)); sleep 0.1; done; exit 1', bash, "{{scratch}}", "{{tree}}/bin/polispec-guard", "{\"hook_event_name\":\"PreToolUse\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git status\"},\"cwd\":\"{{project.shop}}\",\"session_id\":\"idle-short\"}"]
    env: { POLISPEC_BIN: "{{files}}/polispec", POLISPEC_JUDGE_WORKERS: "2", POLISPEC_JUDGE_IDLE: "3" }
    timeout: 60
    expect:
      exit: 0
      stdout_includes: ["idle exit after about"]
  - name: a judge systemd started (SYSTEMD_EXEC_PID is its own pid) records its pid in judge.supervised and removes it on stop
    run: [bash, -c, 'st="$1/state"; rm -f "$st/judge.json" "$st/judge.spawn" "$st/judge.supervised"; sh -c "export SYSTEMD_EXEC_PID=\$\$; exec \"\$0\" judge serve </dev/null >/dev/null 2>&1" "$2" & i=0; while [ "$i" -lt 150 ] && [ ! -e "$st/judge.supervised" ]; do i=$((i+1)); sleep 0.1; done; pid="$(sed -n "s/.*\"pid\":\([0-9]*\).*/\1/p" "$st/judge.json" 2>/dev/null)"; sup="$(cat "$st/judge.supervised" 2>/dev/null)"; [ -n "$pid" ] && [ "$pid" = "$sup" ] && echo "supervised $pid"; "$2" judge stop >/dev/null; i=0; while [ "$i" -lt 100 ]; do if [ ! -e "$st/judge.supervised" ] && [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null && [ -z "$(pgrep -P "$pid")" ]; then echo "marker removed on stop"; exit 0; fi; i=$((i+1)); sleep 0.1; done; exit 1', bash, "{{scratch}}", "{{polispec}}"]
    env: { POLISPEC_JUDGE_WORKERS: "2", POLISPEC_JUDGE_IDLE: "0", INVOCATION_ID: "smoke" }
    timeout: 60
    expect:
      exit: 0
      stdout_includes: ["supervised ", "marker removed on stop"]
