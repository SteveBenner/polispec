      stdout_includes: ["spawned a judge"]
  - name: a judge started with POLISPEC_JUDGE_IDLE=0 is still listening after sitting idle
    run: [bash, -c, 'sleep 4; "$1" judge status', bash, "{{polispec}}"]
    expect:
