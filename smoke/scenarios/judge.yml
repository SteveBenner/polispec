    run: [bash, -c, 'log="$1/state/judge.log"; total="$(wc -l <"$log")"; missing="$(grep -vc "\"fresh_ms\":.*\"judge_ms\":.*\"worker\":[0-9]" "$log" || true)"; echo "records=$total missing=${missing:-0}"; [ "$total" -gt 0 ] && [ "${missing:-0}" = 0 ]', bash, "{{scratch}}"]
