schema: polispec.smoke-scenario/v1
unit: commands/web
summary: polispec web starts on an ephemeral loopback port and prints a one-time link; the code is exchanged once for a session, config and map are read, a tightening plan is created and applied through POST /plans and /plans/:id/apply, a loosening plan without confirm gets 422, a mutating call without the CSRF header or the Origin is refused, the server is stopped by its pid and its port is free; an agent line that posts to the web API warns with G-WEB-AGENT; a release without the web command skips the drive
fixture:
  catalog: [tools]
  global: example
  files:
    "web/drive.rb": |
      require "json"
      require "net/http"
      require "timeout"

      polispec = ARGV.fetch(0)

      help = IO.popen([polispec, "web", "--help", err: [:child, :out]], &:read).to_s
      unless help.start_with?("usage: polispec web")
        puts "web smoke skipped: this release has no web command"
        exit 0
      end

      class Client
        def initialize(port)
          @port = port
          @cookie = nil
          @csrf = nil
        end

        def request(verb, path, body = nil, origin: true, csrf: true)
          klass = { "GET" => Net::HTTP::Get, "POST" => Net::HTTP::Post }.fetch(verb)
          req = klass.new("/api/v1#{path}")
          req["Origin"] = "http://127.0.0.1:#{@port}" if origin
          req["Cookie"] = @cookie if @cookie
          req["X-Polispec-CSRF"] = @csrf if @csrf && csrf
          unless body.nil?
            req["Content-Type"] = "application/json"
            req.body = JSON.generate(body)
          end
          res = Net::HTTP.start("127.0.0.1", @port, read_timeout: 60) { |http| http.request(req) }
          @cookie = res["Set-Cookie"].split(";").first if res["Set-Cookie"]
          parsed = begin
            JSON.parse(res.body.to_s)
          rescue JSON::ParserError
            {}
          end
          [res.code.to_i, parsed]
        end

        def login(code)
          status, body = request("POST", "/session", { "code" => code })
          @csrf = body["csrf"]
          status
        end
      end

      def check(label, ok, detail = nil)
        puts "#{ok ? 'ok' : 'FAIL'} #{label}#{detail ? " (#{detail})" : ''}"
        $failed = true unless ok
      end

      $failed = false
      port = nil
      reader, writer = IO.pipe
      pid = Process.spawn(polispec, "web", "--port", "0", "--json", in: File::NULL, out: writer, err: File::NULL)
      writer.close

      begin
        line = Timeout.timeout(30) { reader.gets }
        info = JSON.parse(line.to_s)
        port = info["port"]
        code = info["url"].to_s[/#k=(.+)\z/, 1]
        check("server announced a loopback port and a one-time code", port.is_a?(Integer) && port.positive? && !code.nil? && info["pid"] == pid)

        client = Client.new(port)
        check("the code is exchanged for a session", client.login(code) == 200)
        check("the same code is refused a second time", Client.new(port).login(code) == 401)

        status, config = client.request("GET", "/config")
        check("config reads the standard edition", status == 200 && config["edition"] == "standard", "edition #{config['edition']}")
        status, map = client.request("GET", "/map")
        shop = Array(map["entries"]).find { |entry| entry["id"] == "shop" }
        check("map lists the shop project", status == 200 && !shop.nil? && shop["kind"] == "project")

        status, source = client.request("GET", "/rulebooks/project/shop/source")
        yaml = source["yaml"].to_s
        check("shop policy source is readable", status == 200 && yaml.include?("rules:"))

        added = "  - { id: R-SMOKE-DEV-SECRET, match: { env: dev, class: [secrets.read] }, verdict: deny, reason: \"smoke: secrets are not read in dev\" }\n"
        tightened = yaml.sub(/^rules:\n/) { "rules:\n#{added}" }
        target = { "kind" => "project", "id" => "shop" }
        status, plan = client.request("POST", "/plans", { "target" => target, "change" => { "kind" => "replace", "yaml" => tightened } })
        check("a tightening plan needs no typed id", status == 200 && plan["classification"] == "tightening" && plan["needs_confirm"] == false, plan["classification"])
        status, applied = client.request("POST", "/plans/#{plan['plan_id']}/apply", {})
        check("the tightening plan applies on one call", status == 200 && applied["plan_id"] == plan["plan_id"] && applied["change_id"].to_s.start_with?("chg_"), applied["change_id"])
        check("the apply hands the stable promotion to the operator as a command", applied["operator_command"] == "polispec promote shop --to stable", applied["operator_command"])
        status, again = client.request("POST", "/plans/#{plan['plan_id']}/apply", {})
        check("applying the same plan again is a conflict", status == 409 && again["error"] == "conflict")

        status, after = client.request("GET", "/rulebooks/project/shop/source")
        check("the manager edits main, which is ahead of the trust ref until the operator promotes", status == 200 && after["ref"].to_s.start_with?("main@") && after["trust_ref"].to_s.start_with?("stable") && after["ahead"].to_i >= 1 && after["yaml"].to_s.include?("R-SMOKE-DEV-SECRET"), after["ref"])

        loosened = after["yaml"].to_s.lines.reject { |row| row.include?("R-PROD-SECRET") }.join
        status, loose = client.request("POST", "/plans", { "target" => target, "change" => { "kind" => "replace", "yaml" => loosened } })
        check("a plan that loosens is classified against the trust ref and needs its id typed", status == 200 && %w[loosening mixed].include?(loose["classification"]) && loose["needs_confirm"] == true, loose["classification"])
        status, refused = client.request("POST", "/plans/#{loose['plan_id']}/apply", {})
        check("a loosening plan without confirm gets 422", status == 422 && refused["error"] == "confirm_required", "status #{status}")
        status, wrong = client.request("POST", "/plans/#{loose['plan_id']}/apply", { "confirm" => "plan_000000000000000000000000" })
        check("a loosening plan with another plan id gets 409", status == 409 && wrong["error"] == "conflict", "status #{status}")

        body = { "target" => target, "change" => { "kind" => "replace", "yaml" => loosened } }
        status, = client.request("POST", "/plans", body, csrf: false)
        check("a mutating call without the CSRF header is refused", status == 403)
        status, = client.request("POST", "/plans", body, origin: false)
        check("a mutating call without an Origin is refused", status == 403)
      ensure
        begin
          Process.kill("TERM", pid)
          Timeout.timeout(20) { Process.wait(pid) }
        rescue Errno::ESRCH, Errno::ECHILD
          nil
        rescue Timeout::Error
          Process.kill("KILL", pid)
          Process.wait(pid)
        end
        reader.close
      end

      stopped = begin
        Process.kill(0, pid)
        false
      rescue Errno::ESRCH
        true
      end
      check("the server is stopped", stopped)
      free = begin
        Net::HTTP.start("127.0.0.1", port, open_timeout: 2) { |http| http.get("/") }
        false
      rescue SystemCallError, Net::OpenTimeout
        true
      end
      check("the port is free", free)

      puts($failed ? "web smoke failed" : "web smoke ok")
      exit($failed ? 1 : 0)
  projects:
    - id: shop
      variant: service
      status: live
steps:
  - name: the drive starts a server, exchanges a code, reads, plans, applies and stops the server
    run: [ruby, "{{files}}/web/drive.rb", "{{polispec}}"]
    timeout: 120
    parity: ignore
    expect:
      exit: 0
      stdout_includes:
        - "ok server announced a loopback port and a one-time code"
        - "ok the code is exchanged for a session"
        - "ok the same code is refused a second time"
        - "ok config reads the standard edition"
        - "ok map lists the shop project"
        - "ok a tightening plan needs no typed id"
        - "ok the tightening plan applies on one call"
        - "ok applying the same plan again is a conflict"
        - "ok the apply hands the stable promotion to the operator as a command"
        - "ok the manager edits main, which is ahead of the trust ref until the operator promotes"
        - "ok a plan that loosens is classified against the trust ref and needs its id typed"
        - "ok a loosening plan without confirm gets 422"
        - "ok a loosening plan with another plan id gets 409"
        - "ok a mutating call without the CSRF header is refused"
        - "ok a mutating call without an Origin is refused"
        - "ok the server is stopped"
        - "ok the port is free"
        - "web smoke ok"
      stdout_excludes:
        - "FAIL "
        - "web smoke failed"
  - name: an agent line that posts to the web API warns with G-WEB-AGENT
    parity: ignore
    hook:
      event: pretool
      harness: claude
      tool: Bash
      cwd: "{{project.shop}}"
      input:
        command: "curl -s -X POST http://127.0.0.1:7421/api/v1/plans/plan_000000000000000000000000/apply"
    expect:
      decision: ask
      rule: G-WEB-AGENT
