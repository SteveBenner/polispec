schema: polispec.smoke-scenario/v1
unit: harness_controls
summary: source and dot with a static readable file are followed like a script file, so the sourced commands carry their own verdicts and the file's variables and cd reach the rest of the line, while a dynamic operand, a missing file, an unknown-content write to the file and a same-line cp, mv or sed -i of the followed file stay opaque
requires: [harness_controls]
fixture:
  enforce: enforce
  global: files
  global_files:
    "global.yml": "schema: polispec.global/v1\nsummary: Smoke baseline with one rule so every path is governed.\nrules:\n  - { id: SMOKE-NOSECRETS, match: { class: [secrets.read], env: prod }, verdict: deny, reason: \"smoke baseline: no production secrets\" }\n"
  projects:
    - id: shop
      variant: service
      status: live
      files:
        "README.md": "shop\n"
        "plain.sh": "export A=1\nexport B=2\n"
        "target.sh": "export T=~/.ssh\n"
        "danger.sh": "rm -rf ~/.ssh\n"
        "outer.sh": ". ./danger.sh\n"
        "cdenv.sh": "cd build\n"
        "loop.sh": ". ./loop.sh\n"
        "evil.sh": "rm -rf ~/.ssh\n"
steps:
  - name: an inline export line alone is not positively classified and asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "export A=1" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: dot of an export-only file gets the verdict of the inline export
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". {{project.shop}}/plain.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: cd then source of an export-only file gets the verdict of the inline export
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "cd {{project.shop}} && source ./plain.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: a followed export-only file leaves the read-only command after it allowed
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". ./plain.sh; echo $A" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: allow }
  - name: a followed file does not hide a command that is still opaque after it
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". ./plain.sh; eval \"$X\"" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: a variable set by the sourced file reaches the delete that follows
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". ./target.sh; rm -rf $T/x" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: deny, rule: G-DELETE-PROTECTED }
  - name: the same delete with the variable set inline is denied the same way
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "T=~/.ssh; rm -rf $T/x" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: deny, rule: G-DELETE-PROTECTED }
  - name: a deny-tier command inside the sourced file is denied
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "source ./danger.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: deny, rule: G-DELETE-PROTECTED }
  - name: a source nested inside a sourced file is followed
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". ./outer.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: deny, rule: G-DELETE-PROTECTED }
  - name: a cd inside the sourced file carries into the rest of the line
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". ./cdenv.sh; rm -rf ./x" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: allow }
  - name: a file that sources itself exhausts the depth and asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". ./loop.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: a dynamic operand asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: ". $ENVFILE" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: a missing file asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "source ./absent.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: a file written by an echo redirect on the same line asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "echo x > env.sh; . env.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: eval stays opaque
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "eval \"$X\"" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: cp over the sourced file on the same line asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "cp README.md plain.sh; . plain.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: mv over the sourced file on the same line asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "mv README.md plain.sh; . plain.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: sed -i of the sourced file on the same line asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "sed -i s/1/2/ plain.sh; . plain.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
  - name: cp over a script run by bash on the same line asks
    hook: { harness: claude, event: pretool, tool: Bash, input: { command: "cp evil.sh plain.sh; bash plain.sh" }, cwd: "{{project.shop}}" }
    home: true
    expect: { decision: ask, rule: POLISPEC-TOOL-UNKNOWN }
