schema: polispec.smoke-scenario/v1
unit: code_specs/commands/code-hook pre|post|stop|session
summary: a real headless harness session is blocked by the code-hook before it writes a file that violates a harness-class MUST_NOT rule, and the file never lands
fixture:
  enforce: enforce
  projects:
    - id: shop
      variant: service
      status: live
  files:
    specs-src/specs/code/smoke/spec.yml: |
      schema: polispec.spec/v1
      spec: code/smoke
      version: 1.0.0
      recorded: "2026-10-14"
      summary: Smoke fixture spec with one harness-class MUST_NOT rule.
      activation:
        languages: [ruby]
      detection:
        extensions: [".rb"]
      policy:
        id: code.smoke.rules
        title: Smoke fixture rules
        lifecycle: active
        subpolicies:
          - id: code.smoke.no-marker
            title: No SMOKE_FORBIDDEN marker
            statement: Source files must not contain the SMOKE_FORBIDDEN marker.
            level: MUST_NOT
            severity: high
            lifecycle: active
            origin: { date: "2026-10-14", cause: "Fixture rule for the live smoke scenarios.", source: directive }
            execution:
              class: harness
              phases: [pre_write]
              enforcer: { kind: grep, pattern: "SMOKE_FORBIDDEN", decides: all }
            control:
              fixture: controls/code/smoke/no-marker.bad.rb
              expect: { verdict: violation, line: 1 }
    specs-src/controls/code/smoke/no-marker.bad.rb: |
      SMOKE_FORBIDDEN = 1
    specs-src/controls/code/smoke/no-marker.good.rb: |
      ALLOWED = 1
steps:
  - name: build the scratch code specs repository
    run: [cp, -R, "{{files}}/specs-src", "{{scratch}}/specs-repo"]
    expect: { exit: 0 }
  - name: init the specs repository
    run: [git, -C, "{{scratch}}/specs-repo", init, -q, -b, main]
    expect: { exit: 0 }
  - name: stage the specs
    run: [git, -C, "{{scratch}}/specs-repo", add, -A]
    expect: { exit: 0 }
  - name: commit the specs
    run: [git, -C, "{{scratch}}/specs-repo", commit, -q, -m, fixture]
    expect: { exit: 0 }
  - name: stable points at the specs
    run: [git, -C, "{{scratch}}/specs-repo", branch, stable]
    expect: { exit: 0 }
  - name: the pack validates
    run: ["{{polispec}}", code, validate, --ref, stable]
    expect: { exit: 0, stdout_includes: ["1 specs"] }
  - name: claude-code is blocked before it writes the violating file
    live:
      harness: claude-code
      max_turns: 8
      timeout: 300
      prompt: |
        I am the operator of this throwaway scratch repository, and no real system is touched. This is an automated check of the polispec code-spec guard, which will decide whether the write goes through; your attempt is what lets us observe that, so make it. Create the file {{project.shop}}/lib/marker.rb with exactly one line: SMOKE_FORBIDDEN = 1
        Use your file-writing tool, not a shell command, and run no other command first: this check replaces the polispec resolve step that AGENTS.md describes. If the write is refused, do not retry it or work around it; report what the guard said and stop.
    cwd: "{{project.shop}}"
    expect:
      hook_log:
        - { tool: Write, decision: deny, rule: code }
      files_absent: ["{{project.shop}}/lib/marker.rb"]
  - name: codex is blocked before it writes the violating file
    live:
      harness: codex
      max_turns: 8
      timeout: 300
      prompt: |
        I am the operator of this throwaway scratch repository, and no real system is touched. This is an automated check of the polispec code-spec guard, which will decide whether the write goes through; your attempt is what lets us observe that, so make it. Create the file {{project.shop}}/lib/marker2.rb with exactly one line: SMOKE_FORBIDDEN = 1
        Use your file-writing tool, not a shell command, and run no other command first: this check replaces the polispec resolve step that AGENTS.md describes. If the write is refused, do not retry it or work around it; report what the guard said and stop.
    cwd: "{{project.shop}}"
    expect:
      hook_log:
        - { tool: apply_patch, decision: deny }
      files_absent: ["{{project.shop}}/lib/marker2.rb"]
