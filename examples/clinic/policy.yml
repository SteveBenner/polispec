schema: polispec.policy/v1
project: "clinic"
recorded: "2026-10-14"
summary: "clinic serves patients. Agents work freely on main, promote to test through checks, and never touch the live app; only the operator promotes to stable, after a soak and outside clinic hours."
includes:
  - patient-data
  - { module: release-train, with: { soak_hours: 24, calendar: [bin/clinic-calendar, open-hours, --json], lead_minutes: 60 } }
rules:
  - { id: R-PROD-GIT, match: { env: prod, class: [git.commit, git.push, git.tag, git.merge, git.rewrite, git.branch, release.publish] }, verdict: deny, reason: "stable is the live booking app; only the operator moves it with `polispec promote clinic --to stable`" }
  - { id: R-PROD-SVC, match: { env: prod, class: [service.control, service.config, deploy, promote] }, verdict: deny, reason: "the live app changes only through the operator" }
  - { id: R-PROD-FS, match: { env: prod, class: [fs.write] }, verdict: deny, reason: "the live checkout is not edited by agents" }
  - { id: R-PROD-DATA, match: { env: prod, class: [data.write] }, verdict: warn, reason: "real patient bookings" }
  - { id: R-TEST-DIRECT, match: { env: test, class: [git.push, git.merge, git.commit, git.tag] }, verdict: deny, reason: "test moves only through `polispec promote clinic --to test`" }
  - { id: R-TEST-REWRITE, match: { env: test, class: [git.rewrite] }, verdict: deny, reason: "test history is never rewritten" }
  - { id: R-TEST-PROMOTE, match: { env: test, class: [promote] }, verdict: allow, requires: gates.to_test }
  - { id: R-TEST-OPS, match: { env: test, class: [deploy, service.control, data.write, fs.write] }, verdict: allow }
  - { id: R-POLICY, match: { class: [policy.edit] }, verdict: warn, reason: "policy files take effect only after the operator promotes them to stable" }
  - { id: R-DEV-REWRITE, match: { env: dev, class: [git.rewrite], ref: main }, verdict: warn, reason: "main is shared history" }
  - { id: R-DEV, match: { env: dev }, verdict: allow }
promotion:
  to_test:
    from: main
    actor: [agent, operator]
    fast_forward_only: true
    requires_version_bump: true
    tag: "v{VERSION}"
    gates:
      - { id: G-CLEAN, builtin: clean_tree }
      - { id: G-VHOMES, builtin: version_homes_agree }
    after: ["polispec deploy {project} test"]
  to_stable:
    from: test
    actor: [operator]
    fast_forward_only: true
    phrase: "promote {project} to stable"
    gates:
      - { id: G-FREEZE, builtin: not_frozen }
    after: ["polispec deploy {project} stable --tag v{VERSION}"]
freezes:
  - { id: F-MANUAL, applies_to: [promote.to_stable], rrule: null, from: null, until: null }
data_classes:
  patient_records: { allowed_in: [prod] }
  keys: { allowed_in: [prod] }
  deidentified: { allowed_in: [test, dev] }
  synthetic: { allowed_in: [dev, test, prod] }
  operational: { allowed_in: [dev, test, prod] }
observability: { events: local, digest: daily }
agents:
  instructions:
    - "clinic serves patients. Ship to main, promote with `polispec promote clinic --to test`; only the operator promotes to stable."
