schema: polispec.environments/v1
project: "widget"
recorded: "2026-10-09"
summary: "widget is a distributed plugin. Environments: main is dev, test is the persistent instance, stable is production."
environments:
  dev:
    branch: main
    checkout: repo
    tier: dev
    worktrees: [".widget-wt/*"]
    audience: [operator]
    exposure: loopback
    data_classes: [synthetic, operational]
  test:
    branch: test
    checkout: "~/.polispec/envs/widget/test"
    tier: test
    audience: [operator]
    exposure: none
    data_classes: [synthetic, operational]
    operators: [agent, operator]
  prod:
    branch: stable
    checkout: "~/.polispec/envs/widget/stable"
    tier: prod
    runs: tag
    audience: [users]
    exposure: none
    data_classes: [operational]
    operators: [operator]
    rollback: "polispec deploy widget stable --tag vPREV"
