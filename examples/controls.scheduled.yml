schema: polispec.control/v1
controls:
  - id: ctl_scheduled_write_guard
    trigger: pre_tool
    action: fs.write
    match:
      path: /tmp/polispec-control-fixtures/*
    effect: deny
    reason: Protect the synthetic fixture directory.
    fixture:
      input:
        tool_name: Write
        tool_input:
          file_path: /tmp/polispec-control-fixtures/fixture.txt
          content: "polispec fixture\n"
        cwd: /tmp/polispec-control-fixtures
        action: fs.write
      expected: deny
  - id: ctl_scheduled_verify
    trigger: schedule
    calendar: "*-*-* 04:30:00"
    target_control_id: ctl_scheduled_write_guard
    effect: verify
    reason: Recheck the synthetic denial fixture.
