schema: is.v1
metadata:
  name: polispec proof cells, one scenario per feature and the chosen targets
  slug: proof-cells
  version: 0.1.0
  created: '2026-10-27'
  status: accepted
  base_commit: 417ce44
  base_version: 0.50.0
  intended_release: 0.50.1
  contract: specs/app.yml#proof
  worker: {harness: claude-code, agent: coding-worker, note: "AGENTS.md Part T: the primary wrote this blueprint and owns specs/features.yml, the app spec, docs, version and changelog; workers write only the scenario files they own"}
  decisions_by_sven:
    - "Write scenarios now: every feature in polispec's specs/features.yml that borrows another feature's smoke unit gets its own scenario before the gate goes to enforce."
    - "Targets: linux-x86-64-ruby3.3 (this host), linux-x86-64-ruby4.0 (~/.rubies/ruby-4.0.6), macos-arm64, and a harness split (claude-code, codex) carried only by harness-specific features."
vision:
  problem: >-
    Seventeen of polispec's 68 features run another feature's scenario as their smoke command, so their proof records would
    prove a different unit than the one their digest covers, and the manifest names a single target.
  outcome: >-
    Each of the seventeen features runs its own scenario whose unit is its own app.yml node. The manifest declares five targets;
    the three features with live harness scenarios run them on the claude-code and codex targets at rung 3.
  non_goals:
    - Any change to lib/, schemas/, modules/ or packages/.
    - Changing any existing scenario's steps or expectations.
    - Running live harness sessions inside a fixture scenario.
constraints:
  - Work only in /home/sven/github/foss/.polispec-wt/proof-cells (branch proof-cells). Never touch the pinned runtime, ~/.ai, the live clone /home/sven/github/foss/polispec, the real ledger, shelf, settings or state home.
  - "Scenarios are polispec.smoke-scenario/v1 (schemas/smoke-scenario.v1.yml; docs/smoke.md 'The bundled suite'). Model them on the existing files in smoke/scenarios/, especially stewardship.yml, harness.yml, harness-uninstall.yml, deployment-receipts.yml, editions.yml, effect.yml, hook-pretool-session.yml, resolve.yml and code-commands.yml. Use only the placeholders and step kinds those files use ({{polispec}}, {{tree}}, {{scratch}}, {{project.<id>}}, run, hook, cwd, env, expect)."
  - "The unit field is the exact app.yml node path given per scenario below, so Smoke.resolve_node resolves it; check with bin/polispec validate smoke-scenario FILE."
  - "A scenario exercises its own command for real against the fixture: its read verbs, its dry runs, its refusals (no TTY, missing input, unknown id) with the error code text, and its writes where they stay inside the fixture or scratch. It never needs a TTY, the network, a real harness, a sealed plane, sudo or the operator's real state."
  - "Each scenario finishes in under 60 seconds on this host and passes with bin/polispec smoke run --unit '<unit>' --no-record --out <scratchpad dir>. Expectations assert behaviour the app.yml node and the command's usage promise, not incidental output."
  - "No comments in YAML beyond what existing scenarios carry (they carry none). No new test helpers, fixtures or files outside the owned scenario files."
  - "Every manual run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER, POLISPEC_HOME, POLISPEC_GLOBAL and POLISPEC_SETTINGS to scratch paths under /home/sven/.cache/claude-code-tmp/claude-1000/-home-sven-github-foss-polispec/2ed535f2-2b61-41d5-8fe0-75b7e2250754/scratchpad; never redirect XDG_STATE_HOME. Scratchpad writes need a leading `ulimit -f 131072;`. smoke run itself redirects these for its steps."
  - "If a command cannot be exercised without something forbidden above, assert its refusal or dry-run path and say so in the report; never weaken an assertion to make a step pass, and never change lib/ to make a scenario pass: report the defect instead."
surfaces:
  test_machinery:
    - smoke/scenarios/replay.yml
    - smoke/scenarios/shadow.yml
    - smoke/scenarios/pin.yml
    - smoke/scenarios/install-uninstall.yml
    - smoke/scenarios/uninstall-all-restore.yml
    - smoke/scenarios/deployments.yml
    - smoke/scenarios/ledger-init.yml
    - smoke/scenarios/settings.yml
    - smoke/scenarios/code-code-hook-specs.yml
    - smoke/scenarios/explain.yml
    - smoke/scenarios/exceptions.yml
    - smoke/scenarios/plane.yml
    - smoke/scenarios/authorizations.yml
    - smoke/scenarios/judge.yml
    - smoke/scenarios/delegate.yml
    - smoke/scenarios/changes.yml
    - smoke/scenarios/sessions.yml
  manifest: specs/features.yml (primary)
scenarios:
  replay: {unit: "commands/replay", cover: "replay --runtime {{tree}} over a judgment stream the scenario creates with hook steps compares rows and reports 0 changed with exit 0; --days and --json shape; usage error exit 2; a missing runtime tree is refused"}
  shadow: {unit: "commands/shadow", cover: "shadow status with none running; shadow start --runtime {{tree}}; status shows it; a hook step is shadow-judged; report lists the comparison; stop; status after stop"}
  pin: {unit: "commands/pin", cover: "pin --dry-run --source {{tree}} with POLISPEC_HOME or the data home in scratch reports what it would archive and swap without writing; a --ref whose VERSION does not match is refused; --json shape"}
  install-uninstall: {unit: "commands/install, uninstall", cover: "install --harness claude and codex at --scope project --project {{project.x}}, --dry-run first then real; hooks and skill links appear in the fixture project's settings and config; a foreign hook already present is kept; uninstall removes only polispec's marked entries; --dry-run writes nothing"}
  uninstall-all-restore: {unit: "commands/uninstall --all, restore", cover: "uninstall --all --dry-run lists what it would remove; the real run without a TTY is refused naming the phrase; restore --list (empty and after a backup exists); restore of an unknown id is refused; restore --dry-run"}
  deployments: {unit: "commands/deployments", cover: "deployments on an empty manifest; --scan writes backfilled entries for fixture deployments; a second read shows them; --json shape; without --scan nothing is written"}
  ledger-init: {unit: "commands/ledger init", cover: "with POLISPEC_LEDGER pointing at a missing file, --dry-run writes nothing; the real run writes a 0600 ledger in a 0700 directory with projects: [] that validates; a second run keeps the existing ledger untouched"}
  settings: {unit: "commands/settings", cover: "list names each value's source; set a known key, get returns it with source file; unset restores the default; an unknown key and an invalid value are refused; --json shape (POLISPEC_SETTINGS in scratch)"}
  code-code-hook-specs: {unit: "commands/code, code-hook, specs", cover: "the three verb families dispatch: code and specs with no subcommand print usage, a benign read of each (code show or detect on a fixture project, specs status), code-hook with an unknown event is refused; complements, does not repeat, the code_specs/commands scenarios"}
  explain: {unit: "commands/explain", cover: "explain --harness claude < hook-json for a push to stable denies with its rule; explain Bash 'git status' in dev allows; explain Write <path> on a policy file warns R-POLICY; --json carries the matched rules per layer; explain writes no judgment row"}
  exceptions: {unit: "commands/exceptions", cover: "exceptions list empty and --json; add, promote and remove without a TTY are refused naming the phrase; promote of an unknown proposal id is refused"}
  plane: {unit: "commands/plane", cover: "plane status and verify on an unsealed fixture host (no plane); activate --dry-run and rollback --dry-run of an unknown operation are refused or describe without acting; --json shape; nothing is written"}
  authorizations: {unit: "commands/authorizations", cover: "authorizations status with no service; unit renders a unit file to stdout without installing; recover with nothing to recover; usage on an unknown verb"}
  judge: {unit: "commands/judge", cover: "judge status with no judge; a launcher step (bin/polispec-guard) starts the resident judge in the scratch state home; status shows the pid and the answering port; stop sends TERM and status then shows none"}
  delegate: {unit: "commands/delegate", cover: "delegate list empty; grant an app with projects, verbs and targets; list shows it with --json; unit renders without installing; status; revoke; list empty again; an unknown verb in grant is refused"}
  changes: {unit: "commands/changes", cover: "changes list --since on a fresh state home; hook steps that write in a fixture project record a change; list shows it; show <id> prints it; show of an unknown id is refused; verify passes; await <id> with a short --timeout returns"}
  sessions: {unit: "commands/sessions", cover: "sessions list with none; session-start and pretool hook steps with a session id register a session; sessions list --active 1h shows it with --json"}
slices:
  - id: scenarios-a
    owns_paths: [smoke/scenarios/replay.yml, smoke/scenarios/shadow.yml, smoke/scenarios/pin.yml, smoke/scenarios/install-uninstall.yml, smoke/scenarios/uninstall-all-restore.yml, smoke/scenarios/deployments.yml]
    deliverable: the six scenarios replay, shadow, pin, install-uninstall, uninstall-all-restore, deployments
    acceptance: "each validates with bin/polispec validate smoke-scenario and passes with bin/polispec smoke run --unit '<unit>' --no-record"
  - id: scenarios-b
    owns_paths: [smoke/scenarios/ledger-init.yml, smoke/scenarios/settings.yml, smoke/scenarios/code-code-hook-specs.yml, smoke/scenarios/explain.yml, smoke/scenarios/exceptions.yml, smoke/scenarios/plane.yml]
    deliverable: the six scenarios ledger-init, settings, code-code-hook-specs, explain, exceptions, plane
    acceptance: "each validates with bin/polispec validate smoke-scenario and passes with bin/polispec smoke run --unit '<unit>' --no-record"
  - id: scenarios-c
    owns_paths: [smoke/scenarios/authorizations.yml, smoke/scenarios/judge.yml, smoke/scenarios/delegate.yml, smoke/scenarios/changes.yml, smoke/scenarios/sessions.yml]
    deliverable: the five scenarios authorizations, judge, delegate, changes, sessions
    acceptance: "each validates with bin/polispec validate smoke-scenario and passes with bin/polispec smoke run --unit '<unit>' --no-record"
  - id: manifest
    owner: primary
    depends_on: [scenarios-a, scenarios-b, scenarios-c]
    deliverable: "specs/features.yml: targets linux-x86-64-ruby3.3 {os: ubuntu, arch: x86_64, ruby: '3.3'}, linux-x86-64-ruby4.0 {os: ubuntu, arch: x86_64, ruby: '4.0'}, macos-arm64 {os: macos, arch: arm64}, claude-code {harness: claude-code}, codex {harness: codex}; every feature without a live scenario lists targets [linux-x86-64-ruby3.3, linux-x86-64-ruby4.0, macos-arm64]; commands.hook-pretool-session, code-specs.commands.code-hook-pre-post-stop-session and harness-controls run on all five with per_target claude-code and codex running smoke run --unit <unit> --live <harness> --no-record at rung 3; the seventeen features run --unit <own node> and own their new scenario path"
    acceptance: "bin/polispec proof status prints 68 features over their targets and unmapped: none"
verification:
  checks: "YAML load and bin/polispec validate smoke-scenario on every new scenario; bin/polispec lint --shipped (only the known findings)"
  smoke: "bin/polispec smoke run --no-record, then --against the pinned runtime (polispec doctor names it) --no-record with --out under the scratchpad; every scenario passes; every diff is runtime kind, ids, paths, the version line or a new scenario"
