schema: is.v1
metadata:
  name: polispec scratch size cap
  slug: scratch-cap
  version: 0.1.0
  created: '2026-10-22'
  status: accepted
  base_commit: 300be1b
  base_version: 0.38.0
  intended_release: 0.39.0
  contract: specs/app.yml#scratch_cap
  worker: {harness: claude-code, agent: coding-worker, note: "AGENTS.md Part T: the primary wrote this blueprint and verifies; the worker implements every slice"}
  decisions_by_sven:
    - "The cap is enforced by polispec rules, not by a Claude hook or a bash-dispatch rewrite."
    - "Ship first: hardening-2 rebases over shapes.rb, engine.rb, docs/schema.md and CHANGELOG.md."
    - "Scope of the ulimit requirement: named bulk writers only (tar create, zip, 7z, pg_dump, mysqldump, ffmpeg, curl -o, wget, cp, rsync, dd, git archive and bundle) and redirects fed by them, not every shell write."
    - "Verdicts: no ulimit -f on a bulk write into scratch denies; a declared ulimit -f above the cap warns; a write tool call over the cap warns."
    - "Tree budget: 2 GiB per tree, bulk writes only, a warn. The cap is 128 MiB per file."
vision:
  problem: >-
    Agents leave very large files in scratch directories (four 215 MB smoke tarballs in one repo .scratch, a 201 MB PDF
    and a 210 MB recording under the Claude temp root; 9.2 GB there in 308,515 files). polispec has no size predicate, and
    tar czf X is not even a write to it: Fs.archive reads the archive name only from a separate -f X, so the usual bundled
    form produces no action at all.
  outcome: >-
    polispec gains four match keys (bytes_over, fsize_unset, fsize_above, tree_over), one shape (bulk_write) and two action
    hints (bytes on write-tool fs.write actions, fsize_blocks on shell fs.write actions), and the classifier sees the
    outputs of tar, zip, 7z, ffmpeg, mysqldump, pg_dump and git archive or bundle. polispec ships no rule: a shelf module
    carries the caps. Verdicts change only for tar, zip, 7z, ffmpeg, mysqldump, pg_dump -f, git archive and git bundle
    lines (they now yield an fs.write) and for rules that use the new keys.
  non_goals:
    - Any shipped rule, any new setting, any new verb, any change to the judgment record schema.
    - Rewriting a command, or enforcing a size in polispec itself: the cap holds because the deny makes the agent write ulimit -f.
    - Codex apply_patch content sizes.
    - Harness-control language keys: the four keys are not added to MATCH_KEYS or DYNAMIC_MATCH_KEYS in harness_controls/language.rb or to control.v1.yml, except the bulk_write shape name in control.v1.yml's shape enum.
    - Resolving a limit the parser cannot read: it counts as unlimited.
constraints:
  - Ruby standard library only. Keep the two-line header (shebang, SPDX) every lib file carries.
  - No comments or docstrings in code (AGENTS.md Part Q). No test files and no smoke scenario (AGENTS.md Part S); verification is by running, below.
  - Work only in /home/sven/github/foss/.polispec-wt/scratch-cap (branch scratch-cap). Never touch the pinned runtime, ~/.ai, the live clone /home/sven/github/foss/polispec, or the real ledger and shelf.
  - Every verification run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER, POLISPEC_HOME and POLISPEC_GLOBAL to scratch paths; never redirect XDG_STATE_HOME.
  - Judge commands only through bin/polispec explain, classify or hook pretool with JSON on stdin. Never run a probe command for real (no tar, ffmpeg or dd writes outside the scratch fixture).
  - No new rStack dependency. Do not bump versions, edit CHANGELOG.md, FEATURES.md, TODO.md or specs/app.yml; the primary does those.
  - Do not edit .rproject/, smoke.yml or anything under smoke/.
surfaces:
  code:
    - lib/polispec/classify/commands/fs.rb (Fs.archive: bundled -f cluster and --file=)
    - lib/polispec/classify/commands/bulk.rb (new family)
    - lib/polispec/classify/shapes.rb (NAMES gains bulk_write; the ulimit pass; applies?)
    - lib/polispec/classify/tool.rb and lib/polispec/classify/commands/support.rb (the bytes hint)
    - lib/polispec/scratch_cap.rb (new: the four keys)
    - lib/polispec/engine.rb (Match: KEYS, rule?, one call into ScratchCap)
    - lib/polispec/description.rb (match_terms names the four keys, if it enumerates keys)
  contract:
    - schemas/policy.v1.yml, schemas/module.v1.yml, schemas/global.v1.yml (the four keys beside live_binary; bulk_write in the shape enum where xargs_delete is listed)
    - schemas/control.v1.yml (the bulk_write name in the shape enum only)
  doc:
    - docs/schema.md (four match.* rows, the shape in the match.shape row, the two hints in one short paragraph under rules[])
    - README.md (where it lists what polispec can stop)
design:
  keys:
    bytes_over: "integer. Holds when action.env_hint['bytes'] is an Integer greater than the value. Action class is not checked here; the rule's class does that."
    fsize_unset: "boolean true. Holds when env_hint has the key 'fsize_blocks' and its value is the string 'unlimited'. An action without the key never holds."
    fsize_above: "integer (bytes). Holds when env_hint['fsize_blocks'] is an Integer and fsize_blocks * 1024 > value."
    tree_over: "object {marker: string, bytes: integer}. root = the nearest ancestor directory of env_hint['path'] (starting at the path's parent) whose basename equals marker, by File.dirname walking; none means no hold. Holds when ScratchCap.tree_size(root) > bytes."
    matching: "In Engine::Match, KEYS gains the four names; rule? calls ScratchCap.holds?(match, action, ctx) last in its && chain, and it returns true when none of the four keys is present. A rule with one of the keys on a non-matching action is just false. Values of the wrong type are a schema error, not a runtime one."
  tree_size:
    function: "ScratchCap.tree_size(dir) returns an Integer or nil"
    cache: "File.join(State.home, 'scratch-sizes.json'), a Hash of realpath to {'bytes'=>Integer,'at'=>Integer epoch seconds}; entries younger than 60 s are used; writes are atomic (temp file in the same directory, then rename) and a read or write failure is not an error"
    measure: "On a miss run Predicates.capture(['du', '-sb', '--', dir], timeout: 0.8) inside Predicates.deadline_for; parse the leading integer of stdout; any failure, a nonzero exit, a timeout or an unparsable output returns nil and the key does not hold"
    findings: "A nil size appends the finding 'tree_over: <dir> could not be measured' to ctx[:findings] through Predicates.record(Predicates::Result.new(false, nil, finding), ctx), once per dir per call"
  hints:
    bytes: "Classify::Tool.write passes the tool input to Support.write_action; Support gains a function that sums bytesize of every String found under the keys content, file_text, text, new_string, new_str, new_source and contents, at the top level of the input and inside each entry of an edits array; the sum is set as env_hint 'bytes' on the fs.write action (not on policy.edit actions). Zero strings means no 'bytes' key."
    fsize_blocks: "Classify::Shapes.annotate, after the command loop, walks script.commands in order keeping state = 'unlimited'. A command named ulimit that is not a stage of a multi-stage pipeline (its pipeline has one command) updates state: flags are the options before the operand; if the options include f, and do not include S unless they also include H, and the operand is a literal integer (^[0-9]+$) state = Integer(operand); if the options include f (same S rule) and the operand is unlimited, or is not a literal integer, state = 'unlimited'; any other ulimit changes nothing. Every other command gets hints[cmd.text]['fsize_blocks'] = state. command_hints merging order is unchanged: the pass merges after Registry hints. Every fs.write action from a shell command thereby carries the key; write-tool actions never do."
  shape:
    name: "bulk_write, added to Shapes::NAMES. applies? returns true for it only when the action class is fs.write."
    producers: "Bulk.shapes(cmd) returns ['bulk_write'] when cmd.name or the name of any command in cmd.upstream is a bulk writer. Bulk writers: tar when its flags are in create mode (first operand matches /\\A-?[a-zA-Z]*c/ or --create present), zip, 7z, 7za, 7zr, 7zz, pg_dump, pg_dumpall, mysqldump, ffmpeg, curl, wget, cp, rsync, dd, and git when its subcommand is archive or bundle."
  family:
    file: "lib/polispec/classify/commands/bulk.rb, module Polispec::Classify::Bulk, extend Support::Family, registered with Registry.register('bulk', Bulk) like Fs; follow fs.rb's structure. Fs, Postgres and Git keep their own classes; Bulk adds fs.write actions and the shape only."
    names: "NAMES = %w[zip 7z 7za 7zr 7zz ffmpeg mysqldump pg_dump pg_dumpall]; handle git archive and git bundle by cmd.name == 'git' with the first non-option argument."
    outputs:
      zip: "the first operand after options (zip [opts] out.zip files...); -O/--output-file value if present, which wins"
      seven_zip: "for 7z, 7za, 7zr, 7zz: the first operand after the subcommand when the subcommand is a or u"
      ffmpeg: "the last operand that does not start with - and is not the value of a preceding option from this list: -i -f -c -c:v -c:a -b:v -b:a -r -s -t -ss -to -map -vf -af -vframes -preset -crf -ar -ac -pix_fmt -loglevel; none when the last operand is such a value or is dynamic"
      mysqldump: "--result-file=X, --result-file X, -r X"
      pg_dump_and_pg_dumpall: "-f X, --file=X, --file X; a leading dash value or '-' is stdout and yields nothing"
      git: "git archive: -o X, --output=X, --output X; git bundle create: the first operand after create"
    action: "Support.write_action(Support.abs(path, cmd.cwd), cmd.text); skip a path Support.dynamic? says is dynamic"
  tar:
    fix: "Fs.archive in create mode finds the archive name from: a separate -f X or --file X (as before); --file=X; or a bundled option cluster containing f (the first operand matching /\\A-?[a-zA-Z]+\\z/ and containing f, whether or not it starts with a dash), in which case the archive is the operand that follows the cluster. '-' is stdout and yields nothing. Extract mode is unchanged."
  plan_and_probes: "No change to plan.rb: the new keys are ordinary match keys; confirm polispec plan global against the probe shelf runs and classifies the new module as tightening."
slices:
  - id: contract-and-schemas
    owns_paths: [schemas/policy.v1.yml, schemas/module.v1.yml, schemas/global.v1.yml, schemas/control.v1.yml]
    deliverable: the four keys as match properties (bytes_over integer, fsize_unset boolean const true, fsize_above integer, tree_over object with required marker string and bytes integer, no other properties) in the three documents, bulk_write in the shape enums where xargs_delete is listed in policy.v1.yml and control.v1.yml
    acceptance: "bin/polispec validate module <scratchpad>/shelf-scratch-cap/modules/scratch-cap.yml and validate global <scratchpad>/shelf-scratch-cap/global.yml print ok (the module's param placeholders must pass; if the validator rejects '{{cap_bytes}}' in an integer slot, stop and report instead of loosening the type); every YAML under examples/ and smoke/ that validated before still validates"
  - id: classify
    owns_paths: [lib/polispec/classify/commands/fs.rb, lib/polispec/classify/commands/bulk.rb, lib/polispec/classify/shapes.rb, lib/polispec/classify/tool.rb, lib/polispec/classify/commands/support.rb]
    depends_on: [contract-and-schemas]
    deliverable: the tar fix, the Bulk family, the bulk_write shape, the fsize_blocks pass and the bytes hint
    acceptance: see verification.classify
  - id: engine
    owns_paths: [lib/polispec/scratch_cap.rb, lib/polispec/engine.rb, lib/polispec/description.rb]
    depends_on: [classify]
    deliverable: ScratchCap and the Match hook-up
    acceptance: see verification.verdicts
  - id: docs
    owns_paths: [docs/schema.md, README.md]
    depends_on: [engine]
    deliverable: docs as listed
    acceptance: "the four keys, the shape and both hints are each named once in docs/schema.md in the style of the live_binary row"
verification:
  setup: "Scratch dir S under the session scratchpad. S/ledger.yml minimal (host, envs_root under S, no projects: polispec ledger init or a hand-written polispec.ledger/v1 with projects: []). POLISPEC_LEDGER=S/ledger.yml, POLISPEC_GLOBAL=<scratchpad>/shelf-scratch-cap, POLISPEC_HOME and POLISPEC_STATE_HOME under S. Probe paths live under S/p (cwd S/p, with S/p/.scratch, S/p/scratchpad and S/p/claude-code-tmp created). Run the worktree's bin/polispec for the candidate and the pinned release /home/sven/bitbucket/paterasai/rstack-uber/plugins/.pinned/polispec/300be1b6a354fa0bb6d31237be0b5f25c342cf1c/bin/polispec for the 0.38.0 baseline, both with the same env."
  classify:
    - "classify --json for 'tar czf .scratch/a.tgz docs', 'tar -czf .scratch/a.tgz docs', 'tar cf .scratch/a.tar docs', 'tar -c -f .scratch/a.tar docs', 'tar --create --file=.scratch/a.tar docs': one fs.write for S/p/.scratch/a.tgz or a.tar, shape bulk_write, fsize_blocks 'unlimited'. The pinned 0.38.0 gives no action for the first three and the fifth."
    - "'tar xzf a.tgz -C .scratch/out' and 'tar tzf a.tgz': identical to 0.38.0 (extract keeps its fs.write of the directory without bulk_write; list has none)."
    - "'ulimit -f 131072; tar czf .scratch/a.tgz docs', 'ulimit -f 131072 && tar czf ...', 'ulimit -Hf 131072; tar ...', 'ulimit -fH 131072; tar ...': fsize_blocks 131072. 'ulimit -Sf 131072; tar ...', 'ulimit -f unlimited; tar ...', 'ulimit -f $N; tar ...', 'tar ... ; ulimit -f 1' (ulimit after the writer): 'unlimited'. 'ulimit -f 5 | cat; tar ...': 'unlimited'. 'ulimit -f 262144; ulimit -f 131072; tar ...': 131072."
    - "bulk_write present on: zip .scratch/a.zip docs, 7z a .scratch/a.7z docs, ffmpeg -i in.mp4 -y .scratch/o.mp4, mysqldump --result-file=.scratch/d.sql db, pg_dump -f .scratch/d.sql db, pg_dump db > .scratch/d.sql, git archive -o .scratch/a.tar HEAD, git bundle create .scratch/a.bundle --all, cp big .scratch/, rsync -a src/ .scratch/x/, curl -o .scratch/f url, wget -O .scratch/f url, dd if=a of=.scratch/f, and pg_dump db | gzip > .scratch/d.sql.gz (the gzip redirect action)."
    - "bulk_write absent (fsize_blocks present): echo hi > .scratch/n.txt, tee .scratch/n.txt, cat a > .scratch/b, cp-less touch .scratch/n; curl url without -o; tar tzf a.tgz; git archive without -o; zip with only options."
    - "Write tool payload {tool_name: Write, tool_input: {file_path: S/p/.scratch/x, content: <10 bytes>}}: fs.write with bytes 10 and no fsize_blocks; an Edit with new_string 7 bytes: bytes 7; MultiEdit with two edits: the sum; a Write to a policy file keeps class policy.edit and carries no bytes."
  verdicts:
    - "hook pretool (or explain) with the probe shelf, cwd S/p: 'tar czf .scratch/a.tgz docs' deny G-SCRATCH-ULIMIT-DOT; 'ulimit -f 131072; tar czf .scratch/a.tgz docs' allow; 'ulimit -f 262144; tar czf .scratch/a.tgz docs' warn G-SCRATCH-CAP-DOT; the same three inside S/p/scratchpad and S/p/claude-code-tmp give the PAD and TMP ids; 'echo hi > .scratch/n.txt' allow; 'tar czf /tmp/elsewhere.tgz docs' not touched by any G-SCRATCH rule."
    - "Write of 129 MiB of content to S/p/.scratch/big warn G-SCRATCH-SIZE-DOT (build the payload with a Ruby script that writes the JSON to a file under S, never by pasting it); 1 KiB allow; the same payload to S/p/other/big allow."
    - "Budget: make S/p/.scratch hold a sparse 3 GiB file (File.truncate in Ruby; apparent size counts, no disk used); then 'ulimit -f 131072; cp x .scratch/y' warns G-SCRATCH-BUDGET-DOT, the same with a 1 GiB sparse file allows, and with the sparse file removed again allows. The cache file scratch-sizes.json appears under S/state. With du made unavailable (PATH without du) the call is allowed and a finding is reported."
    - "polispec resolve S/p --layers shows the scratch-cap module with 11 rules; plan global against the probe shelf (copy the real global shelf's git layout if needed, or use --from DIR) classifies tightening."
  smoke: "bin/polispec smoke run --against /home/sven/bitbucket/paterasai/rstack-uber/plugins/.pinned/polispec/300be1b6a354fa0bb6d31237be0b5f25c342cf1c --no-record: report every scenario result and every diff; the primary reviews them. Expected differences beyond the runtime kind, commit, path, id and version ones: none in verdicts, except scenarios whose commands run tar in create mode."
  checks: "ruby -wc on every changed .rb; YAML load on every changed .yml; bin/polispec validate on every changed schema-bound file; bin/polispec editions --check; bin/polispec doctor with the scratch env shows no new finding versus the pinned baseline"
report:
  - "A table of every probe: command, expected, observed."
  - "Every file changed, with line counts."
  - "Anything you could not verify, and the glob forms: for each of **/.scratch/**/*, **/scratchpad/**/* and **/claude-code-tmp/**/* say whether File.fnmatch with FNM_PATHNAME|FNM_DOTMATCH matches an absolute path under S/p, and if not the form that does."
amendments_round_2:
  reason: "The primary's review of round 1 and the worker's report. These override the matching design text above."
  tar_scan: "Fs.create_mode? and the extract test scan every argument, not only the first. A dashed single-letter cluster (/\\A-[a-zA-Z]+\\z/) anywhere, or a bare cluster as the first argument, containing c is create mode (and not x); containing x is extract; --create and --extract or --get count as well. cluster_file takes the argument after the cluster that contains f, wherever it sits. Must give a create with the archive path for: tar -C src -czf .scratch/b.tgz . ; tar -f .scratch/x.tar -c docs ; tar --exclude=x -czf .scratch/x.tgz . ; tar -c -C src -f .scratch/x.tar . ; and must still give no action for tar tzf a.tgz and tar -C src -tzf a.tgz, and the same extract result as 0.38.0 for the extract forms the baseline already handled."
  bulk_fallback: "For zip, 7z, 7za, 7zr, 7zz, ffmpeg and mysqldump (the names Generic covered in 0.38.0 and Bulk now claims), when Bulk finds no usable output path, Bulk.classify returns exactly the action Generic.classify returned in 0.38.0: Support.act('fs.write', cmd.text, 'path' => cmd.cwd, 'unknown' => true, 'command' => cmd.name). Verify against the pinned baseline that the classify output for zip -q, zip -l a.zip, ffmpeg -i in.mp4 $OUT, ffmpeg -version, mysqldump db, 7z l a.7z is identical to 0.38.0 apart from the new hints. pg_dump and pg_dumpall stay as they are if another family already claimed them in 0.38.0; check that."
  bytes_hint: "Support.write_action adds the 'bytes' key only when the value is non-nil; a MultiEdit-style input whose edits entries carry their own file_path gives each path's action only that entry's bytes."
  fsize_hint_scope: "file_size_limits stores its state apart from the Registry hints and Shapes.annotate merges fsize_blocks only onto actions whose class is fs.write. When several commands in one script share the same text, the hint is the weakest limit among them: 'unlimited' beats any integer, a larger integer beats a smaller one."
  tree_over_root: "ScratchCap.marker_root starts at the path itself (path, then its parents), so a bare scratch directory path such as S/p/.scratch counts as inside the tree. A root that does not exist measures as 0 and raises no finding; any other measurement failure keeps the finding."
  docs: "README.md and docs/schema.md state that a write tool call over 8 MiB is already denied by the hook input cap (INPUT_LIMIT), so bytes_over matters for caps below that; remove any sentence that says a write over a 128 MiB cap asks."
  extra_probes:
    - "all the tar forms in tar_scan under .scratch: bulk_write, fsize_blocks per ulimit, and deny G-SCRATCH-ULIMIT-DOT through explain with the probe shelf; tar cf - docs | gzip > .scratch/x.gz carries bulk_write on the redirect action"
    - "cp big .scratch/ with a 3 GiB sparse file in S/p/.scratch and ulimit -f 131072: tree_over holds (use a pattern the probe shelf has for the bare directory; the primary will extend the module, so test tree_over through ScratchCap.holds? with a hand-built match and action)"
    - "a not-yet-created S/p/new/.scratch: tree_over does not hold and ctx[:findings] stays empty"
    - "tar czf .scratch/x.tgz d; ulimit -f 131072; tar czf .scratch/x.tgz d : the hint on the fs.write is 'unlimited'"
    - "a shell write that is not a bulk write (echo hi > .scratch/n) carries fsize_blocks only on its fs.write action; a data.copy or secrets.read action of the same line carries none"
    - "classify output of 20 lines of your choice outside scratch that touch other families (git, rm, cp, curl, psql) differs from 0.38.0 only by the fsize_blocks key on fs.write actions"
out_of_scope:
  - Committing, tagging, version bumps, CHANGELOG, FEATURES, TODO and specs/app.yml; the primary does those after verification
  - The scratch-cap shelf module itself (the primary applies it with plan global after the host is re-pinned)
  - Codex and Antigravity adapters
