schema: is.v1
metadata:
  name: polispec lint
  slug: lint
  version: 0.1.0
  created: '2026-10-23'
  status: accepted
  base_commit: 3764137
  base_version: 0.41.1
  intended_release: 0.42.0
  contract: specs/app.yml#lint
  worker: {harness: claude-code, agent: coding-worker, note: "AGENTS.md Part T: the primary wrote this blueprint and verifies; workers implement every slice"}
  decisions_by_sven:
    - "A new verb polispec lint; validate stays the single-file check."
    - "Scope: polispec-schema YAML, the other generated files (the [ENVS] row and envs.md, behavior surfaces, manifest and index JSON, harness native artifacts by file integrity only), and this repository's own shipped files."
    - "Rules: YAML hygiene, drift from source, dangling references, and the existing description lint, besides schema validity."
    - "Enforcement points: on demand, a write gate in every generator, doctor findings, and one bundled smoke scenario. Each is a toggle with a default (polispec.lint.on_write on, polispec.lint.doctor on, polispec.lint.strict off)."
    - "The two blueprints with YAML syntax errors and the alias-bearing web/public/openapi.yml are fixed in this change so that the shipped sweep passes."
    - "The smoke scenario exists because Sven chose it through the question tool (AGENTS.md Part S, door 1: the user asked); no other test file is written."
vision:
  problem: >-
    polispec writes many files (rulebooks, the ledger, manifests, exceptions, deployments, grants, rendered surfaces) and
    ships many more, and nothing sweeps them. polispec validate checks one file against one schema. Ruby's YAML loader
    accepts a duplicate key silently and keeps the last, reads only the first document of a stream, and reads a plain on
    or off as a boolean, so a generated or hand-edited file can be accepted and wrong. Two shipped blueprints do not even
    parse, and web/public/openapi.yml carries Psych anchors the polispec loader refuses.
  outcome: >-
    polispec lint reports schema errors, hygiene problems, drift from source, dangling references and description
    findings across the project, the host and the release tree; every generator that writes a structured file refuses an
    output with an error finding; doctor files host-scope findings; the bundled smoke suite proves the verb. No verdict
    changes and no schema changes shape.
  non_goals:
    - Any change to a policy, module, ledger or schema file format, to a verdict, or to the judgment, change and session streams.
    - Reading from a trust ref for ledger projects (lint reads the working tree; doctor remains the trust-ref check).
    - Native harness probes: harness artifacts are checked by file integrity only (Files.verify_receipt).
    - Any web route or web view change.
    - A new schema kind, a new top-level key in any rulebook, or a new top-level setting group other than polispec.lint.*.
constraints:
  - "Ruby standard library only, at the syntax level of lib/polispec/commands/doctor.rb (floor Ruby 2.6): no pattern matching, no numbered block parameters, no endless methods, no Hash#except, no filter_map, no Psych keyword arguments (call Psych.parse_stream(text) with the text alone). Keep the two-line header (shebang, SPDX) every lib file carries."
  - "No comments or docstrings in code (AGENTS.md Part Q). No test files (AGENTS.md Part S); the single exception is smoke/scenarios/lint.yml, which Sven asked for. Do not edit any other file under smoke/."
  - "AGENTS.md Part F no attribution; Part E no deletion without an in-place backup; Part J query codebase memory (project home-sven-github-foss-polispec) before grepping."
  - "Work only in <worktree> (branch lint). Never touch the pinned runtime, ~/.ai, the live clone <live clone>, or the real ledger, shelf, settings file and state home."
  - "Every run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER, POLISPEC_HOME, POLISPEC_GLOBAL, POLISPEC_SETTINGS and POLISPEC_SMOKE to paths under the scratch root S below; never redirect XDG_STATE_HOME. S = <scratchpad>/lint ; create S/<slice> for your own files."
  - "Run polispec as <worktree>/bin/polispec. Judge hook calls only through bin/polispec explain or hook with JSON on stdin; never run a probe command for real."
  - "No new rStack dependency and nothing host-specific in any shipped file (no ~/.ai, no project id, no host name, no operator name): doctor reports personal_default for it."
  - "Do not bump versions, edit CHANGELOG.md, FEATURES.md, TODO.md, VERSION, specs/app.yml or anything under .rproject/; the primary does those. Do not stage or commit; the primary does that."
  - "Another worker may own the other slices at the same time: edit only the paths your slice owns."
surfaces:
  code:
    - lib/polispec/lint.rb (new)
    - lib/polispec/lint/hygiene.rb (new)
    - lib/polispec/lint/documents.rb (new)
    - lib/polispec/lint/sweep.rb (new)
    - lib/polispec/lint/targets.rb (new)
    - lib/polispec/lint/shipped.rb (new)
    - lib/polispec/lint/refs.rb (new)
    - lib/polispec/lint/drift.rb (new)
    - lib/polispec/schema/check.rb (new)
    - lib/polispec/commands/lint.rb (new)
    - lib/polispec/cli.rb (Validate delegates to Schema::Check)
    - lib/polispec/engine.rb (three settings readers)
    - lib/polispec/classify/benign.rb (lint is a read verb)
    - lib/polispec/commands/doctor.rb (check_lint)
    - the eleven write-gate sites listed in design.write_gate
  contract:
    - polispec.rplugin.yml (three setting definitions)
    - specs/app.yml#lint (primary, already written)
  doc:
    - README.md
    - docs/operator.md
    - skills/polispec/SKILL.md
    - skills/polispec-specs/SKILL.md
  fleet:
    - smoke/scenarios/lint.yml (new, unit commands/lint)
    - specs/provenance.impl.yml and specs/smoke.impl.yml (quoting fixes)
    - web/public/openapi.yml (anchors and aliases expanded)
design:
  findings:
    struct: "Polispec::Lint::Finding = Struct.new(:severity, :rule, :code, :path, :line, :pointer, :message, :project). severity in error, warn, info; rule in schema, hygiene, drift, refs, description; line is an Integer or nil; pointer is a JSON pointer String or nil. #to_h returns string keys severity, rule, code, path, line, pointer, message with nil values kept (JSON null) and never project; project is the ledger project id of the Target the finding came from, nil when unknown, used only by doctor. #error? is severity == 'error'."
    order: "Findings sort by path, then line (nil last), then code. Exact duplicates (all fields equal) collapse to one."
    cap: "At most 20 findings per (path, code); a 21st is replaced by one info finding with the same rule and code, message 'N more like this', where N is the number dropped."
  report:
    struct: "Polispec::Lint::Report = Struct.new(:findings, :targets). #counts returns {'error'=>n,'warn'=>n,'info'=>n}. #ok?(strict) is counts error zero and, when strict, counts warn zero. #to_h(ok) returns {'ok'=>ok,'targets'=>Integer,'counts'=>counts,'findings'=>findings.map(&:to_h)}; the command passes the effective ok."
  hygiene:
    file: "lib/polispec/lint/hygiene.rb, module Polispec::Lint::Hygiene, module_function check(text, path:, format:, allow: []) returning [Finding]. format is :yaml, :json or :text. Every finding has rule 'hygiene'. A code in allow is dropped."
    yaml_steps:
      - "Invalid UTF-8 (text.dup.force_encoding('UTF-8').valid_encoding? false): one error yaml_syntax, message 'not valid UTF-8', line nil; stop."
      - "BOM: text starts with the UTF-8 BOM: warn yaml_bom, line 1; strip it before every later step."
      - "CRLF: text includes \"\\r\\n\": one warn yaml_crlf, line of the first, message with the count of lines."
      - "Final newline: non-empty text not ending in \"\\n\": warn yaml_no_final_newline, line the last line number."
      - "Parse: Psych.parse_stream(text) (no keyword arguments). Psych::SyntaxError: one error yaml_syntax with line e.line, message built from e.problem and e.context (not e.message, which repeats the file name); stop the AST steps but keep the text steps above."
      - "Documents: stream.children.length > 1: one error yaml_multiple_documents at the start line (1-based) of the second document, message 'the loader reads only the first document'."
      - "Walk every node of every document recursively. A Psych::Nodes::Alias, or any node whose anchor is non-nil: error yaml_alias at its start line + 1, message 'anchors and aliases are refused by the loader'."
      - "Mapping duplicates: in a Psych::Nodes::Mapping, children alternate key, value. For each key that is a Scalar compute the loader's key string: plain (not quoted) scalars use Psych::ScalarScanner.new(Psych::ClassLoader.restricted).tokenize(value).to_s, quoted scalars use value. A repeated key string: error yaml_duplicate_key at the repeated key's start line + 1, pointer the JSON pointer of the mapping (keys joined with /, ~ and / escaped as ~0 and ~1, list items by index), message \"key K repeats the one at line L; the loader keeps the last\". Skip non-scalar keys."
      - "Non-string key: a plain scalar key whose tokenize result is not a String (true, false, nil, Integer, Float, Date, Time): warn yaml_non_string_key, message \"key K reads as a boolean/null/number and the loader turns it into a string\" (pick the word from the class)."
      - "Boolean word: a plain scalar VALUE (not a key) whose text matches /\\A(yes|no|on|off)\\z/i: warn yaml_bool_word at its line, message \"plain K reads as a boolean; quote it to keep the string\"."
      - "Block scalar ranges: collect [start_line, end_line] of every Scalar with style LITERAL or FOLDED; the lines strictly after the indicator line up to the node's last content line are content. Determine the exact boundary empirically on a three-line literal block and a folded block with a trailing blank line, and pin it."
      - "Tabs: outside block scalars, a line matching /\\A[ \\t]*\\t/ or /(?:\\A|[ ])[-:]\\t/: one warn yaml_tab for the file, line of the first, message with the count."
      - "Trailing space: outside block scalars, a line matching /[ \\t]+\\z/ (after removing the line end): one warn yaml_trailing_space for the file, line of the first, message with the count."
    json_steps:
      - "Invalid UTF-8: error json_syntax. JSON.parse(text) raising JSON::ParserError: one error json_syntax, line extracted from the message when it contains 'line N' else nil; stop."
      - "Duplicates: Psych.parse_stream(text); a Psych::SyntaxError skips this step silently; otherwise the same mapping walk as yaml (not the alias or boolean steps), code json_duplicate_key."
      - "No other json hygiene finding."
    text_steps:
      - "Invalid UTF-8 or a NUL byte: error text_invalid, line nil."
      - "Empty text, or text not ending in a newline: warn text_final_newline (not an error: the generator may legitimately write such a file, and a final newline added there would make agents render --check report drift on existing files), line the last line number. More than one trailing newline is allowed."
  documents:
    file: "lib/polispec/lint/documents.rb, module Polispec::Lint::Documents, module_function check(target, text, only:, description_error:) returning [Finding]. only is an Array of rule names; description_error is a boolean (Engine::Settings.description_strict?)."
    target: "Polispec::Lint::Target = Struct.new(:path, :text, :format, :kind, :expect, :unrecognized, :allow, :project, :descriptions, keyword_init: true). path is the absolute path (or a display label like <shelf>/modules/x.yml when text is given); text is nil to read the file; format :yaml, :json or :text (default by extension: .json is :json, .yml and .yaml are :yaml, else :text); kind is a Schema kind String, 'auto' (the document's own schema id), or nil (hygiene only); expect is nil or a kind the location demands; unrecognized is true when a missing or unknown polispec schema id is a schema_unrecognized warn; allow is an Array of hygiene codes to drop; project is a ledger project id or nil; descriptions is true to run the description rule."
    pipeline:
      - "1. hygiene rule (when 'hygiene' in only): Hygiene.check. A yaml_syntax, json_syntax, yaml_alias or yaml_multiple_documents error stops the pipeline for this target (no schema step)."
      - "2. Parse with Schema::Document.parse(text, path). A ParseError after the hygiene steps passed adds yaml_syntax error with the message and stops."
      - "3. schema rule (when 'schema' in only and kind non-nil): Schema::Check.call(kind, path, text: text) (see schema_check). A false result adds one schema_invalid error per Schema::Error with the pointer and message. When the document is a Hash and expect is non-nil and the document's own kind differs from expect: error schema_kind_mismatch, pointer '/schema', message 'declares X, expected Y'. When kind is 'auto' or expect is set and the document has no polispec schema id: warn schema_unrecognized when target.unrecognized, else nothing."
      - "4. description rule (when 'description' in only and target.descriptions): the warnings Schema::Check returned, each as rule 'description', code 'description_<code>', severity warn, or error when description_error; message from the warning."
  schema_check:
    file: "lib/polispec/schema/check.rb, module Polispec::Schema::Check. Outcome = Struct.new(:result, :data, :kind, :warnings, :semantic). module_function call(kind, file, text: nil, semantic: false) returns an Outcome."
    extraction: "Move the logic of CLI::Validate (behavior_v2, validated, merged_result, with_semantics, semantic_errors, description_report) out of lib/polispec/cli.rb into this module without changing any decision, message or order. The only change is the source of the document: Schema::Document.parse(text || File.read(file), file) where the class used Schema::Document.load(file). merged_result keeps reading a sibling environments.yml from disk beside file. The instance state @merged becomes Outcome#data (the merged policy when a sibling was merged, else the parsed document). Outcome#warnings is Description.warnings(data, kind) (empty when the kind is not in Description::KINDS or the result is not ok); Outcome#semantic is Description.semantic when semantic is true."
    cli: "CLI::Validate#run keeps its argument handling, usage, text and JSON printing, failed computation (not result.ok, or warnings with Engine::Settings.description_strict?), exit codes and every output byte, and calls Schema::Check.call(kind, file, semantic: semantic) in place of merged_result, validated, with_semantics and description_report. Delete the now-unused private methods from the class."
    parity_oracle: "Before editing cli.rb, run the loop `for f in $(git ls-files '*.yml'); do out=$(bin/polispec validate auto \"$f\" --json 2>&1); rc=$?; echo \"$rc $f $(echo \"$out\" | head -c 160)\"; done` in the worktree, once with every file in the list and save the output to S/core/validate-before.txt. After the extraction, run the same loop to S/core/validate-after.txt. The two must be identical except for the lines of specs/provenance.impl.yml, specs/smoke.impl.yml and web/public/openapi.yml (fixed by slice wire). A reference run of the unmodified 0.41.1 exists at <scratchpad>/baseline-validate.txt and must match your validate-before.txt line for line."
  engine:
    file: "lib/polispec/lint.rb defines module Polispec::Lint with RULES, SEVERITIES, Finding, Target, Report, the settings readers delegating to Engine::Settings, check_text, guard_write! and run. It requires lint/hygiene, lint/documents and schema/check eagerly and lint/sweep lazily inside run."
    check_text: "Lint.check_text(text, path:, format: nil, kind: nil, only: %w[hygiene schema]) builds a Target (project nil, expect nil, unrecognized false, descriptions false) and returns Documents.check findings."
    guard_write: "Lint.guard_write!(text, path:, kind: nil, format: nil) returns text unchanged when Engine::Settings.lint_on_write? is false. Otherwise it runs check_text with only hygiene and schema (schema only when kind is a non-nil String), selects the error findings, and when there are any raises Operator::Failure.new('lint_failed', \"#{display} does not lint: #{first.code} #{first.message}\", 'path' => path, 'problems' => [\"#{code} line N pointer message\" joined, line and pointer omitted when nil]). display is File.basename(path) when path is longer than 80 characters else path. It never rescues anything else: an unexpected exception inside lint must not block a write, so wrap only the check in rescue StandardError that returns text (and emits nothing)."
    run: "Lint.run(roots: [], files: [], host: false, shipped: false, only: RULES, for_doctor: false) returns a Report; defined in lint/sweep.rb as Polispec::Lint::Sweep.call with the same keywords."
    settings: "Engine::Settings gains LINT_ON_WRITE_KEY = 'polispec.lint.on_write', LINT_DOCTOR_KEY = 'polispec.lint.doctor', LINT_STRICT_KEY = 'polispec.lint.strict' and readers lint_on_write? (text(KEY,'on').downcase != 'off'), lint_doctor? (same), lint_strict? (text(KEY,'off').downcase == 'on'), each with the rescue StandardError that description_strict? has (false for the first two would disable on error; write rescue returning the default: true, true, false). polispec.rplugin.yml gains three setting definitions beside polispec.description.strict with the same shape (type enum, options off/on, scopes machine) and the descriptions of specs/app.yml. Find every other place polispec.description.strict is declared in code (grep) and mirror it where a registry of setting keys exists, including NativeSettings."
  sweep:
    file: "lib/polispec/lint/sweep.rb, Polispec::Lint::Sweep.call(roots:, files:, host:, shipped:, only:, for_doctor:)."
    algorithm:
      - "targets = []. For each root in roots: Targets.project(root). For each file in files: one Target with kind 'auto', format by extension, unrecognized false, descriptions true. If neither roots, files, host nor shipped is given the caller passes the default root (the git toplevel of the working directory, else the directory). host: Targets.host(for_doctor:). shipped: Targets.shipped."
      - "Read each target's text (a Target with text uses it) with a 5 MiB cap: a larger file adds an info finding rule 'hygiene' code file_too_large and is skipped; an unreadable file adds a warn finding code target_unreadable."
      - "Run Documents.check per target with only and description_error = Engine::Settings.description_strict?. Targets whose descriptions flag is false get no description findings."
      - "Then the scope checks: Drift.check(scope, only) and Refs.check(scope, only) for the project roots, the host and the shipped tree, each returning [Finding], skipped entirely when their rule is not in only."
      - "Return Report.new(sorted capped findings, targets.length)."
  targets:
    file: "lib/polispec/lint/targets.rb, module Polispec::Lint::Targets, module_function project(root), host(for_doctor:), shipped."
    project: >-
      Files found by schema id. List candidates with git -C root ls-files -z --cached --others --exclude-standard when
      root/.git exists, else a recursive walk; keep files ending .yml, .yaml or .json whose path has no component named
      vendor or node_modules and no dot-directory component other than .agents and .polispec; cap at 5000 candidates (an
      info finding rule 'refs' code too_many_files beyond that). For each candidate of 2 MiB or less read the first 4096
      bytes and keep the file when it matches /^\s*"?schema"?\s*:\s*"?polispec\./ . Also always include, when present,
      specs/polispec/**/*.yml, polispec.app.yml and polispec.manifest.json. Each kept file becomes a Target with kind
      'auto', unrecognized true when the path is under specs/polispec, descriptions true for yml, project the ledger
      project id whose repo contains the root (nil when none or the ledger cannot load). Fixed expectations: expect
      'environments' for specs/polispec/environments.yml, 'policy' for policy.yml, 'roster' for roster.yml, 'waivers' for
      code-waivers.yml, 'module' for specs/polispec/modules/*.yml, 'app' for polispec.app.yml (kind 'app'), 'manifest'
      for polispec.manifest.json (kind 'manifest'). Templates: a file that has an ancestor directory (inside root) holding
      a package.yml gets kind nil (hygiene only), expect nil, descriptions false.
    host: >-
      The ledger (Ledger.default_path, kind 'ledger', skipped when for_doctor), the global shelf (Layers.source: for a
      :dir source the files global.yml, profiles.yml, exceptions.yml, modules/*.yml, packages/*/package.yml and
      paths/*.yml under source.root; for a :repo source the same names from git -C repo ls-tree -r --name-only ref --
      path with the environment Layers uses (Layers::GIT_ENV), text read through Layers.store.read(relative) at the
      committed ref; kinds global, profiles, exceptions (skipped when for_doctor), module, package, policy; display path
      '<shelf>/' plus the relative name; a nil source adds nothing), State deployments.json (kind 'deployments',
      format :json), delegate/grants.yml under State.home (kind 'delegate_grants'), the settings file
      (NativeSettings.path, kind nil, descriptions false), the published index of the current user
      (Manifest index dir, kind 'index', format :json, only when the file exists), and every non-retired ledger project whose
      repo directory exists as Targets.project(repo) (descriptions false when for_doctor). A file that does not exist
      adds no target. Unreadable ledgers add nothing here (doctor reports them).
    shipped: >-
      Root is Polispec::ROOT. Files: git -C ROOT ls-files -z --cached --others --exclude-standard when ROOT/.git exists, else a walk of regular files ending
      .yml, .yaml or .json outside any dot-directory except .claude-plugin, .codex-plugin and .agents. Each file is
      claimed by the first Shipped::TABLE row whose glob matches (File.fnmatch with FNM_PATHNAME | FNM_EXTGLOB and ** as
      the recursive form; implement ** by converting to a regular expression, not by relying on fnmatch alone) and
      becomes a Target: kind from the row (see shipped), unrecognized true for kind 'auto', descriptions true for the
      kinds policy, environments, roster, global, module, package and spec. A file no row claims is not a Target; it is a
      warn refs finding shipped_unclaimed. A row that claims no file is a warn refs finding shipped_row_unmatched.
  shipped:
    file: "lib/polispec/lint/shipped.rb, module Polispec::Lint::Shipped with TABLE (frozen Array of frozen Hashes with symbol keys glob and kind) and claim(relative) returning the row or nil."
    kinds: "A Schema kind, 'auto', 'schema_doc' (hygiene; the parsed document must be a Hash; Schema::Validator.new(doc).call(nil) must not raise; every local $ref must resolve), 'template' (hygiene only, no schema), or 'hygiene' (hygiene only)."
    table:
      - "schemas/*.yml: schema_doc"
      - "modules/*.yml: module"
      - "packages/*/package.yml: package"
      - "packages/*/behavior.yml: auto"
      - "packages/**/*.yml: template"
      - "config/ledger.starter.yml: ledger"
      - "config/harness-features.yml, config.yml, data/*.yml, smoke/host-probes.yml: hygiene"
      - "examples/**/*.yml: auto"
      - "smoke.yml: smoke"
      - "smoke/scenarios/*.yml and smoke/live/*.yml: smoke-scenario"
      - "specs/polispec/**/*.yml: auto"
      - "specs/editions.yml: editions"
      - "specs/*.yml: hygiene"
      - "hooks/*.yml, hooks/*.json, polispec.rplugin.yml, vendor/**/*.yml, web/public/**/*.yml: hygiene"
      - "plugin.json, .claude-plugin/*.json, .codex-plugin/*.json, .agents/**/*.json: hygiene"
    order: "Rows are ordered as written; the first match wins, so packages/*/package.yml precedes packages/**/*.yml and specs/polispec/**/*.yml precedes specs/*.yml."
  drift:
    file: "lib/polispec/lint/drift.rb, module Polispec::Lint::Drift, module_function check(scope, only:, for_doctor:) returning [Finding]; every finding has rule 'drift'. scope is a Hash with :roots (project roots swept), :host (boolean) and :shipped (boolean)."
    agents: "For each project root whose specs/polispec/environments.yml exists (skipped when for_doctor): reuse exactly the code path of polispec agents render ROOT --check (lib/polispec/commands/agents.rb and Polispec::AgentsRender); each file it reports as differing or missing becomes an error agents_drift with that file's path and the message it prints. A project not in the ledger still works through the repo-path form that command accepts. Nothing is written."
    behavior: "For each project root, each target of kind behavior whose document is behavior v2 with a non-empty surfaces map: Behavior.compile then Surfaces.drift(compiled, root: ROOT) exactly as polispec behavior drift does; each item becomes an error behavior_surface_drift, path the surface target, message 'surface S expected sha256 E actual A or missing'. An exception in compile becomes a warn behavior_surface_drift with the message."
    manifest: "For each project root holding polispec.manifest.json (skipped when for_doctor, because Manifest.for runs doctor) and a ledger project whose repo is that root: parse the JSON, Schema.validate('manifest', data) errors become warn manifest_drift findings; then compare id, status, enforce, policy.digest and each environments entry's policy digest against Manifest.for(id); each difference is a warn manifest_drift finding, message 'regenerate with polispec manifest ID --write'. If .polispec/badge.svg exists and differs from Manifest.badge_svg of the committed manifest content, warn manifest_drift with that path."
    harness: "When host: for each installation HarnessControls::Lifecycle.owned_installations reports, read its receipt through Lifecycle.receipt and call HarnessControls::Files.verify_receipt(receipt); each finding it returns becomes an error harness_artifact_drift with the artifact path when it names one and the finding's message. Never call Verifier.verify (it runs probes). When owned_installations returns nothing, or raises, nothing is reported for it."
  refs:
    file: "lib/polispec/lint/refs.rb, module Polispec::Lint::Refs, module_function check(scope, only:, for_doctor:); every finding has rule 'refs'."
    ledger: "When host: for each non-retired ledger project whose repo directory is missing, a warn ledger_repo_missing (path the repo, message with the project id); for each non-retired path entry whose path does not exist, a warn ledger_path_missing. Skipped when for_doctor (doctor reports repo_missing)."
    shipped: >-
      When shipped: version_disagree (error) when the version strings of VERSION, polispec.rplugin.yml (version),
      specs/app.yml (version), plugin.json (version), .codex-plugin/plugin.json (version), .claude-plugin/plugin.json
      (version) and .claude-plugin/marketplace.json (every plugins[].version) are not all equal to VERSION, one finding
      per disagreeing file with the path and both versions; schema_file_missing (error) for each kind in Schema::KINDS
      whose schemas/<kind>.v1.yml is absent; schema_ref_missing (error) for each local $ref (a String value of a key
      named $ref starting with #/) in a schemas/*.yml document that does not resolve by walking the keys, path the
      schema file, pointer the location of the $ref; package_source_missing (error) for each source path in a
      package.yml's files, variants.*.files (values) and modules that does not exist under the package directory
      (the exact shape is in schemas/package.v1.yml and Packages::Package; use the package's own file-map reader), path
      the package.yml.
  command:
    file: "lib/polispec/commands/lint.rb, class Polispec::LintCommand with self.run(args), registered with Polispec::CLI.register('lint', Polispec::LintCommand, summary: 'sweep generated and shipped files for schema, hygiene, drift, reference and description findings')."
    usage: "polispec lint [PATH...] [--host] [--shipped] [--only RULE[,RULE]...] [--strict] [--json]. USAGE constant prints on exit 2: an unknown flag, an unknown rule in --only, --only without a value, or a PATH that does not exist."
    behavior: >-
      Parse flags (--only may repeat; values split on commas; each must be in Lint::RULES). Operands: a directory is a
      project root, a file is linted alone. No operand and neither --host nor --shipped: the root is
      `git rev-parse --show-toplevel` run in the working directory, else the working directory itself. Call Lint.run
      with roots, files, host, shipped, only. strict = --strict or Engine::Settings.lint_strict?. ok = report.ok?(strict).
      Exit 0 when ok, 1 otherwise. --json prints JSON.generate of report.to_h with 'ok' set to the effective ok. The text
      form prints one line per finding `SEVERITY  RULE  CODE  PATH[:LINE]  MESSAGE` (two spaces between columns, PATH
      shown relative to the working directory when inside it, else with the home directory as ~), then a final line
      `polispec lint: N targets, E errors, W warnings, I info` (singular for 1: `1 error`, `1 warning`). Nothing is
      written anywhere. A Polispec::Error raised while building targets prints `polispec lint: MESSAGE` on stderr and
      exits 1.
    classifier: "lib/polispec/classify/benign.rb POLISPEC_READ gains 'lint' => [nil, JSON_FLAG.merge('--host' => false, '--shipped' => false, '--strict' => false, '--only' => true)], so a lint line is a benign read."
  write_gate:
    rule: "Each site calls Polispec::Lint.guard_write!(text, path: DEST, kind: K) immediately before the bytes are written (before the temporary file is created) and lets Operator::Failure propagate to the handler the site already uses for its other Failures. Add require_relative 'lint' (adjust the path) where the site's file does not already load it. Nothing is written when the gate raises."
    sites:
      - "lib/polispec/commands/apply.rb apply_project (each proposed file, line ~111), apply_global (~132), apply_ledger (~150): kind nil (plan already validated the schema, and a sibling file may not be on disk yet); format by extension; skip the call for a file whose extension is not .yml, .yaml or .json."
      - "lib/polispec/ledger.rb starter ledger write (~72): kind nil."
      - "lib/polispec/registration.rb proposal_file (~93): kind 'ledger'."
      - "lib/polispec/manifest.rb write (the manifest.json write_atomic ~309) and the index write (~380): kind nil, format :json. The badge svg is not gated."
      - "lib/polispec/agents_render.rb apply (~218): kind nil, format :text, for both the envs.md body and AGENTS.md content."
      - "lib/polispec/commands/behavior.rb render --write (~128): kind nil, format :text."
      - "lib/polispec/commands/exceptions.rb write_atomic sites (~253, ~284, ~294; gate the text that becomes exceptions.yml, and the restore bytes are not gated): kind 'exceptions'."
      - "lib/polispec/deployments.rb write (~75): kind nil, format :json (deployments is not a Schema::KINDS entry; the sweep checks deployments.json against schemas/deployments.v1.yml itself)."
      - "lib/polispec/delegate/grants.rb write (~222): kind 'delegate_grants'."
      - "lib/polispec/commands/code.rb generate rubocop (~263): kind nil."
      - "lib/polispec/packages.rb validate_rendered (~458): after each rendered YAML text parses, add one problem string per error finding of Lint::Hygiene.check(text, path: target, format: :yaml) when Engine::Settings.lint_on_write? ; the existing scaffold_invalid failure carries them."
    not_gated: "smoke.rb (each entry is schema-validated before the write), native_settings.rb, state files, judgments, changes, sessions, harness_controls/files.rb, plan.rb temporary directories, effect.rb, freeze.rb, notice.rb, policy_source.rb caches."
    guard_in_sealed: "The gate reads polispec.lint.on_write through Engine::Settings, which already answers from the plane when it is active."
  doctor:
    file: "lib/polispec/commands/doctor.rb: run calls check_lint(findings) after check_effect when Engine::Settings.lint_doctor?."
    behavior: "check_lint calls Lint.run(host: true, for_doctor: true, only: %w[schema hygiene drift refs]) inside rescue StandardError => error that files finding(nil, 'lint_unavailable', message).merge('severity' => 'info'). Each finding becomes finding(project, \"lint_#{code}\", \"#{path}#{line ? ':' + line.to_s : ''} #{message}\") where project is the Finding's project when known (carry the Target's project id into the finding by adding a :project member to Finding set from the Target; keep it out of to_h) else nil; severity error leaves the finding blocking (no severity key), warn merges 'severity' => 'warn', info merges 'severity' => 'info'. The step must not recurse: Lint.run with for_doctor never calls Manifest.for or anything that runs DoctorCommand."
    cost: "Measure `bin/polispec doctor` before and after on the scratch host with one project; report both times. If the added time exceeds 1.5 s on a project of the size of this repository, say so in the report rather than trimming rules."
  data_fixes:
    provenance: "specs/provenance.impl.yml line 90: the plain scalar after `skips:` contains `: ` and breaks the parse. Wrap that single value in double quotes (it contains no double quote character) and change nothing else in the file."
    smoke_impl: "specs/smoke.impl.yml line 83: the plain scalar after `events:` contains `project: ` and double quotes. Wrap that single value in single quotes (it contains no single quote character) and change nothing else."
    openapi: "web/public/openapi.yml has Psych anchors (&1 .. &3) and aliases (*1 .. *3) from a Ruby dump of shared objects. Replace the file with the same document without anchors: load it with YAML.safe_load(text, aliases: true), round-trip it through JSON (JSON.parse(JSON.generate(doc))) to break object sharing, and write YAML.dump of the result, then confirm the key order of the original is preserved and that JSON.generate(YAML.safe_load(new)) equals JSON.generate(YAML.safe_load(old, aliases: true)). The visible diff should be the 19 alias sites expanded; if the dump reformats anything else (quoting style, indentation), report it instead of hiding it."
    webapp_impl: "specs/webapp.impl.yml line 160: the key events under design.author repeats the one at line 169, so the loader drops this text. Rename the key on line 160 to adapter_events and change nothing else in the file."
  smoke_scenario:
    file: "smoke/scenarios/lint.yml, schema polispec.smoke-scenario/v1, unit commands/lint, written in the style of smoke/scenarios/agents-render.yml and validated with bin/polispec validate smoke-scenario."
    steps:
      - "fixture: global example, one project shop (variant service, status live) with a files entry. Steps run the tree's own polispec as {{polispec}}."
      - "1. `lint` with cwd {{project.shop}}: exit 0, stdout includes 'polispec lint:' and '0 errors'."
      - "2. `lint --json`: exit 0, json ok true."
      - "3. Append a repeated top-level key to a copy of specs/polispec/roster.yml in the project (sh -c, cwd {{project.shop}}), then `lint`: exit 1, stdout includes yaml_duplicate_key and the file name."
      - "4. A file with an alias (`a: &x 1` and `b: *x`) named probe-alias.yml under specs/polispec: exit 1, stdout includes yaml_alias."
      - "5. A file with a tab after a colon: `lint` exit 0 with yaml_tab in stdout; `lint --strict` exit 1."
      - "6. Hand-edit .agents/directives/envs.md: `lint` exit 1 with agents_drift; `lint --only hygiene` exit 0."
      - "7. `lint --only bogus`: exit 2, stderr includes 'usage'."
      - "8. Write gate: `plan ledger --from dup-ledger.yml` is not needed; create dup-ledger.yml (a valid starter ledger text with a repeated top-level key `host`) and run `apply ledger --from dup-ledger.yml`: exit 1, output includes lint_failed, and the ledger file's sha256 before and after are equal; then the same with POLISPEC_LINT_ON_WRITE=off in the step env and confirm the apply proceeds past the gate (it may then stop at confirm_required; assert only that lint_failed is absent)."
      - "9. doctor: `doctor --json` includes a finding kind lint_yaml_duplicate_key; with POLISPEC_LINT_DOCTOR=off it does not."
      - "10. `lint --shipped`: exit 0 (the tree the suite runs from is clean)."
      - "11. Parity: `validate auto` of the clean roster file and `lint` of the same file as an operand agree (both exit 0)."
    notes: "If the scenario runner's expect keys cannot express a step as written, reshape the step with sh -c and grep, keep the intent, and report the change. The runner's isolation env names are listed in specs/app.yml smoke.isolation; find how POLISPEC_LINT_ON_WRITE and POLISPEC_LINT_DOCTOR are passed to a step (step env) in schemas/smoke-scenario.v1.yml."
  docs:
    readme: "README.md: one command-table row after the validate row: `polispec lint [PATH...] [--host] [--shipped] [--only RULE,...] [--strict] [--json]` | Sweep generated and shipped files for schema, hygiene, drift, reference and description findings; read-only. And the three settings in the settings list beside polispec.description.strict, in its wording (README.md ~line 520)."
    operator: "docs/operator.md: three rows in the settings table beside polispec.description.strict (~line 179); and a new section `## Linting generated files` placed after the section that documents settings, 15 to 30 lines: what the verb sweeps in each scope, the rule list with every code and its severity, exit codes, the write gate (sites, the lint_failed error and polispec.lint.on_write off to restore 0.41.1), the doctor findings (lint_<code>), and the limits paragraph of specs/app.yml#lint. State the honest limits: lint reads the working tree, harness integrity is not enforcement, markdown generators are checked for text validity only."
    skills: "skills/polispec/SKILL.md and skills/polispec-specs/SKILL.md: after the step that says to run polispec validate, add one sentence each: run `polispec lint` (project scope) after generating or editing spec files and read its findings; a clean lint proves loader-safe YAML and agreement with source, not safe composition."
slices:
  - id: core
    owns_paths: [lib/polispec/lint.rb, lib/polispec/lint/hygiene.rb, lib/polispec/lint/documents.rb, lib/polispec/schema/check.rb, lib/polispec/cli.rb, lib/polispec/engine.rb, polispec.rplugin.yml]
    depends_on: []
    deliverable: "Finding, Target, Report; Hygiene; Documents; Schema::Check with CLI::Validate delegating; Lint.check_text and guard_write!; the three settings readers and setting definitions; Lint.run stub that requires lint/sweep."
    detail: "design.findings, design.report, design.hygiene, design.documents, design.schema_check, design.engine, as written. Edit engine.rb and polispec.rplugin.yml only for the three settings; edit cli.rb only to delegate Validate."
    acceptance: "verification.core"
  - id: sweep
    owns_paths: [lib/polispec/lint/sweep.rb, lib/polispec/lint/targets.rb, lib/polispec/lint/shipped.rb, lib/polispec/lint/refs.rb, lib/polispec/lint/drift.rb, lib/polispec/commands/lint.rb, lib/polispec/classify/benign.rb]
    depends_on: [core]
    deliverable: "Lint.run, project, host and shipped target discovery, the shipped table, drift and refs rules, the polispec lint command and its benign classification."
    detail: "design.sweep, design.targets, design.shipped, design.drift, design.refs, design.command. Finding already has the :project member (core defines it); set it from the Target when a rule builds findings for a target."
    acceptance: "verification.sweep"
  - id: gate
    owns_paths: [lib/polispec/commands/apply.rb, lib/polispec/ledger.rb, lib/polispec/registration.rb, lib/polispec/manifest.rb, lib/polispec/agents_render.rb, lib/polispec/commands/behavior.rb, lib/polispec/commands/exceptions.rb, lib/polispec/deployments.rb, lib/polispec/delegate/grants.rb, lib/polispec/commands/code.rb, lib/polispec/packages.rb]
    depends_on: [core]
    deliverable: "The write gate at the eleven sites of design.write_gate."
    detail: "design.write_gate. One added line per site (plus a require_relative where needed); change nothing else in those files."
    acceptance: "verification.gate"
  - id: wire
    owns_paths: [lib/polispec/commands/doctor.rb, smoke/scenarios/lint.yml, specs/provenance.impl.yml, specs/smoke.impl.yml, specs/webapp.impl.yml, web/public/openapi.yml, README.md, docs/operator.md, skills/polispec/SKILL.md, skills/polispec-specs/SKILL.md]
    depends_on: [sweep, gate]
    deliverable: "doctor integration, the smoke scenario, the three data fixes, the docs."
    detail: "design.doctor, design.data_fixes, design.smoke_scenario, design.docs."
    acceptance: "verification.wire"
shared_surfaces:
  - "lib/polispec/lint.rb: core owns it; sweep and doctor use Finding#project, which core defines."
  - "No two slices edit the same file."
verification:
  core:
    - "ruby -wc on every new or changed .rb file prints Syntax OK."
    - "The validate parity oracle of design.schema_check: validate-before.txt equals the 0.41.1 reference line for line; validate-after.txt equals validate-before.txt except the three files named there."
    - "Hygiene probes through a throwaway Ruby driver in S/core (not in the tree) calling Polispec::Lint.check_text on texts you write: duplicate key (codes and line numbers), a duplicate key under a nested mapping and inside a list item (pointer), an alias, a second document, a tab after a colon, a plain on/off/yes/no value (and the same words quoted: no finding), trailing space inside a literal block scalar (no finding) and outside (one finding), CRLF, BOM, missing final newline, a non-string key (`on:`), invalid UTF-8, a JSON text with a duplicate key and one with a syntax error, :text with a NUL byte and with two trailing newlines. Report each as a table: text, expected, observed."
    - "Documents probes: examples/policy.shop.yml plus its sibling environments file validate to no finding; a copy of specs/polispec/roster.yml with project changed to an invalid value gives schema_invalid with the pointer /project; a copy declaring schema polispec.policy/v1 at roster.yml with expect 'roster' gives schema_kind_mismatch."
    - "guard_write!: with POLISPEC_LINT_ON_WRITE unset it raises Operator::Failure code lint_failed for a text with a duplicate key and returns the text for a clean one; with POLISPEC_LINT_ON_WRITE=off it returns the duplicate-key text; the Failure payload carries path and problems."
    - "bin/polispec settings list shows the three keys with defaults on, on, off; settings set polispec.lint.strict on then unset round-trips in the scratch settings file."
  sweep:
    - "ruby -wc on every new or changed .rb file."
    - "bin/polispec lint --shipped in the worktree after slice wire has fixed the three data files exits 0 and prints no error; before that it must report exactly the three files' syntax or alias errors (yaml_syntax for the two blueprints, yaml_alias for openapi) and nothing else as error. Report every warn and info it prints and what each means; fix the table, not the file, when a warn is a table mistake."
    - "Project scope on a copy of examples/clinic in S/sweep: exit 0; then inject, one at a time, a duplicate key, an alias, a wrong schema id at specs/polispec/policy.yml, a hand edit of .agents/directives/envs.md after `agents render` made it, and a hand edit of a behavior v2 surface file if the clinic has none use packages/guided-learner exported to a scratch repo with polispec behavior render --write then edited: each yields the expected code and exit 1, and removing the injection returns exit 0."
    - "--only filters: --only hygiene on the injected duplicate key still fails, --only drift on it passes; --strict turns a yaml_tab warn into exit 1; --json parses with ruby -rjson and has ok, targets, counts, findings."
    - "Usage: `lint --only bogus`, `lint --nope`, `lint /does/not/exist` each exit 2 with the usage line on stderr."
    - "Host scope with scratch POLISPEC_LEDGER (a ledger init'd by bin/polispec ledger init), POLISPEC_GLOBAL pointing at examples/clinic's global files or a copy of a scratch shelf with a global.yml and one module: exit 0; add a duplicate key to the shelf module: exit 1 naming <shelf>/modules/NAME.yml; a ledger project whose repo does not exist: warn ledger_repo_missing."
    - "Harness drift: in a scratch HOME install a user-scope overlay with bin/polispec harness install (read docs/harness-controls.md for the exact arguments; claude-code, scope user, a one-control document you write in S/sweep), run lint --host: no harness_artifact_drift; edit the installed settings.json bytes the overlay owns; lint --host reports harness_artifact_drift with exit 1; `harness uninstall` the overlay when done. If installation cannot run on this host, say so and do not claim the rule verified."
    - "Manifest drift: in a scratch project registered in the scratch ledger, `manifest ID --write` is not allowed to commit on a real repo, so build the committed manifest by writing Manifest.for output with JSON.pretty_generate into the scratch repo by a Ruby driver, run lint (no drift), change status in the ledger scratch copy, run lint: manifest_drift warn."
    - "Classifier: `bin/polispec classify` or explain on the lines `polispec lint`, `polispec lint --host --json`, `polispec lint --only hygiene .`, `polispec lint --bogus` shows the first three benign (no action) and the last not benign."
  gate:
    - "ruby -wc on every changed .rb file."
    - "Every site: show the exact line added and the require. For each site produce one refusal and one success in the scratch environment, by driving the generator for real with an input that has a duplicate key or an alias where that is possible (apply ledger --from FILE; register with a --description that makes a proposal is not enough, so call Registration through a Ruby driver with a ledger text that has a duplicate key; exceptions through a Ruby driver calling the same private path or the verb with a TTY-less stub, as the 0.29.0 verification did; deployments, grants, manifest, agents render and behavior render through Ruby drivers that call the write function with a text the gate must refuse). For each refusal the target file's bytes are unchanged (sha256 before and after) and the error code is lint_failed; with POLISPEC_LINT_ON_WRITE=off the same call writes."
    - "A normal run of each generator that has a CLI (ledger init --dry-run, agents render, apply of a package into a scratch repo, manifest, behavior render --write on the clinic or guided-learner behavior file) still succeeds exactly as before: compare stdout and exit with a run of the pinned 0.41.1 at <pinned releases dir> (list its directory to find the commit directory; use its bin/polispec) on the same scratch inputs."
  wire:
    - "ruby -wc on doctor.rb. bin/polispec validate smoke-scenario smoke/scenarios/lint.yml prints ok."
    - "bin/polispec smoke run --unit commands/lint --no-record passes every step; show the output. bin/polispec smoke run --no-record (the whole suite) passes 45 of 45 or reports exactly which scenario fails and why (the composition.yml scenario is known to fail intermittently from a git worktree; rerun it alone from the main clone's tree is not possible, so rerun it once more here and report)."
    - "bin/polispec doctor --json on the scratch host: no lint finding on a clean host; a duplicate key injected into a registered scratch project's specs/polispec/roster.yml gives lint_yaml_duplicate_key with the project id; POLISPEC_LINT_DOCTOR=off removes it. Report the doctor wall time before (stash lint.rb away is not allowed; compare with the pinned 0.41.1 doctor on the same scratch host) and after."
    - "The four data files: bin/polispec validate auto still gives the same result as before for every other file (re-run the parity loop, diff against validate-before.txt: only the files named in design.data_fixes differ, and they now parse); git diff --stat on the three shows small diffs; openapi round-trip equality proven by the Ruby check in design.data_fixes."
    - "bin/polispec lint --shipped exits 0 with no error finding; list every warn."
    - "docs: every setting and the verb appear once in README.md and docs/operator.md; the new section lists every code of design.hygiene, design.drift, design.refs and the schema and description codes; no sentence promises more than specs/app.yml#lint."
    - "bin/polispec editions --check and bin/polispec doctor --json on the scratch host show no finding that the pinned 0.41.1 does not show, besides lint_ findings you can explain."
report:
  - "A table per slice of every probe: command or driver, expected, observed."
  - "Every file changed, with line counts, and every file created."
  - "Every place where the blueprint was ambiguous or wrong and what you did instead (the primary decides afterwards)."
  - "Anything you could not verify, with the reason, and which claim of specs/app.yml#lint it leaves unproven."
amendments_round_1:
  reason: "The primary's review of slice core and the worker's report. These override the matching design text above."
  helpers: "lib/polispec/lint.rb also defines Lint.finalize(findings) (dedupe, sort by path, line with nil last, code, cap of 20 per path and code with the 'N more like this' info), Lint.sort_findings and Lint.format_for(path) (:json, :yaml or :text by extension). Sweep must end with Lint.finalize and must use format_for. Require polispec/lint, never the sub-files alone."
  description_codes: "Description.warnings already returns codes prefixed description_ (description_missing, description_invalid); findings carry them as they are."
  tabs: "yaml_tab matches /\\A[ \\t]*\\t/ is not used; the after-colon or after-dash form is /(?:\\A|[ ])-\\t|:\\t/ outside block scalars. A tab in indentation is a Psych syntax error and reports yaml_syntax."
  mismatch: "schema_kind_mismatch stops the schema step for that document (no schema_invalid cascade)."
  behavior_v2: "A target of kind auto holding a behavior v2 document (schema polispec.behavior/v2, which Schema.kind_for does not map) is validated through Schema::Check; it is not schema_unrecognized."
  shipped_errors: "The core worker's crash sweep of the 143 tracked yml and json files found exactly these errors: yaml_syntax at specs/provenance.impl.yml:90 and specs/smoke.impl.yml:83, 23 yaml_alias findings in web/public/openapi.yml, and yaml_duplicate_key at specs/webapp.impl.yml:169. No warn. data_fixes now covers all four files."
out_of_scope:
  - Committing, tagging, staging, version bumps, CHANGELOG, FEATURES, TODO, specs/app.yml and .rproject; the primary does those after verification
  - Web routes and views, the web lint route, and any change to Description
  - Reading policies from trust refs, a schema kind for the shipped table, native harness probes
  - Codex and Antigravity specific behavior
