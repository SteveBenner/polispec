schema_version: 1
name: polispec
version: 0.53.1
capture_repair:
  syntax_only_shell: "Recognized static noninteractive bash, sh, and dash noexec invocations classify script operands as reads. The parser does not follow their file, inline, or stdin bodies. Caller-side substitutions, redirects, privilege, and surrounding commands remain visible. Unknown options, startup-environment overrides, interactive mode, and disabled noexec retain conservative classification. Stdin bodies with possible caller substitutions remain conservatively inspected."
  interpreter_stdin: "A literal existing script operand passed directly to an interpreter makes its stdin data, not code. Without that positive evidence, embedded-code inspection remains conservative."
  codex_wiring: "Doctor recognizes bounded literal script operands following known interpreters, including the shared Codex bridge launched with /usr/bin/python3. Finding a reference proves wiring only, not trust or enforcement in an already running session."
  judgment_integrity: "Appends refuse an unreadable journal tail or an unconnected head instead of continuing from a stale anchor, and advance the anchor only after a complete write. Verification holds the shared append lock and reports malformed JSON objects by archive and line. Historical malformed bytes and chain findings remain visible; they are never rewritten or rehashed."
kind: plugin
agent_skills:
  discovery: "Packaged skills are declared under contents.skills in polispec.rplugin.yml and generated into each native harness package by rplugin package. They locate the installed CLI and plugin-root documentation, inspect version and authority, resolve the target environment, and preserve the user's approvals and operator boundaries. Product skills ship in the plugin repository, not a machine-specific copy."
  operations: "Since 0.47.0 skills/polispec/SKILL.md is a lean router: positioning and reach in one paragraph, the rules that always hold (verdicts, the never list, warn handling, operator boundaries), installed CLI discovery, a task routing table that covers verdict explanation, validation and lint, --verbose, test promotion, stewardship, the web app, harness controls and the sealed plane, a create, modify, delete, move and register trigger table, and one table of every verb by who may run it. It distinguishes the host runtime from a development candidate and generated artifacts from observed enforcement. Reference prose lives in docs/cli.md and docs/agent-guide.md."
  advice: "Since 0.47.0 skills/polispec-advise/SKILL.md and its patterns.md scan an agent's history, a project or named files and data, read-only, and suggest specs and directives for the use case as spec drafts for polispec-specs to validate, lint and plan and as advisory directive text. Evidence comes only from the existing read-only verbs (digest, judgments list, exceptions list, explain, resolve, status) and named paths on one filesystem; it never walks from /, never reads production data or env files, redacts secrets and never suggests turning polispec.records.raw on without the user's yes. The lever order against repeated asks is declare, narrow, exception, allow-once, keyed on the source of the ask (POLISPEC-TOOL-UNKNOWN, POLISPEC-MCP-UNDECLARED, an environment rule warn, a deny), each with its classification and confirmer, and it drops levers the edition, the sealed plane or a kill switch removes. It writes no spec, ledger, exception, hook or setting, applies no plan and records no proposal, never coaches evasion, and never suggests overriding G-WEB-AGENT, the G-DELETE rules, R-POLISPEC-RUNTIME or POLISPEC-CONTROL-PROTECTION. polispec author draft is an optional hand-off, not a dependency. It adds no verb and no library code."
  awareness: "Since 0.47.0 rules/polispec.md carries a short Fewer asks digest and rules/polispec-stewardship.md the create, modify, delete, move and register triggers. Rule links exist for a native Claude Code install at user scope and through rplugin's rules directory, and an Antigravity plugin package carries rules/ as plugin files; every other harness reaches the same content through the skills, whose descriptions carry the triggers, so the router keeps the never list, warn handling and operator boundaries itself. Existing installs link a new skill only when polispec install --harness is run again, and a new skill is visible in a new session."
  reference_docs: "Since 0.47.0 docs/cli.md lists every registered verb by family with who may run it (agent, agent with the user's yes, operator, sealed operator, internal) and the document that explains it, and docs/agent-guide.md holds positioning, reach, layers from posture to match, the anatomy of an ask, the lever order, evidence sources, edition differences and the never-override list. Both are hand-maintained and are compared with polispec help by hand at release (no tool checks them); they carry no host-specific path, project id or name, which polispec lint --shipped does not scan for docs/, so they are reviewed by hand."
  uninstall: "skills/polispec-uninstall/SKILL.md runs the clean-uninstall dry run, shows it, and hands the person the real command."
  authoring: "skills/polispec-specs/SKILL.md distinguishes environment policy and composition, global and ledger proposals, application behavioral policies and canonical surfaces, code-spec packs, and application implementation contracts. It requires schema validation, composition planning, exact-plan approval when required, canonical-source edits, explicit candidate refs, rollout compatibility, and honest reporting of the trust ref actually in effect."
  registration: "skills/polispec-register/SKILL.md uses the operation skill's discovery path and the spec skill's shelf workflow, carries forward supplied context and approvals, and never widens the requested scope or writes the ledger or shelf directly."
  standalone_delivery: "NativeInstall discovers shipped skills/*/SKILL.md directories and links each for Claude Code user/project scope and Codex user scope. Uninstall uses the same discovered paths together with receipt-owned links and preserves foreign files, directories, and symlinks. Repeated installation is idempotent."
purpose: "Spec-based policy guardrails for agentic development and operations. Every live project carries a versioned policy and, beside it, an environment manifest (main, test, stable), both read from the trust ref; the policy declares what agents may do in each environment, how code is promoted, what data and secrets each environment may hold, when it is frozen, and which harness, model and effort each agent role gets."
vision:
  summary: "polispec began as a guard that keeps AI agents out of the live copy of an app and is growing into a library of operating practice: a release train, a data-handling regime or a quiet-hours policy written once, given parameters, composed into every project that needs it at any depth, inherited by every agent, and shown to hold. docs/VISION.md carries the direction with a maturity label per capability (Built, Partial, Planned, Idea) and ROADMAP.md the planned work; neither is a release commitment. This section restates them, and where the two differ those documents win; features indexes what is built, and FEATURES.md carries each release's build and deployment status."
  arc:
    guard: "One project and one rulebook, with allow, warn and deny. Built."
    pipeline: "Environments, promotion hops, gates, freezes, soak periods, deploy receipts and release directories. Built."
    composition: "Modules within modules, project and global shelves, typed parameters, nested projects, packages and the per-host catalog. Built since 0.20.0; catalog since 0.45.0."
    library: "Versioned specs imported across repositories and organisations, with a lock on exactly what was imported. Idea."
    proof: "Every composed rule paired with evidence that it holds: negative controls, smoke coverage, deploy receipts and the chained judgment, change and session records. Partial: coverage is proven per spec node, not per composed rule; since 0.49.0 a product's features are proven per target before stable (proof)."
  principles:
    - "Agents never write their own rules: every layer is read from a trust ref, the shelf's committed ref, the release tree, operator-only host state or a sealed source, never from a working tree an agent edits. The one exception is unsealed and deliberate: POLISPEC_GLOBAL points the shelf at a plain directory for scratch runs and smoke, and it is ignored while the plane is sealed."
    - "Composition only tightens by default: a lower layer loosens an upper rule only where that rule is overridable and the lower layer names it in overrides."
    - "Nothing is dropped silently: a part of a rulebook that cannot be applied is a layers_invalid finding, and promote refuses with policy_invalid."
    - "Judgment is deterministic: environment verdicts, gates, freezes, composition and the control ceiling use no model. Models only draft (author), give advisory description judgments (validate --semantic) and serve code specs (classifier and interpreter)."
    - "Claims carry evidence: native enforcement, certification and deployment are claimed only where observed, and a generated harness artifact is not evidence of enforcement."
    - "Shipped defaults carry nothing from one host: a host's own paths, ids, names and policy belong on its global shelf or in its ledger (install personal_defaults)."
    - "The operator keeps the last word: promotion to stable, stable deploys, pause, allow-once, catalog activation, exceptions, sealing and every loosening plan need the operator or the user's explicit yes, never an agent's."
  planned: "ROADMAP.md: the independent-review follow-up from 0.19.1 (P0 reproduce the post-write failure and prove prevention; P0 test the authority boundary's failure modes; P1 a cross-harness execution matrix with race, recovery and consistency; P2 a usability and overhead benchmark), and polispec claims no preventive enforcement until both P0 items are done (docs/CURRENT-STATE.md). Standing exemptions granted from the user's yes at the prompt, scoped to one rule, project, class and target and lapsing when the rule's digest moves, are planned; persistent exceptions (0.29.0) already cover the operator-recorded half, while the prompt-time grant, the digest lapse, a path-glob target for file tools, and listing open exceptions in the promote preview, status and doctor are not built."
  ideas: "Versioned module imports with a lock file, and signed modules that a sealed host alone accepts; a catalogue of practice modules beyond the shipped catalog (release trains, quiet hours, data residency, de-identification, on-call rotations, regulated data); parameter constraints and conditional includes; organisation layers above the host and profiles that take parameters; environments, rosters, behavior policies and harness controls that compose as modules; rule provenance, the include path that brought a rule in; modules that carry their own negative controls and smoke checklist, with coverage per composed rule; a fleet view across hosts."
  reach: "Claude Code and Codex are wired natively (plugin marketplaces, polispec install, rplugin). Hermes and the Antigravity CLI have generated native artifacts whose runtime enforcement is unverified on the release host; Pi and DeepSeek TUI are skills only; the Bubblewrap OS sandbox is planning only; the sealed plane and the lock edition ship enabled since 0.45.1, install seals no host, and no lock certification is claimed."
features:
  - { id: guard, status: built, since: 0.15.0, surfaces: [bin/polispec-guard, polispec hook pretool|session, polispec explain, polispec classify, polispec resolve], section: wiring, limits: "Judges only what a harness hook sends; a program the classifier cannot read, such as an interpreter running inline code, is an unknown write. A record proves what polispec judged, not that the harness obeyed." }
  - { id: resident_judge, status: built, since: 0.38.0, surfaces: [polispec judge, judge.json], section: install.resident_judge, limits: "Loopback and a per-start token only; any failure falls to the cold path, which after a judge wait gets the deadline less the seconds already waited." }
  - { id: fail_closed_launcher, status: built, since: 0.33.2, surfaces: [bin/polispec-guard, launcher.jsonl], section: install.guard_binary, limits: "Read tools pass when no verdict comes back; there is no fail-open toggle." }
  - { id: environments_and_promotion, status: built, since: 0.15.0, surfaces: [specs/polispec/environments.yml, specs/polispec/policy.yml, polispec promote, polispec deploy, polispec status], section: commands, limits: "Only the operator promotes to stable and deploys stable. A receipt proves a completed health check, not continuous availability." }
  - { id: gates_and_freezes, status: built, since: 0.15.0, surfaces: [promotion gates, freezes], section: model.gates, limits: "rrule is not evaluated; a freeze source that fails files a finding." }
  - { id: hermetic_and_release_dirs, status: built, since: 0.15.0, surfaces: [hermetic.<env>, deploy.strategy release_dirs, deploy.drain], section: commands, limits: "Hermetic isolation redirects variables into scratch and checks protected roots afterwards; it is not a sandbox." }
  - { id: roster, status: built, since: 0.15.0, surfaces: [specs/polispec/roster.yml, polispec roster, session text], section: wiring.session_path, limits: "Injected at session start and checked on edit; a harness that ignores the injected role is not stopped by it. R-ROSTER-ENV denies a secrets.read no role clears." }
  - { id: git_hooks, status: built, since: 0.15.0, surfaces: [polispec hook git], section: wiring.harnesses.git, limits: "A seatbelt for processes outside a harness, not a security boundary; POLISPEC_OPERATOR=1 skips it." }
  - { id: agents_render, status: built, since: 0.15.0, surfaces: [polispec agents render, AGENTS.md ENVS row, .agents/directives/envs.md], section: commands, limits: "Directive text; doctor and lint report drift, the guard does not read it." }
  - { id: code_specs, status: built, since: 0.15.0, surfaces: [polispec code, polispec code-hook, polispec specs], section: code_specs, limits: "code-hook fails open by design and no shipped hook file registers it; a host wires it itself." }
  - { id: composition, status: built, since: 0.16.0, surfaces: [includes, modules, global shelf, profiles, overrides, polispec resolve --layers], section: composition, limits: "Project shelves, typed parameters and child layers since 0.20.0; parameters are typed but unconstrained." }
  - { id: harness_controls, status: built, since: 0.18.0, surfaces: [polispec harness, polispec.control/v1], section: harness_controls, limits: "Enabled by default since 0.23.0; generated artifacts are not evidence of enforcement." }
  - { id: sealed_plane, status: built, since: 0.18.0, surfaces: [polispec seal, polispec plane, /etc/polispec/active.json], section: harness_controls.authority, limits: "Enabled since 0.45.1; install seals no host, activation needs the authenticated operator, no lock certification is claimed." }
  - { id: protected_authorizations, status: built, since: 0.18.0, surfaces: [polispec authorizations], section: protected_authorizations, limits: "Built, not installed or started on the release host." }
  - { id: behavior, status: built, since: "0.18.4 or earlier", surfaces: [polispec behavior, polispec.behavior/v1, polispec.behavior/v2], section: schemas.behavior_v2, limits: "Data an application-owned adapter enforces; v2 surfaces since 0.34.0. Never grants authority." }
  - { id: plan_apply, status: built, since: 0.21.0, surfaces: [polispec plan, polispec apply], section: stewardship, limits: "Loosening, mixed and global plans need --confirm with the exact plan id; a plan replays 14 days of judgment rows." }
  - { id: packages, status: built, since: 0.21.0, surfaces: [packages/environment-control 1.3.0, packages/guided-learner 1.0.0], section: stewardship.packages, limits: "Built-in steps only, no arbitrary commands." }
  - { id: stewardship, status: built, since: 0.21.0, surfaces: [polispec steward, rules/polispec-stewardship.md, R-POLISPEC-RUNTIME], section: stewardship, limits: "Step 4, personal defaults, warns and never aborts." }
  - { id: smoke, status: built, since: 0.23.0, surfaces: [polispec smoke, smoke.yml, smoke/scenarios], section: smoke, limits: "The ledger existed by 0.18.2; the bundled suite since 0.23.0. Coverage is per spec node, and an edited node is stale until a new passing run." }
  - { id: judgments, status: built, since: 0.25.0, surfaces: [polispec judgments, judgments.jsonl], section: judgments, limits: "Not signed; a chain proves internal consistency, not authorship." }
  - { id: explain, status: built, since: 0.26.0, surfaces: [polispec explain], section: commands, limits: "Read-only; what the hook would answer under enforce." }
  - { id: native_install_and_pin, status: built, since: 0.27.0, surfaces: [install.sh, polispec install, polispec pin, polispec settings, polispec ledger init], section: install, limits: "No Codex trust hash is written; Codex asks its user to review the hooks." }
  - { id: exceptions, status: built, since: 0.29.0, surfaces: [polispec exceptions, exceptions.yml], section: exceptions, limits: "Lift only asks and warns, matched on command text; never a deny, never under lock, no expiry." }
  - { id: delegation, status: built, since: 0.31.0, surfaces: [polispec delegate], section: delegation, limits: "The unsealed terminal confirmation made reachable from an application, not operator authentication." }
  - { id: delete_guard, status: built, since: 0.33.0, surfaces: [catalog delete-guard], section: delete_guard, limits: "A catalog spec since 0.45.0, off until the operator activates it." }
  - { id: web_app, status: built, since: 0.35.0, surfaces: [polispec web], section: web, limits: "Loopback by default; excluded from lock; the session is not operator authentication." }
  - { id: author, status: built, since: 0.35.0, surfaces: [polispec author, author port], section: author, limits: "Drafts only, validated and planned; excluded from lock." }
  - { id: manifest_and_index, status: built, since: 0.35.0, surfaces: [polispec manifest, polispec.app.yml, polispec.manifest.json], section: manifest, limits: "The authored app file grants nothing and the guard never reads it." }
  - { id: registration, status: built, since: 0.35.0, surfaces: [polispec register, polispec unregister], section: registration, limits: "Path entries have no trust ref and no environments." }
  - { id: effect, status: built, since: 0.35.0, surfaces: [polispec changes, polispec sessions, epoch notice], section: effect, limits: "Codex reload behavior mid-session remains unverified." }
  - { id: editions, status: built, since: 0.35.0, surfaces: [polispec editions, specs/editions.yml], section: editions, limits: "Lock is a separate checkout; certification needs observed enforcement." }
  - { id: descriptions, status: built, since: 0.35.0, surfaces: [description key, validate --semantic], section: description, limits: "Warnings unless polispec.description.strict is on; promote is not gated." }
  - { id: scratch_cap, status: built, since: 0.39.0, surfaces: [match bytes_over, fsize_unset, fsize_above, tree_over, shape bulk_write], section: scratch_cap, limits: "Mechanism only; the caps are a shelf module." }
  - { id: text_match, status: built, since: 0.40.0, surfaces: [match text_matches], section: text_match, limits: "Mechanism only; sees the text of the call, not a script run by path." }
  - { id: deployments_and_clean_uninstall, status: built, since: 0.41.0, surfaces: [polispec deployments, polispec uninstall --all, polispec restore], section: install, limits: "Controls are restored manually; the real runs need a TTY and a typed phrase." }
  - { id: lint, status: built, since: 0.42.0, surfaces: [polispec lint], section: lint, limits: "Schema and hygiene, not safe composition or enforcement." }
  - { id: contracts, status: built, since: 0.43.0, surfaces: [polispec contract, specs/polispec/contracts], section: contract, limits: "No signing or key management; the guard never reads contracts." }
  - { id: verbose, status: built, since: 0.44.0, surfaces: [--verbose, POLISPEC_VERBOSE], section: verbose, limits: "A trace for the person at the terminal, not an audit log." }
  - { id: catalog, status: built, since: 0.45.0, surfaces: [polispec catalog, catalog/tools, catalog/delete-guard, catalog/mcp], section: catalog, limits: "Nothing is active by default; activation is per host and operator-only." }
  - { id: fs_walk, status: built, since: 0.46.0, surfaces: [class fs.walk, shapes root_walk and slow_mount_walk], section: fs_walk, limits: "Mechanism only; no shipped rule." }
  - { id: proof, status: built, since: 0.49.0, surfaces: [polispec proof, specs/features.yml, proofs/<feature>.jsonl, gate builtin features_proven, proof_runner port], section: proof, limits: "A signature proves which producer ran the manifest's smoke command, not that the command tests anything; the operator confirms every weakening manifest change at promote --to stable. Off for a project until its policy includes the gate." }
  - { id: skills_router, status: built, since: 0.47.0, surfaces: [skills/polispec, skills/polispec-advise, docs/cli.md, docs/agent-guide.md], section: agent_skills, limits: "Advice is read-only; docs/cli.md and docs/agent-guide.md are hand-maintained." }
model:
  summary: "The engine's vocabulary as the code defines it. Each row names the constant it restates and no check ties the two, so where they differ the constant is the truth. A tool call becomes actions; an action has a class, an environment, hints and shapes; rules match actions; layers compose rules and the strictest verdict wins; the control ceiling caps the result; one record is written."
  verdicts: "Polispec::LEVELS allow, warn and deny. A harness with native ask (Claude Code, Hermes, Antigravity) asks the user on warn; Codex and the generic adapter (Pi, DeepSeek) render warn as deny with an allow-once id. Under polispec.enforce advise every verdict is recorded and the reply allows."
  environments: "Polispec::ENVIRONMENTS dev, test and prod, bound to a live project's branches main, test and stable and to its checkouts under envs_root. Engine::Envs.for_action resolves an action's environment from its path, ref or working directory; a path under the checkout root that names no environment resolves to prod."
  action_classes: "Polispec::ACTION_CLASSES: git.commit, git.push, git.tag, git.merge, git.rewrite, git.branch, release.publish, service.control, service.config, fs.write, fs.delete, data.write, data.copy, secrets.read, policy.edit, promote, deploy, control.edit, mcp.call, web.fetch, agent.spawn, shell.exec, fs.walk and, since 0.49.0, proof.write. The schemas' action_class enum adds tool.internal and tool.read, which the hook gives to a governed non-shell tool that no classifier turns into an action and to a read tool with no path."
  classifier_families: "Classify::Registry families, glob-loaded from lib/polispec/classify/commands/*.rb: bulk, controls, fs, generic, gh, git, mcp, postgres, release, secrets, systemctl and web_local, plus tool (lib/polispec/classify/tool.rb) for file tools. Shell families share Support::Family, which parses a line with Classify::Shell and classifies each command; fs_walk.rb and support.rb are helpers, not families. Classify.benign? and Classify.positive decide what is not unknown (harness_controls benign)."
  shapes: "Shapes::NAMES, the tags the classifiers and Shapes.annotate attach: bulk_stage, chained_release, latest_flip, lockfile_edit, pattern_kill, cargo_clean, worktree_force, tmux_kill, xargs_delete, web_local, bulk_write, root_walk and slow_mount_walk. The hook adds opaque_shell to the shell.exec action of a governed eval, source or . line. A shape decides nothing alone; only a rule that names it in match.shape does. The match.shape enums of schemas/policy.v1.yml and schemas/control.v1.yml list every Shapes::NAMES entry plus opaque_shell; web_local, which the catalog subspec tools/web-agent matches, was missing from both until 0.47.2, so a policy or control file naming it failed validation."
  match_keys: "Engine::Match::KEYS, equal to the policy.v1 match properties; a rule with any other key does not match, and every key of a match must hold. env; class (non-empty list); ref; crosses (data_classes or location); destructive (true); shape (list); server, operation, domain, tool (case-insensitive), role and path (File.fnmatch with FNM_PATHNAME and FNM_DOTMATCH), strings of at most 4096 characters; the scratch-cap keys bytes_over, fsize_unset, fsize_above and tree_over; text_matches; and the nine predicates. The ledger's defaults.rules match only env, server, operation, domain, tool, role, path, ref and class."
  predicates: "Predicates::NAMES, booleans each answered by a check within the hook budget: lock_held (another live agent holds the path in TMP_AGENT_FILE_LOCKS.yml), live_binary, delete_protected, delete_protected_file, supervised (through polispec.supervisor.status_command), pin_regress, tag_claimed, base_unpushed, public_remote, public_path, push_unscanned (the three read polispec.exposure.visibility_file and the attestations under the state home's exposure/ directory) and in_development (false under lock and under polispec.relax.dev off). global.v1 and module.v1 accept a predicate only as true."
  rules: "A rule has id, match, verdict, reason and optional requires (gates.to_test or gates.to_stable), overridable and overrides. Project rule ids match ^R-[A-Z0-9-]+$; global and module rule ids ^[A-Z][A-Z0-9]*-[A-Z0-9-]+$; gate ids begin G- and freeze ids F-."
  composition: "Within a layer the first matching rule wins. Across the chain (catalog layer, global shelf with its profile and included modules, project policy with its local modules, child projects nearest last) the strictest verdict wins and a tie goes to the later layer. A rule with overrides removes an upper rule only when that rule is overridable and the overriding rule also matches the action; anything else is a composition error."
  judgment_order: "Engine.explain runs once per target (one live project, or the baseline). An active pause of that project answers allow POLISPEC-PAUSE for every action of the target, while other targets of the same call are still judged. Then per action: a clean prod release read answers allow POLISPEC-RELEASE-READ; a freeze over promote.to_stable denies a prod promote with the window id; then the stricter of R-POLISPEC-RUNTIME and the composed rule, else allow NO-RULE; a secrets.read the roster clears for no role becomes deny R-ROSTER-ENV. Per target (settle), exceptions lift warn rows, the worst verdict wins, and an unsealed warn may be redeemed by an allow-once (valid 600 s). The hook takes the worst over all targets, and the control ceiling then caps the result independently."
  builtin_rules: "Rule ids no rulebook declares: R-POLISPEC-RUNTIME, POLISPEC-RELEASE-READ, POLISPEC-PAUSE, NO-RULE, R-ROSTER-ENV, POLISPEC-CONTROL-PROTECTION, POLISPEC-ROOT-GUARD, POLISPEC-CONTROLS (the default id of a control result), POLISPEC-TOOL-UNKNOWN and POLISPEC-MCP-UNDECLARED (ask under standard and deny under lock, only while their catalog gate is active), POLISPEC-INTERNAL (a fail-closed internal denial), POLISPEC-CODE (code-spec injection and denial) and POLISPEC-AUTHORIZATION-UNAVAILABLE."
  gates: "Operator::Gates built-in kinds: clean_tree, version_homes_agree, sha_ran_on (a deploys.jsonl row with health ok in env), sha_ran_on_test, not_frozen, soaked (hours, env), health_required, logs_quiet (services, window_minutes and max_over_baseline through polispec.logs.count_command) requires_live (project with min_version, or min_version_from and min_version_key) and, since 0.49.0, features_proven (mode report or enforce; see proof). A run gate takes pass exit_zero, run_in repo or active, env_from, hermetic and dir. A promotion to stable adds G-TESTED (sha_ran_on test) and G-FREEZE (not_frozen) when the policy omits them."
  freezes: "A freeze is a manual window (from, until) or a source: command (argv without a shell in the prod checkout, printing JSON windows, cached 300 s) or one of two named sources kept from the first consumer, teach.calendar and teach.activity, which run bin/teach calendar freezes --json (always filtered by kind, detail dropped) and bin/teach activity --json (course dropped). The two names are a wire to one application: the Teach and rEach policies moved to source: command with the same argv on their main on 2026-10-26, verdict-identical, and a later release removes the names once both stables carry that change. It carries applies_to promote.to_<env> or desk.dispatch, and optional kind, project, lead_minutes and lead_hours. rrule is not evaluated and files a finding."
  controls: "A control document (polispec.control/v1) has effects deny, restrict, ask, observe and inject, composed as a ceiling no environment allow lifts; overlays only tighten (harness_controls)."
wiring:
  summary: "How polispec is connected: which harness events call it, the path a tool call takes from harness to reply, the files it keeps and the ports it uses. A host's own bridges are not shipped and are not described here."
  entry_points: "bin/polispec runs Polispec::CLI.run, which lazy-loads lib/polispec/commands/<verb>.rb. bin/polispec-guard is the launcher every shipped hook runs. hooks/polispec.hooks.yml declares pre_tool (any tool, blocking, 10 s), session_start and subagent_start for rplugin; rplugin package generates hooks/hooks.json (Claude Code: PreToolUse, SessionStart and SubagentStart, no matcher, timeout 10, running ${CLAUDE_PLUGIN_ROOT}/bin/polispec-guard <pretool|session> --harness claude-code), hooks/codex.json (SessionStart and PreToolUse), .claude-plugin/, .codex-plugin/, the root plugin.json and .agents/plugins/marketplace.json, none edited by hand."
  harnesses:
    claude-code: "Plugin marketplace or rplugin (hooks/hooks.json), or polispec install --harness claude (PreToolUse, SessionStart and SubagentStart in settings.json, no matcher, timeout 10, with skill and rule links; refused while the plugin is enabled unless --force). Native ask; deny and ask reasons begin [POLISPEC <rule_id>]."
    codex: "Plugin marketplace (hooks/codex.json: SessionStart and PreToolUse) or polispec install --harness codex (one marked block in config.toml: PreToolUse *, SessionStart startup|resume|clear|compact and SubagentStart *, timeout 10). Codex asks its user to review and trust the hooks, and polispec writes no trust hash. No native ask: warn renders as deny with an allow-once id."
    hermes: "Through rplugin's harness extension (pre_tool_call, fail closed) or a control-bearing polispec harness install; Harness::Hermes answers {\"action\": \"block\"} with exit 2. The rendered entry and the session reply are unverified on the release host."
    antigravity: "rplugin renders no hook; only polispec harness install wires polispec.PreToolUse, and rules and skills reach it as text. Native runtime unverified."
    pi_deepseek: "Skills only. The guard accepts --harness pi and deepseek (deepseek-tui) through the generic adapter ({\"decision\": \"block\"}), but no wiring ships."
    git: "polispec hook git install <project> dev|test|prod|all points core.hooksPath at <state home>/git-hooks/<project>/<env>, whose pre-commit, pre-push and reference-transaction shims run bin/polispec hook git <hook> and chain to the previous hooks path. No adapter, fast path or control ceiling; records carry harness git."
    code_hook: "polispec code-hook pre|post|stop|session --harness claude|claude-code|codex|hermes|pi|deepseek|antigravity is the code-spec entry; the per-mode event check of code_specs commands is defined for claude and codex. No shipped hook file registers it; a host wires it in its own settings."
    controls: "polispec harness install writes control-bearing hooks that run bin/polispec hook pretool --harness <h> --controls-file <path> directly, without the launcher, so they have no fast path and no resident judge: Claude Code PreToolUse * (onFailure block from 2.1.295), Codex [[hooks.PreToolUse]], Hermes pre_tool_call with fail_closed, Antigravity polispec.PreToolUse. Managed scopes are the operator's."
  pretool_path:
    - "launcher: read stdin up to 8 MiB and map claude-code and deepseek-tui to their adapter names."
    - "fast path: while fastpath.txt, fastpath.watch and fastpath.tools are fresh, a listed tool whose input holds no needle is answered with nothing and logged to skips.jsonl; the hook rewrites the three files (Fastpath.refresh). Since 0.48.0 it rewrites them on every judged call, including when the harness-control gate is off (harness_controls false in config/harness-features.yml), with a null control digest in the key."
    - "binary: POLISPEC_BIN, PATH, ~/.local/bin, the rplugin store, <data home>/current, then the shim's own bin/polispec; none found is no_binary."
    - "judge: POLISPEC/1 to the resident judge on loopback within POLISPEC_JUDGE_BUDGET, waiting up to POLISPEC_JUDGE_WAIT; any other answer falls to the cold path and may start a judge, at most once per 30 s."
    - "cold path: bin/polispec hook pretool under the 8 s deadline."
    - "hook: HookCommand under PolicySource.memoize and the 7 s budget parses through the harness backend, canonicalises tools (shell aliases and Monitor to Bash; apply_patch split per file, MultiEdit per edits entry into Edit calls, at most 128), resolves the plane (a broken plane raises) and loads the ledger."
    - "classify: Classify.call runs every family and Shapes.annotate; under the control gate RootGuard adds its actions, Classify.positive gives web.fetch and agent.spawn, and an unclassified governed call gets an unknown tool.internal, tool.read or opaque shell.exec action."
    - "judge actions: group by owning project (Engine::Envs.owner); a live project is judged with its trust-ref policy (PolicySource.resolve, Engine.explain). Any other action is judged with the global baseline only when one exists (Layers.baseline?: a global.yml with rules or includes, profiles, or a live path entry) and its owner is not retired; otherwise it gets no environment judgment, and only the control ceiling sees it. Rule warns are lifted by matching exceptions."
    - "ceiling: Controls.evaluate over the control documents applies control effects, POLISPEC-CONTROL-PROTECTION, POLISPEC-ROOT-GUARD and the catalog gates, lifted by trusted declarations or control exceptions."
    - "compose: deny wins; with an active plane a control ask consumes or requests a one-use protected authorization; an ask an exception could cover records a proposal and appends the promote hint."
    - "render: under enforce the adapter renders the worst verdict; under advise it renders no verdict. In both modes an allow whose controls carry inject effects renders that text as context, and a Claude Code reply, even an empty one, may carry the once-per-epoch notice."
    - "record: one chained judgment record before the reply; events are queued and flushed from a detached child after it."
    - "fail closed: an error in the hook is a fixed denial (POLISPEC-INTERNAL, recorded best effort); no usable binary, the deadline, or any exit other than 0 (or, in pretool mode, 2 with a JSON reply) makes the launcher deny every non-read call and log launcher.jsonl. Exit 0 with nothing on stdout is the ordinary allow. Since 0.48.0 every fail-closed denial ends with Run polispec doctor, and GuardHealth (lib/polispec/guard_health.rb) reads 256 KiB tails of the last two judgment files and launcher.jsonl: the guard is failing while the newest event is a POLISPEC-INTERNAL denial, a judgment that recorded an error, or a pretool launcher denial, since the first failure after the last clean judgment; doctor reports guard_failing (blocking), status prints guard failing since T: <error>, and the session context carries the same line (error cut at 160 characters, a read error dropping only the line)."
  session_path: "SessionStart and SubagentStart run the launcher in session mode (no fast path), then HookCommand#session. A working directory in a live project gets additionalContext of at most 1200 characters: project, environment and branch, the branches, pause and freeze state, policy digest, source and guard mode, the session's role and the roster roles, and the policy's agents.instructions. Every session start writes a session record with its epoch. Any failure exits 0 with no output."
  state_home: "POLISPEC_STATE_HOME while unsealed (the launcher honours it only while /etc/polispec/active.json is absent), else $XDG_STATE_HOME/polispec, else ~/.local/state/polispec; directories 0700 and files 0600 unless noted. Chained streams: judgments.jsonl and changes.jsonl, each with a .head.json anchor and a .lock. Logs: sessions.jsonl, skips.jsonl, launcher.jsonl, shadow.jsonl and shadow.1.jsonl (since 0.48.0), events.jsonl (the events fallback), pauses.jsonl, allow_once.jsonl, promotions.jsonl, deploys.jsonl, spec_promotions.jsonl, delegate_runs.jsonl and exception_proposals.jsonl. Files: state.yml (deploy state), epoch.json, deployments.json, smoke-heads.json, scratch-sizes.json, fastpath.txt, fastpath.watch, fastpath.tools, judge.json, judge.log, judge.spawn, shadow.json and shadow.lock (since 0.48.0) and operator-<name>.lock. Directories: cache/ (composed policies and rosters, last-good policies, freeze and supervisor caches, code blobs), installs/, catalog/, delegate/, web/, trace/, shadow/ (since 0.48.0, the shadow hand-off files), author/, register/, git-hooks/, notices/ and the code-spec sessions and baselines."
  sealed_paths: "/etc/polispec/active.json and /etc/polispec/generations select the protected generation; /var/lib/polispec/<stream>.jsonl holds operator records (harness_pauses, harness_scans, harness_authorizations, harness_installations, activation_transactions); /run/polispec/authorizations.sock is the authorization service. While sealed, the plane's paths (ledger, global, catalog, code_state, code_specs_repo, envs_root, home) replace every mutable source."
  config: "Ledger: the sealed path, else POLISPEC_LEDGER, else polispec.ledger, else $XDG_CONFIG_HOME/polispec/ledger.yml, else ~/.config/polispec/ledger.yml. Global shelf: the sealed path, else POLISPEC_GLOBAL (a directory), else polispec.global.repo at polispec.global.ref under polispec.global.path. Settings: setting._resolution. Data home: install.data_home."
  events: "Events.emit shapes a payload and sends it through Rplugin::Ports.for(\"polispec\").events. It falls back to <state home>/events.jsonl while the state home is redirected, the plane is broken, the SDK is missing or the port fails, and never raises. Shaped: polispec.judgment (the record without raw), polispec.promote, polispec.deploy, polispec.pause, polispec.catalog, polispec.allow_once, polispec.finding, polispec.delegate and polispec.smoke. Passed through: polispec.web, polispec.author, polispec.authorization (the protected authorization service), polispec.authorization_client, polispec.control.observed, polispec.code.finding and polispec.code.inject. Two emits call the port directly and have no events.jsonl fallback: polispec.control from a committed harness-control install (HarnessControls::Lifecycle) and the polispec.finding of the harness-control environment scan. No event carries raw command text or file contents."
  ports_use: "events: every emit. state: read and append only for the unsealed harness_scans and harness_installations streams; polispec keeps its own state home and does not resolve it through the port. schedule: harness-control schedules (install, uninstall, status; kill switch POLISPEC_SCHEDULE_DISABLED). decide: code-spec classification and validate --semantic (POLISPEC_CODE_DECIDE=off). author: extension adapters first, else the standalone harness-cli adapter. notify and registry: declared optional, called by no code."
  standalone: "Without rplugin the guard, hook, records, operator verbs, web app and author run on local files: events go to events.jsonl and author uses the standalone adapter. Schedules, the decide port and the unsealed harness-control state streams need the SDK, loaded lazily from $RPLUGIN_HOME or ~/.rplugin/lib/rplugin.rb, and report unavailable without it."
ports:
  required: [state, events]
  optional: [schedule, notify, registry, decide, author, proof_runner]
  declared:
    - { name: author, standalone: "Polispec::Author::Adapters::HarnessCli in lib/polispec/author/adapters/harness_cli.rb", summary: "open(context) returns a session, turn(session, text) streams delta events and returns the done event, close(session) ends it; see author and extension_points ports_declared." }
    - { name: proof_runner, since: 0.49.0, standalone: "Polispec::Proof::Adapters::Local in lib/polispec/proof/adapters/local.rb", summary: "submit(request) returns a run id, status(id) returns queued, running, done or failed, fetch(id) returns the signed polispec.proof/v1 records; see proof runner." }
  use: "See wiring ports_use: notify and registry are declared optional and no code calls them; secrets and corpus are not used (corpora null)."
setting:
  _resolution: "Since 0.27.0, unsealed: RPLUGIN_POLISPEC_<KEY> env, then the short POLISPEC_<KEY> env (the key without polispec., upper-cased, every other character an underscore: POLISPEC_SMOKE_PATH, POLISPEC_CODE_SPECS_REPO; polispec.operator is POLISPEC_OPERATOR_NAME, polispec.author.enabled is POLISPEC_AUTHOR, polispec.edition has none), then the rplugin settings snapshot ($XDG_STATE_HOME/rplugin/polispec/settings.resolved.json), then the native settings file (POLISPEC_SETTINGS, else $XDG_CONFIG_HOME/polispec/settings.yml), then the default. Three legacy variables are read before that lookup and so win over RPLUGIN_POLISPEC_<KEY>: POLISPEC_LEDGER, POLISPEC_SMOKE and POLISPEC_SPECS_REPO. Sealed: the plane only. The manifest polispec.rplugin.yml is the source of every setting; the rows below restate its keys and descriptions."
  polispec.enforce: "advise logs every verdict and never blocks; enforce applies allow, warn and deny. Default advise; an active sealed plane forces enforce unless its own settings say advise."
  polispec.ledger: "Path of the host's ledger of governed projects. POLISPEC_LEDGER overrides it only while unsealed; sealed authority selects the protected ledger. Default ~/.config/polispec/ledger.yml (under XDG_CONFIG_HOME when set)."
  polispec.operator: "How deny and next-step messages name the person who promotes to stable and redeems allow-once. Default: the operator."
  polispec.code.specs_repo: "Path of the code specs repository. POLISPEC_SPECS_REPO overrides it only while unsealed. Default ~/polispec-specs."
  polispec.code.enforce: "advise or tiered; default tiered. advise logs code-spec findings and never blocks; tiered blocks MUST and MUST_NOT violations on changed lines and warns on SHOULD. polispec.enforce governs environment and harness-control verdicts, not code specs."
  polispec.code.check_at: "pre_write or post_write; default pre_write. pre_write checks the edited text and denies before anything lands; post_write lets the write land and blocks with the findings. SHOULD findings are always reported after the write."
  polispec.code.inject: "once or every_write; default once. once injects a language's spec chain before the first write per session and chain digest, and again after compaction; every_write injects before every write."
  polispec.global.repo: "Path of the git repository that holds the global layer; default empty, which means no global layer. POLISPEC_GLOBAL, a plain directory, overrides it while unsealed for scratch runs; sealed authority supplies the shelf."
  polispec.global.ref: "Ref of polispec.global.repo the global layer is read from, never its working tree; default main."
  polispec.global.path: "Directory inside polispec.global.repo that holds global.yml, profiles.yml, exceptions.yml, modules/, packages/ and paths/; default polispec."
  polispec.exposure.audit_command: "Argv (no shell) that polispec exposure scan runs in the repository with POLISPEC_EXPOSURE_REPO, POLISPEC_EXPOSURE_FROM, POLISPEC_EXPOSURE_TO and POLISPEC_EXPOSURE_REMOTE set, under a 600 s limit; exit 0 records an attestation; default empty, which makes the verb refuse with exit 2."
  polispec.exposure.visibility_file: "Path of the YAML file with public_remotes and private_remotes glob lists the visibility check reads first; default ~/.config/release-gate/visibility.yml."
  polispec.supervisor.status_command: "Argv (no shell) that prints JSON {units, pids} for the components a supervisor runs; rules with match.supervised read it through a 60 s cache; default empty, which makes the predicate unavailable."
  polispec.logs.count_command: "Argv template (no shell) the logs_quiet gate runs to count log lines, with {service}, {since} and {until} in UTC ISO 8601, printing one integer; default empty, which fails the gate closed."
  polispec.edition: "Requested edition standard or lock; default standard. EDITION lock cannot be downgraded through a mutable setting. Certification requires observed enforcement evidence."
  polispec.root_guard: "Initially false; a distinct follow-up exposure record can arm it. Lock refusal on root-equivalent or unknown exposure forces the guard."
  polispec.records.raw: "off or on; default off. on adds the classifier's raw view of the judged command or target (at most 2048 bytes) to each judgment record in local state; off keeps only the call digest. Raw text never goes through the events port."
  polispec.relax.dev: "on or off; default on; the lock edition treats it as off. Kill switch for the in_development predicate: off (or POLISPEC_RELAX_DEV=off) makes it false everywhere, so the rule TOOL-OPAQUE-DEVELOPMENT (shipped through 0.44.1, the catalog's tools/declared since 0.45.0) declares nothing and a governed eval, source or . line asks POLISPEC-TOOL-UNKNOWN in every project, as in 0.29.0."
  polispec.exceptions: "on or off; default on. Kill switch for persistent exceptions: off (or POLISPEC_EXCEPTIONS=off) honors no entry of exceptions.yml, records no proposal and appends no promote hint, so asks and warns read as in 0.28.3. polispec exceptions list still works."
  polispec.smoke.path: "Path of the smoke ledger. POLISPEC_SMOKE overrides it. Default smoke.yml at the git toplevel of the working directory."
  polispec.smoke.live: "on or off; default on. Kill switch for polispec smoke run --live: off (or POLISPEC_SMOKE_LIVE=off) records every live step blocked live_disabled without launching a harness."
  polispec.proof.runner: "Adapter of the proof_runner port: local (built in, default) or the id of an adapter an rplugin extension declares under adapters: proof_runner:. POLISPEC_PROOF_RUNNER=off is its kill switch: every adapter raises unavailable and proof run refuses runner_unavailable."
  polispec.description.strict: "on or off; default off. off: a rulebook with no description, or one the linter rejects, is a description_missing or description_invalid warning from validate and doctor. on: validate fails it. The guard never judges by it."
  polispec.lint.on_write: "on or off; default on. on: a generator that writes a rulebook, ledger, manifest, index, exceptions file, deployments manifest or delegate grants file lints its output first and refuses an error finding with lint_failed, writing nothing. off: generators write as in 0.41.1."
  polispec.lint.doctor: "on or off; default on. on: doctor files the error, warn and info findings of the host scope of polispec lint as lint_<code> findings. off: doctor files none."
  polispec.lint.strict: "on or off; default off. on: a warn finding fails polispec lint (exit 1), as --strict does for one run. Description findings keep following polispec.description.strict."
  polispec.verbose.trace: "on or off; default on. on: a run with --verbose also writes its trace to a file under <state home>/trace/ (0600). off: --verbose streams to stderr only and writes no file."
  polispec.web.bind: "Address polispec web listens on; default 127.0.0.1. Any address that is not a loopback address is refused unless polispec web is started with --expose on a TTY after the typed phrase expose polispec web."
  polispec.web.port: "TCP port of polispec web; default 7421; 0 picks a free port."
  polispec.web.public_origin: "Optional exact HTTPS origin for an external reverse proxy; empty keeps local HTTP. Used for links, Host and Origin checks, and Secure cookies. Does not configure routing."
  polispec.web.theme: "Initial theme of polispec web: system (light or dark from the browser), light, dark, apple-noir, apple-austere or tronwave; default system. The browser's own choice overrides it per viewer."
  polispec.author.enabled: "on or off; default on. Kill switch for the author port: off (or POLISPEC_AUTHOR=off) makes every adapter raise unavailable before any process or request starts, and closes open sessions."
  polispec.author.adapter: "Adapter of the author port: harness-cli (built in, default) or the id of an adapter an rplugin extension declares under adapters: author:."
  polispec.notice: "on or off; default on. Kill switch for the in-band epoch notice the pretool hook adds once per session per epoch."
harnesses:
  claude-code: "supported: rplugin, the Claude Code plugin marketplace (SteveBenner/polispec), or polispec install --harness claude wires the guard hook; see docs/operator.md"
  codex: "supported: the Codex plugin marketplace (SteveBenner/polispec), polispec install --harness codex, or a host bridge wires the guard hook; see docs/operator.md; warn becomes deny with an allow-once id"
  hermes: "supported (manifest compatibility): native pre_tool_call backend through rplugin's harness extension or polispec harness install; runtime and consent unverified on the release host"
  pi: "skills-only: no native control backend and no shipped hook; the guard accepts --harness pi through the generic adapter for a host that wires it"
  deepseek-tui: "skills-only: no native control backend and no shipped hook; the guard accepts --harness deepseek through the generic adapter for a host that wires it"
  antigravity: "skills-only through rplugin, which renders no hooks for it. A separate polispec harness install generates agy CLI artifacts and protocol; native runtime unverified, GUI directive-only, lock unsupported."
  cowork: "unsupported"
  os: "sandbox planning only (harness_controls backend os); Bubblewrap namespace launch unavailable on the release host"
install:
  paths: "Since 0.27.0 polispec installs without rplugin: install.sh (fetch the newest or POLISPEC_REF tag, polispec pin, polispec install for each detected harness), a clone with bin/polispec pin and polispec install, the Claude Code and Codex plugin marketplaces, a gem built from polispec.gemspec (not published), or rplugin install polispec. rplugin hosts behave as before."
  guard_binary: "bin/polispec-guard runs the first usable polispec among POLISPEC_BIN, PATH, ~/.local/bin, the rplugin store, <data home>/current/bin/polispec, and last the polispec beside the shim; every candidate except the last must live outside the shim's directory, so a pinned release wins over a harness's cached copy. Since 0.33.1 a pretool reply the runtime writes with exit status 2 and a JSON object on stdout (a Hermes block, its fail-closed internal denial included) is passed through with that status; before 0.33.1 the shim treated every nonzero exit as a runtime failure, replaced the reply with the inline fallback and exited 0, so through the shim a Hermes deny was an allow unless the fallback pattern matched. Any other nonzero exit still takes the inline fallback. Since 0.33.2 the shim fails closed and has no inline fallback: it passes a reply through when polispec exits 0 (stdout printed when non-empty) or, in pretool mode, exits 2 with a JSON object on stdout; in every other case (no usable binary, any other exit status, or the 8 s deadline, POLISPEC_GUARD_DEADLINE 1 to 9, run with timeout -k 1 when timeout(1) is on PATH and a bash watchdog otherwise) a pretool call to a read tool (Harness::Base::READ_TOOLS, compared lower-case) passes with no output and every other pretool call is denied with exactly the bytes and exit status of HookCommand::FIXED_DENIALS for the harness (claude-code is claude and deepseek-tui is deepseek; an unknown harness name gets the reason on stderr and exit 2). Session mode exits 0 with no output on every failure. Each such decision appends one line to launcher.jsonl in the polispec state home with bash builtins: ts, tool, session, harness, mode, cause (no_binary, timeout or exit_<rc>) and decision (deny or pass). Stdin is read with head -c 8388609. There is no fail-open toggle; a user whose guard is broken repairs it from their own prompt."
  resident_judge: "Since 0.38.0 polispec judge serve keeps one Ruby process resident on 127.0.0.1 and bin/polispec-guard asks it before the cold run. judge serve binds an ephemeral loopback port and writes <state home>/judge.json (mode 0600 in the 0700 state home, written by temp file and rename: port, token of 32 hex characters generated per start, pid, runtime, version, started). The launcher reads that file with bash builtins, opens the port with bash's /dev/tcp, sends POLISPEC/1 <token> <pretool|session> <harness> <runtime dir> caller=<launcher pid> <payload bytes> and the hook input, and reads POLISPEC/1 <status> <reply bytes> and the reply, which is exactly what the cold path would print on stdout. Status 0 is printed and the launcher exits 0; status 2 with a JSON object in pretool mode is printed and the launcher exits 2. lib/polispec/judge.rb requires predicates itself since 0.47.4: from 0.47.1 to 0.47.3 the judge set Predicates::CALLER before anything had loaded Predicates, so in a process where nothing else loaded it first (every smoke fixture) every request answered error (NameError) and took the cold path. Anything else (no judge.json, connection refused, the budget POLISPEC_JUDGE_BUDGET overrun, stale, busy, error, a malformed reply, another status) appends a launcher.jsonl row with cause judge_<reason> and decision pass and takes the cold path under the 8 s deadline; since 0.45.2 a request the judge has accepted but not answered inside the budget keeps waiting on the same connection until POLISPEC_JUDGE_WAIT seconds after the request (an integer from 0 to 8, default 6, held below the deadline; 0 restores the earlier behaviour), a reply inside that window is served as usual and appends a launcher.jsonl row with cause judge_slow and decision pass, and when the wait ends without a usable reply the cold path runs under the deadline less the seconds already waited, rounded up to whole seconds and never below 1 s (computed before the caller's LC_ALL is restored, since EPOCHREALTIME takes the locale's decimal mark), so a slow judge no longer sends every waiting caller to its own cold start; absent, refused and stale causes also start a detached judge serve, at most once per 30 s (<state home>/judge.spawn holds the epoch seconds). POLISPEC_JUDGE=off skips the judge entirely. The fast-path skip (wiring pretool_path) comes first and never consults the judge. The judge accepts only a request whose token equals the one in judge.json, refuses headers over 512 bytes and payloads over HookCommand::INPUT_LIMIT (8 MiB), and answers a request from another runtime directory with stale and then exits. Since 0.47.3 the launcher's runtime directory (sent in the header and passed as POLISPEC_JUDGE_RUNTIME when it starts a judge) is the directory of its polispec with every symlink resolved (readlink -f, else the path as found); before, it was the directory of the link as found, so a re-pin behind ~/.local/bin/polispec kept the old judge serving old code, and launchers reaching one release through different links made each other's judge stale. It judges through HookCommand#judge_request, the same code the cold path runs, and appends the same flocked, hash-chained journal record. Since 0.47.1 the caller field carries the launcher's own pid ($$): the judge keeps it only when /proc/<pid> exists and belongs to the judge's uid, and the lock_held predicate walks that pid's ancestry instead of the judge's own, so an entry in TMP_AGENT_FILE_LOCKS.yml owned by the calling harness no longer reads as another live agent's lock (before, a judge-served call compared the owner pid with the detached judge's ancestors, never matched, and denied the holder's own writes with G-LOCK-HELD). A header with no caller, or a pid that fails the check, keeps the judge's own ancestry, which matches no harness, so every owned lock stays held. A judge older than 0.47.1 reads the extra field as part of the runtime directory, answers stale and exits, and the launcher starts the new one. It reloads the ledger, the global shelf and every live project's policy only when a content key changes: SHA256 over the ledger bytes, the rplugin and native settings files, the resolved settings snapshot, /etc/polispec/active.json, the runtime version, the shelf (the files of a directory source, or the commit of a repository source's ref read from the git refs, with git rev-parse as the fallback) and each live project's trust-ref commit; it never looks at a modification time. Path-resolution, settings, plane, epoch and location memos are dropped after every request. It exits after POLISPEC_JUDGE_IDLE seconds without a request (default 1800), removing judge.json, and logs each request to <state home>/judge.log (rotated at 1 MiB): ts, mode, harness, tool, status, duration_ms, key_changed, via. Since 0.52.0 the judge serves up to POLISPEC_JUDGE_THREADS requests at once (1 to 32, default 8) on worker threads, holds a request that arrives while every worker is taken until one is free, answers busy only past 64 open connections (the launcher then takes the cold path), reloads on a content-key change only after the requests in flight have finished, keeps each request's deferred events on its own thread, and reaps its detached event writers with Process.detach rather than a wait on any child; the launcher's default POLISPEC_JUDGE_WAIT is one second below the deadline (7), and after an extended wait that still times out with under 2 seconds left it denies the call as judge_timeout instead of starting a cold Ruby that cannot finish."
  data_home: "POLISPEC_DATA_HOME, else $XDG_DATA_HOME/polispec, else ~/.local/share/polispec: releases/<commit>/ (read-only, .polispec-release.json schema polispec.release/v1), current (atomic link), source.git (bare fetch of the public repository when no local source exists), and since 0.41.0 backups/<bkp_ id>/ (clean_uninstall row), kept here because an uninstall may move the state home."
  install_receipts: "polispec install writes <state home>/installs/<harness>-<scope>-<digest>.json (polispec.install/v1): target, wired root, files written, links and backups. uninstall removes only marked hooks and links that still match the receipt and renames the receipt; backups are never deleted."
  deployments: "Since 0.41.0 polispec keeps one manifest of where it is deployed: <state home>/deployments.json (polispec.deployments/v1, 0600, written by temp file and rename under deployments.lock). Each entry has id (dep_ plus 12 hex of sha256 over kind and target), kind, target, class (wiring, pins, rplugin or data), details, source (install or scan), recorded_at, updated_at and status (active or removed, with removed_at and backup_id). Kinds: hooks (a polispec install receipt: harness, scope, settings file, receipt path), controls (a harness-control installation the current user owns: installation_id, harness, scope), git_hooks (a project and env whose core.hooksPath is the polispec shim directory), pin (the native current link with its commit and the ~/.local/bin/polispec link), rplugin (the store link with its release commit, source and ref), plugin (a Claude Code or Codex marketplace install, tracked and reported, never removed by polispec), ledger, settings and state (the host's data files). polispec install, uninstall, harness install and uninstall, hook git install and uninstall, pin, ledger init, steward and apply --with-stewardship record or retire their entry after they succeed; recording is best effort and never fails the installer, and the guard hook never writes the manifest. polispec deployments [--scan] [--json] lists every entry with a live status: present, drifted (the target exists but no longer carries polispec's wiring), gone (the target no longer exists) or removed. --scan backfills entries from what already exists (install receipts, owned harness-control installations, shim directories under <state home>/git-hooks confirmed against git config, the native pin, the rplugin store link, enabled marketplace plugins, the ledger, the settings file and the state home) and reports what it added; a gone receipt is listed, never hidden or deleted."
  clean_uninstall: "Since 0.41.0 polispec uninstall --all [--keep wiring,pins,rplugin,data] [--dry-run] [--json] removes every active deployment in the manifest, after a scan, in the order controls, hooks, git_hooks, rplugin, pin, then data (ledger, settings, state home last). The default keeps nothing. First it writes a backup to <data home>/backups/<bkp_ id>/ (polispec.backup/v1 in backup.json: id, created_at, polispec version and runtime root, keep, the entries it acts on, and per file its original path, stored path, kind, mode, sha256 before and sha256 after the uninstall), a copy of deployments.json, and a copy under files/ of every file it is about to change or move. Each surface is removed by its own existing uninstaller, which removes only polispec's own hooks, links, blocks and shims and keeps foreign ones: NativeInstall.uninstall, HarnessControls::Lifecycle.uninstall (each own overlay still asks its own uninstall INSTALLATION_ID phrase; an overlay that needs the operator is reported as operator_required and skipped, never forced), GitHook::Installer#uninstall, rplugin uninstall polispec, the removal of the current link and of a ~/.local/bin/polispec link that points into the data home (release directories are kept, they are the rollback), and for data a move of the ledger, the settings file and the state home into the backup's data/ directory; a data path inside the global shelf directory or inside any git working tree (a ledger kept in the shelf repository, for example) is not moved and is reported kept, because the shelf and committed files are never touched. A gone entry is retired: its receipt is renamed .uninstalled-<stamp>. A plugin entry is reported with the harness command that removes it. The global shelf, the rulebooks committed in governed repositories, the release directories and the data home are never touched. The real run needs a TTY and the typed phrase uninstall polispec; --dry-run is open to anyone and prints the backup it would write and every step. The change record (kind uninstall) is written before the state home moves, so it travels into the backup. Exit 0 when every step ended ok, gone, kept or reported, 1 when any step failed or was skipped as operator_required, 2 on usage. The restore command is printed with the realpath of the running release (rplugin uninstall unlinks harness surfaces and keeps .pinned releases; native release directories are kept), so it still runs after the uninstall. Without --all, polispec uninstall --harness behaves as before. uninstall.sh, beside install.sh, finds the installed polispec (PATH, ~/.local/bin, <data home>/current, the rplugin store) and runs the dry run, then the real run with stdin from /dev/tty; POLISPEC_DRY_RUN=1 stops after the dry run and POLISPEC_KEEP passes --keep. skills/polispec-uninstall/SKILL.md runs the dry run, shows it, and hands the person the real command, which an agent shell cannot run."
  restore: "Since 0.41.0 polispec restore <bkp_id> [--mode rewire|bytes] [--dry-run] [--json] puts back what an uninstall --all removed, from <data home>/backups/<id>/. Data first, always by bytes: the ledger, the settings file and the state home are copied back, leaving the backup whole, only to paths that are absent, else data_conflict. Then, with --mode rewire (the default), each entry whose uninstall step ended ok is installed again, in the order pin, rplugin, hooks, git_hooks, controls (an entry that was already gone at uninstall stays removed) at its recorded target against the running polispec: pin swaps the current link back to the recorded release when its directory is still valid, else polispec pin --ref the recorded ref; rplugin runs rplugin install <recorded source> --ref <recorded ref>; hooks runs NativeInstall.install with the recorded harness, scope and project; git_hooks runs the installer for the recorded project and env; controls are reported manual with the polispec harness install command, because an installation receipt records no control document to reinstall from. With --mode bytes every backed-up file is copied back when the file now at its path is absent or still has the sha256 recorded after the uninstall; a file edited since is refused (edited_since) and left as it is. restore needs a TTY and the typed phrase restore polispec, writes a change record (kind restore), marks the restored entries active in the manifest, and stamps restored_at in backup.json; a backup is never deleted. Exit 0 when every item ended ok or manual, 1 on failed, data_conflict or edited_since, 2 on usage. polispec restore --list prints the backups. Limits: the controls kind is built through HarnessControls::Lifecycle.owned_installations and its uninstall; the release host has no installation, so it was run on a scratch host with a user-scope claude-code overlay (both phrases uninstall it and restore settings.json byte for byte, a wrong overlay phrase leaves it skipped with exit 1, rewire restore reports it manual); the scan of a git_hooks entry for test or prod still composes that environment's policy, which may append a policy event."
  personal_defaults: "Since 0.41.0 polispec is a global project: its shipped defaults (modules/, packages/, config/, rules/, skills/ of the running release, and since 0.45.0 catalog/) carry nothing taken from one host. Polispec::PersonalDefaults.findings reads tokens from the host (ledger project ids of 4 characters or more other than polispec, and since 0.41.1 the ledger host, as exact YAML scalars; ledger repo paths, the shelf directory and its git toplevel as substrings in the ~ and absolute forms bounded on both sides by a character outside [A-Za-z0-9_.-]; and a polispec.operator value other than the default as a whole word) and drops any token that also appears in config/ledger.starter.yml. doctor reports each hit as personal_default (warn) with file, line, token and source; polispec steward --check reports step 4 missing and exits 1 when there is any, and polispec steward reports step 4 and never aborts on it. rules/polispec-stewardship.md says that personal policy belongs on the global shelf or in the ledger, never in modules/, packages/, config/ or catalog/, unless the operator chose to ship it."
schemas:
  control: { id: polispec.control/v1, file: schemas/control.v1.yml, runtime: "Deterministic controls composed as an independent severity ceiling; mutable overlays may tighten only." }
  policy: { id: polispec.policy/v1, file: schemas/policy.v1.yml, path_in_project: specs/polispec/policy.yml }
  roster: { id: polispec.roster/v1, file: schemas/roster.v1.yml, path_in_project: specs/polispec/roster.yml }
  behavior: { id: polispec.behavior/v1, file: schemas/behavior.v1.yml, runtime: "Compiled data consumed by an application-owned adapter; authority comes from the release or authenticated package, never this declaration." }
  behavior_v2: { id: polispec.behavior/v2, file: schemas/behavior.v2.yml, since: 0.34.0, runtime: "Superset of v1 selected by its schema id. Adds directive scope, body_ref {path, sha256} for bodies kept outside the file (the compiled form carries body_sha256, never the text), duplicate_of, and the maps surfaces, frames, antifeatures, controls, messages and overlays.cutout. The compiled form polispec.behavior.compiled/v2 adds a surfaces map with the sha256 of each generated surface as rendered. A rule has one canonical directive; every other surface references it and is rendered from it." }
  environments: { id: polispec.environments/v1, file: schemas/environments.v1.yml, path_in_project: specs/polispec/environments.yml, note: "Read from the trust ref beside policy.yml and merged into it; the file wins over an inline policy environments block (finding environments_duplicate). Only the fields policy.v1 knows go to the engine; audience, exposure, host, operators, rollback, pii_spec, freezes and notes feed the [ENVS] render. A project's serves flag lives in its component manifest, not here." }
  smoke: { id: polispec.smoke/v1, file: schemas/smoke.v1.yml, path: "POLISPEC_SMOKE, then polispec.smoke.path, then smoke.yml at the git toplevel of the working directory." }
  features: { id: polispec.features/v1, file: schemas/features.v1.yml, since: 0.49.0, path_in_project: specs/features.yml, note: "The feature manifest; see proof." }
  proof: { id: polispec.proof/v1, file: schemas/proof.v1.yml, since: 0.49.0, path_in_project: "proofs/<feature>.jsonl", note: "One signed, chained record per line; see proof." }
  judgment: { id: polispec.judgment/v1, file: schemas/judgment.v1.yml, path: "judgments.jsonl under the polispec state home, one record per line, rotated at 16 MiB to judgments.<utc timestamp>.jsonl; validate judgment checks one record." }
  exceptions: { id: polispec.exceptions/v1, file: schemas/exceptions.v1.yml, path: "exceptions.yml at the root of the global layer (polispec.global.repo, ref and path), committed through polispec apply global; read from the committed ref, the directory layer or the sealed bundle." }
  ledger: { id: polispec.ledger/v1, file: schemas/ledger.v1.yml, path: "Unsealed: POLISPEC_LEDGER, then polispec.ledger, then ~/.config/polispec/ledger.yml. Sealed: verified protected authority selects the ledger.", note: "Since 0.35.0 a project entry may carry owner {uid, name}, registered_by and description, and the ledger may list paths (governed path entries, see registration)." }
  change: { id: polispec.change/v1, file: schemas/change.v1.yml, path: "changes.jsonl under the polispec state home, chained like judgments; see effect." }
  session: { id: polispec.session/v1, file: schemas/session.v1.yml, path: "sessions.jsonl under the polispec state home, one record per SessionStart and SubagentStart; see effect." }
  manifest: { id: polispec.manifest/v1, file: schemas/manifest.v1.yml, note: "Generated, read-only; see manifest." }
  deployments: { id: polispec.deployments/v1, file: schemas/deployments.v1.yml, path: "deployments.json under the polispec state home; see install deployments.", note: "Since 0.48.0 a Schema::KINDS kind: the deployments.json write gate and lint --host both validate it through Schema.validate and report the same schema_invalid finding." }
  backup: { id: polispec.backup/v1, file: schemas/backup.v1.yml, path: "backup.json in <data home>/backups/<bkp_ id>/; see install clean_uninstall." }
  app: { id: polispec.app/v1, file: schemas/app.v1.yml, path_in_project: polispec.app.yml, note: "Authored by the app; see manifest." }
  contract: { id: polispec.contract/v1, file: schemas/contract.v1.yml, since: 0.43.0, path_in_project: "specs/polispec/contracts/*.yml", note: "A versioned behavior contract; see contract." }
  contract_vocabulary: { id: polispec.contract-vocabulary/v1, file: schemas/contract-vocabulary.v1.yml, since: 0.43.0, path_in_project: specs/polispec/contracts/vocabulary.yml, note: "Owned by the project; see contract." }
  catalog: { id: polispec.catalog/v1, file: schemas/catalog.v1.yml, since: 0.45.0, path: "catalog/<spec>/catalog.yml in the release", note: "A shipped catalog spec and its subspecs; see catalog." }
  catalog_state: { id: polispec.catalog-state/v1, file: schemas/catalog-state.v1.yml, since: 0.45.0, path: "catalog/active.yml under the polispec state home while unsealed; source/catalog/active.yml in the protected generation while sealed", note: "Which catalog subspecs this host has activated and provisioned; see catalog." }
  index: { id: polispec.index/v1, file: schemas/index.v1.yml, note: "Host-wide index of the current user's governed apps and paths, plus published indexes of other users; see manifest." }
  global: { id: polispec.global/v1, file: schemas/global.v1.yml, path: "global.yml under polispec.global.path of the shelf", note: "includes, rules, fallback_rules, gates, preflight, freezes, hermetic, delete_protected and protected_roots; see composition." }
  profiles: { id: polispec.profiles/v1, file: schemas/profiles.v1.yml, path: "profiles.yml on the shelf", note: "personal, service and live, each a list of module names a project's profile includes." }
  module: { id: polispec.module/v1, file: schemas/module.v1.yml, path: "modules/<name>.yml on the shelf, specs/polispec/modules/<name>.yml in a project, or a catalog subspec file", note: "params, includes, rules, gates, preflight, freezes, hermetic and delete_protected; see composition." }
  package: { id: polispec.package/v1, file: schemas/package.v1.yml, path: "packages/<name>/package.yml in the release or on the shelf", note: "See stewardship packages." }
  smoke_scenario: { id: polispec.smoke-scenario/v1, file: schemas/smoke-scenario.v1.yml, path: "smoke/scenarios/*.yml", note: "See smoke scenarios." }
  delegate_grants: { id: polispec.delegate_grants/v1, file: schemas/delegate_grants.v1.yml, path: "<state home>/delegate/grants.yml", note: "See delegation storage." }
  editions: { id: polispec.editions/v1, file: schemas/editions.v1.yml, path: specs/editions.yml, note: "See editions." }
commands:
  - { name: behavior, status: built, usage: "polispec behavior compile FILE [--out json] [--root DIR] | export-package NAME | decide FILE EVENT FACTS.json | render FILE --surface ID [--root DIR] [--write] | drift FILE [--root DIR] [--surface ID]... [--json] | lint FILE [--root DIR] [--corpus GLOB]... [--json]", note: "since 0.18.4 decide renders empty arrays and maps as [] and {}; since 0.34.0 render, drift (exit 1 on drift) and lint (exit 1 when a surface, message, directive or corpus sentence of 8 or more tokens overlaps a directive's rule or body by 0.8 or more without naming it; duplicate_of exempts only the linked pair from each other)" }
  - { name: validate, status: built, usage: "polispec validate <kind|auto> <file> [--json] [--semantic]", note: "built into lib/polispec/cli.rb; kind is one of Schema::KINDS: policy, environments, roster, ledger, behavior, spec, waivers, global, module, profiles, control, smoke, smoke-scenario, package, judgment, exceptions, delegate_grants, editions, session, change, manifest, app, index, contract, contract-vocabulary, catalog, catalog-state and, since 0.48.0, deployments; auto reads the file's own schema id. validate policy merges a sibling environments.yml when the policy has no environments block; --semantic adds the advisory description judgment through the decide port (description judge)" }
  - { name: contract, status: built, usage: "polispec contract check FILE|DIR [--vocabulary FILE] [--runner CMD] [--root DIR] [--format text|json] | render FILE|DIR [--surface ID] [--root DIR] [--write] | digest FILE [--root DIR] | diff FILE|DIR --from REF [--root DIR] [--format text|json] | approve FILE --actor NAME --role ROLE [--root DIR] | export DIR [--out FILE] [--root DIR]", note: "since 0.43.0; see the contract section. check, digest, diff, export to stdout and render without --write are read-only for the guard; approve classifies policy.edit." }
  - { name: lint, status: built, usage: "polispec lint [PATH...] [--host] [--shipped] [--ref REF] [--only RULE[,RULE]...] [--strict] [--json]", note: "since 0.42.0; see the lint section. Read-only: it sweeps generated and shipped files for schema, hygiene, drift, refs and description findings, exits 1 on an error finding (on a warn finding too with --strict) and 2 on usage. Since 0.48.0 --ref REF reads each project root from the commit REF names instead of its working tree." }
  - { name: replay, status: built, usage: "polispec replay --runtime TREE [--baseline TREE] [--days N] [--json]", note: "since 0.48.0; see stewardship replay. Has the candidate tree's own engine and the baseline's (since 0.48.1, default the installed runtime) judge the recorded judgment rows of the last N days (default 14) and lists every verdict or rule the candidate changes; exit 0 when no change is unexplained, 1 otherwise, 2 on usage." }
  - { name: shadow, status: built, usage: "polispec shadow start --runtime TREE | stop | status [--json] | report [--json]", note: "since 0.48.0; see stewardship shadow. status and report are diagnostic reads." }
  - { name: "plan, apply", status: built, usage: "polispec plan <package> --repo REPO [--variant V] [--param k=v]... | project:<id> [--from REF|worktree] | global [--from REF|worktree] | ledger --from FILE [--json]; polispec apply with the same targets and [--confirm PLAN_ID] [--commit] [--push] [--checkouts] [--with-stewardship] [--dry-run] [--json]", note: "since 0.21.0 replace onboard (removed, no alias). plan previews files, ledger effect, composed policy diff, synthetic probes and opted-in journal replay, classifies tightening|loosening|mixed|neutral and prints a plan id; apply carries it out, refusing confirm_required unless the plan is tightening or neutral and not global, or --confirm equals the recomputed plan id (plan_changed when stale). apply environment-control --variant service|distributed reproduces onboard's steps (files, manifest, ledger, render, commit, branches, push, checkouts). --with-stewardship first ensures the stewardship rule, the runtime protected root and a pinned runtime at the running version's tag; a failure aborts before any change." }
  - { name: steward, status: built, usage: "polispec steward [--check] [--json]", note: "since 0.22.0: the apply --with-stewardship steps on their own; --check only reports; since 0.27.0 the rule and pin steps run natively (rule links under <claude home>/rules/polispec/, polispec pin) when rplugin is absent" }
  - { name: pin, status: built, usage: "polispec pin [--ref TAG] [--source PATH|URL] [--dry-run] [--json]", note: "since 0.27.0: archives TAG (default v<VERSION>, whose VERSION must match) into <data home>/releases/<commit>/ read-only with .polispec-release.json, swaps <data home>/current atomically, links ~/.local/bin/polispec unless that path belongs to something else; source defaults to the clone runtime, the pinned release's source, or a bare fetch of the public repository; idempotent; never deletes an older release. Since 0.48.0 the replay gate (stewardship replay) runs on the extracted release before current is swapped: an unexplained verdict change refuses with pin_unexplained_verdicts and a candidate that cannot be replayed with pin_replay_failed, --dry-run shows the replay and exits 1 when the pin would be refused, and only an operator on a terminal without --json can override with the typed phrase pin with unexplained verdicts" }
  - { name: "install, uninstall", status: built, usage: "polispec install --harness claude|codex|all [--scope user|project] [--project DIR] [--force] [--dry-run] [--json] | polispec uninstall --harness claude|codex|all [--scope user|project] [--project DIR] [--dry-run] [--json]", note: "since 0.27.0: Claude Code hooks in settings.json (PreToolUse, SessionStart, SubagentStart), Codex hooks as one marked block in config.toml (PreToolUse, SessionStart, SubagentStart), a link for every shipped skill, and at user scope the rule links; in-place backups, foreign hooks kept, refuses without --force when the polispec harness plugin is enabled; writes no Codex trust hash; uninstall removes only marked hooks and links matching the receipt" }
  - { name: "uninstall --all, restore", status: built, usage: "polispec uninstall --all [--keep wiring,pins,rplugin,data] [--dry-run] [--json] | polispec restore <bkp_id> [--mode rewire|bytes] [--dry-run] [--json] | restore --list [--json]", note: "since 0.41.0; see install clean_uninstall and restore. The real runs need a TTY and the typed phrase uninstall polispec or restore polispec." }
  - { name: deployments, status: built, usage: "polispec deployments [--scan] [--json]", note: "since 0.41.0; see install deployments. --scan writes backfilled entries to the manifest; without it the command only reads." }
  - { name: "ledger init", status: built, usage: "polispec ledger init [--dry-run] [--json]", note: "since 0.27.1: writes config/ledger.starter.yml (schema, short hostname, envs_root ~/.polispec/envs, the example default rules, projects: []) to the resolved ledger path, 0600 in a 0700 directory, validated before the write; keeps an existing ledger untouched; ledger_sealed when the sealed plane names the ledger. polispec install at user scope and a package plan/apply on a host without a ledger create the same starter; the package plan lists it as a tighten change; doctor's ledger_missing names polispec ledger init" }
  - { name: settings, status: built, usage: "polispec settings list|get KEY|set KEY VALUE|unset KEY [--json]", note: "since 0.27.0: reads and writes the native settings file, validated against the settings in polispec.rplugin.yml; list names each value's source (plane, env:NAME, rplugin, file, default); refuses while the sealed plane is active" }
  - { name: "agents render", status: built, usage: "polispec agents render <project|repo> [--from worktree|REF] [--check] [--json]", note: "writes .agents/directives/envs.md and upserts the AGENTS.md line keyed by the [ENVS] opcode; doctor reports agents_drift when the trust ref disagrees with a fresh render; edits to the row or envs.md classify as policy.edit (impl environments FR-5 to FR-8)" }
  - { name: "hook git", status: built, usage: "polispec hook git pre-commit|pre-push|reference-transaction [git hook args...] | install <project> dev|test|prod|all [--dry-run] | uninstall <project> dev|test|prod|all", note: "judges git operations in a live project with the same rules and environment resolution as the harness guard; shims chain to the previous core.hooksPath; POLISPEC_OPERATOR=1, set by polispec's operator git, skips them; a seatbelt for processes outside a harness, not a security boundary (impl environments FR-9)" }
  - { name: version, status: built, usage: "polispec version | --version | -V", note: "built into lib/polispec/cli.rb, as is help (help, --help, -h, or no verb); an unknown verb prints the help on stderr and exits 2" }
  - { name: "code, code-hook, specs", status: built, note: "the code-spec verbs; see code_specs commands" }
  - { name: "hook pretool|session", status: built, usage: "polispec hook pretool|session --harness claude|codex|hermes|pi|deepseek|antigravity [--controls-file FILE] [--controls-project DIR]", note: "Internal: run by bin/polispec-guard and by control-bearing hooks (wiring). Bounded native envelopes, separate session handling, independent control ceiling, and minimal failure denial; positive diagnostic reads remain available. Since 0.18.5 a live ledgered project whose policy is missing or invalid at its trust ref is judged by global.yml fallback_rules (ledger defaults.rules when no global layer exists), never by an internal denial; claude deny and ask reasons begin [POLISPEC <rule_id>] DENIED: or WARNING:; next steps for a path no project owns name no project. Since 0.19.0 the harness-controls target resolver applies the same fallback policy instead of failing closed." }
  - { name: resolve, status: built, usage: "polispec resolve <path> [--layers] [--json] [--ledger FILE] [--policy FILE]", note: "since 0.16.0 --layers prints the global, repo and child layer chain with each layer's digest and the effective digest; since 0.16.1 a path under the environment checkout root that names no environment, such as a release_dirs release or the shared bundle, resolves to prod, matching the engine" }
  - { name: classify, status: built, usage: "polispec classify [--json] [--ledger FILE] [--policy FILE] [--cwd DIR] < hook-json", note: "prints the action classes, shapes and resolved environments of one hook call; read-only" }
  - { name: explain, status: built, usage: "polispec explain --harness HARNESS [--json] < hook-json | polispec explain TOOL INPUT [--cwd DIR] [--json]", note: "since 0.48.0 the TOOL INPUT form takes the shell command for Bash, a JSON object of tool input for any other tool and a bare path for Read, Write and Edit, judges it through the same read-only path as the hook-json form, and prints per governing project and environment the classified actions, every rule that matched in every layer with its id, verdict, layer, file, line, module instance and parameters and, for a repo-layer rule, the project's applied package and version, whether it is in effect, overridden or the winner and why (verdict severity, then the deeper layer, overrides, or an engine guard), and the levers that would change it (plan project:<id>, plan global, catalog deactivate, exceptions add for a warn); RuleLocator moved to lib/polispec/explain/rule_locator.rb and is shared with the web explainer; it records nothing and exits 2 on invalid input. Since 0.26.0 judges one PreToolUse hook call through the same path as hook pretool (classification, environment outcomes, the harness-control ceiling with the undeclared MCP default, since 0.45.0 only while mcp/undeclared is active) and prints the verdict the harness would get under enforce, whatever polispec.enforce is: verdict allow|warn|deny, rule_id, reason, governed, control verdict and ask_ids, and per action its class, server and operation and whether a protected or committed rule declares it. It is read-only: no judgment record, no polispec.control or polispec.judgment event, no fast-path refresh, no allow-once id and no protected authorization request or consumption (the explain adapter reports ask? true, so the ask composition returns before the authorization branch). Exit 0 when it judged, 2 on invalid input. For callers that must know before a headless session runs whether its tools pass, such as an application's own doctor" }
  - { name: "promote, deploy", status: built, usage: "polispec promote <project> --to <env> [--waive-soak] [--dry-run] [--json] | polispec deploy <project> <test|stable> [--tag vX.Y.Z] [--skip-drain] [--dry-run] [--json]", note: "since 0.17.0 --waive-soak (operator only, typed phrase waive soak for <project>, refused for test and when no soaked gate applies) reports the soaked gate as waived and records waived: [soak] on the promotion and its event; while stable carries no policy, promote and test deploys bootstrap from the candidate branch's committed policy (impl FR-4b); since 0.52.3 a test deploy whose stable policy declares no test deploy block uses the test deploy block at origin/test after a fetch, never replacing a declared block and never for stable, emits a deploy_bootstrap finding and records deploy_source in the deploy record, result and dry run; gate, step and after commands run without a shell, with $HOME, ${HOME} and a leading ~ expanded in each word (impl FR-4c); `hermetic.<env>` isolates variables into scratch and fails a run that writes under a protected root (a command gate with `hermetic: false` runs outside it, recorded as `hermetic: false` in the promote result), `deploy.strategy: release_dirs` swaps a release symlink and rolls back on failed health, `deploy.drain` pauses, waits, checks and resumes queues in the active release, and `polispec deploy <project> stable --skip-drain` skips the drain (terminal plus phrase `skip drain for <project>`); a policy that deploys without health is refused; since 0.37.4 drain.resume runs up to four times (backoff 2, 4 and 8 s), the deploy record keeps the drain log with each attempt's exit, directory and output tail, a resume that still fails puts `queues still paused` and the exact command and directory into the record detail, the result (`queues_paused`), the deploy and promote text output and the failure payload, and doctor reports drain_resume_failed (warn) for each project and env whose latest recorded resume failed, until a later deploy's resume succeeds" }
  - { name: "pause, allow-once", status: built, usage: "polispec pause <project> --minutes N --reason TEXT | polispec allow-once <alo_id>", note: "A pause lasts at most 240 minutes and an allow-once id 600 s. Unsealed terminal behavior retained; sealed authority authenticates the operator and consumes grants through the protected service. Since 0.18.4 the allow-once prompt and stored raw name the tool and absolute target of a file-tool call, and both commands refuse with not_tty or confirmation_failed like promote." }
  - { name: catalog, status: built, usage: "polispec catalog list [--json] | show SPEC [--json] | activate SPEC[/SUBSPEC] [--dry-run] | deactivate SPEC[/SUBSPEC] [--dry-run] | provision SPEC/SUBSPEC --from FILE [--dry-run]", note: "since 0.45.0; see the catalog section. list and show are read-only; activate, deactivate and provision need a TTY and the typed phrase activate catalog SPEC, deactivate catalog SPEC or provision catalog SPEC/SUBSPEC, and refuse catalog_sealed while the sealed plane is active. Since 0.48.0 deactivate refuses a subspec the lock edition forces on with gate_forced, and a spec-level deactivate keeps those and deactivates the rest." }
  - { name: "roster resolve|check", status: built, usage: "polispec roster resolve <project> (--role R | --pipeline P --phase X) [--env E] [--roster FILE] [--json] | check <project> --pipeline P --profile <file|-> [--env E] [--roster FILE] [--json]" }
  - { name: "status, digest, doctor", status: built, usage: "polispec status [<project>] [--json] | polispec digest [--since 24h] [--json] | polispec doctor [--json]", note: "since 0.18.4 status <unknown> --json prints a JSON unknown_project error and exits 1; since 0.18.6 status reports a policy_invalid finding for semantic policy errors (missing deploy.health, environment names, profiles) exactly as promote does; digest reads warn and deny judgment records, and doctor reports judgments_chain_broken and judgments_truncated (see the judgments section); since 0.33.2 Operator::Gates.unreachable_errors reports a promotion gate (sha_ran_on, sha_ran_on_test or soaked, the implicit to_stable G-TESTED included) whose environment declares no deploy, and an after step polispec deploy {project} <env> aimed at such an environment: doctor files each as a blocking gate_unreachable finding, status shows a gate_unreachable finding when it has no other, validate policy reports them under /promotion, and plan project:<id> lists them as notes that change neither the classification nor the plan id; promote and deploy are unchanged" }
  - { name: judgments, status: built, usage: "polispec judgments list [--since 24h] [--session ID] [--project ID] [--json] | show <id> [--json] | verify [--json] | acknowledge <id> [--reason TEXT] [--json]", note: "reads the chained judgment stream; verify walks every rotation and the head anchor and exits 1 on a digest mismatch, a broken chain or truncation; since 0.30.1 a record that chains from the same prev as the record before it is reported as an interrupted_append in a separate interrupted list and does not fail verify; list and show never print raw text unless the record holds it; since 0.52.0 acknowledge <id> (operator, TTY and typed phrase) records an examined finding in judgments.acknowledged.json with its kind, detail, reason, time and actor, verify marks that finding acknowledged and exits 0 when no unacknowledged finding remains, and doctor lists it as judgments_acknowledged (info); a finding whose kind changes is open again" }
  - { name: exceptions, status: built, usage: "polispec exceptions list [--json] | add --command GLOB [--tool NAME] [--kind control|rule] [--rule ID] [--global] [--note TEXT] | promote PROPOSAL_ID... [--command GLOB] [--global] [--note TEXT] | remove ENTRY_ID", note: "since 0.29.0: persistent exceptions to guard asks (see the exceptions section). list is a benign read; add, promote and remove need a TTY and a typed phrase, refuse while the sealed plane is active, and commit exceptions.yml in the global shelf through the plan and apply global path" }
  - { name: harness, status: built, usage: "polispec harness grammar|parse|plan|install|verify|scan|uninstall", note: "Strict per-command options, dry-run for mutations, structured JSON results; docs/harness-controls.md. Since 0.18.7 uninstall --dry-run without --owner previews without root; scan returns ok:false with environment_scan_failed and its cause and exits 1 (3 before 0.19.0); since 0.19.0 uninstall --dry-run --owner previews without root, reads only what the current uid can read and reports each owner check it could not perform as owner_check_unverified; operation_id is opaque (64-hex or op_ plus 24 hex for plans, uninstall_ plus 24 hex for uninstalls)." }
  - { name: seal, status: built, usage: "polispec seal --from REPO@COMMIT | --source /etc/polispec/source [--dry-run] [--json]", note: "since 0.18.7 YAML dates in the bundle are normalised before schema validation, as the ledger loader does; the runtime manifest of the committed polispec release leaves image assets under assets/ (since 0.24.0) and the smoke ledger smoke.yml (since 0.25.1) out, and since 0.25.1 a runtime installed as an rplugin release enumerates that manifest from the source repository and commit its release descriptor records, never from a repository that merely encloses the install, failing runtime_source_unavailable when that source is missing" }
  - { name: plane, status: built, usage: "polispec plane status|verify [--json] | activate PROJECT_ID... [--dry-run] [--json] | rollback OPERATION_ID [--dry-run] [--json]", note: "Activation and rollback require an authenticated protected operator; development does not activate live projects." }
  - { name: authorizations, status: built, usage: "polispec authorizations status|unit|serve|recover", note: "Fixed local socket; unit renders without installing; request and consume have no remote redemption operation." }
  - { name: judge, status: built, usage: "polispec judge serve | status | stop", note: "since 0.38.0; serve runs the resident judge in the foreground (the launcher starts it detached), status prints judge.json and whether the port answers, stop sends SIGTERM to the recorded pid; see resident_judge" }
  - { name: delegate, status: built, usage: "polispec delegate grant APP --projects P[,P] --verbs V[,V] --targets T[,T] [--flags F[,F]] [--json] | revoke APP | list [--json] | serve | unit [--json] | status [--json]", note: "since 0.31.0; see the delegation section" }
  - { name: smoke, status: built, usage: "polispec smoke record --spec FILE [--at PATH] --verdict pass|fail|partial|blocked|inconclusive --summary TEXT [--step-file FILE] [--evidence PATH[:KIND]]... [--runner human|agent|suite] [--harness H] [--model M] [--effort E] [--started ISO] [--finished ISO] [--json] | list [--spec FILE] [--at PATH] [--verdict V] [--json] | show <id> [--json] | verify [--json] | coverage [--spec FILE] [--at PATTERN]... [--json] | run (smoke run)", note: "Appends and reads the smoke ledger; since 0.23.0 run executes the bundled suite; see the smoke section." }
  - { name: proof, status: built, usage: "polispec proof run [FEATURE...] [--target T] [--out FILE] [--json] | import FILE... [--json] | status [--ref REF] [--json] | verify [--ref REF] [--json] | except FEATURE [--target T]... --reason TEXT --owner NAME --expires DATE [--json] | keygen [--json]", note: "since 0.49.0; see the proof section. status and verify are read-only; run, import and except write in the repository; keygen needs a TTY and the typed phrase create proof key." }
  - { name: web, status: built, usage: "polispec web [--bind ADDR] [--port N] [--expose] [--open] [--read-only] [--json] | url [--json] | token set | unit [--json]", note: "since 0.35.0; see the web section. url mints a fresh one-time login link for the running server; token set (TTY only) stores the delegate app token the web app relays typed phrases with, in <state home>/web/delegate.token (0600); unit renders a systemd user unit and installs nothing. Run by an agent the server classifies policy.edit." }
  - { name: manifest, status: built, usage: "polispec manifest <id> [--json] [--write] | index [--json] [--publish|--unpublish] | badge <id>", note: "since 0.35.0; see the manifest section. --write commits polispec.manifest.json and .polispec/badge.svg on main; badge prints the SVG; index --publish needs a TTY." }
  - { name: register, status: built, usage: "polispec register <path> [--id ID] [--kind software|directory|system] [--description TEXT] [--dry-run] [--confirm PLAN_ID] [--json] | unregister <id> [--dry-run] [--confirm PLAN_ID] [--json]", note: "since 0.35.0; see the registration section. Plans and applies the ledger target." }
  - { name: changes, status: built, usage: "polispec changes list [--since 24h] [--json] | show <id> [--json] | await <id> [--timeout 600] [--active 1h] [--json] | verify [--json]", note: "since 0.35.0; see the effect section." }
  - { name: sessions, status: built, usage: "polispec sessions list [--active 1h] [--json]", note: "since 0.35.0; see the effect section." }
  - { name: editions, status: built, usage: "polispec editions [--check] [--json]", note: "since 0.35.0: prints specs/editions.yml for the running release; --check exits 1 when a feature gated by Editions.allowed? has no registry row or a row names code that does not exist." }
  - { name: author, status: built, usage: "polispec author draft <policy|module|package|environments|roster|global|spec|description> --intent TEXT [--for PROJECT] [--adapter ID] [--json] | adapters [--json]", note: "since 0.35.0; see the author section. Prints a validated draft and its plan; writes nothing." }
composition:
  evidence_lifetime: "Since 0.45.1 composed policies retain their raw digest and composition errors as policy-owned metadata, not weak-valued side maps. Garbage collection cannot remove evidence while its policy remains alive, and serialization includes only policy fields."
  summary: "Environment policy composes recursively. A policy, the global layer and every module may include modules; a module may include modules, to any depth. Nested ledgered projects stack beneath the project that owns the path, nearest last, to any depth. Across layers the strictest verdict wins and a lower layer loosens only a rule marked overridable that it names in overrides. Since 0.32.0 the first layer of every chain is shipped: modules/tool-declared.yml from the polispec release (Layers::SHIPPED_INCLUDES), composed on every host before the global layer, every rule overridable, so the shelf tightens a shipped rule with a plain rule of its own and loosens one only by naming it in overrides; polispec resolve <path> --layers prints it first. Since 0.33.0 the shipped layer composes modules/tool-declared.yml and modules/delete-guard.yml (see delete_guard). Since 0.45.0 there is no always-on shipped layer: the first layer of a chain is the catalog layer, the modules of the catalog subspecs the operator has activated on this host (see catalog), and it is absent when none is active; resolve --layers prints it first as catalog."
  ownership: "Since 0.20.0 the outermost ledgered repo or worktree root containing a path owns it, regardless of ledger order; environment checkouts are unchanged. Every nested ledgered project between that owner and the path is a child layer."
  modules: "A module name resolves to the global shelf (polispec.global.*, modules/<name>.yml) or, since 0.20.0, to a project-local module at <directory of the policy>/modules/<name>.yml read from the same source as the policy: the trust ref, the bootstrap ref, or the sibling directory of a POLISPEC_POLICY file. A local module may include local and global modules; a global module sees only the global shelf. A name present in both is an error (message module <name> is ambiguous, reported as layers_invalid) and that include is not applied. A catalog module is read only from the release tree and composes only through catalog activation; an include cannot name it, and a shelf module of the same name is an ordinary shelf module."
  parameters: "Since 0.20.0 a module may declare params (name to type string, integer, number, boolean or list, with optional default and summary). An include is a module name or { module, with }. A string value that is exactly {{name}} becomes the typed value; {{name}} inside other text interpolates it. Module includes substitute too, so a module passes its parameters down. A missing required, unknown or mistyped parameter, or an unresolved placeholder, is an error and the instance is not applied. Each distinct module and resolved-parameter pair is one instance, expanded once; two instances in one layer that yield the same rule, gate or freeze id is an error."
  children: "Since 0.20.0 a child layer expands the child's own includes (with the child's local modules) ahead of its rules, and the owning project's composed policy receives every descendant's promotion gates (to_test, to_stable), to_stable preflight, freezes and hermetic, and those of their modules. A gate a child contributes carries dir, the child's path relative to the owner, so its run executes in the child's directory. A child-contributed gate or freeze id equal to one already in the owner or global composition is an id_collision error and the child copy is not applied."
  failure: "Composition errors (include cycle, missing or ambiguous module, parameter errors, id collisions, invalid overrides) are reported by validate, doctor (layers_invalid) and resolve --layers, emitted as a layers_invalid finding, and since 0.20.0 make promote refuse with policy_invalid instead of promoting with fewer gates."
  digest: "A layer digest covers the policy, every expanded module text and each instance's resolved parameters, so a change to a local module at the trust ref changes the effective digest. Since 0.32.0 the shipped layer digest is part of every effective digest and of Layers.fingerprint (the baseline target digest and the fast-path key), so a polispec release that changes modules/tool-declared.yml changes every effective digest on the host. Since 0.45.0 that layer is the catalog layer and its digest covers each active subspec's label and module text, so activating, deactivating or provisioning a subspec changes every effective digest and the fast-path key."
catalog:
  summary: "Since 0.45.0 polispec ships a catalog of specs and none is active by default. A catalog spec is catalog/<spec>/catalog.yml (polispec.catalog/v1) with one polispec.module/v1 file per subspec beside it. Nothing in the catalog judges a call until the operator activates it on a host, except the two gated subspecs the lock edition forces on since 0.48.0 (see layer), and activation is per host: it lives in host-local state, never on the global shelf or in the ledger, which a host may share with others."
  specs:
    tools: "Subspecs declared (the TOOL-* allow rules for the harness's own tools and reads, and TOOL-OPAQUE-DEVELOPMENT), unknown (gate unknown_tool: the POLISPEC-TOOL-UNKNOWN default for a call polispec cannot positively classify) and web-agent (G-WEB-AGENT). Until 0.44.1 these were modules/tool-declared.yml and the always-on unknown-tool gate."
    delete-guard: "Subspecs protected (delete_protected, G-DELETE-PROTECTED, G-DELETE-PROTECTED-FILE) and xargs (G-DELETE-XARGS). Until 0.44.1 this was modules/delete-guard.yml."
    mcp: "Subspecs undeclared (gate mcp_undeclared: the POLISPEC-MCP-UNDECLARED default, ask under standard and deny under lock, with declarations from protected controls or committed policy as in the unknowns row) and declared (provision module: the host's own declarations, each a rule matching class [mcp.call] with an exact server and operation and verdict allow; the release ships it empty). Until 0.44.1 the gate was always on."
    harness: "Since 0.52.0. Subspec hook-files (G-HOOK-FILE-CLAUDE-SETTINGS, -CLAUDE-SKILLS, -CLAUDE-AGENTS, -CLAUDE-HOOKS, -CODEX-CONFIG, -CODEX-HOOKS, -HERMES, -ANTIGRAVITY and -AGENTS: warn on fs.write and fs.delete to the files a harness loads hooks, skills and agents from, matched by one **/-anchored path glob each, in any environment). Composed after mcp."
  protected_authority: "Since 0.45.1 every seal source requires catalog/active.yml and its referenced provisioned files. Validate the existing catalog-state schema, known active subspecs, provision presence, digests, and the existing provisioning rules before preparation. The generation catalog path is bound to source/catalog; active or broken planes never read mutable user catalog state."
  state: "<state home>/catalog/active.yml (polispec.catalog-state/v1): active entries (spec, subspec, activated_at, release) and provisioned entries (spec, subspec, file, sha256, provisioned_at); provisioned files under <state home>/catalog/provisioned/<spec>/<subspec>.yml. Written 0600 by temp file and rename under catalog.lock in a 0700 directory. The state directory is a protected path of the harness-control ceiling, so a governed agent write into it is denied. A state file that does not parse or validate fails closed: every subspec without provisioning counts as active and every provision subspec as inactive, and doctor reports catalog_state_invalid (blocking)."
  layer: "The active subspecs' modules compose, in catalog order (tools, delete-guard, mcp; subspecs in their listed order), as the first layer of every chain (see composition). A provision subspec reads its provisioned file and is skipped with a layers_invalid note when that file is missing or no longer matches its recorded sha256. Gates switch on a branch of the harness-control guard rather than add rules: unknown_tool the POLISPEC-TOOL-UNKNOWN branch and mcp_undeclared the POLISPEC-MCP-UNDECLARED branch. The editions row unknown_call.ask decides ask (standard) or deny (lock) for both branches, only while their gate is on; the row mcp_default.ask enters only the fast-path key. Since 0.48.0 the editions row catalog.gate_optional (included in standard, excluded in lock) makes Catalog.active? true for every gated subspec under lock, so the lock edition turns both gates on without activation; before, it did not."
  operator: "Only the operator changes the catalog state: polispec catalog activate, deactivate and provision need a TTY and a typed phrase, and refuse while the sealed plane is active. Provisioning validates the file (mcp/declared accepts only MCP declarations) before it writes. doctor reports catalog_none_active (info) when no spec is active and catalog_provision_missing (warn) for an active provision subspec whose file is gone or changed."
  upgrade: "A host upgrading from 0.44.x keeps its previous behavior by activating tools and delete-guard; a host that declared its MCP servers in a shelf module provisions that module into mcp/declared and activates mcp, or removes the module from its shelf."
stewardship:
  summary: "Since 0.21.0 meta-level work on polispec (developing it, installing, upgrading or repairing it, applying packages and project specs, changing the global shelf or the ledger) has its own shipped rule, rules/polispec-stewardship.md, and mechanisms: a pinned runtime, a protected runtime root, packages, and one plan/apply verb under a confirmation gate."
  runtime: "Polispec::Runtime reports kind pinned (an rplugin release: ROOT/.rplugin-release.json, schema rplugin.release/v1, commit equal to the directory name), sealed, clone or unknown, and the commit. Pinned releases come from rplugin install <root> --ref <ref> (read-only archive under ~/.rplugins/.pinned/<id>/<commit>/, store link swapped atomically) or, since 0.27.0, from polispec pin (ROOT/.polispec-release.json, schema polispec.release/v1, under <data home>/releases/<commit>/; Runtime.release_kind native, doctor prints pinned (native)). doctor verifies a pinned release's tree digest and checks edition provenance against the recorded source repository."
  protected_runtime: "Built-in protected root R-POLISPEC-RUNTIME at the realpath of the running polispec: deny when pinned, warn when the runtime is a working clone, none when sealed (the plane protects it) or unknown. Since 0.24.0 the runtime verdict and the policy's own first-match verdict are both computed and the stricter wins, a tie keeping R-POLISPEC-RUNTIME, so R-PROD-FS still denies a write inside a clone runtime that is also a production checkout. Writer rplugin."
  packages: "packages/<name>/package.yml (polispec.package/v1): name, version, summary, params (module param shape), variants with files, shared files, modules copied to specs/polispec/modules/, and ordered built-in steps (files, manifest, ledger, render, commit, branches, push, checkouts) with optional when: { param, equals }. No arbitrary command steps. Sources: shipped packages/ and the global shelf packages/; a name in both is ambiguous. environment-control (variants service, distributed) is the former onboard flow. Since 0.33.2 (package 1.1.0) the distributed variant carries the same placeholder deploy and health blocks for test and prod as the service variant; before, its after steps deployed environments that declared no deploy, so G-TESTED could never pass."
  ledger_record: "Project entries record packages: [{ name, variant, version, applied_at, files: { path: sha256 } }]. status shows them; doctor reports package_upgrade_available and package_file_drift. An upgrade replaces files still equal to their recorded digest and reports edited files as conflicts, untouched."
  plan_targets: "A package; project:<id> (proposed specs at a ref or the main worktree vs the trust ref); global (proposed global path vs the configured global ref); ledger --from FILE (proposed vs live ledger). Since 0.48.0 plan global from a repository draft lists a file present in the shelf at its ref but absent from the draft as remove PATH, and apply global deletes it and commits the deletion with the other files; the classification still comes from the composed policy change."
  classification: "Probe or journal verdict severity up is tighten, down is loosen. Removed rules, gates, freezes, modules, protected roots or hermetic entries loosen; added ones tighten. Adding an onboarding ledger project tightens; changing an existing project entry's status, profile, trust_ref, repo, policy, roster or worktree_globs loosens, as does changing a path entry's status, path, kind or policy, or the ledger's envs_root. A contract added tightens and a contract removed loosens. needs_confirm when the classification is loosening or mixed, or the target is global."
  confirmation: "plan_id is plan_ plus 24 hex of sha256 over the target, proposed and current digests and the classification. apply --confirm PLAN_ID is classified policy.edit by the guard, so live policies warn and the harness asks the user."
  journal: "plan replays the per-action rows of the judgment records of the last 14 days (project, env, class, tool, ref, home-relative path, crosses, destructive, shape, verdict, rule id) as actions against the current and the proposed rulebook; polispec.verdicts.journal and journal.jsonl are gone, the rows are always recorded (see the judgments section), and the plan output still labels the replay journal. Since 0.44.1 a plan reads the window once, a record at a time, and judges every replayed action of a side with the project roster and the policy lookups resolved once, so the replay no longer scales with the number of projects times the size of the log; the rows, their order and the plan output are unchanged."
  steward: "Since 0.22.0 polispec steward runs the stewardship steps alone and polispec steward --check reports them (status missing names what would run) without changing anything, exit 1 when any step is unsatisfied. There are four steps: the stewardship rule, the runtime protected root, the pinned runtime and, since 0.41.0, personal defaults (install personal_defaults), which warns and never aborts. Step 1 also requires, with rplugin 1.15.0 or later and a Claude Code home, the rule link <claude home>/rules/rplugin/polispec/polispec-stewardship.md, repaired with rplugin install polispec. Since 0.27.0, when rplugin is not executable, step 1 instead links <claude home>/rules/polispec/polispec.md and polispec-stewardship.md (ok with no Claude Code home) and step 3 runs polispec pin --ref v<VERSION>; with rplugin every step is unchanged."
  with_stewardship: "apply --with-stewardship ensures, in order and skipping what holds: the stewardship rule installed through rplugin (or linked natively without it), the runtime protected root active (kind clone or pinned), and the runtime pinned with rplugin install --ref v<running version> (or polispec pin without it). Any failure aborts before the apply changes anything."
  replay: "Since 0.48.0 polispec replay --runtime TREE groups the recorded rows of the judgment corpus (project, class, env, ref, path, destructive, shape, recorded verdict and rule, policy digest) of the last N days, has TREE's own lib/polispec judge them in a child process through the probe machinery plan uses (lib/polispec/replay_child.rb, so a tree older than the verb can be replayed), and compares each verdict and rule with the recorded one. Since 0.48.1 the baseline tree (--baseline, default the installed runtime: POLISPEC_BIN, then PATH, links resolved, else the running tree) judges the same rows, a change is a candidate verdict or rule that differs from the baseline's (so rules that match on text a row does not keep cancel out), and a row whose baseline rulebook digest differs from the one it was recorded under is skipped_policy_moved; before 0.48.1 the candidate's digest decided it, so a release that changed an active catalog module's text compared nothing. A target that is no live ledger project is skipped_unjudged. Replay a release export or pinned tree, not a working clone, whose runtime guard covers its own repository. A change is explained when the candidate's CHANGELOG section for its VERSION names the rule id before or after. Replay cannot reproduce the exceptions, pauses or allow-once grants in force at judging time, so a call one of them lifted can show as a change. The pin gate (pin) runs it; on an rplugin host, where the pin is rplugin install, the operator runs it before rplugin install --ref (rules/polispec-stewardship.md)."
  shadow: "Since 0.48.0 polispec shadow start --runtime TREE records the candidate in <state home>/shadow.json. While it is recorded, after the live hook has recorded its judgment, Shadow.handoff writes the hook input (at most 256 KiB) to a 0600 file under <state home>/shadow/ and spawns a detached process group, reniced to 10, that runs the candidate's bin/polispec explain --harness H --json under a 5 s kill and appends a row to <state home>/shadow.jsonl only when the candidate's verdict or rule differs from the live one: ts, call_digest, tool, harness, judgment id, live and candidate verdict and rule, candidate_version, no command text. Errors and timeouts write at most one row a minute; the log is capped at 1 MiB and rotates once to shadow.1.jsonl; hand-off files older than 600 s are swept. The candidate's explain writes no judgment, journal, fast-path or epoch state. A call the fast path skips never reaches the hand-off, and POLISPEC_SHADOW=off turns it off. shadow stop removes shadow.json and keeps the log. Cost measured on a warm judge: about 1 ms per call with no shadow recorded, about 5 ms with one."
  contract: "its design notes are kept outside this repository"
extension_points:
  commands: "lib/polispec/commands/*.rb is glob-loaded; a file calls Polispec::CLI.register(name, klass, summary:) and klass responds to run(args) returning an exit status, either as a class method or on a new instance."
  classifier: "lib/polispec/classify/commands/*.rb is glob-loaded; a file calls Polispec::Classify::Registry.register(family, klass) and klass responds to call(tool_name, tool_input, cwd) returning [Polispec::Action]."
  author_adapters: "Since 0.35.0 lib/polispec/author/adapters/*.rb is glob-loaded and calls Polispec::Author.register(id, klass); an rplugin extension adds one by mapping adapters: { author: lib/author.rb } in its extension.yml under the declared port (ports_declared). The rllm adapter ships in rplugin's rstack extension as extensions/rstack/lib/author.rb, never in polispec."
  web_routes: "Since 0.35.0 lib/polispec/web/routes/*.rb is glob-loaded; a file calls Polispec::Web.route(prefix, mutating: false) { |r| ... } with a Roda hash-branch block. Every route needs the session cookie; every request other than GET and HEAD also needs the CSRF header and the server's own Origin and, outside the compute routes, counts against the rate limit; a route declared mutating: true is refused while the server runs --read-only. polispec web refuses to start at all where the edition registry excludes web (lock)."
  ports_declared: "Since 0.35.0 polispec.rplugin.yml declares the author port under ports.declared, with the standalone class Polispec::Author::Adapters::HarnessCli (lib/polispec/author/adapters/harness_cli.rb), and lists author among the optional ports. rplugin (with plugin-declared ports, a release in the same change) lets a fleet or os extension map an adapter to a declared port, and Ports.for(\"polispec\").author resolves extension adapters first, then that standalone adapter, which drives Polispec::Author::Standalone (the harness-cli session). Without rplugin, or with an rplugin that predates declared ports, polispec uses the standalone directly and polispec author adapters reports why no extension adapter loaded."
  script_files: "Since 0.32.1 the shell parser follows a shell script file the line runs and classifies its commands as if they were written in the line: the first operand of bash, sh, zsh, dash, ksh or ash after their options (none with -c, which stays the -c body, or with -s), and a command path containing a slash that is an executable file with a shell shebang, or with no shebang and the .sh extension. The body is the content an earlier command of the same line wrote with cat > FILE or tee FILE fed by a heredoc or here-string, else the file on disk up to 1 MB (Shell::MAX_SCRIPT_FILE), followed to MAX_DEPTH. The line is opaque (shape opaque_shell under the control gate, exactly as eval and source) when the operand is dynamic, the file is missing, unreadable or larger than the bound, the depth is exhausted, the same line wrote that path with content the parser does not know (an echo or printf redirect, an append, a heredoc read only after the run on the same line), or wrote any file through a dynamic target. A followed script's host command is not counted for chained_release, as a -c host is not. Not followed: scripts reached through PATH and interpreters other than shells. Since 0.35.0 source FILE and . FILE are followed by the same rules (operand resolved against the line's cwd; the file's variable assignments, exports and cd carry into the rest of the line, because sourcing runs in the current shell), and the source command itself is then not an opaque command; eval stays opaque. Following is bounded per line by Shell::MAX_FOLLOWED_COMMANDS (1000 commands parsed from followed files, across depth) and Shell::FOLLOW_DEADLINE (0.5 s); past either bound the line is opaque, so following never pushes the hook past its budget into a fail-closed deny. Since 0.35.0 a followed script or sourced file is also opaque when any classified write action of the same line (cp, mv, ln, install, rsync, sed -i, a download, an archive extraction or any other) targets the followed path or its realpath, because the parser would otherwise read the file as it was before the line ran; before 0.35.0 such files were read from disk."
  tmux_kill: "Since 0.32.1 tmux kill-server and tmux kill-session with neither -L nor -S before the subcommand carry shape tmux_kill and add one service.control action (env_hint command tmux and the subcommand), because such a call reaches whatever server TMUX or the default socket names; on 2026-10-17 an agent's scratch script killed a live tmux server that hosted other agents that way. A call that names its server with -L or -S is not tagged. No shipped rule matches the shape; a shelf or project rule governs it."
  root_containment: "Since 0.32.2 Engine::Envs.under? holds every path under the root /. Before, it tested the prefix //, so a root of / contained nothing: match.live_binary missed rm -rf / (G-LIVE-BINARIES denied rm -rf /usr/lib and rm -rf ~ but allowed rm -rf /), and a protected root, hermetic protected root or policy checkout at / would have covered nothing. Every caller of Envs.under? (running_from, global_loc, protected_loc, by_policy_checkout, spec_path_hit? and RuntimeGuard.inside?) shares the fix."
  release_reads: "Since 0.37.4 a read candidate (class secrets.read with hint candidate, from Read and the shell read classifiers) that resolves to a prod tier is allowed by POLISPEC-RELEASE-READ before policy rules when its path lies under an environment's declared checkout, matches none of that policy's data.dirs, unit_files, env_files or secrets, is tracked by git there, and git status --ignored reports it unmodified; every other prod read keeps secrets.read and whatever the policy says (R-PROD-SECRET in the environment-control package). A modified, untracked, ignored or missing path, a directory holding any of those, a read under a prod data dir or a declared secret, and a command that also reads such a path stay denied; a git failure counts as not clean. The allow is the release code an operator already published by tag; the operator approved this loosening on 2026-10-22 after R-PROD-SECRET denied reads of a live project's stable checkout."
code_specs:
  status: built
  summary: "Code specs: a tree of composable policies applied per language whenever an agent writes code. The policy is the atomic entity; a policy with subpolicies is composite; a spec is the root policy of one spec file, mounted at a path (code, code/ruby, code/ruby/code_quality, code/ruby/code_meta, code/code_meta)."
  fundament: "Every policy carries an execution class (harness, agent, hybrid, contextual). The class is set when the policy is authored, by the classifier model and reviewed by the operator, and stored in the spec. At runtime the harness reads it with no model call, except for contextual policies, whose applicability the classifier decides per event."
  models:
    classifier: "A local decide port when the host provides one, otherwise a hosted model fallback; set by the host"
    interpreter: "A model at medium effort that reviews agent-class policies against the task diff; set by the host"
  binding: "Language is detected from the file before each write. The language's directives are injected once per session per spec digest before the first write. Harness-class checks run on the changed lines; MUST violations block, SHOULD violations warn. Agent-class policies are reviewed at task end."
  legacy: "Ratchet: only violations on changed lines block; pre-existing violations are recorded in a per-repo baseline that may only shrink."
  controls: "Every harness and hybrid policy ships a negative-control fixture that must trip its enforcer (polispec code controls). Controls are checker machinery under NOTEST and live only in the code specs repository."
  enforcer_requires: "Since 0.47.6 an enforcer may declare requires, a list of { plugin, version } entries naming the rplugin plugins it runs against (plugin an rplugin id, version an optional RubyGems requirement). Polispec::PluginStore resolves each plugin to the real path of ${RPLUGINS_HOME:-~/.rplugins}/<id>; the runner passes it to a script enforcer as POLISPEC_PLUGIN_<ID>_ROOT (id upcased, - as _) and raises an enforcer error, which never blocks, when the plugin is not installed. polispec doctor checks the code pack the hooks load (POLISPEC_CODE_REF, default stable) and reports code_enforcer_unresolved for an uninstalled plugin and code_enforcer_version_skew for a VERSION the requirement does not admit, both blocking, one per active policy and plugin."
  source_of_truth: "The code specs repository is the single source for code directives; a host generates directive rows and guards for code rules from, or calls into, their policies."
  specs_home: "~/.polispec/specs, a symlink to the specs/ directory of the code specs repository named by the polispec.code.specs_repo setting"
  schema: { id: polispec.spec/v1, file: schemas/spec.v1.yml }
  waivers: { id: polispec.waivers/v1, file: schemas/waivers.v1.yml, path_in_project: specs/polispec/code-waivers.yml }
  commands:
    - { name: "code detect|chain|show|check|validate|baseline|controls|generate|classify", status: built, note: "since 0.18.7 code classify on a file that defines no policy rules says why and exits 1" }
    - { name: "specs link|status|promote", status: built, usage: "polispec specs link|status|promote [--repo DIR] [--dry-run] [--json]", note: "since 0.18.7 specs link creates a missing ~/.polispec/specs link or confirms one already at <repo>/specs without asking; repointing an existing link at a different target needs an interactive terminal and the typed phrase relink <full target path> (the absolute <repo>/specs path; relink specs before 0.19.0), and an agent shell is refused with not_tty and exit 1; a wrong phrase is confirmation_failed; --dry-run previews and names the phrase" }
    - { name: "code-hook pre|post|stop|session", status: built, note: "--harness claude and --harness codex accept exactly the event of their mode: pre PreToolUse, post PostToolUse, stop Stop, session SessionStart. Any other event, or a payload that fails to parse, makes the hook print a one-line diagnostic on stderr and exit 0 without checking; it never fails silently." }
  settings: [polispec.code.enforce, polispec.code.check_at, polispec.code.inject, polispec.code.specs_repo]
  ports_optional: [decide]

deployment_receipts:
  contract: polispec.status.deployments/v1
  command: polispec status <project> --json
  fields: projects[].deployments.<env> contains receipt, latest_attempt, and verified
  receipt: last successful deployment; record_id, sha, tag, health, pinned_behind, and at only
  latest_attempt: last appended deploy record; id, sha, tag, health, pinned_behind, and at only
  verified: same nonempty record identity, sha, and tag; both health ok and pinned_behind false
  fail_closed: missing, malformed, legacy receipts without record identity, unchecked health, and newer failed attempts are unverified
  limits: evidence of the completed deployment health check, not continuous availability; consumers must match current stable ref and tag

harness_controls:
  release_activation: "Since 0.23.0 harness_controls ships true by operator direction (config/harness-features.yml): the guard applies the control ceiling, unknown-call and undeclared-MCP defaults (since 0.45.0 each only while its catalog subspec is active on the host), and harness install and verify are enabled. Since 0.45.1 sealed_plane ships true by operator direction: the implemented sealing, activation, protected uninstall, and authorization-service paths are available, with their existing authenticated operator, typed confirmation, protected runtime, and authority prerequisites unchanged. Enabling the capability neither seals a host nor starts a service. Since 0.24.0 one uninstall is open on an unsealed host (plane status unsealed, never broken or active): a non-root user removes a user- or project-scope overlay whose unprotected receipt carries their own owner_uid, after typing uninstall INSTALLATION_ID on a TTY; receipts written before 0.24.0 carry no owner_uid and still need the operator. No host or project activation occurs on install."
  benign: "Since 0.23.0 Classify.benign? positively recognises calls that are not unknown: harness-internal tools (TodoWrite, TodoRead, Skill, ToolSearch, AskUserQuestion, EnterPlanMode, ExitPlanMode, TaskOutput, TaskList, TaskGet, TaskCreate, TaskUpdate, TaskStop, ListAgents, SendMessage, Glob, LS, update_plan, view_image, and since 0.28.3 SubagentHandback, StructuredOutput and ScheduleWakeup) and fully parsed shell lines whose every command is a read-only name with no write flag or a read-only git subcommand, with no substitution, wrapper, environment prefix or file redirection. Classify.positive gives WebFetch and WebSearch a known web.fetch action and Agent and Task a known agent.spawn action, judged by policy like any classified action. Since 0.23.1 a shell line the parser fully parses (at least one command, no eval, source or . builtin) is also not unknown, even when it is not benign: the shell classifiers have judged every command in it, so its classes, or none, go to policy as in 0.22.0. Unparseable shell lines, eval and source lines, and non-shell tools with no positive class stay unknown; with harness_controls false nothing changes. Since 0.24.0 a governed line that runs eval (recorded by the shell parser when it unwraps eval, at any nesting depth), source or . adds the POLISPEC-TOOL-UNKNOWN ask to whatever its commands classify as; the words in quoted strings, heredoc bodies fed to non-shells and grep patterns do not count. Since 0.30.0 that ask is not added when the working directory is in development: Ledger#development returns the project ids when at least one non-retired ledger project contains the directory (its repo root or a worktree glob), every such project has status onboarding, and the directory is not inside an env checkout under envs_root. Since 0.30.2 the directory of every command the parser finds in the line must be in development or in no non-retired ledger project at all (Ledger#locate returns nil), because agents change into a session scratch directory under /tmp to source an env file they wrote; a line that changes into a live project, a live project containing an onboarding one, or a checkout before it sources keeps the ask (0.30.0 and 0.30.1 asked for any directory outside development, which kept the ask on those scratch directories). A live project, a live project containing an onboarding one, a test or stable checkout, a session that itself starts in an unowned path, the lock edition and polispec.relax.dev off keep the ask. Only the opaque trigger is relaxed: a line the parser extracts no command from, an unrecognised tool and an undeclared MCP operation still ask, and the visible commands of the line are judged as before, so a push to stable written in the line, or inside a literal eval, is still denied. A relaxed call carries relaxed in its judgment record. Benign git refuses -c, --config-env, --exec-path, --paginate and -p only among the global options before the subcommand, so git log -p and git show --stat are benign reads. Since 0.28.2 the Claude Code Monitor tool is a shell tool: its command is canonicalised to Bash (Harness::Base::SHELL_TOOLS) and covered by the container root guard (HarnessControls::RootGuard::SHELL_TOOLS), so a loop or pipeline of known commands in it is judged like the same Bash line instead of asking POLISPEC-TOOL-UNKNOWN, and a push to stable or a privileged container run in it is judged as in Bash. Since 0.32.0 the library keeps detection only: Classify.benign? recognises benign shell lines alone (INTERNAL_TOOLS is gone); under the control gate in governed scope a non-shell tool that no classifier family and no positive class turns into an action yields one tool.internal action, a read tool (Harness::Base::READ_TOOLS) with no path one tool.read action, and a governed eval, source or . line one shell.exec action with shape opaque_shell whose env_hint cwds carries the directory of every command the parser finds, each marked unknown_tool. The shipped module modules/tool-declared.yml (composition row) declares them: TOOL-<NAME> allow rules with match.tool and class [tool.internal] for the harness-internal tools, TOOL-READ-<NAME> with class [tool.read] for the read tools, and TOOL-OPAQUE-DEVELOPMENT allow on shape [opaque_shell] with the in_development predicate, which applies Ledger#development to the line's directory and to every command directory exactly as 0.30.2 did in HookCommand#dev_projects (removed), and is false under the lock edition and under polispec.relax.dev off. The guard lifts the unknown mark of an action a trusted rule declares (unknowns row); a declared action is then judged by environment policy like any other, so a shelf rule naming the same tool with a stricter verdict wins across layers. A declaring rule whose match has in_development true stamps relaxed on the judgment record as before. match.tool compares case-insensitively. An undeclared tool (CronCreate, Artifact, a misspelt name) asks exactly as before. Since 0.45.0 that module is the catalog subspec tools/declared and the ask for an unknown action comes from tools/unknown (catalog row): detection and the unknown mark are unchanged, and with tools/unknown inactive the mark adds no ask."
  fastpath: "Since 0.23.0 Fastpath.refresh also writes fastpath.tools beside fastpath.txt: * without a governed baseline. Since 0.32.0 the list otherwise derives from the shipped layer: the match.tool names of shipped allow rules with class [tool.internal] or [tool.read] that bin/polispec-guard may skip, minus the read tools when a composed global or module rule governs reads (class secrets.read, a match.tool naming a read tool, or neither class nor shape), minus every tool a global or module rule names in match.tool, and empty when such a rule has class tool.internal or tool.read with no tool. Any other tool, MCP included, reaches polispec; a missing fastpath.tools makes the fast path stale. Since 0.45.0 the names come from the release's catalog module tools/declared when tools/declared is active on the host or tools/unknown is not, and the list is empty otherwise, so skipping never hides a call the unknown-tool gate would ask about."
  unsealed_asks: "Since 0.23.0, with the plane not active, an ask set made only of environment-policy warnings keeps the legacy verdict (a harness without native ask, such as Codex, gets deny with a redeemable allow-once id). A control ask still requires the protected authorization service."
  contract: "its design notes are kept outside this repository"
  schema: polispec.control/v1
  result: polispec.harness.result/v1
  capability_inventory: data/harness-capabilities.yml
  edition: "main contains standard; polispec-lock differs only by EDITION lock. Each checkout operates independently; lock provenance uses its immutable parent without a local main ref. A lock executable refuses an active standard-plane mismatch. One authority plane per host; requested edition is distinct from certification."
  translation: "The calling agent produces the deterministic grammar or YAML; control judgement uses no model."
  ownership: "Native harness artifacts and the sealed authority plane are polispec-owned domain files. Back up before mutation; preserve foreign contributions. Service capabilities continue through Rplugin::Ports.for(polispec)."
  authority: "Fixed /etc/polispec/active.json; valid root-owned provenance and pinned runtime/SDK. Invalid existing authority is broken, never an unsealed fallback. Standard seals an exact Git commit; lock reads root-authored /etc/polispec/source."
  tightening: "Agents may add provably tightening user/project controls. Removal, managed scope, core changes, loosening, and uncertain comparisons require the authenticated operator."
  judgement: "Environment policy keeps first-match order; controls independently cap severity. Explicit denials, protected targets, root guard, broken authority, and lock defaults cannot be redeemed."
  input_bounds: { ir_bytes: 1048576, controls: 256, hook_bytes: 8388608, hook_seconds: 7, launcher_seconds: 8, harness_seconds: 10, note: "Since 0.33.2 the hook reads at most 8 MiB (HookCommand::INPUT_LIMIT; 65536 before) and denies a larger call with the harness fixed reply whose reason is hook input exceeds 8 MiB; the Ruby budget is 7 s (HOOK_BUDGET; 9.5 before), the launcher deadline 8 s and the harness hook timeout 10 s, so a reply always comes from polispec or its launcher and never from a harness timeout. polispec harness grammar reports hook_input_bytes and hook_seconds from those constants. Since 0.33.2 a hook call composes each project's policy at most once: PolicySource.memoize, opened by HookCommand#run for pretool and session, keeps every composed policy for that call only, keyed by project id, repo, trust ref and policy path, and gives each caller its own copy; before it, each path in a command recomposed every live project's policy, and one ordinary Bash call composed 2,101 times and ran out the budget." }
  unknowns: "Since 0.45.0 everything in this row applies only while the operator has activated the catalog subspec mcp/undeclared (the MCP default) or tools/unknown (the unknown non-read default) on the host; with neither active, an MCP or unknown call gets only the verdicts of the rules that match it. Standard asks and lock denies undeclared MCP and unknown non-read calls in enforcing governed scope. Every MCP action needs a matching declaration in trusted policy or protected core; overlays cannot supply an allow declaration. Trusted policy is every layer the engine composes for the action's target: the global shelf, its included and profile modules, and a live project's committed policy, so a rule with an exact match.server and match.operation in any of them declares that operation for onboarding and unowned paths as well as live projects. A declaration carries class [mcp.call] so it does not count as a rule that governs reads. Protected-authority checks deny an fs.write, fs.delete or control.edit whose path is a protected path, lies inside one, or is an ancestor of one; since 0.23.1 the ancestor match does not apply to the fallback write an unrecognised program gets on its working directory (env_hint unknown), so running such a program from the home directory is not a write over the runtime, while an explicit recursive change, move or delete of an ancestor still is. Since 0.24.0 a policy.edit whose target is a protected path or lies inside one (a shell redirect, Write or Edit of the ledger) is denied the same way; a policy.edit whose target is an existing directory, as polispec apply emits for its working directory or --repo, is not, and the ancestor match never applies to policy.edit. Since 0.25.0 a control ask is carried by the judgment record's control block (verdict warn and the ask ids) and no polispec.verdict event is emitted. Since 0.28.1 a mkdir operand the parser cannot resolve (a variable or a command substitution) is that same fallback write (env_hint unknown) instead of a write of the working directory, so creating a scratch directory named by a variable from the home directory is not a write over a protected root; a static mkdir target, and an unresolved operand of every other command, keep the ancestor match. Since 0.28.1 zcat, zgrep, zegrep, zfgrep, zless, zmore, bzcat, xzcat and zstdcat classify as reads of their file operands like cat and grep (secrets.read candidates), and gzip, gunzip, bzip2 and xz with -c, -t or -l (alone or in a short-option cluster), --stdout, --to-stdout, --test or --list write nothing and read their operands; a shell redirect still classifies as the write it is. Since 0.29.0 an unknown-tool or undeclared-MCP ask is lifted when every trigger that causes it is covered by an exception of the global layer (see the exceptions section); a line that still has an uncovered trigger asks about all of them, and the lock edition honors no exception. Since 0.30.0 the ask for an opaque eval, source or . line is not raised in a project in development (the benign row), and an exception is then not needed for it. Since 0.32.0 an unknown-tool action is declared the way an MCP operation is: by a rule in trusted policy, the catalog layer included (the shipped layer through 0.44.1), whose match names the exact tool (match.tool, case-insensitive) for a tool.internal or tool.read action, or whose match.shape includes opaque_shell for an opaque shell line, and that matches the action in full (env, path, class, role and predicates included), picked across layers by the strictest verdict. For a target with no trusted policy (policy_source controls: no shelf and no live project) only the catalog layer's rules declare, and no rule declares an MCP operation there. The edition default (warn or deny) and the exceptions lifter are unchanged."
  failure: "Non-read calls fail closed; only an entirely positive diagnostic-read envelope qualifies for the failure exception. Mixed, malformed, shell, MCP, web, and delegation calls do not. Since 0.33.2 the same holds when the Ruby hook gives no reply at all: bin/polispec-guard denies every non-read pretool call it cannot get a verdict for (install guard_binary row), so a missing, failing or slow runtime no longer lets calls through."
  overlays: "Effective installed receipts require authenticated transaction relationships, canonical targets, current owned contributions, and bounded state. Valid successor history may replace prior artifact bytes; unrelated supersession is refused."
  exposure: "First root-equivalent exposure advises; a distinct continuing scan arms root_guard. Protected scans validate provenance and exact observations; corruption conservatively arms. Rootless is a separate observation."
  events: "Lifecycle and authorization events use the plugin events port after state commits. Events carry identities and outcomes, never tool payloads or authority redirect values. Event failure cannot loosen a verdict. The polispec.judgment event is a copy of the local judgment record without its raw field: targets, rows with home-relative paths and refs, engine identity and the outcome, never tool arguments."
  native_evidence: "Release-host parser/version and isolated scratch evidence only. No native lock certification, paid model journey, root-owned host seal, host service installation, timer activation, or live-project activation."
protected_authorizations:
  socket: /run/polispec/authorizations.sock
  kill_marker: /etc/polispec/authorizations.disabled
  identity: "Client authenticates a root peer; server authenticates request UID from kernel peer credentials. Redemption is a local protected operator action."
  binding: "Exact generation, project, canonical action, complete tagged ask set, trusted policy/control digests, actual harness/session, and requesting UID. One standard grant can resolve combined environment/control asks; independent denials remain binding."
  consumption: "Durably record consumption before replying. Replay, concurrent consumers, changed authority, unavailable service, and lost replies never produce another grant."
  bounds: { request_bytes: 16384, response_bytes: 32768, deadline_seconds: 2, ttl_seconds: 600, backlog: 8, inflight: 1, uid_requests_per_minute: 60, global_requests_per_minute: 300 }
  deployment: "Built, not installed or started on the release host. Unit rendering and stale-socket recovery are explicit operator commands."
delegation:
  summary: "Since 0.31.0 the operator can let an application run polispec promote and deploy for them, for example from a button in the application's own console. The operator grants the application a scope at a terminal, and a polispec-owned runner runs the granted commands in its own process with the output kept for the application to read. Confirmations that need a typed phrase are relayed from the application to the same exact-match check the terminal uses."
  grant: "polispec delegate grant APP --projects P,... --verbs promote,deploy --targets test,stable [--flags ...] needs a terminal and the typed phrase grant delegation to APP, refuses on a sealed plane, checks each project against the ledger, and prints a one-time app token pdt_<64 hex> that the operator stores in the application's protected secrets. Only its sha256 is kept. revoke APP (phrase revoke delegation from APP) removes the grant; a new grant for the same app replaces the old token. Flags are a subset of --dry-run, --json, --tag, --waive-soak, --skip-drain and, since 0.44.0, --verbose, default --dry-run, --json and --tag; --tag applies to deploy only."
  storage: "<state home>/delegate/grants.yml (schema polispec.delegate_grants/v1, mode 0600, at most 16 grants and 16 KiB). A file that is missing, oversize, invalid, not owned by the user or writable by group or others means no grants. A Write, Edit or shell redirect into it classifies as policy.edit, which live policies warn on; it is not a protected path of the control ceiling."
  runner: "polispec delegate serve listens on $XDG_RUNTIME_DIR/polispec/delegate.sock (else <state home>/polispec/delegate.sock), directory 0700, socket 0600, peer uid checked with SO_PEERCRED. It refuses to start on a sealed plane, while <state home>/delegate/delegate.disabled exists, or while another listener answers; a stale socket is renamed, never deleted. polispec delegate unit renders a systemd user unit and installs nothing. The runner is separate from the application's units, so a deploy that restarts the application keeps running and its output stays readable."
  protocol: "One JSON line per connection, request at most 16 KiB, reply at most 128 KiB, 5 s read deadline. Every operation but ping carries app and token (unknown app and wrong token answer the same unauthorized) and is rate limited to 60 a minute per app. Operations: request {argv, by} starts a run when the argv after polispec is inside the grant (out_of_scope with the reason otherwise; busy while a run of the same project is active or two runs are active); output {run_id, offset} returns up to 64 KiB of output from a byte offset, the state (running, waiting_phrase, succeeded, failed, cancelled, timed_out), the exit code and, while waiting, the prompt and the exact phrase asked; phrase {run_id, text} forwards one line once to the waiting confirmation; cancel {run_id} terminates the run's process group (KILL after 10 s); status returns the scope and active runs. While the kill marker exists or the plane is sealed, every operation but ping answers disabled, before authentication."
  runs: "Each run forks a child that starts its own session, reads /dev/null, writes stdout and stderr to <state home>/delegate/runs/<drn_ id>.log (0600; logs older than 30 days are removed at start), and runs the CLI in process with a delegated confirmer. Operator::Tty.confirm! and Gates.interactive? honor that confirmer only; it is set in process, never from the environment, a file or an argument. The confirmer writes the prompt and phrase to the log as the terminal would, waits up to 10 minutes for the application's text, compares it exactly, and logs only its length. Runs time out after an hour and expose at most 8 MiB of output. Starts and ends are appended to delegate_runs.jsonl, promotion and deploy records and their events carry via delegate:<app>:<by>, and each run emits polispec.delegate."
  exceptions_verbs: "Since 0.35.0 a grant may name the verbs exceptions-add, exceptions-promote and exceptions-remove (the web app's grant), so the runner relays the typed phrase of polispec exceptions add, promote and remove exactly as it does for promote. Excluded from lock (specs/editions.yml exceptions.delegate_promote): under lock a grant naming them is refused and the runner answers disabled."
  guard: "polispec delegate grant, revoke and serve run by an agent classify as policy.edit, which the host defaults and the environment-control packages warn on; list, status and unit are benign."
  limits: "Delegation is the unsealed terminal confirmation made reachable from an application, not operator authentication: whoever holds the app token and can type the phrase can run the granted commands. The token's protection is the application's secret store. A program the classifier cannot read, such as an interpreter running inline code, can set the confirmer in its own process, the same known limit as every classified path."
exceptions:
  summary: "Since 0.29.0 the operator can record persistent exceptions to the guard's asks, the equivalent for polispec of an always-allow list. An exception lifts only the ask it names, for the commands it matches; the rest of a line is still judged by policy, and the exception that lifted a call is stamped on its judgment record."
  storage: "exceptions.yml (schema polispec.exceptions/v1) at the root of the global layer, read from the committed ref of polispec.global.repo, from the directory layer, or from the sealed bundle. It is a file of the global shelf, so it is trusted policy under the unknowns row, and no overlay, project file or state file can supply an entry. A missing file means no exceptions; a file that is invalid, over 256 entries or over 64 KiB honors nothing, and doctor reports exceptions_invalid."
  entry: "id aex_ plus 12 hex of sha256 over kind, tool, command, rule and scope; kind control (POLISPEC-TOOL-UNKNOWN and POLISPEC-MCP-UNDECLARED asks) or rule (an environment rule's warn, Bash only); tool, the exact canonical tool name, where every shell tool, Monitor included, is Bash; command, a glob over the whitespace-normalised, unexpanded text of the triggering command (* crosses slashes), required for Bash and forbidden otherwise, whose first word contains no glob character; rule, the rule id, required for kind rule and forbidden for kind control; scope, {project: canonical path} or {global: true}; note up to 200 characters; added."
  lifting: "control: the ask is lifted only when every trigger is covered. The triggers of a shell line are the eval, source and . commands it runs (or the whole line when the parser cannot name them, or when it is unparseable); the trigger of any other tool is the tool name, and of an undeclared MCP call the full mcp__server__operation name. rule: a warn row of a Bash call is lifted when an entry names its rule id and its command text matches. An exception applies when the working directory is inside its project scope or the entry is global."
  never: "Never excepted: a deny, POLISPEC-CONTROL-PROTECTION, the container root guard, a broken seal and every verdict of the lock edition. Plan, apply, probes and the journal replay never apply exceptions, so a plan compares policy only. explain applies them so it reports what the hook would answer, and writes nothing."
  proposals: "When a governed call still asks or warns on a trigger an exception could cover, the hook records a proposal (apr_ plus 12 hex of sha256 over kind, tool, command and rule) in exception_proposals.jsonl in the polispec state home, kept seven days and at most 256, and appends to the ask text: To stop asking for [<the triggering commands, at most 80 characters each>], the operator can run in a separate terminal: polispec exceptions promote <ids>. No proposal or hint is made for a deny, under the lock edition, while the sealed plane is active, or while polispec.exceptions is off. A proposal grants nothing."
  creation: "polispec exceptions add and promote (and remove) run on a TTY after the operator types the phrase shown, refuse while the sealed plane is active, and change nothing but exceptions.yml: they require the global layer to be a git repository on its ref with no other uncommitted change under the shelf path, write the file, then plan and apply the global target with the plan's own id as the confirmation, which commits it as Apply polispec plan <id>. A failed apply restores the previous bytes. An agent shell cannot run them (not_tty)."
  protection: "The exceptions file is a protected path like the ledger: a Write, Edit or shell redirect into it classifies as policy.edit and is denied POLISPEC-CONTROL-PROTECTION. The known limit is the one every classified path has: a program the classifier cannot read, such as an interpreter running inline code, is an unknown write."
  matching_limit: "An exception matches the text of the command, not what it expands to or runs: an entry for . $B/env.sh stays in force whatever $B/env.sh contains. promote escapes the glob characters of the proposed text, so a promoted entry matches that command exactly; add and promote --command take a pattern as written."
  scope_default: "A new entry is scoped to the project root, the git toplevel of the working directory (of the proposal's directory for promote), else that directory; --global widens it to the host. There is no expiry; remove revokes."
delete_guard:
  summary: "Since 0.45.0 the delete guard is the catalog spec delete-guard (subspecs protected, with the delete_protected key and G-DELETE-PROTECTED and G-DELETE-PROTECTED-FILE, and xargs, with G-DELETE-XARGS), off until the operator activates it on the host; the shipped part of the effective list below is then the active protected subspec's key. Since 0.33.0 polispec ships modules/delete-guard.yml in the shipped layer. Its data key delete_protected lists exact entries (the path itself) and tree entries (the path and everything below it): exact /, ~, /home, /etc, /usr, /var, /boot, /bin, /sbin, /lib, /lib64, /opt, /root, /sys, /proc, /dev, /usr/bin, /usr/sbin, /usr/lib, /usr/lib64; tree ~/.ssh, ~/.claude, ~/.config, ~/.rplugins, ~/.polispec. Since 0.41.0 ~/.ai is no longer shipped: it is one host's AI home, not a path every polispec user has, and that host lists it in its own global shelf (personal_defaults row). The effective list is the union of the shipped modules' key, the global doc's top-level delete_protected and every shelf module's delete_protected; nothing removes an entry, and a live project's policy does not contribute."
  rules: "G-DELETE-PROTECTED (class fs.delete, predicate delete_protected) denies; G-DELETE-PROTECTED-FILE (class fs.delete, predicate delete_protected_file) warns; G-DELETE-XARGS (shape xargs_delete) warns. Every rule is overridable: the shelf loosens one only by naming it in overrides through plan global and apply global, and a warn row is liftable by a global exception like any warn."
  matching: "The target is the fs.delete hint path; a last component of exactly *, .*, .[!.]*, ..?* or .??* makes it a delete of its directory's contents. Base and every entry are compared both lexically (File.expand_path, ~ expanded) and with symlinks resolved (Envs.canonical). delete_protected holds when the base equals an exact entry; or, for a contents delete, when the base equals or is an ancestor of any entry or lies under a tree entry (lying under an exact entry does not count, so rm /tmp/* is not a delete of /); or, for a delete carrying the recursive hint, when the base is at or under a tree entry or an ancestor of any entry. Lexical forms are compared with lexical forms and resolved with resolved, never crossed. Equality and ancestry use both forms, so the real folder a symlinked tree entry points to, and every ancestor of it, is protected however it is spelled; lying under a tree entry uses the lexical form, and also the resolved form when the entry is a real folder (its path resolves to itself), so ~/.ssh is covered through any alias while a path beneath a symlinked entry's target written by its real path is not judged (on the release host some tree entries are symlinks into git working repositories where agents clean builds; by operator decision on 2026-10-19). delete_protected_file holds otherwise for a non-recursive, non-contents delete at or under a tree entry. Exact entries do not cover their children. Judgment is origin independent and touches no fs.write."
  classifier: "Since 0.33.0 an fs.delete action carries env_hint recursive true for rm with --recursive or a short cluster containing r or R, for rmdir, for a find delete (-delete, -exec/-execdir/-ok/-okdir rm) and for cargo clean; a find -exec, -execdir, -ok or -okdir deleter may be rm, rmdir, unlink or shred. A deleter (rm, rmdir, unlink, shred) whose words came through xargs carries shape xargs_delete, because its targets arrive on stdin and are never seen. An operand the parser cannot resolve still falls back to the working directory."
  plan: "A global plan keys the delete_protected entries of global.yml and of every shelf module as delete:exact:<path> and delete:tree:<path> beside protected roots, so adding one classifies tightening and removing one loosening."
fs_walk:
  summary: "Since 0.46.0 a recursive read-only walk is visible to rules. polispec ships the mechanism and no rule: the action class fs.walk and the shapes root_walk and slow_mount_walk, so a shelf module can deny the walks that stalled host IO on 2026-10-25 (find / over a 4.5 TB exFAT disk and a FUSE mount). With no matching rule these calls stay allowed."
  classifier: "The fs classifier family emits one fs.walk action per start path of find and bfs (the leading non-option arguments, default .), du (positional arguments), fd and fdfind (the second positional argument or each --search-path), rg (arguments after the pattern, every positional argument with --files, -e or -f), grep, egrep and fgrep only with -r, -R, --recursive or --dereference-recursive, ls only with -R or --recursive, and tree. A dynamic path is skipped. A path is resolved against the command's working directory. The hints are path, walk (root or slow_mount), command and, for slow_mount, fstype. A walk that is neither a root walk nor on a slow mount emits no action."
  shapes: "root_walk marks an fs.walk whose normalized start path is /, /., // or /* when the command does not stay on one filesystem: find and bfs with -xdev or -mount, du with -x or --one-file-system, rg and fd with --one-file-system stay. slow_mount_walk marks an fs.walk whose start path lies on a filesystem of type fuse, fuseblk, fuse.*, nfs, nfs4, cifs, smb3, smbfs, sshfs or 9p, or on any mount point under /run/media, /media or /mnt, and, for any walk that does not stay on one filesystem, the first such mount under its start path. A disk filesystem such as vfat at /boot/efi is not slow. The start path's filesystem is the longest mount point that prefixes its real path. The mount table is read once per process from /proc/self/mountinfo, or from the file named by POLISPEC_MOUNTINFO when that is set; when it cannot be read no slow_mount_walk is emitted."
  fast_path: "Classify.benign? returns false for any command that would emit an fs.walk action, so the hook evaluates it; every other read keeps the fast path."
scratch_cap:
  summary: "Since 0.39.0 a rule can cap the size of what an agent writes into a scratch tree. polispec ships mechanisms and no rule: four match keys, one shape and two action hints. The caps themselves are the rules of a shelf module, scratch-cap, that a host adds with plan global and apply global. A runtime older than 0.39.0 rejects the new match keys, so a host applies the module only once its pin is 0.39.0 or later."
  keys: "match.bytes_over (integer, bytes) holds for an fs.write action whose bytes hint is an integer above the value. match.fsize_unset (true; the schemas accept no other value) holds for an fs.write action whose fsize_blocks hint is the string unlimited; an action with no fsize_blocks hint, as a Write or Edit tool call, never holds. match.fsize_above (integer, bytes) holds for an fs.write action whose fsize_blocks hint is an integer and fsize_blocks times 1024 is above the value. match.tree_over (object with marker, a directory name, and bytes) holds when the action's path itself, or else its nearest ancestor directory, is named marker and that tree's apparent size as du -sb reports it is above bytes; no such directory does not hold, a tree that does not exist yet measures as 0, and a tree that cannot be measured within the budget does not hold and raises a finding. The four keys are valid in policy, module and global documents, are tested after the cheaper match keys, and are not harness-control language keys."
  hints: "An fs.write action from a write tool (Write, Edit, MultiEdit, NotebookEdit and the other write tools) carries bytes: the sum of the byte sizes of the strings under content, file_text, text, new_string, new_str, new_source and contents in the tool input and in each edits entry. An fs.write action from a shell command carries fsize_blocks: the integer N of the last earlier ulimit command in the script that set a hard file-size limit (ulimit -f N, ulimit -Hf N, ulimit -fH N), or the string unlimited when there is none, when the last was ulimit -f unlimited, or when its value is not a literal integer. A soft-only ulimit (-S) changes nothing, and a ulimit that is a stage of a multi-stage pipeline does not count. Commands of one script that share the same text share the hint, and it is the weakest limit among them. Other actions of a shell command carry no fsize_blocks. A block is 1024 bytes, as in bash; dash and sh in POSIX mode use 512 and polispec does not tell them apart."
  shape: "bulk_write marks the fs.write actions of a bulk writer: tar in create mode, zip, 7z, 7za, 7zr, 7zz, pg_dump, pg_dumpall, mysqldump, ffmpeg, curl, wget, cp, rsync, dd, git archive and git bundle, and of any command with one of those upstream in its pipeline (pg_dump db | gzip > f). An fs.write that is only the unknown write at the working directory, kept for a command whose output polispec could not resolve, does not carry it. It is the shape rules combine with fsize_unset, fsize_above and tree_over so that a small note written with echo or tee is never asked about."
  classifier: "Since 0.39.0 tar in create mode with the archive named inside a bundled option cluster (tar czf X, tar -czf X, tar cf X) or by --file=X yields an fs.write for X; before, only a separate -f X was seen, so the usual tar czf X wrote nothing polispec saw. zip (first operand), 7z, 7za, 7zr and 7zz with a or u (first operand after the subcommand), ffmpeg (the final operand that is not an option value), mysqldump (--result-file), pg_dump and pg_dumpall (-f, --file), git archive (-o, --output) and git bundle create (first operand) also yield an fs.write for their output; tar finds create mode and the archive name from any argument, so tar -C src -czf X . is seen. When 7z, 7za, 7zr, 7zz, ffmpeg or mysqldump name no output polispec can resolve, the unknown write at the working directory that 0.38.0 gave them is kept (Bulk::GENERIC); a zip with no resolvable output yields no write action. This tightens every project: any rule that judges fs.write, such as the prod-write, location and protected-root rules, now sees these outputs."
  module: "The scratch-cap shelf module takes cap_bytes (default 128 MiB), cap_blocks (the same cap in 1024-byte blocks, quoted in the deny reason) and tree_bytes (default 2 GiB). For each scratch glob, and for the bare scratch directory a copy into it names, it denies a bulk_write with fsize_unset (the reason gives the prefix ulimit -f 131072;), warns on a bulk_write with fsize_above the cap, and warns on a bulk_write into a tree_over its budget. Within a layer the first matching rule wins, so the deny precedes the warns. The module has no rule on bytes_over: the hook already denies any input over 8 MiB (INPUT_LIMIT), so a cap of 128 MiB on a write tool call could never fire; bytes_over is for a cap below 8 MiB. The cap is per file; it does not bound the number of files."
  limits: "polispec cannot rewrite a command, so the cap holds because the deny makes the agent write the ulimit itself; the kernel then enforces it, killing the writer with SIGXFSZ at the limit and leaving a truncated file. A ulimit in a subshell group, in an embedded bash -c body, or set after the writer in a different call is not told apart from a plain one beyond the pipeline-stage rule. tree_over measures with a bounded du and a 60 s cache under the state home, so a tree can exceed its budget by what is written within that window."
text_match:
  summary: "Since 0.40.0 a rule can match what a call says. match.text_matches is a Ruby regular expression tested against the action's text hint. polispec ships the mechanism and no rule; a host adds rules with plan global and apply global, and a runtime older than 0.40.0 rejects the key."
  hint: "text is carried on every action of a shell command (the command's text, then the body of each of its heredocs, joined by newlines) and on a write tool's fs.write (the content strings, per edits entry for a MultiEdit-style input; for apply_patch, each file's added lines and an Add File's whole body). It is cut to TEXT_LIMIT (262,144 bytes) on a character boundary, with text_truncated true. Since 0.40.0 apply_patch write actions also carry bytes, so bytes_over rules now see Codex patches."
  matching: "A source is compiled once per process, with a 0.25 s match timeout on Ruby 3.2 and later. A source that does not compile is a validate error naming the rule; at runtime it, a timeout or a bad encoding does not hold and records a text_matches finding."
  fastpath: "The fast path adds the tool needles when any composed shelf rule uses text_matches, so a call outside every ledger project still reaches the judge."
  limits: "Only text in the call is seen: a script run by path is judged by its command line, not its file. A command that yields no action (git status, psql -c) is never matched. Ruby 3.3 memoizes most backtracking, so the timeout matters mainly for backreference patterns."
  first_use: "A global-shelf warn rule against hand-built Playwright and Puppeteer measurement rigs, pointing at a rendered-page audit tool instead (the operator's choice, 2026-10-23)."
lint:
  summary: "Since 0.42.0 polispec lint sweeps the files polispec generates and the files it ships for schema errors, YAML hygiene problems, drift from their source, dangling references and description findings, and reports each as a finding with a severity, a rule, a code, a path and, where known, a line and a JSON pointer. It is read-only and judges every file with the loader the guard uses (YAML.safe_load, aliases refused), so it reports what that loader refuses and also what it accepts silently. It is separate from validate, which checks one file against one schema."
  usage: "polispec lint [PATH...] [--host] [--shipped] [--only RULE[,RULE]...] [--strict] [--json]. With no operand and no scope flag it sweeps the project of the working directory (its git toplevel, else the directory). A file operand is linted alone; a directory operand is swept as a project root. --host adds the host scope and --shipped the running release tree. --only takes schema, hygiene, drift, refs and description. Exit 0 when no error finding results (and no warn finding with --strict or polispec.lint.strict on), 1 otherwise, 2 on usage. --json prints { ok, targets, counts: { error, warn, info }, findings: [{ severity, rule, code, path, line, pointer, message }] }; the text form prints one line per finding and a summary."
  project_scope: "Files found by their schema id, not their path: every .yml, .yaml and .json file under the root outside vendor, node_modules and dot-directories (except .agents and .polispec) whose first 4 KiB name a schema id beginning polispec. is a polispec document of that kind. Fixed paths add expectations: specs/polispec/environments.yml, policy.yml, roster.yml and code-waivers.yml must carry their own kind (schema_kind_mismatch otherwise), a file under specs/polispec with no polispec schema id is schema_unrecognized, specs/polispec/modules/*.yml are modules, polispec.app.yml is an app document and polispec.manifest.json a manifest. When specs/polispec/environments.yml exists the [ENVS] row of AGENTS.md and .agents/directives/envs.md are drift-checked, and every behavior v2 document with surfaces is drift-checked at the root."
  host_scope: "--host adds the ledger; the global shelf as the guard reads it, from the committed ref of a repository source or the files of a directory source (global.yml, modules/*.yml, exceptions.yml, profiles.yml, packages/*/package.yml, paths/*.yml); deployments.json; delegate/grants.yml; the settings file (hygiene only); the published index file of the current user; every harness-control installation the current user owns (file integrity only); and the working tree of every non-retired ledger project whose repo exists, each as a project scope. The guard reads a project from its trust ref, lint from the working tree, so lint reports what an agent just generated and doctor remains the check of what the guard reads. Since 0.48.0 --ref REF materializes each project root's yml, yaml and json files at REF with one git cat-file --batch and lints that copy, naming findings <repo>@REF:<path>; the agents and manifest drift checks skip a ref root, and a missing ref is an error."
  rules:
    schema: "schema_invalid (error: the document fails its schema or the semantic checks validate runs, with the JSON pointer), schema_kind_mismatch (error), schema_unrecognized (warn)."
    hygiene: "yaml_syntax and json_syntax (error, with line), yaml_duplicate_key and json_duplicate_key (error: the loader keeps the last key silently), yaml_alias (error: the loader refuses anchors and aliases), yaml_multiple_documents (error: safe_load reads only the first), then as warn: yaml_tab, yaml_bom, yaml_crlf, yaml_trailing_space (not inside a block scalar, where it is content), yaml_no_final_newline, yaml_bool_word (a plain yes, no, on or off reads as a boolean, so a setting written on is not the string on) and yaml_non_string_key (the loader turns a boolean, null or number key into a string). A .json file gets json_syntax, json_duplicate_key and the schema rule."
    drift: "agents_drift (error: the [ENVS] row or envs.md differs from a fresh render, the check polispec agents render --check makes), behavior_surface_drift (error: a generated surface differs from its rendering, the check polispec behavior drift makes), manifest_drift (warn: polispec.manifest.json fails the manifest schema, or its id, status, enforce mode or per-environment policy digests differ from a fresh Manifest.for), harness_artifact_drift (error: an installed artifact no longer matches its receipt, from HarnessControls::Files.verify_receipt; no native probe runs, so this proves file integrity and says nothing about enforcement)."
    refs: "version_disagree (error: VERSION, polispec.rplugin.yml, specs/app.yml, plugin.json, .codex-plugin/plugin.json, .claude-plugin/plugin.json and .claude-plugin/marketplace.json name different versions; shipped scope), schema_ref_missing (error: a $ref in a schemas/*.yml file names a node that does not exist), schema_file_missing (error: a kind in Schema::KINDS has no schemas/<kind>.v1.yml), package_source_missing (error: a file a package.yml names is absent from the package), ledger_repo_missing and ledger_path_missing (warn: a non-retired ledger project repo or path entry does not exist), shipped_unclaimed (warn: a YAML or JSON file of the release that no row of the shipped table claims) and shipped_row_unmatched (warn: a row of the table matches no file)."
    description: "The description lint of validate (Polispec::Description.warnings) over every policy, environments, roster, global, module, package and spec document: description_<code> findings, warn, error while polispec.description.strict is on."
  write_gate: "polispec.lint.on_write (default on). Polispec::Lint.guard_write!(text, path:, kind:) runs the hygiene and schema rules on a generator's output before it is written and raises Operator::Failure lint_failed, with the problems listed and nothing written, when an error finding results. Gated: apply on the project, global and ledger targets (each file), the starter ledger, registration proposal files, polispec.manifest.json and the host index, exceptions.yml, the deployments manifest, the delegate grants file, the rubocop base.yml of code generate, and the hygiene pass over rendered package templates. agents render and behavior render --write produce text with no schema; they are checked for valid UTF-8 and no NUL byte (errors) and a final newline (warn), kind text, and sweep-checked by the drift rule. Not gated, by design: the smoke ledger (each entry is schema-validated before the write), the settings file and state files (dumped from a hash), harness-control artifacts (foreign files merged in place; covered by harness_artifact_drift) and the judgment, change and session streams."
  doctor: "polispec.lint.doctor (default on). doctor runs the host scope without the description rule, the ledger and exceptions schema checks, the agents drift check (doctor already reports ledger_invalid, exceptions_invalid and agents_drift) and manifest_drift (composing a manifest runs doctor) and files each remaining finding as lint_<code>: error blocking, warn warn, info info, the project being the ledger project that owns the path, else none. A failure of the step files lint_unavailable (info) and never fails doctor. Since 0.48.0 doctor lints each ledger project at its trust ref through the reader of lint --ref, so a defect only on the development branch is a lint finding and no longer fails doctor; a project with an empty trust ref is linted from its checkout, and one whose trust ref is missing gets ref_missing (info) and is skipped. Since 0.52.0 the ref reader exports every file under specs/polispec/ whatever its extension, so a surface template (.tpl) is present for the behavior-surface drift check, which before reported a false behavior_surface_drift at the trust ref. Since 0.52.1 it also exports the target of every surface named in an exported document's surfaces, when the target exists at the ref, so the drift check compares the render with the committed file instead of reporting it missing."
  shipped: "Since 0.48.0 every shipped catalog module and package carries a description, so lint --shipped reports no description_missing. polispec lint --shipped judges the running release tree against Polispec::Lint::Shipped::TABLE, an ordered list of rows { glob, kind, regexp } built from glob and kind pairs; the first matching row claims a file. kind is a schema kind, auto (the file's own schema id), schema_doc (a schemas/*.yml document: hygiene, loadable by Schema::Validator, every $ref resolving), template (hygiene only: placeholders keep package templates from validating until rendered) or hygiene (no schema exists). Files come from git ls-files when the root is a git work tree and from a walk of the tree otherwise, so a pinned release is judged by what it contains."
  limits: "A clean sweep proves schema acceptance, loader-safe YAML and agreement between a generated file and its source; it does not prove that policies compose safely or that a harness enforces anything. manifest_drift compares identity, status, mode and digests, not the findings, promotions or timestamps a manifest also carries. A tab after a colon and a boolean word are warnings because the loader accepts them. lint reads the working tree unless --ref names a commit, so an uncommitted edit is judged and the trust ref is not."
  compatibility: "A runtime older than 0.42.0 has no lint verb and no polispec.lint.* setting; it ignores the keys in a settings file it does not know. No policy, module, ledger or schema file changes shape, and no verdict changes. The one behavior change is the write gate: with polispec.lint.on_write on (the default), an apply, register, exceptions or manifest write whose output has a duplicate key, an alias, a second document or a schema error is refused, where the loader accepted a duplicate key, an extra document and an alias-free tab silently before; polispec.lint.on_write off (or POLISPEC_LINT_ON_WRITE=off while unsealed) restores 0.41.1."
verbose:
  summary: "Since 0.44.0 --verbose streams what an operation does while it does it: each step with its elapsed time, each git call and child process with its output line by line, each gate, check, write and decision. It is a trace of one run on stderr. What an operation prints on stdout, its --json form and its exit status are the same with and without the flag, and without the flag nothing is traced."
  usage: "--verbose, --verbose=text, --verbose=json or -v, anywhere before a -- operand of any verb except hook and code-hook. POLISPEC_VERBOSE does the same for the top-level process: 1, true, on or text mean text, json means NDJSON, and unset, empty, 0, false or off mean off; the flag wins over the variable. Any other value, and any other --verbose= value, is a usage error (exit 2). The hook and code-hook verbs ignore the flag and the variable, so the guard never writes to stderr because of either; the one exception is hook git install and hook git uninstall, which are installers, not the guard. A bare token -v or --verbose that is the value of another flag is read as the flag; write --note=-v or a comma list such as --flags --dry-run,--verbose to pass such a value. The smoke runner unsets every POLISPEC_ variable in its steps, so the variable never leaks into a scenario; a scenario step that needs it sets it in its own env field."
  streams: "Promote and deploy: project and policy load, every git call, every gate with its result, the plan (shas, version, tag), the typed-phrase wait, tag, atomic push and branch advance, the release call, each after step, and for a deploy the checkout, each drain phase, each step, activate, each health poll, a swap and a rollback; child output line by line as it runs, so a test deploy that runs the full smoke suite streams its progress. Rulebook changes: exceptions add, promote and remove (preflight checks, the new entry, validation, the typed-phrase wait, the write, the plan and apply global, the commit, the change record), apply and plan for every target, register and unregister, settings, manifest --write, agents render, behavior render, specs, roster, pause, allow-once, delegate grant and revoke, code generate and baseline. Install lifecycle: pin, install and uninstall, uninstall --all and restore, steward, deployments --scan, harness install, verify, scan and uninstall, seal, plane, hook git install and uninstall. Diagnostics: doctor (each check), lint (each target), status, and smoke run (each scenario and step; a passing step's output is counted, a failing step's output is shown)."
  text: "One line per event on stderr: the elapsed time formatted [%7.1fs] (for example [   12.3s]) followed by two spaces of indent per nesting level and a marker: > opens a step, + closes it with its duration, ! closes it failed with the reason, - is an information line with key=value fields, $ is a command line, = is its exit status and duration, | is a line of child stdout (or of merged output), 2| is a line of child stderr, # is the start or the end of the run. A begin line names the verb, polispec version and process id; an end line gives the exit status, the elapsed time and the trace file."
  json: "--verbose=json writes the same events as NDJSON on stderr, one object per line: {v: 1, ts, t, depth, event, ...}. ts is UTC ISO 8601 with milliseconds, t the seconds since the run began. Events: begin {op, pid, version}, step {phase start|end, label, fields, ok, ms, error}, info {message, fields}, command {argv, cwd}, exit {code, ms, timed_out}, output {stream out|err, text}, end {exit, ms, file}. Keys are added, never renamed or removed, within v 1."
  file: "polispec.verbose.trace (default on): while a run is verbose, its trace is also written to <state home>/trace/<UTC stamp>-<verb>-<pid>.log (.ndjson in json mode), directory 0700, file 0600, in the format of the stream, and the end line names it. A file stops at 8 MiB with one closing line. At the start of a verbose run files older than 14 days are removed and only the newest 63 are kept (Trace::Logfile::KEEP), so with the new file there are at most 64, with File.delete and never a recursive delete. The file is written only when the state home already exists, so a verbose run never creates it (restore after uninstall --all depends on that); an unwritable or missing state home never fails the run, and the stream goes on without a file."
  never_printed: "Environment values and the contents of env files, delegate app tokens, the web launch secret and the answer typed at a confirmation prompt are never printed or written; the phrase to type is. A command line is printed as the operator ran it (the words are also stored in deploy records). Child output is printed as the child wrote it, the text that lands in a failure tail today, and the trace file keeps it, which is why it is mode 0600 and why polispec.verbose.trace turns it off."
  delegation: "--verbose is a grantable flag: a grant may name --verbose in --flags, and a run whose argv carries --verbose or --verbose=json is then inside the grant. The default grant flags are unchanged, so an existing grant does not stream. The runner already keeps stdout and stderr in the run log that the application reads by offset, so the stream reaches the application with no new protocol."
  guard: "A flag the guard has not seen must not change what it judges. Classify.benign? accepts the three forms among the flags of every read verb in its table, and before the verb, so polispec doctor --verbose and polispec --verbose status stay benign reads; Release.operator finds the verb as the first positional, so polispec --verbose promote P --to stable and polispec promote P --to stable -v stay classified as a promotion to prod."
  coverage_0_48: "Since 0.48.0 exceptions add shows its file write, plan global and apply global as sibling steps, each labelled once; the contract runner (with its process-group timeout), the Code baseline and controls record writes, the specs link relink, Environments.git and the judge-side git helpers of git_hook.rb emit steps; and a Trace.step or Trace.info field may be a callable, evaluated only when the trace is on."
  limits: "A trace is a record for the person at the terminal, not an audit log: it is not chained, not sent to the events port and not read by the guard, doctor or any consumer. Output that a child writes in a burst appears as the child flushes it. A run that is killed leaves a trace file without its end line."
  compatibility: "A runtime older than 0.44.0 rejects --verbose as an unknown flag with a usage error (exit 2) and has no polispec.verbose.trace setting; an application must not pass the flag to a delegate runner of an older polispec. Nothing changes without the flag: no output, exit status, file, record, event or judgment differs."
smoke:
  summary: "A smoke ledger records smoke tests that proved a spec or sub-spec worked in reality, each with the runtime it ran in. polispec records, chains, verifies and reports coverage, and since 0.23.0 ships a bundled suite run by polispec smoke run; operators may record their own tests beside it."
  file: "smoke.yml, schema polispec.smoke/v1: schema plus an append-only entries list. Writes go only through polispec smoke record, under an exclusive file lock with an atomic replace."
  proves: "spec is a path relative to the git toplevel of a YAML file that parses to a mapping or list; at is a slash path into it: a mapping key, or a list item whose name or id equals the segment; ~1 escapes / and ~0 escapes ~. An empty at proves the whole file. record refuses a reference that does not resolve, and stores at_digest, the sha256 of the canonical JSON of the resolved node."
  verdicts: [pass, fail, partial, blocked, inconclusive]
  inconclusive: "Since 0.24.0 a live step whose only failing checks are hook_fired, hook_log or files_exist, with no timeout, spawn or auth error, did not attempt the action; it re-runs once (the first attempt's evidence kept as .first. files) and, if the retry also does not attempt, records inconclusive. inconclusive does not fail a run, never proves a unit and never revokes an earlier pass. A failing files_absent or git check always fails with no retry."
  entry: "id, recorded_at, started_at, finished_at, proves, verdict, summary, steps (run, exit, expect, observed), evidence (path relative to the toplevel or a basename, sha256, bytes, kind), runner (kind human or agent, harness, harness_version, model, effort), runtime, target, prev, digest."
  runtime: "Captured by record: os id, name and version, kernel release, arch, container and wsl flags, time zone, locale, ruby engine, version and platform, polispec version, edition, commit and dirty flag, install kind, rplugin version, enforce mode. No hostname, user name or absolute path is recorded: in summary, step and evidence text the home directory prefix becomes ~ and the toplevel prefix becomes ."
  events: "record emits polispec.smoke through the events port after the ledger write, carrying the project, the entry id, the spec, the at path and the verdict only. An event failure does not fail the record."
  target: "Captured by record: the git commit, branch and dirty flag of the toplevel, the ledger project id when the toplevel is a governed project, the resolved environment, and the effective policy digest when one resolves."
  chain: "digest is the sha256 of the canonical JSON of the entry without digest; prev is the previous entry's digest, null for the first. record also anchors the head digest and entry count per ledger real path in smoke-heads.json under the state home, and verify reports truncated against it (only where that anchor exists). verify reports schema errors, a broken chain, a digest mismatch, and references that no longer resolve or whose at_digest changed."
  coverage: "polispec smoke coverage [--spec FILE] [--at PATTERN]... expands each pattern against the spec (a trailing * expands the items of a list or the keys of a mapping) and reports, per unit, the latest entry that is not inconclusive and its status: proven (a pass whose at_digest equals the node's current digest), stale (a pass of an older digest), failing, blocked, partial or none. Editing a node makes it stale until a new passing run. Default spec specs/app.yml; default patterns from that file's smoke.coverage_units list, else commands/*."
  frozen: "Since 0.49.0 polispec's own smoke.yml takes no new entries; see proof smoke_ledger."
  coverage_units: [commands/*, code_specs/commands/*, code_specs, composition, catalog, stewardship, deployment_receipts, harness_controls, protected_authorizations, smoke, judgments, delete_guard, fs_walk, description, web, author, manifest, registration, effect, editions, contract, verbose]
  run: "polispec smoke run [--unit PATTERN]... [--scenarios DIR] [--against TREE] [--host-copy] [--live claude-code|codex]... [--out DIR] [--no-record] [--accept-changes] [--strict] [--json] runs every smoke/scenarios/*.yml against the polispec tree it runs from, checks each step's expectations, and records one entry per unit (runner kind suite, worst verdict of its scenarios) unless --no-record. Exit 0 when every scenario passed, was blocked or was inconclusive and, with --against, no diff exists or --accept-changes is given; 1 otherwise; 2 on usage. Since 0.51.1 --strict also exits 1 when a scenario was blocked or inconclusive or no scenario matched, which a proof command uses so that a run that proved nothing is never signed as pass. Since 0.51.2 a live codex session runs with the user's own CODEX_HOME (fixture steps keep the scratch one; --ignore-user-config still drops the user's config), and a live session with no tool call whose output reads as an authentication failure is blocked auth_unavailable, also when a SessionStart hook fired. Output defaults to Dir.tmpdir/polispec-smoke/<timestamp>, never inside the tree. Since 0.47.4, after each scenario's steps (and on the --against pass) the runner sends TERM to the resident judge recorded in the scenario's state home or scratch xdg-state/polispec when /proc/<pid>/cmdline reads judge serve, so a run leaves no judge behind. Since 0.48.0 a run without --out first removes the run directories under <tmpdir>/polispec-smoke that match the run naming pattern and are more than 24 hours old (never the current run, a symlink or a path outside that directory, with lstat and no link followed), and every run ends with run directory: PATH (SIZE); --json carries out_bytes and pruned."
  scenarios: "polispec.smoke-scenario/v1 (schemas/smoke-scenario.v1.yml, validate smoke-scenario): unit, spec, summary, requires (feature flags; off records blocked), fixture (enforce, global none|example|files, projects built by the tree's own apply environment-control with optional status live and checkouts, files), and steps that are a run (argv, cwd, env, stdin, tty, timeout, home), a hook payload (harness, event, tool, input, cwd) or a live session, each with expectations (exit, stdout and stderr substrings, JSON subset, files, git ref unchanged, hook decision and rule). Placeholders are expanded per word; an unknown placeholder is a scenario error."
  isolation: "Every step runs with POLISPEC_LEDGER, POLISPEC_GLOBAL, POLISPEC_HOME, POLISPEC_SMOKE, POLISPEC_SPECS_REPO, POLISPEC_STATE_HOME and, since 0.48.0, POLISPEC_SETTINGS (unless the scenario sets it) in its scratch directory, the enforce mode set explicitly, and a scratch git identity. POLISPEC_STATE_HOME (since 0.23.0, honoured only while unsealed, also by bin/polispec-guard when /etc/polispec/active.json is absent) moves polispec's state home and keeps events in its local log instead of the events port. The runner never writes the host ledger, shelf, settings or polispec state."
  parity: "--against TREE runs every scenario again with TREE's bin/polispec and reports, per step, a changed hook decision or rule, or a changed exit status or stdout after normalising scratch roots, tree roots, digests, commit ids, smoke ids and timestamps. parity: ignore skips a step. Only the candidate's results are recorded."
  host_copy: "--host-copy copies the configured ledger and global shelf into the output directory, replays smoke/host-probes.yml against every ledger project with the host's enforce mode and prints probe, project, decision and rule; with --against it compares. Never recorded."
  live: "--live claude-code|codex runs smoke/live/*.yml in headless sessions (claude -p with claude-haiku-5-5 and a 0.50 USD budget, codex exec with gpt-6-luna; a step's timeout defaults to 300 s and is capped at 600 s) in scratch projects whose hooks run the tree's bin/polispec-guard; expectations come from the hook log, files and git state, never the agent's own account. Live steps run one at a time, at most POLISPEC_SMOKE_LIVE_MAX (default 6) per invocation, with a wall-clock timeout that kills the process group, at most one jittered retry when the harness exits before any hook call, and the polispec.smoke.live and POLISPEC_SMOKE_LIVE kill switches. Recorded with runner kind agent, the harness and its version, and the model. Since 0.48.0 --verbose traces each harness run as a live session step and lists the hook wrapper's child runs from its hook log under hook wrapper runs."
proof:
  summary: "Since 0.49.0 a project that serves real users can require, before promote --to stable, a passing signed smoke record for every feature on every target it declares support for, unless an unexpired proof exception covers that cell. The feature manifest says what the product is made of and where it runs; proofs/ holds the evidence and travels with every tag; the gate builtin features_proven checks the candidate; the operator confirms every manifest change that weakens proof. Proof exceptions are not the exceptions of the exceptions section: they live in the project's manifest, expire, and lift only a features_proven cell."
  manifest: "specs/features.yml, schema polispec.features/v1 (schemas/features.v1.yml): targets, a list of {id, facts} where id matches ^[a-z0-9][a-z0-9.-]*$ and facts is a map of os, arch, ruby, runtime, harness and any other string facts; features, a list of {id (same pattern), summary, paths (globs over repository paths, File.fnmatch with FNM_PATHNAME, FNM_DOTMATCH and FNM_EXTGLOB, so {a,b} braces expand and **/ crosses directories; a glob that is ** or ends in /** is read as **/* or /**/*, so it crosses directories too), shared (globs), spec ({file, at}, optional, the same reference smoke records use), targets (optional, a subset of the target ids; default every target), min_rung (1 to 4, default 2), smoke ({run: argv, rung: 1 to 4, timeout_s default 900, per_target: {<target id>: {run, rung, timeout_s}}})}; shared (globs every feature's digest covers: lockfiles, core libraries); ignore (globs no feature owns: docs, changelogs); trusted_producers, a list of {id, key (one OpenSSH public key line), kind host, peer or ci, note}; exceptions, a list of {feature, targets (default every target of the feature), reason, owner, added (date), expires (date, at most 90 days after added)}. Unknown keys are rejected."
  digest: "The digest of a feature on a target is sha256 over the canonical JSON of {feature entry, target entry, files: the sorted [path, git blob id] pairs of every file at the commit that matches the feature's paths or shared or the manifest's shared, spec: the at_digest of its spec anchor or null}, computed from the commit's tree (git ls-tree), never the working tree. A record proves a cell while its digest equals the current one, so a feature the delta did not touch keeps its proof and one it touched needs a new pass."
  records: "proofs/<feature id>.jsonl, schema polispec.proof/v1 (schemas/proof.v1.yml), one record per line: id (prf_ plus the first 12 hex of the sha256 of the canonical record without id, signature, prev and hash), feature, target, digest, commit, rung, verdict pass, fail or blocked, started_at, finished_at, duration_ms, exit, evidence [{name, sha256, bytes}] (the run's output stays outside the repository, in the run directory or the runner's store), runtime (the smoke runtime capture: os, kernel, arch, ruby, polispec version, edition), producer (id), signature (an SSH signature, ssh-keygen -Y sign with namespace polispec-proof, over the canonical JSON of the record without signature, prev and hash), prev and hash (Chain.link). Only polispec proof run and import append, under a lock in the state home keyed by the file's real path; a broken chain is a finding, records after the break prove nothing, and run and import refuse chain_broken and append nothing to a file whose chain is broken until it is repaired from git."
  producers: "A record counts only when its signature verifies (ssh-keygen -Y verify against an allowed-signers list built from trusted_producers) under the producer id it names. polispec proof keygen creates the host producer key <state home>/proof/producer_ed25519 (0600, in a 0700 directory; POLISPEC_PROOF_KEY names another key path, honoured only while the plane is unsealed, for scratch runs and smoke) on a TTY after the typed phrase create proof key and prints the trusted_producers entry to add; that directory is a protected path of the harness-control ceiling, so a governed write into it and a classified read of anything under it (secrets.read, which file tools and shell readers produce) are denied POLISPEC-CONTROL-PROTECTION. A program the classifier cannot read, such as an interpreter reading the file, is not stopped, and the key is readable by every process of the user, so a host signature proves a process on that host under that user, not polispec proof run; peer and CI producers hold their keys elsewhere. A peer runner or a CI job signs with its own key."
  run: "polispec proof run [FEATURE...] [--target T] [--out FILE] runs, through the proof_runner port, each named feature's smoke command (default: every feature whose current digest has no passing record on this target) for the target whose facts match this host (os id, arch, ruby major.minor, and runtime and harness when the target names them and the host reports them through POLISPEC_PROOF_RUNTIME and POLISPEC_PROOF_HARNESS; no match or two matches refuse with target_unmatched or target_ambiguous unless --target names one, which still refuses target_mismatch on a detectable fact that differs; run takes one --target, a second is a usage error, exit 2). It runs the argv without a shell in the repository root at the working tree's HEAD, refuses dirty_tree when the tree differs from HEAD in a path any selected feature's digest covers, keeps output under Dir.tmpdir/polispec-proof/<run>/ (never in the repository), signs with the host key, appends to proofs/ and emits polispec.proof (project, feature, target, verdict, record id; no output). --out writes the signed records to FILE instead of proofs/, for a CI job or a peer. Exit 0 when every run passed, 1 when any failed or was blocked, 2 on usage."
  import: "polispec proof import FILE... verifies each record's schema and signature against the manifest's trusted_producers at HEAD and that its digest equals the current digest of its cell, then appends it with a fresh prev and hash; a record that fails is refused (signature_invalid, producer_unknown, digest_stale) and nothing from that file is appended."
  status: "polispec proof status [--ref REF] prints every feature and target cell with proven, stale (a pass of an older digest), failing, missing, excepted (with expiry) or not_applicable, then the unmapped changed files since the stable tag; read-only."
  verify: "polispec proof verify [--ref REF] checks the manifest schema, every proofs file's schema, chain and signatures, expired or over-long exceptions and trusted_producers keys that do not parse; exit 1 on any finding; read-only."
  except: "polispec proof except FEATURE [--target T]... --reason --owner --expires DATE adds an exception to specs/features.yml after validating it (expires at most 90 days after today) and writes nothing else; the entry is a weakening change the operator confirms at promote."
  gate: "Builtin features_proven reads specs/features.yml and proofs/ at the candidate commit and the manifest at the stable tag (Gates.stable_tag; none means every tracked file is in the delta). Failures: manifest_missing or manifest_invalid; every feature and target cell without a passing record whose digest is current, whose rung is at least the feature's min_rung, whose signature verifies under a trusted producer and whose chain is intact, and no unexpired exception covering it (unproven_cells, each cell named); and every file changed since the stable tag that matches no feature's paths or shared, the manifest's shared or ignore, proofs/ or the manifest itself (unmapped_files, each path named). mode enforce raises gate_failed with those findings; mode report (the default) passes and carries them in the gate result, the promote output and the polispec.promote event. The lock edition treats report as enforce (editions row proof.report_mode)."
  weakening: "When the to_stable gates hold features_proven with a mode other than off, promote --to stable compares the candidate manifest with the stable tag's (an empty manifest when the tag has none or there is no stable tag, so the first manifest's exceptions, producers and ignore globs are listed) and lists every change that can weaken proof: an added exception or a longer one, an added or changed trusted producer, an added ignore or manifest shared glob removed, a removed target or feature, a feature's targets narrowed, a path or shared glob removed or changed, a smoke run, rung or per_target entry changed, min_rung lowered. When any is listed, after the stable phrase the operator types accept proof changes for <project>; --dry-run prints the list. plan project:<id> classifies the same changes as loosening (and the reverse as tightening), so they need the user's yes there too."
  write_guard: "A Write, Edit or shell redirect into proofs/*.jsonl of a repository holding specs/features.yml classifies as proof.write; the environment-control package's proof module denies it with R-PROOF-WRITE in every environment. polispec proof run and import write it themselves. The limit every classified path has holds: a program the classifier cannot read is an unknown write, which is why records are signed."
  upkeep: "doctor and status report proof_gap (warn) for each live project whose stable policy carries features_proven when, read at the stable tag, a cell has no valid record or an exception has expired, or a trusted producer key no longer parses; nothing is blocked until the next promotion."
  runner: "The proof_runner port (submit, status, fetch) selects its adapter by polispec.proof.runner. The standalone local adapter runs synchronously on this host. An rplugin extension adapter (the rStack rproof daemon, a later release) dispatches to registered peers and returns their signed records, which run appends like an import. POLISPEC_PROOF_RUNNER=off makes every adapter raise unavailable."
  package: "packages/environment-control 1.2.0 adds param proof (off, report or enforce; default off) and the project module specs/polispec/modules/proof.yml (params mode), which every variant policy includes with mode {{proof}}: gate G-PROVEN { builtin: features_proven, mode } on to_stable when mode is not off, and rule R-PROOF-WRITE (class proof.write, deny). An existing project gets it by upgrading the package. A runtime older than 0.49.0 rejects the module (class proof.write) with policy_invalid even when proof is off, so a project upgrades to 1.2.0 only after 0.49.0 is pinned on every host that judges or promotes it; the smoke parity run against 0.48.1 shows every package-built fixture failing that way on the old runtime."
  smoke_ledger: "A repository with specs/features.yml stops writing smoke.yml: smoke record refuses ledger_frozen and smoke run records nothing and says proofs replace it; smoke coverage reports the proof cells instead. Without specs/features.yml the smoke ledger works as before. polispec's own smoke.yml is frozen history since 0.49.0 and its coverage units are features in its specs/features.yml. Since 0.50.1 every polispec feature runs a scenario whose unit is its own spec node, and the manifest names five targets: linux-x86-64-ruby3.3, linux-x86-64-ruby4.0 and macos-arm64 for every feature, and claude-code and codex (facts harness only, chosen with --target) for the three features with live scenarios (commands/hook pretool|session, code_specs/commands/code-hook pre|post|stop|session and harness_controls), whose per_target run is smoke run --live <harness> at rung 3."
  seal: "seal leaves proofs/ out of the runtime manifest, as it does smoke.yml."
  limits: "A signature proves which producer ran the manifest's smoke command at that digest, not that the command tests anything; that is why every weakening change needs the operator. Rung is declared by the manifest, not measured. polispec holds key material only for proofs."
judgments:
  summary: "Every call the guard judges leaves one chained record, polispec.judgment/v1, in judgments.jsonl under the polispec state home: what was judged, against which rulebook, by which polispec, and what the harness was told. It replaces verdicts.jsonl (deny and warn only, 300 bytes of command text, no policy or runtime identity) and the opt-in journal. Allows are recorded."
  schema: { id: polispec.judgment/v1, file: schemas/judgment.v1.yml }
  record: "id (jdg_ plus the first 12 hex of the digest), ts, action (tool, harness, event, session_id, agent_type, home-relative cwd, call_digest: sha256 of the canonical JSON of tool, arguments and cwd, and raw only while polispec.records.raw is on), targets (one per governed project or global baseline the call touched: project, env, policy_source, policy_digest, verdict, rule_id, rows with action_class, env, ref, home-relative path, crosses, destructive, shape, verdict and rule_id), control (control_digest, edition, verdict, ask ids; null when the control ceiling did not run), engine (polispec version, runtime kind, commit, tree_digest when pinned, edition, enforce mode, plane status and generation, fastpath key or null), outcome (verdict, rule_id, enforced, allow_once_id, rendered allow|ask|deny|context|none, governed, error class for a fail-closed denial, duration_ms), exceptions (since 0.29.0, only when non-empty: the aex_ ids of the exceptions that lifted an ask or warn for this call), relaxed (since 0.30.0, only when non-empty: one {rule POLISPEC-TOOL-UNKNOWN, reason development, projects [ids]} for a call whose opaque eval, source or . line was not asked about because its project is in development), prev, digest."
  one_per_call: "One record per hook call, written synchronously after the environment outcomes and the control ceiling compose and before the reply is written, so the record carries the verdict the harness received. A fail-closed internal denial records verdict deny, rule POLISPEC-INTERNAL and the error class, best effort. Git hooks record with harness git. The session hook records no judgment; since 0.35.0 it writes a session record (see effect)."
  chain: "digest is the sha256 of the canonical JSON of the record without digest; prev is the previous record's digest, across rotations, null for the first record ever. Appends hold an exclusive lock on judgments.lock; judgments.head.json beside the stream holds the head digest, the record count and the current file name and is the truncation anchor. When judgments.jsonl exceeds 16 MiB the append renames it to judgments.<utc timestamp>.jsonl and the chain continues in a new file. Since 0.30.1 an append that finds the stream ahead of the anchor, because a hook process was killed after writing a record and before moving judgments.head.json, chains to the last record and counts the records the anchor missed, when those records chain unbroken from the anchored digest within the last 256 KiB of the stream; an anchor the stream does not chain from (a truncated stream, a foreign head) is not adopted. Since capture_repair judgment_integrity the append then refuses (judgment head diverges from journal tail), as it does for an unreadable tail or an incomplete write, and the call is recorded only as a judgment_unrecorded finding; the verdict is unchanged. Before 0.30.1 the next append chained to the stale anchored digest, which forked the chain and left the anchored count short for good. verify reports that historical fork signature (a record whose prev equals the prev of the record before it) as an interrupted_append, outside findings, and subtracts those records from the count it expects of the anchor. An anchor that is still one append behind when verify runs is reported as truncated until the next append re-anchors it. Since 0.52.0 a stream that ends mid-record (a hook killed during its syswrite) no longer refuses every later append: the head anchor, which the cut-off write never advanced, is the chain head, the next append starts on a new line, and verify reports the fragment as torn_tail or torn_record among the interrupted entries, outside findings; a line that holds a cut-off fragment followed by a whole record is read from the record's own start. Every refused append also writes <state home>/judgments.stalled.json (count, first_at, last_at, error), which the next successful append removes."
  port: "After the local append the same record without raw goes through the events port as polispec.judgment. The port receives a copy; it never replaces the local record. polispec.verdict is no longer emitted."
  skips: "bin/polispec-guard appends one line to skips.jsonl under the same state home for every call its fast path skips, with bash builtins only (no fork): ts, tool, session, the fast-path key and the reason, no_needles or no_match. The Ruby side rotates skips.jsonl at 16 MiB when it next runs. Skips are counted, never chained, because the shim cannot hash without a fork. Since 0.33.2 the shim also appends one line per fail-closed decision it makes on its own to launcher.jsonl (install guard_binary row); those calls reach no judgment record. Since 0.38.0 launcher.jsonl also holds a pass row for every call the resident judge did not answer (cause judge_<reason>), which then reaches the cold path and its own judgment record."
  readers: "polispec judgments list|show|verify|acknowledge (commands); doctor reports judgments_chain_broken, judgments_truncated and judgments_unreadable, nothing for an interrupted_append, and since 0.52.0 judgments_stalled (blocking, from the stalled marker), judgments_interrupted (info, the count of torn fragments) and judgments_acknowledged (info, a finding the operator acknowledged); a record recovered from a line that starts with a torn fragment is counted as unanchored, so the anchor count is compared against the records that advanced it; digest reads warn and deny judgments; plan replays the rows of the last 14 days. verify counts the skip lines per fast-path key beside the chain result."
  privacy: "A default record holds no command text, file contents or environment values: the call digest, home-relative paths and refs, identities and digests only. polispec.records.raw on adds the classifier's raw view, bounded to 2048 bytes, to the local record only."
  failure: "Recording never changes a verdict: the append is rescued, and a failed append emits a polispec.finding of kind judgment_unrecorded. doctor already reports state_unwritable."
  limits: "No hook payload carries the harness version, so a record has none (smoke entries do). A clone runtime records its HEAD commit, not a tree digest. Skip lines are not chained. The record proves what polispec judged, not that the harness obeyed the reply."
  epoch: "Since 0.35.0 a record carries epoch (see effect) beside engine, and exception_rows ({row, entry}, only when non-empty) names the aex_ id per lifted row beside the existing per-call exceptions list, which keeps its shape for every reader. Records before 0.35.0 carry neither; verify and the 0.30.1 heal accept both shapes, because the digest covers the record as written."
description:
  summary: "Since 0.35.0 every rulebook (policy, module, package, environments, global, roster, spec, and each ledger entry) may carry description beside summary. summary stays one line for listings; description is the prose a person reads on a card: what the rulebook governs, for whom, and what it refuses."
  lint: "Polispec::Description.lint(doc, kind) is deterministic and makes no model call. A description passes when it has 2 to 8 sentences and 20 to 400 words, does not repeat the summary or the name, names at least one thing the rulebook governs taken from its own content (an action class, environment, path, tool, module or gate it declares), and states at least one rule's effect in words (allow, ask, warn, deny, refuse, promote, freeze or an equivalent from Description::EFFECT_WORDS). Each failure is a finding with a code (too_short, too_long, restates_summary, names_nothing, states_no_effect) and the offending span."
  judge: "polispec validate --semantic additionally asks the decide port whether the description matches the composed rules (options matches, partial, contradicts, with criteria). It is advisory, never run by the guard, and skipped with a note when the port is unavailable."
  ratchet: "Missing or failing descriptions are warnings (description_missing, description_invalid) from validate, doctor and the web app; polispec.description.strict on makes validate fail them. Promote is not gated by it."
  rollout: "Every schema rejects unknown keys, so a policy that uses description at its trust ref is invalid to a runtime older than 0.35.0, and the guard would judge that project by fallback_rules. Descriptions are therefore written into live rulebooks only after 0.35.0 is pinned on every host that reads them. doctor reports description_ahead_of_runtime when a trust ref uses description and the installed release is older than 0.35.0, and the web app and author refuse to add one in that case."
contract:
  summary: "Since 0.43.0 polispec carries one generic noun, the behavior contract (kind contract, schema polispec.contract/v1), and one verb, polispec contract. A contract is a versioned document per agent behavior. It binds an intent, an optional directive an agent reads, the deterministic guards that enforce it and where each runs, the exact user-facing messages with a truth condition per clause, the constraints it protects, positive and negative probes, its owner, approvals bound to its digest, and a rollback target. It renders into the project's own surfaces, and drift between those surfaces is detected. polispec ships the kind, the verb, the docs and a neutral demo fixture; project vocabulary enters only through a project-owned vocabulary file."
  kind: "polispec.contract/v1 (schemas/contract.v1.yml, validate contract) lives at specs/polispec/contracts/*.yml. Required keys: schema, id, version (semver), lifecycle (draft, advise, enforce, retired), intent, scope, trigger, precedence, behavior {path, optional sha256 that pins the whole file} naming a polispec.behavior/v2 document, guards (at least one), probes (positive and negative, each at least one), owner and change. Optional: directive, messages, constraints, annotations, external_tests, trace_refs, effective_at and rollback. Every schema rejects unknown keys."
  vocabulary: "polispec.contract-vocabulary/v1 (schemas/contract-vocabulary.v1.yml, validate contract-vocabulary), at specs/polispec/contracts/vocabulary.yml and owned by the project: locations, annotations {KEY: {type, values, required}}, facts {NAME: {type, values}} and approvals {roles, required_roles}. contract check validates guard locations, annotations, and every fact named in shown_when and probes against it; without the file locations and annotations are free and check notes vocabulary_absent once."
  digest: "sha256: over the canonical JSON of {contract: the document without behavior.sha256, referenced: {directive: the directive row with its body sha256, or null, rules: the referenced rule objects, messages: the referenced message and clause text objects}}. An edit to a part of the behavior document the contract does not reference leaves the digest unchanged. It is computed and never stored."
  predicates: "shown_when and probe facts use one expression language: {fact, equals}, {fact, in}, {fact, present}, {all: [...]} and {any: [...]}. A missing fact is false for equals and in and absent for present. There is no eval and no regular expression."
  probes: "A probe whose guards are all declarative rules is evaluated by polispec (Behavior.decisions) and its clauses by the predicate evaluator. Every other probe goes to the project command given by --runner CMD, which is split into words (no shell), run once per check with the project root as its working directory, sent one JSON line per probe ({contract, version, id, event, facts, guards [{rule, location, binding}]}) and must print one JSON line per probe ({id, verdict, message_id, clauses}); a 30 second total timeout (which kills the runner's process group), a nonzero exit or a malformed line fails the affected probes with contract_probe_failed. A runner without a guard for a probe answers {id, verdict: unrun, reason}. A probe that neither path evaluates, or that the runner answers unrun, is contract_probe_unrun, a warning in draft and advise and an error in enforce. A sentence message joins its shown clause texts with one space in declared order; a list message prefixes each with a dash and joins with a newline."
  findings: "contract_schema, contract_ref_missing, contract_vocabulary, contract_probe_failed, contract_probe_unrun, contract_conflict, contract_unapproved, contract_untested, contract_version_unchanged (diff only), contract_advisory_on_harness (info), vocabulary_absent (info) and behavior_surface_drift (reused from the behavior surfaces). check exits 0 without an error-level finding, 1 otherwise, 2 for a usage error."
  conflicts: "Two advise or enforce contracts conflict when their scopes overlap, their triggers can both match one event, a guard on each names the same location with a different decision, and neither precedes the other by rank (lower outranks higher) or outranks. check reports contract_conflict with both ids and never picks a winner."
  approvals: "specs/polispec/contracts/approvals.jsonl holds one JSON object per line, {contract, version, digest, actor, role, at, prev, hash}, hash-chained, written only by polispec contract approve and recorded as a contract_approval change. A contract in lifecycle enforce needs an approval whose digest equals its current digest from every role in vocabulary approvals.required_roles. approve refuses while check reports an error other than contract_unapproved and behavior_surface_drift, and classifies policy.edit so a live project warns. A change that only appends approval lines plans as neutral. polispec ships no key infrastructure; a project that serves contracts signs the exported bundle with its own keys."
  surfaces: "Behavior v2 surfaces gain two kinds. policy_json renders the compiled contract bundle (polispec.contract.compiled/v1) of the contracts under specs/polispec/contracts that reference the listed refs, as canonical JSON. locale renders a YAML mapping of message id to text for one locale (the surface locale key, default en-US) limited to the listed refs. Both are wholly generated, are drift-checked like every surface, and need no template. contract render prints or writes the surfaces whose refs name the contract's directive, messages or clause texts."
  diff: "contract diff FILE|DIR --from REF compares against the version committed at REF and classifies tightening, loosening, mixed or neutral with one reason per item. Tightening: a guard added, a decision made stricter (deny, block, reroute, report, instruct in that order), a negative probe added, a clause shown_when narrowed, lifecycle raised. Loosening: the reverse, a probe removed, lifecycle lowered or retired. A changed guard, referenced rule or directive with an unchanged version is contract_version_unchanged; a changed guard or directive with no probe change is contract_untested."
  export: "contract export DIR [--out FILE] writes polispec.contract.compiled/v1 {contracts: [{id, version, lifecycle, digest, document, behavior_digest, approvals}], digest} for the advise and enforce contracts, for a project to sign and serve."
  plan: "plan project:<id> shows each contract change with the diff classification; a contract whose document or referenced behavior changed with no probe change is loosening; an unreadable contract file is loosening. lint validates contract and contract-vocabulary documents by schema id and reports surface drift of contract surfaces; doctor reports contract_ahead_of_runtime."
  rollout: "Every schema rejects unknown keys and every runtime before 0.43.0 has no contract kind. A runtime older than 0.43.0 linting a project with polispec.contract/v1 files reports them as unknown, and a behavior v2 document using the policy_json or locale surface kinds is invalid to it. As with description, a project adds contract files and the new surface kinds only after 0.43.0 is pinned on every host that builds or lints them; doctor reports contract_ahead_of_runtime when a project's working tree or trust ref holds a contract file and the installed release is older. The guard itself never reads contract files, so no verdict changes on any host."
  limits: "polispec does no signing, no key management and no web surface for contracts. Native guards are judged only through a project runner. A contract describes behavior; it never grants authority."
web:
  summary: "Since 0.35.0 polispec web serves a local web app over the files polispec already keeps. It has no database: every fact is read through the same library the CLI uses, every change is a plan applied through the same apply path, browser storage caches views, and web/state/*.yml under the polispec state home keeps local metadata (layout positions, pinned cards, saved playground calls)."
  stack: "Roda on Rack 3, served by WEBrick, all pure Ruby and vendored with their licenses under vendor/ (roda, rack, rackup and webrick at exact versions in vendor/VERSIONS.yml). Only lib/polispec/web loads them; polispec core keeps no runtime dependency and runs on Ruby >= 2.6. The UI is static ES modules and Web Components under web/public with vendored CodeMirror 6 (YAML mode) and hand-written SVG, no build step and no network fetch at runtime. A JSON API under /api/v1 is described by web/public/openapi.yml."
  binding: "Listens on polispec.web.bind (127.0.0.1) and polispec.web.port (7421). A non-loopback bind needs --expose on a TTY and the phrase expose polispec web."
  public_origin: "An optional polispec.web.public_origin must be one HTTPS origin without credentials, a path, query, or fragment. It is recorded at server startup, used for initial and fresh links, admitted as an exact Host authority, and required as the Origin for mutations when configured. Both login and logout cookies carry Secure. The loopback Host remains available for probes; forwarded headers never establish trust. An external proxy owns HTTPS and network exposure; the plugin has no rStack or Tailscale dependency."
  session: "At start the server writes a 32-byte launch secret to <state home>/web/launch.secret (0600, a protected path: reads classify secrets.read and writes policy.edit), prints http://127.0.0.1:<port>/#k=<one-time code> to the terminal, and --open hands it to the browser. The launch secret is created once with O_EXCL and kept across restarts; a code is valid for 120 s. The browser exchanges the code once for an HttpOnly SameSite=Strict session cookie; the code then expires. Sessions idle out after 12 hours and at most 64 are kept, the least recently seen dropped first. Every mutating route requires that cookie, an X-Polispec-CSRF header equal to the per-session token and an Origin of the server itself, and is rate limited to 30 a minute."
  guard: "polispec web run by an agent classifies policy.edit, so a live policy warns and the harness asks the user; web.fetch and a curl, wget, http, https or xh line whose URL names the configured web port on a loopback address with a mutating method, or a path /api/v1/plans/<id>/apply or one under /api/v1/exceptions/, /api/v1/author, /api/v1/state, /api/v1/register or /api/v1/session, classify policy.edit too, through the classifier family web_local, and carry the shape web_local. The rule G-WEB-AGENT, the catalog subspec tools/web-agent (inactive until the operator activates it, overridable), warns on them."
  writes: "Every edit becomes a polispec plan rendered with its files, ledger effect, composed policy diff, probes that change, journal replay, effect classes and classification. A tightening or neutral plan that is not global applies on one click. A loosening, mixed or global plan, a status flip, a move and a ledger change apply only after the person types the plan id. Operator-only actions (promote to stable, deploy stable, pause, allow-once, seal, plane) are shown as the exact command to run in a terminal and never as a button. Exception add, promote and remove relay the typed phrase through the delegate runner (delegation, exceptions verbs). The web app never writes a stable branch, a production checkout or a secret."
  limits: "Like delegation, the session is the unsealed terminal confirmation made reachable from a browser, not operator authentication: whoever holds the session cookie and types the plan id can apply. A program the classifier cannot read can reach the port, the known limit of every classified path."
  edition: "Excluded from lock (specs/editions.yml web): polispec web refuses to start with edition_excluded."
  repin: "Since 0.48.0 server.json records version and root, and every 30 s the server re-resolves the launcher it was started through (its process name with every link resolved, else Polispec::ROOT); when the release root or its VERSION differs from the one it started in, it logs, emits polispec.web release_changed, shuts down and exits 75 so a supervisor that restarts on failure starts the new release. doctor reports web_stale (warn) when the recorded running server's version is older than the installed release or absent."
  views:
    manifest: "Per app: the generated manifest beside the authored polispec.app.yml, and the host-wide index."
    map: "A tree of every ledger project, path entry and worktree glob, with the catalog layer (the shipped layer through 0.44.1), the global shelf and the exceptions file drawn above them and an edge from each layer and module instance to every project it reaches. Cards show name, summary, description, digest, status and verdict counts; hovering a card highlights every project and edge it is embedded in. Global effects are drawn as the band of rules a project inherits from above. A catalog or shelf chip opens that module's detail; since 0.47.5 an exception chip, on the map and in the list, opens that exception in the exceptions view (before, it asked for the detail of a module named after the exception id and got not_found)."
    detail: "One rulebook's composition: the layer chain from shipped to child, each module instance with its resolved parameters, each rule with its verdict colored and its overrides, the gates and freezes, and the winning rule per environment for a chosen action. The route is detail/<kind>/<id>; the command palette opens detail/<kind>/<id> for every map entry since 0.47.5 (before, detail/<id>, which read the id as the kind and answered not_found), and detail with no kind shows a pick-an-entry state without a request."
    manager: "Edit any rulebook in a YAML editor validated as you type against its schema and the description lint; compose by adding and parameterizing modules; move (relocate a module or rule across project-local, shelf and project scopes as one paired plan, and reorder or regroup rules within a layer); deploy (apply project:<id> on main, then the promote command for test); set global policy (plan global)."
    playground: "Type a tool call or shell line, or pick a recorded judgment, and see the verdict in every environment of every project with the full rule trace from explain; read-only."
    blast_radius: "While a draft is open, the last 14 days of judgment rows are replayed against it and the counts that would flip are shown per project; flipped edges pulse on the map."
    pipeline: "Per project: main, test and stable refs with policy digests, unpromoted policy, package drift, doctor findings, freezes and gate status, with the promote command for test and operator commands for stable as text."
    history: "A scrubber over a rulebook's git history and release tags; two refs give a semantic diff of rules, gates, freezes and modules, each classified tighten or loosen."
    heatmap: "Rule hit counts per project and environment from the judgment stream, rules that never fired in the window, and NO-RULE hot spots; a hot spot opens a draft rule in the manager."
    badges: "An SVG badge and an embeddable card per app from its manifest, also written by polispec manifest --write."
    explainer: "Paste a deny or warn text or a judgment id to see the rule, its layer, its description and the legitimate way forward, with a draft exception or allow-once request for the operator. The rule is looked up in the judgment's project chain (every live project's chain for pasted text), then global.yml and the catalog files, then, since 0.47.5, the shelf chain (the global layer's modules and every path layer); before, a judgment whose target was global or a path entry could not find a rule that lives in a shelf module, so the feed's Explain link reported no rule found."
    gallery: "Packages, shelf modules and example policies as cards; fill parameters in a form, preview the composition on the map, then plan and apply."
    sessions: "Every session seen in the active window: harness, start, last call, runtime version, policy digest per project and epoch, with badges current, pending, reload needed (with /reload-plugins), stale briefing (injected text older than the epoch) and untrusted hook (Codex). A project is in step when the digest its last judgment recorded equals its current composed digest; since 0.47.5 the global and path targets compare against Layers.fingerprint, the digest their judgments record, instead of counting as never in step."
    timeline: "Change records as events with their effect classes and, per change, how many active sessions have crossed over. timeline?change=<id> opens that change's drawer (the plan sheet's Open timeline link) since 0.47.5. Since 0.47.5 GET /changes computes each session's badges once per request; before, it re-read changes.jsonl for every change and session, and a 30-day window on a host with about 1,600 session records took about 9 s instead of about 1 s."
    exception_detail: "Per exception: scope, command glob, who added it, first and last use, hit count, sessions that used it; and the proposals inbox, whose promote relays the phrase through the delegate runner."
    plan_banner: "Before every apply: the effect classes of the plan and how many active sessions it reaches on the next call, at a new session, after /reload-plugins or after a trust review."
    feed: "Live judgments filtered by session, project or rule, streamed with server-sent events from the judgment stream."
  themes:
    switcher: "One switcher: a click cycles system, light, dark, apple-noir, apple-austere and tronwave; a long press, right-click or Shift+Enter opens a list of all six."
    default: system
    fleet_exception: "The application suite polispec grew up in defaults to tronwave; polispec is public FOSS, so its first-visit default is system (the neutral light or dark pair following the OS, ink-blue accent #2456c9 light, #7fa3ff dark). Decided 2026-10-20."
    canonical: { source: "the rStack canonical theme files apple-noir.yml, apple-austere.yml and tronwave.yml, outside this repository; the web app carries its own rendering of them", themes: [apple-noir, apple-austere, tronwave] }
    review: "Every surface is designed and reviewed in all six themes, as specified in design notes that are kept outside this repository."
  observability: "Starts, stops, applies and author sessions emit polispec.web through the events port; failures emit polispec.finding."
author:
  summary: "Since 0.35.0 a polispec-owned port, author, drafts rulebooks and descriptions: draft(kind:, intent:, context:, session: nil) returns {yaml, rationale, adapter, session}, and the draft result adds the validation findings and the plan. Every draft is validated and planned before a person sees it; nothing is applied by the port. The context's shelf_modules, which the system prompt offers as includable modules, are the configured shelf's modules (Author.shelf_modules, the modules/ of the shelf's directory or repository ref) for polispec author draft and the web author route since 0.47.5; before, both listed the release's modules/, which held only shipped modules a shelf could not include and is empty since 0.45.0."
  standalone: "harness-cli, built in: a persistent Claude Code session over stream-json (claude -p --input-format stream-json --output-format stream-json --verbose --include-partial-messages --replay-user-messages --permission-prompts host --session-id UUID, resumed with --resume; no fork is used, and the session gets an empty MCP config with --strict-mcp-config), one per editor tab, after an external shell-out control design implemented inside polispec. The harness, model and effort come from the project roster role spec-author (default claude, sonnet, medium). The session has only the Read, Grep and Glob tools (--tools Read,Grep,Glob) and runs in permission mode manual with one --allowedTools Read(//<root>) and Read(//<root>/**) rule per allowed root (ROOT/schemas, ROOT/catalog, ROOT/examples, the target project's repo and the shelf directory), so Claude Code itself accepts reads inside the roots by rule and rejects every other read, since a headless session has nobody to answer the prompt (observed on Claude Code 2.1.304: the auto mode a host may default to accepts reads anywhere, and path rules alone do not restrict it). Any can_use_tool request that does arrive is answered by polispec with the same root check, a second line. The child gets no POLISPEC_* variable but POLISPEC_ACTOR, and every rulebook draft must carry a description that passes the lint. The session runs in a scratch directory under the state home; it is a governed Claude Code session, so the guard judges it too. Codex (codex exec --json per turn, resumed) is a second harness of the same adapter."
  bounds: "One process per tab, at most 3 open; idle sessions close after 15 minutes; a turn times out after 180 s; at most 2 jittered retries when the process exits before its first event; a per-host token bucket of 10 turns a minute; polispec.author.enabled off or POLISPEC_AUTHOR=off is the kill switch."
  extensions: "rllm through rplugin's rstack extension (extensions/rstack/lib/author.rb, RLLM_URL, rate limited and retried like decide); a token-API adapter later as another extension."
  edition: "Excluded from lock."
manifest:
  generated: "polispec.manifest/v1, read-only, produced by Polispec::Manifest.for(project): id, kind (project or path), owner, description, status, environments with their refs and policy digests, the layer chain with module instances and packages, roster roles, edition, enforce mode, last promotion per environment, doctor findings by severity, badge URL. Served at /api/v1/manifest/<id>; polispec manifest --write commits polispec.manifest.json and .polispec/badge.svg on main as a plain commit of those two paths."
  authored: "polispec.app.yml (polispec.app/v1) at the app's root, written by the app: name, description, serves (who it serves), owners, wants (packages and shelf modules with parameters), contact. Validated by validate app, shown beside the generated manifest, and an input to the gallery's suggested plan; it grants nothing and is never read by the guard."
  index: "polispec.index/v1: the current user's ledger projects and path entries with owner and description. polispec manifest index --publish (TTY) writes it to /var/lib/polispec/index/<user>.json when that directory exists and is writable, with no paths outside the user's home redacted to ~ and no secrets; the web app shows the published indexes of other users read-only."
registration:
  summary: "Since 0.35.0 polispec register <path> governs software, a directory or the user's system scope that is not a git repository with branches. It adds a governed path entry to the ledger (paths: [{id, kind software|directory|system, path, status onboarding|live|retired, owner {uid, name}, registered_by, description, policy}]) through plan ledger and apply ledger; an onboarding entry tightens and applies directly, a status flip needs the person's yes."
  policy: "A path entry has no trust ref and no environments. It is judged by the catalog layer, the global shelf, and its own optional policy at paths/<id>.yml on the shelf, committed through plan global; a path inside a ledgered repo is owned by that repo, and register refuses it."
  system: "kind system registers the user's own scope (the home directory) for global rules; host-wide rules for every user stay with the sealed plane and the operator."
  owner: "Every ledger project and path entry carries owner and registered_by from 0.35.0; entries written earlier are shown with owner unknown."
  skill: "skills/polispec-register/SKILL.md interviews the person (what the software is, who it serves, what must never happen to it), proposes kind, id, description and a starter policy, and runs polispec register --dry-run, then the apply."
  edition: "Restricted under lock: only through the protected ledger the sealed plane names."
effect:
  summary: "Since 0.35.0 polispec makes visible when a change reaches running sessions (docs/effect.md). The guard already follows every policy change on the next call; the epoch, change records and session records show which sessions have crossed over and what still needs a new session, a reload or a trust review."
  epoch: "Polispec::Effect.epoch, ep_ plus 16 hex: sha256 over the runtime tree digest (or clone commit), the ledger digest, Layers.fingerprint (catalog layer, global shelf, exceptions.yml), the shelf's own source material, each live project's id, trust ref, the commit that ref names and its policy and roster paths, control_digest, plane status and generation, edition, enforce mode and the relax and exceptions settings. It changes only when one of them changes; engine.fastpath_key is not used because it differs per call."
  changes: "polispec.change/v1 in changes.jsonl, chained like judgments (prev, digest, head anchor): id chg_, ts, kind (Changes::KINDS: promote, apply, exceptions.add, exceptions.promote, exceptions.remove, settings.set, pin, install, register, manifest, uninstall and restore since 0.41.0, and contract_approval since 0.43.0), actor, subject (plan id, entry id or tag), epoch_before, epoch_after, effects [{class next_call|new_session|reload|trust, scope}]. Written by the command after it succeeds; plan prints the effect classes before apply."
  effect_classes: "next_call: policy, ledger, global shelf, exceptions, settings, runtime pin and controls written to watched settings files. new_session: the SessionStart and SubagentStart text. reload: hooks.json wiring and the launcher (Claude Code /reload-plugins). trust: a changed Codex non-managed hook awaiting review."
  sessions: "polispec.session/v1 in sessions.jsonl: session_id, harness, event (SessionStart or SubagentStart), agent_type, epoch, sha256 of the injected text, launcher (Claude Code: the version in CLAUDE_PLUGIN_ROOT; Codex: the bridge or PLUGIN_ROOT path), ts. The launcher version is the last path component that is a version and null when the path has none: an rplugin root such as ~/.rplugins/polispec is a link every hook call follows to the release pinned at that moment, so a session there has no fixed launcher version, the sessions view shows no runtime, and neither the reload-needed badge nor doctor's launcher_stale fires for it. The session hook writes it; judgments stay one per PreToolUse call."
  await: "polispec changes await <id>: a session active in the window (default 1h) is crossed when it has a judgment at or after epoch_after, pending when it has made no call since, and flagged reload or trust when its launcher or harness needs one; exits 0 when every active session crossed, 1 on timeout with the list."
  notice: "On the first PreToolUse of a session after its epoch changes, the hook adds one bounded line (at most 300 characters) naming the change through additionalContext, once per session per epoch, keyed in <state home>/notices/<session_id> rather than on the transcript; polispec.notice off disables it."
  doctor: "doctor reports launcher_stale (a session's launcher older than the installed release) and codex_hook_untrusted once the Codex wiring on the host is located. Since 0.52.0 it also reports harness_coverage: the harnesses installed for the user (~/.claude, ~/.codex, ~/.hermes, ~/.gemini/config) against the harnesses the judgment stream saw in the last 14 days, warn when one sent nothing and info when all did, with the Codex trust findings, the Hermes config.yaml and shell-hooks-allowlist.json and the Antigravity hooks.json as the stated reason (since 0.52.2 the Hermes reason sends the user to the first-use consent prompt of an interactive hermes session, because hermes hooks has no approve verb); trust_ref_stale (warn) when a ledger project's local trust ref differs from origin's (behind, ahead or diverged, with the operator's fast-forward command), because the guard reads the local branch; and its text output folds info findings into one count line unless --all is given."
  open: "docs/effect.md records the Claude Code and Codex probes and the bridge path on the release host, which is not shipped. The Codex reload probe emptied config.toml accidentally, so replacement by another valid definition mid-session remains unverified; matcher and type participation in trusted_hash were not measured. Native Codex hook adoption remains an operator decision."
editions:
  registry: specs/editions.yml
  summary: "Since 0.35.0 specs/editions.yml (polispec.editions/v1) lists every feature whose behavior differs between standard (main) and lock (polispec-lock), with included, restricted or excluded per edition, the release that added it, the code that gates it and a note."
  code: "Polispec::Editions.allowed?(id, edition), .included?(id, edition) and .value(id, edition) read the shipped registry; every edition branch calls them, and no other file compares an edition to the string lock. A registry that does not load or validate is reported as registry_invalid."
  check: "polispec editions --check and doctor (editions_drift) report a gate id with no row, a row whose code path is missing, and a raw lock comparison outside lib/polispec/editions.rb. The smoke suite runs its lock-mode scenarios against the release before the refactor and must show no changed verdict."

guided_learner_catalog:
  package: packages/guided-learner/package.yml
  canonical_source: packages/guided-learner/behavior.yml
  policy_ids: [GL-CODE, GL-NOTERM, GL-DETAIL, GL-SCOPE, GL-PLAIN, GL-OPEN]
  export: polispec behavior export-package NAME
  installation: Files-only plan and apply; no environment, ledger, or global enforcement change
  runtime: Consuming applications own adapters and can bundle compiled policy without a Polispec runtime
  guarantee: Policy data and explicit detectors are not proof of native or semantic enforcement
  wiring: No new service, external API, state store, or rStack dependency
