schema_version: 1
name: polispec
version: 0.30.0
kind: plugin
purpose: "Spec-based policy guardrails for agentic development and operations. Every live project carries a versioned policy and, beside it, an environment manifest (main, test, stable), both read from the trust ref; the policy declares what agents may do in each environment, how code is promoted, what data and secrets each environment may hold, when it is frozen, and which harness, model and effort each agent role gets."
ports:
  required: [state, events]
  optional: [schedule, notify, registry, decide]
setting:
  _resolution: "Since 0.27.0, unsealed: RPLUGIN_POLISPEC_<KEY> env, then the short POLISPEC_<KEY> env (polispec.operator is POLISPEC_OPERATOR_NAME, polispec.edition has none), then the rplugin settings snapshot, then the native settings file (POLISPEC_SETTINGS, else $XDG_CONFIG_HOME/polispec/settings.yml), then the default. Sealed: the plane only."
  polispec.enforce: "advise logs every verdict and never blocks; enforce applies allow, warn and deny. Default advise."
  polispec.ledger: "Path of the host's ledger of governed projects. POLISPEC_LEDGER overrides it only while unsealed; sealed authority selects the protected ledger. Default ~/.config/polispec/ledger.yml (under XDG_CONFIG_HOME when set)."
  polispec.operator: "How deny and next-step messages name the person who promotes to stable and redeems allow-once. Default: the operator."
  polispec.code.specs_repo: "Path of the code specs repository. POLISPEC_SPECS_REPO overrides it only while unsealed. Default ~/polispec-specs."
  polispec.edition: "Requested edition standard or lock; default standard. EDITION lock cannot be downgraded through a mutable setting. Certification requires observed enforcement evidence."
  polispec.root_guard: "Initially false; a distinct follow-up exposure record can arm it. Lock refusal on root-equivalent or unknown exposure forces the guard."
  polispec.records.raw: "off or on; default off. on adds the classifier's raw view of the judged command or target (at most 2048 bytes) to each judgment record in local state; off keeps only the call digest. Raw text never goes through the events port."
  polispec.relax.dev: "on or off; default on. Kill switch for the development relaxation: off (or POLISPEC_RELAX_DEV=off) makes a governed eval, source or . line ask POLISPEC-TOOL-UNKNOWN in every project, as in 0.29.0."
  polispec.exceptions: "on or off; default on. Kill switch for persistent exceptions: off (or POLISPEC_EXCEPTIONS=off) honors no entry of exceptions.yml, records no proposal and appends no promote hint, so asks and warns read as in 0.28.3. polispec exceptions list still works."
  polispec.smoke.path: "Path of the smoke ledger. POLISPEC_SMOKE overrides it. Default smoke.yml at the git toplevel of the working directory."
  polispec.smoke.live: "on or off; default on. Kill switch for polispec smoke run --live: off (or POLISPEC_SMOKE_LIVE=off) records every live step blocked live_disabled without launching a harness."
harnesses:
  claude-code: "supported: rplugin, the Claude Code plugin marketplace (SteveBenner/polispec), or polispec install --harness claude wires the guard hook; see docs/operator.md"
  codex: "supported: the Codex plugin marketplace (SteveBenner/polispec), polispec install --harness codex, or a host bridge wires the guard hook; see docs/operator.md; warn becomes deny with an allow-once id"
install:
  paths: "Since 0.27.0 polispec installs without rplugin: install.sh (fetch the newest or POLISPEC_REF tag, polispec pin, polispec install for each detected harness), a clone with bin/polispec pin and polispec install, the Claude Code and Codex plugin marketplaces, a gem built from polispec.gemspec (not published), or rplugin install polispec. rplugin hosts behave as before."
  guard_binary: "bin/polispec-guard runs the first usable polispec among POLISPEC_BIN, PATH, ~/.local/bin, the rplugin store, <data home>/current/bin/polispec, and last the polispec beside the shim; every candidate except the last must live outside the shim's directory, so a pinned release wins over a harness's cached copy."
  data_home: "POLISPEC_DATA_HOME, else $XDG_DATA_HOME/polispec, else ~/.local/share/polispec: releases/<commit>/ (read-only, .polispec-release.json schema polispec.release/v1), current (atomic link), source.git (bare fetch of the public repository when no local source exists)."
  install_receipts: "polispec install writes <state home>/installs/<harness>-<scope>-<digest>.json (polispec.install/v1): target, wired root, files written, links and backups. uninstall removes only marked hooks and links that still match the receipt and renames the receipt; backups are never deleted."
  hermes: "native pre_tool_call backend; runtime and consent unverified on the release host"
  pi: "skills-only; no native control backend"
  deepseek-tui: "skills-only; no native control backend"
  antigravity: "rplugin integration is skills-only. Separate explicit polispec installation generates agy CLI artifacts and protocol; native runtime unverified, GUI directive-only, lock unsupported."
  os: "sandbox planning; Bubblewrap namespace launch unavailable on the release host"
schemas:
  control: { id: polispec.control/v1, file: schemas/control.v1.yml, runtime: "Deterministic controls composed as an independent severity ceiling; mutable overlays may tighten only." }
  policy: { id: polispec.policy/v1, file: schemas/policy.v1.yml, path_in_project: specs/polispec/policy.yml }
  roster: { id: polispec.roster/v1, file: schemas/roster.v1.yml, path_in_project: specs/polispec/roster.yml }
  behavior: { id: polispec.behavior/v1, file: schemas/behavior.v1.yml, runtime: "Compiled data consumed by an application-owned adapter; authority comes from the release or authenticated package, never this declaration." }
  environments: { id: polispec.environments/v1, file: schemas/environments.v1.yml, path_in_project: specs/polispec/environments.yml, note: "Read from the trust ref beside policy.yml and merged into it; the file wins over an inline policy environments block (finding environments_duplicate). Only the fields policy.v1 knows go to the engine; audience, exposure, host, operators, rollback, pii_spec, freezes and notes feed the [ENVS] render. A project's serves flag lives in its component manifest, not here." }
  smoke: { id: polispec.smoke/v1, file: schemas/smoke.v1.yml, path: "POLISPEC_SMOKE, then polispec.smoke.path, then smoke.yml at the git toplevel of the working directory." }
  judgment: { id: polispec.judgment/v1, file: schemas/judgment.v1.yml, path: "judgments.jsonl under the polispec state home, one record per line, rotated at 16 MiB to judgments.<utc timestamp>.jsonl; validate judgment checks one record." }
  exceptions: { id: polispec.exceptions/v1, file: schemas/exceptions.v1.yml, path: "exceptions.yml at the root of the global layer (polispec.global.repo, ref and path), committed through polispec apply global; read from the committed ref, the directory layer or the sealed bundle." }
  ledger: { id: polispec.ledger/v1, file: schemas/ledger.v1.yml, path: "Unsealed: POLISPEC_LEDGER, then polispec.ledger, then ~/.config/polispec/ledger.yml. Sealed: verified protected authority selects the ledger." }
commands:
  - { name: behavior, status: built, usage: "polispec behavior compile FILE | decide FILE EVENT FACTS.json", note: "since 0.18.4 decide renders empty arrays and maps as [] and {}" }
  - { name: validate, status: built, usage: "polispec validate <policy|environments|roster|ledger|global|module|profiles|behavior|control|smoke|auto> <file> [--json]", note: "validate policy merges a sibling environments.yml when the policy has no environments block" }
  - { name: "plan, apply", status: built, usage: "polispec plan|apply <package> --repo REPO [--variant V] [--param k=v]... | project:<id> [--from REF|worktree] | global [--from REF|worktree] | ledger --from FILE  [--confirm PLAN_ID] [--commit] [--push] [--checkouts] [--with-stewardship] [--dry-run] [--json]", note: "since 0.21.0 replace onboard (removed, no alias). plan previews files, ledger effect, composed policy diff, synthetic probes and opted-in journal replay, classifies tightening|loosening|mixed|neutral and prints a plan id; apply carries it out, refusing confirm_required unless the plan is tightening or neutral and not global, or --confirm equals the recomputed plan id (plan_changed when stale). apply environment-control --variant service|distributed reproduces onboard's steps (files, manifest, ledger, render, commit, branches, push, checkouts). --with-stewardship first ensures the stewardship rule, the runtime protected root and a pinned runtime at the running version's tag; a failure aborts before any change." }
  - { name: steward, status: built, usage: "polispec steward [--check] [--json]", note: "since 0.22.0: the apply --with-stewardship steps on their own; --check only reports; since 0.27.0 the rule and pin steps run natively (rule links under <claude home>/rules/polispec/, polispec pin) when rplugin is absent" }
  - { name: pin, status: built, usage: "polispec pin [--ref TAG] [--source PATH|URL] [--dry-run] [--json]", note: "since 0.27.0: archives TAG (default v<VERSION>, whose VERSION must match) into <data home>/releases/<commit>/ read-only with .polispec-release.json, swaps <data home>/current atomically, links ~/.local/bin/polispec unless that path belongs to something else; source defaults to the clone runtime, the pinned release's source, or a bare fetch of the public repository; idempotent; never deletes an older release" }
  - { name: "install, uninstall", status: built, usage: "polispec install|uninstall --harness claude|codex|all [--scope user|project] [--project DIR] [--force] [--dry-run] [--json]", note: "since 0.27.0: Claude Code hooks in settings.json (PreToolUse, SessionStart, SubagentStart), Codex hooks as one marked block in config.toml, skill link, and at user scope the rule links; in-place backups, foreign hooks kept, refuses without --force when the polispec harness plugin is enabled; writes no Codex trust hash; uninstall removes only marked hooks and links matching the receipt" }
  - { name: "ledger init", status: built, usage: "polispec ledger init [--dry-run] [--json]", note: "since 0.27.1: writes config/ledger.starter.yml (schema, short hostname, envs_root ~/.polispec/envs, the example default rules, projects: []) to the resolved ledger path, 0600 in a 0700 directory, validated before the write; keeps an existing ledger untouched; ledger_sealed when the sealed plane names the ledger. polispec install at user scope and a package plan/apply on a host without a ledger create the same starter; the package plan lists it as a tighten change; doctor's ledger_missing names polispec ledger init" }
  - { name: settings, status: built, usage: "polispec settings list|get KEY|set KEY VALUE|unset KEY [--json]", note: "since 0.27.0: reads and writes the native settings file, validated against the settings in polispec.rplugin.yml; list names each value's source (plane, env:NAME, rplugin, file, default); refuses while the sealed plane is active" }
  - { name: "agents render", status: built, usage: "polispec agents render <project|repo> [--from worktree|REF] [--check] [--json]", note: "writes .agents/directives/envs.md and upserts the AGENTS.md line keyed by the [ENVS] opcode; doctor reports agents_drift when the trust ref disagrees with a fresh render; edits to the row or envs.md classify as policy.edit (impl environments FR-5 to FR-8)" }
  - { name: "hook git", status: built, usage: "polispec hook git pre-commit|pre-push|reference-transaction | install|uninstall <project> dev|test|prod|all [--dry-run]", note: "judges git operations in a live project with the same rules and environment resolution as the harness guard; shims chain to the previous core.hooksPath; POLISPEC_OPERATOR=1, set by polispec's operator git, skips them; a seatbelt for processes outside a harness, not a security boundary (impl environments FR-9)" }
  - { name: version, status: built, usage: "polispec version" }
  - { name: "hook pretool|session", status: built, note: "Bounded native envelopes, separate session handling, independent control ceiling, and minimal failure denial; positive diagnostic reads remain available. Since 0.18.5 a live ledgered project whose policy is missing or invalid at its trust ref is judged by global.yml fallback_rules (ledger defaults.rules when no global layer exists), never by an internal denial; claude deny and ask reasons begin [POLISPEC <rule_id>] DENIED: or WARNING:; next steps for a path no project owns name no project. Since 0.19.0 the harness-controls target resolver applies the same fallback policy instead of failing closed." }
  - { name: resolve, status: built, usage: "polispec resolve <path> [--layers] [--json]", note: "since 0.16.0 --layers prints the global, repo and child layer chain with each layer's digest and the effective digest; since 0.16.1 a path under the environment checkout root that names no environment, such as a release_dirs release or the shared bundle, resolves to prod, matching the engine" }
  - { name: classify, status: built }
  - { name: explain, status: built, usage: "polispec explain --harness HARNESS [--json] < hook-json", note: "since 0.26.0 judges one PreToolUse hook call through the same path as hook pretool (classification, environment outcomes, the harness-control ceiling with the undeclared MCP default) and prints the verdict the harness would get under enforce, whatever polispec.enforce is: verdict allow|warn|deny, rule_id, reason, governed, control verdict and ask_ids, and per action its class, server and operation and whether a protected or committed rule declares it. It is read-only: no judgment record, no polispec.control or polispec.judgment event, no fast-path refresh, no allow-once id and no protected authorization request or consumption (the explain adapter reports ask? true, so the ask composition returns before the authorization branch). Exit 0 when it judged, 2 on invalid input. For callers that must know before a headless session runs whether its tools pass, such as Teach's doctor" }
  - { name: "promote, deploy", status: built, usage: "polispec promote <project> --to <env> [--waive-soak] [--dry-run] [--json] | polispec deploy <project> <env> [--tag vX.Y.Z] [--skip-drain]", note: "since 0.17.0 --waive-soak (operator only, typed phrase waive soak for <project>, refused for test and when no soaked gate applies) reports the soaked gate as waived and records waived: [soak] on the promotion and its event; while stable carries no policy, promote and test deploys bootstrap from the candidate branch's committed policy (impl FR-4b); gate, step and after commands run without a shell, with $HOME, ${HOME} and a leading ~ expanded in each word (impl FR-4c); `hermetic.<env>` isolates variables into scratch and fails a run that writes under a protected root (a command gate with `hermetic: false` runs outside it, recorded as `hermetic: false` in the promote result), `deploy.strategy: release_dirs` swaps a release symlink and rolls back on failed health, `deploy.drain` pauses, waits, checks and resumes queues in the active release, and `polispec deploy <project> stable --skip-drain` skips the drain (terminal plus phrase `skip drain for <project>`); a policy that deploys without health is refused" }
  - { name: "pause, allow-once", status: built, note: "Unsealed terminal behavior retained; sealed authority authenticates the operator and consumes grants through the protected service. Since 0.18.4 the allow-once prompt and stored raw name the tool and absolute target of a file-tool call, and both commands refuse with not_tty or confirmation_failed like promote." }
  - { name: "roster resolve|check", status: built }
  - { name: "status, digest, doctor", status: built, note: "since 0.18.4 status <unknown> --json prints a JSON unknown_project error and exits 1; since 0.18.6 status reports a policy_invalid finding for semantic policy errors (missing deploy.health, environment names, profiles) exactly as promote does; digest reads warn and deny judgment records, and doctor reports judgments_chain_broken and judgments_truncated (see the judgments section)" }
  - { name: judgments, status: built, usage: "polispec judgments list [--since 24h] [--session ID] [--project ID] [--json] | show <id> [--json] | verify [--json]", note: "reads the chained judgment stream; verify walks every rotation and the head anchor and exits 1 on a digest mismatch, a broken chain or truncation; list and show never print raw text unless the record holds it" }
  - { name: exceptions, status: built, usage: "polispec exceptions list [--json] | add --command GLOB [--tool NAME] [--kind control|rule] [--rule ID] [--global] [--note TEXT] | promote PROPOSAL_ID... [--command GLOB] [--global] [--note TEXT] | remove ENTRY_ID", note: "since 0.29.0: persistent exceptions to guard asks (see the exceptions section). list is a benign read; add, promote and remove need a TTY and a typed phrase, refuse while the sealed plane is active, and commit exceptions.yml in the global shelf through the plan and apply global path" }
  - { name: harness, status: built, usage: "polispec harness grammar|parse|plan|install|verify|scan|uninstall", note: "Strict per-command options, dry-run for mutations, structured JSON results; docs/harness-controls.md. Since 0.18.7 uninstall --dry-run without --owner previews without root; scan returns ok:false with environment_scan_failed and its cause and exits 1 (3 before 0.19.0); since 0.19.0 uninstall --dry-run --owner previews without root, reads only what the current uid can read and reports each owner check it could not perform as owner_check_unverified; operation_id is opaque (64-hex or op_ plus 24 hex for plans, uninstall_ plus 24 hex for uninstalls)." }
  - { name: seal, status: built, usage: "polispec seal --from REPO@COMMIT | --source /etc/polispec/source [--dry-run] [--json]", note: "since 0.18.7 YAML dates in the bundle are normalised before schema validation, as the ledger loader does; the runtime manifest of the committed polispec release leaves image assets under assets/ (since 0.24.0) and the smoke ledger smoke.yml (since 0.25.1) out, and since 0.25.1 a runtime installed as an rplugin release enumerates that manifest from the source repository and commit its release descriptor records, never from a repository that merely encloses the install, failing runtime_source_unavailable when that source is missing" }
  - { name: plane, status: built, usage: "polispec plane status|verify|activate|rollback", note: "Activation and rollback require an authenticated protected operator; development does not activate live projects." }
  - { name: authorizations, status: built, usage: "polispec authorizations status|unit|serve|recover", note: "Fixed local socket; unit renders without installing; request and consume have no remote redemption operation." }
  - { name: smoke, status: built, usage: "polispec smoke record|list|show|verify|coverage|run", note: "Appends and reads the smoke ledger; since 0.23.0 run executes the bundled suite; see the smoke section." }
composition:
  summary: "Environment policy composes recursively. A policy, the global layer and every module may include modules; a module may include modules, to any depth. Nested ledgered projects stack beneath the project that owns the path, nearest last, to any depth. Across layers the strictest verdict wins and a lower layer loosens only a rule marked overridable that it names in overrides."
  ownership: "Since 0.20.0 the outermost ledgered repo or worktree root containing a path owns it, regardless of ledger order; environment checkouts are unchanged. Every nested ledgered project between that owner and the path is a child layer."
  modules: "A module name resolves to the global shelf (polispec.global.*, modules/<name>.yml) or, since 0.20.0, to a project-local module at <directory of the policy>/modules/<name>.yml read from the same source as the policy: the trust ref, the bootstrap ref, or the sibling directory of a POLISPEC_POLICY file. A local module may include local and global modules; a global module sees only the global shelf. A name present in both is an ambiguous_module error and that include is not applied."
  parameters: "Since 0.20.0 a module may declare params (name to type string, integer, number, boolean or list, with optional default and summary). An include is a module name or { module, with }. A string value that is exactly {{name}} becomes the typed value; {{name}} inside other text interpolates it. Module includes substitute too, so a module passes its parameters down. A missing required, unknown or mistyped parameter, or an unresolved placeholder, is an error and the instance is not applied. Each distinct module and resolved-parameter pair is one instance, expanded once; two instances in one layer that yield the same rule, gate or freeze id is an error."
  children: "Since 0.20.0 a child layer expands the child's own includes (with the child's local modules) ahead of its rules, and the owning project's composed policy receives every descendant's promotion gates (to_test, to_stable), to_stable preflight, freezes and hermetic, and those of their modules. A gate a child contributes carries dir, the child's path relative to the owner, so its run executes in the child's directory. A child-contributed gate or freeze id equal to one already in the owner or global composition is an id_collision error and the child copy is not applied."
  failure: "Composition errors (include cycle, missing or ambiguous module, parameter errors, id collisions, invalid overrides) are reported by validate, doctor (layers_invalid) and resolve --layers, emitted as a layers_invalid finding, and since 0.20.0 make promote refuse with policy_invalid instead of promoting with fewer gates."
  digest: "A layer digest covers the policy, every expanded module text and each instance's resolved parameters, so a change to a local module at the trust ref changes the effective digest."
stewardship:
  summary: "Since 0.21.0 meta-level work on polispec (developing it, installing, upgrading or repairing it, applying packages and project specs, changing the global shelf or the ledger) has its own shipped rule, rules/polispec-stewardship.md, and mechanisms: a pinned runtime, a protected runtime root, packages, and one plan/apply verb under a confirmation gate."
  runtime: "Polispec::Runtime reports kind pinned (an rplugin release: ROOT/.rplugin-release.json, schema rplugin.release/v1, commit equal to the directory name), sealed, clone or unknown, and the commit. Pinned releases come from rplugin install <root> --ref <ref> (read-only archive under ~/.rplugins/.pinned/<id>/<commit>/, store link swapped atomically) or, since 0.27.0, from polispec pin (ROOT/.polispec-release.json, schema polispec.release/v1, under <data home>/releases/<commit>/; Runtime.release_kind native, doctor prints pinned (native)). doctor verifies a pinned release's tree digest and checks edition provenance against the recorded source repository."
  protected_runtime: "Built-in protected root R-POLISPEC-RUNTIME at the realpath of the running polispec: deny when pinned, warn when the runtime is a working clone, none when sealed (the plane protects it) or unknown. Since 0.24.0 the runtime verdict and the policy's own first-match verdict are both computed and the stricter wins, a tie keeping R-POLISPEC-RUNTIME, so R-PROD-FS still denies a write inside a clone runtime that is also a production checkout. Writer rplugin."
  packages: "packages/<name>/package.yml (polispec.package/v1): name, version, summary, params (module param shape), variants with files, shared files, modules copied to specs/polispec/modules/, and ordered built-in steps (files, manifest, ledger, render, commit, branches, push, checkouts) with optional when: { param, equals }. No arbitrary command steps. Sources: shipped packages/ and the global shelf packages/; a name in both is ambiguous. environment-control (variants service, distributed) is the former onboard flow."
  ledger_record: "Project entries record packages: [{ name, variant, version, applied_at, files: { path: sha256 } }]. status shows them; doctor reports package_upgrade_available and package_file_drift. An upgrade replaces files still equal to their recorded digest and reports edited files as conflicts, untouched."
  plan_targets: "A package; project:<id> (proposed specs at a ref or the main worktree vs the trust ref); global (proposed global path vs the configured global ref); ledger --from FILE (proposed vs live ledger)."
  classification: "Probe or journal verdict severity up is tighten, down is loosen. Removed rules, gates, freezes, modules, protected roots or hermetic entries loosen; added ones tighten. Adding an onboarding ledger project tightens; changing an existing entry's status, profile, trust_ref, repo or retirement loosens. needs_confirm when the classification is loosening or mixed, or the target is global."
  confirmation: "plan_id is plan_ plus 24 hex of sha256 over the target, proposed and current digests and the classification. apply --confirm PLAN_ID is classified policy.edit by the guard, so live policies warn and the harness asks the user."
  journal: "plan replays the per-action rows of the judgment records of the last 14 days (project, env, class, tool, ref, home-relative path, crosses, destructive, shape, verdict, rule id) as actions against the current and the proposed rulebook; polispec.verdicts.journal and journal.jsonl are gone, the rows are always recorded (see the judgments section), and the plan output still labels the replay journal."
  steward: "Since 0.22.0 polispec steward runs the stewardship steps alone and polispec steward --check reports them (status missing names what would run) without changing anything, exit 1 when any step is unsatisfied. Step 1 also requires, with rplugin 1.15.0 or later and a Claude Code home, the rule link <claude home>/rules/rplugin/polispec/polispec-stewardship.md, repaired with rplugin install polispec. Since 0.27.0, when rplugin is not executable, step 1 instead links <claude home>/rules/polispec/polispec.md and polispec-stewardship.md (ok with no Claude Code home) and step 3 runs polispec pin --ref v<VERSION>; with rplugin every step is unchanged."
  with_stewardship: "apply --with-stewardship ensures, in order and skipping what holds: the stewardship rule installed through rplugin (or linked natively without it), the runtime protected root active (kind clone or pinned), and the runtime pinned with rplugin install --ref v<running version> (or polispec pin without it). Any failure aborts before the apply changes anything."
  contract: specs/stewardship.impl.yml
extension_points:
  commands: "lib/polispec/commands/*.rb is glob-loaded; a file calls Polispec::CLI.register(name, klass, summary:) and klass responds to run(args) returning an exit status, either as a class method or on a new instance."
  classifier: "lib/polispec/classify/commands/*.rb is glob-loaded; a file calls Polispec::Classify::Registry.register(family, klass) and klass responds to call(tool_name, tool_input, cwd) returning [Polispec::Action]."
code_specs:
  status: built
  summary: "Code specs: a tree of composable policies applied per language whenever an agent writes code. The policy is the atomic entity; a policy with subpolicies is composite; a spec is the root policy of one spec file, mounted at a path (code, code/ruby, code/ruby/code_quality, code/ruby/code_meta, code/code_meta)."
  fundament: "Every policy carries an execution class (harness, agent, hybrid, contextual). The class is set when the policy is authored, by the classifier model and reviewed by the operator, and stored in the spec. At runtime the harness reads it with no model call, except for contextual policies, whose applicability the classifier decides per event."
  models:
    classifier: "A local decide port when the host provides one, otherwise a hosted model fallback; set by the host"
    interpreter: "A model at medium effort that reviews agent-class policies against the task diff; set by the host"
  binding: "Language is detected from the file before each write. The language's directives are injected once per session per spec digest before the first write. Harness-class checks run on the changed lines; MUST violations block, SHOULD violations warn. Agent-class policies are reviewed at task end."
  legacy: "Ratchet: only violations on changed lines block; pre-existing violations are recorded in a per-repo baseline that may only shrink."
  controls: "Every harness and hybrid policy ships a negative-control fixture that must trip its enforcer (polispec check --controls). Controls are checker machinery under NOTEST and live only in the code specs repository."
  source_of_truth: "The code specs repository is the single source for code directives; a host generates directive rows and guards for code rules from, or calls into, their policies."
  specs_home: "~/.polispec/specs, a symlink to the specs/ directory of the code specs repository named by the polispec.code.specs_repo setting"
  schema: { id: polispec.spec/v1, file: schemas/spec.v1.yml }
  waivers: { id: polispec.waivers/v1, file: schemas/waivers.v1.yml, path_in_project: specs/polispec/code-waivers.yml }
  commands:
    - { name: "code detect|chain|show|check|validate|baseline|controls|generate|classify", status: built, note: "since 0.18.7 code classify on a file that defines no policy rules says why and exits 1" }
    - { name: "specs link|status|promote", status: built, usage: "polispec specs link|status|promote [--repo DIR] [--dry-run] [--json]", note: "since 0.18.7 specs link creates a missing ~/.polispec/specs link or confirms one already at <repo>/specs without asking; repointing an existing link at a different target needs an interactive terminal and the typed phrase relink <full target path> (the absolute <repo>/specs path; relink specs before 0.19.0), and an agent shell is refused with not_tty and exit 1; a wrong phrase is confirmation_failed; --dry-run previews and names the phrase" }
    - { name: "code-hook pre|post|stop|session", status: built, note: "--harness claude and --harness codex accept exactly the event of their mode: pre PreToolUse, post PostToolUse, stop Stop, session SessionStart. Any other event, or a payload that fails to parse, makes the hook print a one-line diagnostic on stderr and exit 0 without checking; it never fails silently." }
  settings: [polispec.code.enforce, polispec.code.check_at, polispec.code.inject, polispec.code.specs_repo]
  ports_optional: [decide]

deployment_receipts:
  contract: polispec.status.deployments/v1
  command: polispec status <project> --json
  fields: projects[].deployments.<env> contains receipt, latest_attempt, and verified
  receipt: last successful deployment; record_id, sha, tag, health, pinned_behind, and at only
  latest_attempt: last appended deploy record; id, sha, tag, health, pinned_behind, and at only
  verified: same nonempty record identity, sha, and tag; both health ok and pinned_behind false
  fail_closed: missing, malformed, legacy receipts without record identity, unchecked health, and newer failed attempts are unverified
  limits: evidence of the completed deployment health check, not continuous availability; consumers must match current stable ref and tag

harness_controls:
  release_activation: "Since 0.23.0 harness_controls ships true by operator direction (config/harness-features.yml): the guard applies the control ceiling, unknown-call and undeclared-MCP defaults, and harness install and verify are enabled. sealed_plane stays false: sealing, plane activation, uninstall and the authorizations service remain gated. Since 0.24.0 one uninstall is open on an unsealed host (plane status unsealed, never broken or active): a non-root user removes a user- or project-scope overlay whose unprotected receipt carries their own owner_uid, after typing uninstall INSTALLATION_ID on a TTY; receipts written before 0.24.0 carry no owner_uid and still need the operator. No host or project activation occurs on install."
  benign: "Since 0.23.0 Classify.benign? positively recognises calls that are not unknown: harness-internal tools (TodoWrite, TodoRead, Skill, ToolSearch, AskUserQuestion, EnterPlanMode, ExitPlanMode, TaskOutput, TaskList, TaskGet, TaskCreate, TaskUpdate, TaskStop, ListAgents, SendMessage, Glob, LS, update_plan, view_image, and since 0.28.3 SubagentHandback, StructuredOutput and ScheduleWakeup) and fully parsed shell lines whose every command is a read-only name with no write flag or a read-only git subcommand, with no substitution, wrapper, environment prefix or file redirection. Classify.positive gives WebFetch and WebSearch a known web.fetch action and Agent and Task a known agent.spawn action, judged by policy like any classified action. Since 0.23.1 a shell line the parser fully parses (at least one command, no eval, source or . builtin) is also not unknown, even when it is not benign: the shell classifiers have judged every command in it, so its classes, or none, go to policy as in 0.22.0. Unparseable shell lines, eval and source lines, and non-shell tools with no positive class stay unknown; with harness_controls false nothing changes. Since 0.24.0 a governed line that runs eval (recorded by the shell parser when it unwraps eval, at any nesting depth), source or . adds the POLISPEC-TOOL-UNKNOWN ask to whatever its commands classify as; the words in quoted strings, heredoc bodies fed to non-shells and grep patterns do not count. Since 0.30.0 that ask is not added when the working directory is in development: Ledger#development returns the project ids when at least one non-retired ledger project contains the directory (its repo root or a worktree glob), every such project has status onboarding, and the directory is not inside an env checkout under envs_root. The directory of every command the parser finds in the line must be in development too, so a line that changes into a live project, a checkout or an unowned path before it sources keeps the ask. A live project, a live project containing an onboarding one, a test or stable checkout, an unowned path, the lock edition and polispec.relax.dev off keep the ask. Only the opaque trigger is relaxed: a line the parser extracts no command from, an unrecognised tool and an undeclared MCP operation still ask, and the visible commands of the line are judged as before, so a push to stable written in the line, or inside a literal eval, is still denied. A relaxed call carries relaxed in its judgment record. Benign git refuses -c, --config-env, --exec-path, --paginate and -p only among the global options before the subcommand, so git log -p and git show --stat are benign reads. Since 0.28.2 the Claude Code Monitor tool is a shell tool: its command is canonicalised to Bash (Harness::Base::SHELL_TOOLS) and covered by the container root guard (HarnessControls::RootGuard::SHELL_TOOLS), so a loop or pipeline of known commands in it is judged like the same Bash line instead of asking POLISPEC-TOOL-UNKNOWN, and a push to stable or a privileged container run in it is judged as in Bash."
  fastpath: "Since 0.23.0 Fastpath.refresh also writes fastpath.tools beside fastpath.txt: * without a governed baseline, otherwise the harness-internal tool names bin/polispec-guard may skip, plus the read tools unless a composed global or module rule governs reads (class secrets.read, a match.tool naming a read tool, or neither class nor shape). Any other tool, MCP included, reaches polispec; a missing fastpath.tools makes the fast path stale."
  unsealed_asks: "Since 0.23.0, with the plane not active, an ask set made only of environment-policy warnings keeps the legacy verdict (a harness without native ask, such as Codex, gets deny with a redeemable allow-once id). A control ask still requires the protected authorization service."
  contract: specs/harness-controls.impl.yml
  schema: polispec.control/v1
  result: polispec.harness.result/v1
  capability_inventory: data/harness-capabilities.yml
  edition: "main contains standard; polispec-lock differs only by EDITION lock. Each checkout operates independently; lock provenance uses its immutable parent without a local main ref. A lock executable refuses an active standard-plane mismatch. One authority plane per host; requested edition is distinct from certification."
  translation: "The calling agent produces the deterministic grammar or YAML; control judgement uses no model."
  ownership: "Native harness artifacts and the sealed authority plane are polispec-owned domain files. Back up before mutation; preserve foreign contributions. Service capabilities continue through Rplugin::Ports.for(polispec)."
  authority: "Fixed /etc/polispec/active.json; valid root-owned provenance and pinned runtime/SDK. Invalid existing authority is broken, never an unsealed fallback. Standard seals an exact Git commit; lock reads root-authored /etc/polispec/source."
  tightening: "Agents may add provably tightening user/project controls. Removal, managed scope, core changes, loosening, and uncertain comparisons require the authenticated operator."
  judgement: "Environment policy keeps first-match order; controls independently cap severity. Explicit denials, protected targets, root guard, broken authority, and lock defaults cannot be redeemed."
  input_bounds: { ir_bytes: 1048576, controls: 256, hook_bytes: 65536, hook_seconds: 10 }
  unknowns: "Standard asks and lock denies undeclared MCP and unknown non-read calls in enforcing governed scope. Every MCP action needs a matching declaration in trusted policy or protected core; overlays cannot supply an allow declaration. Trusted policy is every layer the engine composes for the action's target: the global shelf, its included and profile modules, and a live project's committed policy, so a rule with an exact match.server and match.operation in any of them declares that operation for onboarding and unowned paths as well as live projects. A declaration carries class [mcp.call] so it does not count as a rule that governs reads. Protected-authority checks deny an fs.write, fs.delete or control.edit whose path is a protected path, lies inside one, or is an ancestor of one; since 0.23.1 the ancestor match does not apply to the fallback write an unrecognised program gets on its working directory (env_hint unknown), so running such a program from the home directory is not a write over the runtime, while an explicit recursive change, move or delete of an ancestor still is. Since 0.24.0 a policy.edit whose target is a protected path or lies inside one (a shell redirect, Write or Edit of the ledger) is denied the same way; a policy.edit whose target is an existing directory, as polispec apply emits for its working directory or --repo, is not, and the ancestor match never applies to policy.edit. Since 0.25.0 a control ask is carried by the judgment record's control block (verdict warn and the ask ids) and no polispec.verdict event is emitted. Since 0.28.1 a mkdir operand the parser cannot resolve (a variable or a command substitution) is that same fallback write (env_hint unknown) instead of a write of the working directory, so creating a scratch directory named by a variable from the home directory is not a write over a protected root; a static mkdir target, and an unresolved operand of every other command, keep the ancestor match. Since 0.28.1 zcat, zgrep, zegrep, zfgrep, zless, zmore, bzcat, xzcat and zstdcat classify as reads of their file operands like cat and grep (secrets.read candidates), and gzip, gunzip, bzip2 and xz with -c, -t or -l (alone or in a short-option cluster), --stdout, --to-stdout, --test or --list write nothing and read their operands; a shell redirect still classifies as the write it is. Since 0.29.0 an unknown-tool or undeclared-MCP ask is lifted when every trigger that causes it is covered by an exception of the global layer (see the exceptions section); a line that still has an uncovered trigger asks about all of them, and the lock edition honors no exception. Since 0.30.0 the ask for an opaque eval, source or . line is not raised in a project in development (the benign row), and an exception is then not needed for it."
  failure: "Non-read calls fail closed; only an entirely positive diagnostic-read envelope qualifies for the failure exception. Mixed, malformed, shell, MCP, web, and delegation calls do not."
  overlays: "Effective installed receipts require authenticated transaction relationships, canonical targets, current owned contributions, and bounded state. Valid successor history may replace prior artifact bytes; unrelated supersession is refused."
  exposure: "First root-equivalent exposure advises; a distinct continuing scan arms root_guard. Protected scans validate provenance and exact observations; corruption conservatively arms. Rootless is a separate observation."
  events: "Lifecycle and authorization events use the plugin events port after state commits. Events carry identities and outcomes, never tool payloads or authority redirect values. Event failure cannot loosen a verdict. The polispec.judgment event is a copy of the local judgment record without its raw field: targets, rows with home-relative paths and refs, engine identity and the outcome, never tool arguments."
  native_evidence: "Release-host parser/version and isolated scratch evidence only. No native lock certification, paid model journey, root-owned host seal, host service installation, timer activation, or live-project activation."
protected_authorizations:
  socket: /run/polispec/authorizations.sock
  kill_marker: /etc/polispec/authorizations.disabled
  identity: "Client authenticates a root peer; server authenticates request UID from kernel peer credentials. Redemption is a local protected operator action."
  binding: "Exact generation, project, canonical action, complete tagged ask set, trusted policy/control digests, actual harness/session, and requesting UID. One standard grant can resolve combined environment/control asks; independent denials remain binding."
  consumption: "Durably record consumption before replying. Replay, concurrent consumers, changed authority, unavailable service, and lost replies never produce another grant."
  bounds: { request_bytes: 16384, response_bytes: 32768, deadline_seconds: 2, ttl_seconds: 600, backlog: 8, inflight: 1, uid_requests_per_minute: 60, global_requests_per_minute: 300 }
  deployment: "Built, not installed or started on the release host. Unit rendering and stale-socket recovery are explicit operator commands."
exceptions:
  summary: "Since 0.29.0 the operator can record persistent exceptions to the guard's asks, the equivalent for polispec of an always-allow list. An exception lifts only the ask it names, for the commands it matches; the rest of a line is still judged by policy, and the exception that lifted a call is stamped on its judgment record."
  storage: "exceptions.yml (schema polispec.exceptions/v1) at the root of the global layer, read from the committed ref of polispec.global.repo, from the directory layer, or from the sealed bundle. It is a file of the global shelf, so it is trusted policy under the unknowns row, and no overlay, project file or state file can supply an entry. A missing file means no exceptions; a file that is invalid, over 256 entries or over 64 KiB honors nothing, and doctor reports exceptions_invalid."
  entry: "id aex_ plus 12 hex of sha256 over kind, tool, command, rule and scope; kind control (POLISPEC-TOOL-UNKNOWN and POLISPEC-MCP-UNDECLARED asks) or rule (an environment rule's warn, Bash only); tool, the exact canonical tool name, where every shell tool, Monitor included, is Bash; command, a glob over the whitespace-normalised, unexpanded text of the triggering command (* crosses slashes), required for Bash and forbidden otherwise, whose first word contains no glob character; rule, the rule id, required for kind rule and forbidden for kind control; scope, {project: canonical path} or {global: true}; note up to 200 characters; added."
  lifting: "control: the ask is lifted only when every trigger is covered. The triggers of a shell line are the eval, source and . commands it runs (or the whole line when the parser cannot name them, or when it is unparseable); the trigger of any other tool is the tool name, and of an undeclared MCP call the full mcp__server__operation name. rule: a warn row of a Bash call is lifted when an entry names its rule id and its command text matches. An exception applies when the working directory is inside its project scope or the entry is global."
  never: "Never excepted: a deny, POLISPEC-CONTROL-PROTECTION, the container root guard, a broken seal and every verdict of the lock edition. Plan, apply, probes and the journal replay never apply exceptions, so a plan compares policy only. explain applies them so it reports what the hook would answer, and writes nothing."
  proposals: "When a governed call still asks or warns on a trigger an exception could cover, the hook records a proposal (apr_ plus 12 hex of sha256 over kind, tool, command and rule) in exception_proposals.jsonl in the polispec state home, kept seven days and at most 256, and appends to the ask text: To stop asking for [<the triggering commands, at most 80 characters each>], the operator can run in a separate terminal: polispec exceptions promote <ids>. No proposal or hint is made for a deny, under the lock edition, while the sealed plane is active, or while polispec.exceptions is off. A proposal grants nothing."
  creation: "polispec exceptions add and promote (and remove) run on a TTY after the operator types the phrase shown, refuse while the sealed plane is active, and change nothing but exceptions.yml: they require the global layer to be a git repository on its ref with no other uncommitted change under the shelf path, write the file, then plan and apply the global target with the plan's own id as the confirmation, which commits it as Apply polispec plan <id>. A failed apply restores the previous bytes. An agent shell cannot run them (not_tty)."
  protection: "The exceptions file is a protected path like the ledger: a Write, Edit or shell redirect into it classifies as policy.edit and is denied POLISPEC-CONTROL-PROTECTION. The known limit is the one every classified path has: a program the classifier cannot read, such as an interpreter running inline code, is an unknown write."
  matching_limit: "An exception matches the text of the command, not what it expands to or runs: an entry for . $B/env.sh stays in force whatever $B/env.sh contains. promote escapes the glob characters of the proposed text, so a promoted entry matches that command exactly; add and promote --command take a pattern as written."
  scope_default: "A new entry is scoped to the project root, the git toplevel of the working directory (of the proposal's directory for promote), else that directory; --global widens it to the host. There is no expiry; remove revokes."
smoke:
  summary: "A smoke ledger records smoke tests that proved a spec or sub-spec worked in reality, each with the runtime it ran in. polispec records, chains, verifies and reports coverage, and since 0.23.0 ships a bundled suite run by polispec smoke run; operators may record their own tests beside it."
  file: "smoke.yml, schema polispec.smoke/v1: schema plus an append-only entries list. Writes go only through polispec smoke record, under an exclusive file lock with an atomic replace."
  proves: "spec is a path relative to the git toplevel of a YAML file that parses to a mapping or list; at is a slash path into it: a mapping key, or a list item whose name or id equals the segment; ~1 escapes / and ~0 escapes ~. An empty at proves the whole file. record refuses a reference that does not resolve, and stores at_digest, the sha256 of the canonical JSON of the resolved node."
  verdicts: [pass, fail, partial, blocked, inconclusive]
  inconclusive: "Since 0.24.0 a live step whose only failing checks are hook_fired, hook_log or files_exist, with no timeout, spawn or auth error, did not attempt the action; it re-runs once (the first attempt's evidence kept as .first. files) and, if the retry also does not attempt, records inconclusive. inconclusive does not fail a run, never proves a unit and never revokes an earlier pass. A failing files_absent or git check always fails with no retry."
  entry: "id, recorded_at, started_at, finished_at, proves, verdict, summary, steps (run, exit, expect, observed), evidence (path relative to the toplevel or a basename, sha256, bytes, kind), runner (kind human or agent, harness, harness_version, model, effort), runtime, target, prev, digest."
  runtime: "Captured by record: os id, name and version, kernel release, arch, container and wsl flags, time zone, locale, ruby engine, version and platform, polispec version, edition, commit and dirty flag, install kind, rplugin version, enforce mode. No hostname, user name or absolute path is recorded: in summary, step and evidence text the home directory prefix becomes ~ and the toplevel prefix becomes ."
  events: "record emits polispec.smoke through the events port after the ledger write, carrying the entry id, proves and verdict only. An event failure does not fail the record."
  target: "Captured by record: the git commit, branch and dirty flag of the toplevel, the ledger project id when the toplevel is a governed project, the resolved environment, and the effective policy digest when one resolves."
  chain: "digest is the sha256 of the canonical JSON of the entry without digest; prev is the previous entry's digest, null for the first. record also anchors the head digest and entry count per ledger real path in smoke-heads.json under the state home, and verify reports truncated against it (only where that anchor exists). verify reports schema errors, a broken chain, a digest mismatch, and references that no longer resolve or whose at_digest changed."
  coverage: "polispec smoke coverage [--spec FILE] [--at PATTERN]... expands each pattern against the spec (a trailing * expands the items of a list or the keys of a mapping) and reports, per unit, the latest entry and whether a pass exists whose at_digest equals the node's current digest. Default spec specs/app.yml; default patterns from that file's smoke.coverage_units list, else commands/*."
  coverage_units: [commands/*, code_specs/commands/*, code_specs, composition, stewardship, deployment_receipts, harness_controls, protected_authorizations, smoke, judgments]
  run: "polispec smoke run [--unit PATTERN]... [--scenarios DIR] [--against TREE] [--host-copy] [--live claude-code|codex]... [--out DIR] [--no-record] [--accept-changes] [--json] runs every smoke/scenarios/*.yml against the polispec tree it runs from, checks each step's expectations, and records one entry per unit (runner kind suite, worst verdict of its scenarios) unless --no-record. Exit 0 when every scenario passed or was blocked and, with --against, no diff exists or --accept-changes is given; 1 otherwise; 2 on usage. Output defaults to Dir.tmpdir/polispec-smoke/<timestamp>, never inside the tree."
  scenarios: "polispec.smoke-scenario/v1 (schemas/smoke-scenario.v1.yml, validate smoke-scenario): unit, spec, summary, requires (feature flags; off records blocked), fixture (enforce, global none|example|files, projects built by the tree's own apply environment-control with optional status live and checkouts, files), and steps that are a run (argv, cwd, env, stdin, tty, timeout, home), a hook payload (harness, event, tool, input, cwd) or a live session, each with expectations (exit, stdout and stderr substrings, JSON subset, files, git ref unchanged, hook decision and rule). Placeholders are expanded per word; an unknown placeholder is a scenario error."
  isolation: "Every step runs with POLISPEC_LEDGER, POLISPEC_GLOBAL, POLISPEC_HOME, POLISPEC_SMOKE, POLISPEC_SPECS_REPO and POLISPEC_STATE_HOME in its scratch directory, the enforce mode set explicitly, and a scratch git identity. POLISPEC_STATE_HOME (since 0.23.0, honoured only while unsealed, also by bin/polispec-guard when /etc/polispec/active.json is absent) moves polispec's state home and keeps events in its local log instead of the events port. The runner never writes the host ledger, shelf, settings or polispec state."
  parity: "--against TREE runs every scenario again with TREE's bin/polispec and reports, per step, a changed hook decision or rule, or a changed exit status or stdout after normalising scratch roots, tree roots, digests, commit ids, smoke ids and timestamps. parity: ignore skips a step. Only the candidate's results are recorded."
  host_copy: "--host-copy copies the configured ledger and global shelf into the output directory, replays smoke/host-probes.yml against every ledger project with the host's enforce mode and prints probe, project, decision and rule; with --against it compares. Never recorded."
  live: "--live claude-code|codex runs smoke/live/*.yml in headless sessions (claude -p with claude-haiku-5-5, codex exec with its smallest model) in scratch projects whose hooks run the tree's bin/polispec-guard; expectations come from the hook log, files and git state, never the agent's own account. Live steps run one at a time, at most POLISPEC_SMOKE_LIVE_MAX (default 6) per invocation, with a wall-clock timeout that kills the process group, at most one jittered retry when the harness exits before any hook call, and the polispec.smoke.live and POLISPEC_SMOKE_LIVE kill switches. Recorded with runner kind agent, the harness and its version, and the model."
judgments:
  summary: "Every call the guard judges leaves one chained record, polispec.judgment/v1, in judgments.jsonl under the polispec state home: what was judged, against which rulebook, by which polispec, and what the harness was told. It replaces verdicts.jsonl (deny and warn only, 300 bytes of command text, no policy or runtime identity) and the opt-in journal. Allows are recorded."
  schema: { id: polispec.judgment/v1, file: schemas/judgment.v1.yml }
  record: "id (jdg_ plus the first 12 hex of the digest), ts, action (tool, harness, event, session_id, agent_type, home-relative cwd, call_digest: sha256 of the canonical JSON of tool, arguments and cwd, and raw only while polispec.records.raw is on), targets (one per governed project or global baseline the call touched: project, env, policy_source, policy_digest, verdict, rule_id, rows with action_class, env, ref, home-relative path, crosses, destructive, shape, verdict and rule_id), control (control_digest, edition, ask ids; null when the control ceiling did not run), engine (polispec version, runtime kind, commit, tree_digest when pinned, edition, enforce mode, plane status and generation, fastpath key or null), outcome (verdict, rule_id, enforced, allow_once_id, rendered allow|ask|deny|none, error class for a fail-closed denial, duration_ms), exceptions (since 0.29.0, only when non-empty: the aex_ ids of the exceptions that lifted an ask or warn for this call), relaxed (since 0.30.0, only when non-empty: one {rule POLISPEC-TOOL-UNKNOWN, reason development, projects [ids]} for a call whose opaque eval, source or . line was not asked about because its project is in development), prev, digest."
  one_per_call: "One record per hook call, written synchronously after the environment outcomes and the control ceiling compose and before the reply is written, so the record carries the verdict the harness received. A fail-closed internal denial records verdict deny, rule POLISPEC-INTERNAL and the error class, best effort. Git hooks record with harness git. The session hook records nothing."
  chain: "digest is the sha256 of the canonical JSON of the record without digest; prev is the previous record's digest, across rotations, null for the first record ever. Appends hold an exclusive lock on judgments.lock; judgments.head.json beside the stream holds the head digest, the record count and the current file name and is the truncation anchor. When judgments.jsonl exceeds 16 MiB the append renames it to judgments.<utc timestamp>.jsonl and the chain continues in a new file."
  port: "After the local append the same record without raw goes through the events port as polispec.judgment. The port receives a copy; it never replaces the local record. polispec.verdict is no longer emitted."
  skips: "bin/polispec-guard appends one line to skips.jsonl under the same state home for every call its fast path skips, with bash builtins only (no fork): ts, tool, session, the fast-path key and the reason, no_needles or no_match. The Ruby side rotates skips.jsonl at 16 MiB when it next runs. Skips are counted, never chained, because the shim cannot hash without a fork."
  readers: "polispec judgments list|show|verify (commands); doctor reports judgments_chain_broken and judgments_truncated; digest reads warn and deny judgments; plan replays the rows of the last 14 days. verify counts the skip lines per fast-path key beside the chain result."
  privacy: "A default record holds no command text, file contents or environment values: the call digest, home-relative paths and refs, identities and digests only. polispec.records.raw on adds the classifier's raw view, bounded to 2048 bytes, to the local record only."
  failure: "Recording never changes a verdict: the append is rescued, and a failed append emits a polispec.finding of kind judgment_unrecorded. doctor already reports state_unwritable."
  limits: "No hook payload carries the harness version, so a record has none (smoke entries do). A clone runtime records its HEAD commit, not a tree digest. Skip lines are not chained. The record proves what polispec judged, not that the harness obeyed the reply."
