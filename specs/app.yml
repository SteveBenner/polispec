schema_version: 1
name: polispec
version: 0.37.2
capture_repair:
  syntax_only_shell: "Recognized static noninteractive bash, sh, and dash noexec invocations classify script operands as reads. The parser does not follow their file, inline, or stdin bodies. Caller-side substitutions, redirects, privilege, and surrounding commands remain visible. Unknown options, startup-environment overrides, interactive mode, and disabled noexec retain conservative classification. Stdin bodies with possible caller substitutions remain conservatively inspected."
  interpreter_stdin: "A literal existing script operand passed directly to an interpreter makes its stdin data, not code. Without that positive evidence, embedded-code inspection remains conservative."
  codex_wiring: "Doctor recognizes bounded literal script operands following known interpreters, including the shared Codex bridge launched with /usr/bin/python3. Finding a reference proves wiring only, not trust or enforcement in an already running session."
  judgment_integrity: "Appends refuse an unreadable journal tail or an unconnected head instead of continuing from a stale anchor, and advance the anchor only after a complete write. Verification holds the shared append lock and reports malformed JSON objects by archive and line. Historical malformed bytes and chain findings remain visible; they are never rewritten or rehashed."
kind: plugin
agent_skills:
  discovery: "Packaged skills are declared under contents.skills in polispec.rplugin.yml and generated into each native harness package by rplugin package. They locate the installed CLI and plugin-root documentation, inspect version and authority, resolve the target environment, and preserve the user's approvals and operator boundaries. Product skills ship in the plugin repository, not a machine-specific copy."
  operations: "skills/polispec/SKILL.md routes installed CLI operation, verdict explanation, validation, test promotion, harness controls, spec authoring, and path registration. It distinguishes the host runtime from a development candidate and generated artifacts from observed enforcement."
  authoring: "skills/polispec-specs/SKILL.md distinguishes environment policy and composition, global and ledger proposals, application behavioral policies and canonical surfaces, code-spec packs, and application implementation contracts. It requires schema validation, composition planning, exact-plan approval when required, canonical-source edits, explicit candidate refs, rollout compatibility, and honest reporting of the trust ref actually in effect."
  registration: "skills/polispec-register/SKILL.md uses the operation skill's discovery path and the spec skill's shelf workflow, carries forward supplied context and approvals, and never widens the requested scope or writes the ledger or shelf directly."
  standalone_delivery: "NativeInstall discovers shipped skills/*/SKILL.md directories and links each for Claude Code user/project scope and Codex user scope. Uninstall uses the same discovered paths together with receipt-owned links and preserves foreign files, directories, and symlinks. Repeated installation is idempotent."
purpose: "Spec-based policy guardrails for agentic development and operations. Every live project carries a versioned policy and, beside it, an environment manifest (main, test, stable), both read from the trust ref; the policy declares what agents may do in each environment, how code is promoted, what data and secrets each environment may hold, when it is frozen, and which harness, model and effort each agent role gets."
ports:
  required: [state, events]
  optional: [schedule, notify, registry, decide]
  declared: [author]
setting:
  _resolution: "Since 0.27.0, unsealed: RPLUGIN_POLISPEC_<KEY> env, then the short POLISPEC_<KEY> env (polispec.operator is POLISPEC_OPERATOR_NAME, polispec.edition has none), then the rplugin settings snapshot, then the native settings file (POLISPEC_SETTINGS, else $XDG_CONFIG_HOME/polispec/settings.yml), then the default. Sealed: the plane only."
  polispec.enforce: "advise logs every verdict and never blocks; enforce applies allow, warn and deny. Default advise."
  polispec.ledger: "Path of the host's ledger of governed projects. POLISPEC_LEDGER overrides it only while unsealed; sealed authority selects the protected ledger. Default ~/.config/polispec/ledger.yml (under XDG_CONFIG_HOME when set)."
  polispec.operator: "How deny and next-step messages name the person who promotes to stable and redeems allow-once. Default: the operator."
  polispec.code.specs_repo: "Path of the code specs repository. POLISPEC_SPECS_REPO overrides it only while unsealed. Default ~/polispec-specs."
  polispec.edition: "Requested edition standard or lock; default standard. EDITION lock cannot be downgraded through a mutable setting. Certification requires observed enforcement evidence."
  polispec.root_guard: "Initially false; a distinct follow-up exposure record can arm it. Lock refusal on root-equivalent or unknown exposure forces the guard."
  polispec.records.raw: "off or on; default off. on adds the classifier's raw view of the judged command or target (at most 2048 bytes) to each judgment record in local state; off keeps only the call digest. Raw text never goes through the events port."
  polispec.relax.dev: "on or off; default on. Kill switch for the in_development predicate: off (or POLISPEC_RELAX_DEV=off) makes it false everywhere, so the shipped rule TOOL-OPAQUE-DEVELOPMENT declares nothing and a governed eval, source or . line asks POLISPEC-TOOL-UNKNOWN in every project, as in 0.29.0."
  polispec.exceptions: "on or off; default on. Kill switch for persistent exceptions: off (or POLISPEC_EXCEPTIONS=off) honors no entry of exceptions.yml, records no proposal and appends no promote hint, so asks and warns read as in 0.28.3. polispec exceptions list still works."
  polispec.smoke.path: "Path of the smoke ledger. POLISPEC_SMOKE overrides it. Default smoke.yml at the git toplevel of the working directory."
  polispec.smoke.live: "on or off; default on. Kill switch for polispec smoke run --live: off (or POLISPEC_SMOKE_LIVE=off) records every live step blocked live_disabled without launching a harness."
  polispec.description.strict: "on or off; default off. off: a rulebook with no description, or one the linter rejects, is a description_missing or description_invalid warning from validate and doctor. on: validate fails it. The guard never judges by it."
  polispec.web.bind: "Address polispec web listens on; default 127.0.0.1. Any address that is not a loopback address is refused unless polispec web is started with --expose on a TTY after the typed phrase expose polispec web."
  polispec.web.port: "TCP port of polispec web; default 7421; 0 picks a free port."
  polispec.web.public_origin: "Optional exact HTTPS origin for an external reverse proxy; empty keeps local HTTP. Used for links, Host and Origin checks, and Secure cookies. Does not configure routing."
  polispec.web.theme: "Initial theme of polispec web: system (light or dark from the browser), light, dark, apple-noir, apple-austere or tronwave; default system. The browser's own choice overrides it per viewer."
  polispec.author.enabled: "on or off; default on. Kill switch for the author port: off (or POLISPEC_AUTHOR=off) makes every adapter raise unavailable before any process or request starts, and closes open sessions."
  polispec.author.adapter: "Adapter of the author port: harness-cli (built in, default) or the id of an adapter an rplugin extension declares under adapters: author:."
  polispec.notice: "on or off; default on. Kill switch for the in-band epoch notice the pretool hook adds once per session per epoch."
harnesses:
  claude-code: "supported: rplugin, the Claude Code plugin marketplace (SteveBenner/polispec), or polispec install --harness claude wires the guard hook; see docs/operator.md"
  codex: "supported: the Codex plugin marketplace (SteveBenner/polispec), polispec install --harness codex, or a host bridge wires the guard hook; see docs/operator.md; warn becomes deny with an allow-once id"
install:
  paths: "Since 0.27.0 polispec installs without rplugin: install.sh (fetch the newest or POLISPEC_REF tag, polispec pin, polispec install for each detected harness), a clone with bin/polispec pin and polispec install, the Claude Code and Codex plugin marketplaces, a gem built from polispec.gemspec (not published), or rplugin install polispec. rplugin hosts behave as before."
  guard_binary: "bin/polispec-guard runs the first usable polispec among POLISPEC_BIN, PATH, ~/.local/bin, the rplugin store, <data home>/current/bin/polispec, and last the polispec beside the shim; every candidate except the last must live outside the shim's directory, so a pinned release wins over a harness's cached copy. Since 0.33.1 a pretool reply the runtime writes with exit status 2 and a JSON object on stdout (a Hermes block, its fail-closed internal denial included) is passed through with that status; before 0.33.1 the shim treated every nonzero exit as a runtime failure, replaced the reply with the inline fallback and exited 0, so through the shim a Hermes deny was an allow unless the fallback pattern matched. Any other nonzero exit still takes the inline fallback. Since 0.33.2 the shim fails closed and has no inline fallback: it passes a reply through when polispec exits 0 (stdout printed when non-empty) or, in pretool mode, exits 2 with a JSON object on stdout; in every other case (no usable binary, any other exit status, or the 8 s deadline, POLISPEC_GUARD_DEADLINE 1 to 9, run with timeout -k 1 when timeout(1) is on PATH and a bash watchdog otherwise) a pretool call to a read tool (Harness::Base::READ_TOOLS, compared lower-case) passes with no output and every other pretool call is denied with exactly the bytes and exit status of HookCommand::FIXED_DENIALS for the harness (claude-code is claude and deepseek-tui is deepseek; an unknown harness name gets the reason on stderr and exit 2). Session mode exits 0 with no output on every failure. Each such decision appends one line to launcher.jsonl in the polispec state home with bash builtins: ts, tool, session, harness, mode, cause (no_binary, timeout or exit_<rc>) and decision (deny or pass). Stdin is read with head -c 8388609. There is no fail-open toggle; a user whose guard is broken repairs it from their own prompt."
  data_home: "POLISPEC_DATA_HOME, else $XDG_DATA_HOME/polispec, else ~/.local/share/polispec: releases/<commit>/ (read-only, .polispec-release.json schema polispec.release/v1), current (atomic link), source.git (bare fetch of the public repository when no local source exists)."
  install_receipts: "polispec install writes <state home>/installs/<harness>-<scope>-<digest>.json (polispec.install/v1): target, wired root, files written, links and backups. uninstall removes only marked hooks and links that still match the receipt and renames the receipt; backups are never deleted."
  hermes: "native pre_tool_call backend; runtime and consent unverified on the release host"
  pi: "skills-only; no native control backend"
  deepseek-tui: "skills-only; no native control backend"
  antigravity: "rplugin integration is skills-only. Separate explicit polispec installation generates agy CLI artifacts and protocol; native runtime unverified, GUI directive-only, lock unsupported."
  os: "sandbox planning; Bubblewrap namespace launch unavailable on the release host"
schemas:
  control: { id: polispec.control/v1, file: schemas/control.v1.yml, runtime: "Deterministic controls composed as an independent severity ceiling; mutable overlays may tighten only." }
  policy: { id: polispec.policy/v1, file: schemas/policy.v1.yml, path_in_project: specs/polispec/policy.yml }
  roster: { id: polispec.roster/v1, file: schemas/roster.v1.yml, path_in_project: specs/polispec/roster.yml }
  behavior: { id: polispec.behavior/v1, file: schemas/behavior.v1.yml, runtime: "Compiled data consumed by an application-owned adapter; authority comes from the release or authenticated package, never this declaration." }
  behavior_v2: { id: polispec.behavior/v2, file: schemas/behavior.v2.yml, since: 0.34.0, runtime: "Superset of v1 selected by its schema id. Adds directive scope, body_ref {path, sha256} for bodies kept outside the file (the compiled form carries body_sha256, never the text), duplicate_of, and the maps surfaces, frames, antifeatures, controls, messages and overlays.cutout. The compiled form polispec.behavior.compiled/v2 adds a surfaces map with the sha256 of each generated surface as rendered. A rule has one canonical directive; every other surface references it and is rendered from it." }
  environments: { id: polispec.environments/v1, file: schemas/environments.v1.yml, path_in_project: specs/polispec/environments.yml, note: "Read from the trust ref beside policy.yml and merged into it; the file wins over an inline policy environments block (finding environments_duplicate). Only the fields policy.v1 knows go to the engine; audience, exposure, host, operators, rollback, pii_spec, freezes and notes feed the [ENVS] render. A project's serves flag lives in its component manifest, not here." }
  smoke: { id: polispec.smoke/v1, file: schemas/smoke.v1.yml, path: "POLISPEC_SMOKE, then polispec.smoke.path, then smoke.yml at the git toplevel of the working directory." }
  judgment: { id: polispec.judgment/v1, file: schemas/judgment.v1.yml, path: "judgments.jsonl under the polispec state home, one record per line, rotated at 16 MiB to judgments.<utc timestamp>.jsonl; validate judgment checks one record." }
  exceptions: { id: polispec.exceptions/v1, file: schemas/exceptions.v1.yml, path: "exceptions.yml at the root of the global layer (polispec.global.repo, ref and path), committed through polispec apply global; read from the committed ref, the directory layer or the sealed bundle." }
  ledger: { id: polispec.ledger/v1, file: schemas/ledger.v1.yml, path: "Unsealed: POLISPEC_LEDGER, then polispec.ledger, then ~/.config/polispec/ledger.yml. Sealed: verified protected authority selects the ledger.", note: "Since 0.35.0 a project entry may carry owner {uid, name}, registered_by and description, and the ledger may list paths (governed path entries, see registration)." }
  change: { id: polispec.change/v1, file: schemas/change.v1.yml, path: "changes.jsonl under the polispec state home, chained like judgments; see effect." }
  session: { id: polispec.session/v1, file: schemas/session.v1.yml, path: "sessions.jsonl under the polispec state home, one record per SessionStart and SubagentStart; see effect." }
  manifest: { id: polispec.manifest/v1, file: schemas/manifest.v1.yml, note: "Generated, read-only; see manifest." }
  app: { id: polispec.app/v1, file: schemas/app.v1.yml, path_in_project: polispec.app.yml, note: "Authored by the app; see manifest." }
  index: { id: polispec.index/v1, file: schemas/index.v1.yml, note: "Host-wide index of the current user's governed apps and paths, plus published indexes of other users; see manifest." }
commands:
  - { name: behavior, status: built, usage: "polispec behavior compile FILE [--root DIR] | decide FILE EVENT FACTS.json | render FILE --surface ID [--root DIR] [--write] | drift FILE [--root DIR] [--surface ID]... [--json] | lint FILE [--root DIR] [--corpus GLOB]... [--json]", note: "since 0.18.4 decide renders empty arrays and maps as [] and {}; since 0.34.0 render, drift (exit 1 on drift) and lint (exit 1 when a surface, message, directive or corpus sentence of 8 or more tokens overlaps a directive's rule or body by 0.8 or more without naming it; duplicate_of exempts only the linked pair from each other)" }
  - { name: validate, status: built, usage: "polispec validate <policy|environments|roster|ledger|global|module|profiles|behavior|control|smoke|auto> <file> [--json]", note: "validate policy merges a sibling environments.yml when the policy has no environments block" }
  - { name: "plan, apply", status: built, usage: "polispec plan|apply <package> --repo REPO [--variant V] [--param k=v]... | project:<id> [--from REF|worktree] | global [--from REF|worktree] | ledger --from FILE  [--confirm PLAN_ID] [--commit] [--push] [--checkouts] [--with-stewardship] [--dry-run] [--json]", note: "since 0.21.0 replace onboard (removed, no alias). plan previews files, ledger effect, composed policy diff, synthetic probes and opted-in journal replay, classifies tightening|loosening|mixed|neutral and prints a plan id; apply carries it out, refusing confirm_required unless the plan is tightening or neutral and not global, or --confirm equals the recomputed plan id (plan_changed when stale). apply environment-control --variant service|distributed reproduces onboard's steps (files, manifest, ledger, render, commit, branches, push, checkouts). --with-stewardship first ensures the stewardship rule, the runtime protected root and a pinned runtime at the running version's tag; a failure aborts before any change." }
  - { name: steward, status: built, usage: "polispec steward [--check] [--json]", note: "since 0.22.0: the apply --with-stewardship steps on their own; --check only reports; since 0.27.0 the rule and pin steps run natively (rule links under <claude home>/rules/polispec/, polispec pin) when rplugin is absent" }
  - { name: pin, status: built, usage: "polispec pin [--ref TAG] [--source PATH|URL] [--dry-run] [--json]", note: "since 0.27.0: archives TAG (default v<VERSION>, whose VERSION must match) into <data home>/releases/<commit>/ read-only with .polispec-release.json, swaps <data home>/current atomically, links ~/.local/bin/polispec unless that path belongs to something else; source defaults to the clone runtime, the pinned release's source, or a bare fetch of the public repository; idempotent; never deletes an older release" }
  - { name: "install, uninstall", status: built, usage: "polispec install|uninstall --harness claude|codex|all [--scope user|project] [--project DIR] [--force] [--dry-run] [--json]", note: "since 0.27.0: Claude Code hooks in settings.json (PreToolUse, SessionStart, SubagentStart), Codex hooks as one marked block in config.toml, skill link, and at user scope the rule links; in-place backups, foreign hooks kept, refuses without --force when the polispec harness plugin is enabled; writes no Codex trust hash; uninstall removes only marked hooks and links matching the receipt" }
  - { name: "ledger init", status: built, usage: "polispec ledger init [--dry-run] [--json]", note: "since 0.27.1: writes config/ledger.starter.yml (schema, short hostname, envs_root ~/.polispec/envs, the example default rules, projects: []) to the resolved ledger path, 0600 in a 0700 directory, validated before the write; keeps an existing ledger untouched; ledger_sealed when the sealed plane names the ledger. polispec install at user scope and a package plan/apply on a host without a ledger create the same starter; the package plan lists it as a tighten change; doctor's ledger_missing names polispec ledger init" }
  - { name: settings, status: built, usage: "polispec settings list|get KEY|set KEY VALUE|unset KEY [--json]", note: "since 0.27.0: reads and writes the native settings file, validated against the settings in polispec.rplugin.yml; list names each value's source (plane, env:NAME, rplugin, file, default); refuses while the sealed plane is active" }
  - { name: "agents render", status: built, usage: "polispec agents render <project|repo> [--from worktree|REF] [--check] [--json]", note: "writes .agents/directives/envs.md and upserts the AGENTS.md line keyed by the [ENVS] opcode; doctor reports agents_drift when the trust ref disagrees with a fresh render; edits to the row or envs.md classify as policy.edit (impl environments FR-5 to FR-8)" }
  - { name: "hook git", status: built, usage: "polispec hook git pre-commit|pre-push|reference-transaction | install|uninstall <project> dev|test|prod|all [--dry-run]", note: "judges git operations in a live project with the same rules and environment resolution as the harness guard; shims chain to the previous core.hooksPath; POLISPEC_OPERATOR=1, set by polispec's operator git, skips them; a seatbelt for processes outside a harness, not a security boundary (impl environments FR-9)" }
  - { name: version, status: built, usage: "polispec version" }
  - { name: "hook pretool|session", status: built, note: "Bounded native envelopes, separate session handling, independent control ceiling, and minimal failure denial; positive diagnostic reads remain available. Since 0.18.5 a live ledgered project whose policy is missing or invalid at its trust ref is judged by global.yml fallback_rules (ledger defaults.rules when no global layer exists), never by an internal denial; claude deny and ask reasons begin [POLISPEC <rule_id>] DENIED: or WARNING:; next steps for a path no project owns name no project. Since 0.19.0 the harness-controls target resolver applies the same fallback policy instead of failing closed." }
  - { name: resolve, status: built, usage: "polispec resolve <path> [--layers] [--json]", note: "since 0.16.0 --layers prints the global, repo and child layer chain with each layer's digest and the effective digest; since 0.16.1 a path under the environment checkout root that names no environment, such as a release_dirs release or the shared bundle, resolves to prod, matching the engine" }
  - { name: classify, status: built }
  - { name: explain, status: built, usage: "polispec explain --harness HARNESS [--json] < hook-json", note: "since 0.26.0 judges one PreToolUse hook call through the same path as hook pretool (classification, environment outcomes, the harness-control ceiling with the undeclared MCP default) and prints the verdict the harness would get under enforce, whatever polispec.enforce is: verdict allow|warn|deny, rule_id, reason, governed, control verdict and ask_ids, and per action its class, server and operation and whether a protected or committed rule declares it. It is read-only: no judgment record, no polispec.control or polispec.judgment event, no fast-path refresh, no allow-once id and no protected authorization request or consumption (the explain adapter reports ask? true, so the ask composition returns before the authorization branch). Exit 0 when it judged, 2 on invalid input. For callers that must know before a headless session runs whether its tools pass, such as Teach's doctor" }
  - { name: "promote, deploy", status: built, usage: "polispec promote <project> --to <env> [--waive-soak] [--dry-run] [--json] | polispec deploy <project> <env> [--tag vX.Y.Z] [--skip-drain]", note: "since 0.17.0 --waive-soak (operator only, typed phrase waive soak for <project>, refused for test and when no soaked gate applies) reports the soaked gate as waived and records waived: [soak] on the promotion and its event; while stable carries no policy, promote and test deploys bootstrap from the candidate branch's committed policy (impl FR-4b); gate, step and after commands run without a shell, with $HOME, ${HOME} and a leading ~ expanded in each word (impl FR-4c); `hermetic.<env>` isolates variables into scratch and fails a run that writes under a protected root (a command gate with `hermetic: false` runs outside it, recorded as `hermetic: false` in the promote result), `deploy.strategy: release_dirs` swaps a release symlink and rolls back on failed health, `deploy.drain` pauses, waits, checks and resumes queues in the active release, and `polispec deploy <project> stable --skip-drain` skips the drain (terminal plus phrase `skip drain for <project>`); a policy that deploys without health is refused" }
  - { name: "pause, allow-once", status: built, note: "Unsealed terminal behavior retained; sealed authority authenticates the operator and consumes grants through the protected service. Since 0.18.4 the allow-once prompt and stored raw name the tool and absolute target of a file-tool call, and both commands refuse with not_tty or confirmation_failed like promote." }
  - { name: "roster resolve|check", status: built }
  - { name: "status, digest, doctor", status: built, note: "since 0.18.4 status <unknown> --json prints a JSON unknown_project error and exits 1; since 0.18.6 status reports a policy_invalid finding for semantic policy errors (missing deploy.health, environment names, profiles) exactly as promote does; digest reads warn and deny judgment records, and doctor reports judgments_chain_broken and judgments_truncated (see the judgments section); since 0.33.2 Operator::Gates.unreachable_errors reports a promotion gate (sha_ran_on, sha_ran_on_test or soaked, the implicit to_stable G-TESTED included) whose environment declares no deploy, and an after step polispec deploy {project} <env> aimed at such an environment: doctor files each as a blocking gate_unreachable finding, status shows a gate_unreachable finding when it has no other, validate policy reports them under /promotion, and plan project:<id> lists them as notes that change neither the classification nor the plan id; promote and deploy are unchanged" }
  - { name: judgments, status: built, usage: "polispec judgments list [--since 24h] [--session ID] [--project ID] [--json] | show <id> [--json] | verify [--json]", note: "reads the chained judgment stream; verify walks every rotation and the head anchor and exits 1 on a digest mismatch, a broken chain or truncation; since 0.30.1 a record that chains from the same prev as the record before it is reported as an interrupted_append in a separate interrupted list and does not fail verify; list and show never print raw text unless the record holds it" }
  - { name: exceptions, status: built, usage: "polispec exceptions list [--json] | add --command GLOB [--tool NAME] [--kind control|rule] [--rule ID] [--global] [--note TEXT] | promote PROPOSAL_ID... [--command GLOB] [--global] [--note TEXT] | remove ENTRY_ID", note: "since 0.29.0: persistent exceptions to guard asks (see the exceptions section). list is a benign read; add, promote and remove need a TTY and a typed phrase, refuse while the sealed plane is active, and commit exceptions.yml in the global shelf through the plan and apply global path" }
  - { name: harness, status: built, usage: "polispec harness grammar|parse|plan|install|verify|scan|uninstall", note: "Strict per-command options, dry-run for mutations, structured JSON results; docs/harness-controls.md. Since 0.18.7 uninstall --dry-run without --owner previews without root; scan returns ok:false with environment_scan_failed and its cause and exits 1 (3 before 0.19.0); since 0.19.0 uninstall --dry-run --owner previews without root, reads only what the current uid can read and reports each owner check it could not perform as owner_check_unverified; operation_id is opaque (64-hex or op_ plus 24 hex for plans, uninstall_ plus 24 hex for uninstalls)." }
  - { name: seal, status: built, usage: "polispec seal --from REPO@COMMIT | --source /etc/polispec/source [--dry-run] [--json]", note: "since 0.18.7 YAML dates in the bundle are normalised before schema validation, as the ledger loader does; the runtime manifest of the committed polispec release leaves image assets under assets/ (since 0.24.0) and the smoke ledger smoke.yml (since 0.25.1) out, and since 0.25.1 a runtime installed as an rplugin release enumerates that manifest from the source repository and commit its release descriptor records, never from a repository that merely encloses the install, failing runtime_source_unavailable when that source is missing" }
  - { name: plane, status: built, usage: "polispec plane status|verify|activate|rollback", note: "Activation and rollback require an authenticated protected operator; development does not activate live projects." }
  - { name: authorizations, status: built, usage: "polispec authorizations status|unit|serve|recover", note: "Fixed local socket; unit renders without installing; request and consume have no remote redemption operation." }
  - { name: delegate, status: built, usage: "polispec delegate grant APP --projects P[,P] --verbs V[,V] --targets T[,T] [--flags F[,F]] [--json] | revoke APP | list [--json] | serve | unit [--json] | status [--json]", note: "since 0.31.0; see the delegation section" }
  - { name: smoke, status: built, usage: "polispec smoke record|list|show|verify|coverage|run", note: "Appends and reads the smoke ledger; since 0.23.0 run executes the bundled suite; see the smoke section." }
  - { name: web, status: planned, usage: "polispec web [--bind ADDR] [--port N] [--expose] [--open] [--read-only] [--json]", note: "since 0.35.0; see the web section. Run by an agent it classifies policy.edit." }
  - { name: manifest, status: planned, usage: "polispec manifest <project|path> [--write] [--json|--yaml] | index [--publish|--unpublish] [--json]", note: "since 0.35.0; see the manifest section. --write commits polispec.manifest.json and .polispec/badge.svg on main; index --publish needs a TTY." }
  - { name: register, status: planned, usage: "polispec register <path> [--kind software|directory|system] [--id ID] [--description TEXT] [--dry-run] [--confirm PLAN_ID] [--json] | unregister <id> [--confirm PLAN_ID]", note: "since 0.35.0; see the registration section. Plans and applies the ledger target." }
  - { name: changes, status: planned, usage: "polispec changes list [--since 24h] [--json] | show <id> [--json] | await <id> [--timeout 600] [--active 1h] [--json] | verify [--json]", note: "since 0.35.0; see the effect section." }
  - { name: sessions, status: planned, usage: "polispec sessions list [--active 1h] [--json] | show <session_id> [--json]", note: "since 0.35.0; see the effect section." }
  - { name: editions, status: planned, usage: "polispec editions [--check] [--json]", note: "since 0.35.0: prints specs/editions.yml for the running release; --check exits 1 when a feature gated by Editions.allowed? has no registry row or a row names code that does not exist." }
  - { name: author, status: planned, usage: "polispec author draft <policy|module|package|environments|roster|global|spec|description> --intent TEXT [--for PROJECT] [--adapter ID] [--json] | adapters [--json]", note: "since 0.35.0; see the author section. Prints a validated draft and its plan; writes nothing." }
composition:
  summary: "Environment policy composes recursively. A policy, the global layer and every module may include modules; a module may include modules, to any depth. Nested ledgered projects stack beneath the project that owns the path, nearest last, to any depth. Across layers the strictest verdict wins and a lower layer loosens only a rule marked overridable that it names in overrides. Since 0.32.0 the first layer of every chain is shipped: modules/tool-declared.yml from the polispec release (Layers::SHIPPED_INCLUDES), composed on every host before the global layer, every rule overridable, so the shelf tightens a shipped rule with a plain rule of its own and loosens one only by naming it in overrides; polispec resolve <path> --layers prints it first. Since 0.33.0 the shipped layer composes modules/tool-declared.yml and modules/delete-guard.yml (see delete_guard)."
  ownership: "Since 0.20.0 the outermost ledgered repo or worktree root containing a path owns it, regardless of ledger order; environment checkouts are unchanged. Every nested ledgered project between that owner and the path is a child layer."
  modules: "A module name resolves to the global shelf (polispec.global.*, modules/<name>.yml) or, since 0.20.0, to a project-local module at <directory of the policy>/modules/<name>.yml read from the same source as the policy: the trust ref, the bootstrap ref, or the sibling directory of a POLISPEC_POLICY file. A local module may include local and global modules; a global module sees only the global shelf. A name present in both is an ambiguous_module error and that include is not applied. A shipped module is read only from the release tree and never from a shelf; a shelf module of the same name is an ordinary shelf module."
  parameters: "Since 0.20.0 a module may declare params (name to type string, integer, number, boolean or list, with optional default and summary). An include is a module name or { module, with }. A string value that is exactly {{name}} becomes the typed value; {{name}} inside other text interpolates it. Module includes substitute too, so a module passes its parameters down. A missing required, unknown or mistyped parameter, or an unresolved placeholder, is an error and the instance is not applied. Each distinct module and resolved-parameter pair is one instance, expanded once; two instances in one layer that yield the same rule, gate or freeze id is an error."
  children: "Since 0.20.0 a child layer expands the child's own includes (with the child's local modules) ahead of its rules, and the owning project's composed policy receives every descendant's promotion gates (to_test, to_stable), to_stable preflight, freezes and hermetic, and those of their modules. A gate a child contributes carries dir, the child's path relative to the owner, so its run executes in the child's directory. A child-contributed gate or freeze id equal to one already in the owner or global composition is an id_collision error and the child copy is not applied."
  failure: "Composition errors (include cycle, missing or ambiguous module, parameter errors, id collisions, invalid overrides) are reported by validate, doctor (layers_invalid) and resolve --layers, emitted as a layers_invalid finding, and since 0.20.0 make promote refuse with policy_invalid instead of promoting with fewer gates."
  digest: "A layer digest covers the policy, every expanded module text and each instance's resolved parameters, so a change to a local module at the trust ref changes the effective digest. Since 0.32.0 the shipped layer digest is part of every effective digest and of Layers.fingerprint (the baseline target digest and the fast-path key), so a polispec release that changes modules/tool-declared.yml changes every effective digest on the host."
stewardship:
  summary: "Since 0.21.0 meta-level work on polispec (developing it, installing, upgrading or repairing it, applying packages and project specs, changing the global shelf or the ledger) has its own shipped rule, rules/polispec-stewardship.md, and mechanisms: a pinned runtime, a protected runtime root, packages, and one plan/apply verb under a confirmation gate."
  runtime: "Polispec::Runtime reports kind pinned (an rplugin release: ROOT/.rplugin-release.json, schema rplugin.release/v1, commit equal to the directory name), sealed, clone or unknown, and the commit. Pinned releases come from rplugin install <root> --ref <ref> (read-only archive under ~/.rplugins/.pinned/<id>/<commit>/, store link swapped atomically) or, since 0.27.0, from polispec pin (ROOT/.polispec-release.json, schema polispec.release/v1, under <data home>/releases/<commit>/; Runtime.release_kind native, doctor prints pinned (native)). doctor verifies a pinned release's tree digest and checks edition provenance against the recorded source repository."
  protected_runtime: "Built-in protected root R-POLISPEC-RUNTIME at the realpath of the running polispec: deny when pinned, warn when the runtime is a working clone, none when sealed (the plane protects it) or unknown. Since 0.24.0 the runtime verdict and the policy's own first-match verdict are both computed and the stricter wins, a tie keeping R-POLISPEC-RUNTIME, so R-PROD-FS still denies a write inside a clone runtime that is also a production checkout. Writer rplugin."
  packages: "packages/<name>/package.yml (polispec.package/v1): name, version, summary, params (module param shape), variants with files, shared files, modules copied to specs/polispec/modules/, and ordered built-in steps (files, manifest, ledger, render, commit, branches, push, checkouts) with optional when: { param, equals }. No arbitrary command steps. Sources: shipped packages/ and the global shelf packages/; a name in both is ambiguous. environment-control (variants service, distributed) is the former onboard flow. Since 0.33.2 (package 1.1.0) the distributed variant carries the same placeholder deploy and health blocks for test and prod as the service variant; before, its after steps deployed environments that declared no deploy, so G-TESTED could never pass."
  ledger_record: "Project entries record packages: [{ name, variant, version, applied_at, files: { path: sha256 } }]. status shows them; doctor reports package_upgrade_available and package_file_drift. An upgrade replaces files still equal to their recorded digest and reports edited files as conflicts, untouched."
  plan_targets: "A package; project:<id> (proposed specs at a ref or the main worktree vs the trust ref); global (proposed global path vs the configured global ref); ledger --from FILE (proposed vs live ledger)."
  classification: "Probe or journal verdict severity up is tighten, down is loosen. Removed rules, gates, freezes, modules, protected roots or hermetic entries loosen; added ones tighten. Adding an onboarding ledger project tightens; changing an existing entry's status, profile, trust_ref, repo or retirement loosens. needs_confirm when the classification is loosening or mixed, or the target is global."
  confirmation: "plan_id is plan_ plus 24 hex of sha256 over the target, proposed and current digests and the classification. apply --confirm PLAN_ID is classified policy.edit by the guard, so live policies warn and the harness asks the user."
  journal: "plan replays the per-action rows of the judgment records of the last 14 days (project, env, class, tool, ref, home-relative path, crosses, destructive, shape, verdict, rule id) as actions against the current and the proposed rulebook; polispec.verdicts.journal and journal.jsonl are gone, the rows are always recorded (see the judgments section), and the plan output still labels the replay journal."
  steward: "Since 0.22.0 polispec steward runs the stewardship steps alone and polispec steward --check reports them (status missing names what would run) without changing anything, exit 1 when any step is unsatisfied. Step 1 also requires, with rplugin 1.15.0 or later and a Claude Code home, the rule link <claude home>/rules/rplugin/polispec/polispec-stewardship.md, repaired with rplugin install polispec. Since 0.27.0, when rplugin is not executable, step 1 instead links <claude home>/rules/polispec/polispec.md and polispec-stewardship.md (ok with no Claude Code home) and step 3 runs polispec pin --ref v<VERSION>; with rplugin every step is unchanged."
  with_stewardship: "apply --with-stewardship ensures, in order and skipping what holds: the stewardship rule installed through rplugin (or linked natively without it), the runtime protected root active (kind clone or pinned), and the runtime pinned with rplugin install --ref v<running version> (or polispec pin without it). Any failure aborts before the apply changes anything."
  contract: specs/stewardship.impl.yml
extension_points:
  commands: "lib/polispec/commands/*.rb is glob-loaded; a file calls Polispec::CLI.register(name, klass, summary:) and klass responds to run(args) returning an exit status, either as a class method or on a new instance."
  classifier: "lib/polispec/classify/commands/*.rb is glob-loaded; a file calls Polispec::Classify::Registry.register(family, klass) and klass responds to call(tool_name, tool_input, cwd) returning [Polispec::Action]."
  author_adapters: "Since 0.35.0 lib/polispec/author/adapters/*.rb is glob-loaded and calls Polispec::Author.register(id, klass); an rplugin extension adds one by mapping adapters: { author: lib/author.rb } in its extension.yml under the declared port (ports_declared). The rllm adapter ships in rplugin's rstack extension as extensions/rstack/lib/author.rb, never in polispec."
  web_routes: "Since 0.35.0 lib/polispec/web/routes/*.rb is glob-loaded; a file calls Polispec::Web.route(name, klass) with a Roda hash-branch block. Each route declares mutating: true or false; mutating routes need the session cookie and a CSRF header, and polispec web refuses to start at all where the edition registry excludes web (lock)."
  ports_declared: "Since 0.35.0 polispec.rplugin.yml declares ports.declared: [author]. rplugin (with plugin-declared ports, a release in the same change) lets a fleet or os extension map an adapter to a declared port, and Ports.for(\"polispec\").author resolves extension adapters first, then polispec's standalone Polispec::Author::Standalone (the harness-cli session). Without rplugin, or with an rplugin that predates declared ports, polispec uses the standalone directly and polispec author adapters reports why no extension adapter loaded."
  script_files: "Since 0.32.1 the shell parser follows a shell script file the line runs and classifies its commands as if they were written in the line: the first operand of bash, sh, zsh, dash, ksh or ash after their options (none with -c, which stays the -c body, or with -s), and a command path containing a slash that is an executable file with a shell shebang, or with no shebang and the .sh extension. The body is the content an earlier command of the same line wrote with cat > FILE or tee FILE fed by a heredoc or here-string, else the file on disk up to 1 MB (Shell::MAX_SCRIPT_FILE), followed to MAX_DEPTH. The line is opaque (shape opaque_shell under the control gate, exactly as eval and source) when the operand is dynamic, the file is missing, unreadable or larger than the bound, the depth is exhausted, the same line wrote that path with content the parser does not know (an echo or printf redirect, an append, a heredoc read only after the run on the same line), or wrote any file through a dynamic target. A followed script's host command is not counted for chained_release, as a -c host is not. Not followed: scripts reached through PATH and interpreters other than shells. Since 0.35.0 source FILE and . FILE are followed by the same rules (operand resolved against the line's cwd; the file's variable assignments, exports and cd carry into the rest of the line, because sourcing runs in the current shell), and the source command itself is then not an opaque command; eval stays opaque. Following is bounded per line by Shell::MAX_FOLLOWED_COMMANDS (1000 commands parsed from followed files, across depth) and Shell::FOLLOW_DEADLINE (0.5 s); past either bound the line is opaque, so following never pushes the hook past its budget into a fail-closed deny. Since 0.35.0 a followed script or sourced file is also opaque when any classified write action of the same line (cp, mv, ln, install, rsync, sed -i, a download, an archive extraction or any other) targets the followed path or its realpath, because the parser would otherwise read the file as it was before the line ran; before 0.35.0 such files were read from disk."
  tmux_kill: "Since 0.32.1 tmux kill-server and tmux kill-session with neither -L nor -S before the subcommand carry shape tmux_kill and add one service.control action (env_hint command tmux and the subcommand), because such a call reaches whatever server TMUX or the default socket names; on 2026-10-17 an agent's scratch script killed the live rterm agent server that way. A call that names its server with -L or -S is not tagged. No shipped rule matches the shape; a shelf or project rule governs it."
  root_containment: "Since 0.32.2 Engine::Envs.under? holds every path under the root /. Before, it tested the prefix //, so a root of / contained nothing: match.live_binary missed rm -rf / (G-LIVE-BINARIES denied rm -rf /usr/lib and rm -rf ~ but allowed rm -rf /), and a protected root, hermetic protected root or policy checkout at / would have covered nothing. Every caller of Envs.under? (running_from, global_loc, protected_loc, by_policy_checkout, spec_path_hit? and RuntimeGuard.inside?) shares the fix."
code_specs:
  status: built
  summary: "Code specs: a tree of composable policies applied per language whenever an agent writes code. The policy is the atomic entity; a policy with subpolicies is composite; a spec is the root policy of one spec file, mounted at a path (code, code/ruby, code/ruby/code_quality, code/ruby/code_meta, code/code_meta)."
  fundament: "Every policy carries an execution class (harness, agent, hybrid, contextual). The class is set when the policy is authored, by the classifier model and reviewed by the operator, and stored in the spec. At runtime the harness reads it with no model call, except for contextual policies, whose applicability the classifier decides per event."
  models:
    classifier: "A local decide port when the host provides one, otherwise a hosted model fallback; set by the host"
    interpreter: "A model at medium effort that reviews agent-class policies against the task diff; set by the host"
  binding: "Language is detected from the file before each write. The language's directives are injected once per session per spec digest before the first write. Harness-class checks run on the changed lines; MUST violations block, SHOULD violations warn. Agent-class policies are reviewed at task end."
  legacy: "Ratchet: only violations on changed lines block; pre-existing violations are recorded in a per-repo baseline that may only shrink."
  controls: "Every harness and hybrid policy ships a negative-control fixture that must trip its enforcer (polispec check --controls). Controls are checker machinery under NOTEST and live only in the code specs repository."
  source_of_truth: "The code specs repository is the single source for code directives; a host generates directive rows and guards for code rules from, or calls into, their policies."
  specs_home: "~/.polispec/specs, a symlink to the specs/ directory of the code specs repository named by the polispec.code.specs_repo setting"
  schema: { id: polispec.spec/v1, file: schemas/spec.v1.yml }
  waivers: { id: polispec.waivers/v1, file: schemas/waivers.v1.yml, path_in_project: specs/polispec/code-waivers.yml }
  commands:
    - { name: "code detect|chain|show|check|validate|baseline|controls|generate|classify", status: built, note: "since 0.18.7 code classify on a file that defines no policy rules says why and exits 1" }
    - { name: "specs link|status|promote", status: built, usage: "polispec specs link|status|promote [--repo DIR] [--dry-run] [--json]", note: "since 0.18.7 specs link creates a missing ~/.polispec/specs link or confirms one already at <repo>/specs without asking; repointing an existing link at a different target needs an interactive terminal and the typed phrase relink <full target path> (the absolute <repo>/specs path; relink specs before 0.19.0), and an agent shell is refused with not_tty and exit 1; a wrong phrase is confirmation_failed; --dry-run previews and names the phrase" }
    - { name: "code-hook pre|post|stop|session", status: built, note: "--harness claude and --harness codex accept exactly the event of their mode: pre PreToolUse, post PostToolUse, stop Stop, session SessionStart. Any other event, or a payload that fails to parse, makes the hook print a one-line diagnostic on stderr and exit 0 without checking; it never fails silently." }
  settings: [polispec.code.enforce, polispec.code.check_at, polispec.code.inject, polispec.code.specs_repo]
  ports_optional: [decide]

deployment_receipts:
  contract: polispec.status.deployments/v1
  command: polispec status <project> --json
  fields: projects[].deployments.<env> contains receipt, latest_attempt, and verified
  receipt: last successful deployment; record_id, sha, tag, health, pinned_behind, and at only
  latest_attempt: last appended deploy record; id, sha, tag, health, pinned_behind, and at only
  verified: same nonempty record identity, sha, and tag; both health ok and pinned_behind false
  fail_closed: missing, malformed, legacy receipts without record identity, unchecked health, and newer failed attempts are unverified
  limits: evidence of the completed deployment health check, not continuous availability; consumers must match current stable ref and tag

harness_controls:
  release_activation: "Since 0.23.0 harness_controls ships true by operator direction (config/harness-features.yml): the guard applies the control ceiling, unknown-call and undeclared-MCP defaults, and harness install and verify are enabled. sealed_plane stays false: sealing, plane activation, uninstall and the authorizations service remain gated. Since 0.24.0 one uninstall is open on an unsealed host (plane status unsealed, never broken or active): a non-root user removes a user- or project-scope overlay whose unprotected receipt carries their own owner_uid, after typing uninstall INSTALLATION_ID on a TTY; receipts written before 0.24.0 carry no owner_uid and still need the operator. No host or project activation occurs on install."
  benign: "Since 0.23.0 Classify.benign? positively recognises calls that are not unknown: harness-internal tools (TodoWrite, TodoRead, Skill, ToolSearch, AskUserQuestion, EnterPlanMode, ExitPlanMode, TaskOutput, TaskList, TaskGet, TaskCreate, TaskUpdate, TaskStop, ListAgents, SendMessage, Glob, LS, update_plan, view_image, and since 0.28.3 SubagentHandback, StructuredOutput and ScheduleWakeup) and fully parsed shell lines whose every command is a read-only name with no write flag or a read-only git subcommand, with no substitution, wrapper, environment prefix or file redirection. Classify.positive gives WebFetch and WebSearch a known web.fetch action and Agent and Task a known agent.spawn action, judged by policy like any classified action. Since 0.23.1 a shell line the parser fully parses (at least one command, no eval, source or . builtin) is also not unknown, even when it is not benign: the shell classifiers have judged every command in it, so its classes, or none, go to policy as in 0.22.0. Unparseable shell lines, eval and source lines, and non-shell tools with no positive class stay unknown; with harness_controls false nothing changes. Since 0.24.0 a governed line that runs eval (recorded by the shell parser when it unwraps eval, at any nesting depth), source or . adds the POLISPEC-TOOL-UNKNOWN ask to whatever its commands classify as; the words in quoted strings, heredoc bodies fed to non-shells and grep patterns do not count. Since 0.30.0 that ask is not added when the working directory is in development: Ledger#development returns the project ids when at least one non-retired ledger project contains the directory (its repo root or a worktree glob), every such project has status onboarding, and the directory is not inside an env checkout under envs_root. Since 0.30.2 the directory of every command the parser finds in the line must be in development or in no non-retired ledger project at all (Ledger#locate returns nil), because agents change into a session scratch directory under /tmp to source an env file they wrote; a line that changes into a live project, a live project containing an onboarding one, or a checkout before it sources keeps the ask (0.30.0 and 0.30.1 asked for any directory outside development, which kept the ask on those scratch directories). A live project, a live project containing an onboarding one, a test or stable checkout, a session that itself starts in an unowned path, the lock edition and polispec.relax.dev off keep the ask. Only the opaque trigger is relaxed: a line the parser extracts no command from, an unrecognised tool and an undeclared MCP operation still ask, and the visible commands of the line are judged as before, so a push to stable written in the line, or inside a literal eval, is still denied. A relaxed call carries relaxed in its judgment record. Benign git refuses -c, --config-env, --exec-path, --paginate and -p only among the global options before the subcommand, so git log -p and git show --stat are benign reads. Since 0.28.2 the Claude Code Monitor tool is a shell tool: its command is canonicalised to Bash (Harness::Base::SHELL_TOOLS) and covered by the container root guard (HarnessControls::RootGuard::SHELL_TOOLS), so a loop or pipeline of known commands in it is judged like the same Bash line instead of asking POLISPEC-TOOL-UNKNOWN, and a push to stable or a privileged container run in it is judged as in Bash. Since 0.32.0 the library keeps detection only: Classify.benign? recognises benign shell lines alone (INTERNAL_TOOLS is gone); under the control gate in governed scope a non-shell tool that no classifier family and no positive class turns into an action yields one tool.internal action, a read tool (Harness::Base::READ_TOOLS) with no path one tool.read action, and a governed eval, source or . line one shell.exec action with shape opaque_shell whose env_hint cwds carries the directory of every command the parser finds, each marked unknown_tool. The shipped module modules/tool-declared.yml (composition row) declares them: TOOL-<NAME> allow rules with match.tool and class [tool.internal] for the harness-internal tools, TOOL-READ-<NAME> with class [tool.read] for the read tools, and TOOL-OPAQUE-DEVELOPMENT allow on shape [opaque_shell] with the in_development predicate, which applies Ledger#development to the line's directory and to every command directory exactly as 0.30.2 did in HookCommand#dev_projects (removed), and is false under the lock edition and under polispec.relax.dev off. The guard lifts the unknown mark of an action a trusted rule declares (unknowns row); a declared action is then judged by environment policy like any other, so a shelf rule naming the same tool with a stricter verdict wins across layers. A declaring rule whose match has in_development true stamps relaxed on the judgment record as before. match.tool compares case-insensitively. An undeclared tool (CronCreate, Artifact, a misspelt name) asks exactly as before."
  fastpath: "Since 0.23.0 Fastpath.refresh also writes fastpath.tools beside fastpath.txt: * without a governed baseline. Since 0.32.0 the list otherwise derives from the shipped layer: the match.tool names of shipped allow rules with class [tool.internal] or [tool.read] that bin/polispec-guard may skip, minus the read tools when a composed global or module rule governs reads (class secrets.read, a match.tool naming a read tool, or neither class nor shape), minus every tool a global or module rule names in match.tool, and empty when such a rule has class tool.internal or tool.read with no tool. Any other tool, MCP included, reaches polispec; a missing fastpath.tools makes the fast path stale."
  unsealed_asks: "Since 0.23.0, with the plane not active, an ask set made only of environment-policy warnings keeps the legacy verdict (a harness without native ask, such as Codex, gets deny with a redeemable allow-once id). A control ask still requires the protected authorization service."
  contract: specs/harness-controls.impl.yml
  schema: polispec.control/v1
  result: polispec.harness.result/v1
  capability_inventory: data/harness-capabilities.yml
  edition: "main contains standard; polispec-lock differs only by EDITION lock. Each checkout operates independently; lock provenance uses its immutable parent without a local main ref. A lock executable refuses an active standard-plane mismatch. One authority plane per host; requested edition is distinct from certification."
  translation: "The calling agent produces the deterministic grammar or YAML; control judgement uses no model."
  ownership: "Native harness artifacts and the sealed authority plane are polispec-owned domain files. Back up before mutation; preserve foreign contributions. Service capabilities continue through Rplugin::Ports.for(polispec)."
  authority: "Fixed /etc/polispec/active.json; valid root-owned provenance and pinned runtime/SDK. Invalid existing authority is broken, never an unsealed fallback. Standard seals an exact Git commit; lock reads root-authored /etc/polispec/source."
  tightening: "Agents may add provably tightening user/project controls. Removal, managed scope, core changes, loosening, and uncertain comparisons require the authenticated operator."
  judgement: "Environment policy keeps first-match order; controls independently cap severity. Explicit denials, protected targets, root guard, broken authority, and lock defaults cannot be redeemed."
  input_bounds: { ir_bytes: 1048576, controls: 256, hook_bytes: 8388608, hook_seconds: 7, launcher_seconds: 8, harness_seconds: 10, note: "Since 0.33.2 the hook reads at most 8 MiB (HookCommand::INPUT_LIMIT; 65536 before) and denies a larger call with the harness fixed reply whose reason is hook input exceeds 8 MiB; the Ruby budget is 7 s (HOOK_BUDGET; 9.5 before), the launcher deadline 8 s and the harness hook timeout 10 s, so a reply always comes from polispec or its launcher and never from a harness timeout. polispec harness grammar reports hook_input_bytes and hook_seconds from those constants. Since 0.33.2 a hook call composes each project's policy at most once: PolicySource.memoize, opened by HookCommand#run for pretool and session, keeps every composed policy for that call only, keyed by project id, repo, trust ref and policy path, and gives each caller its own copy; before it, each path in a command recomposed every live project's policy, and one ordinary Bash call composed 2,101 times and ran out the budget." }
  unknowns: "Standard asks and lock denies undeclared MCP and unknown non-read calls in enforcing governed scope. Every MCP action needs a matching declaration in trusted policy or protected core; overlays cannot supply an allow declaration. Trusted policy is every layer the engine composes for the action's target: the global shelf, its included and profile modules, and a live project's committed policy, so a rule with an exact match.server and match.operation in any of them declares that operation for onboarding and unowned paths as well as live projects. A declaration carries class [mcp.call] so it does not count as a rule that governs reads. Protected-authority checks deny an fs.write, fs.delete or control.edit whose path is a protected path, lies inside one, or is an ancestor of one; since 0.23.1 the ancestor match does not apply to the fallback write an unrecognised program gets on its working directory (env_hint unknown), so running such a program from the home directory is not a write over the runtime, while an explicit recursive change, move or delete of an ancestor still is. Since 0.24.0 a policy.edit whose target is a protected path or lies inside one (a shell redirect, Write or Edit of the ledger) is denied the same way; a policy.edit whose target is an existing directory, as polispec apply emits for its working directory or --repo, is not, and the ancestor match never applies to policy.edit. Since 0.25.0 a control ask is carried by the judgment record's control block (verdict warn and the ask ids) and no polispec.verdict event is emitted. Since 0.28.1 a mkdir operand the parser cannot resolve (a variable or a command substitution) is that same fallback write (env_hint unknown) instead of a write of the working directory, so creating a scratch directory named by a variable from the home directory is not a write over a protected root; a static mkdir target, and an unresolved operand of every other command, keep the ancestor match. Since 0.28.1 zcat, zgrep, zegrep, zfgrep, zless, zmore, bzcat, xzcat and zstdcat classify as reads of their file operands like cat and grep (secrets.read candidates), and gzip, gunzip, bzip2 and xz with -c, -t or -l (alone or in a short-option cluster), --stdout, --to-stdout, --test or --list write nothing and read their operands; a shell redirect still classifies as the write it is. Since 0.29.0 an unknown-tool or undeclared-MCP ask is lifted when every trigger that causes it is covered by an exception of the global layer (see the exceptions section); a line that still has an uncovered trigger asks about all of them, and the lock edition honors no exception. Since 0.30.0 the ask for an opaque eval, source or . line is not raised in a project in development (the benign row), and an exception is then not needed for it. Since 0.32.0 an unknown-tool action is declared the way an MCP operation is: by a rule in trusted policy, the shipped layer included, whose match names the exact tool (match.tool, case-insensitive) for a tool.internal or tool.read action, or whose match.shape includes opaque_shell for an opaque shell line, and that matches the action in full (env, path, class, role and predicates included), picked across layers by the strictest verdict. For a target with no trusted policy (policy_source controls: no shelf and no live project) only the shipped layer's rules declare, and no rule declares an MCP operation there. The edition default (warn or deny) and the exceptions lifter are unchanged."
  failure: "Non-read calls fail closed; only an entirely positive diagnostic-read envelope qualifies for the failure exception. Mixed, malformed, shell, MCP, web, and delegation calls do not. Since 0.33.2 the same holds when the Ruby hook gives no reply at all: bin/polispec-guard denies every non-read pretool call it cannot get a verdict for (install guard_binary row), so a missing, failing or slow runtime no longer lets calls through."
  overlays: "Effective installed receipts require authenticated transaction relationships, canonical targets, current owned contributions, and bounded state. Valid successor history may replace prior artifact bytes; unrelated supersession is refused."
  exposure: "First root-equivalent exposure advises; a distinct continuing scan arms root_guard. Protected scans validate provenance and exact observations; corruption conservatively arms. Rootless is a separate observation."
  events: "Lifecycle and authorization events use the plugin events port after state commits. Events carry identities and outcomes, never tool payloads or authority redirect values. Event failure cannot loosen a verdict. The polispec.judgment event is a copy of the local judgment record without its raw field: targets, rows with home-relative paths and refs, engine identity and the outcome, never tool arguments."
  native_evidence: "Release-host parser/version and isolated scratch evidence only. No native lock certification, paid model journey, root-owned host seal, host service installation, timer activation, or live-project activation."
protected_authorizations:
  socket: /run/polispec/authorizations.sock
  kill_marker: /etc/polispec/authorizations.disabled
  identity: "Client authenticates a root peer; server authenticates request UID from kernel peer credentials. Redemption is a local protected operator action."
  binding: "Exact generation, project, canonical action, complete tagged ask set, trusted policy/control digests, actual harness/session, and requesting UID. One standard grant can resolve combined environment/control asks; independent denials remain binding."
  consumption: "Durably record consumption before replying. Replay, concurrent consumers, changed authority, unavailable service, and lost replies never produce another grant."
  bounds: { request_bytes: 16384, response_bytes: 32768, deadline_seconds: 2, ttl_seconds: 600, backlog: 8, inflight: 1, uid_requests_per_minute: 60, global_requests_per_minute: 300 }
  deployment: "Built, not installed or started on the release host. Unit rendering and stale-socket recovery are explicit operator commands."
delegation:
  summary: "Since 0.31.0 the operator can let an application run polispec promote and deploy for them, for example from a button in the application's own console. The operator grants the application a scope at a terminal, and a polispec-owned runner runs the granted commands in its own process with the output kept for the application to read. Confirmations that need a typed phrase are relayed from the application to the same exact-match check the terminal uses."
  grant: "polispec delegate grant APP --projects P,... --verbs promote,deploy --targets test,stable [--flags ...] needs a terminal and the typed phrase grant delegation to APP, refuses on a sealed plane, checks each project against the ledger, and prints a one-time app token pdt_<64 hex> that the operator stores in the application's protected secrets. Only its sha256 is kept. revoke APP (phrase revoke delegation from APP) removes the grant; a new grant for the same app replaces the old token. Flags are a subset of --dry-run, --json, --tag, --waive-soak and --skip-drain, default --dry-run, --json and --tag; --tag applies to deploy only."
  storage: "<state home>/delegate/grants.yml (schema polispec.delegate_grants/v1, mode 0600, at most 16 grants and 16 KiB). A file that is missing, oversize, invalid, not owned by the user or writable by group or others means no grants. The file is a protected path: a Write, Edit or shell redirect into it classifies as policy.edit."
  runner: "polispec delegate serve listens on $XDG_RUNTIME_DIR/polispec/delegate.sock (else <state home>/polispec/delegate.sock), directory 0700, socket 0600, peer uid checked with SO_PEERCRED. It refuses to start on a sealed plane, while <state home>/delegate/delegate.disabled exists, or while another listener answers; a stale socket is renamed, never deleted. polispec delegate unit renders a systemd user unit and installs nothing. The runner is separate from the application's units, so a deploy that restarts the application keeps running and its output stays readable."
  protocol: "One JSON line per connection, request at most 16 KiB, reply at most 128 KiB, 5 s read deadline. Every operation but ping carries app and token (unknown app and wrong token answer the same unauthorized) and is rate limited to 60 a minute per app. Operations: request {argv, by} starts a run when the argv after polispec is inside the grant (out_of_scope with the reason otherwise; busy while a run of the same project is active or two runs are active); output {run_id, offset} returns up to 64 KiB of output from a byte offset, the state (running, waiting_phrase, succeeded, failed, cancelled, timed_out), the exit code and, while waiting, the prompt and the exact phrase asked; phrase {run_id, text} forwards one line once to the waiting confirmation; cancel {run_id} terminates the run's process group (KILL after 10 s); status returns the scope and active runs. While the kill marker exists or the plane is sealed, every authenticated operation answers disabled."
  runs: "Each run forks a child that starts its own session, reads /dev/null, writes stdout and stderr to <state home>/delegate/runs/<drn_ id>.log (0600; logs older than 30 days are removed at start), and runs the CLI in process with a delegated confirmer. Operator::Tty.confirm! and Gates.interactive? honor that confirmer only; it is set in process, never from the environment, a file or an argument. The confirmer writes the prompt and phrase to the log as the terminal would, waits up to 10 minutes for the application's text, compares it exactly, and logs only its length. Runs time out after an hour and expose at most 8 MiB of output. Starts and ends are appended to delegate_runs.jsonl, promotion and deploy records and their events carry via delegate:<app>:<by>, and each run emits polispec.delegate."
  exceptions_verbs: "Since 0.35.0 a grant may name the verbs exceptions-add, exceptions-promote and exceptions-remove (the web app's grant), so the runner relays the typed phrase of polispec exceptions add, promote and remove exactly as it does for promote. Excluded from lock (specs/editions.yml exceptions.delegate_promote): under lock a grant naming them is refused and the runner answers disabled."
  guard: "polispec delegate grant, revoke and serve run by an agent classify as policy.edit, which the host defaults and the environment-control packages warn on; list, status and unit are benign."
  limits: "Delegation is the unsealed terminal confirmation made reachable from an application, not operator authentication: whoever holds the app token and can type the phrase can run the granted commands. The token's protection is the application's secret store. A program the classifier cannot read, such as an interpreter running inline code, can set the confirmer in its own process, the same known limit as every classified path."
exceptions:
  summary: "Since 0.29.0 the operator can record persistent exceptions to the guard's asks, the equivalent for polispec of an always-allow list. An exception lifts only the ask it names, for the commands it matches; the rest of a line is still judged by policy, and the exception that lifted a call is stamped on its judgment record."
  storage: "exceptions.yml (schema polispec.exceptions/v1) at the root of the global layer, read from the committed ref of polispec.global.repo, from the directory layer, or from the sealed bundle. It is a file of the global shelf, so it is trusted policy under the unknowns row, and no overlay, project file or state file can supply an entry. A missing file means no exceptions; a file that is invalid, over 256 entries or over 64 KiB honors nothing, and doctor reports exceptions_invalid."
  entry: "id aex_ plus 12 hex of sha256 over kind, tool, command, rule and scope; kind control (POLISPEC-TOOL-UNKNOWN and POLISPEC-MCP-UNDECLARED asks) or rule (an environment rule's warn, Bash only); tool, the exact canonical tool name, where every shell tool, Monitor included, is Bash; command, a glob over the whitespace-normalised, unexpanded text of the triggering command (* crosses slashes), required for Bash and forbidden otherwise, whose first word contains no glob character; rule, the rule id, required for kind rule and forbidden for kind control; scope, {project: canonical path} or {global: true}; note up to 200 characters; added."
  lifting: "control: the ask is lifted only when every trigger is covered. The triggers of a shell line are the eval, source and . commands it runs (or the whole line when the parser cannot name them, or when it is unparseable); the trigger of any other tool is the tool name, and of an undeclared MCP call the full mcp__server__operation name. rule: a warn row of a Bash call is lifted when an entry names its rule id and its command text matches. An exception applies when the working directory is inside its project scope or the entry is global."
  never: "Never excepted: a deny, POLISPEC-CONTROL-PROTECTION, the container root guard, a broken seal and every verdict of the lock edition. Plan, apply, probes and the journal replay never apply exceptions, so a plan compares policy only. explain applies them so it reports what the hook would answer, and writes nothing."
  proposals: "When a governed call still asks or warns on a trigger an exception could cover, the hook records a proposal (apr_ plus 12 hex of sha256 over kind, tool, command and rule) in exception_proposals.jsonl in the polispec state home, kept seven days and at most 256, and appends to the ask text: To stop asking for [<the triggering commands, at most 80 characters each>], the operator can run in a separate terminal: polispec exceptions promote <ids>. No proposal or hint is made for a deny, under the lock edition, while the sealed plane is active, or while polispec.exceptions is off. A proposal grants nothing."
  creation: "polispec exceptions add and promote (and remove) run on a TTY after the operator types the phrase shown, refuse while the sealed plane is active, and change nothing but exceptions.yml: they require the global layer to be a git repository on its ref with no other uncommitted change under the shelf path, write the file, then plan and apply the global target with the plan's own id as the confirmation, which commits it as Apply polispec plan <id>. A failed apply restores the previous bytes. An agent shell cannot run them (not_tty)."
  protection: "The exceptions file is a protected path like the ledger: a Write, Edit or shell redirect into it classifies as policy.edit and is denied POLISPEC-CONTROL-PROTECTION. The known limit is the one every classified path has: a program the classifier cannot read, such as an interpreter running inline code, is an unknown write."
  matching_limit: "An exception matches the text of the command, not what it expands to or runs: an entry for . $B/env.sh stays in force whatever $B/env.sh contains. promote escapes the glob characters of the proposed text, so a promoted entry matches that command exactly; add and promote --command take a pattern as written."
  scope_default: "A new entry is scoped to the project root, the git toplevel of the working directory (of the proposal's directory for promote), else that directory; --global widens it to the host. There is no expiry; remove revokes."
delete_guard:
  summary: "Since 0.33.0 polispec ships modules/delete-guard.yml in the shipped layer. Its data key delete_protected lists exact entries (the path itself) and tree entries (the path and everything below it): exact /, ~, /home, /etc, /usr, /var, /boot, /bin, /sbin, /lib, /lib64, /opt, /root, /sys, /proc, /dev, /usr/bin, /usr/sbin, /usr/lib, /usr/lib64; tree ~/.ssh, ~/.ai, ~/.claude, ~/.config, ~/.rplugins, ~/.polispec. The effective list is the union of the shipped modules' key, the global doc's top-level delete_protected and every shelf module's delete_protected; nothing removes an entry, and a live project's policy does not contribute."
  rules: "G-DELETE-PROTECTED (class fs.delete, predicate delete_protected) denies; G-DELETE-PROTECTED-FILE (class fs.delete, predicate delete_protected_file) warns; G-DELETE-XARGS (shape xargs_delete) warns. Every rule is overridable: the shelf loosens one only by naming it in overrides through plan global and apply global, and a warn row is liftable by a global exception like any warn."
  matching: "The target is the fs.delete hint path; a last component of exactly *, .*, .[!.]*, ..?* or .??* makes it a delete of its directory's contents. Base and every entry are compared both lexically (File.expand_path, ~ expanded) and with symlinks resolved (Envs.canonical). delete_protected holds when the base equals an exact entry; or, for a contents delete, when the base equals or is an ancestor of any entry or lies under a tree entry (lying under an exact entry does not count, so rm /tmp/* is not a delete of /); or, for a delete carrying the recursive hint, when the base is at or under a tree entry or an ancestor of any entry. Lexical forms are compared with lexical forms and resolved with resolved, never crossed. Equality and ancestry use both forms, so the real folder a symlinked tree entry points to, and every ancestor of it, is protected however it is spelled; lying under a tree entry uses the lexical form, and also the resolved form when the entry is a real folder (its path resolves to itself), so ~/.ssh is covered through any alias while a path beneath a symlinked entry's target written by its real path is not judged (on this host ~/.ai, ~/.claude and ~/.rplugins point into git working repos where agents clean builds; by operator decision on 2026-10-19). delete_protected_file holds otherwise for a non-recursive, non-contents delete at or under a tree entry. Exact entries do not cover their children. Judgment is origin independent and touches no fs.write."
  classifier: "Since 0.33.0 an fs.delete action carries env_hint recursive true for rm with --recursive or a short cluster containing r or R, for rmdir, for a find delete (-delete, -exec/-execdir/-ok/-okdir rm) and for cargo clean. A deleter (rm, rmdir, unlink, shred) whose words came through xargs carries shape xargs_delete, because its targets arrive on stdin and are never seen. An operand the parser cannot resolve still falls back to the working directory."
  plan: "A global plan keys the delete_protected entries of global.yml and of every shelf module as delete:exact:<path> and delete:tree:<path> beside protected roots, so adding one classifies tightening and removing one loosening."
smoke:
  summary: "A smoke ledger records smoke tests that proved a spec or sub-spec worked in reality, each with the runtime it ran in. polispec records, chains, verifies and reports coverage, and since 0.23.0 ships a bundled suite run by polispec smoke run; operators may record their own tests beside it."
  file: "smoke.yml, schema polispec.smoke/v1: schema plus an append-only entries list. Writes go only through polispec smoke record, under an exclusive file lock with an atomic replace."
  proves: "spec is a path relative to the git toplevel of a YAML file that parses to a mapping or list; at is a slash path into it: a mapping key, or a list item whose name or id equals the segment; ~1 escapes / and ~0 escapes ~. An empty at proves the whole file. record refuses a reference that does not resolve, and stores at_digest, the sha256 of the canonical JSON of the resolved node."
  verdicts: [pass, fail, partial, blocked, inconclusive]
  inconclusive: "Since 0.24.0 a live step whose only failing checks are hook_fired, hook_log or files_exist, with no timeout, spawn or auth error, did not attempt the action; it re-runs once (the first attempt's evidence kept as .first. files) and, if the retry also does not attempt, records inconclusive. inconclusive does not fail a run, never proves a unit and never revokes an earlier pass. A failing files_absent or git check always fails with no retry."
  entry: "id, recorded_at, started_at, finished_at, proves, verdict, summary, steps (run, exit, expect, observed), evidence (path relative to the toplevel or a basename, sha256, bytes, kind), runner (kind human or agent, harness, harness_version, model, effort), runtime, target, prev, digest."
  runtime: "Captured by record: os id, name and version, kernel release, arch, container and wsl flags, time zone, locale, ruby engine, version and platform, polispec version, edition, commit and dirty flag, install kind, rplugin version, enforce mode. No hostname, user name or absolute path is recorded: in summary, step and evidence text the home directory prefix becomes ~ and the toplevel prefix becomes ."
  events: "record emits polispec.smoke through the events port after the ledger write, carrying the entry id, proves and verdict only. An event failure does not fail the record."
  target: "Captured by record: the git commit, branch and dirty flag of the toplevel, the ledger project id when the toplevel is a governed project, the resolved environment, and the effective policy digest when one resolves."
  chain: "digest is the sha256 of the canonical JSON of the entry without digest; prev is the previous entry's digest, null for the first. record also anchors the head digest and entry count per ledger real path in smoke-heads.json under the state home, and verify reports truncated against it (only where that anchor exists). verify reports schema errors, a broken chain, a digest mismatch, and references that no longer resolve or whose at_digest changed."
  coverage: "polispec smoke coverage [--spec FILE] [--at PATTERN]... expands each pattern against the spec (a trailing * expands the items of a list or the keys of a mapping) and reports, per unit, the latest entry and whether a pass exists whose at_digest equals the node's current digest. Default spec specs/app.yml; default patterns from that file's smoke.coverage_units list, else commands/*."
  coverage_units: [commands/*, code_specs/commands/*, code_specs, composition, stewardship, deployment_receipts, harness_controls, protected_authorizations, smoke, judgments, delete_guard, description, web, author, manifest, registration, effect, editions]
  run: "polispec smoke run [--unit PATTERN]... [--scenarios DIR] [--against TREE] [--host-copy] [--live claude-code|codex]... [--out DIR] [--no-record] [--accept-changes] [--json] runs every smoke/scenarios/*.yml against the polispec tree it runs from, checks each step's expectations, and records one entry per unit (runner kind suite, worst verdict of its scenarios) unless --no-record. Exit 0 when every scenario passed or was blocked and, with --against, no diff exists or --accept-changes is given; 1 otherwise; 2 on usage. Output defaults to Dir.tmpdir/polispec-smoke/<timestamp>, never inside the tree."
  scenarios: "polispec.smoke-scenario/v1 (schemas/smoke-scenario.v1.yml, validate smoke-scenario): unit, spec, summary, requires (feature flags; off records blocked), fixture (enforce, global none|example|files, projects built by the tree's own apply environment-control with optional status live and checkouts, files), and steps that are a run (argv, cwd, env, stdin, tty, timeout, home), a hook payload (harness, event, tool, input, cwd) or a live session, each with expectations (exit, stdout and stderr substrings, JSON subset, files, git ref unchanged, hook decision and rule). Placeholders are expanded per word; an unknown placeholder is a scenario error."
  isolation: "Every step runs with POLISPEC_LEDGER, POLISPEC_GLOBAL, POLISPEC_HOME, POLISPEC_SMOKE, POLISPEC_SPECS_REPO and POLISPEC_STATE_HOME in its scratch directory, the enforce mode set explicitly, and a scratch git identity. POLISPEC_STATE_HOME (since 0.23.0, honoured only while unsealed, also by bin/polispec-guard when /etc/polispec/active.json is absent) moves polispec's state home and keeps events in its local log instead of the events port. The runner never writes the host ledger, shelf, settings or polispec state."
  parity: "--against TREE runs every scenario again with TREE's bin/polispec and reports, per step, a changed hook decision or rule, or a changed exit status or stdout after normalising scratch roots, tree roots, digests, commit ids, smoke ids and timestamps. parity: ignore skips a step. Only the candidate's results are recorded."
  host_copy: "--host-copy copies the configured ledger and global shelf into the output directory, replays smoke/host-probes.yml against every ledger project with the host's enforce mode and prints probe, project, decision and rule; with --against it compares. Never recorded."
  live: "--live claude-code|codex runs smoke/live/*.yml in headless sessions (claude -p with claude-haiku-5-5, codex exec with its smallest model) in scratch projects whose hooks run the tree's bin/polispec-guard; expectations come from the hook log, files and git state, never the agent's own account. Live steps run one at a time, at most POLISPEC_SMOKE_LIVE_MAX (default 6) per invocation, with a wall-clock timeout that kills the process group, at most one jittered retry when the harness exits before any hook call, and the polispec.smoke.live and POLISPEC_SMOKE_LIVE kill switches. Recorded with runner kind agent, the harness and its version, and the model."
judgments:
  summary: "Every call the guard judges leaves one chained record, polispec.judgment/v1, in judgments.jsonl under the polispec state home: what was judged, against which rulebook, by which polispec, and what the harness was told. It replaces verdicts.jsonl (deny and warn only, 300 bytes of command text, no policy or runtime identity) and the opt-in journal. Allows are recorded."
  schema: { id: polispec.judgment/v1, file: schemas/judgment.v1.yml }
  record: "id (jdg_ plus the first 12 hex of the digest), ts, action (tool, harness, event, session_id, agent_type, home-relative cwd, call_digest: sha256 of the canonical JSON of tool, arguments and cwd, and raw only while polispec.records.raw is on), targets (one per governed project or global baseline the call touched: project, env, policy_source, policy_digest, verdict, rule_id, rows with action_class, env, ref, home-relative path, crosses, destructive, shape, verdict and rule_id), control (control_digest, edition, ask ids; null when the control ceiling did not run), engine (polispec version, runtime kind, commit, tree_digest when pinned, edition, enforce mode, plane status and generation, fastpath key or null), outcome (verdict, rule_id, enforced, allow_once_id, rendered allow|ask|deny|none, error class for a fail-closed denial, duration_ms), exceptions (since 0.29.0, only when non-empty: the aex_ ids of the exceptions that lifted an ask or warn for this call), relaxed (since 0.30.0, only when non-empty: one {rule POLISPEC-TOOL-UNKNOWN, reason development, projects [ids]} for a call whose opaque eval, source or . line was not asked about because its project is in development), prev, digest."
  one_per_call: "One record per hook call, written synchronously after the environment outcomes and the control ceiling compose and before the reply is written, so the record carries the verdict the harness received. A fail-closed internal denial records verdict deny, rule POLISPEC-INTERNAL and the error class, best effort. Git hooks record with harness git. The session hook records no judgment; since 0.35.0 it writes a session record (see effect)."
  chain: "digest is the sha256 of the canonical JSON of the record without digest; prev is the previous record's digest, across rotations, null for the first record ever. Appends hold an exclusive lock on judgments.lock; judgments.head.json beside the stream holds the head digest, the record count and the current file name and is the truncation anchor. When judgments.jsonl exceeds 16 MiB the append renames it to judgments.<utc timestamp>.jsonl and the chain continues in a new file. Since 0.30.1 an append that finds the stream ahead of the anchor, because a hook process was killed after writing a record and before moving judgments.head.json, chains to the last record and counts the records the anchor missed, when those records chain unbroken from the anchored digest within the last 256 KiB of the stream; an anchor the stream does not chain from (a truncated stream, a foreign head) is not adopted, and the append forks as before so verify still reports it. Before 0.30.1 the next append chained to the stale anchored digest, which forked the chain and left the anchored count short for good. verify reports that historical fork signature (a record whose prev equals the prev of the record before it) as an interrupted_append, outside findings, and subtracts those records from the count it expects of the anchor. An anchor that is still one append behind when verify runs is reported as truncated until the next append re-anchors it."
  port: "After the local append the same record without raw goes through the events port as polispec.judgment. The port receives a copy; it never replaces the local record. polispec.verdict is no longer emitted."
  skips: "bin/polispec-guard appends one line to skips.jsonl under the same state home for every call its fast path skips, with bash builtins only (no fork): ts, tool, session, the fast-path key and the reason, no_needles or no_match. The Ruby side rotates skips.jsonl at 16 MiB when it next runs. Skips are counted, never chained, because the shim cannot hash without a fork. Since 0.33.2 the shim also appends one line per fail-closed decision it makes on its own to launcher.jsonl (install guard_binary row); those calls reach no judgment record."
  readers: "polispec judgments list|show|verify (commands); doctor reports judgments_chain_broken and judgments_truncated, and nothing for an interrupted_append; digest reads warn and deny judgments; plan replays the rows of the last 14 days. verify counts the skip lines per fast-path key beside the chain result."
  privacy: "A default record holds no command text, file contents or environment values: the call digest, home-relative paths and refs, identities and digests only. polispec.records.raw on adds the classifier's raw view, bounded to 2048 bytes, to the local record only."
  failure: "Recording never changes a verdict: the append is rescued, and a failed append emits a polispec.finding of kind judgment_unrecorded. doctor already reports state_unwritable."
  limits: "No hook payload carries the harness version, so a record has none (smoke entries do). A clone runtime records its HEAD commit, not a tree digest. Skip lines are not chained. The record proves what polispec judged, not that the harness obeyed the reply."
  epoch: "Since 0.35.0 a record carries epoch (see effect) beside engine, and exception_rows ({row, entry}, only when non-empty) names the aex_ id per lifted row beside the existing per-call exceptions list, which keeps its shape for every reader. Records before 0.35.0 carry neither; verify and the 0.30.1 heal accept both shapes, because the digest covers the record as written."
description:
  summary: "Since 0.35.0 every rulebook (policy, module, package, environments, global, roster, spec, and each ledger entry) may carry description beside summary. summary stays one line for listings; description is the prose a person reads on a card: what the rulebook governs, for whom, and what it refuses."
  lint: "Polispec::Description.lint(doc, kind) is deterministic and makes no model call. A description passes when it has 2 to 8 sentences and 20 to 400 words, does not repeat the summary or the name, names at least one thing the rulebook governs taken from its own content (an action class, environment, path, tool, module or gate it declares), and states at least one rule's effect in words (allow, ask, warn, deny, refuse, promote, freeze or an equivalent from Description::EFFECT_WORDS). Each failure is a finding with a code (too_short, too_long, restates_summary, names_nothing, states_no_effect) and the offending span."
  judge: "polispec validate --semantic additionally asks the decide port whether the description matches the composed rules (options matches, partial, contradicts, with criteria). It is advisory, never run by the guard, and skipped with a note when the port is unavailable."
  ratchet: "Missing or failing descriptions are warnings (description_missing, description_invalid) from validate, doctor and the web app; polispec.description.strict on makes validate fail them. Promote is not gated by it."
  rollout: "Every schema rejects unknown keys, so a policy that uses description at its trust ref is invalid to a runtime older than 0.35.0, and the guard would judge that project by fallback_rules. Descriptions are therefore written into live rulebooks only after 0.35.0 is pinned on every host that reads them. doctor reports description_ahead_of_runtime when a trust ref uses description and the installed release is older than 0.35.0, and the web app and author refuse to add one in that case."
web:
  summary: "Since 0.35.0 polispec web serves a local web app over the files polispec already keeps. It has no database: every fact is read through the same library the CLI uses, every change is a plan applied through the same apply path, browser storage caches views, and web/state/*.yml under the polispec state home keeps local metadata (layout positions, pinned cards, saved playground calls)."
  stack: "Roda on Rack 3, served by WEBrick, all pure Ruby and vendored with their licenses under vendor/ (roda, rack, webrick at exact versions in vendor/VERSIONS.yml). Only lib/polispec/web loads them; polispec core keeps no runtime dependency and runs on Ruby >= 2.6. The UI is static ES modules and Web Components under web/public with vendored CodeMirror 6 (YAML mode) and hand-written SVG, no build step and no network fetch at runtime. A JSON API under /api/v1 is described by web/public/openapi.yml."
  binding: "Listens on polispec.web.bind (127.0.0.1) and polispec.web.port (7421). A non-loopback bind needs --expose on a TTY and the phrase expose polispec web."
  public_origin: "An optional polispec.web.public_origin must be one HTTPS origin without credentials, a path, query, or fragment. It is recorded at server startup, used for initial and fresh links, admitted as an exact Host authority, and required as the Origin for mutations when configured. Both login and logout cookies carry Secure. The loopback Host remains available for probes; forwarded headers never establish trust. An external proxy owns HTTPS and network exposure; the plugin has no rStack or Tailscale dependency."
  session: "At start the server writes a 32-byte launch secret to <state home>/web/launch.secret (0600, a protected path: reads classify secrets.read and writes policy.edit), prints http://127.0.0.1:<port>/#k=<one-time code> to the terminal, and --open hands it to the browser. The browser exchanges the code once for an HttpOnly SameSite=Strict session cookie; the code then expires. Every mutating route requires that cookie, an X-Polispec-CSRF header equal to the per-session token and an Origin of the server itself, and is rate limited to 30 a minute."
  guard: "polispec web run by an agent classifies policy.edit, so a live policy warns and the harness asks the user; web.fetch and curl, wget or an HTTP client line whose URL names the configured web port on a loopback address with a mutating method or a path under /api/v1/apply, /api/v1/exceptions or /api/v1/register classify policy.edit too, through a new classifier family web_local. A shipped rule G-WEB-AGENT in modules/tool-declared.yml warns on them."
  writes: "Every edit becomes a polispec plan rendered with its files, ledger effect, composed policy diff, probes that change, journal replay, effect classes and classification. A tightening or neutral plan that is not global applies on one click. A loosening, mixed or global plan, a status flip, a move and a ledger change apply only after the person types the plan id. Operator-only actions (promote to stable, deploy stable, pause, allow-once, seal, plane) are shown as the exact command to run in a terminal and never as a button. Exception add, promote and remove relay the typed phrase through the delegate runner (delegation, exceptions verbs). The web app never writes a stable branch, a production checkout or a secret."
  limits: "Like delegation, the session is the unsealed terminal confirmation made reachable from a browser, not operator authentication: whoever holds the session cookie and types the plan id can apply. A program the classifier cannot read can reach the port, the known limit of every classified path."
  edition: "Excluded from lock (specs/editions.yml web): polispec web refuses to start with edition_excluded."
  views:
    manifest: "Per app: the generated manifest beside the authored polispec.app.yml, and the host-wide index."
    map: "A tree of every ledger project, path entry and worktree glob, with the shipped layer, the global shelf and the exceptions file drawn above them and an edge from each layer and module instance to every project it reaches. Cards show name, summary, description, digest, status and verdict counts; hovering a card highlights every project and edge it is embedded in. Global effects are drawn as the band of rules a project inherits from above."
    detail: "One rulebook's composition: the layer chain from shipped to child, each module instance with its resolved parameters, each rule with its verdict colored and its overrides, the gates and freezes, and the winning rule per environment for a chosen action."
    manager: "Edit any rulebook in a YAML editor validated as you type against its schema and the description lint; compose by adding and parameterizing modules; move (relocate a module or rule across project-local, shelf and project scopes as one paired plan, and reorder or regroup rules within a layer); deploy (apply project:<id> on main, then the promote command for test); set global policy (plan global)."
    playground: "Type a tool call or shell line, or pick a recorded judgment, and see the verdict in every environment of every project with the full rule trace from explain; read-only."
    blast_radius: "While a draft is open, the last 14 days of judgment rows are replayed against it and the counts that would flip are shown per project; flipped edges pulse on the map."
    pipeline: "Per project: main, test and stable refs with policy digests, unpromoted policy, package drift, doctor findings, freezes and gate status, with the promote command for test and operator commands for stable as text."
    history: "A scrubber over a rulebook's git history and release tags; two refs give a semantic diff of rules, gates, freezes and modules, each classified tighten or loosen."
    heatmap: "Rule hit counts per project and environment from the judgment stream, rules that never fired in the window, and NO-RULE hot spots; a hot spot opens a draft rule in the manager."
    badges: "An SVG badge and an embeddable card per app from its manifest, also written by polispec manifest --write."
    explainer: "Paste a deny or warn text or a judgment id to see the rule, its layer, its description and the legitimate way forward, with a draft exception or allow-once request for the operator."
    gallery: "Packages, shelf modules and example policies as cards; fill parameters in a form, preview the composition on the map, then plan and apply."
    sessions: "Every session seen in the active window: harness, start, last call, runtime version, policy digest per project and epoch, with badges current, pending, reload needed (with /reload-plugins), stale briefing (injected text older than the epoch) and untrusted hook (Codex)."
    timeline: "Change records as events with their effect classes and, per change, how many active sessions have crossed over."
    exception_detail: "Per exception: scope, command glob, who added it, first and last use, hit count, sessions that used it; and the proposals inbox, whose promote relays the phrase through the delegate runner."
    plan_banner: "Before every apply: the effect classes of the plan and how many active sessions it reaches on the next call, at a new session, after /reload-plugins or after a trust review."
    feed: "Live judgments filtered by session, project or rule, streamed with server-sent events from the judgment stream."
  themes:
    switcher: "One switcher: a click cycles system, light, dark, apple-noir, apple-austere and tronwave; a long press, right-click or Shift+Enter opens a list of all six."
    default: system
    fleet_exception: "rStack fleet.yml makes tronwave the default; polispec is public FOSS, so its first-visit default is system (the neutral light or dark pair following the OS, ink-blue accent #2456c9 light, #7fa3ff dark). Decided 2026-10-20."
    canonical: { source: "~/rstack/themes (apple-noir.yml, apple-austere.yml, tronwave.yml)", themes: [apple-noir, apple-austere, tronwave] }
    review: "Every surface is designed and reviewed by Chris across all six, as specified in specs/web-frontend.impl.yml."
  observability: "Starts, stops, applies and author sessions emit polispec.web through the events port; failures emit polispec.finding."
author:
  summary: "Since 0.35.0 a polispec-owned port, author, drafts rulebooks and descriptions: draft(kind:, intent:, context:, session: nil) returns {yaml, rationale, adapter, session}. Every draft is validated and planned before a person sees it; nothing is applied by the port."
  standalone: "harness-cli, built in: a persistent Claude Code session over stream-json (claude -p --input-format stream-json --output-format stream-json --verbose --include-partial-messages --replay-user-messages --permission-prompts host --session-id UUID, resumed with --resume and forked with --fork-session), one per editor tab, after rharness's Claude::Control design (rharnessfactory shellout-library.impl.yml) implemented inside polispec. The harness, model and effort come from the project roster role spec-author (default claude, sonnet, medium). The session has only the Read, Grep and Glob tools (--tools Read,Grep,Glob) and runs in permission mode manual with one --allowedTools Read(//<root>) and Read(//<root>/**) rule per allowed root (the target project, the shelf, ROOT/schemas, ROOT/modules, ROOT/examples), so Claude Code itself accepts reads inside the roots by rule and rejects every other read, since a headless session has nobody to answer the prompt (observed on Claude Code 2.1.304: the auto mode a host may default to accepts reads anywhere, and path rules alone do not restrict it). Any can_use_tool request that does arrive is answered by polispec with the same root check, a second line. The child gets no POLISPEC_* variable but POLISPEC_ACTOR, and every rulebook draft must carry a description that passes the lint. The session runs in a scratch directory under the state home; it is a governed Claude Code session, so the guard judges it too. Codex (codex exec --json per turn, resumed) is a second harness of the same adapter."
  bounds: "One process per tab, at most 3 open; idle sessions close after 15 minutes; a turn times out after 180 s; at most 2 jittered retries when the process exits before its first event; a per-host token bucket of 10 turns a minute; polispec.author.enabled off or POLISPEC_AUTHOR=off is the kill switch."
  extensions: "rllm through rplugin's rstack extension (extensions/rstack/lib/author.rb, RLLM_URL, rate limited and retried like decide); a token-API adapter later as another extension."
  edition: "Excluded from lock."
manifest:
  generated: "polispec.manifest/v1, read-only, produced by Polispec::Manifest.for(project): id, kind (project or path), owner, description, status, environments with their refs and policy digests, the layer chain with module instances and packages, roster roles, edition, enforce mode, last promotion per environment, doctor findings by severity, badge URL. Served at /api/v1/manifest/<id>; polispec manifest --write commits polispec.manifest.json and .polispec/badge.svg on main as a plain commit of those two paths."
  authored: "polispec.app.yml (polispec.app/v1) at the app's root, written by the app: name, description, serves (who it serves), owners, wants (packages and shelf modules with parameters), contact. Validated by validate app, shown beside the generated manifest, and an input to the gallery's suggested plan; it grants nothing and is never read by the guard."
  index: "polispec.index/v1: the current user's ledger projects and path entries with owner and description. polispec manifest index --publish (TTY) writes it to /var/lib/polispec/index/<user>.json when that directory exists and is writable, with no paths outside the user's home redacted to ~ and no secrets; the web app shows the published indexes of other users read-only."
registration:
  summary: "Since 0.35.0 polispec register <path> governs software, a directory or the user's system scope that is not a git repository with branches. It adds a governed path entry to the ledger (paths: [{id, kind software|directory|system, path, status onboarding|live|retired, owner {uid, name}, registered_by, description, policy}]) through plan ledger and apply ledger; an onboarding entry tightens and applies directly, a status flip needs the person's yes."
  policy: "A path entry has no trust ref and no environments. It is judged by the shipped layer, the global shelf, and its own optional policy at paths/<id>.yml on the shelf, committed through plan global; a path inside a ledgered repo is owned by that repo, and register refuses it."
  system: "kind system registers the user's own scope (the home directory) for global rules; host-wide rules for every user stay with the sealed plane and the operator."
  owner: "Every ledger project and path entry carries owner and registered_by from 0.35.0; entries written earlier are shown with owner unknown."
  skill: "skills/polispec-register/SKILL.md interviews the person (what the software is, who it serves, what must never happen to it), proposes kind, id, description and a starter policy, and runs polispec register --dry-run, then the apply."
  edition: "Restricted under lock: only through the protected ledger the sealed plane names."
effect:
  summary: "Since 0.35.0 polispec makes visible when a change reaches running sessions (docs/effect.md). The guard already follows every policy change on the next call; the epoch, change records and session records show which sessions have crossed over and what still needs a new session, a reload or a trust review."
  epoch: "Polispec::Effect.epoch: sha256 over the runtime tree digest (or clone commit), the ledger digest, Layers.fingerprint (shipped, global shelf, exceptions.yml), each live project's policy and roster digest at its trust ref, control_digest, plane status and generation, edition, enforce mode and the relax and exceptions settings. It changes only when one of them changes; engine.fastpath_key is not used because it differs per call."
  changes: "polispec.change/v1 in changes.jsonl, chained like judgments (prev, digest, head anchor): id chg_, ts, kind (promote, apply, exceptions.add, exceptions.promote, exceptions.remove, settings.set, pin, register), actor, subject (plan id, entry id or tag), epoch_before, epoch_after, effects [{class next_call|new_session|reload|trust, scope}]. Written by the command after it succeeds; plan prints the effect classes before apply."
  effect_classes: "next_call: policy, ledger, global shelf, exceptions, settings, runtime pin and controls written to watched settings files. new_session: the SessionStart and SubagentStart text. reload: hooks.json wiring and the launcher (Claude Code /reload-plugins). trust: a changed Codex non-managed hook awaiting review."
  sessions: "polispec.session/v1 in sessions.jsonl: session_id, harness, event (SessionStart or SubagentStart), agent_type, epoch, sha256 of the injected text, launcher (Claude Code: the version in CLAUDE_PLUGIN_ROOT; Codex: the bridge or PLUGIN_ROOT path), ts. The session hook writes it; judgments stay one per PreToolUse call."
  await: "polispec changes await <id>: a session active in the window (default 1h) is crossed when it has a judgment at or after epoch_after, pending when it has made no call since, and flagged reload or trust when its launcher or harness needs one; exits 0 when every active session crossed, 1 on timeout with the list."
  notice: "On the first PreToolUse of a session after its epoch changes, the hook adds one bounded line (at most 300 characters) naming the change through additionalContext, once per session per epoch, keyed in <state home>/notices/<session_id> rather than on the transcript; polispec.notice off disables it."
  doctor: "doctor reports launcher_stale (a session's launcher older than the installed release) and codex_hook_untrusted once the Codex wiring on the host is located."
  open: "docs/effect.md records the Claude Code and Codex probes and the bridge path on this host. The Codex reload probe emptied config.toml accidentally, so replacement by another valid definition mid-session remains unverified; matcher and type participation in trusted_hash were not measured. Native Codex hook adoption remains an operator decision."
editions:
  registry: specs/editions.yml
  summary: "Since 0.35.0 specs/editions.yml (polispec.editions/v1) lists every feature whose behavior differs between standard (main) and lock (polispec-lock), with included, restricted or excluded per edition, the release that added it, the code that gates it and a note."
  code: "Polispec::Editions.allowed?(id, edition) and .value(id, edition) read the shipped registry; every edition branch calls them, and no other file compares an edition to the string lock."
  check: "polispec editions --check and doctor (editions_drift) report a gate id with no row, a row whose code path is missing, and a raw lock comparison outside lib/polispec/editions.rb. The smoke suite runs its lock-mode scenarios against the release before the refactor and must show no changed verdict."

guided_learner_catalog:
  package: packages/guided-learner/package.yml
  canonical_source: packages/guided-learner/behavior.yml
  policy_ids: [GL-CODE, GL-NOTERM, GL-DETAIL, GL-SCOPE, GL-PLAIN, GL-OPEN]
  export: polispec behavior export-package NAME
  installation: Files-only plan and apply; no environment, ledger, or global enforcement change
  runtime: Consuming applications own adapters and can bundle compiled policy without a Polispec runtime
  guarantee: Policy data and explicit detectors are not proof of native or semantic enforcement
  wiring: No new service, external API, state store, or rStack dependency
