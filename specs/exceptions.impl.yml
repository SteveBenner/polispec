schema: is.v1
metadata:
  name: polispec exceptions
  slug: exceptions
  version: 0.1.0
  created: '2026-10-17'
  status: accepted
  base_commit: 42e6db8
  base_version: 0.28.3
  intended_release: 0.29.0
  contract: specs/app.yml#exceptions
  worker: {harness: claude-code, model: sonnet, effort: medium}
  changed_after_review:
    - 'The ask hint names the triggering commands: To stop asking for [<command>; ...], the operator can run in a separate terminal: polispec exceptions promote <ids>.'
    - 'promote escapes glob characters in the proposed command (Exceptions.literal), so a promoted entry matches that command exactly; add and promote --command take a pattern as written.'
vision:
  problem: >-
    The guard asks about calls it cannot positively classify (POLISPEC-TOOL-UNKNOWN, POLISPEC-MCP-UNDECLARED) and warns
    on rule verdicts, and the only ways to stop asking about a command are a polispec release, an MCP declaration in the
    global shelf (MCP operations only), or allow-once (one use, ten minutes, rule warns only). Claude Code's own prompt
    for a hook ask offers only Yes or No, so the same line asks again in every session (143 Bash asks and 59 Monitor
    asks in two days of host judgments, mostly lines running `.` or `source` on an env file the agent wrote itself).
  outcome: >-
    The operator can record a persistent exception, scoped to a project or to the host, in a file of the global shelf.
    A recorded exception lifts exactly the ask it names and nothing else: the rest of the line is still judged, denies,
    protected paths, root guard, broken authority and the lock edition are never excepted, and every use is stamped on
    the judgment record. An agent can never create one: entries are made only by the operator CLI on a TTY with a typed
    phrase, through the shelf's plan and apply path, and the file is a protected path.
  non_goals:
    - Excepting a deny, POLISPEC-CONTROL-PROTECTION, the root guard, a broken seal or any lock-edition verdict.
    - Excepting a rule warn on a tool other than a shell tool. Rule exceptions are Bash only.
    - Expiry, per-session scope or a second storage location. Entries live in the global shelf file only.
    - Moving the unknown-tool guard out of the library into shipped policy (a separate TODO.md item).
    - Any change to what plan or apply compute: probes and plans never apply exceptions.
constraints:
  - Ruby standard library only; same Ruby floor as the rest of lib/. Keep the two-line header (shebang, SPDX) every lib file carries.
  - No comments or docstrings in code. No tests (AGENTS.md Part S). Verification is by running this worktree's bin/polispec for real against scratch state.
  - Work only in this worktree (/home/sven/github/foss/.polispec-wt/exceptions, branch exceptions). Never touch the pinned runtime under rstack-uber/plugins/.pinned/polispec, ~/.ai/polispec, ~/.ai, ~/.config/polispec, ~/.local/state/polispec, ~/.rplugins or the main clone ~/github/foss/polispec.
  - Every verification run sets POLISPEC_STATE_HOME, POLISPEC_HOME, POLISPEC_LEDGER and POLISPEC_GLOBAL to scratch paths in your scratch directory (and the global repo, ref and path settings through the RPLUGIN_POLISPEC_* or POLISPEC_* environment keys the settings resolution reads, so a scratch git repository can stand in for the shelf); never redirect XDG_STATE_HOME. Never run a mutating exceptions command against anything but a scratch shelf.
  - Do not commit, tag, push, install, pin or run rplugin. Leave the worktree modified and unstaged.
  - Do not edit specs/app.yml, CHANGELOG.md, VERSION, FEATURES.md, TODO.md, README.md, docs/, plugin or marketplace manifests other than the setting line named below, or any *.impl.yml; the primary owns them.
  - Query codebase memory (project home-sven-github-foss-polispec, re-index the worktree path if it is not listed) before grepping.
owns_paths:
  - lib/polispec/exceptions.rb
  - lib/polispec/commands/exceptions.rb
  - schemas/exceptions.v1.yml
shared_surfaces:
  - {path: lib/polispec/commands/hook.rb, change: 'unknown_action carries triggers; judge builds the exception lambdas, lifts asks, records proposals, appends the hint, stamps the judgment'}
  - {path: lib/polispec/harness_controls/evaluate.rb, change: 'Guard.evaluate skips the unknown and undeclared ask when every trigger is covered; protected_paths adds the exceptions file'}
  - {path: lib/polispec/engine.rb, change: 'Settings gains exceptions?; settle lifts excepted warn rows'}
  - {path: lib/polispec/classify/commands/support.rb, change: 'write_class returns policy.edit for the exceptions file'}
  - {path: lib/polispec/classify/benign.rb, change: 'POLISPEC_READ gains exceptions list'}
  - {path: lib/polispec/judgments.rb, change: 'record carries exceptions when non-empty'}
  - {path: schemas/judgment.v1.yml, change: 'optional exceptions property'}
  - {path: lib/polispec/commands/doctor.rb, change: 'exceptions_invalid finding'}
  - {path: polispec.rplugin.yml, change: 'setting polispec.exceptions beside polispec.records.raw (line 32 pattern)'}
  - {path: lib/polispec/schema, change: 'register the exceptions schema kind the way the other kinds are registered; find the registry first'}
slices:
  - id: core
    depends_on: []
    deliverable: lib/polispec/exceptions.rb and schemas/exceptions.v1.yml exist and every function below works from a ruby -I lib one-liner against a scratch shelf.
    detail: |
      Read lib/polispec/judgments.rb (state home, locking, how RAW_KEY reads a setting), lib/polispec/layers.rb
      (Layers.source and Layers.store, Store#read(relative), kinds :repo and :dir, the sealed-plane branch of source),
      lib/polispec/engine.rb Settings, lib/polispec/schema* (how a kind maps to schemas/<kind>.v1.yml and how
      Schema.validate works) and an existing schemas/*.v1.yml for the dialect.

      Module Polispec::Exceptions (lib/polispec/exceptions.rb), require_relative'd by the files that use it. Constants:
      FILE = "exceptions.yml", SCHEMA = "polispec.exceptions/v1", MAX_ENTRIES = 256, MAX_BYTES = 65_536,
      PROPOSAL_TTL = 604_800, MAX_PROPOSALS = 256, ENTRY_ID = /\Aaex_[0-9a-f]{12}\z/, PROPOSAL_ID = /\Aapr_[0-9a-f]{12}\z/,
      GLOB_CHARS = /[*?\[{]/.

      Document, stored in FILE at the root of the global layer (Layers.source: for kind :repo the committed content at
      source.ref under source.path, for kind :dir the file in its root; read it through Layers.store.read(FILE), which
      already honors the sealed bundle and the ref):
        schema: polispec.exceptions/v1
        exceptions:
          - id: aex_0123456789ab          # aex_ + first 12 hex of sha256([kind, tool, command.to_s, rule.to_s, scope_key].join("\0")); scope_key is "global" or the project path
            kind: control | rule
            tool: Bash                    # exact canonical tool name, 1..128 chars, no GLOB_CHARS
            command: ". $B/env.sh"        # required when tool is Bash, forbidden otherwise; 1..1024 chars after normalize; the first space-delimited word must contain no GLOB_CHARS
            rule: G-STAGE-EXPLICIT        # required when kind is rule, forbidden when kind is control; /\A[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z/
            scope: {project: /abs/canonical/path}   # or {global: true}; exactly one of the two
            note: "free text"             # optional, at most 200 chars
            added: 2026-10-17T08:00:00Z   # UTC ISO 8601, written by the CLI
      kind rule requires tool Bash. At most MAX_ENTRIES entries, file at most MAX_BYTES, unique ids. No other keys at any level.
      Write schemas/exceptions.v1.yml in the repo's schema dialect for exactly this, and register the kind "exceptions".

      API (module functions; none raises for a bad file):
        enabled?                     -> Engine::Settings.exceptions? (slice integrate defines it; until then call it through respond_to? so core is testable alone)
        path                         -> absolute path of FILE in the active global layer (repo: File.join(source.repo, source.path, FILE); dir: File.join(source.root, FILE)), nil when Layers.source is nil
        validate(document)           -> Array of problem strings, [] when valid (schema plus MAX_ENTRIES and duplicate ids and the first-word rule)
        load                         -> Result = Struct(:entries, :problems, :present), memoized for the process, reset! clears it. A missing file: present false, no entries, no problems. Oversize, unparsable (YAML.safe_load with aliases false and permitted_classes [Time]) or invalid: present true, entries [], problems non-empty, so a bad file honors nothing.
        canonical_tool(name)         -> "Bash" when Harness::Base::SHELL_TOOLS includes name, else name.to_s
        normalize(text)              -> text.to_s.gsub(/\s+/, " ").strip
        scope_covers?(entry, cwd)    -> true for {global: true}; for {project: p} true when the canonical cwd equals p or starts with p + "/". Canonicalize with File.realpath of the deepest existing ancestor like HookCommand#canonical_path does.
        covers(entries, kind:, tool:, command: nil, rule: nil, cwd:) -> the id of the first entry that matches, else nil. Match: entry.kind == kind; entry.tool == canonical_tool(tool); for kind rule entry.rule == rule; for tool Bash File.fnmatch?(entry.command, normalize(command), File::FNM_EXTGLOB) (no FNM_PATHNAME, so * crosses slashes); scope_covers?. A nil command never matches a Bash entry.
        active?(edition, plane_status) -> enabled? && edition != "lock"   (plane_status is accepted and ignored here; an active plane reads its sealed global layer through path/load)
        proposal_id(kind, tool, command, rule) -> "apr_" + first 12 hex of sha256([kind, tool, command.to_s, rule.to_s].join("\0"))
        propose(kind:, tool:, command: nil, rule: nil, cwd:) -> proposal id. Appends or refreshes one JSON line {id, kind, tool, command, rule, cwd, created} in exception_proposals.jsonl in the polispec state home (the directory holding judgments.jsonl; use the same state-home helper and the same lock discipline judgments.jsonl uses). A line with the same id is replaced and moved last; lines older than PROPOSAL_TTL are dropped; at most MAX_PROPOSALS lines, oldest dropped first. command is stored normalized. Rewrite through a temp file and rename. Any IO failure returns nil and raises nothing.
        proposals                    -> Array of proposal hashes, expired ones filtered out
        find_proposals(ids)          -> Hash id => proposal for the ids present
        forget(ids)                  -> removes those proposal lines
        build_entry(kind:, tool:, command:, rule:, scope:, note:, now:) -> entry hash with the computed id and added stamp, key order as in the document above
        dump(entries)                -> the YAML text of the document, schema line first, entries in insertion order, stable key order, no trailing spaces, ending in one newline

    acceptance: >-
      ruby -I lib one-liners against a scratch directory shelf (POLISPEC_GLOBAL) holding a valid exceptions.yml: load
      returns the entries; covers returns the id for a matching Bash command in a covered cwd and nil outside the scope,
      for a different tool, for kind rule with another rule id and for a command that differs; an entry whose command
      starts with a glob, an unknown key, a duplicate id, a rule entry for a non-Bash tool and a 257th entry each make load
      return problems and no entries; dump(load.entries) round-trips to a document that validates; propose twice with the
      same arguments leaves one line; lines older than a week vanish on the next propose.

  - id: integrate
    depends_on: [core]
    deliverable: The hook lifts excepted asks and warns, records proposals, appends the hint, stamps the judgment, and the file is protected; nothing changes for a host with no exceptions file except the hint text on asks.
    detail: |
      Read lib/polispec/commands/hook.rb judge, unknown_action, compose_ask_authority, evaluate and evaluate_baseline,
      lib/polispec/harness_controls/evaluate.rb Guard.evaluate and protected_paths, lib/polispec/engine.rb settle and
      settle_warn, and lib/polispec/classify/commands/support.rb write_class.

      Setting. Engine::Settings.exceptions? -> true unless the polispec.exceptions setting resolves to "off". Declare the
      setting exactly like polispec.records.raw is declared in polispec.rplugin.yml (line 32; enum off|on, default on, the
      same scopes), and resolve it the same way Judgments reads RAW_KEY, with POLISPEC_EXCEPTIONS as the short env key
      wherever the other settings have one. Setting off: nothing below runs and no output changes from the base.

      When exceptions are active. In HookCommand#judge compute once: active = Exceptions.active?(edition, @plane["status"]) and not @explain
      for proposal writing (explain still applies exceptions so it reports what the hook would answer, but writes nothing).
      Exceptions never apply when edition is "lock".

      Triggers. unknown_action(input, cwd) builds raw {"unknown_tool" => true, "tool" => name}; add "triggers" => Array of
      normalized strings. For a shell tool (Harness::Base::SHELL_TOOLS) reached by the opaque path (the second
      unknown_action call, Classify.opaque_shell?): the text of every parsed command whose name is eval, source or "."
      (Classify::Benign::OPAQUE), unexpanded exactly as the parser holds it (cmd.text); when none has such a name (the
      parser flagged eval inside an unwrapped shell), the single trigger is the whole command text. For a shell tool
      reached by the first unknown_action call (an unparseable or unclassifiable line), the single trigger is the whole
      command text. For any other tool, triggers is []. Add a small public helper (Classify.opaque_commands(tool, data, cwd),
      defined beside opaque_shell? in classify/benign.rb and exposed through classify/registry.rb the way opaque_shell? is)
      returning those command texts; benign.rb is yours for this one method and for POLISPEC_READ below.

      Control lift. Build in judge, beside trusted_declaration, a lambda "excepted" in control_context: excepted.call(action)
      returns an exception id or nil. For an action with raw["unknown_tool"]: tool = Exceptions.canonical_tool(raw["tool"]);
      a shell tool needs every trigger covered, each by Exceptions.covers(entries, kind: "control", tool: tool, command: trigger, cwd: cwd), and returns the
      id of the first covering entry when all are covered, else nil; a non-shell tool is covered by covers(... tool: tool, command: nil ...). For an
      action of class mcp.call: covers with tool = input.tool_name (the full mcp__server__operation name), command nil. Load entries
      lazily (Exceptions.load on the first call) so a call that asks nothing never reads the shelf. In Guard.evaluate, after
      computing unknown and undeclared, build covered = (unknown + undeclared).map { |a| context["excepted"]&.call(a) } and, when
      none is nil, return result unchanged (the allow it already holds) with result["exceptions"] = the unique ids; otherwise behave
      exactly as before (the ask names all of them, no partial lift).

      Rule lift. In HookCommand#evaluate and #evaluate_baseline add to the engine context :excepted => a lambda taking a Row and
      returning an exception id or nil: nil unless row.verdict.warn? and Exceptions.canonical_tool(input.tool_name) == "Bash";
      otherwise Exceptions.covers(entries, kind: "rule", tool: "Bash", command: row.action.raw, rule: row.verdict.rule_id, cwd: cwd)
      with entries loaded lazily. In Engine.settle, first thing: when ctx[:excepted] is set, replace each warn row that the lambda
      excepts by Row.new(row.action, row.env, Verdict.new(level: "allow", rule_id: row.verdict.rule_id, reason: "exception " + id + ": " + row.verdict.reason)),
      push the id onto ctx[:exceptions_used] (an Array the hook provides), then continue with the existing code on the new rows. Rows that are deny stay.
      allow-once issue and consume then see only the rows that still warn. plan, apply, probes and explain-probe code paths never set
      :excepted, so they are unchanged.

      Stamp. @judged["exceptions"] = unique ids from control["exceptions"] and ctx[:exceptions_used] (both sources, flattened), set only
      when non-empty. Judgments.record's block in record_judgment adds "exceptions" => judged["exceptions"] to the record hash only when
      present and non-empty (absent otherwise, so records without exceptions are byte-identical to the base). Add the optional
      property to schemas/judgment.v1.yml (array of strings matching ^aex_[0-9a-f]{12}$, unique). judgments verify and polispec
      validate judgment must still pass on streams with and without the field.

      Proposals and hint. After worst is composed in judge, when active, not explaining and @plane["status"] != "active" and worst.warn?:
      collect the triggers that are still asking: for each unknown/undeclared action not covered (control kind): for a shell tool one
      proposal per trigger (kind "control", tool "Bash", command trigger), for any other tool one proposal (kind "control", tool name, command nil);
      for each environment row that still warns on a Bash call: kind "rule", tool "Bash", command row.action.raw, rule row.verdict.rule_id.
      Exceptions.propose each with cwd, keep at most 5 ids in order, and when at least one id exists set
      worst.next_step = [worst.next_step, "To stop asking for the exact command(s) above, the operator can run in a separate terminal: polispec exceptions promote " + ids.join(" ") + (more > 0 ? " (and " + more.to_s + " more)" : "")].compact.join(" ").
      Do nothing when there are no ids. Never set a proposal or hint for a deny, for a lock edition or while the plane is active.

      Protection. Support.write_class: return "policy.edit" when File.expand_path(path) equals Exceptions.path (rescue to false when Exceptions.path is nil or raises),
      before the existing checks. Evaluate.protected_paths: add Exceptions.path to paths when non-nil, beside the ledger path line. A write, redirect
      or edit of the file by an agent is then denied like a ledger edit.

      Benign read. In Classify::Benign::POLISPEC_READ add "exceptions" => [{"list" => JSON_FLAG}] so `polispec exceptions list` is a benign read.

      Doctor. commands/doctor.rb: when Exceptions.load.problems is non-empty add a finding kind "exceptions_invalid", project "-", detail the first problem
      (the same shape and severity as judgments_chain_broken).

    acceptance: >-
      With a scratch directory shelf (a global.yml with one trivial rule so every path is governed, plus an exceptions.yml entry
      {kind control, tool Bash, command ". $B/env.sh", scope global}) and a scratch ledger with one live project, hook pretool --harness claude
      on a Bash call "B=/tmp/x; . $B/env.sh; echo ok" prints nothing (allow) and the judgment record carries exceptions [aex_...]; the same call with
      command ". $B/other.sh" asks POLISPEC-TOOL-UNKNOWN, the ask text ends with the promote hint, and exception_proposals.jsonl holds an apr_ line
      for ". $B/other.sh"; a Monitor call and a Bash call behave the same; an unknown tool name "SomeTool" asks, and with an entry {kind control, tool SomeTool}
      it is allowed; an entry for tool Bash with scope {project: other dir} does not apply from the project cwd; edition lock (EDITION file or setting)
      denies exactly as the base and writes no proposal; polispec.exceptions off restores the base output byte for byte (compare with the base tree's
      bin/polispec on the same inputs); an agent-style Write of the exceptions file path through hook pretool is denied with POLISPEC-CONTROL-PROTECTION and
      a shell redirect into it is classified policy.edit; a rule warn on a Bash command (use a scratch rule with verdict warn) is lifted by a kind rule
      entry naming that rule id and still warns for another rule id; explain on the same inputs reports the lifted answer and writes no proposal or judgment;
      plan global on the scratch shelf is unchanged by an exceptions entry.

  - id: cli
    depends_on: [core]
    deliverable: polispec exceptions list|add|promote|remove work end to end against a scratch git shelf and refuse everywhere else.
    detail: |
      Read lib/polispec/commands/allow_once.rb (TTY confirmation with Operator::Tty.confirm!), lib/polispec/commands/apply.rb
      (apply_global, gate, commit) and lib/polispec/plan.rb (build_global, finalize, how PlanCommand obtains a Plan for the global
      target) and lib/polispec/commands/judgments.rb (a command with verbs). Register the command with CLI.register("exceptions",
      ExceptionsCommand, summary: "list, add, promote and remove persistent exceptions to guard asks"); commands are glob-loaded, edit no registry.

      Usage (print to stderr and exit 2 on a malformed line):
        polispec exceptions list [--json]
        polispec exceptions add --command GLOB [--tool NAME] [--kind control|rule] [--rule ID] [--global] [--note TEXT]
        polispec exceptions promote PROPOSAL_ID... [--command GLOB] [--global] [--note TEXT]
        polispec exceptions remove ENTRY_ID

      list: read only. Without --json print one block: enabled yes|no, the exceptions file path (or "no global layer"), problems if any, then
      one line per entry "aex_id kind tool command|- rule|- scope note" and one line per pending proposal "apr_id kind tool command|- rule|- cwd age".
      --json prints {"enabled":Boolean,"path":String|null,"problems":[String],"entries":[entry...],"proposals":[proposal...]}. Exit 0.

      add: defaults tool Bash and kind control. tool Bash requires --command, another tool forbids it; kind rule requires --rule and tool Bash;
      kind control forbids --rule. Scope: --global gives {global: true}; otherwise {project: root} where root is the canonical git toplevel
      of the current directory (git -C . rev-parse --show-toplevel) and the canonical current directory when that fails. command is stored normalized.
      A pattern whose first word contains a glob character fails with code invalid_pattern. An entry with the id already present fails with code duplicate.

      promote: every id must be a pending proposal (code unknown_proposal otherwise). --command replaces the command of the proposal and is
      allowed only with exactly one id; the same first-word rule applies. Scope as for add, but the project root comes from the proposal's cwd
      (git toplevel of that cwd when it still exists, else that cwd), not from the current directory. The entries are added in one operation; on
      success the promoted proposals are forgotten.

      remove: the id must exist (code unknown_exception).

      Every mutation, in this order, with Operator::Failure.new(code, message) and exit 1 (message to stderr) on a failed step:
        1. refuse when HarnessControls::Plane.resolve status is "active" (code sealed_authority) or "broken"; refuse when Layers.source is nil (global_unconfigured) or its kind is not :repo (global_not_repo); refuse when git HEAD of source.repo is not source.ref (not_on_ref);
           refuse when git status --porcelain in source.repo restricted to source.path is non-empty (code dirty_shelf, naming the first path), because apply global commits every file under the shelf path.
        2. read the current committed document through Exceptions.load; refuse (code exceptions_invalid) when it has problems; compute the new entries; refuse when the result would exceed MAX_ENTRIES or fail Exceptions.validate.
        3. Operator::Tty.confirm! with the phrase "exceptions add ID", "exceptions promote ID ID", or "exceptions remove ID" (the ids, in the order given), the prompt showing for each entry: kind, tool, command, rule, scope and note, and for promote the proposal's cwd. NotTty and PhraseMismatch are reported like allow_once.rb reports them (stderr "polispec: not_tty: ..." and "polispec: confirmation_failed: ...", exit 1).
        4. write Exceptions.dump(new entries) atomically (temp file and rename in the same directory) to File.join(source.repo, source.path, FILE). No backup copy is made: git HEAD is the backup, and step 1 guarantees nothing else is uncommitted.
        5. build the plan for target global from the worktree with the same Plan class and spec `polispec plan global` uses, then carry it out with the same code `polispec apply global --confirm PLAN_ID` runs, passing the plan's own id as the confirmation (the typed phrase was the operator's confirmation).
           Print one line "exceptions: <added|removed> ID... (plan PLAN_ID, committed in REPO)".
        6. if step 5 raises, restore the file: write back the original bytes when the file existed before step 4; when it did not, move the new file to <state home>/exceptions.yml.failed-<UTC yyyymmddHHMMSS> (a move, not a delete); then report the original error and exit 1.
        7. Exceptions.reset!.
      Only the exit codes 0 (done), 1 (refused or failed), 2 (usage) are used.

    acceptance: >-
      Against a scratch git repository standing in for the shelf (a polispec/ directory with global.yml committed on branch main, configured through the global repo/ref/path settings): list on an empty shelf prints enabled yes and no entries;
      add driven through a pty (use script -qec or Ruby PTY; a plain pipe must exit 1 with not_tty) with the right phrase creates exceptions.yml, one new commit on main whose message is
      "Apply polispec plan plan_...", and list shows the entry; a wrong phrase changes nothing; add of the same entry again fails duplicate; add with --command "*x" fails invalid_pattern;
      with an unrelated uncommitted file under polispec/ add fails dirty_shelf; HEAD on another branch fails not_on_ref; a plain-directory shelf fails global_not_repo; an active plane fails
      sealed_authority (use the scratch plane fixture the smoke suite uses, or state that it could not be exercised); promote of a proposal written by a hook run adds the entry and removes the proposal, promote of an
      unknown id fails unknown_proposal; remove deletes the entry in a new commit; when the plan or apply step is made to fail (for example by making the repo read-only after step 3 is
      simulated in a copy) the original file is restored byte for byte. The hook allows the call after promote, with the entry's id on the judgment record.

acceptance:
  - id: A1
    check: Every acceptance block above, run for real, with the exact commands, scratch environment and observed output recorded in the report.
  - id: A2
    check: >-
      With no exceptions file and polispec.exceptions off, hook pretool stdout, exit status and the judgment record bytes (apart from ids, timestamps, digests and engine fields) are identical to the base tree's bin/polispec
      on at least these calls: a benign Bash line, a Bash line running source, an unknown tool, an undeclared MCP call, a Write into a live project's prod checkout, and a deny. With polispec.exceptions on and no
      exceptions file the only difference is the promote hint appended to asks that have a proposal.
  - id: A3
    check: ruby -wc passes on every changed .rb file, bin/polispec doctor and bin/polispec validate judgment still run as on the base, and `bin/polispec smoke run --scenarios` is not required.
report:
  - The diff summary per file.
  - The exact commands and scratch environment used for each acceptance check, and each result.
  - Every place you deviated from this blueprint or could not do what it says, and why.
  - Anything you found in the touched code paths that writes state or changes output that this blueprint did not anticipate.
