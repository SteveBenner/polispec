schema: is.v1
metadata:
  name: Polispec harness controls and sealed editions
  slug: harness-controls
  version: 0.1.0
  created: '2026-10-13'
  status: accepted
  supersedes: null
  base_commit: 5b2b6af78ac6
  base_version: 0.17.1
  intended_release: 0.18.0
  standards_referenced:
    - {id: Semantic Versioning 2.0, role: New public CLI and control contract require a minor release.}
    - {id: IEEE 1016-2009, role: Explicit interfaces and deployment boundaries make independent implementation possible.}
  worker: {model: gpt-5.6-sol, effort: medium, harness: codex}
  execution_status: wave_5_review_repairs
  execution_blocker: null
vision:
  problem: Existing environment policy does not provide a deterministic harness-control compiler, installation receipts, or a protected control plane. Generic adapters and permissive failure paths do not support a universal enforcement claim.
  outcome: An agent expresses controls in a documented grammar or YAML IR, previews native artifacts, installs only tightening changes, and observes honest verification results. An operator seals a protected plane. Standard and lock editions share all implementation code.
  success_metrics:
    - {id: SM-1, statement: Every compiled control is traceable., measurement: Plan and receipt inspection, target: Every control has a canonical form, digest, backend disposition, and verification result., deadline: Before release.}
    - {id: SM-2, statement: Lock never reports certification without evidence., measurement: Run verify with missing or failing prerequisites., target: Zero certified axes with absent evidence., deadline: Before release.}
  non_goals:
    - A model service translating natural language inside polispec.
    - New controls for Pi or DeepSeek beyond preserving their existing declared compatibility.
    - Production access, promotion to stable, or activating existing live-user projects during implementation.
    - Automatically changing the operator's group membership, sudo policy, container setup, or existing harness hooks.
    - A hosted baseline manifest or a nonempty default lock network allowlist.
    - Certification that survives a compromised kernel, administrator, or harness executable.
stakeholders:
  - {role: calling agent, concerns: [Deterministic vocabulary, structured errors, tightening authority.]}
  - {role: operator, concerns: [Protected authority, recoverability, honest evidence.]}
  - {role: plugin installer, concerns: [Portability, existing settings compatibility, SDK contracts.]}
assumptions:
  - {id: A-1, statement: Linux is the first sealed-plane target., confidence: high, falsifier: A required harness cannot expose its documented Linux control files.}
  - {id: A-2, statement: A managed hook can protect its configuration without guaranteeing failure-closed execution., confidence: high, falsifier: A runtime demonstrates an independently enforced failure-closed boundary for every required axis.}
constraints:
  technical:
    - Ruby standard library; retain the manifest's Ruby compatibility floor unless a measured incompatibility is returned to the primary.
    - CLI commands and classifier families remain glob-loaded files.
    - No new test suites or explanatory source comments. Verification probes are product functionality, not a parallel test framework.
    - Use rplugin ports for state, events, schedule, registry, secrets, and notifications. Never vendor the SDK.
    - Harness config files and polispec-owned sealed files are explicitly owned artifacts; other services' files remain outside the plugin's domain.
    - Native package files are generated by rplugin package from native:true in the manifest; retain the existing extension enrollment list and do not hand-edit generated descriptors or hooks.
    - Back up in place before replacing or deleting an owned artifact. Never remove another installer's entries.
    - No root-plane installation or immutable flags on this host during implementation; prepare and verify in an isolated development destination.
  organizational:
    - All product interview answers are settled; a worker returns any remaining conflict to the primary.
    - A worker is not alone in the codebase and must preserve others' edits.
    - Worker model and effort are explicit; the operator authorized GPT-5.6 Sol at medium for subsequent work. No provider crossing or silent fallback.
requirements:
  functional:
    - {id: FR-01, statement: Publish and parse a deterministic control grammar and polispec.control/v1 IR., rationale: Interview Translation., verification: demonstration, priority: must, satisfied_by_slices: [slice_0_foundation, slice_1_language]}
    - {id: FR-02, statement: Compile controls to native Claude Code and Codex artifacts with exact capability dispositions., rationale: Harness-level controls., verification: demonstration, priority: must, satisfied_by_slices: [slice_2_claude, slice_2_codex]}
    - {id: FR-03, statement: Compile Hermes and agy controls using their native event and decision formats., rationale: Harness-level controls and Antigravity decision., verification: demonstration, priority: must, satisfied_by_slices: [slice_3_other_harnesses]}
    - {id: FR-04, statement: Provide plan, install, verify, uninstall, scan, and machine-readable CLI results., rationale: Agent-facing API., verification: demonstration, priority: must, satisfied_by_slices: [slice_4_lifecycle]}
    - {id: FR-05, statement: Agents may add only provably tightening controls at user or project scope., rationale: Agent power., verification: demonstration, priority: must, satisfied_by_slices: [slice_1_language, slice_4_lifecycle, slice_5_guard]}
    - {id: FR-06, statement: Enforce mode returns a denial for every non-read-only call when judging fails., rationale: Fail mode., verification: demonstration, priority: must, satisfied_by_slices: [slice_5_guard]}
    - {id: FR-07, statement: Judge MCP calls explicitly with standard ask-unless-declared and lock deny-unless-declared., rationale: MCP default., verification: demonstration, priority: must, satisfied_by_slices: [slice_5_guard]}
    - {id: FR-08, statement: Judge modifications to installed controls as control.edit and prevent agent loosening., rationale: Agent power and trust anchor., verification: demonstration, priority: must, satisfied_by_slices: [slice_5_guard, slice_4_lifecycle]}
    - {id: FR-09, statement: Detect container access and root-equivalent authority; advise first and arm root_guard on a distinct follow-up scan., rationale: Container risk answer., verification: demonstration, priority: must, satisfied_by_slices: [slice_1_environment, slice_5_guard]}
    - {id: FR-10, statement: Seal an exact Git source in standard and root-authored source in lock., rationale: Seal source., verification: demonstration, priority: must, satisfied_by_slices: [slice_4_plane]}
    - {id: FR-11, statement: Sealed authority ignores user-controlled overrides and requires an authenticated privileged operator for loosening., rationale: Env override and trust anchor., verification: demonstration, priority: must, satisfied_by_slices: [slice_4_plane, slice_5_guard]}
    - {id: FR-12, statement: Standard uses path sandboxing and open network; lock uses path sandboxing and an empty network allowlist., rationale: OS sandbox and Allowlist., verification: demonstration, priority: must, satisfied_by_slices: [slice_2_claude, slice_2_codex, slice_3_other_harnesses, slice_3_os]}
    - {id: FR-13, statement: Refuse lock arming or certification when required axes are unsupported, unverified, failing, or root-equivalent access is reachable., rationale: Environment-dependent lock guarantee., verification: demonstration, priority: must, satisfied_by_slices: [slice_1_environment, slice_4_lifecycle, slice_4_plane]}
    - {id: FR-14, statement: Report all Antigravity surfaces as uncertifiable for lock and GUI surfaces as directive-only., rationale: Antigravity answer., verification: inspection, priority: must, satisfied_by_slices: [slice_3_other_harnesses, slice_4_lifecycle, slice_final_integration]}
    - {id: FR-15, statement: Keep one implementation and an installable polispec-lock branch differing only in EDITION., rationale: Lock branch., verification: demonstration, priority: must, satisfied_by_slices: [slice_5_release_lock, slice_final_integration]}
    - {id: FR-16, statement: Provide an operator-only sealed activation command without activating a real project during this change., rationale: Go live., verification: demonstration, priority: must, satisfied_by_slices: [slice_4_plane]}
    - {id: FR-17, statement: Back up changed native files, maintain ownership receipts, and preserve unrelated entries through install and uninstall., rationale: Host files., verification: demonstration, priority: must, satisfied_by_slices: [slice_4_lifecycle]}
    - {id: FR-18, statement: Document the grammar, APIs, limitations, edition defaults, and the deferred baseline manifest., rationale: Agent-facing language and Allowlist answer., verification: inspection, priority: must, satisfied_by_slices: [slice_final_integration]}
  non_functional:
    performance:
      - {id: NFR-P-1, axis: guard latency, budget: Target at most 200 ms for exercised warm local guard invocations; no external model call., scope: Hook decision path., method: Record elapsed durations during required real CLI journeys; report observed samples without claiming a percentile or creating a benchmark suite.}
      - {id: NFR-P-2, axis: input resources, budget: At most 1 MiB IR input, 256 controls per request, 64 KiB hook input, and 10 seconds per hook invocation., scope: Parser and guard., method: Invoke documented boundary inputs and observe bounded rejection.}
    reliability:
      - {id: NFR-R-1, axis: installer atomicity, budget: Zero partially applied receipt states reported as successful., method: Interrupt a scratch installation and observe recovery or failure with old controls preserved.}
      - {id: NFR-R-2, axis: subprocess bounds, budget: Version probes 5 seconds, scan probes 10 seconds, live verification 60 seconds per axis; output capped at 64 KiB., method: Run a delayed scratch probe and inspect timeout disposition.}
    security:
      - {id: NFR-S-1, axis: authority, requirement: Root-owned non-user-writable authority and runtime ancestry; no privilege inferred from TTY or environment strings.}
      - {id: NFR-S-2, axis: integrity, requirement: SHA-256 canonical digests bind controls, native artifacts, runtime, and provenance.}
    portability:
      - Absent harnesses report unavailable; generated artifacts alone never count as live verification.
      - Unsupported operating systems receive plans and explicit unsupported seal results, never lock certification.
    compatibility:
      - Existing unsealed ledger and global overrides retain their behavior.
      - Existing policy, behavior, code-spec, promotion, and deployment receipt contracts remain unchanged except for the declared new action classes.
    observability:
      logs:
        - {event: polispec.control, fields: [operation_id, control_digest, edition, harness, scope, disposition, duration_ms], level: info, schema: JSON through Events.emit.}
        - {event: polispec.plane, fields: [operation_id, provenance_digest, runtime_digest, disposition], level: info, schema: JSON through Events.emit.}
      metrics:
        - {name: control_duration_ms, type: observation, unit: milliseconds, labels: [operation, harness, disposition]}
      traces:
        - {span: polispec.harness.operation, attributes: [operation_id, control_digest, harness]}
      rule: Emit after successful state commits. Event delivery failure cannot turn a denial into allow or undo installation. Never log tool payloads, credentials, or override values.
architecture:
  style: Deterministic compiler with native backends and a privileged installation boundary.
  c4:
    context: Agents request controls; operators own loosening and sealing; harnesses execute native controls; rplugin supplies capability ports.
    containers: [Existing polispec CLI, pinned sealed CLI runtime, native harness configurations.]
    components: [Grammar, IR validator, monotonicity checker, capability catalogue, backend registry, installer, verifier, plane, guard.]
  data_flow: Natural-language request is translated by the caller into grammar or IR; parser produces canonical IR; plan selects explicit backend capabilities; installer merges owned entries and commits a receipt; verifier inspects installed artifacts and runs native probes; guard applies the strictest existing policy and control verdict.
  decisions:
    - {id: ADR-1, decision: No model in the security path., rationale: The calling agent translates; polispec is deterministic.}
    - {id: ADR-2, decision: Root ownership and live behavioral evidence are separate certification requirements., rationale: Managed hook callbacks may still fail open.}
    - {id: ADR-3, decision: Agent controls are an additional verdict ceiling., rationale: An allow from a new layer must never override an existing deny.}
    - {id: ADR-4, decision: Standard seals Git-authored source; lock source is authored in /etc., rationale: Explicit edition-specific answer supersedes the general AIHOME preference.}
    - {id: ADR-5, decision: Harness-owned artifacts are an exception to the host-file restriction; service access remains through ports., rationale: Approved Host files answer.}
    - {id: ADR-6, decision: Preserve other hooks and present consequences before managed-only installation., rationale: Locking all non-managed hooks out can disable existing workflows; do not silently replace them.}
data_model:
  entities:
    - name: Control
      fields: [id, trigger, action, match, effect, reason, fixture, canonical, digest]
      invariants: [Unknown fields rejected., IDs unique per document., Canonical digest stable., No executable user text in a security callback.]
    - name: Plan
      fields: [schema, operation_id, control_digest, edition, harness, scope, artifacts, capabilities, authority, findings]
      invariants: [Every requested capability has a disposition., Plan never claims installation or certification.]
    - name: InstallationReceipt
      fields: [schema, installation_id, control_digest, edition, harness, scope, owned_entries, artifact_digests, backups, runtime_digest, installed_at]
      invariants: [No success receipt before all artifact writes commit., Ownership names entries rather than whole shared files.]
    - name: Verification
      fields: [schema, installation_id, actual_version, integrity, ownership, probes, certified, findings, checked_at]
      invariants: [Unverified is distinct from passing., Local adapter invocations do not prove native hook coverage., GUI Antigravity is never certified.]
    - name: Plane
      fields: [schema, edition, generation, source_kind, source_ref, source_digest, runtime_digest, trusted_sdk, authority_files]
      invariants: [No writable ancestor or symlink in privileged authority., No user-controlled setting overrides sealed truth.]
  migrations: {strategy: New receipts are versioned; do not rewrite legacy state or existing deployment receipt identities.}
api_contracts:
  common:
    exits: {success: 0, invalid_or_failed: 1, usage: 2, prerequisites_or_operator_required: 3}
    json: {schema: polispec.harness.result/v1, fields: [ok, operation, operation_id, edition, data, findings], finding_fields: [code, detail, control_id, harness, capability, next_step]}
    rules: Strict option validation; JSON on stdout and diagnostics on stderr; no shell evaluation; no guessed scope or silently dropped control.
  commands:
    - {name: 'polispec harness grammar [--json]', result: Grammar, vocabulary, supported predicates, effect catalogue, examples, and limits.}
    - {name: 'polispec harness parse SENTENCE|--file FILE [--json]', result: Canonical polispec.control/v1 document; syntax errors include offset and suggestions.}
    - {name: 'polispec harness plan FILE --harness NAME --scope user|project|managed [--project PATH] [--json]', result: Deterministic artifacts and authority classification; no mutation.}
    - {name: 'polispec harness install FILE --harness NAME --scope SCOPE [--project PATH] [--dry-run] [--json]', result: Installation receipt or explicit operator_required; repeat identical input is idempotent.}
    - {name: 'polispec harness verify INSTALLATION_ID [--json]', result: Integrity checks and per-axis live evidence; absent runtime is unavailable.}
    - {name: 'polispec harness uninstall INSTALLATION_ID [--owner USER --scope user|project [--project PATH] [--state-home PATH]] [--dry-run] [--json]', result: Operator authority required for loosening; an explicit owner selects a mutable SDK receipt profile. Preserve unrelated entries and refuse conflicting changed bytes.}
    - {name: 'polispec harness scan [--harness NAME] [--json]', result: Exposure findings and scan sequence; standard advises first and arms root_guard on a later scan.}
    - {name: 'polispec seal --from REPO@COMMIT [--dry-run] [--json]', result: Standard committed source sealed by a privileged operator.}
    - {name: 'polispec seal --source /etc/polispec/source [--dry-run] [--json]', result: Lock root-authored source sealed by a privileged operator.}
    - {name: 'polispec plane status|verify [--json]', result: Active generation, provenance, ignored override names, and certification prerequisites.}
    - {name: 'polispec plane activate PROJECT_ID... [--dry-run] [--json]', result: Privileged operator updates status only after a green plane and project validation; journal records exact IDs and prior status.}
  grammar:
    agent_sentence: 'when agent VERB OBJECT [where KEY = JSON_VALUE [and KEY = JSON_VALUE ...]] then EFFECT [with JSON_OBJECT] [because JSON_STRING]'
    verbs: [read, write, delete, run, call, fetch, spawn, commit, push, tag, merge, rewrite]
    objects: [file, command, mcp, url, agent, repository, control]
    effects: [deny, ask, restrict, inject, observe]
    effect_payloads:
      deny: No payload; always a verdict ceiling.
      ask: No payload; native ask or denial awaiting exact operator authorization.
      restrict: 'Payload keys are paths and network only. paths is {read: [absolute globs], write: [absolute globs]}; network is {mode: open|allowlist, domains: [domain strings]}. Reject unsupported combinations explicitly.'
      inject: 'Payload is {text: UTF-8 string}; maximum 8 KiB. Emit context on a supported context-bearing event; never execute it.'
      observe: 'Payload is {event: control.observed}; optional declared safe metadata is limited to scalar identifiers. No command or tool payload.'
    predicates: Preserve the existing policy match keys env, class, crosses, destructive, shape, lock_held, live_binary, supervised, pin_regress, tag_claimed, base_unpushed, and ref with their existing types. Add path, tool, server, operation, domain, and role as nonempty strings. Reuse Engine predicates at evaluation time; no arbitrary Ruby or shell predicates.
    special_trigger: 'when schedule JSON_STRING then verify CONTROL_ID [because JSON_STRING]'
    schedule: OnCalendar string handed to the existing schedule port; callback is pinned polispec verify argv, never arbitrary command text.
    mapping: File write/delete use fs.write/fs.delete; repository operations use existing git classes; control paths become control.edit; MCP becomes mcp.call; URL becomes web.fetch; delegation becomes agent.spawn; shell remains explicit shell.exec. Listed verbs and objects are vocabulary, not a Cartesian product. Reject read file because the existing secrets.read class does not describe generic file reads; never silently reinterpret it.
    canonicalization: Normalize vocabulary aliases, sort predicate keys, preserve JSON value types, and encode UTF-8 with stable JSON serialization before SHA-256.
    generated_fields: A sentence defaults to trigger pre_tool, uses id ctl_ plus the first 16 hexadecimal characters of its canonical SHA-256, and carries a deterministic synthetic fixture generated from the verb, object, and supported predicates. If a safe matching fixture cannot be constructed, parsing reports fixture_required and the caller supplies it through YAML IR. Schedule sentences use an explicit referenced control ID and do not create a tool fixture. A standalone parsed schedule is a fragment; semantic validation and installation require composition with its referenced tool control in the same document.
    authority: Agent effects deny, ask, and supported restrict are additive. Inject and observe do not reduce enforcement and require declared safe payloads. Changing, deleting, broadening a scope, reducing a restriction, or an unprovable comparison returns operator_required.
  ir:
    schema: polispec.control/v1
    root_fields: [schema, controls]
    required_control_fields: [id, trigger, action, match, effect, fixture]
    effect_payload_field: effect_params contains the effect's documented JSON object; absent for deny and ask. Unknown or mismatched parameters are invalid.
    scheduled_control: A distinct schema union member with required id, trigger=schedule, calendar, target_control_id, and effect=verify; optional reason, canonical, and digest. No action, match, or tool fixture. Calendar is a bounded nonempty OnCalendar string and target_control_id names an existing tool control in the same document.
    trigger_types: [pre_tool, session_start, post_tool, stop, schedule]
    fixture: Synthetic normalized tool input plus expected disposition; schema-validated, non-destructive, and required for enforceable controls. Injection and observation fixtures verify emitted context or event. Generated fixtures use a scratch path under /tmp/polispec-control-fixtures and contain no network or privilege-changing command; they are intercepted native actions, never actions to execute if denial fails. Where a native probe cannot prevent a failed denial from causing a real side effect, report unavailable and do not run it.
  interface_contracts:
    - {name: Controls.parse, signature: 'parse(text) -> Document or ParseError(offset, suggestions)'}
    - {name: Controls.validate, signature: 'validate(data) -> structured errors'}
    - {name: Controls.monotonic, signature: 'monotonic(current, proposed, actor) -> tightening|equal|operator_required with reasons'}
    - {name: Backends.fetch, signature: 'fetch(name) -> backend; unknown name raises explicit usage error'}
    - {name: Backend.plan, signature: 'plan(document, context) -> artifacts[], capabilities[], findings[]; no writes'}
    - {name: Backend.normalize, signature: 'normalize(native_event) -> Harness::Input; reject invalid envelopes'}
    - {name: Backend.render, signature: 'render(verdict, event) -> native stdout, stderr, exit status'}
    - {name: Backend.probe, signature: 'probe(receipt, runner) -> per-axis native evidence; adapter fixtures alone are not native evidence'}
    - {name: Controls.evaluate, signature: 'evaluate(input, context) -> verdict ceiling including undeclared tool handling'}
    - {name: Environment.scan, signature: 'scan(context) -> exposure categories, sequence, and effective root_guard'}
    - {name: Plane.resolve, signature: 'resolve() -> unsealed or validated fixed-root plane; invalid existing plane returns broken, never unsealed'}
    - {name: Plane.operator!, signature: 'operator!(operation) -> privileged identity or operator_required; ignore claimed identity in ENV'}
    - {name: Lifecycle.install, signature: 'install(plan, actor) -> receipt after atomic apply, otherwise structured recovery failure'}
  implementation_conventions:
    values: Public data results are JSON-ready Hashes with string keys; foundation structs may be used internally but are converted with to_h before returning. Controls.validate returns an array of schema error hashes. Controls.monotonic returns a hash with disposition and reasons; dispositions are tightening, equal, and operator_required. A nil current argument means verified absence of an installed document, supplied by Lifecycle after inspection; malformed non-nil documents remain operator_required, and an empty proposed document remains invalid. ParseError exposes offset, suggestions, code, and to_h.
    digests: A document control_digest is SHA-256 of compact JSON with recursively sorted object keys and preserved array order. Artifact digest is SHA-256 of the exact emitted bytes. Equivalent object key order cannot change either a canonical control artifact or its document digest. Do not hash a pretty-printed document as control_digest.
    restriction_composition: Restrictions are verdict ceilings. Combining controls must never union distinct allowlists or let an open network rule erase an allowlist. Where an exact safe intersection or predicate-conditioned native restriction cannot be expressed, refuse that combination explicitly instead of broadening authority. A generated global sandbox restriction is not equivalent to a conditional control.
    context: Backend context uses string keys scope, edition, project, home, runtime_path, runtime_argv, version, and existing. Project scope requires an absolute project path from the CLI; user home defaults to Dir.home. runtime_path defaults to ROOT/bin/polispec only for unsealed development. runtime_argv, when present, is a nonempty absolute-executable argv prefix supplied by verified plane authority; otherwise use [runtime_path]. Never shell-evaluate its elements. Missing version means unknown support. No context field can confer operator authority or certify a plane.
    artifacts: Every backend plan returns the complete Plan hash. Artifacts contain absolute path, UTF-8 content, SHA-256 digest, format, and ownership. ownership contains kind (control_document, json_entries, toml_block, yaml_entries, or exclusive), entries (owned JSON pointers or named blocks), and control_ids. Shared documents use entry ownership; exclusive files must be polispec-namespaced and never overwrite foreign bytes.
    ownership_selectors: JSON and YAML ownership entries are RFC 6901 pointers to real containers or scalar leaves in the emitted fragment. The root pointer is the empty string, including control_document and exclusive artifacts; slash names an empty-string object key and is not the root. Array contributions are the exact fragment values, not invented array member keys. Receipts record artifact path, format, pointer, merge_mode, contributed values and digests, prior scalar value or absence, and control IDs. Preserve unrelated keys and array values. Refuse conflicting scalar values and allowlist merges unless a safe tightening is proved; never blindly union allowlists. TOML named blocks require matching machine-readable begin/end markers in the emitted bytes. Without a supported TOML parser, unrelated existing TOML can be refused; identical fully owned blocks remain idempotent.
    receipt_backups: artifact_digests maps each absolute target to its installed whole-file byte digest. backups rows contain target, prior_exists, backup_path, prior_digest, backup_digest, mode, uid, and gid. Every backup is in place beside its target. Uninstall checks exact owned contributions and removes only those contributions; it never restores an entire shared-file backup over unrelated edits. Whole-backup restoration is restricted to a locked failed transaction or an exclusive owned artifact. Changes to owned bytes or selectors produce an explicit conflict.
    transaction: Installation state is append-only in harness_installations, keyed by installation_id and operation_id with monotonic sequence and status prepared, committed, rollback_complete, recovery_required, or uninstalled. Acquire a target lock, inspect current bytes and controls, append prepared and read it back before writes, apply and verify every artifact, then append committed and read it back before reporting success. The SDK append return value alone is not evidence. Any state resolution, append, readback, write, or verification failure prevents success and triggers bounded recovery while retaining evidence. An unresolved prepared or recovery_required record blocks another operation on the same targets. Emit events only after committed state is confirmed.
    privileged_records: OperatorRecords.append(stream, record, identity:) and OperatorRecords.read(stream) own fixed /var/lib/polispec records. Writes revalidate actual privileged identity; the identity hash alone cannot authorize. Managed and protected-core receipts, pause, authorization, activation, and rollback authority use this adapter. Copies in an ordinary state port are diagnostic only. User/project additions use the required SDK state port even with an active plane; they are mutable tightening overlays, never protected authority or certification evidence. A user record cannot authorize a protected target or a privileged removal.
    mutable_owner_handoff: >-
      The SDK has no owner selector and its standalone state is per-user. Uninstall without --owner selects protected OperatorRecords only. For a mutable overlay, require --owner USER and explicit --scope user|project; --project is required exactly for project scope. Optional --state-home names the selected user's XDG state root, defaulting to the passwd home plus .local/state; selector options are invalid without --owner. Lifecycle.uninstall and Lifecycle.receipt accept matching owner, scope, project, and state_home keywords; injected development ports cannot combine with an owner selector. Authenticate the root parent through Plane.operator!, resolve the selected non-root passwd UID/GID, and validate nonsymlink owned state/project boundaries. A bounded child permanently drops supplementary groups, GID, and UID before constructing fresh SDK ports or consuming mutable receipts. Set its SDK profile from the selected passwd account and validated state root only after dropping privileges; these values configure ports, never authenticate the operator. File changes, SDK journal writes, and user-scheduler operations all run as that selected user. Bound child time to 60 seconds and response size to the existing input limit; terminate its process group on timeout or incomplete output. Before any write, require a latest committed unprotected receipt, matching transaction/document/control digest, exact explicit scope, canonical backend artifact targets and ownership selectors, selected-user ownership, and exclusion of protected plane/runtime/SDK/record paths. The child never reads OperatorRecords or accepts a mutable receipt as protected authority. A missing profile, unsafe receipt, or failed privilege drop is a structured refusal. Dry-run uses the same authenticated selection and validation without mutation.
    plane_result: Plane.resolve returns a string-keyed hash with status unsealed, active, or broken; findings and ignored_overrides contain names without values. Active adds edition, generation, runtime_argv, provenance, authority_files, and operator_records naming the fixed protected record root. Other statuses never supply trusted runtime argv. Plane.operator! returns verified effective uid, executable and interpreter realpaths, provenance digest, and operation, or raises an error with code operator_required mapped to exit 3. No caller-supplied identity field grants authority.
    plane_consumers: Active Plane.resolve also supplies settings (a protected settings snapshot), paths (ledger, global, home, envs_root, code_specs_repo, and code_state as applicable), and controls (harness names mapped to protected control-document paths). Plane.setting(key, default = nil) and Plane.path(name) return protected values for active, nil for unsealed, and raise for broken; no ENV fallback inside these methods. Plane.requested_edition returns active edition or the EDITION build floor plus the unsealed polispec.edition setting, rejecting invalid values. All consumers use these interfaces rather than independently rediscovering authority.
    schedule_api: >-
      Schedule.plan(document, receipt, context = {}) returns jobs and findings. Schedule.install(document, receipt, context = {}, port_set: nil) returns installed jobs with IDs, fixed argv, port results, and findings; Schedule.uninstall(job_ids, port_set: nil) returns uninstalled IDs and findings. Each job validates target_control_id in the receipt's document and invokes runtime_argv plus harness verify INSTALLATION_ID --json, verifying the installation containing that target. Record target in job identity and description; do not invent a --control CLI option. Lifecycle authorizes before scheduling, records deterministic IDs in its prepared transaction, and recovers partial schedule changes. Port acceptance is distinct from observed job execution.
    control_document: Each harness plan includes its complete canonical IR as a control_document JSON artifact. Project scope uses PROJECT/.polispec/harness/HARNESS/controls.json; user scope uses HOME/.config/polispec/harness/HARNESS/controls.json; managed scope uses /etc/polispec/harness/HARNESS/controls.json. The installed callback invokes the absolute runtime with hook pretool --harness NAME --controls-file ABSOLUTE_PATH. Claude's backend name claude-code maps to hook name claude. The guard slice implements this option, validates it, and ignores it in favor of protected authority when sealed. Replacement documents must retain prior controls unless an operator authorizes loosening.
    project_callback_scope: A project control registered in a profile-global native hook must pass --controls-project ABSOLUTE_PROJECT_ROOT. Guard validates that boundary and applies the project document only when the normalized cwd or a classified action target lies within that root. Outside it, skip only that document and continue existing policy; never return an unconditional allow. Sealed mode ignores caller-supplied scope and uses protected installation records. Hermes project scope consumes this contract because its hook configuration is profile-global.
    additive_overlays: An active guard always loads its protected core document. Discover user/project additions only from validated installation records and canonical scope paths, never as a caller-selected replacement for that core. Validate additions as tightening-only ceilings and apply project boundaries; mutable records cannot supply a protected runtime, broaden scope, override a deny, or count toward certification. Missing mutable additions cannot remove the protected core.
    capabilities: Each row contains control_id, capability, disposition, and detail. Dispositions are generated, supported, unsupported, unverified, and unavailable; generated output alone is never native verification. Findings use api_contracts.common.json.finding_fields. Plan operation_id is derived from canonical document digest plus harness, scope, edition, and artifact paths, so identical plans are deterministic.
    rendering: Backend.normalize returns Harness::Input. Backend.render accepts Polispec::Verdict or a string-keyed equivalent and the native event; it returns stdout, stderr, and exit_status in a Hash. Native backend files require the existing harness input definition explicitly. Backend.probe returns an array of per-axis hashes with axis, status, evidence, and detail; runner is callable with an argv array and bounded execution options. Missing safe native probe support returns unavailable without invoking risky actions.
    state: >-
      New unprivileged state uses Rplugin::Ports.for(ID, root: ROOT).state append/read streams harness_scans and harness_installations. Existing State is not a substitute for the required port. Installation records contain a complete receipt plus controls and lifecycle status. An unavailable state port is a structured failure, never a successful ephemeral install. Environment.scan accepts read_only=true for diagnostics with no state or event writes; its result includes exposures, sequence, root_guard, lock_eligible, and findings. RootGuard.classify(tool_name, tool_input, cwd) returns an array of Polispec::Action records with class shell.exec and raw root_guard_risk metadata for denied container operations.
    actor: Actor input is a hash with scope and optional claimed kind, but privileged decisions always call Plane.operator! themselves. A claimed operator kind, environment flag, or caller-provided boolean is never authority. Lifecycle may load the eventual plane implementation lazily; it cannot rely on a writable receipt to supply privileged identity.
backend_requirements:
  catalogue:
    file: data/harness-capabilities.yml
    fields: [harness, surface, platform, minimum_version, events, native_paths, output_protocol, failure_behavior, config_scope, mutability, coverage_axes, sources]
    invariant: Missing evidence is unknown; no fabricated minimum version or support claim. Runtime probes decide certification.
  claude:
    source: https://code.claude.com/docs/en/hooks
    behavior: Use PreToolUse native decision output, synchronous command hooks, and onFailure block where supported. Managed hooks reference absolute pinned paths. Emit native permission and sandbox settings, preserving unrelated configuration. Managed-only hook restrictions require an explicit inventory of excluded existing hooks in the plan.
    certification: Version supports required failure behavior; controlled native failures and denials pass; config and runtime ancestry are protected; sandbox rejects unsandboxed escape paths for declared axes.
  codex:
    sources: [https://learn.chatgpt.com/docs/hooks, https://learn.chatgpt.com/docs/enterprise/managed-configuration, https://learn.chatgpt.com/docs/permissions]
    behavior: Emit requirements.toml managed hooks and native permission, exec-policy, filesystem, and network controls using the detected version's supported fields. Warn becomes deny plus exact operator authorization when native ask is unavailable.
    certification: Callback failure may leave tools enabled. Never count managed ownership as failure-closed proof. Any required axis without an independent native hard boundary or a successful native probe remains uncertified and keeps lock inactive. Report hosted and nested execution coverage separately.
  hermes:
    source: https://github.com/NousResearch/hermes-agent
    behavior: Use pre_tool_call and the native block/modify/context protocol from the pinned supported release; set fail_closed where available, inventory hook consent, and emit managed config plus tool restrictions. Do not use the generic Claude-shaped output adapter.
    certification: Dispatch failures, consent omissions, config reloads, and process-level tool coverage require native evidence. Managed config alone does not establish an agent-proof process boundary.
  antigravity:
    source: https://antigravity.google/docs/hooks
    behavior: agy CLI uses camelCase toolCall envelopes and its native allow/deny/ask protocol. Never emit auto_approve to satisfy an agent request. GUI surfaces remain directive-only. Immutable owned files are an operator-managed installation option, not an agent privilege.
    certification: Always false for lock; CLI enforcement requires actual runtime probes, otherwise mark generated/unverified.
  os:
    behavior: Compile path and network restrictions only to supported native OS or harness sandbox fields. Detect required executables; never silently substitute a shell-command classifier for kernel isolation. Timers are generated through ports.schedule, not handwritten systemd units.
    lock_network: Empty allowlist; explicitly deny egress where the runtime supports it. No implicit provider, package registry, or update endpoint. Planning and inspection remain possible offline.
sealed_plane:
  paths: {source: /etc/polispec/source, authority: /etc/polispec, runtime: /usr/local/lib/polispec, operator_records: /var/lib/polispec}
  standard_source: Require a full committed Git revision; read controls, ledger, and global policy from that object, not a dirty working tree. Record source digest and revision.
  lock_source: Require root-owned source ancestry directly under /etc/polispec/source; record canonical digest and edition.
  source_bundle: The authority source has ledger.yml, optional settings.json containing a machine settings object, controls/HARNESS.json documents, optional global/ containing the existing global-layer files, and optional code_specs/. Require at least one valid control document and a valid ledger; missing files are explicit prerequisites. Reject symlinks, path traversal, unknown harness names, malformed documents, and oversized inputs. Protected settings force enforce mode and cannot redirect authority outside the validated generation. Runtime source is the separately pinned committed polispec release; do not confuse an authority-bundle commit with the runtime commit. Dry-run reports both provenance domains and all missing prerequisites without root writes.
  runtime: Pin an exact polispec release, protected interpreter, and an independently installed protected rplugin SDK. Never copy or vendor the SDK. User-writable SDK code cannot support certification. The development entrypoint uses env ruby and is not itself a protected launch contract. A sealed launcher must select the interpreter by validated absolute path, remove Ruby/gem/bundler and SDK load-path redirects before interpreter startup, and load the protected SDK explicitly. Record launcher, interpreter, and dependency provenance. Unproven inherited process-loading behavior remains a certification finding; an absolute script path alone is insufficient.
  runtime_generations: Runtime releases, launchers, and descriptors use deterministic immutable commit-keyed paths beneath the fixed runtime root. Preparing a newer release preserves every path and digest used by the active generation. Canonicalize the selected system interpreter before protected ancestry checks. Runtime policy, provenance, and operator-record files must be readable by the ordinary harness guard while remaining root-owned and non-writable by that user; do not store raw tool payloads or secret values in those records.
  settings: Sealed settings and global policies are fixed-root truth. Ignore POLISPEC_* and RPLUGIN_POLISPEC_* authority overrides plus runtime redirects. Do not honor --root or development destination overrides in a sealed guard.
  records: Operator authorization, pause, and activation records use an owned privileged adapter behind the existing state interface. Unprivileged agent diagnostic state may use normal ports but never supplies authority.
  install: Build a complete new generation, validate it, back up existing artifacts, then atomically switch active generation. Fixed-root discovery treats an invalid existing seal as a broken guard.
  discovery: The fixed sentinel /etc/polispec/active.json is a regular atomically replaced record naming a generation beneath /etc/polispec/generations. Its absence is unsealed even when managed controls exist beneath /etc/polispec. Presence with malformed content, symlinks, missing generation, unsafe ancestry, or failed digests is broken. Never follow a user-directed active pointer or fall back from broken to unsealed. Retain the prior generation and restore the previous active record if post-switch verification fails.
  provenance: Source and runtime digests bind canonical manifests of relative paths, file modes, and exact byte digests. Record launcher, absolute interpreter, and independent SDK realpaths, uid, mode, and digests separately. The root-owned sealed launcher has a fixed path under /usr/local/lib/polispec and sanitizes Ruby, gem, bundler, SDK, and dynamic-loader redirects before interpreter startup. Bootstrap installation is distinct from activation; activation and certified guard use require re-execution through verified protected launch provenance. Unknown inherited process-loading behavior prevents certification.
  operator_auth: Require privileged effective identity and protected executable provenance; retain explicit confirmation for sensitive operations. Never treat SUDO_USER, POLISPEC_OPERATOR, or TTY alone as proof. Report passwordless or cached elevation as a certification finding rather than claiming a fresh password was obtained.
  privileges: Development verification uses isolated destinations and synthetic projects. Actual sealing and real project activation are operator-run final steps, outside worker authority.
  activation: Keep committed source provenance intact. Journal operator activation against the exact active generation, project ID, and prior status; expose validated effective status overrides through Plane.activation_overrides, consumed by Ledger.load only for an active plane. Never mutate committed source bytes in place to mark a project live. A broken plane, unknown project, failed project validation, missing required native evidence, or unauthenticated operator prevents activation.
editions:
  settings: polispec.edition is standard or lock; polispec.root_guard is a boolean defaulting to false. EDITION=lock is a build floor that a user setting cannot downgrade. The effective root guard is the OR of the explicit setting, the persisted scan state, and requested lock. Turning the setting off does not silently erase an armed scan state; loosening requires operator authority. The guard reads the persisted scan state without running expensive environment probes per tool call.
  standard: {mcp_undeclared: ask, sandbox_network: open, fail_mode: closed_mutations, root_guard: false, source_kind: git}
  lock: {mcp_undeclared: deny, sandbox_network: allowlist, network_allowlist: [], fail_mode: closed_mutations, source_kind: root_authored}
  selection: EDITION supplies the build default; standard permits the declared edition setting, but root-authoritative lock status cannot be downgraded by user environment or settings.
  refusal: Requested edition and effective mode are distinct. Unsafe or unsupported lock environments report lock inactive, no certification, standard enforcement behavior, and root_guard forced on. Do not present fallback as a successful lock install.
  root_guard:
    detection: Inspect effective groups, actual reachable daemon sockets, active Docker contexts, rootless indicators, LXD/Incus access, and available privilege paths using bounded local probes. A missing scanner is unknown, never safe.
    first_scan: Record exposure fingerprint and advise remediation; root_guard remains off unless already enabled or lock is requested.
    followup_scan: A distinct scan with continuing detected exposure enables root_guard and emits a clear notice. Multiple internal probes in one command count as one scan. Removal of exposure does not automatically disable an armed guard.
    persistence: Confirm scan records by readback before reporting a persisted arm. In an active plane, authoritative scan state uses OperatorRecords; a scan without privileged write authority may report diagnostic exposure but must explicitly require the operator to persist the transition. The guard reads protected armed state and never accepts a mutable diagnostic record as authority to disable it. Malformed or unavailable armed-state reads cannot silently reset a previously armed guard.
    persistence_contract: >-
      Environment.guard_state(plane:) returns armed state and findings from harness_scans without running probes or writing. New records use schema polispec.harness.scan/v1, a strictly increasing positive sequence, generation when sealed, subject_uid, canonical exposure observations and their SHA256 fingerprint, detected categories, root_guard boolean, and scanned_at. Bound rows and bytes. In an active plane validate OperatorRecords provenance, authorized harness.scan caller operation, matching record/authorization generation, sequence, fingerprint, observation types, and timestamps. Fold armed state monotonically: once any valid authoritative record arms it, later records cannot clear it, including across generation changes. Empty protected history starts off unless lock forces it; corrupt/unavailable history conservatively arms with an explicit finding. Serialize the authoritative read/append/readback transition with OperatorRecords.synchronize. A nonprivileged active-plane scan is diagnostic and never writes this stream; report operator-needed persistence. Record the actual probed UID rather than pretending an operator-root scan describes the user's process. Unsealed SDK history remains noncertifying; validate new records and conservatively preserve any prior armed boolean across legacy records. A legacy format cannot fund lock eligibility.
    rules: Deny classified container operations involving privileged execution, host mounts, daemon-socket access, or equivalent root-capable operations. Positively distinguish rootless detection from root-equivalent access; neither classifier coverage nor a safe-looking command grants lock certification.
guard_integration:
  review_repairs:
    snapshot: c4b6050e19d8288ef1aab9c39f1a4b8146de8ff1
    execution: Independent repair workers start from the same snapshot; the state worker owns only environment.rb and lifecycle.rb, while the hook worker retains the other slice_5_guard paths. Their public interfaces remain unchanged. Integrate and review both before the final doctor slice.
    hook_obligations:
      - Wire Controls.evaluate through HarnessControls::Guard.evaluate in the owned evaluate.rb implementation and have the real hook use that facade. The public ceiling includes undeclared-tool handling.
      - A bounded minimal native envelope parse may identify an entirely positive diagnostic-read call even when plane or ledger resolution fails. Malformed, mixed, unknown, shell, MCP, web, and delegation calls never inherit this exception. The final denial renderer uses fixed bytes independent of failing adapters, settings, SDK, and JSON rendering.
      - Use one ten-second monotonic hook budget covering input EOF and judgement, with bounded cleanup. Missing or invalid policy in a live project's trust ref is an unavailable judgement and denies non-read calls in enforcing scope; fallback rules cannot erase this failure. Keep onboarding behavior unchanged.
      - Preserve native session-start parsing separately from pre-tool envelopes so existing context injection still works.
      - Expand every bounded MultiEdit and multi-call target before classification, including every patch rename endpoint. A known writer with missing or invalid targets is a malformed mutation, never an authorizable unknown call.
      - Only a trusted declaration that actually matches each MCP action and its current environment, predicates, server, and operation removes that action's edition default. One nonmatching declaration or one declared action cannot authorize another.
      - Matching failures and unavailable predicate evidence cannot silently skip a deny ceiling. Preserve explicit false matches, but surface evaluation errors as unavailable judgement.
    state_obligations:
      - Bind generated installation IDs and record/receipt operation identity. Validate current owned-entry integrity as well as historical receipt metadata. Supersession removes only a validated active predecessor whose canonical targets and owned contributions are inherited; an arbitrary supersedes list is never authority.
      - Resolve the current user from the passwd database, not HOME. Mutable overlay validation remains read-only and cannot claim managed authority.
      - Protected scan streams reject every non-v1 or unauthenticated row and conservatively arm on invalid history. Legacy tolerance applies only to unsealed SDK records. Validate exact observation category schemas and derive detected categories from them; return the actual confirmed sequence assigned under the persistence lock.
  composed_ask_authority: >-
    Engine::Passes routes every sealed request, consumption, fold, and redemption through Authorizations, requiring explicit complete context instead of falling back to mutable logs. Defer sealed consumption until independent denies have been evaluated. For a standard non-native-ask call with both environment warnings and control asks, form one exact service authorization over the complete tagged environment/control ask set, trusted policy digests, and effective control digest. A consumed grant resolves only those bound warnings/asks, then recompose the remaining verdicts; retaining the same resolved legacy warning would make the grant unusable, while consuming separate grants before discovering another unmet ask would strand the user. Native asks remain native. A legacy grant lacking that full ask-set binding cannot relax controls. Lock defaults and explicit denials remain nonredeemable; a lock environment warning may use its separate protected legacy authorization only when no independent control ask or denial remains. Missing actual harness or session identity cannot be replaced by a synthetic shared session for protected authorization.
  order: Resolve sealed authority before reading environment-driven paths; normalize native input; apply protected-control checks; run environment policy and control ceiling; return the strictest verdict.
  unknowns: MCP uses edition default; unknown non-read-only classes cannot silently become an empty action list. In enforcing governed scope they require explicit authorization in standard and deny in lock.
  mcp_declaration_authority: An agent-added mutable overlay cannot turn an undeclared MCP default into allow merely by adding observe, inject, or another matching control. Only an explicit declaration in protected core or a trusted committed policy can remove that default; mutable overlays only add ceilings. A matching deny or ask still applies. Unsealed caller-selected control files do not supply protected declaration authority.
  failure: A missing ledger, malformed policy, invalid plane, parse exception, callback exception, or event-delivery failure must never erase a mutation denial. Rescue at the outermost guard boundary using a minimal known native deny protocol. If native input cannot be parsed, block rather than guess read-only.
  failure_renderer: Preserve the CLI-selected harness before bounded stdin reading. The outer rescue writes fixed native denial bytes for that harness without reusing adapter parsing, adapter rendering, settings, events, or SDK state. An output-write failure remains a nonzero failure, never an allow.
  overlay_query: >-
    Lifecycle.effective_receipts(harness:, cwd:, port_set: nil) owns the read-only transaction fold of the SDK harness_installations stream. Bound record count and serialized bytes; reject malformed schemas, duplicate/non-increasing sequences, conflicting record identities, or invalid prepared/terminal pairs. A successful committed installation activates its validated receipt and supersedes only the matching prior installations whose owned targets it inherits. An uninstalled terminal removes that installation. rollback_complete restores the state before its paired prepared transaction, including the prior active receipt after a failed uninstall; recovery_required or an unmatched prepared transaction makes the affected overlay unavailable and the guard fails closed. Never choose a bare maximum sequence as the effective-state fold. Validate receipt and transaction identities, document digest, harness, edition, scope, exact canonical backend target/ownership selectors, and current owned-entry integrity. Select only the current passwd user's unprotected user scope or project scopes containing canonical cwd. Reject managed/protected claims in SDK records and all protected path collisions. Return validated documents, canonical scope boundaries, installation IDs, and owned paths; records cannot certify or replace protected core controls. Empty valid history is distinct from unavailable/corrupt state. Caller --controls-file is never receipt authority; sealed mode uses protected core plus these independently validated tightening-only overlays. SDK storage is opaque and cannot be inferred as a filesystem protection target.
  overlay_restoration: The owner handoff and effective overlay query reuse a bounded strict transaction fold, including rejection of malformed statuses or mismatched terminal records that could conceal an interrupted transaction. Uninstall restoration metadata must agree with digest-checked in-place backups; a prior-existing root artifact always needs its backup. Validate prior_present, prior_value, and prior_ancestors against the corresponding actual historical backup before using them. Inherited array rows may legitimately reference different historical backups; preserve those contributions and restore only their verified predecessors.
  reads: Maintain a positive read-only tool catalogue; shell commands named read or scripts claiming read-only are not inherently read-only. Web and MCP remain in the closed-on-failure set as decided.
  protection: Protected paths include active plane, pinned runtime and SDK, receipts, owned harness entries, rule files, ledger authority, and the authorization service's /run/polispec socket directory and protected kill marker. Include all apply_patch add/update/delete/rename paths in classification.
  protection_boundaries: Match named protected paths, their descendants, and deletions or renames of ancestors. A rename contributes deletion of its old endpoint and writing its new endpoint, including paths extracted from patch bodies.
  caching: Key caches by plane generation and effective control digest; fail_mode, root_guard, MCP, and self-protection checks cannot be skipped by the old fast path.
  legacy_authorizations: Pause and allow-once can relax only their existing environment-policy component before the separate control ceiling is composed. They cannot override protected-control checks, undeclared lock defaults, root_guard, broken authority, or an explicit control deny. Sealed records bind generation, project, action digest, rule, expiry, and session where applicable.
  ask_authorizations: >-
    A native ask remains an ask. On a harness without native ask, a standard-edition ask from controls or undeclared-tool handling is blocked pending an exact operator authorization. This is a separate service-backed ask decision, not a legacy environment pass overriding the ceiling. Bind its rule_id to the complete sorted ask-rule set and effective control digest, use the actual harness/session, and hash the canonical tool name, arguments, cwd, and classified actions (not ephemeral callback IDs or timestamps). Use the governed project ID or a deterministic digest of the canonical user/project control scope when no ledger project applies. Issue or consume only after all independent deny checks have passed; successful one-use consumption resolves only that exact ask set, then compose remaining ceilings again. A deny, broken authority, root_guard, or undeclared lock default is never redeemable. If the protected service is unavailable, remain blocked with a concrete operator next step. Unsealed legacy passes never supply this protected ask authority.
  sealed_allow_once_decision: The operator selected a protected one-use consumption service. Mutable consumption records never supply sealed authorization. The new service is an explicit operator-run prerequisite; unavailable service means no override, never fallback to legacy mutable passes.
  authorization_service:
    ownership: Polispec-owned local Unix socket service, with no rStack dependency beyond the existing SDK ports. Implementation is a separate pre-guard slice; no host installation or service start during this change. The operator starts the exact protected launcher manually or installs the generated systemd unit. The unit command renders configuration and does not write or start host services.
    interface: >-
      Authorizations.request(context), Authorizations.consume(context), Authorizations.fold(), and Authorizations.redeem(id) are the guard-facing APIs. The context contains generation, project, action_digest, rule_id, session_id, harness, action_class, and env. Required identity fields are nonempty and bounded, digests have exact syntax, and unknown fields are rejected. The client does not select a socket path or peer UID. request/consume use the fixed socket; fold/redeem use protected records, require Plane.operator! for redeem, and preserve the existing alo_ plus twelve hex digit CLI ID. Operator confirmation displays the requesting kernel UID, project, rule, environment, session, and exact action digest; no raw tool payload or secrets enter the service records. Engine::Passes in sealed mode calls this API and retains legacy mutable storage only when unsealed.
    endpoint: >-
      /run/polispec/authorizations.sock, beneath a root-owned nonsymlink 0755 directory, socket 0666. The server requires active Plane.operator! provenance and the client checks protected ancestry, socket ownership/type, and Linux SO_PEERCRED uid 0. The server obtains caller UID from SO_PEERCRED, never request fields or environment. Request and consume require a nonroot peer; status is read-only. No TCP listener, executable command, caller-selected path, arbitrary record append, or generic privileged operation exists. A second server refuses an existing socket. On clean exit the server removes only its own inode; a stale socket is an explicit operator recovery, never unlinked on startup.
    protocol: >-
      polispec.authorization/v1 is one newline-terminated JSON object per connection, with exact request/response schemas and stable status/error codes. Requests are at most 16 KiB, replies at most 32 KiB, and oversized, malformed, trailing, unknown, or incomplete input is refused. Operations are request, consume, and status. There is no remote redeem operation. The generation must equal the currently validated active generation; a changed, unavailable, or broken plane invalidates authorization. Client failures return unavailable and never grant. A response marked consumed is the only successful consumption result.
    framing: Client writes its single newline-terminated frame and shuts down its write half. The server reads through EOF within the same deadline, validates exactly one frame with no trailing bytes, then writes one response and closes. The client reads the response through EOF within its total deadline and rejects incomplete or extra frames. Rate limits charge each accepted connection by kernel UID before reading, including malformed and incomplete input.
    persistence: >-
      Use OperatorRecords stream harness_authorizations, with schema polispec.authorization.record/v1 and issued, redeemed, and consumed events. All fold/transition work is inside OperatorRecords.synchronize and uses append plus exact authenticated readback before success. Issued records bind the kernel UID and full context; repeated pending requests for the exact tuple reuse the same unexpired ID. IDs cannot collide. Only the privileged operator command appends redeemed, with expiry no later than 600 seconds after redemption and no refresh of an already redeemed or consumed record. A consume must match UID, generation, project, action digest, rule, session, harness, and expiry exactly. Commit the consumed record durably before sending success; lost replies and repeat requests remain spent. Malformed history, conflicting IDs, invalid transitions, missing provenance, or storage errors refuse authorization. Concurrent connections, separate server processes, and operator redemption share the same protected transaction lock. Pauses and these passes still affect only the legacy environment-policy component before independent ceilings.
    resource_limits: >-
      Server handles at most one request at a time with listen backlog 8, a two-second end-to-end per-connection budget, 60 requests/minute per UID and 300/minute globally, and at most 16 unexpired pending requests per UID. Bound tracked UID buckets, record rows, record bytes, and strings; reject capacity overflow. Server and client use monotonic deadlines. Client calls share a process limiter of 48/minute and one in-flight request, a two-second total budget, and a circuit breaker after three transport failures for ten seconds. Only a connect failure before any request byte is sent may retry once with full jitter in a bounded 25–100 ms window. Never retry consumption after sending bytes; retry exhaustion, throttling, or saturation denies the override. No external or metered API exists. Emit bounded status/latency/limiter counters through the existing events port without raw context, and make event failure unable to create a grant.
    kill_switch: A root-owned regular nonsymlink /etc/polispec/authorizations.disabled marker disables request, redeem, and consume immediately without a redeploy. Validate its ownership and ancestry; an unsafe marker fails closed. A missing marker means enabled. Stopping the service also fails closed. Do not accept an ENV override to enable the service or select another endpoint.
    concurrent_authority_change: Re-resolve Plane and recheck the kill marker after durable consumption and immediately before sending success. A changed generation, broken plane, or disabled state returns unavailable with the grant already spent. The client repeats this check after a consumed response before returning a grant. This is the hook decision boundary; no claim is made about atomicity with a harness's later tool execution.
    commands: >-
      polispec authorizations serve | status [--json] | unit [--json] | recover [--dry-run] [--json]. serve requires protected operator provenance; status uses the fixed local API; unit emits a systemd service with the exact active pinned launcher, User=root, UMask=0077, Restart=on-failure, and KillMode=control-group. No unit is silently installed or activated.
    stale_socket_recovery: >-
      Startup and recovery share an OperatorRecords transaction lock distinct from the grant stream. recover authenticates Plane.operator!, validates root-owned socket ancestry/type/inode, and probes the fixed endpoint with a bounded connection attempt. Only a definite connection-refused result is stale; timeout, permission error, full backlog, connected listener, or ambiguous state refuses recovery. Revalidate the same inode immediately before renaming the stale socket to an exclusive in-place backup name; never remove a live listener or another inode. Actual recovery requires a typed operator confirmation; dry-run authenticates and performs all checks without mutation. The generated unit documents recover as the prerequisite after a crash that leaves a socket; do not claim Restart alone repairs it.
    development: Provide explicit dependency-injected scratch entry points for transport, peer identities, clock, and record adapter, separate from production CLI. Scratch execution never authenticates a real operator or reports lock certification. Demonstrate two competing consumes produce at most one success, replay and lost-reply refusal, mismatched tuple/UID/expiry/generation refusal, unavailable/corrupt storage, protocol/size/deadline/rate bounds, and client fail-closed behavior. Report real root-owned service execution as unverified when unavailable.
concurrency_model:
  doctrine: worktree-isolated / file-ownership-disjoint / wave-synchronized
  isolation:
    mechanism: git worktree per parallel slice
    rule: Foundation executes alone on the integration branch. Each parallel worker receives a separate worktree from the current green wave base and writes only its owned paths. Workers do not stash, reset, or edit the primary tree.
    branch_naming: wt/harness-controls/<slice_id>
    lifecycle: Create only after foundation commit; reintegrate all green slice commits at each barrier; back up before removing a worktree after acceptance.
  reintegration:
    step: Primary merges each slice branch after reviewing its diff and real-run evidence.
    conflict_expectation: Disjoint owned paths; any conflict or read-write dependency within a wave requires re-slicing before proceeding.
    gate: Ruby syntax checks for changed source, bin/polispec help and version, schema validation of examples, and the wave's actual CLI journeys.
  invariants:
    - At most three simultaneous workers; the primary uses the fourth session slot.
    - No parallel group has overlapping owns_paths or reads a file another slice writes in that group.
    - No worker edits a previous slice's file; it returns missing contract details to the primary.
    - Every wave base starts and runs the existing CLI.
  shared_surfaces_resolved:
    - {surface: Commands and classifiers, pattern: Existing file-glob registration.}
    - {surface: Harness backend registry, pattern: Foundation glob-loads separately owned backend files.}
    - {surface: lib/polispec.rb and schema kind registry, pattern: Foundation-only action classes, autoloads, and control schema registration.}
    - {surface: Harness and plane configuration, pattern: Per-slice implementations use foundation interfaces; only integration writes shared defaults.}
    - {surface: Version and top-level documentation, pattern: Primary owns final integration and locks shared files.}
  peer_agent_lock: {manifest_path: TMP_AGENT_FILE_LOCKS.yml, rule: Use reaper locks for shared surfaces; never release another agent's entries.}
  feature_flags:
    - {name: harness_controls, default: false, owner_slice: slice_0_foundation, flipped_by: slice_final_integration}
    - {name: sealed_plane, default: false, owner_slice: slice_0_foundation, flipped_by: slice_final_integration}
waves:
  - {id: wave_0, execution: single worker on integration branch, slices: [slice_0_foundation], barrier: Foundation committed and green.}
  - {id: wave_1, execution: Separate worktrees from wave_0, slices: [slice_1_language, slice_1_environment], barrier: Reintegrate and run grammar and scan journeys.}
  - {id: wave_2, execution: Separate worktrees from wave_1, slices: [slice_2_claude, slice_2_codex], barrier: Reintegrate and inspect both native plans.}
  - {id: wave_3, execution: Separate worktrees from wave_2, slices: [slice_3_other_harnesses, slice_3_os], barrier: Reintegrate and inspect all backend dispositions.}
  - {id: wave_4, execution: Separate worktrees from wave_3, slices: [slice_4_lifecycle, slice_4_plane], barrier: Reintegrate and run scratch installation and plane journeys.}
  - {id: wave_4b, execution: Isolated worktree after reviewed authority plane, slices: [slice_4b_authorizations], barrier: Review protected consumption and integrate before guard implementation.}
  - {id: wave_5, execution: Independent guard and maintainer-script workers in separate worktrees, slices: [slice_5_guard, slice_5_release_lock], barrier: Guard journeys pass, existing policy flows still run, and the release script passes isolated Git journeys.}
  - {id: wave_final, execution: Single integration worker followed by primary verification and documentation on the integration branch, slices: [slice_final_integration], barrier: Independent evidence accepted before release or privileged operator handoff.}
slice_defaults:
  worker: {model: gpt-5.6-sol, effort: medium}
  agent_brief: Read this entire spec and your slice. You are not alone; preserve others' changes. Parallel slices use only their assigned worktree. Query codebase memory first, check path coverage, and read missed source ranges. Write no explanatory comments or test suite. Production verification probes are allowed only as specified product machinery. No deletion without in-place backup, no attribution, no root-plane host installation, and no live data. Run your verification, inspect findings, repair within owned paths, and return unresolved decisions. Do not change versions or top-level docs, merge another branch, or push. Commit only the slice's owned changes when the applicable change gate permits; otherwise return the diff and blocker. No worker model fallback or further delegation without explicit authorization.
  graph_evidence: Tier 2; project home-sven-github-foss-polispec; foundation generation 2026-10-13T16:15:48Z; relevant implementation paths had matching metadata and no recorded parse gaps. Recheck freshness in each worktree. Notes, decisions, entrypoint bin, and docs have exclusions and were read directly. Ruby trace edges may be ambiguous; exact source decides integration.
slices:
  - id: slice_0_foundation
    title: Shared contracts and discovery
    wave: wave_0
    owns_paths: [lib/polispec.rb, lib/polispec/cli.rb, lib/polispec/schema/core.rb, lib/polispec/controls.rb, lib/polispec/control_registry.rb, lib/polispec/harness_controls/contracts.rb, lib/polispec/harness_controls/backends.rb, schemas/control.v1.yml, data/harness-capabilities.yml, config/harness-features.yml]
    reads_paths: [specs/app.yml, lib/polispec/types.rb, lib/polispec/schema/validator.rb, lib/polispec/cli.rb]
    prerequisites: []
    produces_interfaces: [Controls facade, control schema, backend registry, Plan and Receipt shapes, feature flag reader]
    consumes_interfaces: []
    satisfies_requirements: [FR-01]
    detail: Add control.edit, mcp.call, web.fetch, agent.spawn, and shell.exec to declared classes and extend relevant schema enums through the integration slice. Define all api_contracts.interface_contracts as real facade dispatch to later modules with explicit unavailable results; no silent allow stubs. Controls dispatch lazily requires the declared language.rb, monotonicity.rb, or evaluate.rb when the corresponding file exists, so later slices work through the existing facade without editing foundation. Evaluate resolves HarnessControls::Guard. Environment, Plane, and Lifecycle implementations reopen their existing module contracts and their command consumers explicitly require their implementation files. Add the complete control schema union, including effect_params, schedules, and existing policy predicates, and stable artifact/result types. Update the existing validation CLI usage to include control and ensure its allowlist derives from Schema::KINDS; do not create another kind registry. Glob-load backend files. Store capability evidence and unknowns, avoiding unsupported claims. Keep feature flags false and the existing CLI fully operational.
    verification:
      - {run: 'ruby -c lib/polispec.rb', shows: Syntax OK.}
      - {run: 'bin/polispec --help', shows: Existing commands load with no errors.}
      - {run: 'bin/polispec version', shows: Original version; no release bump yet.}
    acceptance: All interfaces named by later slices have a callable contract; unfinished capabilities fail explicitly; existing CLI starts.
    estimated_complexity: M
  - id: slice_1_language
    title: Grammar and conservative authority comparison
    wave: wave_1
    owns_paths: [lib/polispec/harness_controls/language.rb, lib/polispec/harness_controls/monotonicity.rb, examples/controls.minimal.yml, examples/controls.scheduled.yml]
    reads_paths: [lib/polispec/harness_controls/contracts.rb, schemas/control.v1.yml, lib/polispec/engine.rb, schemas/policy.v1.yml]
    prerequisites: [slice_0_foundation]
    produces_interfaces: [Controls.parse, Controls.validate, Controls.monotonic]
    consumes_interfaces: [Controls facade, control schema]
    satisfies_requirements: [FR-01, FR-05]
    detail: Implement the exact grammar, IR limits, semantic validation, canonicalization, and suggestions. Accept only declared action-object pairs and effects. Compare changes conservatively; uncertain comparisons need the operator. Add examples that contain no host-specific paths, private data, or root-changing actions.
    verification:
      - {run: 'bin/polispec validate control examples/controls.minimal.yml --json', shows: Valid control document with stable schema ID.}
      - {run: 'ruby -Ilib -rpolispec -e ''puts JSON.generate(Polispec::Controls.parse(%q{when agent write file where path = "/tmp/polispec-example/*" then deny because "protected"}))''', shows: Canonical IR preserving quoted path and reason.}
    acceptance: Invalid vocabulary has a structured offset and suggestion; additive deny tightens; deletion, ask replacing deny, broader permission, and uncertain comparison require operator authority.
    estimated_complexity: L
  - id: slice_1_environment
    title: Exposure detection and scan transitions
    wave: wave_1
    owns_paths: [lib/polispec/harness_controls/environment.rb, lib/polispec/harness_controls/root_guard.rb]
    reads_paths: [lib/polispec/harness_controls/contracts.rb, lib/polispec/state.rb, lib/polispec/events.rb]
    prerequisites: [slice_0_foundation]
    produces_interfaces: [Environment.scan, RootGuard.classify]
    consumes_interfaces: [Plan and Receipt shapes]
    satisfies_requirements: [FR-09, FR-13]
    detail: Implement bounded probes and persist one scan sequence per CLI invocation through state ports. Distinguish presence, reachable root-equivalent access, rootless containers, and unknown results. First detection advises; a later scan with continuing exposure arms root_guard and records the notice. Requested lock forces the guard and refuses certification for root-equivalent or unknown prerequisites. Do not change host configuration.
    verification:
      - {run: 'ruby -c lib/polispec/harness_controls/environment.rb', shows: Syntax OK.}
      - {run: 'ruby -Ilib -rpolispec -rpolispec/harness_controls/environment -e ''puts JSON.generate(Polispec::HarnessControls::Environment.scan({"read_only"=>true}))''', shows: Categorized host observations without host mutation or command payloads.}
    acceptance: A scratch state store demonstrates two distinct scan transitions, and multiple probes in one scan cannot arm the second-scan transition. Rootless alone is not described as root equivalence.
    estimated_complexity: M
  - id: slice_2_claude
    title: Claude native backend
    wave: wave_2
    owns_paths: [lib/polispec/harness_controls/backends/claude.rb]
    reads_paths: [data/harness-capabilities.yml, lib/polispec/harness_controls/contracts.rb, lib/polispec/harness_controls/language.rb]
    prerequisites: [slice_0_foundation, slice_1_language]
    produces_interfaces: [Claude Backend.plan, Claude Backend.normalize, Claude Backend.render, Claude Backend.probe]
    consumes_interfaces: [backend registry, Controls.parse]
    satisfies_requirements: [FR-02, FR-12]
    detail: Implement backend_requirements.claude. Native hooks use synchronous pinned argv and onFailure block when version-supported; plan lists every managed-only consequence. Merge constraints preserve existing deny rules. Backend live-probe method reports unavailable until a native isolated runtime has actually supplied evidence.
    verification:
      - {run: 'ruby -c lib/polispec/harness_controls/backends/claude.rb', shows: Syntax OK.}
      - {run: 'ruby -Ilib -rpolispec -e ''puts JSON.generate(Polispec::HarnessControls::Backends.fetch("claude-code").plan(Polispec::Controls.parse(%q{when agent write file then deny}), {"scope"=>"project","project"=>"/tmp/polispec-control-demo","edition"=>"standard"}))''', shows: Native hook artifacts, path restrictions, scope, and explicit dispositions.}
    acceptance: Unsupported versions never get a supported failure-closed disposition; plan contains no implicit allow or loss of unrelated hooks.
    estimated_complexity: M
  - id: slice_2_codex
    title: Codex native backend
    wave: wave_2
    owns_paths: [lib/polispec/harness_controls/backends/codex.rb]
    reads_paths: [data/harness-capabilities.yml, lib/polispec/harness_controls/contracts.rb, lib/polispec/harness_controls/language.rb]
    prerequisites: [slice_0_foundation, slice_1_language]
    produces_interfaces: [Codex Backend.plan, Codex Backend.normalize, Codex Backend.render, Codex Backend.probe]
    consumes_interfaces: [backend registry, Controls.parse]
    satisfies_requirements: [FR-02, FR-12]
    detail: Implement backend_requirements.codex with a bounded deterministic TOML emitter for only the supported generated subset. No handwritten general TOML parser or SDK catalogue copy. Reject unsafe merges requiring an unsupported parser rather than overwriting. Native callback denial and exec/sandbox hard controls have distinct capability rows; managed hooks alone never satisfy failure-closed certification.
    verification:
      - {run: 'ruby -c lib/polispec/harness_controls/backends/codex.rb', shows: Syntax OK.}
      - {run: 'ruby -Ilib -rpolispec -e ''puts JSON.generate(Polispec::HarnessControls::Backends.fetch("codex").plan(Polispec::Controls.parse(%q{when agent call mcp then ask}), {"scope"=>"user","edition"=>"standard"}))''', shows: Native denial pending operator authorization and distinct fail-open callback limitation.}
    acceptance: Generated requirements parse in the detected runtime; native ask is never fabricated; unknown hosted or nested coverage is not certified.
    estimated_complexity: L
  - id: slice_3_other_harnesses
    title: Hermes and Antigravity native backends
    wave: wave_3
    owns_paths: [lib/polispec/harness_controls/backends/hermes.rb, lib/polispec/harness_controls/backends/antigravity.rb]
    reads_paths: [data/harness-capabilities.yml, lib/polispec/harness_controls/contracts.rb, lib/polispec/harness_controls/language.rb]
    prerequisites: [slice_0_foundation, slice_1_language]
    produces_interfaces: [Hermes backend, Antigravity backend]
    consumes_interfaces: [backend registry, Controls.parse]
    satisfies_requirements: [FR-03, FR-12, FR-14]
    detail: Implement native envelopes and decision formats; do not reuse the generic Claude response. Respect consent and unknown failure semantics. Missing installed runtimes produce generated/unverified dispositions. Every Antigravity lock result is uncertifiable and IDE/desktop results are directive-only. Never emit auto_approve or grant an undeclared permission.
    verification:
      - {run: 'ruby -c lib/polispec/harness_controls/backends/hermes.rb', shows: Syntax OK.}
      - {run: 'ruby -c lib/polispec/harness_controls/backends/antigravity.rb', shows: Syntax OK.}
    acceptance: Run native documented envelope samples through normalization and denial output, inspect round trips, and inspect unavailable-runtime behavior without claiming live certification.
    estimated_complexity: L
  - id: slice_3_os
    title: Sandbox planning and schedule port
    wave: wave_3
    owns_paths: [lib/polispec/harness_controls/backends/os.rb, lib/polispec/harness_controls/schedule.rb]
    reads_paths: [data/harness-capabilities.yml, lib/polispec/harness_controls/contracts.rb, lib/polispec/harness_controls/language.rb]
    prerequisites: [slice_0_foundation, slice_1_language]
    produces_interfaces: [OS backend, Schedule.install]
    consumes_interfaces: [backend registry, Controls.parse]
    satisfies_requirements: [FR-12]
    detail: Emit supported sandbox path and network restrictions. Empty lock allowlist must mean denied egress, never open network. A schedule contains only a schema-validated calendar and pinned verify argv; install through ports.schedule. Report absent sandbox machinery and all containment limitations.
    verification:
      - {run: 'ruby -c lib/polispec/harness_controls/backends/os.rb', shows: Syntax OK.}
      - {run: 'bin/polispec validate control examples/controls.scheduled.yml --json', shows: Valid schedule with a verify-only callback.}
    acceptance: A scratch sandbox demonstrates denied writes outside the configured root; network behavior is observed or explicitly unverified; no timer is installed on this host.
    estimated_complexity: M
  - id: slice_4_lifecycle
    title: Agent CLI and installation lifecycle
    wave: wave_4
    owns_paths: [lib/polispec/commands/harness.rb, lib/polispec/harness_controls/lifecycle.rb, lib/polispec/harness_controls/files.rb, lib/polispec/harness_controls/verification.rb, lib/polispec/harness_controls/owner_handoff.rb]
    reads_paths: [lib/polispec/harness_controls/contracts.rb, lib/polispec/harness_controls/backends.rb, lib/polispec/harness_controls/environment.rb, lib/polispec/harness_controls/language.rb, lib/polispec/state.rb, lib/polispec/events.rb]
    prerequisites: [slice_1_language, slice_1_environment, slice_2_claude, slice_2_codex, slice_3_other_harnesses, slice_3_os]
    produces_interfaces: [harness CLI, Lifecycle.install, verification runner, artifact ownership]
    consumes_interfaces: [all native backends, Controls.monotonic, Environment.scan]
    satisfies_requirements: [FR-04, FR-05, FR-08, FR-13, FR-14, FR-17]
    detail: Implement api_contracts commands and common result envelope. Merge owned entries, reject unsupported existing formats, back up first, check changed-byte conflicts, and persist receipts only after atomic commit. Verify integrity, ancestry, versions, and every native fixture. Native harness absence, callback failure-open, missing OS isolation, consent omission, or unsealed writable guards prevent lock certification. Agent-created additions do not acquire protected status until operator sealing; do not include writable additions in a certified guard set.
    verification:
      - {run: 'bin/polispec harness grammar --json', shows: Documented grammar and vocabulary.}
      - {run: 'bin/polispec harness plan examples/controls.minimal.yml --harness claude-code --scope project --project /tmp/polispec-control-demo --json', shows: Non-mutating complete plan.}
      - {run: 'bin/polispec harness install examples/controls.minimal.yml --harness codex --scope user --dry-run --json', shows: No files changed; exact authority and artifact list.}
    acceptance: Use a scratch destination to install twice, preserve unrelated entries, verify digests, attempt changed-byte uninstall, and observe operator_required for loosening. Native probes never target real projects or real external services.
    estimated_complexity: L
  - id: slice_4_plane
    title: Sealed authority and operator commands
    wave: wave_4
    owns_paths: [lib/polispec/commands/seal.rb, lib/polispec/commands/plane.rb, lib/polispec/harness_controls/plane.rb, lib/polispec/harness_controls/authority.rb, lib/polispec/harness_controls/operator_records.rb]
    reads_paths: [lib/polispec/harness_controls/contracts.rb, lib/polispec/harness_controls/environment.rb, lib/polispec/state.rb, lib/polispec/events.rb, lib/polispec/operator/tty.rb]
    prerequisites: [slice_0_foundation, slice_1_language, slice_1_environment, slice_2_claude, slice_2_codex, slice_3_other_harnesses, slice_3_os]
    produces_interfaces: [Plane.resolve, Plane.operator!, seal CLI, plane CLI, privileged state adapter]
    consumes_interfaces: [Plan and Receipt shapes, Environment.scan]
    satisfies_requirements: [FR-10, FR-11, FR-13, FR-16]
    detail: Implement sealed_plane precisely. Produce a complete generation and source provenance. Validate root ownership and protected SDK without copying runtime dependencies. Authority checks do not trust strings or TTY alone. A broken existing fixed-root seal cannot fall back to unsealed settings. Scratch verification is clearly tagged development evidence; no host seal or activation occurs.
    verification:
      - {run: 'bin/polispec plane status --json', shows: Honest unsealed or validated sealed status.}
      - {run: 'bin/polispec seal --from .@HEAD --dry-run --json', shows: Exact committed source plan or explicit missing-source prerequisites; no root writes.}
    acceptance: Demonstrate Git source ignores dirty changes, lock rejects user-writable source, forged ENV and PTY do not supply privilege, malformed seal remains broken, and activation requires a green plane plus operator identity.
    estimated_complexity: L
  - id: slice_4b_authorizations
    title: Protected one-use authorization consumption
    wave: wave_4b
    owns_paths: [lib/polispec/harness_controls/authorizations.rb, lib/polispec/harness_controls/authorization_client.rb, lib/polispec/commands/authorizations.rb]
    reads_paths: [lib/polispec/harness_controls/plane.rb, lib/polispec/harness_controls/authority.rb, lib/polispec/harness_controls/operator_records.rb, lib/polispec/engine.rb, lib/polispec/events.rb]
    prerequisites: [slice_4_plane]
    produces_interfaces: [Authorizations.request, Authorizations.consume, Authorizations.fold, Authorizations.redeem, local protected consumption protocol]
    consumes_interfaces: [Plane.resolve, Plane.operator!, OperatorRecords.synchronize, OperatorRecords.read, OperatorRecords.append, Events.emit]
    satisfies_requirements: [FR-11]
    detail: Implement guard_integration.authorization_service exactly. Keep the service independent of Engine so the later guard slice can call its public API without a circular load. No edits to existing Passes or commands in this slice. The primary owns app/manifest documentation. Unit rendering is read-only and explicit; no installer or host service operation is authorized during development.
    verification:
      - {run: 'bin/polispec authorizations status --json', shows: A missing protected socket is an explicit unavailable result and grants nothing.}
      - {run: 'bin/polispec authorizations serve', shows: Unprivileged or unprotected invocation refuses before any host mutation.}
    acceptance: Exercise actual Unix transport in an isolated development destination with an explicit development adapter. Concurrent consumption, lost replies, replay, mismatched binding, invalid records, bounded input/deadline/rate behavior, kill switch, and service absence never grant extra authority. No true-root verification or certification claim is made from injected development identities.
    estimated_complexity: L
  - id: slice_5_guard
    title: Connect authority and control ceilings to the existing guard
    wave: wave_5
    owns_paths: [lib/polispec/commands/hook.rb, lib/polispec/harness/base.rb, lib/polispec/harness/claude.rb, lib/polispec/harness/codex.rb, lib/polispec/harness/generic.rb, lib/polispec/harness/hermes.rb, lib/polispec/harness/antigravity.rb, lib/polispec/harness_controls/evaluate.rb, lib/polispec/harness_controls/environment.rb, lib/polispec/harness_controls/lifecycle.rb, lib/polispec/classify/commands/controls.rb, lib/polispec/classify/commands/mcp.rb, lib/polispec/classify/tool.rb, lib/polispec/engine.rb, lib/polispec/ledger.rb, lib/polispec/layers.rb, lib/polispec/fastpath.rb, lib/polispec/events.rb, lib/polispec/code/settings.rb, lib/polispec/code/paths.rb, lib/polispec/commands/code.rb, lib/polispec/code/hook.rb, lib/polispec/operator/gates.rb, lib/polispec/operator/tty.rb, lib/polispec/commands/allow_once.rb, lib/polispec/commands/pause.rb]
    reads_paths: [lib/polispec/harness_controls/**, schemas/control.v1.yml, lib/polispec/types.rb, lib/polispec/state.rb]
    prerequisites: [slice_4_lifecycle, slice_4_plane, slice_4b_authorizations]
    produces_interfaces: [Controls.evaluate, sealed settings resolution, failure-closed guard integration]
    consumes_interfaces: [Plane.resolve, Plane.operator!, all native backends, Lifecycle.install, RootGuard.classify]
    satisfies_requirements: [FR-05, FR-06, FR-07, FR-08, FR-09, FR-11]
    detail: Implement guard_integration without changing existing deployment receipt shape or policy rule order. Apply new controls as a separate maximum-severity ceiling. Extend sealed settings consumers, not just the top-level CLI. Correct outermost rescues and native adapters. Add self-protection and MCP classification, all patch rename targets, and conservative unknown-tool behavior. In sealed mode existing operator paths consult privileged authority; unsealed development retains its documented overrides and terminal behavior with no claim of lock security.
    verification:
      - {run: 'printf ''%s'' ''{"tool_name":"Write","tool_input":{"file_path":"/tmp/polispec-control-demo/example.rb"},"cwd":"/tmp/polispec-control-demo"}'' | bin/polispec classify --json --ledger /tmp/polispec-control-demo/ledger.yml', shows: Synthetic write has a classified action and structured target; use a scratch empty ledger.}
      - {run: 'bin/polispec validate policy examples/policy.shop.yml --json', shows: Existing policy still validates.}
      - {run: 'bin/polispec validate policy examples/policy.widget.yml --json', shows: Existing distributed policy still validates.}
    acceptance: Actual hook CLI with synthetic payloads shows standard unknown MCP authorization, lock denial, protected control edits, broken policy mutation denial, positive diagnostic-read allowance, ignored sealed overrides, and stricter controls winning over an existing allow. Repeat original deployment receipt and layered-policy CLI journeys without real data.
    estimated_complexity: XL
  - id: slice_5_release_lock
    title: Isolated edition-branch release operation
    wave: wave_5
    owns_paths: [scripts/release-lock]
    reads_paths: [specs/harness-controls.impl.yml, VERSION]
    prerequisites: [slice_4_plane]
    produces_interfaces: [Maintainer-only release-lock command]
    consumes_interfaces: [Local Git object and ref operations, exact remote lease protocol]
    satisfies_requirements: [FR-15]
    detail: Implement rollout.release_lock_protocol exactly. This command has no runtime dependency on the guard and can be implemented independently. Exercise it only against isolated synthetic repositories and bare remotes. Do not mutate this repository's main or lock refs or contact its remote. The integration slice installs the accepted EDITION file, verifies doctor, and runs the actual release only after all gates pass.
    verification:
      - {run: 'ruby -c scripts/release-lock', shows: Syntax OK.}
      - {run: 'scripts/release-lock --help', shows: Exact maintainer CLI contract.}
    acceptance: Demonstrate exact edition-only creation and refresh, absent and mismatched expectations, dirty trees, remote divergence, dry-run without object or ref writes, and backup/CAS behavior using scratch repositories. No other ref may be rewritten.
    estimated_complexity: M
  - id: slice_final_integration
    title: Independent acceptance, contracts, documentation, and release
    wave: wave_final
    owns_paths: [AGENTS.md, specs/app.yml, polispec.rplugin.yml, VERSION, EDITION, .codex-plugin/plugin.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json, .agents/plugins/marketplace.json, plugin.json, hooks/codex.json, hooks/hooks.json, config/harness-features.yml, data/harness-capabilities.yml, schemas/policy.v1.yml, schemas/ledger.v1.yml, schemas/module.v1.yml, schemas/global.v1.yml, hooks/polispec.hooks.yml, README.md, CHANGELOG.md, TODO.md, FEATURES.md, docs/harness-controls.md, docs/operator.md, docs/schema.md, skills/polispec/SKILL.md, rules/polispec.md, lib/polispec/commands/doctor.rb]
    reads_paths: ['**/*']
    prerequisites: [slice_0_foundation, slice_1_language, slice_1_environment, slice_2_claude, slice_2_codex, slice_3_other_harnesses, slice_3_os, slice_4_lifecycle, slice_4_plane, slice_4b_authorizations, slice_5_guard, slice_5_release_lock]
    produces_interfaces: [published CLI contract, version agreement, tracking lock branch]
    consumes_interfaces: [all prior interfaces]
    satisfies_requirements: [FR-14, FR-15, FR-18]
    detail: A medium-effort Sol worker implements this slice's doctor changes and the bounded Ruby compatibility repair below; the primary owns all documentation, contracts, versioning, and independent verification. These actors execute sequentially. Update app spec and enums, the approved AGENTS ownership exception, actual harness compatibility, declared settings, and rplugin surfaces. Set standard EDITION and release defaults only after acceptance. The reviewed release-lock script preserves a prior branch ref, recreates the edition-only difference on the accepted main release, and updates the tracking branch only with an exact force-with-lease against the reviewed prior remote ref; remote divergence returns to the operator. This is the edition-branch refresh approved in the interview, not permission to rewrite any other branch. Doctor checks artifact provenance and edition-only code equality. Add the baseline provisioned manifest TODO exactly as deferred. Update FEATURES with honest built/deployed status and missing native/privileged evidence. Keep production activation outside this slice.
    compatibility_repair:
      owned_path: lib/polispec/classify/commands/support.rb
      finding: Support.edit_strings uses Enumerable.filter_map despite the declared Ruby 2.6 floor. Removing that newer method reproduces NoMethodError on an AGENTS.md edit; this is an API-surface reproduction, not a native Ruby 2.6 runtime run.
      change: Replace only that filter_map call with Ruby 2.6-compatible mapping and filtering while preserving string selection, nested edits, and ENVS classification. Do not change the supported Ruby floor.
      verification: Repeat the bounded reproduction without filter_map, and run a real AGENTS.md edit classification through the CLI. No tests or compatibility framework.
    execution_order: The disjoint doctor and compatibility worker may build and review against the accepted plane while guard repairs continue. Its acceptance and integration require the assembled guard. Primary release-surface edits follow that worker; drafting outside the repository may proceed independently.
    verification:
      - {run: 'rplugin check polispec', shows: Zero plugin findings.}
      - {run: 'rplugin install polispec', shows: The accepted release installs; no root seal or live-project activation.}
      - {run: 'rplugin doctor polispec', shows: Zero plugin installation findings, with harness-specific verification reported separately.}
      - {run: 'polispec harness grammar --json', shows: Installed command exposes the accepted grammar.}
      - {run: 'polispec harness plan examples/controls.minimal.yml --harness codex --scope project --project /tmp/polispec-control-demo --json', shows: Installed CLI runs the new capability for real.}
    acceptance: Only verified capabilities are marked operational. No live project is activated, no unsupported lock axis is certified, versions agree at 0.18.0, and the lock branch has only EDITION difference from its recorded main base.
    estimated_complexity: L
security:
  threat_model:
    - {id: T-1, category: spoofing, asset: Operator identity, mitigation: Privileged fixed-runtime authority; ENV and TTY cannot authenticate., linked_nfr: NFR-S-1}
    - {id: T-2, category: tampering, asset: Guard and configuration, mitigation: Protected ancestry, artifact digests, entry ownership, and control.edit., linked_nfr: NFR-S-2}
    - {id: T-3, category: repudiation, asset: Control changes, mitigation: Receipts and operator journals bound to operation and source digests.}
    - {id: T-4, category: information_disclosure, asset: Policy and tool payloads, mitigation: No raw payload logging or live user-data probes.}
    - {id: T-5, category: denial_of_service, asset: Guard and installer, mitigation: Bounded input and subprocesses; positive diagnostic-read path.}
    - {id: T-6, category: elevation_of_privilege, asset: Root-owned plane, mitigation: Refuse lock with reachable root-equivalent authority or unprotected runtime dependencies.}
  privacy: {pii_handled: [], retention: Receipts store digests and ownership metadata; no tool payloads or private source values.}
verification_strategy:
  build_and_run: No new test framework. Run actual CLI commands and the product's native verification probes with synthetic inputs and isolated destinations.
  journeys:
    - {name: grammar to installation, observe: Parse, canonical plan, tightening install, idempotent repeat, intact unrelated entries, and honest verification.}
    - {name: refusal paths, observe: Loosening, unsupported capabilities, absent harnesses, untrusted hooks, and conflicting artifact bytes produce explicit findings.}
    - {name: editions, observe: Standard MCP ask and open network versus lock deny and empty allowlist; lock inactive if any required axis is unverified.}
    - {name: plane provenance, observe: Standard exact commit and lock root-authored digest; invalid seal never falls back.}
    - {name: guard failures, observe: Invalid policy and broken callback block mutation where native runtime permits; runtime that fails open remains uncertified.}
  measurements: Record latency, exit status, native harness version, exact evidence scope, and missing privileges. A scratch probe is development evidence only.
rollout:
  strategy: Flags remain disabled through construction. Enable accepted CLI capabilities after integration; never enable a certified lock based on generated files alone.
  rollback: Restore only owned entries from verified backups through an authenticated operator when the rollback loosens controls. Preserve failed attempt receipts and previous plane generation.
  release_lock_protocol: >-
    scripts/release-lock is a maintainer command, not an installed plugin script. Require --base FULL_MAIN_SHA, --expected-local FULL_SHA_OR_absent, and --expected-remote FULL_SHA_OR_absent, with optional --remote NAME, --dry-run, and --json; strictly reject duplicate or unknown options. Source branch main and target refs/heads/polispec-lock are fixed. Require exact repository root, clean tracked/untracked tree, current branch main, HEAD/local main/selected remote-tracking main/live remote main equal base, and exact reviewed local/remote lock states. Initial creation is authorized only when both expected states are explicitly absent and both observed refs are absent. Refresh requires matching reviewed existing full SHAs; remote divergence refuses. Construct a commit with sole parent base using a temporary Git index and exact standard-newline to lock-newline EDITION replacement. Require base EDITION regular 100644 and verify the final tree differs only in EDITION. Preserve the previous local lock in an archival ref before any refresh. Re-read remote refs immediately before pushing exactly the lock ref, with an exact --force-with-lease bound to the reviewed prior SHA or explicitly empty expected ref for creation. CAS-update the local lock only after push succeeds; a local CAS failure reports recovery-required without rewriting other refs. Bound all Git calls and output. Dry-run validates but writes no objects or refs and performs no push. Demonstrate creation and refresh only against scratch bare remotes until the accepted main release is ready.
  doctor_release_contract: >-
    Preserve legacy doctor checks/output and replace Gem::Version with numeric Ruby version parsing so --disable-gems works. Check regular exact EDITION, VERSION and manifest agreement, and edition-only parent/tree equality from local Git. A lock commit has sole parent the accepted standard main release and only EDITION differs; verify main/ref equality when present. Never add another lock-only metadata file. Missing Git/ref evidence reports edition_provenance_unavailable rather than guessing equality. Resolve Plane lazily: broken is a finding, unsealed is an honest nonfailure, active uses continuous provenance validation. Doctor performs no network, service start, seal, activation, or release mutation.
  release_lock_boundaries: >-
    Resolve the selected remote's effective fetch and push URLs, including URL rewrites. Require exactly one identical endpoint before object or ref mutation; refuse differing or multiple destinations. Pin that endpoint for both inspection and push and revalidate the selected remote before the final action. Do not expose credentials from endpoint strings in results. Raw tree hashing uses canonical Git modes, including 40000 for directories. The subprocess deadline covers stdin, process completion, and output EOF; kill the process group and close pipes within a bounded cleanup even when the leader has exited. Once push begins, timeout, output failure, or unavailable post-push confirmation is recovery-required with target and archive retained; an ordinary refusal is allowed only when no update is established.
