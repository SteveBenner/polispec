risks:
  - {id: R-1, description: Native callbacks can fail open despite managed ownership., likelihood: high, impact: high, mitigation: Require independent hard boundaries and native evidence or refuse lock., owner_slice: slice_4_lifecycle}
  - {id: R-2, description: Managed-only hooks may disable unrelated operator workflows., likelihood: high, impact: high, mitigation: Inventory consequences in plans and require the operator for managed changes., owner_slice: slice_2_claude}
  - {id: R-3, description: SDK Hermes and Antigravity assumptions may be stale., likelihood: high, impact: medium, mitigation: Use plugin-owned native backends and file an external SDK finding without mutating the SDK., owner_slice: slice_final_integration}
  - {id: R-4, description: Same-user unsealed controls remain mutable., likelihood: high, impact: high, mitigation: Do not certify them; sealing is explicit and privileged., owner_slice: slice_4_plane}
  - {id: R-5, description: Native probes need installed runtimes and privileges not available in the worker environment., likelihood: high, impact: medium, mitigation: Preserve unverified status and provide a concrete operator-run verification plan., owner_slice: slice_final_integration}
acceptance_criteria:
  - Every must requirement has independent real-run evidence or an explicit blocking prerequisite that prevents the affected capability being advertised as operational.
  - All canonical plans account for every requested control; no unsupported effect silently disappears.
  - No agent scope can loosen an existing deny or forge sealed authority.
  - No lock certification includes unsupported, writable, missing, or unverified required control axes.
  - Existing policy and deployment receipt behavior remains compatible.
  - rplugin check, install, and doctor report zero plugin findings; actual installed CLI works.
  - Product documentation separates implemented, installed, native-verified, and operator-sealed states.
glossary:
  - {term: plane, definition: Protected policy authority plus its pinned runtime and operator records.}
  - {term: certification, definition: Time-scoped evidence that every required control axis is enforced in the named native runtime.}
  - {term: tightening, definition: A proven reduction of permitted actions with no weakened existing control.}
  - {term: native evidence, definition: Observation from the running harness or OS boundary rather than only the adapter's emitted response.}
