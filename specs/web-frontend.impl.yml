schema: is.v1
metadata:
  name: polispec web, frontend
  slug: web-frontend
  version: 0.1.0
  created: '2026-10-20'
  status: draft
  author: chris
  base_commit: '6329194'
  base_version: 0.33.0
  intended_release: 0.34.0
  contract:
    - specs/app.yml#web
    - specs/app.yml#author
    - specs/app.yml#manifest
    - specs/app.yml#registration
    - specs/app.yml#effect
    - specs/app.yml#description
    - specs/app.yml#editions
  worker: {harness: claude-code, model: sonnet, effort: medium, role: coding-worker}
  reviewer: {persona: chris, harness: claude-code, model: opus, effort: high, mode: rendered review as a separate subagent}

scope:
  owns: >-
    Everything under web/public except web/public/openapi.yml: markup, CSS, ES modules, Web Components, the hand-written
    SVG icon sprite, the client data layer (fetch wrapper, session exchange, SSE client, view cache), routing, and the
    vendored CodeMirror 6 integration. This file is the frontend half of the polispec web implementation spec.
  does_not_own:
    - lib/polispec/web (Roda routes, session cookie, CSRF, rate limits, plan and apply, SSE producer). The backend spec owns them.
    - web/public/openapi.yml. Endpoint names below are the frontend's expectations; the backend spec and openapi.yml are authoritative and the worker reconciles names against openapi.yml, never invents a route.
    - Badge SVG generation in Ruby (polispec manifest --write). This file specifies the badge's visual so both renderers agree.
    - Product behavior in specs/app.yml. Nothing here changes it; open product questions are listed under open_questions.
  product_decisions_honored:
    - Six themes through one switcher; the neutral light and dark pair is the default for public users (web.themes).
    - Tightening or neutral non-global plans apply on one click; loosening, mixed, global, status flip, move, and ledger plans apply only after typing the plan id (web.writes).
    - Operator-only actions (promote to stable, deploy stable, pause, allow-once, seal, plane) render as the exact command, never a button (web.writes).
    - The promote to test after a deploy is shown as its command, never a button (web.views.manager, web.views.pipeline).
    - Exception add, promote, and remove relay a typed phrase through the delegate runner (web.writes).
    - No database, no network fetch except the local server, no build step, browser storage only caches views (web.summary, web.stack).

constraints:
  - No build step and no npm at runtime. Static ES modules and Web Components under web/public, loaded by relative URL. The only third-party code is the vendored CodeMirror 6 bundle with its license.
  - No network fetch except same-origin requests to the local server. No web fonts, no CDN, no analytics, no remote images. System font stacks only.
  - Never ship a raw native browser control. Every control is a themed custom element (ps-*). Inside its light DOM a control may render a native element purely for semantics, focus, IME, and autofill (button, input type text, textarea, dialog), restyled from tokens with appearance none; native select, checkbox, radio, input type range, date, color, and file are never used. See open_questions Q1.
  - Six themes, one switcher. Every color, radius, shadow, and font in component CSS is a var(--token); hex, rgb, and hsl literals appear only in css/themes.css and css/tokens.css. Every new token is added to all six themes in the same change.
  - Dense is the default for data and tool regions. Airy is not used anywhere in this app.
  - Works at 375, 1024, and 1600 px wide with no horizontal page scroll (document.documentElement.scrollWidth equals clientWidth). Only the map canvas, the detail and history canvases, wide tables inside their labelled scroll regions, and the CodeMirror editor may scroll horizontally, inside their own region.
  - Operator-only actions are ps-command blocks. The words promote, deploy, pause, allow-once, seal, and plane never appear on a ps-button.
  - No comments in any code file (directive NOCOM). Keep files readable through names.
  - No tests, fixtures, or test helpers (directive NOTEST). Verification is by rendering the real app against this worktree's bin/polispec web with scratch POLISPEC_STATE_HOME, POLISPEC_HOME, POLISPEC_LEDGER, and POLISPEC_GLOBAL.
  - No !important (code/web/design precision.no-important). Order the cascade with @layer.
  - UI copy uses sentence case, no em dash and no en dash anywhere visible, at most one middle dot per line, no exclamation marks, and concrete verbs on buttons.
  - Do not touch anything outside web/public. Do not commit.
  - Keep every single file a worker writes under 60 KB. The live guard refuses hook input over 65536 bytes and reports it as "guard unavailable", so a larger Write is denied; split large modules by responsibility instead.

design_read: >-
  Reading this as: a local operator console for one developer-operator who governs what coding agents may do on their own
  machine, with a dense ledger-and-signal-box language, leaning toward native Web Components, hand-written CSS tokens, and
  restrained motion. design-taste-frontend dials for this surface: DESIGN_VARIANCE 3 (symmetry doctrine), MOTION_INTENSITY 2,
  VISUAL_DENSITY 9.

intent:
  who: >-
    A developer-operator at their own machine between agent sessions. Five minutes ago an agent hit a deny or a warn in a
    terminal, or they decided a rule is wrong. Five minutes from now they are back in the terminal, running a command this
    app handed them, or watching sessions cross over to the new epoch.
  verbs: [understand why a call was judged, find which rule wins where, change a rulebook safely, see who a change reaches, prove what was judged]
  feel: >-
    A railway signal box with a ledger on the desk. Exact, stamped, auditable, quiet. Every verdict is a signal with a
    shape, a color, and a word. Nothing is decorative; nothing moves unless something changed.
  domain: [ledger and entries, layers stacked from shipped to child, verdict signals allow warn deny, trust ref and seal, promotion tracks main test stable, epoch and crossing over, judgment stream, exceptions and proposals]
  color_world: [ledger paper and ink, signal-lamp green amber red, brass seal (apple-noir gold), terminal cyan (tronwave), graphite rails]
  signature:
    - The env triplet. dev, test, and prod always render as three equal lanes in that order with the same lane anatomy, in map cards, the detail winner strip, the playground matrix, the pipeline table, and the heatmap column groups. The eye learns the gauge once.
    - Shape-coded verdict signals. allow is a circle with a check, warn a triangle with a bar, deny an octagon with a bar, always paired with the word. Color is the third cue, never the only one.
    - The strata. Wherever composition appears (map bands, detail layer chain, plan diffs), layers stack top to bottom in one fixed order: shipped, global shelf, exceptions, project, child.
  rejected_defaults:
    - {default: full-height dark sidebar with icon plus label, instead: same-surface 200px rail with a hairline, grouped by verb, collapsing to a 48px rail and a drawer}
    - {default: card grid dashboard of KPI tiles, instead: real tables with tabular numerals; cards only where an item stands alone (map entries, gallery)}
    - {default: confirm dialog with a red Delete button, instead: the plan sheet with its banner, the typed plan id for anything loosening, and command blocks for operator actions}

skills:
  catalog: ~/.ai/skills/frontend/catalog.yml
  provenance_check:
    design-taste-frontend: 'Validated 2026-10-20: front matter name design-taste-frontend, body opens with "# tasteskill: Anti-Slop Frontend Skill", MIT LICENSE present, PROVENANCE.md pins upstream commit b6b261baebc117c086a85220d277cafa01479c75.'
    web-platform-baseline: 'References verified 2026-10-09 (WebDX web-features 3.42.0), inside the 90-day window, so platform facts below are stated as current.'
  per_part:
    shell_and_navigation: [dense-precision, interface-design, ui-craft-dense-dashboard, ux-patterns/command-palette, design-taste-frontend]
    tables_everywhere: [dense-precision, ux-patterns/table, ux-patterns/filter-panel, a11y-wcag]
    states: [ui-craft (references/state-design.md), ux-patterns/empty-states, ux-patterns/skeleton]
    forms_manager_register_confirm: [dense-precision, ux-patterns/form-validation, ui-craft (references/forms.md), a11y-wcag]
    map_heatmap_blast_history: [ui-craft (references/dataviz.md), ui-craft-dense-dashboard, dense-precision, userinterface-wiki (ux-uniform-connectedness, ux-proximity-grouping)]
    author_panel: [ui-craft (references/ai-chat.md), a11y-wcag]
    motion: [userinterface-wiki (timing, easing, none-high-frequency, none-keyboard-navigation), interface-design (motion essentials)]
    typography_and_numerals: [dense-precision, userinterface-wiki (type-tabular-nums-for-data, type-slashed-zero), visual-design-foundations]
    modern_css_and_platform: [web-platform-baseline (references/css.md, references/html.md, references/a11y.md)]
    themes: [rStack canonical themes (~/rstack/themes), directive THEMES (Part I), directive TASTE (Part M)]
    review: [design-review, web-quality/web-quality-audit, dense-precision, a11y-wcag]
  why:
    dense-precision: Every region here is dense; it sets the scales, row heights, table rules, and the measurement protocol.
    interface-design: Intent, domain, signature, depth strategy, and the native-then-primitive control rule this spec bends (see departures).
    ui-craft-dense-dashboard: Operator-tool conventions (mono identifiers, semantic palette, inline shortcuts, skeleton rows matching columns).
    ux-patterns/table: Client-side sort and filter under 1000 rows, virtualization beyond, mobile strategy for wide tables.
    ux-patterns/command-palette: The keyboard-first palette and its lifecycle states.
    ux-patterns/empty-states and skeleton: Every list and view has first-run, filtered, and cleared empties and layout-matching loading.
    ux-patterns/form-validation: Validation moment (on pause or blur, never per keystroke for errors), labels above, errors below.
    ui-craft/state-design: The state lattice including partial, conflict (stale plan), and offline (server stopped).
    ui-craft/dataviz: Heatmap ramp by luminance, direct labels, no rainbow, color never alone.
    ui-craft/ai-chat: Streaming contract, stop control, tool traces (polispec approvals), scroll discipline.
    userinterface-wiki: Durations under 300 ms, no animation on high-frequency and keyboard actions, tabular and slashed-zero numerals.
    a11y-wcag: WCAG 2.2 AA floor, target size 24, focus not obscured, status messages, dragging alternatives.
    web-platform-baseline: Which platform features need no fallback (dialog, inert, :has, container queries, cascade layers, nesting, color-mix) and which do (popover, anchor positioning, field-sizing, light-dark).
    design-taste-frontend: Mandated for every rStack web surface (Part I, Part M); applied for the design read, anti-default discipline, full state cycles, copy tells, and button contrast.
  departures:
    - {skill: design-taste-frontend, rule: '9.E no hand-rolled SVG icons; use Phosphor or Tabler', decision: hand-written SVG sprite, reason: 'specs/app.yml web.stack fixes hand-written SVG and forbids runtime fetches; the sprite follows one 16px grid with a 1.5px stroke so it reads as one family.'}
    - {skill: design-taste-frontend, rule: '9.B serif not for dashboards', decision: 'apple-noir keeps its canonical serif on h1 and h2 through --font-display', reason: 'canonical theme flourish; project tokens outrank skill defaults (catalog conflicts rule). Applied only to the view title and section headings, never to data.'}
    - {skill: design-taste-frontend, rule: 'dial baseline 8/6/4', decision: '3/2/9', reason: density doctrine and symmetry doctrine.}
    - {skill: interface-design, rule: 'hit areas 44x44', decision: '24x24 minimum (WCAG 2.2 SC 2.5.8) through pseudo-element hit zones', reason: Chris charter and code/web/design interaction.target-size; 44 would bloat dense rows.}
    - {skill: interface-design, rule: 'native HTML first, then a headless primitive', decision: 'themed custom elements for every control, with native elements only as internal semantics', reason: 'Sven forbids native browser inputs; no dependency budget for a primitive library without a build step. The full keyboard and ARIA contract is owed and specified per component below.'}
    - {skill: ui-craft/state-design, rule: 'spinner inside the loading button; shimmer skeleton', decision: 'no spinners and no shimmer; static skeleton blocks, a verb-ing label, aria-busy, and an elapsed-seconds counter after 2 s', reason: 'canonical motion constraint in ~/rstack/themes: no infinite loops.'}
    - {skill: ui-craft/ai-chat, rule: 'blinking caret while streaming', decision: 'static block caret plus a Streaming label with elapsed seconds', reason: canonical no-infinite-loops constraint.}
    - {skill: ui-craft-dense-dashboard, rule: 'IBM Plex or Inter UI face', decision: 'canonical --font-sans and --font-mono system stacks', reason: no web fonts may be fetched; canonical structural tokens win.}
    - {skill: ui-craft-dense-dashboard, rule: 'h-9 toolbar controls, cards p-4 radius 8', decision: '28px toolbar controls, 8px card padding, theme radius', reason: dense class; canonical radius per theme.}
    - {skill: rbench ThemeSwitcher.svelte (directive I.5), rule: 'copy verbatim; cycle the three canonical themes; tronwave default', decision: 'ported to a Web Component with the same glyphs, size, and styling, cycling six themes with three added glyphs, defaulting to system', reason: 'specs/app.yml web.themes names six themes and the neutral pair as the default; see open_questions Q2 and Q3.'}
    - {skill: canonical themes, rule: 'maxw 1320px', decision: 'not applied to tool views; --measure 72ch caps prose blocks only', reason: dense tables and the map use the full main width.}

tokens:
  canonical_source:
    path: ~/rstack/themes (resolves to /home/sven/bitbucket/paterasai/rstack-uber/themes)
    files:
      apple-noir: ~/rstack/themes/apple-noir.yml (dark, accent #c9a961, promoted to canon 2026-08-10)
      apple-austere: ~/rstack/themes/apple-austere.yml (light, accent #1d1d1f, normalized from rbench tokens.css)
      tronwave: ~/rstack/themes/tronwave.yml (dark, accent #00e5ff, normalized from rbench tokens.css)
      fleet: ~/rstack/themes/fleet.yml (default_theme tronwave; see open_questions Q3)
      checker: ~/rstack/themes/check-contrast.rb (42 canonical pairs pass AA per the README)
    rule: 'Copy, do not wire (directive I.2). Copy the tokens block of each file verbatim into css/themes.css under its selector and the structural block verbatim into :root in css/tokens.css. Copy the apple-noir flourishes block, adapted to this app''s hooks (ps-topbar for navbar, ps-card and ps-panel for card and panel).'
  live_in:
    css/tokens.css: ':root structural tokens (canonical structural block plus the app scales below). No colors.'
    css/themes.css: 'One block per theme: :root, [data-theme="light"] (neutral light, also the no-JS fallback), [data-theme="dark"], [data-theme="apple-noir"], [data-theme="apple-austere"], [data-theme="tronwave"], plus @media (prefers-color-scheme: dark) { :root:not([data-theme]) { dark values } } for the no-JS path. Each block sets color-scheme. Then the app-owned per-theme tokens, then the apple-noir flourishes scoped to [data-theme="apple-noir"].'
  structural_canonical:
    space-1: 4px
    space-2: 8px
    space-3: 12px
    space-4: 16px
    space-5: 24px
    space-6: 32px
    space-7: 48px
    space-8: 64px
    maxw: 1320px
    dur-fast: 110ms
    dur: 190ms
    dur-slow: 340ms
    ease: cubic-bezier(0.22, 1, 0.36, 1)
    font-sans: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif'
    font-mono: 'ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace'
  structural_app:
    note: Theme-independent scales owned by polispec web. Every size in component CSS comes from these or the canonical block.
    type:
      text-2xs: {size: 11px, line: 14px, use: 'meta, group labels, kbd, chart axis'}
      text-xs: {size: 12px, line: 16px, use: 'table headers, field labels, chips, mono identifiers in dense rows'}
      text-sm: {size: 13px, line: 18px, use: 'default UI and data text, table cells, controls'}
      text-md: {size: 14px, line: 22px, use: 'prose blocks in regular regions (explainer reasons, descriptions in detail, author messages)'}
      text-lg: {size: 16px, line: 22px, use: section headings (h2)}
      text-xl: {size: 18px, line: 24px, use: view title (h1), one per view}
      text-num: {size: 20px, line: 24px, use: 'plan banner counts and the few headline figures; tabular-nums'}
    weights: {weight-regular: 400, weight-medium: 500, weight-strong: 600}
    numerals: '.num and every numeric cell: font-variant-numeric: tabular-nums lining-nums; text-align: end. Mono identifiers: font-family var(--font-mono); font-variant-numeric: tabular-nums slashed-zero.'
    controls: {control-xs: 24px, control-sm: 28px, control-md: 32px}
    rows: {row: 28px, row-compact: 24px}
    icons: {icon: 16px, icon-lg: 18px}
    lines: {border-w: 1px, focus-w: 2px, focus-offset: 2px}
    layout: {topbar-h: 40px, nav-w: 200px, rail-w: 48px, panel-w: 360px, panel-w-compact: 320px, tray-h: 40px, gutter: 'var(--space-4)', measure: 72ch}
    map: {card-w: 240px, card-h: 116px, child-h: 52px, map-col-gap: 'var(--space-5)', map-row-gap: 'var(--space-7)', band-h: 'var(--space-7)', band-gap: 'var(--space-2)', band-to-grid: 'var(--space-8)', canvas-pad: 'var(--space-6)'}
    z: {z-sticky: 10, z-tray: 20, z-drawer: 30, z-popover: 40, z-toast: 60}
    motion_use: 'hover and press: var(--dur-fast); popovers, drawers, toasts: var(--dur); plan sheet: var(--dur-slow) max. Animate only opacity and transform. Never transition: all. @media (prefers-reduced-motion: reduce) sets every transition to opacity only at var(--dur-fast) and removes transforms and the finite map pulse.'
  themes:
    light:
      source: 'designed here for polispec web (neutral FOSS pair), measured 2026-10-20'
      color-scheme: light
      bg: '#ffffff'
      bg-elev: '#ffffff'
      surface: '#ffffff'
      surface-2: '#f3f4f6'
      border: 'rgba(17, 24, 39, 0.12)'
      border-strong: 'rgba(17, 24, 39, 0.24)'
      text: '#16181d'
      text-dim: '#4b515c'
      text-faint: '#5f6672'
      accent: '#2456c9'
      accent-hover: '#1b45a6'
      accent-contrast: '#ffffff'
      accent-soft: 'rgba(36, 86, 201, 0.08)'
      ok: '#1d7442'
      warn: '#8a5a00'
      danger: '#bb2f27'
      danger-contrast: '#ffffff'
      radius: 6px
      radius-sm: 4px
      radius-pill: 999px
      shadow: '0 0 0 1px rgba(17, 24, 39, 0.06), 0 4px 12px rgba(17, 24, 39, 0.08)'
      grid: transparent
      glow: none
      scrim: 'rgba(17, 24, 39, 0.40)'
      font-display: var(--font-sans)
    dark:
      source: 'designed here for polispec web (neutral FOSS pair), measured 2026-10-20'
      color-scheme: dark
      bg: '#0e1014'
      bg-elev: '#13161b'
      surface: '#13161b'
      surface-2: '#1a1e25'
      border: 'rgba(255, 255, 255, 0.09)'
      border-strong: 'rgba(255, 255, 255, 0.18)'
      text: '#e7e9ed'
      text-dim: '#a6acb7'
      text-faint: '#8f96a2'
      accent: '#7fa3ff'
      accent-hover: '#a6bfff'
      accent-contrast: '#0e1014'
      accent-soft: 'rgba(127, 163, 255, 0.12)'
      ok: '#62c28a'
      warn: '#e2b250'
      danger: '#f27d71'
      danger-contrast: '#0e1014'
      radius: 6px
      radius-sm: 4px
      radius-pill: 999px
      shadow: '0 0 0 1px rgba(255, 255, 255, 0.06), 0 8px 24px rgba(0, 0, 0, 0.50)'
      grid: transparent
      glow: none
      scrim: 'rgba(0, 0, 0, 0.55)'
      font-display: var(--font-sans)
    apple-noir: {source: ~/rstack/themes/apple-noir.yml tokens, copied verbatim, color-scheme: dark, flourishes: 'copied from the flourishes block: h1, h2 use --font-display; ps-topbar gets border-bottom 1px var(--border-strong) and box-shadow inset 0 1px 0 var(--accent-soft); ps-card and ps-panel box-shadow none; ::selection gold.'}
    apple-austere: {source: ~/rstack/themes/apple-austere.yml tokens, copied verbatim, color-scheme: light}
    tronwave: {source: ~/rstack/themes/tronwave.yml tokens, copied verbatim, color-scheme: dark, note: '--grid is used by the map canvas; --glow only on hover of the theme switcher and on the focused map card, never on text.'}
    categorical: 'Not copied. No surface encodes categories by hue; layers are distinguished by position and label.'
  app_owned_per_theme:
    note: Defined in every one of the six theme blocks. Values marked derived are identical expressions in all six.
    control-bg: {light: '#f7f8fa', dark: '#0b0d10', apple-noir: '#070605', apple-austere: '#fafafb', tronwave: '#04060b'}
    control-border: {light: 'rgba(17, 24, 39, 0.50)', dark: 'rgba(255, 255, 255, 0.36)', apple-noir: 'rgba(201, 169, 97, 0.58)', apple-austere: 'rgba(0, 0, 0, 0.46)', tronwave: 'rgba(0, 229, 255, 0.50)'}
    focus-ring: {derived: var(--accent)}
    verdict-allow: {derived: var(--ok)}
    verdict-warn: {derived: var(--warn)}
    verdict-deny: {derived: var(--danger)}
    row-hover: {derived: 'color-mix(in srgb, var(--text) 4%, transparent)'}
    row-selected: {derived: var(--accent-soft)}
    heat-1: {derived: 'color-mix(in srgb, var(--accent) 14%, var(--surface))'}
    heat-2: {derived: 'color-mix(in srgb, var(--accent) 30%, var(--surface))'}
    heat-3: {derived: 'color-mix(in srgb, var(--accent) 48%, var(--surface))'}
    heat-4: {derived: 'color-mix(in srgb, var(--accent) 72%, var(--surface))'}
    heat-5: {derived: 'color-mix(in srgb, var(--accent) 90%, var(--surface))'}
    heat-ink-1-to-3: {derived: var(--text)}
    heat-ink-4: {light: var(--text), dark: var(--accent-contrast), apple-noir: var(--accent-contrast), apple-austere: var(--accent-contrast), tronwave: var(--accent-contrast)}
    heat-ink-5: {derived: var(--accent-contrast)}
    heat-dead: {derived: 'repeating-linear-gradient(135deg, var(--border-strong) 0 1px, transparent 1px 6px) on var(--surface)'}
    map-grid: {light: 'rgba(17, 24, 39, 0.06)', dark: 'rgba(255, 255, 255, 0.05)', apple-noir: 'rgba(201, 169, 97, 0.06)', apple-austere: 'rgba(0, 0, 0, 0.05)', tronwave: var(--grid)}
    edge: {derived: var(--border-strong)}
    edge-hot: {derived: var(--accent)}
    diff-add-bg: {derived: 'color-mix(in srgb, var(--ok) 12%, var(--surface))'}
    diff-del-bg: {derived: 'color-mix(in srgb, var(--danger) 12%, var(--surface))'}
    sample-light: {derived: "'#ffffff' in every theme (badge preview tile only)"}
    sample-dark: {derived: "'#0d1117' in every theme (badge preview tile only)"}
  contrast_evidence:
    method: 'WCAG 2.x relative luminance; rgba composited over the surface it sits on; color-mix computed in sRGB. Script run 2026-10-20 in the session scratchpad; the reviewer re-measures from computed styles in the browser.'
    minimum_over_bg_surface_surface2:
      light: {text: 16.14, text-dim: 7.25, text-faint: 5.26, ok: 5.26, warn: 5.39, danger: 5.38, accent: 5.87, accent-contrast_on_accent: 6.46, danger-contrast_on_danger: 5.92}
      dark: {text: 13.75, text-dim: 7.33, text-faint: 5.61, ok: 7.64, warn: 8.53, danger: 6.33, accent: 6.83, accent-contrast_on_accent: 7.78, danger-contrast_on_danger: 7.21}
      apple-noir: {text: 15.82, text-dim: 6.84, text-faint: 4.81, ok: 6.71, warn: 8.30, danger: 4.66, accent: 8.30, accent-contrast_on_accent: 8.84, danger-contrast_on_danger: 4.97}
      apple-austere: {text: 15.46, text-dim: 5.49, text-faint: 4.80, ok: 4.94, warn: 4.66, danger: 6.00, accent: 15.46, accent-contrast_on_accent: 16.83, danger-contrast_on_danger: 6.54}
      tronwave: {text: 16.10, text-dim: 5.94, text-faint: 4.52, ok: 13.64, warn: 12.60, danger: 5.27, accent: 11.81, accent-contrast_on_accent: 13.09, danger-contrast_on_danger: 5.84}
    non_text_3_to_1:
      control-border_min: {light: 3.32, dark: 3.29, apple-noir: 3.55, apple-austere: 3.42, tronwave: 3.77}
      focus-ring_min: {light: 5.87, dark: 6.83, apple-noir: 8.30, apple-austere: 15.46, tronwave: 11.81}
    heat_cells_ink:
      light: [14.37, 11.06, 8.01, 4.97, 5.24]
      dark: [11.84, 8.43, 5.62, 4.64, 6.53]
      apple-noir: [13.23, 9.20, 5.87, 5.04, 7.32]
      apple-austere: [12.67, 8.79, 5.45, 6.65, 12.50]
      tronwave: [13.01, 8.19, 4.76, 7.11, 10.68]
    findings_that_shaped_tokens:
      - 'Verdict-colored text on a 14% verdict tint fails in apple-noir (danger 4.21) and apple-austere (ok 4.43, warn 4.22). So chips and tinted rows set their label in var(--text) and use the verdict color only for the glyph and the 1px border (non-text, all >= 3:1). Verdict-colored text appears only on plain surfaces, where it passes.'
      - 'border-strong is decorative (1.3 to 1.9:1). Text fields and other control boundaries use --control-border, which passes 3:1 on every surface in every theme.'
      - 'Heat step 4 at 72% needs --text in light and --accent-contrast elsewhere; at 70% dark failed both inks, which is why the step sits at 72%.'

theme_system:
  choices: [system, light, dark, apple-noir, apple-austere, tronwave]
  default_choice: system
  default_reason: 'specs/app.yml web.themes: the neutral light and dark pair is the default for public users. system resolves to light or dark from prefers-color-scheme and follows it live.'
  attributes: 'html[data-theme-choice] holds the choice; html[data-theme] holds the resolved theme (light, dark, apple-noir, apple-austere, tronwave). CSS keys only on data-theme.'
  boot: 'js/boot/theme-boot.js, a classic blocking script in <head> before any stylesheet, reads localStorage polispec.web.theme inside try/catch, falls back to system, resolves it with matchMedia, and sets both attributes before first paint. With JS off, :root carries light and the prefers-color-scheme dark block applies.'
  runtime: 'js/core/theme.js exports getChoice(), setChoice(id), cycle(direction), and subscribes to matchMedia change while the choice is system. setChoice writes localStorage in try/catch and dispatches ps-theme-change on document.'
  storage_key: polispec.web.theme
  switcher:
    element: ps-theme-switcher
    form: 'One icon button, never a menu, segmented control, or swatch row (directive I.5). 32x32, radius var(--radius-pill), background var(--surface-2), 1px var(--border), color var(--text-dim); hover color var(--accent), border var(--border-strong), box-shadow var(--glow); active translateY(0.5px); focus-visible outline var(--focus-w) solid var(--focus-ring) offset var(--focus-offset). Glyph 18px, viewBox 0 0 24 24, stroke currentColor, stroke-width 2, fill none, round caps and joins.'
    cycle: 'system, light, dark, apple-noir, apple-austere, tronwave, then system. Click or Enter or Space goes forward; Shift+click or Shift+Enter goes back.'
    glyphs:
      apple-noir: 'moon, path M20 14.6A8 8 0 1 1 9.4 4a6.3 6.3 0 0 0 10.6 10.6Z (canonical, verbatim)'
      apple-austere: 'sun, circle cx 12 cy 12 r 4.2 plus path M12 2v2.4M12 19.6V22M4.22 4.22l1.7 1.7M18.08 18.08l1.7 1.7M2 12h2.4M19.6 12H22M4.22 19.78l1.7-1.7M18.08 5.92l1.7-1.7 (canonical, verbatim)'
      tronwave: 'hex-wave, paths M12 2.5 20.2 7.25 20.2 16.75 12 21.5 3.8 16.75 3.8 7.25Z and M7 12q2.5-3.5 5 0t5 0 (canonical, verbatim)'
      system: 'monitor, proposed: path M3.5 5h17v11h-17Z M8.5 20h7 M12 16v4'
      light: 'bulb, proposed: path M9 18h6 M10 21h4 M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2V16h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z'
      dark: 'eclipse, proposed: circle cx 10 cy 12 r 6.5 plus path M13.5 6.4a6.5 6.5 0 0 1 0 11.2'
    accessible_name: 'aria-label "Theme: <Current>. Activate for <Next>. Shift and activate for <Previous>." title "Theme: <Current>. Next: <Next>". No visible text label. Names: System, Light, Dark, Apple Noir, Apple Austere, Tronwave.'
    other_entry_points: 'The command palette offers Theme: <Name> for each of the six; each calls theme.setChoice, the same API the switcher uses. That is a command, not a second switcher.'
  every_theme_rule: 'Any change to a token, component, or view is checked in all six choices (system checked once in each OS scheme) before it is called done.'

icons:
  file: web/public/icons/icons.svg
  form: 'One SVG sprite of <symbol id="i-<name>" viewBox="0 0 16 16">, stroke currentColor, stroke-width 1.5, fill none, round caps and joins, drawn on whole and half pixels. The three canonical theme glyphs and the three proposed ones are separate 24-unit symbols (t-<theme>). Used through <svg class="ps-icon" aria-hidden="true"><use href="icons/icons.svg#i-name"/></svg>.'
  sizes: '16px everywhere (--icon) except the top bar and the theme switcher at 18px (--icon-lg). Chevrons and play shapes shift 1px toward visual center.'
  set:
    nav: [map, layers, edit, beaker, rails, rewind, grid, badge, question, cards, terminal, list-clock, flag, tray, signal, manifest, plus-folder]
    verdict: {allow: circle with check, warn: triangle with vertical bar and dot, deny: octagon with horizontal bar}
    effect: {next-call: arrow to vertical line, new-session: circle with plus, reload: open circular arrow, trust: shield with check}
    classification: {tightening: arrow pointing in to a bar, neutral: equals, loosening: arrow pointing out from a bar, mixed: two opposed arrows, global: globe}
    ui: [chevron-down, chevron-right, close, copy, check, search, lock, pin, grip, zoom-in, zoom-out, fit, reset, pause, play, stop, filter, more, menu, error, info, hourglass, panel-right, sort-asc, sort-desc]
  rule: 'An icon never carries meaning alone. Verdicts, effects, and classifications always pair glyph and word; icon-only buttons carry aria-label and a tooltip.'

data_layer:
  files: [js/core/api.js, js/core/session.js, js/core/sse.js, js/core/cache.js, js/core/router.js, js/core/store.js, js/core/announce.js, js/core/format.js, js/core/keys.js, js/core/errors.js]
  api:
    base: /api/v1, same origin only. Any absolute URL to another origin throws in api.js.
    headers: 'Mutations send X-Polispec-CSRF from session state and Content-Type application/json; credentials same-origin. The cookie is HttpOnly and never read by script.'
    timeouts: 'AbortController per call: GET 10 s, plan creation 60 s, apply 120 s, everything else 30 s. A timeout surfaces as error kind timeout with the elapsed time.'
    retries: 'GET only: at most 2 retries on network failure or 502/503/504, delay 250 ms x 2^n with plus or minus 50% jitter. Mutations are never retried automatically.'
    limiter: 'Client token bucket mirroring the server: 30 mutations a minute. When empty, the action is refused before the request with a toast "Too many changes in a minute. Try again in N s." A 429 from the server shows the same copy with its Retry-After.'
    kill_switch: 'GET /api/v1/config on boot returns flags (author.enabled, feed.enabled, description.allowed, edition). A false flag disables the feature in place with its reason; the client never calls a disabled feature.'
    errors: 'errors.js maps responses to kinds: offline (fetch failed), unauthorized (401), forbidden (403, session or CSRF or origin), conflict (409, stale plan id), invalid (422 with findings), rate_limited (429), server (5xx), timeout. Every error carries a client error id err_<8 hex> and the server request id when present.'
  session:
    exchange: 'On boot, if location.hash starts with #k=, POST the code once to the exchange route, then history.replaceState to #/map regardless of outcome so the code never stays in the address bar or history. On success store the CSRF token in memory only (not storage). On failure render the session gate.'
    gates: [exchanging, link_used_or_expired, no_session, session_ended, server_unreachable]
  sse:
    source: 'EventSource on the judgment stream route; one connection per tab shared by feed, sessions, map counts, and the top bar status.'
    states: [connecting, live, reconnecting, paused, closed, disabled]
    reconnect: 'Backoff 1, 2, 4, 8, 16, then every 30 s, each plus or minus 30% jitter, forever while the tab is visible; paused while document.hidden and resumed on visibilitychange.'
    buffer: 'Ring buffer of the last 1000 judgment events in memory; views read from it.'
  cache:
    store: 'sessionStorage per tab for view payloads keyed by route and ETag; localStorage only for preferences (theme, feed filters, table column choices, shortcut toggle, author panel open). Every access in try/catch; the app renders correctly with storage unavailable.'
    freshness: 'A view rendered from cache shows a ps-chip "Cached <age>, refreshing" in its header until the fresh response lands, then removes it. On refresh failure the chip reads "Cached <age>, refresh failed" with a Retry icon button.'
  router: 'Hash routes (#/map and so on). Unknown route renders the not-found view inside the shell. Route change moves focus to the view h1 (tabindex -1) and announces "<View> loaded" through announce.js.'
  announce: 'One polite and one assertive visually hidden live region in index.html. announce(text, {assertive}) debounces identical messages within 1 s.'
  format: 'shortDigest(sha, 8) shows the first 8 hex; middleTruncate(id, n) keeps head and tail with one ellipsis character; relTime with absolute ISO in title; counts with Intl.NumberFormat; durations as 12 s, 4 min, 2 h.'
  keys: 'Shortcut registry. Single-key and g-prefixed shortcuts work only when focus is not in a text field or the editor, and can be turned off in the shortcuts dialog (SC 2.1.4). Mod means Cmd on macOS and Ctrl elsewhere.'

file_layout:
  web/public/index.html: 'Shell markup only: head (meta viewport width=device-width, initial-scale=1; theme-boot.js; css/app.css; icons preload), body with ps-app-shell, two live regions, and <script type="module" src="js/app.js">.'
  web/public/css/app.css: '@layer vendor, reset, tokens, themes, base, components, shell, views, flourish; then @import url(...) layer(...) for each file below in that order.'
  web/public/css/reset.css: Modern reset (box-sizing border-box, margin 0 on text elements, media block, font inherit on controls).
  web/public/css/tokens.css: structural tokens.
  web/public/css/themes.css: six theme blocks, app-owned per-theme tokens, apple-noir flourishes (layer flourish).
  web/public/css/base.css: 'html and body (background var(--bg), color var(--text), font var(--text-sm)/var(--lh-sm) var(--font-sans), -webkit-font-smoothing antialiased, font-synthesis none), headings, links, ::selection, :focus-visible ring, .num, .mono, .visually-hidden, prefers-reduced-motion block.'
  web/public/css/components/<name>.css: one file per ps-* component.
  web/public/css/shell.css: shell grid, top bar, nav, side panel, tray, breakpoints.
  web/public/css/views/<view>.css: one file per view.
  web/public/js/boot/theme-boot.js: classic script, no imports.
  web/public/js/app.js: entry; registers components, boots session, config, router.
  web/public/js/core/*.js: data layer modules listed above, plus theme.js.
  web/public/js/components/ps-<name>.js: one custom element per file, light DOM, no shadow root.
  web/public/js/views/<view>.js: one view module per route, exporting render(container, params, signal).
  web/public/js/map/{layout.js, edges.js, pan.js}: map geometry, edge paths, pan and zoom.
  web/public/js/editor/codemirror.js: the only module that imports the vendored CodeMirror; exports createYamlEditor(el, options).
  web/public/vendor/codemirror/: 'the vendored CodeMirror 6 YAML bundle as ES modules, LICENSE, and VERSIONS.yml with exact versions (see open_questions Q5).'
  web/public/icons/icons.svg: the sprite.
  component_conventions: 'Light DOM custom elements (no shadow DOM) so tokens, layers, and CodeMirror styling cascade normally. Each class extends HTMLElement, renders once in connectedCallback, reflects state through attributes (state, disabled, selected, expanded, busy), styles itself by its tag name and [state=...] selectors, dispatches ps-<event> CustomEvents with bubbles true, and cleans up listeners and AbortControllers in disconnectedCallback.'

shell:
  element: ps-app-shell
  density: dense
  grid:
    xl_1440_up: 'grid-template-columns: var(--nav-w) minmax(0, 1fr) auto; grid-template-rows: var(--topbar-h) minmax(0, 1fr). The third column is the side panel at var(--panel-w) when open, 0 when closed.'
    l_1024_1439: 'columns var(--nav-w) minmax(0, 1fr). The side panel opens as a drawer over main from the right, width var(--panel-w), with var(--scrim) behind it; the manager docks it instead (see manager).'
    m_768_1023: 'columns var(--rail-w) minmax(0, 1fr). Nav is an icon rail. Side panel is a drawer.'
    s_below_768: 'one column. Nav is a drawer from the left (ps-drawer, width min(320px, 100vw - 48px)). Side panel is a full-screen sheet.'
    breakpoints_note: 'Page layout uses media queries at 768, 1024, and 1440. Components respond to their container with container queries (container-type inline-size on every view body and panel).'
  topbar:
    element: ps-topbar
    height: var(--topbar-h)
    layout: 'grid-template-columns: 1fr auto 1fr; align-items center; padding-inline var(--gutter); background var(--bg); border-bottom 1px solid var(--border). Left group justify-self start, right group justify-self end, center element sits on the viewport center line whatever the flank widths.'
    control_height: 'var(--control-md) for every top bar control, matching the canonical 32px theme switcher.'
    left_group: ['menu icon button (below 1024 only), aria-label "Open navigation", aria-expanded', 'wordmark "polispec" text-lg weight-strong, links to #/map', 'epoch chip: ps-digest of the current epoch, 8 hex, label "epoch", tooltip with full value and when it last changed (hidden below 768)']
    center: 'Palette trigger: a ps-button variant field, width clamp(240px, 36vw, 480px), height 32, icon search, text "Search or run a command" in --text-faint, kbd hint "Mod K" right-aligned. Below 768 it collapses to a 32px search icon button that moves into the right group.'
    right_group: ['feed status: ps-conn-status, 32px pill showing a signal glyph and Live, Reconnecting, Paused, or Offline (hidden below 768; shown in the nav drawer instead)', 'author panel toggle: icon button panel-right, aria-label "Author panel", aria-pressed (hidden below 768; in the palette instead)', 'ps-theme-switcher (below 768 it moves to the nav drawer footer)']
    s_below_768: 'Three tracks stay 1fr auto 1fr: left menu (32), center wordmark, right search (32). Flanks are mirrored 32px controls; the theme switcher, feed status, and author toggle live in the drawer footer.'
    symmetry: 'Center element on the axis; flank tracks equal by construction. Reviewer measures the center element offset from viewport center: must be 0 to 0.5px at 375, 1024, 1600.'
  nav:
    element: ps-nav
    width: 'var(--nav-w) at 1024 and up; var(--rail-w) at 768 to 1023; drawer below 768.'
    surface: 'background var(--bg) (same as canvas), border-inline-end 1px solid var(--border). Never a contrasting sidebar color.'
    groups:
      - {label: Observe, items: [{name: Map, route: '#/map', icon: map}, {name: Pipeline, route: '#/pipeline', icon: rails}, {name: Sessions, route: '#/sessions', icon: terminal}, {name: Feed, route: '#/feed', icon: signal}, {name: Timeline, route: '#/timeline', icon: list-clock}, {name: Heatmap, route: '#/heatmap', icon: grid}]}
      - {label: Understand, items: [{name: Playground, route: '#/playground', icon: beaker}, {name: Explainer, route: '#/explain', icon: question}, {name: History, route: '#/history', icon: rewind}]}
      - {label: Change, items: [{name: Manager, route: '#/manager', icon: edit}, {name: Gallery, route: '#/gallery', icon: cards}, {name: Exceptions, route: '#/exceptions', icon: flag}, {name: Register, route: '#/register', icon: plus-folder}]}
      - {label: Publish, items: [{name: Manifest, route: '#/manifest', icon: manifest}]}
    not_in_nav: 'Detail opens from a map card, a rule id, or the palette (#/detail/...). Blast radius lives in the manager tray and as a map overlay. The plan banner lives in the plan sheet. The author panel is the side panel. Badges are a tab of Manifest. The proposals inbox is a tab of Exceptions.'
    item: 'height var(--row); padding-inline var(--space-2); gap var(--space-2); icon 16; label text-sm; radius var(--radius-sm); hover background var(--row-hover); current: aria-current="page", background var(--row-selected), color var(--text), weight-medium, inset box-shadow 2px 0 0 var(--accent) on the leading edge. Counts (Exceptions inbox proposals, Sessions needing reload) as a right-aligned .num text-xs text-dim, never a colored pill.'
    group_label: 'text-2xs weight-medium color var(--text-faint), sentence case, height 20, padding-inline var(--space-2). Groups are separated by var(--space-3).'
    footer: 'At the bottom of the rail: "polispec <version>" mono text-2xs text-faint, and the session expiry note when under 10 minutes. In the drawer the footer also holds feed status, author toggle, and the theme switcher in one row of 32px controls centered on the drawer axis.'
    rail_768: 'Items are 48 wide, icon centered, label in aria-label and in a ps-tooltip on hover and focus. Group labels become 1px separators with var(--space-2) above and below.'
    keyboard: 'Tab enters the nav at the current item (roving tabindex); ArrowUp and ArrowDown move; Home and End jump; Enter follows. g then m, p, s, f, t, h, y, x, i, e, r, n go to Map, Pipeline, Sessions, Feed, Timeline, Heatmap, Playground, Explainer, History, Exceptions, Register, Manifest; g then c goes to Manager; g then a goes to Gallery.'
  main:
    element: main#view with ps-view-boundary inside
    padding: 'var(--gutter) on all sides at every width.'
    view_header: 'One row, min-height var(--control-md), no extra band: h1 (text-xl, weight-strong, font var(--font-display)) and an optional context chip on the left; view actions on the right, all var(--control-sm). Gap below var(--space-3). No subtitle paragraph, no hero, no eyebrow.'
    region_gap: var(--space-3)
  side_panel:
    element: ps-side-panel
    content: 'Hosts the author panel (and, in Exceptions, the exception detail on wide screens).'
    surface: 'background var(--surface), border-inline-start 1px solid var(--border).'
    behavior: 'Docked third column at 1440 and up; drawer at 768 to 1439 (except manager, which docks it at 1024 and up); full-screen sheet below 768. Esc closes the drawer and the sheet and returns focus to the toggle.'
  plan_tray:
    element: ps-plan-tray
    where: 'Bottom of main in manager and gallery when a draft exists; position sticky; inset-block-end 0; z var(--z-tray).'
    collapsed: 'height var(--tray-h); background var(--surface-2); border-top 1px solid var(--border-strong); grid 1fr auto: left summary text-sm ("Draft of <rulebook>: 3 rules changed. Blast radius, last 14 days: 37 rows flip in 3 projects."), right actions ("Show blast radius" toggle, "Review plan" primary), all 28px.'
    expanded: 'max-height 40vh, overflow auto, holds the blast radius table. Toggle has aria-expanded and aria-controls.'
  palette:
    element: ps-palette
    open: 'Mod K anywhere (also inside the editor), or the top bar trigger. Opens a ps-dialog modal, width min(640px, 100vw - 32px), inset-block-start 12vh, no entrance animation (high frequency).'
    anatomy: 'Combobox text field 32px (role combobox, aria-expanded, aria-controls, aria-activedescendant) over a listbox (role listbox) of option rows var(--row): icon 16, label text-sm, secondary text-xs text-dim, right-aligned kbd hint or kind. Group headers (Go to, Projects, Rulebooks, Actions, Theme) text-2xs text-faint, role presentation, options keep their group in aria-describedby.'
    commands: [go to each view, open project detail by id, open rulebook in manager, open history of a rulebook, explain a judgment id, copy the epoch, copy the last plan id, toggle feed pause, open author panel, open shortcuts, 'Theme: System, Light, Dark, Apple Noir, Apple Austere, Tronwave']
    matching: 'Case-insensitive subsequence match on label and keywords; ranked by prefix match, then word-start match, then recency (last 8 used, kept in localStorage).'
    keyboard: 'ArrowUp and ArrowDown move the active option (wrapping), Enter runs it, Esc closes and restores focus, Tab is trapped in the dialog. No animation on open or on active-row change.'
    states:
      loading: 'Static commands appear immediately; project and rulebook groups show two skeleton rows and the text "Loading projects" until data arrives.'
      empty: 'One row: No command matches "<query>". Secondary: "Try a view name, a project id, or a rule id."'
      error: 'Project group shows one row: Projects did not load. Retry (Enter retries).'
      overflow: 'At most 50 options rendered; a final row "Showing 50 of <n>. Keep typing to narrow." Long labels truncate with ellipsis; full label in title.'
  toasts:
    element: ps-toaster
    placement: 'Fixed, inset-inline-end var(--gutter), inset-block-end var(--gutter), width 360 at 768 and up; at 375 centered, width calc(100vw - 32px). Stack upward, gap var(--space-2), at most 3 visible (older collapse into "and 2 more").'
    toast: 'min-height var(--control-md); padding var(--space-2) var(--space-3); background var(--surface); border 1px solid var(--border-strong); radius var(--radius); shadow var(--shadow); grid auto 1fr auto: icon 16 (verdict-allow check for success, info, error), text (title text-sm weight-medium, optional body text-xs text-dim), dismiss icon button 24.'
    behavior: 'Success and info auto-dismiss after 5 s, paused while hovered or focused. Errors stay until dismissed and always also appear inline where the action happened; a toast is never the only record of an error. Enter on a toast with an action runs it. Motion: opacity plus 4px translateY at var(--dur), reduced-motion opacity only.'
    a11y: 'Container is not a live region; each toast is announced through announce.js (polite for success and info, assertive for errors).'
  error_boundary:
    element: ps-view-boundary
    catches: 'Exceptions thrown by a view render or by its async loaders (each view render receives an AbortSignal and returns a promise; the boundary awaits it). window error and unhandledrejection events raised while a view is mounted are routed to its boundary.'
    renders: 'In place of the view, inside the shell so navigation still works: ps-state kind error, title "This view failed to render", body the error message (first line, mono text-xs), the error id, and actions Retry (re-renders the view) and Copy details (copies route, error id, message, stack, user agent, app version).'
  session_gates:
    element: ps-session-gate
    layout: 'Replaces the shell content; one centered panel width min(480px, 100vw - 32px), padding var(--space-5), density regular. The only centered panel in the app.'
    states:
      exchanging: 'Title "Opening polispec web"; static hourglass; text "Checking the one-time link."'
      link_used_or_expired: 'Title "This link has already been used or has expired"; body "Each link printed by polispec web works once. Start a new session in a terminal."; ps-command "polispec web --open".'
      no_session: 'Title "No session"; body "Open the link polispec web printed in your terminal."; same ps-command.'
      session_ended: 'Title "Session ended"; body names the cause when known (signed out, origin mismatch, CSRF token rejected); same ps-command.'
      server_unreachable: 'Title "polispec web is not running"; body "Start it again in a terminal. Cached views are shown when you reopen the link."; same ps-command; Retry button.'
  offline_banner:
    element: ps-banner
    when: 'Any API call fails as offline after a session exists.'
    render: 'Row at the top of main, height var(--control-md), background var(--surface-2), border-bottom 1px solid var(--warn), icon warn, text "polispec web is not responding. Views may be out of date.", Retry 28px. Mutating controls across the app set disabled with the reason "Server not responding" in their tooltip.'
  shortcuts_dialog:
    element: ps-dialog with id shortcuts
    open: '? when focus is not in a text field; also from the palette.'
    content: 'Two-column table of shortcut and action, grouped by area, plus a ps-toggle "Single-key shortcuts" (on by default).'

components:
  ps-button:
    variants: {primary: 'background var(--accent), color var(--accent-contrast), no border', secondary: 'background var(--surface), color var(--text), 1px var(--control-border)', ghost: 'transparent, color var(--text-dim), hover background var(--row-hover)', danger: 'background var(--danger), color var(--danger-contrast); used only for Remove and Discard draft', field: 'palette trigger look: background var(--control-bg), 1px var(--control-border), text-faint label, left aligned'}
    sizes: 'xs 24, sm 28 (default), md 32. padding-inline var(--space-3) at sm and md, var(--space-2) at xs; gap var(--space-2) between icon and label; text-sm weight-medium; radius var(--radius-sm); label never wraps (white-space nowrap) and never exceeds three words for primary actions.'
    states: {hover: 'primary background var(--accent-hover); secondary background var(--row-hover)', focus-visible: outline var(--focus-w) solid var(--focus-ring) offset var(--focus-offset), active: scale(0.98) at var(--dur-fast), disabled: 'aria-disabled true (stays focusable to expose its reason), opacity 0.5 on the fill only, label keeps 4.5:1, cursor not-allowed, tooltip with the reason', busy: 'attribute busy: label switches to its verb-ing form (Apply plan to Applying), static hourglass icon, aria-busy true, clicks ignored, after 2 s an elapsed counter "Applying, 4 s"'}
    semantics: 'Renders an internal <button type="button">; the host element is not focusable itself. Accessible name is the label; icon-only buttons need label attribute mapped to aria-label.'
    keyboard: Enter and Space activate.
  ps-icon-button:
    size: 'square at the row control height (24, 28, or 32); icon 16 (18 in the top bar). A 24px button gets a ::after hit zone inset -2px so the target stays at least 24 even with a border.'
    states: same as ps-button ghost, plus pressed (aria-pressed true, background var(--row-selected), color var(--accent)).
    a11y: 'Required label attribute becomes aria-label and the ps-tooltip text.'
  ps-text-field:
    anatomy: 'Label above (text-xs weight-medium color var(--text-dim), gap var(--space-1)), field box, then one message line (text-xs) for help or error, reserved height 16 only when the field declares help or validation so rows do not jump.'
    box: 'height var(--control-sm) (or md in dialogs and forms); padding-inline var(--space-2); background var(--control-bg); 1px solid var(--control-border); radius var(--radius-sm); text-sm; mono variant for ids, globs, commands, plan ids. Optional leading icon 16 and trailing clear icon button 24.'
    states: {placeholder: 'color var(--text-faint), never used as the label', hover: border var(--text-dim), focus: 'border var(--focus-ring) plus outline var(--focus-w) solid var(--focus-ring) offset 0', invalid: 'border var(--danger), message in var(--danger) with deny glyph, aria-invalid true, aria-describedby to the message', disabled: 'background var(--surface-2), text var(--text-faint), reason in the help line', readonly: 'background transparent, border var(--border), selectable text'}
    validation_moment: 'Validate on blur and after 600 ms of no typing; clear an error as soon as the value becomes valid; never show an error on a pristine field.'
    semantics: 'Internal <input type="text" class="ps-native"> with appearance none, autocomplete off unless declared, spellcheck false for mono variant. Label is a real <label for>.'
    small_viewport: 'Under @media (max-width: 767px) and (pointer: coarse), the editable text inside ps-text-field, ps-textarea, ps-combobox, ps-confirm, and the CodeMirror content computes 16px with line 20 (iOS Safari zooms the page on focus below 16px; ui-craft forms.md). The box keeps its control height; padding-block shrinks to fit. Never cap zoom in the viewport meta.'
  ps-textarea:
    box: 'Same tokens as ps-text-field; min rows 2, max rows 8, auto-grows by measuring scrollHeight (field-sizing content is Baseline newly available 2026-06-16, so used under @supports with the JS grow as the fallback).'
    keyboard: 'Mod Enter submits when the host declares submit.'
  ps-select:
    anatomy: 'Button-styled trigger at the row control height (label left, chevron-down right, value truncates with ellipsis, full value in title) opening a listbox popup.'
    popup: 'Absolutely positioned under the trigger (anchor positioning is Baseline newly available, so JS positioning with flip-to-top when it would overflow the viewport is the default path); width max(trigger, 200px), max-height 320, overflow auto; background var(--bg-elev); 1px var(--border-strong); radius var(--radius); shadow var(--shadow); options var(--row), padding-inline var(--space-2); selected option shows a check icon and aria-selected true; active option background var(--row-hover).'
    searchable: 'With more than 12 options the popup starts with a 28px filter field (becomes a combobox per APG).'
    keyboard: 'Trigger: Enter, Space, ArrowDown open; typing selects by prefix. Popup: ArrowUp, ArrowDown, Home, End move; Enter selects and closes; Esc closes without change; Tab closes and moves on. Focus returns to the trigger.'
    semantics: 'Trigger has aria-haspopup listbox, aria-expanded, aria-controls; popup role listbox with aria-labelledby the field label; options role option.'
    states: {loading: 'popup shows two skeleton rows and "Loading"', empty: 'one row "No options"', error: 'one row "Options did not load" with Retry', disabled: as ps-button disabled}
  ps-combobox:
    use: 'Filters by session, project, or rule; judgment id picker; module search.'
    form: 'ps-text-field plus listbox popup per APG combobox (list autocomplete). Multi-select variant renders chosen values as removable ps-chip filter chips inside the field row, wrapping to a second row only at 375.'
    keyboard: 'ArrowDown opens; ArrowUp and ArrowDown move; Enter picks; Backspace on empty input removes the last chip; Esc closes then clears.'
  ps-toggle:
    form: 'A switch: track 28x16, radius var(--radius-pill), background var(--control-border) off and var(--accent) on; thumb 12px var(--surface) (var(--accent-contrast) when on), 2px inset; the label sits to the right, text-sm; the whole row is the hit target (min 24 high).'
    semantics: 'Internal <button role="switch" aria-checked>.'
    keyboard: Space and Enter toggle.
    motion: thumb translateX at var(--dur-fast); reduced motion jumps.
  ps-segmented:
    form: 'A row of equal-width segments at the row control height inside one 1px var(--control-border) box, radius var(--radius-sm); selected segment background var(--row-selected), color var(--text), weight-medium, inset 0 -2px 0 var(--accent) (so selection is not color alone).'
    semantics: 'role radiogroup with role radio buttons, aria-checked, roving tabindex.'
    keyboard: Arrow keys move and select; Home and End.
    symmetry: 'Segments share one width (the widest label plus padding), so the control is symmetric about its center.'
  ps-tabs:
    form: 'Tablist row height var(--control-sm), border-bottom 1px var(--border); tabs padding-inline var(--space-3), text-sm, color var(--text-dim); selected tab color var(--text), weight-medium, 2px var(--accent) underline flush with the hairline. Counts as .num text-xs after the label. When tabs overflow (375), the tablist scrolls horizontally inside itself with scroll-snap and scrollbar-width thin; no page scroll.'
    semantics: 'role tablist, tab, tabpanel; aria-selected; aria-controls; panels tabindex 0.'
    keyboard: 'Left and Right move and activate (automatic activation, panels are cheap); Home and End.'
  ps-dialog:
    form: 'Native <dialog> opened with showModal() (Baseline widely available) for the top layer, focus containment, and inert background; ::backdrop var(--scrim). Panel background var(--bg-elev), 1px var(--border-strong), radius var(--radius), shadow var(--shadow). Header row: h2 text-lg plus close icon button 28; body; footer row of actions right-aligned (primary last).'
    sizes: 'sm min(440px, 100vw - 32px); md min(640px, 100vw - 32px); lg min(960px, 100vw - 32px) with max-height min(88vh, 900px); below 768 every size is full-screen (inset 0, radius 0).'
    behavior: 'Esc closes unless the dialog is busy; focus goes to the first focusable or the declared initial element and returns to the opener on close. Motion: opacity plus scale 0.98 to 1 at var(--dur); reduced motion opacity only.'
  ps-drawer:
    form: 'Same <dialog> technique, docked to an edge (start for nav, end for side panel), full height, width per use. Motion translateX 16px plus opacity at var(--dur).'
  ps-tooltip:
    form: 'Popup on hover after 400 ms and on focus immediately; text-xs; background var(--text); color var(--bg); padding var(--space-1) var(--space-2); radius var(--radius-sm); max-width 320. Placement above, flipping below at the viewport edge.'
    a11y: 'Linked with aria-describedby (or provides the accessible name for icon-only buttons via aria-label, not by the tooltip itself). Dismissible with Esc, hoverable, persists while hovered (SC 1.4.13).'
  ps-chip:
    kinds:
      verdict: 'allow, warn, deny. Height 20 (24 in tables with row 28), padding-inline var(--space-2), radius var(--radius-sm), 1px border in the verdict token, glyph 14 in the verdict token, label text-xs weight-medium in var(--text). Never verdict-colored label on a tint (see contrast findings).'
      status: 'live (ok glyph circle-dot), onboarding (accent ring), retired (text-faint, dashed border). Label always present.'
      effect: 'next_call, new_session, reload, trust. Neutral: 1px var(--border-strong), glyph var(--text-dim), label "Next call", "New session", "After /reload-plugins", "After trust review".'
      classification: 'tightening (ok border and glyph), neutral (border-strong), loosening (warn), mixed (warn), global (accent border, globe glyph). Label text: Tightening, Neutral, Loosening, Mixed, Global.'
      session: 'current (ok), pending (text-dim, hourglass), reload needed (warn, reload glyph, copy command /reload-plugins on activate), stale briefing (warn), untrusted hook (danger, Codex only).'
      filter: 'Outline chip with removable close icon button 20 inside a 24 hit zone; label text-xs.'
      tag: 'Plain mono text-xs in var(--surface-2) background, no border; used for layer names, kinds, envs.'
    a11y: 'A chip is text, not a control, unless it says otherwise (session reload chip is a button "Copy /reload-plugins").'
  ps-digest:
    form: 'Mono text-xs, first 8 hex (or middle truncation for ids), color var(--text-dim); full value in a ps-tooltip; Copy on activate (it is a button with aria-label "Copy <kind> <full value>"), toast "Copied".'
  ps-command:
    use: Every operator-only action and every command the app hands to a terminal (promote to test, reload, await, polispec web --open).
    form: 'Block: background var(--surface-2); 1px var(--border); radius var(--radius-sm); grid auto 1fr auto, min-height var(--control-md); left: lock icon (operator) or terminal icon (anyone), center: the command in mono text-sm, wrapping at word boundaries with overflow-wrap anywhere so long paths never cause page scroll, right: copy icon button 28 "Copy command". Above it, one line text-xs text-dim: who runs it ("Operator only. Run in a terminal." or "Run in a terminal.") and why ("Only the operator promotes to stable.").'
    never: 'No run, execute, or submit button, no link that triggers the action, no copy-and-run.'
    states: {copied: 'icon swaps to check for 1.5 s and announce "Command copied"', copy_failed: 'clipboard unavailable: the command text becomes selected and the toast reads "Select and copy the command."'}
  ps-confirm:
    use: 'Typed confirmation for loosening, mixed, global, status flip, move, and ledger plans (expected text is the plan id) and for exception add, promote, and remove (expected text is the phrase the delegate runner asks for).'
    anatomy: 'Line 1 text-sm: "Type the plan id to apply." (or "Type the phrase to continue."). Line 2: the expected text in a mono chip (ps-chip tag, text-sm, selectable). Line 3: ps-text-field mono, height var(--control-md), width min(100%, 360px), label "Plan id" (or "Phrase"), autocomplete off, spellcheck false. Line 4 status text-xs: "Does not match yet" (text-dim) or "Matches" (ok glyph plus text). The primary action beside it is disabled until the trimmed value equals the expected text exactly (case-sensitive).'
    behavior: 'Paste is allowed. Enter submits only when matching. The status line updates on input and is announced politely after 500 ms of no typing. The client check only gates the button; the server re-checks (and for phrases compares in constant time), so a server refusal renders inline under the field with its code.'
    a11y: 'aria-describedby links the field to line 1, the expected chip, and the status line.'
  ps-scrubber:
    use: History refs, heatmap and blast radius windows.
    form: 'A horizontal track (height 24, the line itself 2px var(--border-strong) at mid-height) with tick marks: commits 6px tall var(--text-faint), release tags 12px tall var(--text) with a mono text-2xs label above, labels thinned to avoid overlap (keep every tag label whose box does not collide; the rest show on hover). Two thumbs A and B: 16x16, radius var(--radius-pill), 2px var(--accent) ring on var(--surface); the span between them is a 4px var(--accent-soft) band. Below the track, two read-outs left and right: "A: <ref> <date>" and "B: <ref> <date>", mono text-xs, mirrored about the track center.'
    semantics: 'Each thumb role slider, aria-valuemin 0, aria-valuemax n-1, aria-valuenow index, aria-valuetext "<short sha>, <tag if any>, <date>", aria-label "From ref" and "To ref". Thumbs cannot cross; A is always older.'
    keyboard: 'Left and Right move one commit; PageUp and PageDown jump to the previous or next tag; Home and End to the ends; Enter applies the diff for the current A and B.'
    pointer: 'Drag a thumb or click the track to move the nearest thumb. Dragging has a non-drag alternative: the keyboard and the two ref pickers (ps-select) under the read-outs (SC 2.5.7).'
    overflow: 'More than one tick per 4px: the track becomes horizontally scrollable inside its own region with the selected span kept in view.'
  ps-data-table:
    use: Every tabular surface.
    markup: 'A real <table> inside <div class="ps-table-scroll" role="region" aria-label="<caption>" tabindex="0">; <caption> visually hidden unless the view shows it; <thead> with <th scope="col">; row headers <th scope="row"> for the first column.'
    sizing: 'table-layout fixed with declared column widths per view; row height var(--row) (var(--row-compact) for feed and lint); cells padding-block 0, padding-inline var(--space-2), vertical-align middle, text-sm; headers text-xs weight-medium color var(--text-dim), aligned to their column content edge; numeric columns end-aligned with tabular-nums; ids and digests mono; text truncates with ellipsis and shows the full value in title plus a ps-tooltip on focus.'
    chrome: 'Header row position sticky inset-block-start 0, background var(--surface), box-shadow inset 0 -1px var(--border). Rows separated by a 1px var(--border) bottom hairline only (no top and bottom pairs, no zebra). Hover background var(--row-hover); selected background var(--row-selected) plus inset 2px 0 0 var(--accent) on the first cell. First column sticky (inset-inline-start 0, background var(--surface)) when the table is wider than its region.'
    sort: 'Sortable headers render an internal <button> with sort-asc or sort-desc icon; aria-sort on the th. Client-side sort and filter under 1000 rows.'
    virtualize: 'Above 500 rows, render only the visible window plus 20 rows each side; fixed row height keeps scroll math exact; column widths and header stay stable.'
    expandable_rows: 'A leading 28px disclosure icon button per row (aria-expanded, aria-controls) opens a full-width detail row (colspan) with padding var(--space-2) var(--space-3).'
    keyboard: 'The scroll region is focusable for keyboard scrolling. Rows that open something have one focusable control (the first-cell link or button); J and K move the selected row when single-key shortcuts are on; Enter opens it.'
    states: {loading: 'skeleton rows matching the column structure: 8 rows of var(--row) with blocks sized to each column (60 to 80% of width), static fill var(--surface-2), aria-busy true on the table, caption suffix "Loading"; shown after 200 ms; after 5 s the caption shows "Still loading, <n> s"', empty: 'one full-width row of ps-state empty (first-run or filtered, see ps-state)', error: 'one full-width row of ps-state error with Retry', partial: 'rows that loaded render; a single banner row at the top: "<n> of <m> projects did not respond." with Retry for those only', overflow: 'virtualized; long text truncates; very wide tables scroll inside the region with the first column sticky'}
  ps-state:
    kinds:
      empty_first_run: 'Icon 16 in var(--text-faint), title text-sm weight-medium, one line text-xs text-dim explaining why, one action (button or ps-command). Left-aligned to the region content edge, padding var(--space-3); no illustration, no centered hero.'
      empty_filtered: 'Title "No rows match these filters", action "Clear filters".'
      empty_cleared: 'Title names the good news plainly ("No proposals waiting"), no action.'
      error: 'deny glyph in var(--danger), title naming what failed, body with the specific cause, error id (ps-digest), Retry, and Copy details.'
      disabled: 'lock or info glyph, title "<Feature> is turned off", body with the reason from config, ps-command to turn it on when one exists.'
  ps-skeleton:
    form: 'Static blocks of var(--surface-2), radius var(--radius-sm), sized to the content they stand for. No shimmer and no pulse (canonical: no infinite loops).'
  ps-kbd:
    form: 'Inline mono text-2xs, padding 0 var(--space-1), 1px var(--border-strong), radius var(--radius-sm), color var(--text-dim).'
  ps-env-lanes:
    form: 'grid-template-columns repeat(3, minmax(0, 1fr)); gap var(--space-2). Lanes in fixed order dev, test, prod, each labeled with the env name and its branch (dev main, test test, prod stable) in text-2xs text-faint. The same anatomy in every surface: verdict chip, then the primary value (rule id or digest), then a secondary line.'
    symmetry: Three equal lanes, equal gaps; the triplet is centered on its container axis.
  ps-conn-status:
    form: 'Pill 32 high in the top bar (24 in the feed toolbar): signal glyph plus word. Live (ok glyph), Reconnecting in <n> s (warn), Paused (text-dim), Offline (danger), Turned off (text-faint). Activating it opens the feed. aria-label "Live feed: <state>".'
  ps-banner:
    form: 'Full-width row inside a region, height var(--control-md), background var(--surface-2), 1px border in the severity token on the leading edge (inset 3px 0 0), icon plus one sentence plus optional action. Used for offline, stale plan, description_ahead_of_runtime, and the partial-data notice.'
  ps-card:
    form: 'background var(--surface); box-shadow inset 0 0 0 1px var(--border) (the hairline is inside so padding stays exactly var(--space-2)); radius var(--radius); padding var(--space-2). Hover box-shadow inset 0 0 0 1px var(--border-strong). Focus-visible outline var(--focus-w) var(--focus-ring) offset var(--focus-offset). Used only for map entries, gallery items, and the author draft result.'
  ps-plan-sheet:
    defined_in: surfaces.plan_banner
  ps-author-panel:
    defined_in: surfaces.author_panel

surfaces:
  map:
    route: '#/map (map mode) and #/map/list (list mode)'
    density: dense
    data_needs: 'Ledger projects and path entries (id, kind, status, owner, summary, description, policy digest per env, verdict counts in the active window), worktree globs per project with matched worktree count, shipped layer modules, global shelf modules and path policies, exceptions entries, and for each module instance the set of entry ids it reaches. Saved layout positions from web state. Expected endpoints GET /api/v1/map and GET/PUT /api/v1/state/layout (reconcile with openapi.yml).'
    regions:
      header: 'h1 "Map", then on the right a toolbar of 28px controls: ps-segmented Map | List, ps-select "Window: 24 hours" (1 hour, 24 hours, 7 days) for verdict counts, icon buttons zoom-out, zoom-in, fit, and a ghost button "Reset layout" (enabled only when a card has a saved position).'
      inspector_line: 'One 24px line under the header, text-xs text-dim, aria-live polite (debounced 300 ms): describes the hovered or focused item, for example "tool-declared (shipped) reaches 8 projects" or "teach inherits 4 shipped modules, 3 shelf modules, and 2 exceptions". Empty text when nothing is hovered.'
      canvas: 'ps-map: role region, aria-label "Policy map", tabindex 0, fills the remaining main height (min-height 480 at 1024 and up, 60vh below), overflow hidden, background var(--bg) with a dot grid: radial-gradient(var(--map-grid) 1px, transparent 1px) at 24px by 24px, which moves with the pan offset.'
    layout:
      coordinates: 'Content laid out in canvas units, transformed by translate(x, y) scale(z) on one inner element (transform only). z in {0.5, 0.75, 1, 1.25, 1.5}, default fit-to-width capped at 1.'
      columns: 'N = clamp(1, round(sqrt(entry_count x 1.6)), 8). Grid width W = N x card-w + (N - 1) x map-col-gap.'
      bands: 'Three bands stacked at the top in strata order: Shipped, Global shelf, Exceptions. Each band is W wide and band-h tall, separated by band-gap, background var(--surface-2), box-shadow inset 0 0 0 1px var(--border), radius var(--radius). A band has a 120px label column on the left (text-xs weight-medium, plus a count of instances in .num text-2xs) and a chip row: module instance chips (mono text-xs, height 24, padding-inline var(--space-2), radius var(--radius-sm), background var(--surface), 1px var(--border-strong)) laid in one row centered on the band axis with equal var(--space-2) gaps. If chips overflow the band width, the band grows to two rows (chips still centered per row). Exceptions with more than 6 entries collapse to one chip "<n> exceptions" that expands into rows on activate.'
      grid: 'Entry cards start band-to-grid below the last band. Ledger projects first (live, onboarding, retired; then id ascending), then a 24px group label "Path entries" and path entries in the same grid. Each row is centered on the canvas axis: a last row with k < N cards is offset by (N - k) x (card-w + map-col-gap) / 2 so the composition stays bilateral (recorded: the last row is short when the count is not a multiple of N; balance is restored by centering it).'
      children: 'Worktree glob cards (card-w x child-h) stack directly under their project card, gap var(--space-2), joined by a 1px var(--edge) vertical connector centered on both cards. A row''s height is its tallest stack; cards in a row are top-aligned.'
      edges: 'SVG layer under the cards (pointer-events none). One cubic edge per (module instance, reached entry): from chip bottom center (x1, y1) to card top center (x2, y2) with control points (x1, y1 + d/2) and (x2, y2 - d/2), d = y2 - y1. Stroke 1px var(--edge), fill none, vector-effect non-scaling-stroke. Above 200 edges, edges are hidden until something is hovered or focused, and the inspector line says "Edges show on hover; <n> edges".'
      saved_positions: 'A card the person moved keeps its saved canvas position (PUT to web state, debounced 500 ms) and shows a pin icon 14 in its header; edges follow it. Reset layout clears saved positions after a ps-dialog sm confirm ("Reset the map layout? Saved positions for <n> cards are cleared.").'
    card:
      element: ps-map-card (a ps-card), card-w x card-h, link to #/detail/<kind>/<id>
      grid: 'grid-template-rows 20px 16px 32px 20px; row-gap var(--space-1); padding var(--space-2). 116 = 8 + 20 + 4 + 16 + 4 + 32 + 4 + 20 + 8.'
      rows:
        - 'Header 20: name text-sm weight-strong (truncate, min-width 0) left; status ps-chip right; pin icon when saved.'
        - 'Summary 16: text-xs text-dim, one line, ellipsis.'
        - 'Description 32: text-xs color var(--text), two lines with line-clamp 2; when missing, text-faint "No description" plus a warn glyph (description_missing).'
        - 'Footer 20: ps-digest of the dev policy digest left; verdict counts right as three glyph plus .num pairs (allow, warn, deny) with gap var(--space-2), counts over 9999 shown as 10k+.'
      inherited_strip: 'A 3px strip along the card top inside the radius, split into three equal segments for Shipped, Global shelf, and Exceptions; a segment is var(--edge) when that band reaches the entry and transparent when it does not. Title text lists which bands it inherits from.'
      child_card: 'child-h 52: row 1 glob in mono text-xs (middle truncation); row 2 "<n> worktrees match" text-2xs text-dim.'
    highlight:
      trigger: 'pointerenter or focus on a card, chip, or band label; leaves on pointerleave or blur (keyboard focus keeps it).'
      related_set: 'Card: every chip whose instance reaches it, its bands, its children or parent, and those edges. Chip: every entry it reaches and those edges. Band label: every entry reached by any chip in the band.'
      render: 'Related cards box-shadow inset 0 0 0 2px var(--edge-hot) and background color-mix(in srgb, var(--accent) 6%, var(--surface)); related chips border var(--edge-hot); related edges stroke var(--edge-hot) at 2px and are raised to the end of the SVG. Unrelated edges keep 1px var(--edge). Unrelated cards keep their text and colors unchanged (no opacity dimming of text). Tronwave adds box-shadow var(--glow) on the hovered card only. Transitions on stroke and box-shadow color only at var(--dur-fast); none for keyboard focus changes.'
    blast_overlay:
      trigger: '#/map?blast=<draft id> (opened from the manager tray).'
      render: 'A ps-banner above the canvas "Blast radius of <draft>: <n> rows flip in <p> projects." with "Close overlay". Edges from the drafted layer to entries with flips are drawn 2px dashed (6 4): var(--danger) where calls become stricter, var(--warn) where looser; affected cards show a chip "<n> flips" in the footer in place of the verdict counts. The pulse: opacity 1 to 0.35 to 1 over 900 ms, exactly 3 iterations, then static. Reduced motion: no pulse.'
    pan_zoom:
      pointer: 'Drag on empty canvas pans (pointer capture; touch-action none on the canvas only). Mod plus wheel or trackpad pinch zooms around the pointer; plain wheel pans vertically, Shift wheel horizontally.'
      keyboard: 'Canvas focused: arrows pan 32 canvas units (Shift 128); + and - zoom; 0 fits; Tab moves through cards in reading order (bands top to bottom, then rows left to right) and focusing a card scrolls it into view.'
      move_card: 'Card focused: M enters move mode (announce "Moving <name>. Arrow keys move, Enter saves, Escape cancels."); arrows move 8 units (Shift 32); Enter saves; Esc restores. This is the non-drag alternative for dragging a card (pointer drag on a card header also moves it).'
    list_mode:
      default_below: 768
      markup: 'role tree with aria-label "Policy map as a list". Top-level treeitems: Shipped, Global shelf, Exceptions (each expands to its module instances, each of which expands to the entries it reaches), then Projects and Path entries (each entry expands to its worktree globs and to "Inherits from" lists). Rows var(--row), indent var(--space-4) per level, chevron 16, label text-sm, secondary text-xs text-dim, verdict counts right-aligned.'
      keyboard: 'APG tree: Up and Down move, Right expands or enters, Left collapses or goes to parent, Home and End, Enter opens detail, typeahead by first letters.'
      purpose: 'The text route and accessibility fallback for the SVG map, and the default at 375.'
    states:
      loading: 'Bands render as three skeleton bands and six skeleton cards in the grid geometry; header controls disabled; inspector line "Loading map".'
      empty: 'No ledger projects and no path entries: bands still render (the shipped layer always exists); the grid area shows ps-state empty_first_run "No projects are governed yet" with "Register a path" (button to #/register) and ps-command "polispec apply environment-control --repo <path> --variant service" with the text "Put a git repository under polispec in a terminal."'
      error: 'ps-state error in the canvas area; header controls stay usable.'
      partial: 'An entry whose policy failed to load renders its card with a danger strip and "Policy did not load" in the description row; edges to it are drawn dashed.'
      overflow: '60 entries with 41-character ids and 400-word descriptions: names truncate; descriptions clamp; canvas pans; edges hide above 200; list mode stays complete.'
    symmetry: 'Bands share width W and the canvas axis; chips centered per band row with equal gaps; grid rows centered; children centered under parents; three inherited strip segments equal. Recorded asymmetry: band label column sits on the left for reading order; balance restored because the chip row is centered on the band axis, not on the space right of the label.'
    acceptance:
      - 'At 1600, 1024, and 375 in all six themes: the canvas and its toolbar never cause page scroll; list mode is the default at 375.'
      - 'Card computed size 240 x 116, padding 8, row tracks 20/16/32/20, gaps 4.'
      - 'Hovering a project highlights exactly the chips and edges that reach it (verified against the map payload) and the inspector line text matches.'
      - 'Center offset of every grid row and every band chip row from the canvas axis is 0 to 0.5 canvas units; adjacent chip gaps are equal to 0.5px.'
      - 'Keyboard-only: reach every card, open detail, move a card and save, reset layout.'
      - 'Blast overlay pulse runs 3 times then stops (no animation running after 3 s, checked with document.getAnimations()).'
  detail:
    route: '#/detail/<kind>/<id> where kind is project, path, module, package, global, or exceptions'
    density: dense
    data_needs: 'The composed rulebook: layer chain shipped to child, module instances with resolved params, rules with layer, verdict per env, overrides and overridden-by, description; gates; freezes; and an explain call for the winner per env for a chosen action. Expected GET /api/v1/rulebooks/<kind>/<id>/composition and POST /api/v1/explain (read-only).'
    regions:
      header: 'h1 rulebook name; to its right status chip, kind tag, and ps-digest. Actions right: "Edit in manager" (secondary 28), "History" (ghost 28). When description is missing a ps-banner warn "No description. Add one in the manager." under the header.'
      winner_strip: 'Row 1: ps-select "Action class" (width 240, searchable) and ps-text-field "Tool call or command" (flex 1, mono), both 28, gap var(--space-2); a ghost button "Clear". Row 2: ps-env-lanes, each lane padding var(--space-2), box-shadow inset 0 0 0 1px var(--border), radius var(--radius): verdict chip, winning rule id (mono text-sm link that scrolls to and selects the rule row), layer tag, and a third line text-xs text-dim "overrides <rule>" when it does. Empty action: lanes show text-faint "Pick an action class to see the winning rule".'
      body: 'At 1024 and up: grid-template-columns 264px minmax(0, 1fr); gap var(--space-3). Left: layer chain. Right: ps-tabs Rules (count) | Modules (count) | Gates (count) | Freezes (count). Below 1024: layer chain becomes a ps-select "Layer: All layers" above the tabs.'
      layer_chain: 'A list in strata order (shipped, global shelf, exceptions, project, child). Each layer row var(--row): disclosure chevron, layer name text-sm weight-medium, then right-aligned .num rule count and module count (text-xs text-dim). Selecting a layer row filters the Rules tab (aria-pressed, row-selected style); "All layers" row at the top. Expanding a layer lists its module instances (rows var(--row-compact), mono name); expanding an instance shows its resolved params as a two-column key-value table (key mono text-xs text-dim, value mono text-xs, both start-aligned on shared edges).'
      rules_tab: 'ps-data-table columns: Rule (mono, 180, sticky), Layer (tag, 112), dev | test | prod (three 32px centered cells, each a 16px verdict glyph with aria-label "<env>: <verdict>", or a text-faint dash when the rule does not apply), Applies to (action classes, flex, truncate), Overrides (rule ids, 160), Description (flex, shown only when the region is at least 960 wide via container query; otherwise in the expandable row). Overridden rules render text-dim with an "overridden by <rule>" tag in Overrides; no strikethrough. Expandable rows show the description (text-md, max-width var(--measure)), the source location (file:line mono), and the raw rule YAML read-only.'
      gates_tab: 'Columns: Gate (mono), Transition (main to test, test to stable), Requirement (flex), Status (chip: passing, failing, not evaluated).'
      freezes_tab: 'Columns: Freeze (mono), Env, Window (start and end, mono, tabular), Reason (flex), Active (chip).'
      modules_tab: 'Columns: Module (mono), Layer (tag), Kind (module or package), Params (count, .num), Rules contributed (.num). Row expansion shows params as in the layer chain.'
    states:
      loading: 'Winner lanes as three skeleton lanes; layer chain 5 skeleton rows; table skeleton rows.'
      empty: 'A rulebook with no rules of its own: Rules tab shows ps-state empty_first_run "This rulebook adds no rules of its own. It inherits <n> rules from <layers>." with "Show inherited rules" (selects All layers).'
      error: 'Composition failed: ps-state error with the validator findings listed (code, path, message) when the server returns 422.'
      explain_error: 'Winner lanes show "Could not judge this action" with Retry, independently of the table.'
      overflow: '300 rules, 40-character rule ids, 12 layers in a child chain: table virtualizes; layer chain scrolls inside its column; lanes truncate rule ids in the middle.'
    keyboard: 'Rule ids in lanes are links; Alt plus 1, 2, 3 focus the dev, test, prod lane; / focuses the tool field when single-key shortcuts are on.'
    symmetry: 'Winner lanes equal thirds; header title group and action group on mirrored edges; recorded asymmetry: the 264px layer chain on the left (reading order: filter before results), balanced by the three-lane strip spanning both columns above.'
    acceptance:
      - 'Lanes measure equal width to 0.5px at 375, 1024, 1600; verdict per lane matches polispec explain run in a terminal for the same action.'
      - 'Rules table rows 28px, glyph cells centered (offset 0 to 0.5px), numeric columns end-aligned.'
  manager:
    route: '#/manager/<kind>/<id>'
    density: dense
    data_needs: 'Rulebook source at main (YAML text and ETag), its schema id, live lint results (schema and Description.lint findings with code and span), shelf modules and packages with param schemas, scopes for move targets, and plan creation and apply. Expected GET /api/v1/rulebooks/<kind>/<id>/source, POST /api/v1/lint, GET /api/v1/catalog, POST /api/v1/plans, POST /api/v1/plans/<plan id>/apply, POST /api/v1/blast-radius.'
    regions:
      toolbar: 'One row of 28px controls: rulebook picker ps-select (searchable, grouped by scope: Project-local, Global shelf, Projects, Paths; label shows scope tag plus name), validation ps-chip ("Valid", or "<n> errors" with deny glyph, "<n> warnings" with warn glyph; activates the Lint tab), then buttons "Compose" (secondary), "Move" (secondary, enabled when the cursor is inside a rule or module), "Plan" (primary; label "Plan global" when the rulebook is the global shelf). Right edge: icon button "Author panel" (aria-pressed).'
      editor: 'createYamlEditor: CodeMirror 6 with YAML language, line numbers, fold gutter, lint gutter, bracket matching, history, search (Mod F), and a theme built only from tokens: background var(--control-bg), text var(--text), gutters var(--surface-2) with var(--text-faint) numbers, active line var(--row-hover), selection var(--accent-soft), cursor var(--accent), lint underline wavy var(--danger) or var(--warn), font var(--font-mono) var(--text-sm)/var(--lh-sm). The editor border 1px var(--border), radius var(--radius-sm). Height: fills the region (minmax(0, 1fr)) with a minimum of 320.'
      right_panel: 'ps-tabs Lint | Outline | Compose | Author, width var(--panel-w-compact) at 1024 to 1439 and var(--panel-w) at 1440 and up, docked beside the editor; below 1024 the four tabs plus an Editor tab share the full width.'
      lint_tab: 'ps-data-table compact (row 24): severity glyph (16, centered), Line:Col (.num 64, end-aligned), Code (mono 136), Message (flex). Activating a row moves the editor cursor to the span and focuses the editor. Description findings show their code (too_short, too_long, restates_summary, names_nothing, states_no_effect) and a line under the table for the description field: "<s> sentences, <w> words. Needs 2 to 8 sentences and 20 to 400 words." Empty: "No findings. <schema id> and the description lint pass."'
      outline_tab: 'The rules and module instances of this layer as a list (rows var(--row)): grip icon, rule id (mono), group tag. Reorder: drag the grip, or select a row and press Alt ArrowUp or Alt ArrowDown (announce "Moved <rule> to position <n> of <m>"); "Move to group" via a ps-select in the row''s more menu. Reordering edits the draft text and shows a ps-banner "Order changed. Plan to apply it." Reorder and regroup plans require the typed plan id (move).'
      compose_tab: 'ps-combobox "Find a module or package" over a list (row 28: name mono, kind tag, summary text-xs). Selecting one shows its param form below: fields from its param schema (string to ps-text-field, enum to ps-select, boolean to ps-toggle, list to a repeatable ps-text-field list with add and remove icon buttons), label above each, gap var(--space-1) inside a field and var(--space-3) between fields, required fields marked "Required" in the label (not an asterisk alone). Footer: "Insert into draft" (primary). Insert applies one CodeMirror transaction at the composition point, selects the inserted range, and gives it background var(--accent-soft) for 2 s (one finite transition).'
      move_dialog: 'ps-dialog md "Move <id>": From (read-only scope plus file), To ps-segmented Project-local | Global shelf | Project, target ps-select (projects list when Project), Position ps-select (before or after a rule, or end). Footer: "Plan move" (primary) opens the plan sheet with the paired plan; moves always need the typed plan id.'
      tray: 'ps-plan-tray when the draft differs from main. Expanded content is the blast radius surface.'
    nav_collapse: 'At 1024 to 1439 the shell nav collapses to the 48px rail while the manager is open (focus mode for editing), restored on leaving the route. At 1024 the main area is then 976 wide; minus 32 padding, 320 panel, and 16 gap, the editor gets 608. Recorded departure from the nav width rule for this one route.'
    deploy: 'After a successful apply on main, the plan sheet result shows "Applied on main as <commit>." and ps-command "polispec promote <repo> --to test" with the line "Run in a terminal. The gate decides whether it promotes." Never a promote button.'
    global: 'Rulebook picker entry "Global shelf"; Plan becomes "Plan global"; every global plan needs the typed plan id and shows the classification chip Global.'
    description_ahead_of_runtime: 'When config says description.allowed is false, a description key in the draft gets an error diagnostic "Readers of this rulebook run a polispec older than 0.34.0; a description makes it invalid there." and a ps-banner warn under the toolbar; Plan is disabled while the draft adds a description key.'
    states:
      loading: 'Toolbar controls disabled; editor area shows 12 skeleton lines of varied width; right panel skeleton rows.'
      empty: 'No rulebook chosen (#/manager): editor area shows ps-state empty_first_run "Pick a rulebook to edit" with the rulebook picker focused.'
      error_load: 'ps-state error in the editor area.'
      lint_unavailable: 'Lint tab shows ps-banner "Live lint is not responding. The plan still validates before anything applies."'
      conflict: 'Source changed on main after the draft was opened (ETag mismatch on plan): ps-banner danger "<rulebook> changed on main since you opened it." with "Show changes" (opens a read-only diff in a dialog) and "Rebase draft" (re-applies the draft on top when it merges cleanly, otherwise keeps both texts side by side for the person).'
      unsaved: 'Leaving the route with a draft that differs from main asks with ps-dialog sm "Leave without planning? The draft stays in this tab." The draft persists in sessionStorage per rulebook.'
      overflow: '3000-line rulebook: CodeMirror virtualizes; lint table virtualizes past 500 findings.'
    keyboard: 'Mod S runs Plan; Mod Shift L focuses the Lint tab; Mod Shift O the Outline tab; Esc in the editor returns focus to the toolbar only when pressed twice (single Esc stays for CodeMirror).'
    symmetry: 'Toolbar: left control group and right group on mirrored edges; editor and panel share top and bottom edges exactly. Recorded asymmetry: the editor is wider than the panel because the editor is the focal element.'
    acceptance:
      - 'All controls in the toolbar compute 28px tall; editor top edge equals the right panel top edge to 0.5px.'
      - 'Typing an invalid key shows a lint row within 800 ms with the right code; fixing it clears the row.'
      - 'Insert from Compose produces YAML that validates; a reorder via keyboard only works and announces.'
      - 'No promote button exists in the DOM anywhere (query button text and aria-label for promote, deploy, pause, allow-once, seal, plane).'
  playground:
    route: '#/playground'
    density: dense
    data_needs: 'POST /api/v1/explain with a tool call, a shell line, or a judgment id; returns the verdict per project and env with the explain rule trace. Recent judgments for the picker.'
    regions:
      input: 'ps-segmented Tool call | Shell line | Recorded judgment (28). Tool call: ps-textarea mono (JSON hook payload, 4 to 12 rows). Shell line: ps-text-field mono 32. Recorded judgment: ps-combobox searching jdg_ ids with secondary text (tool, project, verdict, time). Then "Judge" (primary 28, Mod Enter). A line text-xs text-dim: "Read-only. Nothing is recorded."'
      matrix: 'ps-data-table: rows are ledger projects then path entries (Entry column mono, sticky, 200), then three equal columns dev | test | prod (each 120, centered) holding a verdict chip, then Rule (mono flex). Clicking or Enter on a cell selects it (cells are buttons with aria-label "<entry> <env>: <verdict> by <rule>").'
      trace: 'For the selected cell: an ordered list, one row per step (row 28): step number .num, layer tag, rule id mono, matched or skipped (text plus glyph), and the step verdict chip; the winning step row is row-selected. Under it the explain reason text in text-md.'
    layout: 'At 1440 and up: matrix and trace side by side, grid 1fr 1fr, gap var(--space-3). Below: trace under the matrix.'
    states:
      idle: 'Matrix shows ps-state empty_first_run "Enter a tool call or pick a recorded judgment to see the verdict everywhere."'
      loading: 'Matrix skeleton rows per entry.'
      invalid: 'Unparseable JSON: field error under the textarea with the parse position.'
      error: ps-state error.
      overflow: '60 entries: table virtualizes; trace of 40 steps scrolls in its region.'
    symmetry: 'Three env columns equal; matrix and trace equal halves at 1440 and up.'
    acceptance:
      - 'A recorded deny judgment replays to the same verdict and rule as its record.'
  blast_radius:
    route: 'Inside the manager tray (expanded) and as the map overlay.'
    density: dense
    data_needs: 'POST /api/v1/blast-radius with the draft: per project, the count of judgment rows in the last 14 days replayed, and flips by direction (allow to warn, allow to deny, warn to deny, and the reverse).'
    regions:
      header_line: 'text-sm: "Last 14 days: <rows> judgment rows replayed against the draft." Right: ghost button "Show on map" (#/map?blast=<id>).'
      table: 'ps-data-table columns: Project (mono, sticky), Replayed (.num), Stricter (.num with deny glyph), Looser (.num with warn glyph), Unchanged (.num), Largest flip (text, for example "warn to deny on git.push in test"). Sorted by Stricter plus Looser descending. A total row at the bottom (tfoot) in weight-medium.'
    states:
      loading: 'Header line "Replaying 14 days of judgments"; skeleton rows; the tray summary says "Calculating blast radius".'
      empty: 'No judgment rows in 14 days: "No judgments in the last 14 days to replay." (not an error).'
      zero_flips: 'Table renders with zeros; header line adds "Nothing would flip."'
      error: ps-state error inside the tray.
    acceptance:
      - 'Totals equal the sum of rows; numbers end-aligned with tabular numerals.'
  pipeline:
    route: '#/pipeline'
    density: dense
    data_needs: 'Per project: main, test, stable refs (short sha) and policy digests, unpromoted policy (main digest differs from test, test differs from stable), package drift, doctor findings by severity, active freezes, gate status for the next promotion. Expected GET /api/v1/pipeline.'
    regions:
      header: 'h1 "Pipeline"; right: ps-select "Show: All projects" (All, Unpromoted, Frozen, Failing gates).'
      table: 'ps-data-table columns: Project (mono, sticky, 160), dev main (144), test (144), prod stable (144), Drift (96), Doctor (120), Freezes (88), Gate to test (120). Env cells: line 1 short sha mono text-xs and policy digest ps-digest; line 2 a tag "policy ahead" in warn when this env''s digest differs from the next env down the track, or "in step" text-faint. Rows here are 44 high, a recorded departure from 28 because each env cell carries two facts. Doctor: three .num counts with error, warning, info glyphs. Freezes: count plus lock glyph when active. Gate: chip passing or failing.'
      expanded_row: 'Two command blocks side by side (grid 1fr 1fr, gap var(--space-3); stacked below 768): left ps-command "polispec promote <repo> --to test" (anyone, "Run in a terminal. The gate decides."), right ps-command operator "polispec promote <repo> --to stable" and "polispec deploy <repo> stable" ("Operator only. Run in a terminal."). Below them, the doctor findings list and the gate requirements (rows 24).'
    states:
      loading: skeleton rows of 44.
      empty: 'No live projects: ps-state empty_first_run "No live projects yet. Projects in onboarding have no pipeline."'
      error: ps-state error.
      partial: 'A project whose refs did not resolve shows "Refs unavailable" across its env cells with the reason in a tooltip, other rows normal.'
      overflow: '60 projects: virtualized; at 375 the table scrolls in its region with Project sticky.'
    symmetry: 'The three env columns share one width; the two command blocks are equal halves.'
    acceptance:
      - 'No button with text promote or deploy exists; both commands copy exactly with the right repo name.'
  history:
    route: '#/history/<kind>/<id>'
    density: dense
    data_needs: 'The rulebook''s git history (commits with sha, date, author, subject) and release tags; a semantic diff between two refs: rules, gates, freezes, and modules added, removed, or changed, each classified tighten or loosen. Expected GET /api/v1/rulebooks/<kind>/<id>/history and GET .../diff?from=&to=.'
    regions:
      header: 'h1 "History of <rulebook>"; right: ps-select rulebook switcher.'
      scrubber: 'ps-scrubber full width of main; under it the two read-outs and two ref pickers mirrored left (A, from) and right (B, to).'
      summary: 'One row: counts as chips "Tightens <n>", "Loosens <m>", "Neutral <k>" (classification chips with counts).'
      diff: 'Grouped by kind in strata-like order (Modules, Rules, Gates, Freezes): group header row 24 text-xs weight-medium with its count; each change row 28: change kind tag (Added, Removed, Changed), id mono, classification chip, one-line summary; expandable to a before and after pair (grid 1fr 1fr, mono text-xs, removed lines on var(--diff-del-bg) with a minus gutter, added on var(--diff-add-bg) with a plus gutter; gutters carry the sign so color is not alone).'
    states:
      loading: 'Track renders with skeleton ticks; diff skeleton rows.'
      single_commit: 'History has one commit: scrubber shows one tick and the message "Only one version so far."; no diff.'
      same_ref: 'A equals B: "Pick two different versions to compare."'
      error: ps-state error.
      overflow: '2000 commits: track scrolls inside its region; tag labels thin out.'
    symmetry: 'Read-outs and ref pickers mirrored about the main axis; before and after panes equal halves.'
    acceptance:
      - 'Keyboard-only scrub between two tags and Enter shows the diff; aria-valuetext reads ref, tag, and date.'
  heatmap:
    route: '#/heatmap'
    density: dense
    data_needs: 'Rule hit counts per project and env in a window, rules that never fired in the window, and NO-RULE counts per project and env. Expected GET /api/v1/heatmap?window=.'
    regions:
      header: 'h1 "Heatmap"; right: ps-segmented 7 days | 14 days | 30 days; ps-combobox multi "Projects" filter.'
      legend: 'One row text-xs: "Hits per rule" then five swatches 16x12 labelled with their bucket bounds (.num), then the dead swatch labelled "Never fired". Buckets are quantiles of non-zero counts in the window so the ramp uses all five steps; bounds are shown.'
      grid: 'A real <table>. Column groups per project (<colgroup>, group header th with the project id spanning three columns), each with dev | test | prod sub-headers. Rows: a pinned first body row "NO-RULE" (row header mono, weight-medium, with a warn glyph), then rules sorted by total hits descending. Row header: rule id mono (sticky, 200) plus layer tag. Cells: 40 wide, var(--row-compact) tall, background var(--heat-n), the count in .num text-2xs centered in var(--heat-ink-n); zero hits render empty with var(--surface); a cell is a button only when it opens something.'
      dead_rules: 'Below the grid, a section h2 "Never fired in <window>" with a ps-data-table: Rule (mono), Layer, Projects it applies to (.num), Last fired (date or "never recorded"), Age (since the rule was added). Its rows use the dead pattern in a 12px leading swatch.'
    interactions: 'Hovering or focusing a cell shows a tooltip "<rule> in <project> <env>: <n> hits in <window>". Activating a NO-RULE cell opens the manager on that project with a draft rule stub for the top uncovered action class in that cell (#/manager/project/<id>?draft=no-rule&env=<env>&action=<class>), and the toast "Draft rule opened in the manager".'
    states:
      loading: 'Grid skeleton: 10 rows by the project columns.'
      empty: 'No judgments in the window: ps-state empty_first_run "No judgments in the last <window>." Dead rules still list every rule as never fired, with a note that the window is empty.'
      error: ps-state error.
      overflow: '60 projects (180 columns) and 300 rules: the table scrolls in its region both ways with the row header column and both header rows sticky; virtualized rows.'
    a11y: 'Every cell has its number as text (not color alone); the table is navigable as a table; the heat color is a redundant cue.'
    symmetry: 'Three env columns per project equal; the legend swatches equal width and centered on the legend axis.'
    acceptance:
      - 'Heat ink contrast at every step measured from computed styles in all six themes meets 4.5:1 (expected values in tokens.contrast_evidence).'
      - 'NO-RULE cell opens the manager with the stub.'
  badges:
    route: '#/manifest/<id>/badges (tab of Manifest)'
    density: dense
    data_needs: 'Badge SVG URL and embed card HTML per app from its manifest.'
    badge_visual:
      size: 'Height 20, two segments: left "polispec" on #3a3f47, right the status (live, onboarding, retired) plus the dev verdict summary ("live, 0 deny 24h") on the status color: live #1d7442, onboarding #2456c9, retired #5f6672. Text #ffffff, font 11px Verdana, DejaVu Sans, sans-serif with text measured per segment plus 6px padding each side; radius 3; no gradient.'
      note: 'The badge is an external artifact viewed on other sites, so its colors are fixed literals inside the SVG (allowed: an SVG asset with no theme intent). White on each segment measures at least 5.2:1 (the segment colors reuse measured neutral-light tokens).'
    regions:
      preview: 'Two preview tiles side by side (1fr 1fr), one on a light sample surface and one on a dark sample, each showing the badge and the embed card, labelled "On a light page" and "On a dark page". The sample colors are the app tokens sample-light (#ffffff) and sample-dark (#0d1117), identical in every theme.'
      snippets: 'ps-tabs Markdown | HTML | URL, each a ps-command (anyone) with the snippet and a Copy button.'
    states:
      no_manifest: 'ps-state empty_first_run "No manifest written yet." with ps-command "polispec manifest --write".'
  explainer:
    route: '#/explain'
    density: 'dense for input and rule card; regular for the reason and way-forward prose (reading-first text)'
    data_needs: 'POST /api/v1/explain-text with pasted deny or warn text or a judgment id: rule id, layer, verdict, description, the way forward, and drafts (exception YAML, allow-once request).'
    regions:
      input: 'ps-textarea mono "Paste a deny or warn message, or a judgment id" (4 rows) and "Explain" primary.'
      result: 'At 1024 and up grid 1fr 1fr gap var(--space-3); stacked below. Left "Rule" panel: verdict chip, rule id mono text-sm, layer tag, the rule description (text-md, max-width var(--measure)), source location. Right "Way forward" panel: the legitimate way forward as prose text-md; then ps-tabs Draft exception | Allow-once request. Draft exception: read-only CodeMirror of the YAML and a button "Open in manager" (opens the exceptions file draft). Allow-once request: ps-command operator "polispec allow-once <id>" with "Operator only. Run in a terminal."'
    states:
      idle: 'Result area empty with one line text-dim: "Paste the text an agent saw, for example a line starting with POLISPEC."'
      no_match: 'Text did not name a known rule or judgment: "No rule or judgment found in this text." plus the parsed tokens it tried.'
      error: ps-state error.
    symmetry: 'Rule and Way forward panels equal halves with matched header rows.'
  gallery:
    route: '#/gallery'
    density: dense
    data_needs: 'Packages, shelf modules, and example policies with name, kind, summary, description, params schema, and the projects already using each. GET /api/v1/catalog.'
    regions:
      header: 'h1 "Gallery"; right: ps-segmented All | Packages | Modules | Examples; ps-text-field search 28 (width 240).'
      grid: 'Container query on the view body. Columns: 1 below 560px, then as many 240px-minimum tracks as fit (grid-template-columns repeat(auto-fill, minmax(240px, 1fr)), gap var(--space-3)). At 1024 (body 792) that is exactly 3 tracks of 256; at 1600 with no side panel (body 1368) exactly 5 tracks of 264. Recorded asymmetry: the last row is short when the item count is not a multiple of the column count; it stays start-aligned so cards keep their column positions.'
      card: 'ps-card, fixed height 132: row 1 name text-sm weight-strong plus kind tag right; row 2 summary text-xs text-dim one line; rows 3 to 5 description text-xs line-clamp 3; footer: "<n> params" and "Used by <n>" as .num text-xs, mirrored to start and end edges.'
      drawer: 'Activating a card opens a ps-drawer end (width var(--panel-w); full-screen below 768): description in full, param form (same field rules as manager compose), target ps-select (which project or the shelf), then actions "Preview on map" (secondary, opens #/map?preview=<draft>) and "Plan" (primary, opens the plan sheet).'
    states:
      loading: 6 skeleton cards in the grid.
      empty_filtered: 'No items match: ps-state empty_filtered with Clear filters.'
      error: ps-state error.
    acceptance:
      - 'Track widths at 1024 and 1600 match the stated values to 1px with the nav open and the side panel closed.'
  sessions:
    route: '#/sessions'
    density: dense
    data_needs: 'polispec.session/v1 records in the active window joined with their latest judgment: session id, harness, agent type, start, last call, runtime version, policy digest per project, epoch, injected text digest, launcher; derived badges current, pending, reload needed, stale briefing, untrusted hook. GET /api/v1/sessions?window= plus live updates from SSE.'
    regions:
      header: 'h1 "Sessions"; right: ps-select Window (1 hour default, 6 hours, 24 hours), ps-segmented All | Current | Pending | Needs reload | Stale | Untrusted (collapses to a ps-select below 1024), ps-select Harness.'
      summary_line: 'text-sm: "<n> active sessions. <c> crossed over to epoch <digest>, <p> pending, <r> need /reload-plugins."'
      table: 'ps-data-table columns: Session (mono middle-truncated to 12, sticky), Harness (96), Agent (120), Started (relative, title absolute, 96), Last call (96), Runtime (mono 88), Epoch (ps-digest 96), Projects (".num current of total", 96), Status (session chips, flex). Expandable row: per-project table (Project mono, Policy digest seen, Current digest, In step chip) and, for reload needed, ps-command "/reload-plugins" with "Run in that Claude Code session."'
    states:
      loading: skeleton rows.
      empty: 'No session in the window: "No agent sessions in the last <window>." (empty_cleared tone).'
      live_update: 'New sessions insert at the top without moving the keyboard focus; the summary line updates; announcement only when a session becomes untrusted ("Codex session <id> has an untrusted hook").'
      error: ps-state error.
      overflow: '200 sessions: virtualized.'
  timeline:
    route: '#/timeline'
    density: dense
    data_needs: 'polispec.change/v1 records with effects and per-change crossed, pending, and flagged session counts. GET /api/v1/changes?since=.'
    regions:
      table: 'ps-data-table with day group header rows (row 24, sticky under the column header, text-xs weight-medium, "Tuesday 20 October 2026"): Time (mono tabular 64), Kind (tag 120), Actor (120), Subject (mono plan id, entry id, or tag, flex), Effects (effect chips, 240), Crossed (".num c of n", 88, end), Epoch (ps-digest before, arrow, ps-digest after, 176).'
      drawer: 'Row activation opens a ps-drawer: the change record fields as a two-column key-value list, three lists Crossed, Pending, Flagged (sessions with their badges), and ps-command "polispec changes await <id>" (anyone).'
    states:
      loading: skeleton rows.
      empty: 'No change records yet: "No changes recorded. Changes appear here after a plan applies, a promotion, or a settings change."'
      error: ps-state error.
      overflow: virtualized; day headers stay sticky.
  exception_detail:
    route: '#/exceptions (tabs Exceptions | Proposals inbox) and #/exceptions/<aex id>'
    density: dense
    data_needs: 'exceptions.yml entries with use stats (first and last use, hit count, sessions) and the proposals inbox; add, promote, and remove relayed through the delegate runner with the phrase it asks for. GET /api/v1/exceptions, GET /api/v1/exceptions/proposals, POST /api/v1/exceptions/<verb>.'
    regions:
      exceptions_tab: 'ps-data-table: Exception (mono aex_ id, sticky), Scope (tag), Command glob (mono flex, middle truncation), Added by (120), First use (96), Last use (96), Hits (.num 72), Sessions (.num 72). Header action "Add exception" (secondary) opens the add dialog.'
      detail: 'At 1440 and up the selected exception opens in the side panel; below, at its own route. Content: a key-value list (labels text-xs text-dim in a 120px column, values start-aligned on one shared edge): Scope, Command glob (mono, wraps), Added by, Added at, First use, Last use, Hits, then a table of sessions that used it (Session mono, Harness, Last use, Hits). Action "Remove" (danger) opens the phrase confirm.'
      inbox_tab: 'ps-data-table: Proposal (mono), Proposed by, Command glob (mono), Reason (flex), Age (96), and a row action "Promote" (secondary 24). Tab label shows the count.'
      phrase_flow: 'Add, Promote, and Remove open ps-dialog md with a summary of what changes, then request the phrase from the delegate runner and render ps-confirm with the phrase; submit relays the typed text. States: requesting phrase (busy), waiting for confirmation, confirmed (toast plus the change record id), refused (inline code and message under the field), timed out (inline, Retry restarts the request).'
    states:
      empty_exceptions: '"No exceptions. Every call is judged by the composed rules." (empty_cleared).'
      empty_inbox: '"No proposals waiting." (empty_cleared).'
      loading: skeleton rows.
      error: ps-state error.
  plan_banner:
    element: ps-plan-sheet
    opens_from: [manager Plan, manager Move, outline reorder, gallery Plan, register, status flip on a map card or manifest, ledger changes]
    density: dense
    data_needs: 'The plan: id, classification, files changed, ledger effect, composed policy diff, probes whose verdict changes, journal replay, effect classes with counts of active sessions reached by class, and whether it is operator-only. Apply result: commit, change record id, epoch after.'
    dialog: ps-dialog lg (full-screen below 768)
    regions:
      header: 'h2 "Plan" then the plan id as ps-digest showing the full id (mono text-sm, copy on activate), the classification chip, and right the close icon button.'
      banner: 'The plan banner: grid repeat(4, minmax(0, 1fr)), gap var(--space-2); 2 by 2 below 768. One cell per effect class in this order: Next call, New session, After /reload-plugins, After trust review. Each cell padding var(--space-2) var(--space-3), box-shadow inset 0 0 0 1px var(--border), radius var(--radius): effect glyph 16 plus label text-xs text-dim on line 1, the number of active sessions reached in text-num weight-strong .num on line 2, and on line 3 text-2xs text-dim what it means ("on their next tool call", "only in sessions started after apply", "after /reload-plugins in each", "after the person reviews the hook"). A class the plan does not touch shows its number in var(--text-faint) and line 3 "Not affected". Below the cells, one line text-xs: "Reaches <n> of <m> active sessions on their next call."'
      tabs: 'ps-tabs Policy diff | Files (n) | Probes (n) | Journal replay | Ledger effect. Policy diff: unified diff, mono text-xs/16, line number gutters (.num), sign gutter, add and del backgrounds; long lines wrap within the pane. Files: table Path (mono), Change (Added, Modified, Removed), Lines (plus a, minus b as .num with signs). Probes: table Probe (mono), Env, Before (verdict chip), After (verdict chip), Change (stricter or looser text). Journal replay: summary line and table as in blast radius. Ledger effect: key-value list of the entry before and after.'
      footer: 'Sticky at the bottom of the dialog, border-top 1px var(--border), padding var(--space-2) var(--space-3), grid 1fr auto. Left: one sentence naming why the footer looks the way it does ("Tightening plan. Applies on one click." or "Loosening plan. Type the plan id to apply." or "Operator-only action. Run the command in a terminal."). Right: either "Apply plan" (primary 32), or ps-confirm plus "Apply plan" (disabled until the id matches), or ps-command operator with no apply button. The typed confirm applies to loosening, mixed, global, move, and ledger plans; tightening and neutral project plans apply on one click.'
    apply_states:
      idle: as above.
      applying: '"Applying" busy button, confirm field readonly, Esc disabled, elapsed counter after 2 s.'
      success: 'Body replaced by a result panel: ok glyph and "Applied." then key-value rows Commit (ps-digest), Change record (mono), Epoch (before, arrow, after), and the banner cells now reading "Crossed <c> of <n>" live from SSE; follow-up commands as ps-command (promote to test after a project deploy; /reload-plugins when reload is in the effects); actions "Open timeline" and "Close".'
      stale: '409 stale plan id: ps-banner danger in the footer "This plan is out of date. Something changed after it was made." with "Plan again" (primary), which re-plans the same draft and replaces the sheet content; the typed field clears.'
      invalid: '422: the findings list replaces the diff tab content; Apply stays disabled.'
      error: 'Inline under the footer with the error id and Retry; the plan stays open.'
      rate_limited: 'Footer message "Too many changes in a minute. Try again in <n> s." with the Apply button disabled and a countdown.'
    keyboard: 'Mod Enter applies when allowed; Esc closes when not busy; focus starts on the close button for one-click plans and on the confirm field for typed plans.'
    symmetry: 'Four equal banner cells; header title group and close button on mirrored edges; footer reason and action on mirrored edges.'
    acceptance:
      - 'A tightening project plan shows Apply plan enabled; a loosening one shows the confirm field and the button disabled until the exact id is typed; a pause or seal action shows only a ps-command.'
      - 'Banner cells compute equal widths to 0.5px at 375 (2 by 2), 1024, and 1600.'
      - 'After success, the crossed counts update from SSE without a reload.'
  feed:
    route: '#/feed'
    density: dense
    data_needs: 'SSE judgment events (id, ts, session, harness, project, env, tool, verdict, rule id).'
    regions:
      toolbar: 'One row of 28px controls: ps-combobox multi filters Session, Project, Rule; ps-segmented verdict filter All | Allow | Warn | Deny; ps-toggle "Pause"; ps-toggle "Announce denies" (off by default); ps-conn-status 24 at the end.'
      table: 'ps-data-table compact (row 24): Time (mono tabular hh:mm:ss, 72), Session (mono middle-truncated, 112), Project (mono 120), Env (tag 48), Tool (mono flex), Verdict (chip 80), Rule (mono 160). Newest at the top. Rows link to #/explain?judgment=<id>.'
      follow: 'Auto-follow while scrolled to the top. When the person scrolls away or Pause is on, new rows queue and a button pill "<n> new judgments" appears at the top center of the table region; activating it scrolls to the top and resumes.'
      buffer: 'At most 1000 rows in the DOM (virtualized); when older rows drop, a final row reads "Older judgments are not kept here. Open Timeline or Heatmap for history."'
    states:
      connecting: 'Empty table with "Connecting to the judgment stream".'
      live_empty: '"Waiting for the next judgment." (empty_cleared tone).'
      reconnecting: 'ps-banner warn "Reconnecting in <n> s. Judgments made meanwhile are fetched when the stream returns." Existing rows stay.'
      disabled: 'config feed.enabled false: ps-state disabled.'
      error: 'Stream closed by the server: ps-banner danger with Retry.'
    a11y: 'The table is not a live region. With Announce denies on, each deny is announced politely as "Deny: <tool> in <project> <env> by <rule>", at most one announcement per 2 s (excess summarized as "<n> more denies").'
    motion: 'New rows appear without animation (high frequency).'
  author_panel:
    element: ps-author-panel inside ps-side-panel (and as the Author tab in the manager right panel)
    density: 'dense chrome; regular for message text (text-md)'
    data_needs: 'Author sessions (max 3 per host): open, send a turn with intent and context, stream deltas (text deltas, can_use_tool requests with polispec''s answer, the final draft with yaml, rationale, adapter, session, and its validation and plan classification), stop, close. Config author.enabled and the kill-switch reason. Roster role spec-author values (harness, model, effort). Expected endpoints under /api/v1/author with SSE for the stream (reconcile with openapi.yml).'
    regions:
      header: 'Row 1 (28): session tabs (ps-tabs, up to 3, labels "Draft 1", "Draft 2", "Draft 3"; a plus icon button "New draft session" disabled at 3 with tooltip "At most 3 author sessions. Close one first."), close icon button for the panel. Row 2 (24): tags harness, model, effort (mono text-2xs) and right-aligned session state text-xs: Ready, Thinking, Streaming <n> s, Waiting, Closing in <m> min (shown under 2 min of the 15-minute idle limit).'
      thread: 'role log, aria-label "Author conversation", aria-live off while a turn streams (announce.js says "Draft complete" or the error when the turn ends). Messages stack with gap var(--space-3). Person turns: background var(--surface-2), padding var(--space-2) var(--space-3), radius var(--radius), text-md. Assistant turns: no background, text-md, max-width 100% of the panel, rendered progressively (paragraphs, lists, inline code, fenced code in mono text-xs on var(--surface-2)). While streaming, a static block caret (a 0.6em by 1em var(--accent) block after the last character, no blink).'
      approvals: 'Each can_use_tool request renders inline in order as a trace row (28): tool name mono, target path mono (middle truncation, full in tooltip), then a chip "Allowed by polispec" (allow glyph) or "Denied by polispec" (deny glyph), and duration. Expandable (aria-expanded) to show the request arguments as mono JSON and the reason. Expanded state persists for the session. Never hidden by default.'
      draft_card: 'When a draft arrives: a ps-card (one standalone result) with "Draft for <target>" text-sm weight-medium, validation chip, plan classification chip, the rationale (text-md, clamp 4 with "Show more"), and actions "Open in editor" (secondary, loads the YAML into the manager draft) and "Review plan" (primary, opens the plan sheet).'
      composer: 'Sticky at the panel bottom, border-top 1px var(--border), padding var(--space-2): ps-textarea "Describe the change" (2 to 8 rows), then a row with ps-select Target (rulebook kind and id, defaults to the manager''s open rulebook) left and "Send" (primary 28, Mod Enter) right; while streaming, Send becomes "Stop" (secondary, Esc in the panel also stops).'
    scroll: 'Follows the tail while the person is at the bottom; scrolling up pauses following and shows "Jump to latest" (button pill 24) at the bottom center of the thread; sending scrolls to the bottom.'
    states:
      disabled: 'author.enabled off or POLISPEC_AUTHOR=off: ps-state disabled "The author is turned off" with the reason and ps-command "polispec settings set polispec.author.enabled on" ("Run in a terminal.").'
      edition_excluded: 'Not reachable (web refuses to start under lock); no UI.'
      thinking: 'After send, the assistant turn shell appears within 100 ms with "Thinking" and the elapsed seconds; after 10 s the line adds "The first event can take up to 30 s."'
      retrying: 'Process exited before its first event: "Restarting the session (attempt <n> of 2)".'
      rate_limited: 'Composer disabled with "10 turns a minute per host. Try again in <n> s." and a countdown.'
      timeout: 'Turn exceeded 180 s: error block in the thread "This turn took longer than 3 minutes and was stopped." with "Retry" (same prompt, replaces) and "Copy details".'
      session_closed_idle: 'A line in the thread "Session closed after 15 minutes idle." and the composer shows "Start a new session" (primary), which resumes with --resume when the server still holds it, otherwise starts fresh.'
      refused_description: 'When description.allowed is false and the draft would add a description, the draft card shows ps-banner warn "Not added: readers of this rulebook run polispec older than 0.34.0."'
      error: 'Specific cause, error id, Retry, Copy details; never a toast alone.'
    acceptance:
      - 'Stop is reachable and works within 1 s during a stream; the thread does not auto-scroll while the person reads earlier content.'
      - 'Every approval the session asked for appears as a trace row with polispec''s answer.'
  manifest:
    route: '#/manifest (host index), #/manifest/<id> (App tab), #/manifest/<id>/badges'
    density: dense
    data_needs: 'polispec.manifest/v1 for an entry, its authored polispec.app.yml text and validation, polispec.index/v1 for the current user, and published indexes of other users. GET /api/v1/manifest/<id>, GET /api/v1/manifest/index.'
    regions:
      header: 'h1 "Manifest"; entry picker ps-select (searchable); ps-tabs App | Host index | Badges.'
      app_tab: 'At 1024 and up grid 1fr 1fr gap var(--space-3), each pane with an h2 row: left "Generated" (tag polispec.manifest/v1, read-only), right "Authored" (tag polispec.app/v1, validation chip). Generated pane sections as key-value lists and small tables: Identity (id, kind, owner, status, edition, enforce mode), Environments (ps-env-lanes with ref, policy digest, last promotion date), Layer chain (strata list with module instances and packages), Roster roles (table role, harness, model, effort), Doctor findings (counts by severity, then rows). Authored pane: read-only CodeMirror of polispec.app.yml, then its validation findings table; "It grants nothing and is never read by the guard." as a text-xs text-dim line under the h2. Below 1024 the panes stack, Generated first.'
      host_index_tab: 'Table of the current user''s entries: Entry (mono), Kind, Owner, Status chip, Description (flex, truncate). Then h2 "Published by other users" with one collapsible group per user (read-only, same columns). Header ps-command "polispec manifest index --publish" with "Run in a terminal to publish your index for other users."'
    states:
      no_authored: 'Authored pane ps-state empty_first_run "No polispec.app.yml at <root>." with a copyable starter snippet (ps-command style block, anyone).'
      invalid_authored: 'Findings listed; the generated pane is unaffected.'
      owner_unknown: 'Entries written before 0.34.0 show Owner "unknown" in text-faint.'
      no_other_indexes: '"No other users have published an index on this host."'
    symmetry: 'Generated and Authored are equal halves with matched h2 rows on one baseline.'
  register:
    route: '#/register'
    density: 'dense form; regular for the explanatory lines under each section heading'
    data_needs: 'polispec register --dry-run equivalent: validates path (not inside a ledgered repo), kind, id availability, description lint, starter policy; returns the ledger plan. Then plan ledger and apply ledger. Owner defaults from the server (uid, name).'
    layout: 'At 1024 and up grid 1fr 1fr gap var(--space-4): left the form (sections stacked, gap var(--space-5) between sections, var(--space-3) between fields), right a sticky "Ledger entry preview" pane (read-only CodeMirror YAML of the path entry as it would be written, updating as fields change, plus the description lint line). Below 1024 the preview follows the form.'
    sections:
      path_and_kind: 'h2 "Path and kind". ps-text-field mono "Path" (32, help "A directory, installed software, or your home directory for system scope."); ps-segmented Software | Directory | System (System fills the path with the home directory and makes it read-only). Errors: inside_ledgered_repo ("This path is inside <repo>, which polispec already governs. Its policy lives in that repo.") and not_found.'
      identity: 'h2 "Identity". ps-text-field mono "Id" (pattern ^[a-z0-9][a-z0-9-]{0,40}$, live availability check after 600 ms: "Available" with ok glyph or "Taken by <entry>"); Owner (read-only, prefilled "<name> (uid <uid>)"); Registered by (read-only).'
      description: 'h2 "Description". ps-textarea (4 to 10 rows) with the live lint line under it ("<s> sentences, <w> words") and finding rows with their codes; disabled with reason when description.allowed is false.'
      policy: 'h2 "Starter policy". ps-segmented None | From the gallery | Ask the author. Gallery: ps-select of shelf modules and examples with its param form. Author: opens the author panel with the intent prefilled from the description.'
      review: 'h2 "Review". "Check" (secondary) runs the dry run and renders its findings and the plan summary (classification Tightening for a new onboarding entry). "Register" (primary) opens the plan sheet; an onboarding entry is one click. A later status flip (onboarding to live) is offered from the entry''s map card menu and the manifest as "Make live", which plans the ledger change and needs the typed plan id.'
    states:
      loading_check: '"Check" busy as "Checking".'
      error: 'Field errors inline; dry-run errors as a findings table above the Register button.'
      restricted_lock: 'Not reachable (web excluded under lock).'
    symmetry: 'Form and preview equal halves with section headings on one left edge; fields share one label edge and one field edge.'
    acceptance:
      - 'Registering a scratch directory end to end against a scratch ledger produces an onboarding path entry identical to the preview YAML.'

slices:
  F0-foundation:
    owns_paths: [web/public/index.html, web/public/css/app.css, web/public/css/reset.css, web/public/css/tokens.css, web/public/css/themes.css, web/public/css/base.css, web/public/js/boot/theme-boot.js, web/public/js/core/theme.js, web/public/icons/icons.svg]
    builds: 'Token and theme layer exactly as tokens and theme_system specify (six themes, app-owned per-theme tokens, apple-noir flourishes), the boot script, the sprite with every icon in icons.set and the six theme glyphs, base styles, the reduced-motion block, and an index.html that renders a token specimen route #/specimen (type scale, controls placeholders, verdict glyphs, heat ramp, surfaces) used during review.'
    acceptance: ['Specimen renders in all six choices with no literal color outside tokens.css and themes.css (grep for #, rgb(, hsl( in css/components and css/views returns nothing).', 'theme-boot sets data-theme before first paint (no flash when reloading in tronwave with a light OS).']
  F1-data-layer:
    depends_on: [F0-foundation]
    owns_paths: [web/public/js/app.js, web/public/js/core/api.js, web/public/js/core/session.js, web/public/js/core/sse.js, web/public/js/core/cache.js, web/public/js/core/router.js, web/public/js/core/store.js, web/public/js/core/announce.js, web/public/js/core/format.js, web/public/js/core/keys.js, web/public/js/core/errors.js]
    builds: data_layer in full, reconciled against web/public/openapi.yml.
    acceptance: ['The #k= code disappears from the address bar and history after boot in every outcome.', 'A GET to a stopped server retries at most twice with jitter, then shows the offline banner; mutations never retry.', 'Storage disabled (private window with storage blocked): the app boots and renders with system theme.']
  F2-primitives:
    depends_on: [F0-foundation]
    owns_paths: ['web/public/js/components/ps-{button,icon-button,text-field,textarea,select,combobox,toggle,segmented,tabs,dialog,drawer,tooltip,chip,digest,command,confirm,scrubber,data-table,state,skeleton,kbd,env-lanes,conn-status,banner,card}.js', 'web/public/css/components/*.css (matching names)']
    builds: Every component in components with all states, keyboard behavior, and accessible names as specified, shown on the specimen route in every state.
    acceptance: ['Every control in a specimen row computes the same height (24, 28, or 32 as declared).', 'Keyboard behavior matches each component''s keyboard entry, checked by hand on the specimen.', 'No native select, checkbox, radio, or range element exists in the DOM (querySelectorAll returns 0).']
  F3-shell:
    depends_on: [F1-data-layer, F2-primitives]
    owns_paths: ['web/public/js/components/ps-{app-shell,topbar,nav,side-panel,plan-tray,palette,toaster,view-boundary,session-gate,theme-switcher}.js', web/public/css/shell.css, 'web/public/css/components/ps-{palette,toaster,theme-switcher}.css', web/public/js/views/not-found.js]
    builds: shell in full, including session gates, offline banner, shortcuts dialog, and the four breakpoint layouts.
    acceptance: ['Top bar center offset from viewport center is 0 to 0.5px at 375, 1024, 1600.', 'Theme switcher cycles all six with Shift going back, and its aria-label names current, next, and previous.', 'An error thrown inside a view renders the boundary while nav keeps working.']
  F4-map-detail:
    depends_on: [F3-shell]
    owns_paths: [web/public/js/views/map.js, web/public/js/views/detail.js, web/public/js/map/layout.js, web/public/js/map/edges.js, web/public/js/map/pan.js, 'web/public/js/components/ps-map*.js', web/public/css/views/map.css, web/public/css/views/detail.css]
    builds: surfaces.map (map mode, list mode, highlight, saved positions, blast overlay) and surfaces.detail.
    acceptance: surfaces.map.acceptance and surfaces.detail.acceptance.
  F5-manager-plan-author:
    depends_on: [F3-shell]
    owns_paths: [web/public/js/views/manager.js, web/public/js/editor/codemirror.js, web/public/vendor/codemirror/, web/public/js/components/ps-plan-sheet.js, web/public/js/components/ps-author-panel.js, web/public/js/views/blast-radius.js, web/public/css/views/manager.css, web/public/css/components/ps-plan-sheet.css, web/public/css/components/ps-author-panel.css]
    builds: surfaces.manager, surfaces.plan_banner, surfaces.blast_radius, surfaces.author_panel, and the CodeMirror token theme.
    acceptance: surfaces.manager.acceptance, surfaces.plan_banner.acceptance, surfaces.blast_radius.acceptance, surfaces.author_panel.acceptance.
  F6-observe:
    depends_on: [F3-shell]
    owns_paths: [web/public/js/views/pipeline.js, web/public/js/views/sessions.js, web/public/js/views/timeline.js, web/public/js/views/feed.js, web/public/js/views/heatmap.js, 'web/public/css/views/{pipeline,sessions,timeline,feed,heatmap}.css']
    builds: surfaces.pipeline, surfaces.sessions, surfaces.timeline, surfaces.feed, surfaces.heatmap.
    acceptance: surfaces.pipeline.acceptance and surfaces.heatmap.acceptance, plus feed follow and pause behavior and the deny announcer rate limit.
  F7-understand:
    depends_on: [F3-shell, F5-manager-plan-author]
    owns_paths: [web/public/js/views/playground.js, web/public/js/views/explain.js, web/public/js/views/history.js, 'web/public/css/views/{playground,explain,history}.css']
    builds: surfaces.playground, surfaces.explainer, surfaces.history.
    acceptance: surfaces.playground.acceptance and surfaces.history.acceptance.
  F8-change-publish:
    depends_on: [F3-shell, F5-manager-plan-author]
    owns_paths: [web/public/js/views/gallery.js, web/public/js/views/exceptions.js, web/public/js/views/manifest.js, web/public/js/views/register.js, 'web/public/css/views/{gallery,exceptions,manifest,register}.css']
    builds: surfaces.gallery, surfaces.exception_detail, surfaces.manifest (with badges tab), surfaces.register.
    acceptance: surfaces.gallery.acceptance and surfaces.register.acceptance, plus the phrase flow states for add, promote, and remove.
  parallelism: 'F0 first. F1 and F2 in parallel after F0. F3 after both. F4, F5, and F6 in parallel after F3. F7 and F8 after F5. One worker per slice in its own worktree off feat/webapp; each slice touches only its owns_paths, and shared files (app.css imports, the router table in js/app.js) are edited only by the slice that owns them, with later slices listing their additions in their report for the owner to merge.'

acceptance:
  protocol: >-
    Chris reviews the rendered app, never the diff alone, as a separate subagent after each slice and once at the end.
    Run this worktree's bin/polispec web against scratch POLISPEC_STATE_HOME, POLISPEC_HOME, POLISPEC_LEDGER, and
    POLISPEC_GLOBAL, open it in a browser, and inspect every route in every theme choice at 375, 1024, and 1600 px with
    empty, typical, and overflowing data. Findings are reported as defect, consequence, and correction with the
    measurement or screenshot that shows it, and worked to zero.
  themes: [system (with OS light), system (with OS dark), light, dark, apple-noir, apple-austere, tronwave]
  widths: [375, 1024, 1600]
  heights: '768 for the first-viewport check at 1024 and 1600; 812 at 375.'
  data_states:
    empty: 'A fresh scratch state home and an empty scratch ledger: no projects, no judgments, no sessions, no changes, no exceptions.'
    typical: 'A scratch ledger with 8 live projects and 2 path entries created through real polispec commands, and about 4000 judgment rows produced by replaying recorded calls through polispec hook pretool against the scratch state.'
    overflowing: '60 ledger entries with 41-character ids and 400-word descriptions, 300 rules in one rulebook, 20000 judgments, 50 sessions, 3 open author sessions, a 3000-line rulebook, and commands with 200-character paths, all produced through real commands against scratch state (no test fixtures).'
  measurements:
    - 'No horizontal page scroll: document.documentElement.scrollWidth equals clientWidth on every route at 375.'
    - 'Computed row heights: data rows 28, compact rows 24, pipeline rows 44 (recorded departure); every control in each toolbar row reports one height.'
    - 'Spacing on scale: every computed gap, padding, and margin in components is one of 0, 4, 8, 12, 16, 24, 32, 48, 64 (or a recorded exception: inherited strip 3px, banner leading edge 3px, focus offset 2px, hairlines 1px).'
    - 'Type on scale: every computed font-size is one of 11, 12, 13, 14, 16, 18, 20.'
    - 'Numeric cells: text-align end and font-variant-numeric including tabular-nums; header edges match their column content edges to 0.5px.'
    - 'Contrast from computed styles for text, text-dim, text-faint, verdict text, chip labels, heat ink, control borders, and focus rings in every theme, against the surface each sits on; must meet the tokens.contrast_evidence values to within 0.05.'
    - 'Target size: every interactive element has a hit area of at least 24 x 24 (bounding box or pseudo-element).'
    - 'Focus: every interactive element shows a visible ring on keyboard focus, and no focused element is hidden under the sticky header, the plan tray, or a toast (SC 2.4.11).'
    - 'Symmetry offsets: top bar center element, map band chip rows and grid rows, env lanes, plan banner cells, segmented controls, split panes (playground, explainer, manifest, register), and gallery tracks; report every unmatched pair over 0.5px.'
    - 'First viewport: at 1024 x 768 and 1600 x 768 the primary table, editor, canvas, or form of each view starts above the fold.'
    - 'Motion: with prefers-reduced-motion reduce, document.getAnimations() is empty after interactions settle; without it, no animation lasts longer than var(--dur-slow) except the 3-iteration map pulse.'
    - 'Operator-only: no button anywhere whose text or accessible name contains promote, deploy, pause, allow-once, seal, or plane.'
    - 'Native controls: querySelectorAll("select, input[type=checkbox], input[type=radio], input[type=range], input[type=date], input[type=color], input[type=file]") is empty on every route.'
    - 'Network: the browser network log shows requests only to the server origin.'
    - 'Copy: no em dash or en dash in any rendered text (document.body.innerText search).'
  screenshots: 'One per route per theme per width per data state where the state differs; the reviewer lists which were taken and never claims a check that did not run.'

open_questions:
  - id: Q1
    for: Sven
    question: 'Does "never use native browser inputs" allow a themed custom element to render a native <input> or <button> inside itself, fully restyled, for focus, IME, autofill, and screen-reader semantics? This spec assumes yes and still forbids native select, checkbox, radio, range, date, color, and file. A strict no would mean contenteditable text fields, which lose IME and autofill behavior.'
  - id: Q2
    for: Sven
    question: 'Directive I.5 fixes one icon button cycling the three canonical themes. app.yml asks for six themes through one switcher. Is a six-step cycle on the one button right (it takes up to five presses to reach a theme, softened by the palette Theme commands), and are the proposed glyphs for system (monitor), light (bulb), and dark (eclipse) acceptable beside the canonical moon, sun, and hex-wave?'
  - id: Q3
    for: Sven
    question: 'fleet.yml makes tronwave the first-visit default for every rStack webapp, while app.yml makes the neutral light and dark pair the default for public users. This spec follows app.yml with system as the first-visit choice. Should polispec be recorded as an exception to fleet.yml, and does "the neutral pair is the default" mean system (follow the OS), or light, or dark?'
  - id: Q4
    for: Sven
    question: 'polispec carries no *.rstack_component.yml, so directive I.4 has no place for its themes manifest blob. Should the blob go into polispec.rplugin.yml, into specs/app.yml web, or nowhere because polispec is a FOSS plugin and not an rStack component?'
  - id: Q5
    for: Sven
    question: 'CodeMirror 6 ships as many ES modules with bare imports. Without a build step, the choices are an inline import map (needs a CSP hash from the server) or a single pre-bundled ES module produced once at vendoring time and committed with its license. Which one counts as "vendored, no build step" for you?'
  - id: Q6
    for: Sven
    question: 'The neutral light and dark pair uses an ink-blue accent (#2456c9 light, #7fa3ff dark). Is a blue accent right for the public face of polispec, or do you want a different hue for its identity?'
decisions:
  decided_by: Sven
  decided_at: "2026-10-20"
  Q1: "Yes. ps-field and ps-button wrap a native text input or button fully restyled by tokens; native select, checkbox, radio, range, date, color and file inputs stay forbidden."
  Q2: "Cycle plus popover list: a click cycles the six themes in order; a long press, right-click or Shift+Enter opens a ps-popover listing all six with their glyphs (monitor, bulb, eclipse for the new three)."
  Q3: "First-visit default is system (neutral light or dark following the OS). polispec is recorded as a fleet.yml exception in specs/app.yml web.themes because it is public FOSS."
  Q4: "The themes manifest lives in specs/app.yml under web.themes."
  Q5: "One pinned pre-bundled CodeMirror 6 ES module with the YAML mode under web/public/vendor/, its license beside it and its sha256 in vendor/VERSIONS.yml; polispec never runs a bundler; a strict CSP with no inline script."
  Q6: "Keep the ink-blue accent (#2456c9 light, #7fa3ff dark)."
