schema: is.v1
metadata:
  name: polispec shipped tool declarations
  slug: unknown-policy
  version: 0.1.0
  created: '2026-10-18'
  status: accepted
  base_commit: 2950ab7
  base_version: 0.31.0
  intended_release: 0.32.0
  contract: specs/app.yml#unknowns
  worker: {harness: claude-code, model: fable, effort: inherit, note: "Fable session implements directly (AGENTS.md Part T.4); the blueprint still comes first"}
  decisions_by_sven:
    - "'Declaration model, like MCP: the shipped module declares what is known; an undeclared tool or opaque line still gets the library edition default (warn standard, deny lock).'"
    - 'The default is a shipped layer composed above global on every host, every rule overridable; nothing is written into the ~/.ai shelf.'
    - 'polispec.relax.dev stays as the kill switch of the in_development predicate.'
    - 'The read tools move too; the fail-open diagnostic set on guard failure stays in the library because no layer is readable then.'
vision:
  problem: >-
    POLISPEC-TOOL-UNKNOWN is library behaviour: which tools are harness-internal (Classify::Benign::INTERNAL_TOOLS), which are
    read tools (Harness::Base::READ_TOOLS, also the shim skip list), the rule that an eval, source or . line asks, and the
    0.30.x development relaxation (HookCommand#dev_projects). Every change took a release (0.28.2, 0.28.3, 0.30.0, 0.30.2).
    MCP operations are not like that: a trusted-layer rule with an exact server and operation declares one, and the operator
    reads, adds and tightens declarations through polispec plan and apply. TODO.md line 11 asks for the same for tools, and
    names modules/mcp-declared.yml as the model; that file is the operator's own shelf module, not something polispec ships,
    and polispec ships no module anywhere today.
  outcome: >-
    polispec ships modules/tool-declared.yml and composes it as the first layer, named shipped, of every chain. Its rules
    declare the harness-internal tools (class tool.internal), the read tools (class tool.read) and the development relaxation
    of opaque shell lines (shape opaque_shell with the in_development predicate), every one overridable. The library keeps
    only detection: a non-shell tool no family classifies yields a tool.internal action, a read tool with no path a tool.read
    action, an eval, source or . line one shell.exec action carrying shape opaque_shell; each is marked unknown_tool and the
    control ceiling lifts the mark when a trusted rule declares it, exactly as for mcp.call. The operator declares another
    tool, tightens one, or narrows the opaque relaxation with ordinary rules in the shelf, and loosens a shipped rule only by
    naming it in overrides, through plan global and apply global. fastpath.tools derives from the declared, ungoverned names.
    Verdicts on this host are unchanged for every call recorded since 0.30.2.
  non_goals:
    - Moving the edition default (warn or deny) out of Guard.evaluate; it stays beside the MCP default.
    - "Any change to the read-only shell command lists (GENERIC_OK, SECRETS_OK, GIT_READ, READ_ONLY_EXEC): they detect, they do not dispose."
    - A new verb. The operator uses plan global and apply global, validate, resolve --layers and explain as they exist.
    - Stamping which rule declared a tool on the judgment record; the row already carries the rule id and verdict.
constraints:
  - Ruby standard library only. Keep the two-line header (shebang, SPDX) every lib file carries.
  - No comments or docstrings in code. No tests (AGENTS.md Part S). Verification is running this worktree's bin/polispec for real against scratch state.
  - Work only in /home/sven/github/foss/.polispec-wt/unknown-policy (branch unknown-policy). Never touch the pinned runtime or the live clone's lib.
  - Every verification run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER and POLISPEC_GLOBAL to scratch paths; never redirect XDG_STATE_HOME.
  - No new rStack dependency; no new setting; no change to the judgment record schema.
  - Back up in place before deleting anything (AGENTS.md Part E); nothing in this change deletes a file.
surfaces:
  code:
    - modules/tool-declared.yml (new, shipped data)
    - lib/polispec/layers.rb (shipped store and layer, chain_for, fingerprint)
    - lib/polispec/commands/hook.rb (judge branches, unknown_action, trusted_declaration, relaxed stamp; dev_projects removed)
    - lib/polispec/harness_controls/evaluate.rb (Guard.evaluate lifts any declared unknown)
    - lib/polispec/classify/benign.rb (INTERNAL_TOOLS removed; benign? is shell-only)
    - lib/polispec/predicates.rb (in_development)
    - lib/polispec/engine.rb (Match tool key compares case-insensitively)
    - lib/polispec/fastpath.rb (skippable from the chain)
  contract:
    - schemas/policy.v1.yml, schemas/module.v1.yml, schemas/global.v1.yml, schemas/control.v1.yml, schemas/ledger.v1.yml (action classes tool.internal, tool.read; shape opaque_shell; match in_development)
    - specs/app.yml (composition, benign, fastpath, unknowns, settings, judgments rows; version)
  doc:
    - docs/schema.md (Layers, the shipped layer), docs/harness-controls.md (Decisions, declarations), docs/operator.md (Projects in development), README.md, CHANGELOG.md, TODO.md
  fleet: []
design:
  shipped_layer:
    file: modules/tool-declared.yml at the repository root, schema polispec.module/v1, name tool-declared
    store: "Layers::Store with shipped: true reads modules/<name>.yml under Polispec::ROOT, loads no global.yml or profiles.yml, origin :shipped"
    includes: "Layers::SHIPPED_INCLUDES = %w[tool-declared]; Layers.shipped_layer(errors) expands them through Shelf.new(nil, shipped_store) and builds Layer name shipped, source shipped:<Polispec.version>, digest over the instance texts"
    position: "Layers.load puts the shipped layer first, before global, repo and children, so the shelf (and a project policy) may name a shipped rule in overrides; check_overrides already requires overridable: true on the upper rule"
    lookup: "Shelf#fetch is unchanged: a shelf or local module never resolves to a shipped module and a shelf module named tool-declared is an ordinary shelf module. Shipped modules compose only through the shipped layer."
    chain_for: "A chain is built whenever the shipped layer exists, so every target (live, baseline, unowned under baseline) has one; the 'fewer than two layers' nil guard stays for the degenerate case"
    fingerprint: "Layers.fingerprint covers the shipped layer digest, so a polispec upgrade changes the baseline target digest and the fast-path key"
    controls_target: "For a target whose policy_source is controls (no shelf, no live project, a plane or controls file governs) the declaration lookup falls back to the shipped layer's rules alone"
  classes_and_shapes:
    tool.internal: "A tool call no classifier family turns into an action and no positive class (web.fetch, agent.spawn) fits; env_hint {path: cwd, tool: name}; raw {unknown_tool: true, tool: name, triggers when exceptions are active}"
    tool.read: "A tool whose name is in Classify::Tool::READ_TOOLS or Harness::Base::READ_TOOLS (case-insensitive) and that produced no action (no path); same hint and raw shape. A read tool with a path keeps producing secrets.read actions and is never unknown."
    opaque_shell: "A Bash line that Classify.opaque_shell? recognises adds one shell.exec action with env_hint {path: cwd, tool: name, shape: [opaque_shell], cwds: Classify.command_cwds} and raw {unknown_tool: true, opaque: true, tool: name, triggers}. The visible commands of the line are classified and judged exactly as before; they are not annotated."
    class_guess: "unknown_action keeps the name heuristic only for web (web.fetch) and agent (agent.spawn) names; every other undeclared non-shell tool is tool.internal, not shell.exec"
  declarations:
    rule: "trusted_declaration(ledger, cwd, baseline, input) returns a lambda over an action: mcp.call as today (exact server and operation); an action with raw opaque true is declared by a rule whose match.shape includes opaque_shell; any other unknown_tool action by a rule whose match.tool equals the tool name case-insensitively. In every case the candidate must satisfy Engine::Match.rule? with the engine context, so a declaring rule may add env, path, class, role or a predicate."
    ceiling: "Guard.evaluate computes unknown = actions with raw unknown_tool minus those the trusted_declaration lambda accepts; the rest is unchanged: exceptions lifter, then POLISPEC-TOOL-UNKNOWN warn (standard) or deny (lock)"
    verdict: "A declared action is also judged by environment policy like any action; the declaring rule's verdict applies through Layers.pick (strictest layer wins), so a shelf deny on a declared tool denies it"
    relaxed_stamp: "The hook records the declaring rule per action; when the opaque action's declaring rule has match.in_development == true the judgment carries relaxed: [{rule: POLISPEC-TOOL-UNKNOWN, reason: development, projects: Ledger#development(cwd)}] as in 0.30.x. No other stamp."
  predicate:
    in_development: "Predicates::NAMES gains in_development. check_in_development: false when Engine::Settings.relax_dev? is false; ledger from ctx[:ledger] or Ledger.load; ids = ledger.development(hint path) or false; for each dir in hint cwds: more = ledger.development(dir); skip when more is nil and ledger.locate(dir) is nil; false when more is nil; ids |= more. Result note 'in development: <ids>'. This is HookCommand#dev_projects moved verbatim; dev_projects, @dev_projects and the three judge branches that read it are removed."
  match:
    tool: "Engine::Match#extensions_ok? compares the tool key with casecmp? so shelf rules match the harness spelling (TodoWrite, Grep) and the lowercase lists alike; every other key is unchanged"
  shipped_rules:
    internal: "One rule per name, id TOOL-<NAME> (underscores become hyphens), match {tool: <name as the harness sends it>, class: [tool.internal]}, verdict allow, overridable true, reason 'harness-internal tool': TodoWrite TodoRead Skill ToolSearch AskUserQuestion EnterPlanMode ExitPlanMode TaskOutput TaskList TaskGet TaskCreate TaskUpdate TaskStop ListAgents SendMessage SubagentHandback StructuredOutput ScheduleWakeup Glob LS update_plan"
    read: "id TOOL-READ-<NAME>, match {tool, class: [tool.read]}, verdict allow, overridable true: Read NotebookRead read_file view grep search_file_content read_many_files view_image"
    opaque: "id TOOL-OPAQUE-DEVELOPMENT, match {shape: [opaque_shell], in_development: true}, verdict allow, overridable true, reason 'an eval, source or . line in a project in development: every ledger project containing the directory is onboarding, and every command of the line runs in development or in no ledger project'"
  fastpath:
    skippable: "['*'] without a baseline as today. Otherwise: names of shipped rules whose class is tool.internal or tool.read and whose verdict is allow; minus every name a global-layer rule names in match.tool (any verdict), minus every name when a global-layer rule has neither class nor shape; the tool.read names are also removed when reads_governed? (a global or module rule with class secrets.read or naming a read tool) holds, as today. Downcased, unique. Harness::Base::READ_TOOLS and INTERNAL_TOOLS are no longer read here."
    key: "unchanged in code; Layers.fingerprint now carries the shipped digest"
  library_keeps:
    - "Harness::Base::READ_TOOLS: hard_deny and diagnostic_input? (positive diagnostic reads on guard failure), and Harness adapters"
    - "Classify::Tool::READ_TOOLS, WRITE_TOOLS and the shell read-only lists: detection"
    - "Classify::Benign.benign? for shell lines, parsed_shell?, opaque_shell?, opaque_commands, command_cwds, positive"
    - "Ledger#development, Engine::Settings.relax_dev?, the polispec.relax.dev setting"
    - "Guard.evaluate's edition default and the POLISPEC-TOOL-UNKNOWN code"
slices:
  - id: data
    owns_paths: [modules/tool-declared.yml]
    deliverable: the shipped module, valid against polispec.module/v1 once the schema slice lands
    acceptance: bin/polispec validate module modules/tool-declared.yml prints ok
  - id: schemas
    owns_paths: [schemas/policy.v1.yml, schemas/module.v1.yml, schemas/global.v1.yml, schemas/control.v1.yml, schemas/ledger.v1.yml]
    deliverable: action_class enums gain tool.internal and tool.read; shape enums gain opaque_shell; policy, module and global match gain in_development boolean
    acceptance: every existing fixture under examples/ and smoke/ still validates; the shipped module validates
  - id: layers
    owns_paths: [lib/polispec/layers.rb]
    depends_on: [data, schemas]
    deliverable: shipped store, SHIPPED_INCLUDES, shipped_layer, load puts it first, chain_for builds for every target, fingerprint covers it, Layers.shipped_rules for the controls fallback
    acceptance: resolve <path> --layers prints a first row 'shipped  shipped:0.32.0  sha256:...  rules=30' for a ledgered path and for an unowned path under a baseline; resolve --layers --json effective_digest changes when modules/tool-declared.yml changes
  - id: classify
    owns_paths: [lib/polispec/classify/benign.rb, lib/polispec/predicates.rb, lib/polispec/engine.rb]
    deliverable: INTERNAL_TOOLS removed and benign? shell-only; in_development predicate; case-insensitive tool match
    acceptance: "ruby -wc on each file; a rule {tool: todowrite} matches a TodoWrite call in explain"
  - id: hook
    owns_paths: [lib/polispec/commands/hook.rb, lib/polispec/harness_controls/evaluate.rb, lib/polispec/fastpath.rb]
    depends_on: [layers, classify]
    deliverable: judge synthesises tool.internal, tool.read and opaque_shell actions under the control gate; trusted_declaration covers them; Guard.evaluate lifts declared unknowns; relaxed stamp from the declaring rule; dev_projects removed; fastpath.tools from the chain
    acceptance: see verification
verification:
  fixtures: "the 0.30.0 fixtures in the session scratchpad (devrelax-worker: ledger with onb, live, parent/child, retired; envs; global shelf) plus a shelf variant that tightens TodoWrite (deny) and one that narrows the opaque relaxation (warn on shape opaque_shell with in_development true) and one that declares CronCreate"
  matrix:
    - "TodoWrite, Skill, Read without a path, Grep, view_image in a live project, an onboarding project and an unowned path under baseline: allow on 0.31.0 and on the tree; the tree's judgment row carries class tool.internal or tool.read and the TOOL- rule id"
    - "CronCreate, Artifact, NoSuchTool: ask POLISPEC-TOOL-UNKNOWN on both; deny under the lock edition on both"
    - "CronCreate with the shelf variant that declares it: allow on the tree only"
    - "TodoWrite with the shelf variant that denies it: ask on 0.31.0 is not expected; on the tree the verdict is deny with the shelf rule id, and fastpath.tools no longer lists todowrite"
    - "every row of the 0.30.2 matrix (devrelax-verify m2.sh): identical verdicts; the relaxed stamp present on the same rows"
    - "the opaque narrowing variant: a source line in a development project asks on the tree with the shelf rule id in the environment warn, not the control ask"
    - "polispec.relax.dev off and POLISPEC_RELAX_DEV=off: the dev rule never declares; ask everywhere"
    - "a host with no shelf (POLISPEC_GLOBAL unset, no polispec.global.repo) and a live project: TodoWrite allow via the shipped layer; with a controls file and no shelf: TodoWrite allow"
    - "fastpath.tools: contains the 29 declared names minus reads when reads are governed; the shim skips Skill warm and still asks on CronCreate (smoke fastpath scenarios)"
    - judgments verify chain ok; validate judgment ok on a tool.internal record
    - explain writes nothing
    - latency: hook on TodoWrite and on a benign Bash line, 0.31.0 against the tree, within noise
  replay: every judgment record since 0.30.2 on this host whose tool was not Bash, replayed through explain on the tree with the real ledger and shelf, yields the same verdict as recorded
  smoke: "bin/polispec smoke run --against the pinned 0.31.0, 31/31; every diff beyond the version line is read and explained in the changelog (expected: resolve --layers rows, judgment rows with tool.internal)"
  checks: rplugin check at 0, doctor on scratch state, ruby -wc on every changed file, YAML load on every changed YAML
out_of_scope:
  - The edition default, the exceptions file, the allow-once service, the sealed plane
  - Codex and Antigravity adapters beyond tool-name spelling
  - Any smoke scenario addition (Part S); the existing scenarios are the regression surface
