      claude-code:
        run:
        - bin/polispec
        - smoke
        - run
        - "--unit"
        - commands/hook pretool|session
        - "--live"
        - claude-code
        - "--no-record"
        - "--strict"
        rung: 3
      codex:
        run:
        - bin/polispec
        - smoke
        - run
        - "--unit"
        - commands/hook pretool|session
        - "--live"
        - codex
        - "--no-record"
        - "--strict"
        rung: 3
