schema: is.v1
metadata:
  name: Polispec stewardship, pinned runtime, packages and plan/apply
  slug: stewardship
  version: 0.1.0
  created: '2026-10-14'
  status: accepted
  base_commit: 4769fb8
  base_version: 0.20.0
  intended_release: 0.21.0
  contract: specs/app.yml#stewardship
  worker: {harness: claude-code, model: sonnet, effort: medium}
vision:
  problem: >-
    Meta-level work on polispec (developing it, installing it, onboarding a project, editing the global shelf or the
    ledger) has no guardrail. On 2026-10-14 a half-edited lib/polispec/layers.rb in the development clone took the
    live guard down for every session on the host, because rplugin links the runtime straight to that clone. Changes
    to specs, the global shelf and the ledger are applied by hand with no preview of what they do to verdicts.
  outcome: >-
    The host runs a pinned, read-only release of polispec. polispec protects its own runtime. Every meta-level change
    goes through polispec plan (files, ledger effect, composed policy diff, verdict probes, tightening or not, plan id)
    and polispec apply (tightening-only directly; anything else only with --confirm <plan-id>, which the guard turns
    into a user ask). Onboarding becomes a package, environment-control, applied by the same verb.
  non_goals:
    - A policy sentence grammar for agents (stays a conversation, not in scope).
    - Arbitrary command steps in packages.
    - Packages from arbitrary paths or git URLs (sources are the shipped packages/ and the global shelf only).
    - Changing the sealed authority plane or its /usr/local/lib/polispec runtime layout.
constraints:
  - Ruby standard library only.
  - AGENTS.md Part Q, no comments or docstrings; keep the two-line shebang and SPDX header of every lib file.
  - AGENTS.md Part S, write no tests. Verify by running the real CLI against scratch repositories.
  - AGENTS.md Part F, no authorship attribution.
  - AGENTS.md Part E, back up in place before deleting; never rm -r, git clean or find -delete.
  - AGENTS.md Part J, query codebase memory before grepping.
  - Work ONLY in the worktree you are given. The polispec clone at /home/sven/github/foss/polispec and the rplugin clone at /home/sven/bitbucket/paterasai/rstack-uber/foss/rplugin (~/.rplugin) are LIVE runtimes for every agent on the host; a half-edited file there denies every tool call host-wide.
  - Never touch ~/.ai, the real ledger, ~/.rplugins, ~/.local/bin or any live project. Point POLISPEC_LEDGER, POLISPEC_GLOBAL, POLISPEC_HOME, RPLUGINS_HOME (read by Rplugin::Paths.plugins_home), RPLUGIN_HOME only when testing rplugin itself, and HOME-relative targets into a scratch directory for every run. Do not redirect XDG_STATE_HOME (it hides rplugin settings); redirect POLISPEC_HOME instead.
  - Do not commit, tag, push, or edit VERSION, CHANGELOG, README, FEATURES, docs, rules, skills, AGENTS.md or specs/. The primary does that.
slices:
  - id: A_rplugin_ref
    repo: rplugin
    owns_paths: [lib/rplugin/installer.rb, lib/rplugin/paths.rb, lib/rplugin/release.rb, lib/rplugin/verbs/install.rb, lib/rplugin/doctor.rb]
    depends_on: []
    deliverable: rplugin install <root|id> --ref <ref> materialises a pinned read-only release and links the store to it.
    detail:
      cli: >-
        Parse --ref REF in the install verb (find where install args are parsed; lib/rplugin/verbs/ or bin/rplugin).
        Usage becomes "rplugin install <plugin-root|id> [--only a,b] [--ref REF] [--dry-run] [--self]". --ref with
        --self is refused.
      source: >-
        The source repository is the resolved plugin root's git toplevel (git -C <root> rev-parse --show-toplevel);
        refuse "install --ref: <root> is not a git repository" otherwise. Resolve REF with
        git rev-parse --verify REF^{commit} to the full commit; refuse unknown refs. The worktree state of the source is
        irrelevant (dirty is fine) because only the commit is read.
      layout: >-
        Rplugin::Paths.plugins_home/.pinned/<id>/<commit>/ holds the release (git archive --format=tar <commit> piped
        into tar -x in a temp sibling directory .<commit>.tmp-<pid>, then rename into place). Next to it,
        <commit>.release.json (schema rplugin.release/v1): { schema, id, ref, commit, version (the VERSION file of the
        release if present else null), source (absolute source toplevel), tree_digest (sha256 of the canonical JSON list
        of [path, mode, sha256 of bytes] for every regular file and symlink target, sorted by path), installed_at (UTC
        ISO8601) }. A copy of the same JSON is written inside the release as .rplugin-release.json BEFORE permissions
        are dropped. Then every directory becomes 0555 and every regular file 0444 (0555 if it was executable).
        A release directory that already exists for the commit is reused after its tree_digest is re-verified; a
        mismatch refuses "install --ref: pinned release <commit> was modified".
      swap: >-
        plugins_home/<id> becomes a symlink to .pinned/<id>/<commit>: create the new symlink at
        plugins_home/.<id>.swap-<pid> and File.rename it over plugins_home/<id> (atomic). If plugins_home/<id> exists and
        is a real directory (not a symlink), refuse "install --ref: <path> is a directory; move it aside first". The
        previous symlink target is recorded in the new release.json as previous_target (string or null) for rollback.
        Then the normal install runs with plugin_root = plugins_home/<id>, so every linked surface (bin, skills, rules,
        hooks) resolves through the swapped link.
      unpin: 'rplugin install <absolute-path-to-a-clone> (no --ref) for a plugin whose store link points into .pinned/ repoints plugins_home/<id> at that path with the same atomic swap, and prints "unpinned <id>: <path>". rplugin install <id> (by id, no --ref) keeps whatever the store link points at.'
      dry_run: '--dry-run --ref prints "would pin <id> <ref> -> <commit> at <release dir>" and the usual would-lines; writes nothing.'
      doctor: 'rplugin doctor <id> reports a new informational line "runtime: pinned <commit> (<ref>)" or "runtime: linked <realpath>" and a finding pinned_release_modified when the tree_digest no longer matches. A pinned runtime is not a finding.'
      output: '"pinned <id> <ref> -> <commit12> at <release dir>" on success, before the usual install lines.'
    acceptance:
      - ruby -c on changed files; the rplugin repo's own check of itself (rplugin check on a sample plugin) still passes.
      - 'With plugins home in scratch: create a scratch plugin repo from rplugin template (or copy polispec at a tag into a scratch git repo), tag v1, run install --ref v1: the release dir exists, files are 0444/0555, release.json valid, the store link points at the release, a linked bin resolves into the release.'
      - 'Second install --ref v1 is idempotent; chmod u+w + edit a release file then install --ref v1 refuses with pinned release modified; doctor reports pinned_release_modified.'
      - 'install <clone path> unpins; install --ref v2 pins the new commit and records previous_target.'
      - 'A dirty source worktree does not affect the archived release.'
  - id: B_runtime_awareness
    repo: polispec
    owns_paths: [lib/polispec/runtime.rb, lib/polispec/engine.rb, lib/polispec/smoke.rb, lib/polispec/commands/doctor.rb, lib/polispec.rb]
    depends_on: []
    deliverable: polispec knows whether it runs from a working clone or a pinned rplugin release, protects its own runtime, and verifies its provenance in both cases.
    detail:
      runtime_module: >-
        New Polispec::Runtime (lib/polispec/runtime.rb, required from lib/polispec.rb). Runtime.root = File.realpath(ROOT).
        Runtime.release = parsed ROOT/.rplugin-release.json when it exists, is a regular file, parses, has schema
        rplugin.release/v1 and its commit matches File.basename(root), else nil. Runtime.kind: "pinned" when release,
        "sealed" when the sealed plane is active and ROOT is under /usr/local/lib/polispec, "clone" when ROOT/.git
        exists, else "unknown". Runtime.commit: release["commit"], else git rev-parse HEAD of ROOT, else nil.
        Runtime.pinned? kind == "pinned".
      protected_root: >-
        A built-in protected root applied by the engine wherever global protected_roots are evaluated (find the code
        around engine.rb:765 and :808; add the built-in root to that list, do not duplicate the evaluation). Path:
        Runtime.root. Writers: ["rplugin"] (so rplugin install may write). Verdict: deny with rule id R-POLISPEC-RUNTIME
        and reason "this is the polispec runtime that judges every agent action; build in a worktree or the clone,
        release, and reinstall with rplugin install --ref" when Runtime.pinned?; warn with the same id and reason
        "this tree is the live polispec guard for this host; build in a worktree, or pin the runtime with polispec
        apply --with-stewardship" when Runtime.kind == "clone"; nothing when kind is sealed (the sealed plane already
        protects /usr/local/lib/polispec) or unknown. Applies to fs.write, fs.delete and git operations whose path or
        cwd is inside the root (the same action classes global protected roots cover). It applies even when no ledger
        project owns the path and even in advise mode as a verdict (advise still never blocks).
      next_step: 'Add NEXT_STEPS key :runtime "Make the change in a worktree of the polispec repository, release it, and reinstall with `rplugin install <repo> --ref <tag>`." used for R-POLISPEC-RUNTIME.'
      doctor_runtime: 'polispec doctor prints "runtime: <kind> <commit12 or -> <root>" before its findings and doctor --json adds "runtime": {kind, commit, root, release_ref}; information, not a finding.'
      smoke_runtime: 'Smoke runtime capture uses Runtime.commit and Runtime.kind (install kind field) and reports dirty false for pinned; no git call on ROOT when pinned.'
      doctor_provenance: >-
        check_edition_provenance: when Runtime.pinned?, do not call git on ROOT. Instead re-compute the release
        tree_digest exactly as rplugin does (same algorithm: canonical JSON of sorted [path, mode, sha256] for regular
        files and symlink targets, excluding nothing) and compare with release["tree_digest"] (finding
        edition_provenance_invalid "pinned release differs from its record" on mismatch), then run the existing commit
        checks (committed_edition!, committed_file!, lock or standard provenance) against release["source"] as the git
        directory at release["commit"] instead of ROOT/HEAD. If release["source"] is not a readable git repository, the
        finding is edition_provenance_unavailable "source repository <path> is unavailable" (not invalid).
    acceptance:
      - 'Scratch: copy the polispec tree at HEAD into a scratch git repo, tag it, run rplugin (from the A worktree, or simulate by git archive + release.json written by a small scratch script with the same algorithm) to produce a pinned release; run <release>/bin/polispec version, doctor --json (no edition provenance finding), smoke record (runtime commit equals the release commit, install kind pinned).'
      - 'hook pretool for a Write into <release>/lib/x.rb with the pinned binary: deny R-POLISPEC-RUNTIME; with a clone binary writing into the clone: ask (warn); a write elsewhere: unchanged verdict.'
      - 'Byte-identity of 20+ hook verdicts against the base commit for paths outside the runtime root, using a scratch ledger copy with reach and teach flipped to live (copy the method from the 0.20.0 parity check: POLISPEC_LEDGER=<copy>, POLISPEC_HOME=<scratch>, XDG_STATE_HOME untouched, back up and restore ~/.local/state/polispec/fastpath.txt).'
  - id: C_packages_plan_apply
    repo: polispec
    owns_paths: [lib/polispec/packages.rb, lib/polispec/plan.rb, lib/polispec/probes.rb, lib/polispec/journal.rb, lib/polispec/stewardship.rb, lib/polispec/commands/plan.rb, lib/polispec/commands/apply.rb, lib/polispec/commands/onboard.rb, lib/polispec/classify/commands/release.rb, lib/polispec/ledger.rb, lib/polispec/commands/status.rb, lib/polispec/commands/hook.rb, schemas/package.v1.yml, schemas/ledger.v1.yml, lib/polispec/schema/core.rb, packages/, templates/]
    depends_on: [B_runtime_awareness]
    deliverable: packages, polispec plan and polispec apply replace onboard; apply --with-stewardship.
    detail:
      package_format: >-
        packages/<name>/package.yml, schema polispec.package/v1 (schemas/package.v1.yml, added to Schema::KINDS):
        { schema, name (^[a-z0-9][a-z0-9-]{0,40}$, equals the directory), version (semver), summary,
        params: same shape as module params (type, default, summary), variants: { <variant>: { summary, files: {
        <repo-relative target>: <source path relative to the package dir> } } }, default_variant, files: { target: source }
        (applied for every variant, variant files win on the same target), modules: [names of files under the
        package's modules/ directory that are copied to specs/polispec/modules/<name>.yml], steps: ordered list of
        built-in step kinds }. Step kinds (the whole vocabulary): files, manifest, ledger, render, commit, branches, push,
        checkouts. Each step may carry when: { param: <name>, equals: <value> } and nothing else. Unknown keys or
        step kinds are schema errors. Template files are rendered with the onboard token rules ({{project}}, {{date}},
        {{envs_root}}, {{repo_name}}) plus every package param as {{param}}.
      sources: >-
        Package lookup by name: ROOT/packages/<name>/ (shipped) and the global shelf's packages/<name>/ (same source as
        Layers.store: dir source root/packages, or repo source read with git show at the configured ref). A name in both
        is an error "package <name> is ambiguous" and nothing is applied.
      environment_control: >-
        packages/environment-control/ is the onboard flow moved verbatim: params serves (string, default real_users;
        allowed values real_users, internal, none, validated by apply), id (string, default derived like onboard),
        trust_ref (string, default stable), envs_root (string, default ~/.polispec/envs). Variants service and
        distributed take today's templates/onboard/<variant>/{environments,policy}.yml plus the shared roster.yml (move
        the files with git mv into packages/environment-control/variants/<variant>/ and roster.yml into the package
        dir; templates/onboard is then empty and removed by git mv, not deleted by hand). Steps in onboard order:
        files (when serves real_users), manifest, ledger (when serves real_users), render (when serves real_users),
        commit, branches (when serves real_users), push, checkouts. commit, push and checkouts run only when apply is
        given --commit, --push, --checkouts respectively, exactly as onboard's flags; serves internal|none reproduces
        onboard's light path (manifest serves line only). Every behaviour, message, refusal and JSON key of onboard is
        preserved, with the command name apply and step names files/manifest/ledger/render/commit/branches/push/checkouts
        replacing 1_scaffold/... (keep a mapping table in the plan output).
      onboard_removal: 'lib/polispec/commands/onboard.rb is removed with git mv to lib/polispec/packages/... or rewritten into the step implementations; the onboard verb no longer registers. polispec onboard prints the standard unknown-command usage.'
      ledger_record: >-
        ledger.v1 project entries gain packages: [{ name, variant, version, applied_at (date), files: { <repo path>:
        sha256:<hex> } }]. The ledger step writes or replaces the record for the package name. status <project> --json
        includes packages (name, variant, version, applied_at); doctor reports package_upgrade_available (info) when a
        source offers a higher version and package_file_drift (info) for files whose current bytes differ from the
        recorded digest.
      upgrade: 'plan <package> for a project that already records it compares versions; files whose current bytes equal the recorded digest are replaced; edited files are listed as conflicts with a unified diff of the new rendering and are left untouched by apply; the record is updated with the new version and the digests of the files actually written.'
      plan_targets: >-
        polispec plan <package> --repo <repo> [--variant V] [--param k=v ...] [--json];
        polispec plan project:<id> [--from REF|worktree] (proposed = the project's specs/polispec at REF, default the
        worktree of main; current = its trust ref);
        polispec plan global [--from REF|worktree] (proposed = the global source's polispec path in the worktree or REF;
        current = the configured global ref);
        polispec plan ledger --from FILE (proposed = FILE; current = the live ledger).
        apply takes the same target arguments plus --confirm PLAN_ID, --commit, --push, --checkouts, --with-stewardship,
        --dry-run (equivalent to plan) and --json.
      plan_output: >-
        { schema polispec.plan/v1, target, plan_id, files: [{ path, action (add|replace|conflict|unchanged), diff }],
        ledger: { before, after } or null, policy_diff: per project affected: added/removed/changed rules, gates,
        freezes, modules, and effective digests before/after, probes: [{ probe, before, after, change
        (tighten|loosen|same) }], journal: same shape for journal entries when the journal is on, classification:
        tightening|loosening|mixed|neutral, needs_confirm: bool, reasons: [strings] }. plan_id = "plan_" + first 24 hex
        of sha256 over canonical JSON of { target, proposed digests, current digests, classification }.
      classification: >-
        Severity order allow < warn < deny. A probe or journal entry whose verdict severity rises is tighten, falls is
        loosen. Structural: a removed gate, freeze, rule, module, protected root or hermetic entry is loosen; added is
        tighten; changed is decided by its probes, else loosen. Ledger: adding a project with status onboarding is
        tighten; any change to an existing entry's status, profile, trust_ref, repo or retired state is loosen; adding
        a packages record is neutral. Global target changes are never tightening-only. Enforce-mode changes are not a
        plan target (settings stay with rplugin settings) and are named in the stewardship rule instead.
        needs_confirm = classification != tightening && classification != neutral, or the target is global.
      apply_gate: 'apply recomputes the plan; when needs_confirm it requires --confirm equal to the recomputed plan_id, else refuses with code confirm_required (exit 1) printing the plan id and reasons; a stale id refuses with plan_changed.'
      apply_effects: >-
        package: runs the steps. project:<id>: copies the proposed spec files into the main worktree when --from REF,
        stages them by name and commits "Apply polispec plan <plan_id>" on main only (refuse when HEAD is not main).
        global: stages the changed files under the global path by name in the global repo and commits on its configured
        ref branch (refuse when that branch is not checked out). ledger: backs the live ledger up beside itself
        (ledger.yml.bak-<UTC stamp>) and atomically replaces it with FILE after validating it.
      sealed: 'When the sealed plane is active, apply of a global or ledger target refuses with sealed_authority "the sealed plane owns the global layer and the ledger; change the sealed source and reseal" (plan still works, read-only). Package and project targets are unaffected.'
      probes: >-
        lib/polispec/probes.rb generates for each affected project from the merged environments: for every env with a
        branch: git.push, git.tag, git.rewrite, git.commit, git.merge on that branch; for every checkout other than repo:
        fs.write and fs.delete of <checkout>/probe; every secrets glob: secrets.read; every service: service.control;
        deploy and promote per env; data.copy between every ordered pair of envs (from_env/to_env); policy.edit of
        specs/polispec/policy.yml; plus a fs.write into the runtime root. Each probe is judged through the same engine
        path the hook uses (Resolve + Engine.judge), once with the current composed policy and once with the proposed,
        without emitting events.
      journal: >-
        Setting polispec.verdicts.journal (enum off|on, default off; add to the manifest's settings and to app.yml).
        When on, the pretool hook appends to State "journal" (bounded to the last 5000 entries, rewritten atomically
        when it exceeds 5500) one object per judged action: { ts, project, env, action_class, tool, ref, path
        (home-relative), crosses, destructive, shape, verdict, rule_id }. Never command text, file contents or
        environment values. plan replays journal entries from the last 14 days as actions.
      guard_classification: 'In classify/commands/release.rb: polispec apply with --confirm is policy.edit (so live policies warn and the harness asks the user); polispec apply without --confirm is classified like onboard was (find its current classification; if none, policy.edit only when the target is global or ledger); polispec plan is read-only.'
      with_stewardship: >-
        apply --with-stewardship runs, before anything else, three checks in order, each skipped when satisfied:
        1) the stewardship rule is installed: the polispec manifest's rules list contains polispec-stewardship and
        rplugin's installed rules surface for each detected harness has it (use rplugin doctor polispec --json if it
        exposes rules, else check the linked rule targets); if missing run `rplugin install polispec --only rules`.
        2) the runtime protected root is active: Runtime.kind is clone or pinned (sealed or unknown fail).
        3) the runtime is pinned: if Runtime.kind == "clone", run `rplugin install <Runtime.root> --ref v<running
        VERSION>` (refuse when that tag does not exist or does not point at a commit whose VERSION equals the running
        one), then re-exec nothing (the current process finishes the apply from memory). Each step prints
        stewardship_<n>: ok|installed|failed <detail>; any failure aborts before the apply changes anything.
        rplugin is invoked through ~/.rplugin/bin/rplugin (RPLUGIN_BIN overrides) without a shell.
    acceptance:
      - 'Every former onboard scenario reproduced with apply environment-control on scratch repos: both variants, --dry-run, --commit, --commit --push to a scratch bare origin, --checkouts, serves internal and none, refusal on a second apply of the same package version (onboard''s refuse_if_onboarded becomes "already applied at version X"), JSON shape.'
      - 'polispec onboard is gone; polispec help lists plan and apply.'
      - 'plan project:<id> on a scratch project with a proposed rule loosening (deny -> allow on main) reports loosening, the affected probes, and needs_confirm; apply without --confirm refuses confirm_required; with the printed id succeeds and commits on main; a changed proposal refuses plan_changed.'
      - 'plan ledger --from adding an onboarding project: tightening, applies without confirm; flipping a status: loosening, needs confirm.'
      - 'plan global on a scratch global repo: needs_confirm always.'
      - 'Upgrade: bump the scratch package version and edit one written file; plan shows one replace and one conflict; apply leaves the edited file untouched and updates the record.'
      - 'Journal off writes nothing; on records facts without command text (grep the journal for the command string returns nothing).'
      - 'hook classification: Bash "polispec apply project:x --confirm plan_..." is policy.edit; "polispec plan ..." is read-only.'
      - '--with-stewardship against a scratch plugins home and a scratch clone tagged at the running version: first run reports installed for rule and pin, second run ok for all three; a missing tag fails step 3 and nothing is applied.'
shared_surfaces:
  - {path: lib/polispec.rb, owner: B_runtime_awareness, change: 'require runtime.rb'}
  - {path: lib/polispec/schema/core.rb, owner: C_packages_plan_apply, change: 'add "package" to KINDS'}
primary_after_merge:
  - rules/polispec-stewardship.md and its manifest rules entry; AGENTS.md section; skills/polispec/SKILL.md pointer.
  - polispec.rplugin.yml setting polispec.verdicts.journal; specs/app.yml; docs (environments.md onboard -> apply, operator.md, schema.md, new docs/packages.md); README; CHANGELOG; FEATURES; VERSION 0.21.0.
  - ~/.ai directives/polispec.md and its skill copy, command-src rstack.md and scaffold.md, regenerated commands; commit in ~/.ai.
  - rplugin release (version bump, changelog) in its own repo after slice A merges.
  - Pin this host's runtime with polispec apply --with-stewardship only after everything is merged, verified and tagged.
out_of_scope:
  - Tests of any kind.
  - The policy language.
as_built:
  - 'tree_digest skips .rplugin-release.json (it holds the digest); entries [relpath, "%04o" mode, sha256] or [relpath, "symlink", sha256 of the link text], sorted, SHA-256 of JSON.generate.'
  - 'rplugin install --ref validates the release (or the clone, when unpinning) before the store-link swap; an invalid release is kept under .pinned and the link is unchanged.'
  - 'A pinned runtime''s provenance requires its commit to be an ancestor of the source''s main (polispec-lock for lock), not equal to it.'
  - 'rplugin installs manifest rules natively only where a harness has a rules surface (Antigravity CLI) and has no --only rules; stewardship step 1 checks that the running tree and the store-linked tree ship the rule and otherwise runs rplugin install <runtime root>. Other harnesses reach the rule through the polispec skill and the [POLISPEC] directive.'
  - 'The journal is Polispec::State journal.jsonl with trim and atomic rewrite, because the ports State has no rewrite.'
  - 'Package params may carry allowed (string values); steps are { kind, when } or a bare kind; refusals already_applied, already_onboarded (pre-0.21 entries), downgrade_refused, not_on_ref, global_not_repo.'
  - 'Ledger plans classify structurally; probes are shown, not counted. A changed rule, gate, freeze, module or hermetic entry loosens unless a probe or journal entry shows it stricter. Probes add data.write per environment.'
