schema: is.v1
metadata:
  name: Polispec bundled smoke suite and harness controls on by default
  slug: smoke-suite
  version: 0.1.0
  created: '2026-10-14'
  status: accepted
  base_commit: 6e89671
  base_version: 0.21.0
  intended_release: 0.23.0
  contract: specs/app.yml#smoke
  worker: {harness: claude-code, model: sonnet, effort: medium}
vision:
  problem: >-
    polispec records smoke tests but ships none. Every release so far was smoke-tested by hand: headless Haiku
    sessions and scripted checks rebuilt from scratch each time, and a hand-run parity check (resolve, 23 hook
    verdicts, status, doctor on a scratch ledger copy, old version against new). Now that the host runs a pinned
    release, a tag is the only way code reaches the live guard, and nothing checks a candidate tree before it is
    tagged. Separately, the harness_controls feature flag has been off since 0.18.0. A probe of 0.21.0 with the flag
    on, against this host's ledger and global shelf (whose baseline makes every path governed), asked on ls, echo,
    git status, Skill, TodoWrite, WebSearch, WebFetch, Agent and every MCP call, because those calls classify to an
    empty action list and the hook then adds an unknown action.
  outcome: >-
    polispec smoke run executes shipped scenario files against the polispec tree it runs from, inside scratch
    fixtures, checks every step against declared expectations, records one smoke entry per covered unit, compares
    verdicts against another polispec tree with --against, replays host probes against read-only copies of the
    configured ledger and global shelf with --host-copy, and drives real headless Claude Code and Codex sessions with
    --live. harness_controls ships true, and benign built-in tools and read-only shell commands classify positively,
    so they stay allow with the flag on.
  non_goals:
    - Declaring MCP operations in any global shelf or policy (the operator does that through polispec plan global).
    - Changing the sealed_plane flag, the plane, authorizations, or the lock edition defaults.
    - Scenarios for flag-blocked units commands/plane, commands/authorizations and protected_authorizations.
    - A general-purpose test framework, a test DSL beyond the scenario schema below, or tests of polispec's internals.
constraints:
  - Ruby standard library only.
  - AGENTS.md Part Q, no comments or docstrings; keep the two-line shebang and SPDX header of every lib file. New lib files start with the same two lines.
  - AGENTS.md Part S. The suite is test machinery the user asked for and ships as product. Write no other tests (no unit tests of the runner).
  - AGENTS.md Part F, no authorship attribution.
  - AGENTS.md Part E, back up in place before deleting; never rm -r, git clean or find -delete. Scratch directories are left in place under the run's out directory; the runner never deletes them.
  - AGENTS.md Part J, query codebase memory (project for this repo) before grepping.
  - AGENTS.md Part B for the live layer, detailed in slice L_live.
  - Work ONLY in the worktree you are given. /home/sven/github/foss/polispec is a development clone another session is editing; ~/.rplugins/polispec is the pinned live guard. Never touch ~/.ai, the real ledger, ~/.rplugins, ~/.local/bin, ~/.claude, ~/.codex or any live project.
  - Every verification run points POLISPEC_LEDGER, POLISPEC_GLOBAL, POLISPEC_HOME and POLISPEC_SMOKE into a scratch directory. Do not redirect XDG_STATE_HOME or XDG_CONFIG_HOME (they hide rplugin settings); redirect POLISPEC_HOME instead.
  - Do not commit, tag, push, or edit VERSION, CHANGELOG, README, FEATURES, TODO, docs/, rules/, skills/, AGENTS.md or specs/. The primary does that. Commit nothing; leave changes in the worktree.
  - Read lib/polispec/smoke.rb, lib/polispec/commands/smoke.rb, docs/smoke.md, specs/app.yml and lib/polispec/commands/hook.rb before writing code. Match their idiom (module_function modules, Polispec::Error, Usage, JSON output with --json).
design:
  scenario_schema:
    id: polispec.smoke-scenario/v1
    file: schemas/smoke-scenario.v1.yml
    kind: Add smoke-scenario to Polispec::Schema::KINDS so polispec validate smoke-scenario FILE and validate auto work. Check that a hyphenated kind round-trips through schema_id and kind_for_id; if it does not, name the kind scenario and the id polispec.scenario/v1 and say so in the report.
    shape: |
      schema: polispec.smoke-scenario/v1
      unit: commands/resolve            # a coverage unit; with spec it must resolve through Smoke.resolve_node
      spec: specs/app.yml               # optional, default specs/app.yml, relative to the polispec tree
      summary: one line, recorded as the smoke entry summary prefix
      requires: [harness_controls]      # optional feature flags that must be enabled, else the unit records blocked
      fixture:                          # optional
        enforce: enforce                # advise|enforce, default enforce, applied through the env override Engine::Settings reads
        global: none                    # none | example | files; files reads global_files
        global_files: { "global.yml": "...", "modules/x.yml": "..." }
        projects:                       # each built by the candidate's own polispec apply environment-control into a scratch git repo
          - { id: shop, variant: service, serves: real_users, status: live, files: { "lib/app.rb": "puts 1\n" } }
        files: { "notes/a.txt": "text" }   # extra files under {{scratch}}/files
      steps:
        - name: short label, unique within the file
          run: ["{{polispec}}", resolve, "{{project.shop}}/lib/app.rb", --json]   # argv, no shell, placeholders expanded per word
          cwd: "{{project.shop}}"         # optional, default {{scratch}}
          env: { KEY: value }             # optional additions
          stdin: text                     # optional
          tty: ["typed line", ...]        # optional; run under PTY (stdlib pty) and type each line after the prompt appears
          timeout: 30                     # optional seconds, default 30, max 120
          expect:
            exit: 0                       # integer or list of integers
            stdout_includes: [..]         # literal substrings, placeholders expanded
            stdout_excludes: [..]
            stderr_includes: [..]
            json: { "env": "dev" }        # stdout parses as JSON and this mapping is a deep subset of it
            files_exist: ["{{project.shop}}/specs/polispec/policy.yml"]
            files_absent: [..]
            git: { repo: "{{project.shop}}", ref: stable, unchanged: true }   # ref sha equals the sha recorded before the step
        - name: guard denies a push to stable
          hook:                            # a canned harness payload fed to {{polispec}} hook pretool|session --harness H on stdin
            harness: claude                # claude | codex
            event: pretool                 # pretool | session
            tool: Bash
            input: { command: "git push origin main:stable" }
            cwd: "{{project.shop}}"
          expect: { decision: deny, rule: R-PROD-GIT }   # decision allow|ask|deny|context; rule optional; allow means empty output or an explicit allow
          parity: compare                  # compare (default) | ignore, used by --against
    placeholders: "{{scratch}}, {{home}} (scratch HOME used for steps that set home: true), {{files}}, {{global}}, {{ledger}}, {{project.ID}} (repo root), {{checkout.ID.ENV}} when apply creates checkouts, {{polispec}} (the tree's bin/polispec), {{tree}} (the tree root), {{out}}. An unknown placeholder is a scenario error, never left literal."
    step_home: "A step with home: true runs with HOME={{home}}; otherwise HOME is unchanged. Use it for harness install user scope and specs link."
  runner:
    command: "polispec smoke run [--unit PATTERN]... [--scenarios DIR] [--against TREE] [--host-copy] [--live claude-code|codex]... [--out DIR] [--no-record] [--accept-changes] [--json]"
    scenarios_dir: "Default <tree>/smoke/scenarios/*.yml, sorted; --scenarios overrides. --unit filters by exact unit or a trailing * prefix."
    out: "Default <tree>/.polispec-smoke/<UTC timestamp>-<6 hex>/; add .polispec-smoke/ to .gitignore. Each scenario gets out/<file stem>/ as {{scratch}} with ledger.yml, home/, global/, files/, projects/ and report.json (steps, argv after expansion, exit, durations, stdout and stderr truncated to 4 KiB each, expectation results)."
    isolation: "Every step runs with POLISPEC_LEDGER={{ledger}}, POLISPEC_HOME={{scratch}}/polispec-home, POLISPEC_GLOBAL={{global}} (an empty directory when global is none, so the host shelf never leaks in), POLISPEC_SMOKE={{scratch}}/smoke.yml, POLISPEC_SPECS_REPO={{scratch}}/specs-repo, the enforce override, GIT_CONFIG_GLOBAL pointing at a scratch gitconfig with user.name smoke and user.email smoke@example.invalid, GIT_CONFIG_NOSYSTEM=1, and PATH unchanged. The runner never reads or writes the host ledger, shelf, settings or state."
    fixture_build: "Projects are built by running the tree's own bin/polispec apply environment-control --repo <repo> --variant V [--param serves=…] --commit (and whatever else that package needs to create main, test and stable) against the scratch ledger, then status flipped to live by polispec apply ledger --from a scratch copy with --confirm of the returned plan id when status live is requested. If apply needs a remote, create a bare scratch remote. If a capability cannot be built through polispec itself, write the files directly and say which in the report."
    verdicts: "A scenario passes when every step meets every expectation. One failing step makes the scenario fail; steps after it still run unless the failing step has stop: true. A scenario whose requires flag is off, or whose fixture cannot be built, is blocked with the reason."
    record: "Unless --no-record, each scenario appends one entry through the same code path as smoke record (extract a shared Smoke.record(top:, path:, spec:, at:, verdict:, summary:, steps:, evidence:, runner:) used by both run_record and the runner; do not duplicate it). spec and at come from the scenario; the ledger is the one smoke record would use from the tree's toplevel (POLISPEC_SMOKE in the parent environment overrides). steps are {run, exit, expect, observed} built from the report; evidence is the scenario's report.json (kind report) and the scenario file (kind scenario). runner kind is suite (add suite to schemas/smoke.v1.yml runner.kind enum and to the --runner check), harness null, model null. Several scenarios may share a unit; the unit is recorded once with the worst verdict (fail > blocked > partial > pass) and all their steps."
    output: "Text: one line per scenario (verdict, unit, file, failing step names) and a coverage-style footer; --json prints {schema: polispec.smoke.run/v1, tree, against, scenarios: [...], recorded: [ids], diffs: [...], ok}. Exit 0 when every scenario passed or was blocked and, with --against, no diff exists (or --accept-changes). Exit 1 otherwise. Exit 2 on usage."
  parity:
    against: "--against TREE (a polispec tree with bin/polispec, e.g. a git worktree at the previous tag or ~/.rplugins/.pinned/polispec/<commit>) runs every scenario a second time with {{polispec}} pointing at TREE/bin/polispec, in its own scratch, and compares per step: for hook steps the decision and rule id; for run steps the exit status and stdout with the scratch root, tree roots and ISO-8601 timestamps normalised. parity: ignore skips a step. Only the candidate's results are recorded; diffs go to the output and report as {scenario, step, candidate, against}."
  host_copy:
    probes: "smoke/host-probes.yml (polispec.smoke-host-probes/v1, validated inline by the runner; no schema kind needed): a list of probes {name, harness, tool, input, cwd} where cwd may be {{project}} (expanded once per ledger project to its repo root), {{home}} (the real home directory, read-only use) or {{tmp}}. Ship at least: Read and Edit of a file in the project, Write in /tmp, Bash ls, echo, git status, git log -1, cat README.md, grep -rn x ., rm -rf build, git push origin main:stable, git push --force, bundle exec rake test, ./scripts/unknown-thing, an MCP call mcp__srv__op, WebFetch, WebSearch, Agent, Skill, TodoWrite."
    run: "--host-copy copies the configured ledger (the one Ledger.load would read with the parent environment) and the configured global shelf directory into out/host-copy/ (read only from the sources, copying with FileUtils.cp_r of the shelf's files at its configured ref through git show/archive when it is a repo ref), then runs every probe against each project with the copies via POLISPEC_LEDGER and POLISPEC_GLOBAL and the host's enforce mode, prints a table of probe, project, decision and rule, and with --against compares against TREE. Host-copy results are never recorded in the smoke ledger and never print file contents or command text beyond the probe names."
slices:
  - id: Q_quiet
    owns_paths: [lib/polispec/classify/**, lib/polispec/commands/hook.rb, lib/polispec/harness/base.rb, config/harness-features.yml]
    depends_on: []
    deliverable: harness_controls is true by default, and benign calls are positively classified so they are not turned into unknown actions.
    detail:
      flag: "config/harness-features.yml: harness_controls: true. Since 0.45.1 sealed_plane is true by operator direction; provisioning still requires authenticated operator execution."
      principle: "specs/harness-controls.impl.yml says unknown non-read-only classes cannot silently become an empty action list. Keep that: add a positive read-only determination, never a broader empty list. A call is positively benign only when every part of it was recognised by a classifier as read-only or as harness-internal. Anything partly unrecognised stays unknown."
      api: "Add Polispec::Classify.benign?(tool_name, tool_input, cwd) -> true|false (or an equivalent single entry point; find how Classify.call dispatches through Registry and put it beside it). The hook's unknown_action is added only when actions are empty, the call is governed, it is not a diagnostic read, and benign? is false."
      tools: "Harness-internal tools with no file, process or network effect are benign: TodoWrite, TodoRead, Skill, ToolSearch, AskUserQuestion, EnterPlanMode, ExitPlanMode, TaskOutput, TaskList, TaskGet, ListAgents, update_plan (Codex), view_image (Codex). Case-insensitive names. WebFetch and WebSearch (and Codex web_search) classify to a known web.fetch action carrying the URL host (or the query marker for search) in env_hint, never as unknown. Agent and Task classify to a known agent.spawn action. A known web.fetch or agent.spawn action must then be judged by policy and controls like any classified action; confirm with the probes below that, with no rule or control naming those classes, it is allow in standard edition under a governed baseline."
      shell: "A Bash or shell call is benign only when the shell parser in classify/shell.rb fully parses it, there is no output redirection to a file other than /dev/null, no command or process substitution, no eval/exec/source/xargs/env/sudo/nohup/timeout wrapper, and every simple command is read-only: a name in a curated READ_ONLY set (ls ll dir pwd echo printf true false test [ cd id whoami hostname uname date which type whereis ps pgrep printenv df du free uptime tree basename dirname realpath readlink seq tr column fold fmt rev nproc lscpu lsblk locale md5sum sha1sum sha256sum sha512sum cksum tty groups cat head tail wc file stat grep egrep fgrep rg sort uniq cut diff cmp jq less more) with no write flag (sort -o, tree -o, rg --pre, grep with no write flags is fine), or git with a read-only subcommand per the git family (status, log, show, diff, rev-parse, ls-files, blame, describe, branch with no arguments or only --list/-a/-r/-v, remote with no arguments or -v, tag with no arguments or -l/--list, config --get/--list). Reuse the families' own read detection where it exists instead of copying lists; Generic::NAMES and fs READ_ONLY_EXEC already overlap, so derive one constant from the other rather than adding a third copy. A pipeline or && / ; list is benign only when every part is."
      untouched: "With harness_controls false, every verdict is byte-identical to the base commit for every probe below (the flag-off path never consults benign?). Explicit controls, protected paths, root guard, MCP undeclared asks, and lock-edition denials are unchanged."
    verification:
      - "Copy ~/.ai/polispec/ledger.yml to scratch, and the files of ~/.ai/polispec (global.yml, profiles.yml, modules/) to a scratch global dir; never write to the sources. Run this worktree's bin/polispec hook pretool --harness claude with POLISPEC_LEDGER, POLISPEC_GLOBAL, POLISPEC_HOME in scratch, for each probe tool call in cwd /home/sven/github/foss/rEach and in a scratch dir."
      - "Flag true (shipped): allow for ls, echo hi, git status, git log -1, git diff, cat README.md, grep -rn x lib, ls | wc -l, Skill, TodoWrite, ToolSearch, WebSearch, WebFetch, Agent, Read, Grep, Edit. Still ask for mcp__router__reaper_locks_scan (undeclared MCP) and for an unparseable or unknown command such as ./scripts/frobnicate --all where it asked before; still ask or deny for ls > out.txt, echo $(rm -rf x), git push origin main:stable, git push --force, rm -rf build exactly as the base commit does with the flag on."
      - "Flag false (edit the worktree's config temporarily, restore it after): every probe's output is byte-identical to the base commit 6e89671's output (run the base from a second scratch worktree created with git worktree add --detach, removed afterwards with git worktree remove, no --force)."
      - "polispec classify for the shell probes prints the same actions as the base for every non-benign command."
  - id: E_engine
    owns_paths: [lib/polispec/smoke.rb, lib/polispec/smoke/**, lib/polispec/commands/smoke.rb, lib/polispec/schema/core.rb, schemas/smoke.v1.yml, schemas/smoke-scenario.v1.yml, smoke/scenarios/version.yml, smoke/scenarios/validate.yml, smoke/scenarios/resolve.yml, smoke/scenarios/classify.yml, smoke/scenarios/hook-pretool-session.yml, smoke/scenarios/noise.yml, smoke/scenarios/smoke.yml, smoke/host-probes.yml, .gitignore]
    depends_on: []
    deliverable: polispec smoke run with the scenario schema, fixtures, expectation checks, recording, --against parity and --host-copy, plus the seven listed scenario files.
    detail:
      layout: "lib/polispec/smoke/scenario.rb (load, validate against the schema, expand placeholders), lib/polispec/smoke/fixture.rb (scratch layout, projects, global, files, env), lib/polispec/smoke/step.rb (run, hook, tty, expectations), lib/polispec/smoke/run.rb (orchestration, recording, output), lib/polispec/smoke/parity.rb, lib/polispec/smoke/host_copy.rb. commands/smoke.rb gains the run verb and its usage; the existing verbs are unchanged."
      design_ref: "Implement design.scenario_schema, design.runner, design.parity and design.host_copy exactly."
      noise: "smoke/scenarios/noise.yml (unit harness_controls, requires [harness_controls]) builds a live service project under a global layer with one rule (so the baseline is governed) and expects allow for ls, echo, git status, cat, grep, Skill, TodoWrite, WebSearch, WebFetch, Agent, Read, Edit in the project, and ask for an MCP call. It will fail until slice Q_quiet merges; that is expected. Report its result."
      scenarios: "version (version prints the VERSION), validate (every examples/ file validates with its kind; a corrupted copy fails), resolve (dev path, checkout prod path, --layers), classify (git push, rm, Write), hook-pretool-session (deny push to stable in a live project, allow a dev write, ask on a policy edit, session prints the env context, claude and codex renderings), smoke (record into the scratch ledger, verify ok, a hand edit makes verify fail, coverage). Each scenario's expectations come from running the real command, cross-checked against the spec note for that unit in specs/app.yml; a disagreement between spec and behaviour is reported, never encoded silently."
    verification:
      - "From the worktree: bin/polispec smoke run --no-record runs every shipped scenario; all pass except noise (until Q merges). Paste the text output."
      - "bin/polispec smoke run --unit commands/resolve with POLISPEC_SMOKE=<scratch>/smoke.yml records one entry with runner kind suite; bin/polispec smoke verify with the same POLISPEC_SMOKE is ok; bin/polispec validate smoke-scenario smoke/scenarios/resolve.yml is ok and a scenario with an unknown key or unknown placeholder fails."
      - "--against: create a scratch worktree at v0.21.0 (git worktree add --detach <scratch>/v0.21.0 v0.21.0) and run bin/polispec smoke run --no-record --against <that>; report the diffs (expected: none except version output and anything from Q). Remove the worktree afterwards with git worktree remove (no --force)."
      - "--host-copy --no-record prints the probe table for the host's ledger projects; confirm with stat that ~/.ai/polispec files' mtimes are unchanged."
      - "A step that hangs is killed at its timeout and fails with timeout; the run continues."
  - id: L_live
    owns_paths: [lib/polispec/smoke/live.rb, smoke/live/**, polispec.rplugin.yml]
    depends_on: [E_engine]
    deliverable: --live claude-code|codex runs live scenarios in real headless harness sessions wired to the tree's guard, judged from external evidence.
    detail:
      schema: "Live scenarios are smoke/live/*.yml in the same scenario schema with one extra step type live: { harness: claude-code|codex, prompt: text, max_turns: 8, timeout: 300 } whose expect may use hook_log (a list of {tool, decision, rule} that must appear in order in the guard's hook log), plus the existing files_exist, files_absent and git checks. The agent's own output is saved as evidence and never used as an expectation. Add the live step to schemas/smoke-scenario.v1.yml is owned by E; L reports the exact schema addition and the primary merges it, or, if E has merged, L edits the schema and states that it did."
      wiring_claude: "claude -p PROMPT --model claude-haiku-5-5 --setting-sources project --settings <scratch>/claude-settings.json --strict-mcp-config --mcp-config '{\"mcpServers\":{}}' --output-format stream-json --verbose --no-session-persistence --max-budget-usd 0.50 --permission-mode acceptEdits, cwd the scratch project. claude-settings.json wires PreToolUse (matcher *) and SessionStart to a wrapper script in scratch that tees stdin and the guard's stdout into <scratch>/hook-log.jsonl and execs {{tree}}/bin/polispec hook pretool|session --harness claude with the scenario's isolation env. Confirm with claude --help which flags exist on the installed version (2.1.x); a missing flag is dropped and reported, never guessed."
      wiring_codex: "codex exec --ignore-user-config --cd <scratch project> --skip-git-repo-check --json -m <smallest available model, read from codex's own model list or config; report the choice> with hooks configured through -c overrides or a project .codex/ config pointing at the same wrapper (--harness codex). Never copy or read ~/.codex/auth.json; if codex cannot authenticate with --ignore-user-config, record the live step blocked with that reason. Confirm the hook config syntax from codex's own docs or the polispec codex backend (lib/polispec/harness_controls/backends/codex.rb)."
      apisafe: "AGENTS.md Part B. Limiter: live steps run strictly one at a time and at most POLISPEC_SMOKE_LIVE_MAX (default 6) per invocation. Retries: a live step whose harness exits non-zero before the hook log has any entry is retried at most once after a jittered 5 to 15 second wait; any other failure is not retried. Timeouts: per step wall clock (default 300 s, max 600 s); on expiry kill the process group (spawn with pgroup: true, TERM then KILL after 5 s). Kill switch: the new rplugin setting polispec.smoke.live (enum on|off, default on, scopes [machine]) and the environment variable POLISPEC_SMOKE_LIVE=off; either off makes every live step blocked with reason live_disabled without launching anything."
      scenarios: "smoke/live/hook-pretool-session.yml (unit commands/hook pretool|session; a live project, the agent is asked to push main to stable and to write a dev file; expect a deny for the push in the hook log, stable unchanged, the dev file written), smoke/live/code-hook.yml (unit code_specs/commands/code-hook pre|post|stop|session; a scratch code specs repo with one harness-class MUST rule, the agent is asked to write a violating file; expect the pre-write block in the hook log and the file absent), smoke/live/harness.yml (unit harness_controls, requires [harness_controls]; a project-scope control installed with polispec harness install into the scratch project that denies writes under one path, the agent is asked to write there; expect a deny with the control's rule). Each scenario has a claude-code and a codex variant step."
      selection: "--live H selects live scenarios and runs only their steps for harness H (repeatable). Without --live, smoke/live is not read. Live results record like any scenario, with runner kind agent, harness the harness name, harness_version from its --version, and model the model used."
    verification:
      - "POLISPEC_SMOKE_LIVE=off bin/polispec smoke run --live claude-code --no-record blocks every live step with live_disabled and launches no process (check with ps or by the absence of hook logs)."
      - "bin/polispec smoke run --live claude-code --no-record runs the three scenarios once each; paste the hook-log evidence lines for the denies. Cost stays within the budget flag."
      - "bin/polispec smoke run --live codex --no-record: either passes, or blocks with a stated reason (auth, hook support). Report which."
      - "rplugin check on this worktree reports the new setting without findings (run ~/.rplugin/bin/rplugin check <worktree> if that form exists; otherwise report)."
  - id: A_scenarios
    owns_paths: [smoke/scenarios/behavior.yml, smoke/scenarios/plan-apply.yml, smoke/scenarios/agents-render.yml, smoke/scenarios/hook-git.yml, smoke/scenarios/promote-deploy.yml, smoke/scenarios/pause-allow-once.yml, smoke/scenarios/roster.yml, smoke/scenarios/status-digest-doctor.yml, smoke/scenarios/seal.yml, smoke/scenarios/deployment-receipts.yml, smoke/scenarios/stewardship.yml, smoke/scenarios/composition.yml]
    depends_on: [E_engine]
    deliverable: Scenario files for these units, all passing with the merged engine.
    detail:
      units: "commands/behavior, commands/plan, apply, commands/agents render, commands/hook git, commands/promote, deploy, commands/pause, allow-once, commands/roster resolve|check, commands/status, digest, doctor, commands/seal (dry-run only), deployment_receipts, stewardship (plan classification tightening vs loosening, apply refusing confirm_required, protected runtime warn in a clone tree), composition (examples/clinic three-level modules, a parameter error reported)."
      source: "Derive steps from each unit's note in specs/app.yml, docs/, and the steps of that unit's latest entries in smoke.yml (bin/polispec smoke list and show). Use tty steps for typed phrases. Never run --push to a real remote, never seal or activate for real; deploys use a health command of true in scratch."
      engine_gaps: "Do not edit the engine. If a unit needs a fixture capability the engine lacks, write the files with run steps (git, polispec) inside {{scratch}}, and list the gap in the report."
    verification:
      - "bin/polispec smoke run --no-record --unit <each unit> passes for every file; paste the output."
  - id: B_scenarios
    owns_paths: [smoke/scenarios/harness.yml, smoke/scenarios/harness-controls.yml, smoke/scenarios/code-specs.yml, smoke/scenarios/code-commands.yml, smoke/scenarios/specs-commands.yml, smoke/scenarios/code-hook.yml]
    depends_on: [E_engine, Q_quiet]
    deliverable: Scenario files for the harness and code specs units, all passing with the merged engine and Q_quiet.
    detail:
      units: "commands/harness (grammar, parse, plan, install --dry-run, scan), harness_controls (requires [harness_controls]: install examples/controls.minimal.yml at project scope into a scratch project with home: true, verify, the guard denies the fixture write, uninstall restores the file and the backup exists), code_specs, code_specs/commands/code detect|chain|show|check|validate|baseline|controls|generate|classify, code_specs/commands/specs link|status|promote (relink under tty), code_specs/commands/code-hook pre|post|stop|session (claude and codex payloads)."
      code_specs_repo: "Build a minimal code specs repository in {{scratch}}/specs-repo with files and git run steps; read schemas/spec.v1.yml and docs for its shape. Do not read or link the host's polispec-specs repository."
      engine_gaps: "Same as A_scenarios."
    verification:
      - "bin/polispec smoke run --no-record --unit <each unit> passes for every file; paste the output."
shared_surfaces:
