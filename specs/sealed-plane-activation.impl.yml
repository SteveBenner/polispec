schema: rstack.blueprint/v1
task: sealed-plane-activation-0451
intent: Release the already implemented authenticated sealed-plane capability so an operator can provision the missing protected authorization service without editing the running guard.
harness: codex
implementation: Current session directly, under the user's explicit one-task roster exception; the runtime changes enable the flag and bind catalog decision state to protected authority.
version: 0.45.1
constraints:
  - Work only in the isolated enable-sealed-plane worktree; never edit the running pin.
  - Preserve existing authentication, typed confirmation, runtime provenance, fail-closed defaults, and root-guard checks.
  - Do not write tests or code comments, and do not copy private host authority into the release.
  - Do not activate a plane, install a protected service, redeem authorization, or access production.
  - Preserve the other session's delete-backup and hardening worktrees.
requirements:
  - id: SEALED-ACT-006
    rule: Composition errors and raw digests remain strongly owned by each composed policy for that policy lifetime. Replace weak-valued side maps with a Hash-compatible ComposedPolicy value that owns raw_digest and composition_errors through readers, remove the old map helpers, and preserve serialized policy fields and effective decisions.
  - id: SEALED-ACT-005
    rule: Every authority bundle requires catalog/active.yml, validated by the existing catalog-state schema. Provisioned catalog files must be present, relative, digest-matched, and valid under the existing catalog validator. Generation paths bind the catalog directory; active and broken planes never fall back to mutable user catalog state.
  - id: SEALED-ACT-001
    rule: config/harness-features.yml enables sealed_plane in the accepted release.
  - id: SEALED-ACT-002
    rule: Installation only enables the supported operator flow; it creates no active generation or service.
  - id: SEALED-ACT-003
    rule: Source contract, current documentation, feature status, and changelog describe enabled capability with privileged verification still pending.
  - id: SEALED-ACT-004
    rule: VERSION is the release source; all version declarations match, and native projections are generated through rplugin package.
surfaces:
  code: [config/harness-features.yml, lib/polispec/catalog.rb, lib/polispec/harness_controls/authority.rb, lib/polispec/harness_controls/plane.rb, lib/polispec/layers.rb]
  contract: [specs/app.yml, specs/harness-controls.impl.yml, specs/smoke-suite.impl.yml, schemas/catalog-state.v1.yml]
  doc: [README.md, docs/operator.md, docs/harness-controls.md, FEATURES.md, CHANGELOG.md]
  metadata: [VERSION, polispec.rplugin.yml, plugin.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json, .codex-plugin/plugin.json]
verification:
  - Validate the modified contract and plugin with the owning tools.
  - Run the existing smoke suite against the installed 0.45.0 release with scratch authority/state; inspect every changed verdict.
  - Run the candidate sealing dry run against the reviewed private authority commit; source preparation must remain valid and missing protected prerequisites must remain blocking.
  - Run the real non-root seal path against scratch authority/state to confirm it refuses operator_required before mutation; never run root sealing.
  - Run rplugin check, installation rehearsal, installed doctor, and version check before claiming deployment.
release:
  - Commit named source paths, fast-forward main only when unchanged, push main, and promote through polispec to test.
  - Use the promotion-created release tag for rplugin installation; inspect each operation before the next.
  - Keep operator provisioning and exact-request redemption explicitly pending.
out_of_scope:
  - Production promotion, protected runtime installation, plane activation, and root-guard remediation.
  - New authorization semantics, policy loosening, or catalog migration under a sealed plane.
