schema: is.v1
metadata:
  name: polispec verbose
  slug: verbose
  version: 0.1.0
  created: '2026-10-24'
  status: accepted
  base_commit: 7cab847
  base_version: 0.42.0
  intended_release: 0.44.0
  contract: specs/app.yml#verbose
  worker: {harness: claude-code, agent: coding-worker, note: "AGENTS.md Part T: the primary wrote this blueprint and verifies; workers implement every slice"}
  decisions_by_sven:
    - "A --verbose flag that streams the info and output of the steps an operation takes, so adding an exception or promoting a project can be watched while it runs."
    - "Scope: promote and deploy; rulebook changes; the install lifecycle; diagnostics. All four groups."
    - "Form: text on stderr, and an NDJSON mode (--verbose=json)."
    - "Extras: the POLISPEC_VERBOSE variable, --verbose as a grantable delegate flag, one bundled smoke scenario, and a trace file under the state home."
    - "The smoke scenario exists because Sven chose it through the question tool (AGENTS.md Part S, door 1: the user asked); no other test file is written."
  decisions_by_primary:
    - "The trace goes to stderr only: exceptions captures $stdout while it applies the global plan, --json results are one document on stdout, and the delegate runner already keeps both streams in its run log."
    - "The hook and code-hook verbs never trace and never read the variable, so the guard cannot start writing to stderr; the one exemption is hook git install and hook git uninstall, which are installers. The trace file is written only when the state home already exists."
    - "No setting turns verbose on by default; the flag and the variable are the only switches. One setting, polispec.verbose.trace, turns the trace file off."
vision:
  problem: >-
    polispec promote, exceptions add, apply and the other operations run many steps (git calls, gates, deploy steps that
    take minutes, validation, writes, a plan and an apply) and print one summary when they end. The test deploy of a
    promotion runs the whole smoke suite in silence. A person cannot see where an operation is, what it just did, or why
    it stopped, until it is over.
  outcome: >-
    With --verbose an operation streams a timestamped, nested trace of its steps to stderr as it runs, with the output of
    every child process line by line, and keeps the same trace in a 0600 file. Without the flag nothing changes: not one
    byte of stdout or stderr, no exit status, file, record or event.
  non_goals:
    - Any change to stdout, to a --json document, to an exit status, to a verdict, to a schema, to the judgment, change and session streams or to the events port.
    - Tracing the guard (hook, code-hook) or the resident judge.
    - A web route or web view change; no log viewer.
    - Redacting child output. Environment values, env-file contents, tokens and the typed answer are never passed to the trace; child output is printed as written.
constraints:
  - "Ruby standard library only, at the syntax level of lib/polispec/commands/doctor.rb (floor Ruby 2.6): no pattern matching, no numbered block parameters, no endless methods, no Hash#except, no filter_map, no Array#sum with a block-less float trap, no Psych keyword arguments."
  - "No comments or docstrings in code (AGENTS.md Part Q). No test files (AGENTS.md Part S); the single exception is smoke/scenarios/verbose.yml, which Sven asked for, written by the wire slice only. Do not edit any other file under smoke/."
  - "AGENTS.md Part F no attribution; Part E no deletion without an in-place backup (the only deletions in this change are File.delete of old trace files); Part J query codebase memory (project home-sven-github-foss-polispec) before grepping."
  - "Work only in <worktree> (branch verbose). Never touch the pinned runtime, ~/.ai, the live clone <live clone>, or the real ledger, shelf, settings file and state home."
  - "Every run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER, POLISPEC_HOME, POLISPEC_GLOBAL, POLISPEC_SETTINGS and POLISPEC_SMOKE to paths under the scratch root S given in your prompt; never redirect XDG_STATE_HOME. Run polispec as <worktree>/bin/polispec. Judge hook calls only through bin/polispec explain or hook with JSON on stdin."
  - "Never run a real promote, deploy, pin, install, uninstall, seal, plane, harness install or exceptions command against the real host. Operations that need a TTY and a typed phrase are driven with the smoke fixtures (smoke/scenarios/*.yml show how: fixture projects built by the tree's own apply, tty steps) or with a PTY script kept in your scratch directory."
  - "Do not bump versions, edit CHANGELOG.md, FEATURES.md, TODO.md, VERSION, specs/app.yml, docs or anything under .rproject/; the primary does those. Do not stage or commit; the primary does that."
  - "Another worker owns the other slices at the same time: edit only the paths your slice owns. The core slice lands first; every other slice calls the Trace API exactly as written below and does not change trace.rb."
  - "No behavior change when the trace is off: do not reorder, add or remove a call, a rescue or an ensure; wrap, do not restructure. A step block returns the block's value and lets every exception pass through unchanged. Every Trace call is a cheap no-op when the trace is off; guard anything expensive to compute with `if Polispec::Trace.on?`."
  - "No new rStack dependency and nothing host-specific in any shipped file (no ~/.ai, no project id, no host name, no operator name): doctor reports personal_default for it."
surfaces:
  code:
    - lib/polispec/trace.rb (new, core)
    - lib/polispec/trace/stream.rb (new, core)
    - lib/polispec/trace/logfile.rb (new, core)
    - lib/polispec.rb (autoload Trace; core)
    - lib/polispec/cli.rb (core)
    - lib/polispec/engine.rb (one settings reader; core)
    - lib/polispec/classify/benign.rb (core)
    - lib/polispec/delegate.rb and lib/polispec/delegate/grants.rb (core)
    - lib/polispec/state.rb, changes.rb, events.rb, lint.rb, operator/tty.rb (cross-cutting trace lines; core)
    - slice files listed under each slice
  contract:
    - polispec.rplugin.yml (one setting definition; core)
    - specs/app.yml#verbose (primary, already written)
  doc:
    - README.md
    - docs/operator.md
    - skills/polispec/SKILL.md
  fleet:
    - smoke/scenarios/verbose.yml (new, unit verbose; wire slice)
design:
  api:
    file: "lib/polispec/trace.rb, module Polispec::Trace, module_function. Autoloaded from lib/polispec.rb (autoload :Trace). The file stays small and cheap to load; the formatting, the file output and the pruning live in lib/polispec/trace/stream.rb and lib/polispec/trace/logfile.rb, required only by configure, so a run without the flag loads neither."
    state: "Module-level state guarded by one Mutex: @mode (:off, :text or :json), @io (the stderr object at configure time), @started (monotonic clock), @depth (Integer), @file (an open File or nil), @file_bytes, @op. Not thread-local: the thread that waits for a child is the thread that opened the step, and reader threads pass the depth they were given."
    predicates: "Trace.on? is true when @mode is not :off. Trace.json? is true in :json. Both are the first thing every other method checks."
    configure: "Trace.configure(mode, op:) with mode :text or :json and op the verb. A second call while on is ignored (a nested CLI.run keeps the outer trace). It stores the stderr object, starts the clock, opens the trace file when Engine::Settings.verbose_trace? is true (see file), writes the begin line, and returns self."
    finish: "Trace.finish(status) writes the end line (exit status, elapsed seconds, the trace file path when one is open), closes the file and returns to :off. A no-op when off. CLI.run calls it from an ensure."
    disable: "Trace.reset! returns to :off without writing; used when configure is not called."
    parse: "Trace.extract(argv, env) returns [argv_without_flags, mode_or_nil, error_or_nil]. It scans argv up to a literal -- and removes every token --verbose, -v, --verbose=text and --verbose=json; a token --verbose=anything-else yields the error 'polispec: --verbose takes text or json'. The last flag token wins. With no flag token, the mode comes from env['POLISPEC_VERBOSE'] (1, true, on, text -> :text; json -> :json; nil, empty, 0, false, off -> nil; anything else -> the error 'polispec: POLISPEC_VERBOSE takes 1, text, json or off'). It does not extract at all, and returns the argv unchanged with no mode and no error, when the first token that does not start with '-' is hook or code-hook (Trace::SILENT_VERBS)."
    step: "Trace.step(label, **fields) { ... }. Off: yields and returns the block value. On: writes the start line at the current depth, depth += 1, yields, depth -= 1 in an ensure, writes the end line (ok with the milliseconds, or failed with the reason: for Polispec::Operator::Failure its code and message, for any other exception its class and message, each cut to 300 characters) and re-raises the same exception object. Returns the block value. label is a short lowercase phrase without a trailing colon (examples: 'load project', 'gate G-CLEAN', 'write exceptions.yml')."
    info: "Trace.info(message, **fields): one line at the current depth. Fields render as key=value."
    command: "Trace.command(argv, chdir: nil): a '$' line with the words shell-escaped (Shellwords.join) and, when chdir is given and differs from Dir.pwd, ' (in <path>)'. Environment is never an argument."
    exit_line: "Trace.exit_line(code, ms, timed_out: false): an '=' line."
    output: "Trace.output(text, stream: :out, depth: nil): one line of child output ('| ' or '2| '); a trailing newline is dropped; a carriage return redraw is kept as written; control characters other than tab are replaced by '?' in text mode (JSON escapes them). depth defaults to the current depth + 1."
    drain: "Trace.drain(io, stream: :out) reads io line by line with gets until EOF, calls Trace.output for each line at the depth captured when drain was called, and returns the whole text read as one String (the same bytes io.read would have returned). A reader thread calls it. A read error ends the loop and returns what was read."
    capture: "Trace.capture3(*args), Trace.capture2(*args) and Trace.capture2e(*args) take exactly the arguments of the Open3 methods of the same name and return exactly what they return ([stdout, stderr, status], [stdout, status], [output, status]). Off: they call Open3 with the same arguments after removing the key :trace from the trailing options hash. On: they write a command line (unless trace: :silent), run the process with Open3.popen3 or popen2e and one reader thread per stream, writing each line as it arrives through Trace.output (unless trace: :quiet, which writes no output lines and, after the exit line, one '-' line with the byte count and the first line cut to 120 characters, ' ...' appended when longer), write the exit line with the duration, and return the same values. stdin_data is written and the pipe closed; binmode, chdir, err: and the other spawn options pass through. A SystemCallError from spawn propagates as it does from Open3."
    paths: "Trace.path(text) returns text with the current user's home directory prefix replaced by ~ (for display only)."
    never: "The API takes no environment hash for display and no phrase answer. Callers must not pass environment values, env-file contents, tokens or the answer typed at a prompt as a field or a message."
  text_format:
    prefix: "'[' + elapsed seconds right-aligned to width 7 with one decimal + 's] ' (for example '[   12.3s] '), then two spaces per depth level, then the body."
    markers:
      begin: "'# trace polispec <version> <op> pid <pid>' at depth 0"
      step_start: "'> <label>' then ' key=value' fields"
      step_end_ok: "'+ <label> (<N> ms)'; durations over 1000 ms print as '1.2 s'"
      step_end_failed: "'! <label> failed after <duration>: <reason>'"
      info: "'- <message>' then ' key=value' fields"
      command: "'$ <words>'"
      exit_line: "'= exit <code> in <duration>' and ' (timed out)' when timed out"
      output: "'| <line>' for stdout or merged output, '2| <line>' for stderr"
      end: "'# done exit <status> in <seconds> s' and, when a file is open, a second line '# trace file <path>' (path shortened with Trace.path)"
    fields: "Values render with to_s; a String containing a space, a quote or an equals sign, or an empty String, renders as its inspect form; an Array joins with ','; nil fields are dropped; paths are the caller's business (use Trace.path)."
  json_format:
    envelope: "{\"v\":1,\"ts\":\"2026-10-24T05:59:01.123Z\",\"t\":12.3,\"depth\":2,\"event\":\"...\"} followed by the event keys, one object per line, JSON.generate, UTF-8 with invalid bytes replaced (String#scrub)."
    events:
      begin: "op, pid, version"
      step: "phase ('start' or 'end'), label, fields (object, on start), ok (on end), ms (on end), error (on end when not ok)"
      info: "message, fields"
      command: "argv (array), cwd (string or null)"
      exit: "code, ms, timed_out"
      output: "stream ('out' or 'err'), text"
      end: "exit, ms, file (string or null)"
  file:
    path: "<State.home>/trace/<UTC stamp YYYYMMDDTHHMMSSZ>-<op>-<pid>.log (.ndjson in json mode). op is restricted to [a-z0-9-]. Directory 0700 (FileUtils.mkdir_p mode), file 0600 (File.open with perm), opened in append mode, every line written with syswrite and no buffering."
    switch: "Engine::Settings.verbose_trace? reads polispec.verbose.trace (default on, off disables). A configure with the setting off opens no file and writes no prune."
    cap: "8 MiB per file. The line that would cross the cap is replaced by one closing line '# trace file stopped at 8 MiB' (text) or {\"event\":\"info\",\"message\":\"trace file stopped at 8 MiB\"} (json), and nothing more is written to the file; the stderr stream goes on."
    prune: "At configure, before the file is opened: list <State.home>/trace/*.log and *.ndjson, File.delete every file whose mtime is older than 14 days, then File.delete the oldest until at most 63 remain (so the new file is the 64th). Every SystemCallError is rescued and ignored. No recursive delete anywhere."
    failure: "Any failure to create the directory or the file leaves @file nil and writes one '-' info line 'trace file unavailable' with the error class; the run never fails because of the trace."
  cli:
    where: "lib/polispec/cli.rb, CLI.run. Before `verb, *rest = argv`: call Trace.extract(argv, ENV) (requiring trace only when an argv token starts with '-v' or '--verbose', or ENV has POLISPEC_VERBOSE, so the common path loads nothing). On an error, warn the message and return 2. Otherwise continue with the returned argv. After the version/help/unknown checks pass and the entry is found, call Trace.configure(mode, op: verb) when a mode was returned, run invoke, and call Trace.finish(status) in an ensure. help, version and an unknown verb are never traced."
    help: "The help text gains one line after the version line: '  --verbose[=json] | -v   stream what the operation does, on stderr (any verb except hook)'."
  settings:
    key: "polispec.verbose.trace, enum on|off, default on, scopes [machine]. Declared in polispec.rplugin.yml beside polispec.lint.strict; read by Engine::Settings.verbose_trace? exactly like lint_doctor? (rescue StandardError returns true)."
  guard_tables:
    benign: "lib/polispec/classify/benign.rb polispec?: take cmd.args up to a literal --, remove every token matching /\\A(?:-v|--verbose(?:=(?:text|json))?)\\z/, and then run the existing table logic on what is left. No entry of POLISPEC_READ changes. A command whose remaining args are not benign stays not benign. After this change polispec doctor --verbose, polispec --verbose status, polispec lint -v --json and polispec exceptions list --verbose=json are benign, and polispec doctor --verbose=xml is not."
    release: "lib/polispec/classify/commands/release.rb operator: no change expected, because --verbose and -v are boolean flags that Support.split_args does not treat as value flags. The core worker proves this with bin/polispec classify (or explain) for: polispec --verbose promote P --to stable, polispec promote P --to stable -v, polispec deploy P stable --verbose=json and polispec -v apply global --confirm plan_x; each must classify exactly as the same line without the flag. If any does not, fix release.rb so that it does."
  delegate:
    flags: "lib/polispec/delegate.rb FLAGS_ALLOWED gains --verbose. lib/polispec/delegate/grants.rb: wherever a flag is checked against FLAGS_ALLOWED and the grant's flags (promote_reason, deploy_reason and the exceptions verbs' reason code), a token --verbose=text or --verbose=json is judged as the flag --verbose; the grant check for the value is that it is text or json. FLAGS_DEFAULT does not change. `polispec delegate grant --flags` accepts --verbose and rejects an unknown flag as before. A run whose argv carries a verbose flag executes it through CLI.run unchanged."
  cross_cutting:
    state: "State.append_jsonl: Trace.info('append <name>.jsonl') only when the trace is on; no change to the record or the path."
    changes: "Changes.record: a step 'record change' with fields kind and, after success, id (the chg_ id); no change to what is recorded."
    events: "Events.emit: Trace.info('emit event', type: <type>); no payload value is printed."
    lint: "Lint.guard_write!: Trace.info('lint gate', kind:, path: Trace.path(path), result: 'ok') when it passes; when it refuses, the Failure it raises already carries the problems, and the surrounding step shows it."
    tty: "Operator::Tty.confirm!: Trace.step('waiting for the typed phrase on the terminal', phrase: <phrase>) around the read (delegated or tty); the answer is never printed. When it raises NotTty or PhraseMismatch the step closes failed with that message."
  conventions:
    steps: "A step is a unit a person would name when explaining the operation: loading, validating, planning, confirming, waiting, writing, applying, committing, recording, publishing, verifying, a gate, a check, a deploy step. Nest steps the way the code nests the work. Keep labels stable: lowercase, a verb or a noun phrase, no trailing colon, no values in the label (values go in fields)."
    info: "An information line states a decision or a measured fact a person would want: which file or ref was read; a digest, sha, version, tag, plan id, classification; a setting or kill switch that changed the path; each skipped step and why; each result a gate or check produced; each file written (path and bytes) and each ref moved (ref, from, to, as short shas)."
    processes: "Every external process the code in your files starts goes through Trace.capture3, capture2 or capture2e (a mechanical replacement of Open3.capture3, capture2, capture2e) or, where the code already reads a pipe itself, Trace.drain. Git calls that only read (rev-parse, show, merge-base, ls-tree, ls-files, tag --list, remote get-url, symbolic-ref, describe, diff, cat-file, config, for-each-ref, rev-list, log, status) pass trace: :quiet; git calls that change or talk (fetch, push, clone, checkout, merge, commit, add, restore, tag <name>, update-ref, branch, worktree, apply) stream. A deploy step, a gate command, a health command and any user-supplied command always stream."
    waiting: "A wait on a person, a lock, a poll or a sleep that can last is a step with the reason in the label and the limit in the fields (timeout_s, attempt)."
    no_output: "Never write a trace line with puts, print or warn; only Polispec::Trace. Do not change a puts, print or warn that exists."
    secrets: "Never pass an environment value, env-file contents, an app token (pdt_), the web launch secret, a settings VALUE (polispec settings set prints the key, not the value), or the typed answer. Environment variable NAMES are fine."
    off_cost: "When the trace is off each Trace call must cost one method call that returns immediately. Do not build strings, hashes or arrays for the trace without `if Polispec::Trace.on?`."
    identical_off: "With the flag off, stdout, stderr, exit status, written files, state records and events are byte-identical to 0.42.0 for the same inputs."
slices:
  core:
    owns:
      - lib/polispec/trace.rb
      - lib/polispec/trace/stream.rb
      - lib/polispec/trace/logfile.rb
      - lib/polispec.rb
      - lib/polispec/cli.rb
      - lib/polispec/engine.rb
      - lib/polispec/classify/benign.rb
      - lib/polispec/classify/commands/release.rb (only if the proof fails)
      - lib/polispec/delegate.rb
      - lib/polispec/delegate/grants.rb
      - lib/polispec/state.rb
      - lib/polispec/changes.rb
      - lib/polispec/events.rb
      - lib/polispec/lint.rb
      - lib/polispec/operator/tty.rb
      - polispec.rplugin.yml (the one setting definition only)
    tasks:
      - "Implement design.api, text_format, json_format, file, cli, settings, guard_tables, delegate and cross_cutting exactly."
      - "Smoke runner isolation: confirm lib/polispec/smoke/process.rb clean_env already unsets POLISPEC_VERBOSE in a step (it unsets every POLISPEC_ variable); do not edit it."
      - "Hook latency: measure `polispec hook pretool` wall time over 30 runs on a fixed small payload before and after, with bin/polispec from the base tree (git worktree add of 7cab847 under S, or git stash is forbidden) and from <worktree>; report both medians. They must agree within noise."
    acceptance:
      - "Off: `polispec version`, `polispec status`, `polispec doctor --json` on a scratch host print the same bytes and exit statuses as the base tree; `polispec hook pretool` and `code-hook` ignore --verbose and POLISPEC_VERBOSE=1 and print nothing extra on stderr."
      - "On: `polispec lint --verbose <clean project>` streams begin, step and end lines on stderr and the same stdout as without; `--verbose=json` prints one valid JSON object per stderr line, each with v, ts, t, depth and event; `-v` and POLISPEC_VERBOSE=1 and =json behave the same; `--verbose=xml` and POLISPEC_VERBOSE=maybe exit 2 with the message; `--` stops extraction."
      - "Trace.capture3 on: a child that prints three lines with sleeps between them shows each line on stderr as it arrives (observe with timestamps), and returns the same stdout, stderr and status as Open3.capture3; with trace: :quiet it writes the summary line only."
      - "File: a verbose run writes <S>/state/trace/*.log at mode 0600 in a 0700 directory; the end line names it; polispec.verbose.trace off writes none; 70 stale files are pruned to 63 plus the new one; a file crossing 8 MiB gets the closing line once."
      - "bin/polispec explain classifies the four lines of guard_tables.release exactly like the lines without the flag, and Classify.benign? accepts the forms listed in guard_tables.benign."
      - "A delegate grant request whose argv has --verbose is out_of_scope without the flag in the grant and in scope with it; --verbose=json likewise; --verbose=xml is out_of_scope."
      - "`ruby -wc` clean on every changed file."
  ops:
    owns:
      - lib/polispec/operator/gates.rb
      - lib/polispec/operator/git.rb
      - lib/polispec/operator/deploy.rb
      - lib/polispec/operator/promote.rb
      - lib/polispec/commands/promote.rb
      - lib/polispec/commands/deploy.rb
    tasks:
      - "Gates.exec: the reader thread becomes `Trace.on? ? Trace.drain(out) : out.read` (capture the depth before the thread starts); write Trace.command before the spawn and Trace.exit_line after it (code, duration, timed_out). Timeout, terminate and the Execution value are unchanged. Hermetic#exec, run_all (one step per gate: 'gate <id>' with the result in an info line, a waived gate as an info line), each builtin gate (what it looked at: the sha, the env, the deploy records it found, the hours of a soak, the freeze window), command gates (cwd, dir, env_from NAMES only, hermetic yes/no), with_lock (info 'lock <name> held'), load_project (step 'load project': ledger path, project id, policy source and digest, a bootstrap)."
      - "Git: Git#run, Git#run!, Git.clone and Deploy.clone_release use Trace.capture3 as the process-capture contract says (the Failure and Result values unchanged); Git#fetch, push_atomic, create_tag, drop_tag, advance_branch (the result symbol as an info line), checkout_tracking and checkout_detached stream; the reads are :quiet."
      - "Promote: steps 'load project', 'fetch', 'plan' (with from and to shas shortened to 12, version, tag, source ref, actor, the drift and fast-forward checks as info lines), 'gates', 'preflight' for a hop, 'waiting for the typed phrase' (through Tty), 'publish' (create tag, push atomic with the refspecs, advance local branch, append the promotions record with its id), 'release' (the gh call), 'after steps' (one step per after command; a deploy step nests the Deploy trace). The result Hash and every Failure are unchanged."
      - "Deploy: steps 'deploy <env>' > 'authorize', 'prepare checkout' (clone or fetch), 'checkout' (sha, tag, version), 'hermetic guard' (isolate names, protected roots), each drain phase ('drain pause', 'drain wait' with each poll attempt and the remaining seconds, 'drain checks', 'drain resume' with each attempt), 'build release' and 'swap in' for release_dirs, each deploy step ('deploy step' with the command as a field, streaming its output), 'activate', 'health' (run: command streaming; url: one info line per poll with the status and detail, and the deadline), 'roll back' with both health results, 'retain releases' (kept, removed, held), 'record' (deploys.jsonl id, state.yml entry). Keep every Failure and the result Hash unchanged."
      - "commands/promote.rb and commands/deploy.rb: no change to arguments or output; add Trace.info lines for the parsed options only if useful (dry_run, waive_soak, tag, skip_drain, json) and the 'record change' already comes from Changes."
    acceptance:
      - "On a scratch host built from the smoke fixtures (see smoke/scenarios/promote-deploy.yml, deployment-receipts.yml), `polispec promote shop --to test --verbose` and `polispec deploy shop test --verbose --dry-run` stream the steps listed above; a deploy step that prints three lines with pauses between them shows them as they arrive; the health poll shows one line per attempt; a failing gate shows `! gate <id> failed` and the same Failure text on stderr as before."
      - "The stdout, stderr (minus trace lines), exit status, promotions.jsonl, deploys.jsonl and state.yml of the same run without the flag are byte-identical in content (ids and timestamps aside)."
  rulebook_a:
    owns:
      - lib/polispec/commands/exceptions.rb
      - lib/polispec/exceptions.rb
      - lib/polispec/commands/apply.rb
      - lib/polispec/commands/plan.rb
      - lib/polispec/plan.rb
      - lib/polispec/packages.rb
      - lib/polispec/commands/register.rb
      - lib/polispec/registration.rb
      - lib/polispec/commands/ledger.rb
      - lib/polispec/ledger.rb (write paths and load only)
    tasks:
      - "exceptions add, promote, remove: steps 'preflight' (plane status, global source kind and ref, branch, git status of the shelf scope and its result), 'load exceptions' (path, entry count, problems), 'build entry' (id, kind, tool, command, rule, scope, note length), 'validate document', 'waiting for the typed phrase' (through Tty, already traced), 'write exceptions.yml' (atomic write, bytes, the lint gate), 'plan global' (plan id, classification), 'apply global' (nest the ApplyCommand trace; its captured stdout stays captured), 'forget proposals', and on failure 'restore previous bytes'. The final `exceptions: added ...` line on stdout is unchanged."
      - "apply and plan for every target: steps 'sealed check', 'stewardship' when requested, 'build plan' (target, proposed and current digests, classification, needs_confirm, plan id, files with their action, ledger effect, probe counts, journal rows replayed, notes), 'confirm gate' (confirm_required / plan_changed decisions), then per target apply steps: 'write <file>' with bytes and sha for every file, 'ledger update', 'render', 'commit' (git add, commit and branch moves stream), 'branches', 'push', 'checkouts', 'record change'. Packages::Runner steps are traced step by step with the step name from the package."
      - "register and unregister: the plan and apply of the ledger target as above, plus path resolution, ownership detection, refusal reasons as info lines."
    acceptance:
      - "On a scratch shelf (a git repository as the global layer on its ref) `polispec exceptions add --command '...' --global --verbose` driven through a PTY streams every step listed, ends with the same stdout line as without the flag, leaves the same committed exceptions.yml, and writes a trace file; `exceptions list --verbose` and `exceptions remove` stream; a refusal (dirty shelf, sealed plane) shows `! preflight failed` with the Failure text."
      - "`polispec plan global --verbose` and `apply global --verbose --confirm <id>` on the scratch shelf stream the plan and the apply; stdout is byte-identical to the run without the flag."
  rulebook_b:
    owns:
      - lib/polispec/commands/settings.rb
      - lib/polispec/native_settings.rb
      - lib/polispec/commands/manifest.rb
      - lib/polispec/manifest.rb
      - lib/polispec/commands/agents.rb
      - lib/polispec/agents_render.rb
      - lib/polispec/commands/behavior.rb
      - lib/polispec/behavior.rb
      - lib/polispec/commands/pause.rb
      - lib/polispec/commands/allow_once.rb
      - lib/polispec/commands/specs.rb
      - lib/polispec/commands/roster.rb
      - lib/polispec/commands/code.rb
      - lib/polispec/commands/delegate.rb
      - lib/polispec/delegate/ (every file except grants.rb)
    tasks:
      - "settings set and unset: steps 'read settings file', 'validate key and value' (the key, and the value length, never the value), 'write settings file' (atomic, bytes), 'record change'. manifest --write: 'compose manifest' (project, doctor run, digests), 'write polispec.manifest.json', 'write badge', 'commit'. agents render: 'resolve project', 'render envs.md' (sha, bytes), 'upsert AGENTS.md row', 'check' result for --check. behavior compile, render, drift, lint: input path, schema, directive and surface counts, each surface written (path, bytes, sha) or found drifted."
      - "pause and allow-once: the TTY step (through Tty), what was recorded (ids, project, minutes), nothing about the raw command. specs link and promote: the link target, the relink phrase wait, the promoted files. roster resolve and check: the role, pipeline and phase resolved and the source. code generate, baseline, check, controls: the spec chain, the language, each file written, counts of findings."
      - "delegate grant and revoke and the other delegate subcommands that write: 'read grants', 'validate grant' (app name, projects, verbs, targets, flags; the token is never printed), 'write grants.yml' (bytes), phrase wait through Tty. delegate serve and run.rb: nothing."
    acceptance:
      - "Each verb above, run for real on a scratch host with --verbose, streams the steps it takes; stdout and exit status match the run without the flag; `settings set` never prints the value; `delegate grant --verbose` never prints the token."
  install:
    owns:
      - lib/polispec/commands/pin.rb
      - lib/polispec/native_pin.rb
      - lib/polispec/commands/install.rb
      - lib/polispec/native_install.rb
      - lib/polispec/commands/uninstall.rb
      - lib/polispec/uninstall_all.rb
      - lib/polispec/commands/restore.rb
      - lib/polispec/commands/steward.rb
      - lib/polispec/stewardship.rb
      - lib/polispec/commands/deployments.rb
      - lib/polispec/deployments.rb
      - lib/polispec/commands/harness.rb
      - lib/polispec/harness_controls/ (every file)
      - lib/polispec/harness/ (every file)
      - lib/polispec/commands/seal.rb
      - lib/polispec/commands/plane.rb
      - lib/polispec/git_hook.rb
      - lib/polispec/commands/hook.rb (only the git subcommands install and uninstall; the pretool, session and code paths must not change)
    tasks:
      - "pin: steps 'resolve ref' (tag, commit), 'archive release' (the git archive call streams), 'verify tree digest', 'swap current link', 'link ~/.local/bin/polispec' (or the reason it was left), idempotence as an info line. install and uninstall --harness: 'detect harness', 'settings file' (path, backup path), each hook written or removed (name, path), skill links, rule links, the receipt written or renamed. uninstall --all and restore: 'scan deployments', the backup (id, each file copied with size and sha), each surface in order with its result (ok, gone, kept, reported, operator_required), the data move, the change record; restore the same with its modes and conflicts."
      - "steward and apply --with-stewardship callers: each of the four steps with its status and detail (the same text the command prints). deployments --scan: each kind scanned, each entry added or retired. harness plan, install, verify, scan, uninstall: operation id, control digest, each artifact (path, action, backup), ownership checks, the receipt, the verification result per check; native probes (sandbox, socat) with their exit. seal and plane: the source, commit, each manifest entry counted (not listed), the blocking reasons. hook git install and uninstall: the shim directory, core.hooksPath before and after."
      - "Every Open3 call in these files becomes the matching Trace.capture; every Process.spawn or system call that cannot be converted gets a Trace.command line and a Trace.exit_line."
    acceptance:
      - "Each verb above, run for real on a scratch HOME and scratch state with --verbose (pin against a scratch source repository, install --harness claude with --scope project in a scratch project, uninstall --all and restore with the typed phrases through a PTY, harness install into a scratch project, steward --check, deployments --scan), streams the steps it takes; stdout and exit status match the run without the flag."
  diagnostics:
    owns:
      - lib/polispec/commands/doctor.rb
      - lib/polispec/commands/lint.rb
      - lib/polispec/lint/ (every file except through lint.rb, which core owns)
      - lib/polispec/commands/status.rb
      - lib/polispec/commands/digest.rb
      - lib/polispec/commands/smoke.rb
      - lib/polispec/smoke.rb
      - lib/polispec/smoke/ (every file except process.rb behavior: only add trace calls)
    tasks:
      - "doctor: one step per check method (check_ledger, check_projects, check_exceptions, check_editions, check_effect, check_lint, check_personal_defaults and the rest of the run list), each with its finding count as an info line when it ends and the project it covers as a field; no change to the findings, the order or the exit status."
      - "lint: steps 'collect targets' (project, host, shipped counts), 'check <path>' per target (finding counts by severity), 'drift', 'refs', 'summary'. status and digest: 'load ledger', one step per project, 'read judgments' (record count, window)."
      - "smoke run: a step per scenario ('scenario <unit> <file>') with a step per scenario step ('step <name>') whose fields are the argv and the cwd; a passing step ends with an info line (exit, stdout bytes, stderr bytes, ms); a failing step prints the failed checks and the first 40 lines of its stdout and stderr through Trace.output; fixtures built, requires and blocked reasons, the --against pass (the same per step), the diff list and the record step (entry id) are info lines or steps. Process.rb is changed only to add Trace.command and Trace.exit_line."
    acceptance:
      - "`polispec doctor --verbose` on a scratch host streams every check; `polispec lint --verbose` on a clean copy of examples/clinic streams every target; `polispec smoke run --unit commands/lint --verbose --no-record` streams each scenario and step; stdout and exit status match the run without the flag."
  wire:
    owns:
      - smoke/scenarios/verbose.yml (new)
    tasks:
      - "Write one scenario, unit verbose, with the fields every other scenario in smoke/scenarios has (read three of them first: promote-deploy.yml, exceptions scenarios, lint.yml). Steps: (1) flag off: `polispec status` prints no stderr trace; (2) --verbose: `polispec lint <clean project> --verbose` has stderr_includes '# trace polispec', '> collect targets', '# done exit 0' and the same stdout as step 1's equivalent without the flag; (3) --verbose=json: stderr lines parse as JSON with event begin and end (use the scenario expectation forms that exist); (4) a promote to test on the fixture project with --verbose: stderr includes '> gate G-CLEAN', '> publish', '$ git push' and '# done exit 0', stdout includes 'promoted: shop to test'; (5) exceptions add through a tty step with the typed phrase and --verbose: stderr includes '> waiting for the typed phrase on the terminal', '> write exceptions.yml', '> apply global'; (6) the hook is silent: a hook pretool payload with POLISPEC_VERBOSE=1 in the step env has no stderr trace and the same decision; (7) POLISPEC_VERBOSE=1 reaches a normal verb through the step env; (8) --verbose=xml exits 2."
      - "Validate it with `polispec validate smoke-scenario smoke/scenarios/verbose.yml` and lint it with `polispec lint smoke/scenarios/verbose.yml`; run it with `polispec smoke run --unit verbose --no-record` until it passes, and with --against <base tree> to see the expected diff (the base tree has no flag, so steps 2 to 8 differ)."
    acceptance:
      - "The scenario validates, lints clean and passes."
verification:
  primary:
    - "Full recorded smoke run against the base tree v0.42.0 (a git archive of the tag in the scratchpad): every pre-existing scenario passes with no diff beyond version, ids, timestamps and the new scenario."
    - "Flag-off byte parity of stdout, stderr, exit status and written files for a set of verbs on a scratch host, against the base tree."
    - "Real streamed runs of promote to test and exceptions add on the scratch fixtures, read as a person would."
    - "polispec lint --shipped and lint . at zero errors; ruby -wc on every changed file; doctor on the worktree with no blocking finding."
