schema: is.v1
metadata:
  name: polispec web, author port, effect tracking, registration, manifest and the edition registry
  slug: webapp
  version: 0.1.0
  created: '2026-10-20'
  status: accepted
  base_commit: 8c000fb
  base_version: 0.33.1
  intended_release: 0.34.0
  contract: "specs/app.yml#description, #web, #author, #manifest, #registration, #effect, #editions, #extension_points, #delegation.exceptions_verbs, #judgments.epoch"
  companions:
    frontend: specs/web-frontend.impl.yml (Chris; slices F0 to F8; authoritative for every file under web/public)
    rplugin: specs/webapp-rplugin.impl.yml (plugin-declared ports in rplugin and the rllm author adapter in the extension catalogue)
    effect_inputs: docs/effect.md and TODO.md "Change receipts and effect tracking" (measured by the polispec-5d session; open items stay open)
  worker: {harness: claude-code, agent: coding-worker, model: sonnet, effort: medium, note: "AGENTS.md Part T: the primary wrote this blueprint and verifies; workers implement the slices. Roster: coding-worker claude/sonnet/medium."}
  decisions_by_sven:
    - "Stack: Roda on Rack 3 served by WEBrick, all pure Ruby, vendored under vendor/; the UI is static ES modules and Web Components with no build step; a JSON API under /api/v1 with an OpenAPI document."
    - "Writes: every change is a polispec plan; tightening or neutral and not global applies on one click; loosening, mixed, global, status flips, moves and ledger changes need the plan id typed; operator-only actions are copyable commands; a per-launch secret the agent cannot read and a guard rule that warns on agent calls to the web app's mutating endpoints."
    - "description: a new optional field on every rulebook with a deterministic semantic lint, an optional decide-port judgment, a ratchet (warn by default, polispec.description.strict fails), rolled out runtime first."
    - "author: a polispec-owned port; the built-in adapter is a persistent stream-json Claude Code session built inside polispec after rharness's Claude::Control design; rllm reaches it only through rplugin's rstack extension, which needs plugin-declared ports in rplugin (this release)."
    - "One release. The eight extra views and polispec-5d's five effect screens plus their backend are all in it."
    - "Manifest: generated per app, authored by the app (polispec.app.yml), and a host-wide index; plus polispec register and a skill for arbitrary software, directories and the user's system scope, with owner stamped per OS user and opt-in index publishing."
    - "Move: relocate across scopes and reorder or regroup within a layer, both as plans."
    - "Exceptions promote from the web relays the typed phrase through the delegate runner, never in polispec-lock."
    - "Edition registry specs/editions.yml; code reads it through Polispec::Editions; every lock branch in the code moves behind it; polispec editions --check and doctor report drift. Web is excluded from lock."
    - "Themes: system, light, dark, apple-noir, apple-austere, tronwave; first visit system; recorded as a fleet.yml exception."
    - "Authorized token runs (2026-10-20): the author probe (Claude), the Codex investigations and a Codex author turn, the Claude Code hook snapshot test, and one rllm turn. Each runs once, in scratch projects, at the smallest model that answers."
    - "rplugin 1.16.0 and catalogue 2.7.0 are built in worktrees and released before polispec 0.34.0, each release after Sven's yes."
    - "At most 4 workers run at once."
    - "Network fetches allowed once: the four gems from rubygems.org and a CodeMirror 6 pre-bundle built with npm and esbuild in the scratchpad only."
vision:
  problem: >-
    polispec lives entirely in files and a CLI. A person cannot see which projects a shelf module reaches, what a policy is
    composed of, what a draft would change in real traffic, or whether a change has reached the sessions running right now.
    Rulebooks carry a one-line summary that nothing checks. There is no way to register software that is not a git
    repository with branches, nothing records which OS user owns an entry, and the difference between standard and lock is
    scattered across about twenty string comparisons.
  outcome: >-
    polispec web serves a local, file-backed web app over the same library the CLI uses. Every rulebook may carry a linted
    description. An author port drafts rulebooks through a persistent, governed Claude Code session. Every judgment carries
    a policy epoch; change and session records show which sessions crossed a change. polispec register governs paths; a
    manifest, an app declaration and a host index describe every governed app. specs/editions.yml is the single place the
    two editions differ.
  non_goals:
    - Any change to a verdict outside the new web_local shape, G-WEB-AGENT and the policy.edit classification of polispec web, polispec web url and the new verbs. The edition refactor must change no verdict.
    - A database, a remote service, a hosted mode or a network fetch at runtime.
    - Sealing, plane activation, promotion to stable or any operator-only action from the web app.
    - Writing description into any live rulebook in this release (runtime first, see description.rollout).
    - Codex mid-session hook reload and trusted_hash semantics are investigated, not assumed (effect.open).
constraints:
  - "Ruby >= 2.6, standard library only in lib/polispec outside lib/polispec/web; lib/polispec/web loads only the vendored gems. Keep the two-line header (shebang, SPDX) every lib file carries."
  - "No comments or docstrings in code (AGENTS.md Part Q). The only new test material is smoke scenarios under smoke/scenarios (the product's own test machinery). Browser journeys are driven from scripts in the primary's scratchpad, never committed."
  - "Every Write or Edit stays under 60 KB of content per call: the live guard rejects hook input over 65,536 bytes. Split large files into several Edit appends."
  - "Work only in the slice's worktree under /home/sven/github/foss/.polispec-wt/ (branch per slice, off feat/webapp). Never touch the pinned runtime, the live clone /home/sven/github/foss/polispec, ~/.ai, ~/.rplugin, the real ledger (~/.ai/polispec/ledger.yml), the real shelf, Sven's ../.polispec-wt/stable-hotfix, or any stable branch or production checkout."
  - "Every verification run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER, POLISPEC_HOME, POLISPEC_GLOBAL and POLISPEC_SPECS_REPO to scratch paths; never redirect XDG_STATE_HOME."
  - "Never run git push, git tag, promote, deploy, pin or steward; the primary does releases."
  - "APISAFE for every process or HTTP call the change adds: a limiter, bounded jittered retries, timeouts and a kill switch, exactly as given per component below."
  - "No new direct rStack wire. rllm is reached only through the rplugin rstack extension (companion spec)."
  - "Commands are files: a new command is lib/polispec/commands/<name>.rb calling Polispec::CLI.register; no registry edits."
