schema: polispec.editions/v1
editions:
  standard: "The edition main builds. Asks a person where policy is silent and lets the operator relax what the person has already judged."
  lock: "polispec-lock, which differs from main only by EDITION lock. Denies where standard asks, honors no relaxation and accepts no authority the protected plane did not grant."
values: [included, restricted, excluded]
features:
  - id: exceptions
    standard: included
    lock: excluded
    since: 0.29.0
    code: lib/polispec/exceptions.rb
    note: "Exceptions.active? is false under lock; no proposal or promote hint is made."
  - id: exceptions.delegate_promote
    standard: included
    lock: excluded
    since: 0.35.0
    code: lib/polispec/delegate
    note: "The web app relays the typed phrase of exceptions add, promote and remove through the delegate runner. Never included in polispec-lock by operator direction on 2026-10-20."
  - id: relax.dev
    standard: included
    lock: excluded
    since: 0.30.0
    code: lib/polispec/predicates.rb
    note: "in_development is false under lock, so a governed eval, source or . line always asks."
  - id: unknown_call.ask
    standard: included
    lock: restricted
    since: 0.23.0
    code: lib/polispec/harness_controls/evaluate.rb
    note: "An unknown or undeclared call asks under standard and is denied under lock; the default applies only while tools/unknown or mcp/undeclared is active on the host."
  - id: mcp_default.ask
    standard: included
    lock: restricted
    since: 0.23.0
    code: lib/polispec/commands/hook.rb
    note: "Records the undeclared MCP default (ask under standard, deny under lock) in the fast-path key, so an edition change refreshes the fast path. The verdict itself comes from unknown_call.ask, only while mcp/undeclared is active on the host."
  - id: catalog.gate_optional
    standard: included
    lock: excluded
    since: 0.48.0
    code: lib/polispec/catalog.rb
    note: "Under lock the catalog subspecs that carry a gate (mcp/undeclared, tools/unknown) are in effect without activation and catalog deactivate refuses them."
  - id: legacy_warn
    standard: included
    lock: restricted
    since: 0.23.0
    code: lib/polispec/commands/hook.rb
    note: "Under lock a control warn, or any ask set without a legacy warn, settles to the worst independent verdict."
  - id: root_guard.optional
    standard: included
    lock: excluded
    since: 0.18.0
    code: lib/polispec/harness_controls/environment.rb
    note: "Lock forces root_guard on."
  - id: network.domain_allowlist
    standard: included
    lock: restricted
    since: 0.18.0
    code: lib/polispec/harness_controls/backends
    note: "Lock generates an empty domain allowlist (Codex) or a denied network (os), and ignores domain additions outside managed settings (Claude Code)."
  - id: controls.user_scope
    standard: included
    lock: restricted
    since: 0.18.0
    code: lib/polispec/harness_controls/backends/claude.rb
    note: "Lock honors controls only from managed scope."
  - id: plane.standard
    standard: included
    lock: excluded
    since: 0.18.0
    code: lib/polispec/harness_controls/plane.rb
    note: "A lock build refuses a standard plane (edition_mismatch)."
  - id: web
    standard: included
    lock: excluded
    since: 0.35.0
    code: lib/polispec/web
    note: "polispec web refuses to start under lock (edition_excluded). Decided 2026-10-20."
  - id: author
    standard: included
    lock: excluded
    since: 0.35.0
    code: lib/polispec/author
    note: "No AI drafting under lock."
  - id: register.path
    standard: included
    lock: restricted
    since: 0.35.0
    code: lib/polispec/commands/register.rb
    note: "Under lock a governed path entry is added only through the protected ledger the sealed plane names."
  - id: manifest.index_publish
    standard: included
    lock: excluded
    since: 0.35.0
    code: lib/polispec/manifest.rb
    note: "a machine-wide index discloses governed paths and owners to every local user"
  - id: epoch_notice
    standard: included
    lock: included
    since: 0.35.0
    code: lib/polispec/effect.rb
    note: "The pretool hook adds the in-band epoch notice once per session per epoch in both editions."
  - id: controls.sandbox_prerequisite_finding
    standard: included
    lock: excluded
    since: 0.23.0
    code: lib/polispec/harness_controls/backends/claude.rb
    note: "Standard reports sandbox_unavailable when bwrap or its helpers are missing from PATH. Lock generates a managed sandbox with an empty network allowlist and does not report that finding."
