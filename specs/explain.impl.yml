schema: is.v1
metadata:
  name: polispec explain
  slug: explain
  version: 0.1.0
  created: '2026-10-16'
  status: accepted
  base_commit: 02b5146
  base_version: 0.25.1
  intended_release: 0.26.0
  contract: specs/app.yml#commands (the explain entry)
  worker: {harness: claude-code, model: sonnet, effort: medium}
vision:
  problem: >-
    Nothing can ask polispec what it would answer for a tool call without making the call. Teach launches headless agent
    sessions (its AI view, desk fix workers, live sessions) whose MCP tools the harness-control ceiling asks about when no
    rule declares them; an unattended session cannot answer the ask, so the session silently stops (2026-10-15: every
    Teach AI turn ended text-only after the global mcp-declared module omitted the predict server). Teach's doctor needs
    the verdict before a session runs, and polispec hook pretool is unusable for that because it appends a chained
    judgment record, emits events and refreshes the fast path on every call.
  outcome: >-
    polispec explain --harness HARNESS [--json] reads one PreToolUse hook JSON on stdin, judges it through exactly the
    code path hook pretool uses, and prints the verdict the harness would receive under enforce, with no side effect.
  non_goals:
    - Any change to what hook pretool decides or records.
    - Batch input, a daemon or a socket. One call per invocation.
    - A doctor finding or a new setting.
constraints:
  - Ruby standard library only; same Ruby floor as the rest of lib/.
  - No comments or docstrings in code. Keep the two-line header (shebang, SPDX) every lib file carries.
  - No tests. Verification is by running this worktree's bin/polispec for real against scratch state (rules/polispec-stewardship.md).
  - Work only in this worktree (~/github/foss/.polispec-wt/explain, branch explain-verb). Never touch the pinned runtime under rstack-uber/plugins/.pinned/polispec, ~/.ai/polispec, ~/.config/polispec, ~/.local/state/polispec or any project's specs/polispec.
  - Every verification run sets POLISPEC_STATE_HOME, POLISPEC_HOME and POLISPEC_LEDGER to scratch paths in your scratch directory (and POLISPEC_GLOBAL when you need a scratch shelf); never redirect XDG_STATE_HOME.
  - Do not commit, tag, push, install, or run rplugin. Leave the worktree modified and unstaged.
  - Do not edit specs/app.yml, CHANGELOG.md, VERSION, FEATURES.md or any *.impl.yml; the primary owns them.
owns_paths:
  - lib/polispec/commands/explain.rb
shared_surfaces:
  - {path: lib/polispec/commands/hook.rb, change: 'an explain mode on HookCommand: an entry method that takes (harness, raw hook JSON) and returns the judged result as a Hash, and guards that make record_judgment, emit_control_events, Fastpath.refresh and the deferred event flush no-ops while it runs. pretool behaviour and output stay byte-identical.'}
slices:
  - id: explain
    depends_on: []
    deliverable: polispec explain works end to end on scratch state; nothing is committed.
    detail: |
      Read lib/polispec/commands/hook.rb first: run -> pretool -> decide -> judge, then compose_ask_authority,
      record_judgment, emit_control_events and flush_events. Register the command the way classify does
      (lib/polispec/commands/classify.rb: CLI.register("explain", ExplainCommand, summary: ...)).

      Input: polispec explain --harness HARNESS [--json], hook JSON on stdin (the same shape the harness sends hook
      pretool, e.g. {"hook_event_name":"PreToolUse","tool_name":"mcp__predict__render","tool_input":{},"cwd":"/abs",
      "session_id":"x"}). HARNESS is one of HookCommand::HARNESSES. A tty stdin, an unknown harness or unparseable JSON
      prints a usage or error line to stderr and exits 2.

      Judging: reuse judge(adapter, input, options) unchanged. Wrap the harness adapter so ask? returns true (an
      adapter subclass or a delegator): compose_ask_authority then returns at its adapter.ask? line before any
      HarnessControls::Authorizations call, and the engine context's issue_allow_once is false so Passes.issue! never
      runs. Take the verdict from @judged["verdict"] (the worst composed verdict), not from judge's rendered output,
      so the answer is the enforce answer whatever polispec.enforce is. When judge returns early because the call is
      not governed, the verdict is allow and governed false.

      No side effects while explaining: no Judgments.record, no Events.emit (polispec.control.observed, findings or
      judgment), no Fastpath.refresh, no DeferredEvents flush, no allow-once or authorization file. Do it with one
      instance flag checked at those call sites, so pretool is untouched when the flag is off.

      Output (--json): one JSON object on stdout:
        {"verdict":"allow|warn|deny","rule_id":String|null,"reason":String|null,"governed":Boolean,
         "control":{"verdict":"allow|warn|deny","ask_ids":[String]}|null,
         "actions":[{"class":String,"server":String|null,"operation":String|null,"declared":Boolean|null}]}
      declared is computed for mcp.call actions with the same test Controls.evaluate uses for the undeclared MCP
      default (HarnessControls::Evaluate.declared_action? over the control documents with protected_only: true, or the
      trusted_declaration callable), and is null for every other class. Without --json print one line:
      "<verdict> <rule_id or -> <reason or ->". Exit 0 whenever a verdict was produced, including warn and deny.

      Internal errors: judge raises on internal failure (pretool turns that into a hard deny). explain prints the error
      class and message to stderr and exits 1; it never prints a fabricated allow.
acceptance:
  - id: A1
    check: >-
      With a scratch shelf whose module declares server predict operation render, explain on mcp__predict__render
      prints verdict allow and declared true; on mcp__predict__describe (undeclared) prints verdict warn, ask_ids
      containing POLISPEC-MCP-UNDECLARED and declared false. Under the lock edition (POLISPEC edition setting or EDITION)
      the undeclared call is deny.
  - id: A2
    check: >-
      A recursive listing with sizes and mtimes of POLISPEC_STATE_HOME (and of POLISPEC_HOME) taken before and after 20
      explain runs, warn and deny included, is identical: no judgments.jsonl growth, no fastpath files, no allow-once log
      line, no event spool.
  - id: A3
    check: >-
      hook pretool on the same inputs with the same scratch state gives byte-identical stdout and exit status to the
      base commit 02b5146 (run the base tree's bin/polispec from a second scratch worktree of 02b5146 for comparison),
      and still appends one judgment record per call.
  - id: A4
    check: >-
      A non-MCP call (Bash with a read-only line, a Write into a scratch live project's prod env) gives the same verdict
      level explain reports as the one pretool renders.
  - id: A5
    check: tty stdin, unknown harness and invalid JSON exit 2 with a message on stderr and nothing on stdout.
report:
  - The diff summary per file.
  - The exact commands and scratch environment used for A1 to A5, and each result.
  - Anything in judge or its callees that writes state or emits and that you had to guard beyond the four named sites.
