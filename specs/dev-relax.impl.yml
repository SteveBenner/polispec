schema: is.v1
metadata:
  name: polispec dev relax
  slug: dev-relax
  version: 0.1.0
  created: '2026-10-17'
  status: accepted
  base_commit: e93d7c8
  base_version: 0.29.0
  intended_release: 0.30.0
  contract: specs/app.yml#benign
  worker: {harness: claude-code, model: sonnet, effort: medium}
  changed_after_review:
    - 'The directory of every command the parser finds (Classify.command_cwds) must also be in development, so cd into a live project before a source line keeps the ask.'
    - 'dev_projects returns nil before any plane or ledger work unless some call is an opaque shell line, so ordinary calls pay nothing.'
    - 'The "unparseable line still asks" requirement holds for a line the parser extracts no command from; a malformed line that yields commands is parsed in the base too.'
vision:
  problem: >-
    Since 0.24.0 a governed line that runs eval, source or . adds the POLISPEC-TOOL-UNKNOWN ask, because the commands of a
    sourced file are invisible to the classifier. In the projects Sven develops (rllm, teach, reach, rdemo) the agents source
    env files they wrote themselves on nearly every task: 82 of the 86 asks since 0.28.3 in those four projects were source or
    . lines. Three of them are ledger projects with status onboarding ("listed but not enforced"), and rllm is not in the ledger
    yet, so the project is not enforced but the host-wide control ceiling asks anyway.
  outcome: >-
    A governed line that runs eval, source or . no longer asks when the working directory lies in a project that is in
    development, meaning every non-retired ledger project that contains the directory has status onboarding and the directory
    is not an env checkout. Live projects, nested live projects, test and stable checkouts, unowned paths and the lock edition
    behave exactly as in 0.29.0. Every relaxed call is stamped on its judgment record. polispec.relax.dev off restores 0.29.0.
  non_goals:
    - Relaxing any other POLISPEC-TOOL-UNKNOWN trigger (an unrecognised tool name, an unparseable shell line, Artifact, CronCreate, SubagentHandback and the like) or POLISPEC-MCP-UNDECLARED.
    - Relaxing a deny, POLISPEC-CONTROL-PROTECTION, the container root guard, a broken seal, an environment rule warn or any lock-edition verdict.
    - Any change to what the visible commands of the line classify as: the rest of the line is judged exactly as before.
    - Editing the ledger. The primary adds rllm to the ledger afterwards through plan ledger and apply ledger.
constraints:
  - Ruby standard library only. Keep the two-line header (shebang, SPDX) every lib file carries.
  - No comments or docstrings in code. No tests (AGENTS.md Part S). Verification is running this worktree's bin/polispec for real against scratch state.
  - Work only in this worktree (/home/sven/github/foss/.polispec-wt/dev-relax, branch dev-relax). Never touch the pinned runtime under rstack-uber/plugins/.pinned/polispec, ~/.ai, ~/.config/polispec, ~/.local/state/polispec, ~/.rplugins or the main clone ~/github/foss/polispec.
  - Every verification run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER and POLISPEC_GLOBAL to scratch paths in your scratch directory; never redirect XDG_STATE_HOME. A judgment record written to the real state home is a defect.
  - Do not commit, tag, push, install, pin or run rplugin. Leave the worktree modified and unstaged.
  - Do not edit specs/app.yml, CHANGELOG.md, VERSION, FEATURES.md, TODO.md, README.md, docs/, any manifest version, polispec.rplugin.yml or any *.impl.yml except where named below; the primary owns them.
  - Query codebase memory (project home-sven-github-foss-polispec) before grepping; re-index the worktree path first if its symbols are missing.
owns_paths:
  - lib/polispec/ledger.rb
shared_surfaces:
  - {path: lib/polispec/engine.rb, change: 'Settings gains RELAX_DEV_KEY and relax_dev?, written exactly like exceptions? (EXCEPTIONS_KEY, line 31 and 63 region)'}
  - {path: lib/polispec/commands/hook.rb, change: 'judge computes the development projects once, skips the opaque unknown in both branches, stamps relaxed; record_judgment adds relaxed'}
  - {path: schemas/judgment.v1.yml, change: 'optional top-level relaxed property'}
  - {path: polispec.rplugin.yml, change: 'setting polispec.relax.dev, one line beside polispec.exceptions (line 33 pattern)'}
slices:
  - id: relax
    depends_on: []
    deliverable: A governed eval, source or . line in a development project passes without the POLISPEC-TOOL-UNKNOWN ask and is stamped; everything else is unchanged.
    detail: |
      Read lib/polispec/ledger.rb whole (Ledger#locate, #project_for, and the private helpers roots, under?, canonical,
      env_checkout, worktree_root), lib/polispec/commands/hook.rb judge (lines 230-300), HookCommand#exceptions_active?,
      #stamp_exceptions and #record_judgment, Engine::Settings.exceptions? and its EXCEPTIONS_KEY, schemas/judgment.v1.yml
      and polispec.rplugin.yml (the polispec.exceptions line).

      1. Ledger#development(path) -> Array of project ids, or nil. Public method beside #locate. Steps:
           real = canonical(path); return nil when nil.
           live = projects.reject { |entry| entry.status == "retired" }
           return nil when any entry in live has env_checkout(entry, real) truthy (the path lies in a test or stable checkout or any checkout under envs_root).
           owners = live.select { |entry| roots(entry.repo).any? { |root| under?(real, root) } || worktree_root(entry, real) }
           return owners.map(&:id) when owners is non-empty and every owner has status "onboarding"; otherwise nil.
         A path owned by no project, by any live project, or by a mix returns nil. The method never raises on a missing repo directory (roots already tolerates it).

      2. Engine::Settings: add RELAX_DEV_KEY = "polispec.relax.dev" beside the other keys and
           def relax_dev?
             text(RELAX_DEV_KEY, "on").downcase != "off"
           rescue StandardError
             false
           end
         exactly in the style of exceptions? (a failing settings read means off, not on). The short env alias POLISPEC_RELAX_DEV must work through the existing Settings.text mechanism; verify it by running with it set.

      3. HookCommand#judge, in the existing order of statements:
           after `ledger = Ledger.load` and before the first unknown_action use, compute
             @dev_projects = dev_projects(ledger, cwd)
           where
             def dev_projects(ledger, cwd)
               return nil unless Engine::Settings.relax_dev?
               return nil if HarnessControls::Plane.requested_edition == "lock"
               ledger.development(cwd)
             rescue StandardError
               nil
             end
           (nil when the setting is off, when the requested edition is lock, when the ledger is empty or the path is not in development, and on any error; HookCommand#exceptions_active? shows the same rescue style). Reset @dev_projects = nil at the top of judge with the other per-call ivars.
           Branch A (the `actions.empty?` branch, line 247-251): extend the all? block of the unknown condition to
             Classify.benign?(tool, data, cwd) || Classify.parsed_shell?(tool, data, cwd) || (@dev_projects && Classify.opaque_shell?(tool, data, cwd))
           so a call that is only unknown because it is opaque is no longer unknown in a development project, while an unparseable line (opaque_shell? false) still adds the unknown action.
           Branch B (the `Classify.opaque_shell?` branch, line 252-254): add `&& !@dev_projects` to its condition.
           Stamp: set @relaxed = true only when @dev_projects is truthy and control_gate and governed and !diagnostic_read?(input.tool_name) and calls.any? { |tool, data| Classify.opaque_shell?(tool, data, cwd) } (compute it once, in a local, right after the two branches), then
             @judged["relaxed"] = [{ "rule" => "POLISPEC-TOOL-UNKNOWN", "reason" => "development", "projects" => @dev_projects }] when @relaxed.
           Do this stamping before groups = group(...) so it is set on every return path of judge, including the early return when the call is not governed after documents (a relaxed call is governed by construction, so that path needs nothing more). Do not stamp anything for a call that is not opaque, and none when the setting is off or the edition is lock.
           Do not change `unknown_action`, `exception_triggers`, `control_lifter` or the exceptions code. An opaque line that no longer carries the unknown action simply gives the control layer nothing to ask about.

      4. record_judgment: add `"relaxed" => judged["relaxed"]` to the record only when it is a non-empty Array, with the same .tap style as exceptions. Records without it must be byte-identical to 0.29.0 records.

      5. schemas/judgment.v1.yml: add the optional top-level property
           relaxed:
             type: array
             items:
               type: object
               additionalProperties: false
               required: [rule, reason, projects]
               properties:
                 rule: { const: POLISPEC-TOOL-UNKNOWN }
                 reason: { const: development }
                 projects: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
         following the file's dialect and indentation. judgments verify and validate judgment must still pass with and without the field.

      6. polispec.rplugin.yml: one settings line immediately after the polispec.exceptions line:
           - { key: polispec.relax.dev, type: enum, options: ["off", "on"], default: "on", scopes: [machine], description: "on lets a governed eval, source or . line pass without POLISPEC-TOOL-UNKNOWN when its working directory lies only in ledger projects with status onboarding (projects in development); off restores the ask. POLISPEC_RELAX_DEV overrides it only while unsealed." }
         Do not touch the version line (the primary bumps it).

      Behavior that must hold, and that you verify:
        - A line `source env.sh`, `. $B/env.sh`, `B=/tmp/x; . $B/env.sh; echo ok`, `eval "echo hi"` run with cwd inside an onboarding project's repo: no output (allow), judgment record carries relaxed with the project id, no exception proposal (proposals are made only on a warn).
        - The same lines with cwd inside a live project, in a path owned by no project, in an env checkout of an onboarding project (<envs_root>/<id>/test/...), in a nested layout where a live project contains the onboarding one's directory, and under edition lock: unchanged from 0.29.0 (ask or deny exactly as the base).
        - `source env.sh; git push origin main:stable` in an onboarding project: the push is still denied by the same rule as in 0.29.0 (the visible commands are judged as before). `eval "git push origin main:stable"` likewise.
        - An unknown tool name, an unparseable line and an undeclared MCP call in an onboarding project still ask.
        - polispec.relax.dev off (setting file and POLISPEC_RELAX_DEV=off): output and judgment record identical to the base tree's bin/polispec on the same inputs, apart from ids, digests, timestamps and engine fields.
        - A call from a retired project's directory is not in development (retired entries are not owners).
        - polispec explain on the same input reports the allowed answer and writes no judgment.
    acceptance: >-
      Build a scratch ledger with one onboarding project (a scratch git directory), one live project (another), a nested
      pair (live parent, onboarding child), and a scratch global.yml with a deny rule for git push to stable. Run the base
      tree (/home/sven/github/foss/polispec/bin/polispec, read-only) and this tree on the call matrix above through
      `hook pretool --harness claude`, each with its own scratch POLISPEC_STATE_HOME, and record both outputs.
acceptance:
  - id: A1
    check: The slice's behavior list, run for real, with the exact commands, scratch environment and observed output recorded in the report.
  - id: A2
    check: >-
      ruby -wc passes on every changed .rb file, bin/polispec validate judgment accepts a record with and without relaxed,
      bin/polispec judgments verify reports the chain ok on a scratch stream containing both kinds of record, and bin/polispec
      doctor on the scratch ledger reports nothing new.
report:
  - The diff summary per file.
  - The exact commands and scratch environment used for each check, and each result, including the base-versus-tree comparison.
  - Every place you deviated from this blueprint or could not do what it says, and why.
  - Anything you found in the touched code paths that writes state or changes output that this blueprint did not anticipate.
