schema: is.v1
metadata:
  name: plugin-declared ports in rplugin and the rllm author adapter
  slug: webapp-rplugin
  version: 0.1.0
  created: '2026-10-20'
  status: accepted
  parent: specs/webapp.impl.yml
  repos:
    rplugin: {path: /home/sven/.rplugin, remote: "git@bitbucket.org:paterasai/rplugin.git", base_version: 1.15.2, base_commit: a823c27, intended_release: 1.17.0}
    extensions: {path: /home/sven/.rplugin/extensions, remote: "git@bitbucket.org:paterasai/rplugin-extensions.git", base_commit: 8e15b12, base_catalogue: 2.6.3, intended_release: 2.7.0}
  worker: {harness: claude-code, agent: coding-worker, model: sonnet, effort: medium}
  decision_by_sven: "rplugin gains plugin-declared ports so a fleet or os extension can back a port a plugin owns; polispec declares author; the rllm adapter ships in the rstack extension (2026-10-20)."
vision:
  problem: "Rplugin::Ports::PORTS is a fixed list and Manifest#ports_error rejects any other name, so no extension can back a port a plugin defines, and polispec's author port could reach rllm only through a direct wire."
  outcome: "A manifest declares its own ports with a standalone class; extensions map adapters to them; Ports.for(plugin).<declared> resolves extension adapters first, then the plugin's standalone, through the same chain and fallback as built-in ports."
  non_goals: ["Changing any built-in port or its resolution order", "A generate port for every plugin"]
constraints:
  - "~/.rplugin is the live SDK every plugin on the host loads. Never edit it in place: work in a git worktree of each repo under /home/sven/bitbucket/paterasai/.rplugin-wt/declared-ports and /home/sven/bitbucket/paterasai/.rplugin-extensions-wt/author (branch declared-ports, author). Follow rplugin's own AGENTS.md and its release steps; the primary releases."
  - "Ruby standard library only; no comments in code; no tests beyond what rplugin's own check machinery already runs."
  - "APISAFE in the rllm adapter: a token bucket, bounded jittered retries, timeouts and the kill switch below."
design:
  manifest: "rplugin/v1 ports gains declared: [{name, standalone: {file, class}, summary}] with name matching ^[a-z][a-z0-9_]{1,30}$ and not a built-in port. specs/plugin.yml documents it. Manifest#ports_declared returns the list; ports_error accepts required and optional names that are built-in or declared; rplugin check reports a declared port whose standalone file is missing or whose class does not load."
  resolver: "Ports::Set defines a reader for each built-in port and each declared port of the plugin's manifest. adapter_classes(port) for a declared port: local extension adapters, then enabled fleet and os extension adapters whose extension.yml maps adapters[port] (Rplugin::Adapters::<CamelExt>::<CamelPort>), then the plugin's standalone (required from the plugin root, class constant from the manifest). A declared port with no adapter and no loadable standalone raises PortUnavailable as built-ins do."
  extension_schema: "specs/plugin-extension.yml adapters keys may name a declared port; rplugin doctor reports an adapter file that is absent, as for built-ins."
  compatibility: "A manifest without declared behaves exactly as in 1.15.2. polispec 0.34.0 lists ports.declared, which rplugin 1.15.2 rejects in check and install, so rplugin 1.17.0 is released and installed before polispec 0.34.0 is installed through rplugin; polispec's own runtime does not depend on it (it falls back to Author::Standalone when the port is absent)."
  rllm_adapter: "extensions/rstack/lib/author.rb, Rplugin::Adapters::Rstack::Author < Rplugin::Ports::Base, extension.yml adapters gains author: lib/author.rb. open(context) creates a conversation id; turn(session, text, &on_event) posts to rllm's chat endpoint for the authoring profile (read rllm's spec for the exact route, profile name and auth; the decide adapter's http.rb carries the base URL resolution: RLLM_URL, RSTACK_PORT_RLLM, RLLM_PORT, default 3090, RLLM_AUTH_TOKEN) with streaming when rllm offers it, else one response; emits delta and done events; close(session) drops the conversation. Bounds: 3 s connect, 120 s read, at most 2 jittered retries on 429, 5xx and network errors, a per-process bucket of 10 requests a minute, RPLUGIN_AUTHOR_DISABLED=1 raises PortUnavailable before any request. When rllm offers no suitable route, the adapter is not shipped and the slice reports it."
slices:
  - id: R1-declared-ports
    repo: rplugin
    owns_paths: [lib/rplugin/manifest.rb, lib/rplugin/ports.rb, lib/rplugin/check.rb, specs/plugin.yml, specs/plugin-extension.yml, docs/reference/ports.md, docs/guides/extending.md]
    acceptance:
      - "A scratch plugin with ports.declared [demo] and a standalone class: rplugin check passes; Ports.for(scratch).demo returns the standalone; a scratch local extension mapping demo wins over it"
      - "Every installed plugin's rplugin check and doctor output is unchanged (run from the worktree's bin against each)"
  - id: R2-rllm-author
    repo: extensions
    depends_on: [R1-declared-ports]
    owns_paths: [rstack/lib/author.rb, rstack/extension.yml, rstack/README or catalogue README row, CHANGELOG.md or changelog.d entry per the catalogue's convention]
    acceptance:
      - "With rllm unreachable (RLLM_URL=http://127.0.0.1:1) a turn raises PortUnavailable after the bounded retries, within 10 s; RPLUGIN_AUTHOR_DISABLED=1 raises before any request"
      - "A real turn against the running rllm only after Sven authorizes the call through the primary"
out_of_scope: ["Releasing, tagging, bumping the extensions pin in rplugin, installing: the primary does these in order rplugin 1.17.0, catalogue 2.7.0 pinned, then polispec"]
