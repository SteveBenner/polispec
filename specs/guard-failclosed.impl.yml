schema: is.v1
metadata:
  name: polispec fail-closed guard launcher, hook limits and unreachable gates
  slug: guard-failclosed
  version: 0.1.0
  created: '2026-10-20'
  status: accepted
  base_commit: 8c000fb
  base_version: 0.33.1
  intended_release: 0.33.2
  contract: "specs/app.yml#install/guard_binary, #harness_controls/failure, #harness_controls/input_bounds, commands status, digest, doctor"
  worker: {harness: claude-code, agent: coding-worker, note: "AGENTS.md Part T: the primary wrote this blueprint and verifies; the worker implements every slice"}
  decisions_by_sven:
    - "The launcher fails closed: when no well-formed reply comes back it denies every non-read tool; there is no fail-open toggle; recovery from a broken guard is the user's own ! prompt."
    - "Split release: the launcher, the deadline, HOOK_BUDGET, the input cap and gate_unreachable ship now as 0.33.2; shelf trust, MCP exec, protected state, doctor integrity and SECURITY.md follow 0.34.0."
    - "Hook input cap 8 MiB; above it the call is denied with a reason that names the size."
    - "gate_unreachable is report-only: a blocking doctor finding, a status finding, a validate error and a plan note; promote and deploy behave as today."
vision:
  problem: >-
    bin/polispec-guard lets a call through whenever polispec gives no verdict. A missing binary, any nonzero exit other than
    the 0.33.1 Hermes pass-through, a crash, or a hook killed by the harness at its 10 s timeout all end in the inline fallback,
    which denies only Bash, shell and exec_command lines shaped like a push to test or stable, systemctl or gh release, and
    allows everything else (Hermes terminal calls, every Write and Edit, MCP). The shim has no deadline of its own, so a stuck
    judgments.lock or a slow host runs into the harness timeout, which the harness treats as a non-blocking hook error. The
    Ruby hook caps its input at 64 KiB, so any larger Write is denied as "guard unavailable" (29 such denials on this host since
    2026-10-16). And a policy whose promotion gate needs a deploy in an environment without a deploy: block can never promote
    to stable, which nothing reports (rdemo, rllm and polispec itself until today; the environment-control distributed variant
    generates exactly that).
  outcome: >-
    The launcher passes every well-formed reply through, and otherwise denies a non-read pretool call with the same bytes and
    exit status the Ruby hook's FIXED_DENIALS use for that harness, records the denial in launcher.jsonl with bash builtins,
    and stops waiting after 8 s. Read tools still pass when the guard is down. HOOK_BUDGET is 7 s so the Ruby hook answers
    inside the launcher deadline. The input cap is 8 MiB with its own denial reason. A new Gates.unreachable_errors feeds a
    gate_unreachable finding to doctor, status, validate and plan, and the distributed variant gains deploy blocks.
  non_goals:
    - Any change to the fast path, the binary search order, the session hook, or any verdict the Ruby hook gives when it runs.
    - Making promote or deploy refuse an unreachable gate.
    - Global shelf trust, MCP exec declarations, protected state paths, pause validation, doctor integrity, SECURITY.md (next release).
constraints:
  - Ruby standard library only; bash for the launcher (no jq, no python). Keep the two-line header (shebang, SPDX) every lib and bin file carries.
  - No comments or docstrings in code (AGENTS.md Part Q). The only new test material is the smoke scenarios named below; smoke is the product's own test machinery.
  - Work only in /home/sven/github/foss/.polispec-wt/hardening (branch hardening). Never touch the pinned runtime, ~/.ai, the live clone /home/sven/github/foss/polispec, the real ledger, shelf, settings or ~/.local/state/polispec.
  - Every verification run sets POLISPEC_STATE_HOME, POLISPEC_LEDGER, POLISPEC_HOME and POLISPEC_GLOBAL to scratch paths under /home/sven/.cache/claude-code-tmp/claude-1000/-home-sven-github-foss-polispec/aba09858-e7e1-42eb-a7ea-8545ae9abc35/scratchpad/worker; never redirect XDG_STATE_HOME.
  - The root filesystem is nearly full; keep scratch output small and put smoke --out under that scratch directory.
  - Never send a real tool call through a harness. Drive the launcher with JSON on stdin only.
  - Back up in place before deleting anything (AGENTS.md Part E); nothing in this change deletes a file.
surfaces:
  code:
    - bin/polispec-guard (fail-closed reply handling, deadline, read-tool pass set, launcher.jsonl, harness name normalisation)
    - lib/polispec/commands/hook.rb (INPUT_LIMIT, HOOK_BUDGET, the oversize denial)
    - lib/polispec/operator/gates.rb (unreachable_errors)
    - lib/polispec/commands/doctor.rb (gate_unreachable finding)
    - lib/polispec/commands/status.rb (gate_unreachable finding)
    - lib/polispec/cli.rb (validate policy reports unreachable gates)
    - lib/polispec/plan.rb (plan project:<id> prints unreachable gates as notes)
    - lib/polispec/policy_source.rb (memoize, and resolve through an open memo)
  contract:
    - packages/environment-control/package.yml (version 1.1.0)
    - packages/environment-control/variants/distributed/environments.yml (deploy blocks)
  doc:
    - docs/operator.md (the guard shim bullets, the doctor finding list, the input bound)
  test_machinery:
    - smoke/scenarios/guard-failclosed.yml (new)
    - smoke/scenarios/gate-unreachable.yml (new)
  fleet: []
design:
  launcher:
    harness_names: "After parsing --harness: claude-code becomes claude (as today) and deepseek-tui becomes deepseek."
    input: "Read stdin with head -c 8388609 instead of cat, so the Ruby hook sees at most one byte past its cap and the shell never holds more."
    read_tools: "A bash array of the lower-cased names in Polispec::Harness::Base::READ_TOOLS (read notebookread read_file view grep search_file_content read_many_files view_image). The tool name comes from the same \"tool_name\" regex the fast path uses, lower-cased. A pretool call is a read call when that name is in the array. Add an undocumented argument --read-tools that prints the array one name per line and exits 0, for the parity check."
    deny: "A function deny_unavailable <cause>. In pretool mode for a non-read call it prints, for the normalised harness, exactly FIXED_DENIALS[harness][0] from lib/polispec/commands/hook.rb (the same JSON with the same reason text and the trailing newline) and exits with FIXED_DENIALS[harness][1]; for a harness name not in claude codex hermes pi deepseek antigravity it writes '[POLISPEC internal] guard unavailable; call denied.' to stderr and exits 2. For a read call it exits 0 with no stdout. In session mode it exits 0 with no stdout. Before exiting it appends one line to $state/launcher.jsonl with bash builtins only, the way skip() writes skips.jsonl: ts, tool, session, harness, mode, cause, and decision (deny or pass). The old fallback function, its reason text and its regex are removed."
    causes: "no_binary (no usable polispec found), timeout (the deadline expired), exit_<rc> (any exit status that is not 0 and not the Hermes pass-through), empty_output_exit_2 is not a separate cause: rc 2 without a leading { is exit_2."
    replies: "rc 0: print stdout when non-empty and exit 0 (unchanged). rc 2 with stdout starting with { in pretool mode: print it and exit 2 (unchanged, any harness). Anything else: deny_unavailable exit_<rc>. A missing binary: deny_unavailable no_binary. Stderr of polispec stays discarded."
    deadline: "Run the hook under an 8 s deadline (POLISPEC_GUARD_DEADLINE overrides it, an integer from 1 to 9; anything else keeps 8). When timeout(1) is on PATH use timeout -k 1 <deadline>; exit statuses 124, 137 and 143 are the timeout cause. Without timeout(1), use a bash watchdog: start the hook in the background with its stdout captured, start a watchdog that sleeps the deadline and then kills the hook, with the watchdog's own stdout and stderr on /dev/null so the command substitution never waits on it, wait for the hook, then kill the watchdog. Either way a normal call must not wait for the deadline and must leave no process behind once the launcher exits, except a watchdog sleep that ends by itself within the deadline."
    session_mode: "Session mode keeps its current non-blocking behaviour: any failure exits 0 with no stdout, and it logs to launcher.jsonl like pretool."
  hook_rb:
    budget: "HOOK_BUDGET = 7.0"
    input_limit: "INPUT_LIMIT = 8_388_608. bounded_input raises a new Polispec::InputTooLarge (a subclass of Polispec::Error, defined beside Polispec::Error) when the input passes the cap."
    oversize_reply: "hard_deny keeps FIXED_DENIALS byte for byte for every other error. For InputTooLarge it writes the same per-harness JSON with the reason '[POLISPEC internal] hook input exceeds 8 MiB; call denied. Split the change into smaller calls.' in place of '[POLISPEC internal] guard unavailable; call denied.', with the same exit status. Build it by substituting the reason inside the FIXED_DENIALS bytes, so the shapes cannot drift. record_failure still records it (error class Polispec::InputTooLarge)."
  gates:
    function: "Gates.unreachable_errors(policy) returns a list of messages, empty when the policy is not a Hash or has no promotion Hash."
    gate_check: "For each promotion hop to_<hop> whose config is a Hash: the hop's gates are its listed gates, plus, for hop stable, the implicit G-TESTED (builtin sha_ran_on) and G-FREEZE that effective_gates adds when no listed gate has the same builtin alias (reuse effective_gates' rule; factor a policy-level helper rather than duplicating the list). For each gate whose builtin is sha_ran_on, sha_ran_on_test or soaked, take its env as gate_env_name would (env, default test; sha_ran_on_test is always test), map it with env_key, and skip names gate_env_name rejects (env_names_errors reports those). When policy environments has no Hash for that key, or its deploy is not a Hash, add: \"promotion to_<hop>: gate <id> needs a passing <env> deploy, but environment <env> declares no deploy; the gate can never pass\"."
    after_check: "For each after entry of each hop: split it with Shellwords; when the words are polispec, deploy, a project word and an env word, map the env with env_key; when that environment has no deploy Hash add: \"promotion to_<hop>: after step '<entry>' deploys <env>, which declares no deploy; the step fails no_deploy\"."
    wiring:
      doctor: "check_project adds one finding of kind gate_unreachable per message, unless the policy source is defaults, after health_required. It is blocking (no info severity)."
      status: "describe's finding becomes loaded.finding || semantic_finding || unreachable_finding, where unreachable_finding is {kind gate_unreachable, detail messages joined with '; '} or nil, and is skipped for the defaults source."
      validate: "CLI::Validate#semantic_errors for kind policy adds each message as Schema::Error.new('/promotion', message)."
      plan: "plan project:<id> computes unreachable_errors on the proposed policy and shows them under a notes heading in text output and a notes array in --json. Notes never change the classification, the plan id or needs_confirm."
      untouched: "load_project, promote, deploy and gate_health_required do not call it."
  package:
    distributed: "packages/environment-control/variants/distributed/environments.yml gains, for test and for prod, exactly the deploy block the service variant has: deploy: {steps: [\"true\"], health: {run: polispec-placeholder-health-check-replace-it-in-specs-polispec-environments-yml}}, placed where the service variant places it."
    version: "packages/environment-control/package.yml version 1.1.0."
  policy_memo:
    problem: "Measured on the host 2026-10-20: one Bash pretool call composed policies 2,101 times (1,325 from Engine Atlas#lookup at engine.rb:723, whose @policies cache lives per Atlas, and 776 from Envs.spec_owner at engine.rb:402, which has no cache), about 4.4 ms each, so the 0.33.1 hook hit its 9.5 s budget and failed closed on an ordinary dev command; a five-token command composed 1,570 times. Nine compositions (one per ledgered project) would do."
    scope: "PolicySource.memoize { ... } opens a memo for the current thread (Thread.current[:polispec_policy_memo]); nested calls reuse the open memo; the ensure restores the previous value, so nothing persists past the block. HookCommand#run wraps its whole body (pretool and session) in it. No other command uses it."
    key: "PolicySource.resolve, when a memo is open, keys on [project.id, project.repo, project.trust_ref, project.policy] and stores the Loaded it computed. Without an open memo, resolve behaves exactly as today."
    copies: "Every hit returns a new Loaded whose policy is Marshal.load(Marshal.dump(stored.policy)) (measured 0.12 ms against 4.7 ms for a composition), with the same source, digest and finding, so no caller can mutate another caller's policy."
    side_effects: "remember_environments and the fallback's events run once per key per hook call instead of once per resolve; nothing else changes. Verdicts, reasons, judgment records and rendered bytes stay identical."
  scenario_fixes:
    versions: "smoke/scenarios/status-digest-doctor.yml (lines 17, 134 and 139) and smoke/scenarios/plan-apply.yml (lines 45 and 50) expect environment-control 1.0.0; they expect 1.1.0."
    widget_example: "examples/environments.widget.yml gains a deploy block for test and for prod, placed where the service variant places it: test deploy: {steps: [\"bin/setup\"], health: {run: \"bin/widget doctor\"}}; prod the same. validate.yml's every-example step then passes with no /promotion error."
slices:
  - id: launcher
    owns_paths: [bin/polispec-guard]
    deliverable: the launcher design above
    acceptance: "bash -n bin/polispec-guard; a normal call through the launcher with POLISPEC_BIN set to this tree's bin/polispec gives byte-identical stdout and exit status to before for a Claude Code allow, a Claude Code deny and a Hermes deny; median wall time of 20 normal calls is within 20 ms of the same tree with the 0.33.1 launcher (git show 8c000fb:bin/polispec-guard)"
  - id: hook-limits
    owns_paths: [lib/polispec/commands/hook.rb]
    deliverable: HOOK_BUDGET, INPUT_LIMIT, InputTooLarge and the oversize reply
    acceptance: "ruby -wc; a 70 KiB Write is judged normally; a 9 MiB Write is denied with the size reason for claude and hermes; every other hard_deny output is byte-identical to before"
  - id: gates
    owns_paths: [lib/polispec/operator/gates.rb, lib/polispec/commands/doctor.rb, lib/polispec/commands/status.rb, lib/polispec/cli.rb, lib/polispec/plan.rb]
    deliverable: unreachable_errors and its four call sites
    acceptance: see verification
  - id: package
    owns_paths: [packages/environment-control/package.yml, packages/environment-control/variants/distributed/environments.yml]
    deliverable: the distributed deploy blocks and version 1.1.0
    acceptance: "bin/polispec validate environments on the rendered distributed file is ok; a scratch apply environment-control --variant distributed produces a policy for which unreachable_errors is empty"
  - id: smoke-and-docs
    owns_paths: [smoke/scenarios/guard-failclosed.yml, smoke/scenarios/gate-unreachable.yml, docs/operator.md]
    depends_on: [launcher, hook-limits, gates, package]
    deliverable: two scenarios and the operator doc updates
    scenarios:
      guard-failclosed: "unit commands/hook pretool|session, fixture like smoke/scenarios/guard-shim.yml. Steps: (1) a failing binary: write a script into {{files}} that exits 1, point POLISPEC_BIN at it, and for each of claude, claude-code, codex, hermes, antigravity, pi, deepseek and deepseek-tui send a Bash (or Hermes terminal) call through {{tree}}/bin/polispec-guard pretool --harness <h>: expect the FIXED_DENIALS bytes and status for that harness; (2) the same failing binary with a Read call: exit 0 and no stdout; (3) a binary that sleeps 20 s with POLISPEC_GUARD_DEADLINE=2: the Bash call is denied within the step timeout; (4) parity: one step that runs sh -c comparing {{tree}}/bin/polispec-guard --read-tools with the lower-cased Polispec::Harness::Base::READ_TOOLS printed by ruby -I{{tree}}/lib, exit 0 only when they are equal; (5) parity of bytes: for each harness, the deny the launcher prints for a failing binary equals what {{polispec}} hook pretool --harness <h> prints for an invalid payload (an empty JSON object), compared inside one sh -c step; (6) an unknown harness name: exit 2, stderr names the guard unavailable; (7) session mode with the failing binary: exit 0, no stdout; (8) a 70 KiB Write through the launcher with the real binary is not denied as unavailable, and a 9 MiB Write is denied with 'hook input exceeds 8 MiB'. Every step that expects a deny also checks that {{scratch}}/state/launcher.jsonl (the fixture's POLISPEC_STATE_HOME; placeholders are scratch, home, files, global, ledger, polispec, tree, out, project.<id> and checkout.<id>.<env>) gained a line with the cause."
      gate-unreachable: "unit commands/status, digest, doctor, fixture with one live project whose committed environments.yml lacks deploy blocks while its policy has the package after steps: doctor reports gate_unreachable twice-or-more naming to_stable G-TESTED and the after steps, exit 1; status --json carries finding kind gate_unreachable; validate policy on that file exits 1 naming /promotion; promote --to test --dry-run still runs its gates as before (exit and gate lines unchanged); after the project gains deploy blocks the finding disappears."
    docs: "docs/operator.md: replace the shim bullet 'when polispec is missing or fails, denies shell calls that push...' with the fail-closed behaviour (non-read denied with the harness's fixed reply, reads pass, 8 s deadline, POLISPEC_GUARD_DEADLINE, launcher.jsonl); add gate_unreachable to the doctor findings it lists; note the 8 MiB hook input bound where hook limits are described (add one sentence if none is)."
  - id: policy-memo
    owns_paths: [lib/polispec/policy_source.rb, lib/polispec/commands/hook.rb, smoke/scenarios/policy-memo.yml]
    deliverable: the policy_memo design above and a new scenario
    scenario: "policy-memo.yml, unit commands/hook pretool|session, a fixture with at least four live projects. Step 1: one sh -c step runs ruby -I{{tree}}/lib with a script that prepends a counter onto Polispec::Layers.compose, feeds HookCommand (as trace probes do: $stdin = StringIO of the payload, Polispec::CLI.run(%w[hook pretool --harness claude])) a Bash call whose command names at least twenty absolute paths, half inside fixture checkouts and half outside every project, and exits 0 only when compose ran at most once per ledgered project and the verdict printed is the same as step 2's. Step 2: the same payload through {{polispec}} hook pretool --harness claude gives the expected verdict. Step 3: two consecutive hook calls in two processes both compose (the memo does not persist between calls)."
    acceptance: "ruby -wc; the slow and short probe commands in the primary's scratch (codex-verify/slow-command.txt and short-command.txt), judged in-process by codex-verify/trace-hook.rb against this tree with POLISPEC_STATE_HOME scratch and the real ledger read-only, finish in under 1 s each with resolve misses at most 9; every hook-unit scenario still passes"
  - id: scenario-fixes
    owns_paths: [smoke/scenarios/status-digest-doctor.yml, smoke/scenarios/plan-apply.yml, examples/environments.widget.yml]
    deliverable: the scenario_fixes design above
    acceptance: "status-digest-doctor, plan-apply and validate pass; the full suite passes"
verification:
  launcher_matrix: "The primary runs, for every harness name above and for causes no_binary (launcher copied alone into a scratch dir with PATH=/usr/bin:/bin and HOME scratch), exit_1, exit_3, timeout and rc 0 with empty stdout: a Bash call, a Write, an MCP call and a Read. Expected: every non-read call denied with FIXED_DENIALS bytes and status, every Read passes, rc 0 empty stdout is an allow, launcher.jsonl has one line per denied or passed failure."
  replies_unchanged: "Fifty recorded hook payload shapes from smoke/scenarios/*.yml hook steps, sent through the 0.33.1 launcher and the new one with POLISPEC_BIN=this tree's bin/polispec: identical stdout and exit status."
  input: "70 KiB and 2 MiB Writes judged normally (allow or the rule the content's path gets); 9 MiB denied with the size reason; the 64 KiB-era denial no longer appears."
  gates_on_host: "bin/polispec doctor from this tree against the host's real ledger and shelf, read-only, with POLISPEC_STATE_HOME scratch: gate_unreachable for rdemo, rllm (to_stable G-TESTED and both after steps), rassessments, personal-website and predict (the stable after step), and none for polispec, teach or reach."
  smoke: "bin/polispec smoke run --against /home/sven/.rplugins/polispec --no-record and --against an unmodified clone at 8c000fb: every scenario passes; list every diff that is not the runtime kind, a commit, a path, an id, the version or the new scenarios."
  checks: "ruby -wc on every changed .rb; bash -n on the launcher; YAML load on every changed .yml; ~/.rplugin/bin/rplugin check on the worktree (directory-name and .rproject findings are known)."
out_of_scope:
  - Committing, tagging, version bumps, CHANGELOG, FEATURES, README and specs/app.yml; the primary does those after verification
  - Every item of the next hardening release
  - Codex config, Claude Code settings and any installed hook on the host
